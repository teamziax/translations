scenarios_musical.musical_tasks.name=音楽に関するタスク
scenarios_musical.musical_tasks.description=一定時間ごとにタスクが追加されます。タスクをクリアするのが最後だと脱落です
scenarios_musical.musical_tasks.overview=この後一連のタスクが{task}個表示されます。各タスクには{duration}間の制限時間があります。脱落しないためには他のプレイヤーよりも先にタスクをクリアする必要があります。最後にタスクをクリアしたプレイヤーは負けます。
scenarios_musical.musical_tasks.starting_task=タスク: {task}
scenarios_musical.musical_tasks.failed_to_complete=タスクをクリアできなかったため脱落しました！
scenarios_musical.musical_tasks.last_to_complete=あなたは最後にタスクをクリアしたプレイヤーでした！
scenarios_musical.musical_tasks.completed=タスクをクリアしました！
scenarios_musical.break_blocks.name=壊れるブロック
scenarios_musical.break_blocks.description={blocks}個のブロックをできるだけ速く破壊してください。最後に破壊したプレイヤーは負けます！
scenarios_musical.drop_items.name=アイテムドロップ
scenarios_musical.drop_items.description={item}個のアイテムをできるだけ速くドロップしてください。最後に規定数をドロップしたプレイヤーは負けます！
scenarios_musical.jump.name=ジャンプ
scenarios_musical.jump.description=できるだけ速くジャンプを{jump}回してください。最後にクリアしたプレイヤーは負けます！
scenarios_musical.move_blocks.name=ブロックを渡る
scenarios_musical.move_blocks.description=できるだけ早く少なくとも{blocks}ブロック移動しましょう。達成するのが最後だったプレイヤーは負けです！
scenarios_musical.sneak.name=スニーク
scenarios_musical.sneak.description=できるだけ早くスニークを{sneaks}回してください。最後に達成した場合は負けます！
scenarios_musical.stand_still.name=動かないで
scenarios_musical.stand_still.description=できるだけ早く{duration}間移動しないでください。最後に達成すると負けます！
scenarios_musical.crazy_items.name=狂ったアイテム
scenarios_musical.crazy_items.description=使用可能な狂ったアイテムを受け取ります！
