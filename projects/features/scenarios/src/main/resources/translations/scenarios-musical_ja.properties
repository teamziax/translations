scenarios_musical.crazy_items.player_swapped_with_you={player}があなたと位置を交換しました！
scenarios_musical.crazy_items.cannot_use_during_grace=猶予期間中はこのアイテムを使用できません！
scenarios_musical.crazy_items.no_players_to_swap=スワップ先のプレイヤーがいませんでした！
scenarios_musical.hacker_tools.name=ハッカーツール
scenarios_musical.hacker_tools.description=アイテムがハックを使えるようになった！全てのアイテムに特別なアビリティーが付与されました！
