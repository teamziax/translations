scenarios_musical.musical_tasks.name=音乐任务
scenarios_musical.musical_tasks.description=你将会定时收到任务。最晚完成任务的玩家将被淘汰。
scenarios_musical.musical_tasks.overview=你很快将获得一系列总计 {tasks} 个任务。每个任务都有 {duration} 的时间去完成。比其他玩家更快完成任务才能活下来。最后完成任务的玩家将淘汰。
scenarios_musical.musical_tasks.starting_task=任务：{task}
scenarios_musical.musical_tasks.failed_to_complete=你因未能完成任务而被淘汰！
scenarios_musical.musical_tasks.last_to_complete=你是最后完成任务的玩家！
scenarios_musical.musical_tasks.completed=你完成了该任务！
scenarios_musical.break_blocks.name=破坏方块
scenarios_musical.break_blocks.description=尽快破坏 {blocks} 方块。最后破坏所有方块的玩家失败！
scenarios_musical.drop_items.name=丢弃物品
scenarios_musical.drop_items.description=尽快丢弃 {items} 物品。最后丢弃指定数量物品的玩家失败！
scenarios_musical.jump.name=跳跃
scenarios_musical.jump.description=尽快跳跃 {jumps} 次。最后跳跃足够次数的玩家失败！
scenarios_musical.move_blocks.name=移动方块
scenarios_musical.move_blocks.description=尽快移动至少 {blocks} 个方块。最后移动足够数量方块的玩家失败！
scenarios_musical.sneak.name=潜行
scenarios_musical.sneak.description=尽快潜行 {sneaks} 次。最后潜行足够次数的玩家失败！
scenarios_musical.stand_still.name=静止不动
scenarios_musical.stand_still.description=尽快静止不动 {duration}。最后达成的玩家失败！
scenarios_musical.crazy_items.name=疯狂的物品
scenarios_musical.crazy_items.description=你将获得各种疯狂的道具来使用！
scenarios_musical.crazy_items.swapped_with_player=你与 {player} 交换了位置！
scenarios_musical.crazy_items.player_swapped_with_you={player} 与你交换了位置！
scenarios_musical.crazy_items.cannot_use_during_grace=在缓冲期内不能使用该物品！
scenarios_musical.crazy_items.no_players_to_swap=没有可以交换的玩家！
scenarios_musical.hacker_tools.name=黑客工具
scenarios_musical.hacker_tools.description=你现在是黑客！你所有的工具均有特殊能力！
