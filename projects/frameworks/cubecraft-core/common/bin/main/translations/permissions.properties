# JAVA ONLY - Message shown when a player tries to do something they don't have permission for and the permission is tied to a permanent rank.
permissions.no_permission.java=You must have {rank} to do this!
# JAVA ONLY - Message shown when a player tries to do something they don't have permission for and the permission is tied to a subscription rank.
permissions.no_permission.java_subscription=You must have an active {rank} subscription to do this!
# JAVA ONLY - Generic message directing players to the store to purchase a rank.
permissions.no_permission.java_purchase=You can purchase a rank on the {store}.
# JAVA ONLY - Message shown when a player tries to do something they don't have permission for and the permission is tied to a permanent rank, including a link to the store.
permissions.no_permission.java_requires_purchase_link=Requires {rank} rank, which can be purchased at {store_link}.
# JAVA ONLY - Message shown when a player tries to do something they don't have permission for and the permission is tied to a subscription rank, including a link to the store.
permissions.no_permission.java_subscription_requires_purchase=Requires an active {rank} subscription, which can be purchased from the {store}.
# BEDROCK ONLY - Message shown when a player tries to do something they don't have permission for and the permission is tied to a permanent rank.
permissions.no_permission.bedrock=You must have {rank} to do this! You can purchase ranks in the <gold>Microsoft Store</gold>.
# BEDROCK ONLY - Message shown when a player tries to do something they don't have permission for and the permission is tied to a subscription rank.
permissions.no_permission.bedrock_subscription=You must have an active {rank} pass to do this! You can purchase passes in the <gold>Microsoft Store</gold>.
# BEDROCK ONLY - Message shown when a player tries to do something they don't have permission for and the permission is tied to an unspecified subscription rank.
permissions.no_permission.bedrock_subscription_unspecified=You must have an active pass to do this! You can purchase passes in the <gold>Microsoft Store</gold>.
# BEDROCK ONLY - Message shown when a player tries to do something they don't have permission for and the permission is tied to a VIP level.
permissions.no_permission.vip_level=You must have a VIP Level of at least {level} to do this!
# Message shown when a player has no permission for a command
permissions.no_permission.command=You do not have permission to execute this command!
# Message shown when a player has no permission to see the plugin list
permissions.no_permission.plugins=You do not have permission to see our plugin list! The plugins that we use on our network are mostly custom and are unavailable for download.
