# NOTE: indefinite article forms for an unnamed killer (a mob or custom entity). English picks by initial
# sound; languages without indefinite articles should make both values identical.
deathmessages.fragment.entity_a=a {name}
deathmessages.fragment.entity_an=an {name}
deathmessages.fragment.pet={name}'s pet {type}
deathmessages.fragment.pet_named={name}'s pet {type}, {pet}

deathmessages.reward.kill=You killed {player}
deathmessages.reward.kill_points_reason=You killed {player}.
deathmessages.reward.assist=Kill assist
deathmessages.reward.assist_points_reason=You assisted in killing {player}.
deathmessages.reward.points_gained.singular=+{points} point
deathmessages.reward.points_gained.plural=+{points} points
deathmessages.reward.assist_count.singular=+{assists} assist
deathmessages.reward.assist_count.plural=+{assists} assists
deathmessages.reward.killer_lore=Killer:
deathmessages.reward.assists_lore=Assists:
