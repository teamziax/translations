entities.quests.halloween.hub_hunt=Kürbisjagd
entities.quests.halloween.hub_hunt_bedrock=Süßes-oder-Saures-Jagd
entities.quests.halloween.dialogue_halloween_hunt_complete=Großartig! Du hast alle Kürbisse gefinden. Viel Spaß mit deinem neuen Kürbis-Hut!
entities.quests.halloween.dialogue_halloween_hunt_introduction=In dieser Grusellobby sind 20 Kürbisse versteckt. Finde alle und erhalte eine Belohnung. Aber hüte dich vor dem Knarz, behalte ein Auge auf ihm!
entities.quests.halloween.dialogue_halloween_hunt_complete_bedrock=Großartig! Du hast alles Süße & Saure gefunden. Viel Spaß mit dem neuen Grusel-Siegeseffekt!
entities.quests.halloween.dialogue_halloween_hunt_introduction_bedrock=In dieser Lobby sind 30 Süßes-oder-Saures-Gegenstände versteckt. Manche sind süß, manche sind schaurig – finde alle für eine Belohnung. Hüte dich vor dem Knarz, behalte ein Auge auf ihm!
entities.quests.snowman.hub_hunt=Schneemann-Jagd
entities.quests.christmas.dialogue_snowman_hunt_centre_introduction=Frohe Weihnachten! Ich brauche mal wieder deine Hilfe. Hinter dem Spawn befindet sich ein unfertiger Schneemann. Finde alle 20 Schneemann-Teile in der Lobby und hilf dabei, ihn zu errichten. Wenn du es schaffst, erhältst du eine Belohnung! - Viel Glück.
entities.quests.christmas.dialogue_snowman_hunt_centre_complete=Du hast alle Schneemann-Teile gefunden, gut gemacht! - Wir sehen uns beim nächsten Mal.
entities.quests.christmas.dialogue_snowman_hunt_snowman_introduction=Hey, dieser Schneemann muss vollendet werden. Finde alle 20 Schneemann-Teile in der Lobby und hilf dabei, ihn zu errichten. Du kannst zurückkommen und mich ansprechen, um den Baufortschritt des Schneemanns zu aktualisieren. Viel Glück!
entities.quests.christmas.dialogue_snowman_hunt_snowman_complete=Du hast es geschafft! Der Schneemann ist vollständig errichtet. Gut gemacht, viel Spaß mit deinem kostenlosen Schneemann-Hut!
entities.quests.christmas.dialogue_snowman_hunt_snowman_complete_bedrock=Du hast es geschafft! Der Schneemann ist vollständig errichtet. Gut gemacht, viel Spaß mit deinem kostenlosen Weihnachtsmann-Hut!
entities.quests.christmas.dialogue_snowman_hunt_throughoutlobby_incomplete=Auf geht's, halte weiterhin Ausschau nach Schneemann-Teilen. Er baut sich nicht von selbst zusammen!
entities.quests.christmas.dialogue_snowman_hunt_throughoutlobby_complete=Gute Arbeit beim Bau dieses Schneemanns!
