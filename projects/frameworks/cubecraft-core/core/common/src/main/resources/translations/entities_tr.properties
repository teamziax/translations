entities.quests.christmas.dialogue_snowman_hunt_centre_introduction=Mutlu Noeller! Sana yine ihtiyacım var. Başlangıç alanının arkasında, tamamlanmamış bir Kardan Adam göreceksin. Lobideki 20 Kardan Adam parçasını bul, ve onu inşa etmeye yardım et. Eğer başarırsan, bir ödül kazanacaksın! - Bol şans.
