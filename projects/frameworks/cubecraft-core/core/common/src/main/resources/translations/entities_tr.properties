entities.quests.christmas.dialogue_snowman_hunt_snowman_introduction=Merhaba, bu Kardan Adam'ın tamamlanması gerekiyor. Lobideki 20 Kardan Adam parçasını bul, ve onu inşa etmeye yardım et. Kardan Adamın yapım aşamasını güncellemek için geri gelip benimle konuşabilirsin. Bol şans!
entities.quests.christmas.dialogue_snowman_hunt_snowman_complete=Başardın! Kardan Adam tamamen inşa edildi. Tebrikler, ücretsiz Kardan Adam Şapkanın tadını çıkar!
entities.quests.christmas.dialogue_snowman_hunt_snowman_complete_bedrock=Başardın! Kardan Adam tamamen inşa edildi. Tebrikler, ücretsiz Noel Baba Şapkanın tadını çıkar!
entities.quests.christmas.dialogue_snowman_hunt_throughoutlobby_incomplete=Hadi ama, Kardan Adam parçalarını aramaya devam et. Kendi kendini inşa etmeyecek!
entities.quests.christmas.dialogue_snowman_hunt_throughoutlobby_complete=Kardan Adamı inşa etmekte harika bir iş çıkardın!
