game.description.battle_arena=Battle Arena is a collection of PvP games where you can play modes such as Free For All and Duels. Click below to learn more about each game mode!
game.description.bedwars=Battle to destroy each other's beds while protecting your own. When your bed breaks, you can no longer respawn! So balance your clever defence and aggressive attacks! Oh, and remember to visit the item and upgrades shop.
game.description.beta_games=Beta Games is a collection of games that are still in development. These games are not yet fully released, but you can play them to help us test and improve them. Click below to learn more about each game!
game.description.blockwars=BlockWars is a team-based PvP game where you can play different game modes, such as Capture the Flag, Bridges and Destroy the Core. Click below to learn more about each game mode!
game.description.blockwars.bridges=Score points by jumping into the enemy's portal while defending your own from attackers! Quick building, sharp combat skills and teamwork are key to winning.
game.description.blockwars.capture_the_flag=Steal the enemy's flag and return it to your base while protecting your own. Balance offence and defence to claim victory.
game.description.blockwars.destroy_the_core=Mine and break the enemy cores while protecting your team's cores! Be offensive or defensive; you will need to build and craft to win!
game.description.blockwars.giga=BlockWars Giga is an amplified version of BlockWars, featuring larger maps and more players. You can play different game modes, such as Capture the Flag, Bridges and Destroy the Core. Click below to learn more about each game mode!
game.description.blockwars.team_deathmatch=Dominate the battlefield and work with your team to reach the kill goal. Eliminate the most players possible to win the game!
game.description.disasters=A set of random and crazy disasters occurs throughout the game. Be one of the last players standing to win!
game.description.duels=Fight alongside other players or friends in intense battles. Play either regular duels for the classic experience or overpowered for more chaotic fun!
game.description.duels.1v1=1v1
game.description.duels.1v1.fight=Click to fight in a 1v1.
game.description.duels.2v2=2v2
game.description.duels.2v2.fight=Click to fight in a 2v2.
game.description.duels.info=You can duel friends privately with /duel or invite them to a party!
game.description.duels.mode=Select Mode
game.description.duels.requests=Click to view your requests.
game.description.eggwars=Battle to destroy each other's life-giving eggs while protecting your own. If your egg breaks, you can no longer respawn! Use your cunning strategies and nerves of steel to emerge victorious! Oh, and remember to visit the shop.
game.description.free_for_all=It's everyone for themselves in a furious battle to determine who is the strongest! Choose a kit, side with your friends and then betray them before they betray you. Only the strongest will survive!
game.description.game_duels=Pick from popular CubeCraft Games to 1v1 other players in!
game.description.lucky_games=Lucky Games is a collection of games that involve luck to be on your side. Click below to learn more about each game!
game.description.lucky_islands=Battle other CubeCrafters to break Lucky Blocks to receive random items, helpful or harmful. Will you get a TNT wand or just a quick trip to the void?
game.description.lucky_pillars=Spawn in on a terrifyingly tall tower, but with Lucky Blocks! Gain random items over time and battle it out to become the last player standing.
game.description.minerware=Compete in a series of rapid mini-challenges, from parkours to memory games, earning points for every success. Adapt quickly because every microgame is different! Can you win them all?
game.description.parkour=Race through challenging parkour maps. Beat the clock to earn medals or challenge friends in a competitive mode to see who can finish the fastest.
game.description.pillars_of_fortune=Spawn in on a terrifyingly tall tower, gain random items over time and battle it out to become the last player standing.
game.description.skyblock=Battle the elements from your island! Collect resources, complete quests, expand your island and fight bosses to progress.
game.description.skywars=Battle other CubeCrafters in the sky, but don't look down! To win, all you have to do is be the last player standing. Simple right?
game.description.skywars.chaos=In this mode, everything is more chaotic! Use Throwable TNT, automatic bridge builders, powerups and so much more for fun and chaotic experiences!
game.description.snowman_survival=Tag all other players with snow as a Snowman or run away to safety as a Survivor using powerups! Try and survive the longest to win as a Survivor, or tag all the Survivors as a Snowman to win!
game.description.survival_games=Scavenge for weapons and supplies while battling others. Only the smartest and strongest will survive to claim the win!
game.description.survival_games.category=Survival Games is a collection of games where the key is to survive and be the last one standing. Click below to learn more about each game!
