game.description.beta_games=Beta Games ist eine Auswahl an Spielen, die sich noch in der Entwicklung befinden. Diese Spiele sind noch nicht vollständig veröffentlicht, aber du kannst sie spielen, um uns beim Testen und Verbessern dieser Spiele zu helfen. Klicke unten, um mehr über die einzelnen Spiele zu erfahren!
game.description.blockwars=BlockWars ist ein teambasiertes PvP-Spiel, bei dem du verschiedene Modi spielen kannst, zum Beispiel Capture the Flag, Bridges und Destroy the Core. Klicke unten, um mehr über die einzelnen Modi zu erfahren!
game.description.blockwars.bridges=Erziele Punkte, indem du in das gegnerische Portal springst, und verteidige dabei dein eigenes vor Angriffen! Schnelles Bauen, scharfe Kampfskills und Teamwork sind der Schlüssel zum Sieg.
game.description.blockwars.capture_the_flag=Stiehl die gegnerische Flagge und bringe sie zu deiner Basis, während du deine eigene verteidigst. Finde die Balance zwischen Angriff und Verteidigung, um den Sieg zu erringen.
game.description.blockwars.destroy_the_core=Baue gegnerische Kerne ab und zerstöre diese. Verteidige dabei die Kerne deines eigenen Teams! Sei offensiv oder defensiv; um zu gewinnen, musst du bauen und craften!
game.description.blockwars.giga=BlockWars Giga ist eine erweiterte Version von BlockWars, mit größeren Karten und mehr Spielern. Du kannst verschiedene Spielmodi spielen, wie Capture the Flag, Bridges und Destroy the Core. Klicke unten, um mehr über die einzelnen Modi zu erfahren!
game.description.blockwars.team_deathmatch=Dominiere das Schlachtfeld und arbeite im Team, um das Kill-Ziel zu erreichen. Eliminiere so viele Spieler wie möglich, um das Spiel zu gewinnen!
game.description.disasters=Eine Reihe zufälliger und verrückter Desaster tritt im Laufe des Spiels auf. Sei einer der letzten Überlebenden, um zu gewinnen!
game.description.duels=Kämpfe neben anderen Spielern oder Freunden in intensiven Schlachten. Spiele entweder reguläre Duells für die klassische Erfahrung oder überstark für noch chaotischeren Spaß!
game.description.duels.1v1=1v1
game.description.duels.1v1.fight=Klicken, um in einem 1-gegen-1 anzutreten.
game.description.duels.2v2=2v2
game.description.duels.2v2.fight=Klicken, um in einem 2-gegen-2 anzutreten.
game.description.duels.info=Du kannst Freunde mit /duel privat duellieren oder sie in eine Gruppe einladen!
game.description.duels.mode=Modus auswählen
game.description.duels.requests=Klicken, um deine Anfragen anzusehen.
game.description.eggwars=Kämpft um euer lebenserhaltendes Ei und verteidigt euer eigenes. Wird dein Ei zerstört, wirst du nicht mehr wiederbelebt! Setze deine gerissenen Strategien und Nerven aus Stahl ein, um als Sieger/-in hervorzugehen! Oh, und vergiss nicht, den Shop zu besuchen.
game.description.free_for_all=Jeder ist auf sich allein gestellt in einer furiosen Schlacht um die/den Stärkste/n! Wähle ein Kit, schließe dich mit deinen Freunden zusammen und hintergehe sie, bevor sie dich hintergehen. Nur der/die Stärkste wird gewinnen!
game.description.game_duels=Wähle eines der beliebten Spiele auf CubeCraft, um andere Spieler darin zu duellieren!
game.description.lucky_games=Lucky Games ist eine Auswahl an Spielen, die erfordern, dass das Glück auf deiner Seite ist. Klicke unten, um mehr über die einzelnen Spiele zu erfahren!
game.description.lucky_islands=Kämpfe gegen andere CubeCrafter und baue Glücksblöcke ab, um zufällige Gegenstände zu bekommen – zu deinem Vor- oder Nachteil. Bekommst du einen TNT-Zauberstab oder nur einen Kurzausflug in die Leere?
game.description.lucky_pillars=Starte auf einem furchterregend hohen Turm, aber mit Glücksblöcken! Erhalte mit der Zeit zufällige Gegenstände und kämpfe darum, der/die letzte Überlebende zu werden!
game.description.minerware=Trete in einer Reihe an schnellen Mini-Challenges an, von Parkour zu Gedächtnisspielen, und verdiene Punkte für jeden Erfolg. Passe dich schnell an, denn jedes Minispiel ist anders! Kannst du sie alle gewinnen?
game.description.parkour=Erklimme herausfordernde Parkour-Karten um die Wette. Siege gegen die Zeit, um Medaillen zu verdienen, oder fordere im kompetitiven Modus deine Freunde heraus, um zu sehen, wer schneller das Ziel erreicht.
game.description.pillars_of_fortune=Starte auf einem furchterregend hohen Turm, erhalte mit der Zeit zufällige Gegenstände und kämpfe darum, der/die letzte Überlebende zu sein.
game.description.skyblock=Kämpfe gegen die Elemente auf deiner Insel! Sammle Ressourcen, erfülle Quests, erweitere deine Insel und kämpfe gegen Bosse, um Fortschritt zu erzielen.
game.description.skywars=Kämpfe gegen andere CubeCrafter im Himmel, aber sieh nicht nach unten! Um zu gewinnen, musst du einfach nur der/die letzte Überlebende sein. Simpel, oder?
game.description.skywars.chaos=In diesem Modus ist alles noch chaotischer! Setze werfbares TNT, automatische Brückenbauer, Power-ups und noch viel mehr ein für mehr Spaß und ein chaotischeres Erlebnis!
game.description.snowman_survival=Jage als Schneemann alle anderen Spieler mit Schnee oder nutze als Überlebender Power-ups, um in Sicherheit zu fliehen, oder fange als Schneemann alle Überlebenden, um zu gewinnen!
game.description.survival_games=Ergattere Waffen und Vorräte, während du gegen andere kämpfst. Nur der/die Klügste und Stärkste wird überleben und den Sieg beanspruchen!
game.description.survival_games.category=Survival Games ist eine Auswahl an Spielen, deren Ziel es ist, zu überleben und als Letzte/r dazustehen. Klicke unten, um mehr über die einzelnen Spiele zu erfahren!
