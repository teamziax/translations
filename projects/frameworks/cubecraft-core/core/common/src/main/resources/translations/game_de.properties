game.description.battle_arena=Battle Arena ist eine Auswahl an PvP-Spielen, bei der du Spiele wie Free For All und Duels spielen kannst. Klicke unten, um mehr über die einzelnen Modi zu erfahren!
game.description.bedwars=Kämpft um euer Bett, aber beschützt euer eigenes. Wird dein Bett zerstört, wirst du nicht mehr wiederbelebt! Finde die Balance zwischen Abwehr und aggressiver Attacken! Oh, und vergiss nicht, den Gegenstands- und Aufwertungs-Shop zu besuchen.
