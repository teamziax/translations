game.description.battle_arena=Battle Arena es una colección de juegos PvP donde puedes jugar en modos como Todos contra Todos y Duelos. ¡Haz click a continuación para saber más sobre cada modo de juego!
game.description.bedwars=Lucha para destruir las camas de los demás mientras proteges la tuya. ¡Si tu cama se rompe, ya no podrás reaparecer! ¡Así que equilibra tu defensa inteligente con tus ataques agresivos! Ah, y recuerda visitar la tienda de objetos y mejoras.
game.description.beta_games=Beta Games es una colección de juegos que aún están en desarrollo. Estos juegos aún no están completamente disponibles, pero puedes jugarlos para ayudarnos a probarlos y mejorarlos. ¡Haz clic a continuación para obtener más información sobre cada juego!
game.description.blockwars.bridges=¡Gana puntos saltando al portal enemigo mientras defiendes el tuyo de los atacantes! Construir rápido, habilidades de combate precisas y trabajo en equipo son clave para ganar.
game.description.blockwars.capture_the_flag=Roba la bandera enemiga y devuélvela a tu base mientras proteges la tuya. Equilibra el ataque y la defensa para alzarte con la victoria.
game.description.blockwars.destroy_the_core=¡Explota y destruye los núcleos enemigos mientras proteges los de tu equipo! Puedes ser ofensivo o defensivo; ¡necesitarás construir y fabricar para ganar!
game.description.blockwars.giga=BlockWars Giga es una versión mejorada de BlockWars, con mapas más grandes y más jugadores. Puedes jugar en diferentes modos de juego, como Capturar la Bandera, Puentes y Destruir el Núcleo. ¡Haz clic a continuación para saber más sobre cada modo!
game.description.blockwars.team_deathmatch=Domina el campo de batalla y colabora con tu equipo para alcanzar la meta de bajas. ¡Elimina a la mayor cantidad de jugadores posible para ganar la partida!
game.description.disasters=Una serie de desastres aleatorios y disparatados ocurren a lo largo del juego. ¡Sé uno de los últimos jugadores en pie para ganar!
game.description.duels=Lucha junto a otros jugadores o amigos en intensas batallas. ¡Juega duelos normales para disfrutar de la experiencia clásica o en modo Sobrecargados para una diversión más caótica!
