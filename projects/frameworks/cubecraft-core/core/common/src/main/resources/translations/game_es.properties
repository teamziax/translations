game.description.battle_arena=Battle Arena es una colección de juegos PvP donde puedes jugar en modos como Free For All y Duels. ¡Haz click a continuación para saber más sobre cada modo de juego!
game.description.bedwars=Lucha para destruir las camas de los demás mientras proteges la tuya. ¡Si tu cama se rompe, ya no podrás reaparecer! ¡Así que equilibra tu defensa inteligente con tus ataques agresivos! Ah, y recuerda visitar la tienda de objetos y mejoras.
game.description.beta_games=Beta Games es una colección de juegos que aún están en desarrollo. Estos juegos aún no han sido lanzados de manera completa, pero puedes jugarlos para ayudarnos a probarlos y mejorarlos. ¡Haz clic a continuación para obtener más información sobre cada juego!
game.description.blockwars.bridges=¡Gana puntos saltando al portal enemigo mientras defiendes el tuyo de los atacantes! Construcciones rápidas, habilidades de combate precisas y trabajar en equipo son las claves para ganar.
game.description.blockwars.capture_the_flag=Roba la bandera enemiga y devuélvela a tu base mientras proteges la tuya. Equilibra el ataque y la defensa para alzarte con la victoria.
game.description.blockwars.destroy_the_core=¡Mina y destruye los núcleos enemigos mientras proteges los de tu equipo! Puedes ser ofensivo o defensivo; necesitarás construir y fabricar para ganar.
game.description.blockwars.giga=BlockWars Giga es una versión mejorada de BlockWars, con mapas más grandes y más jugadores. Puedes jugar en diferentes modos de juego, como Capture the Flag, Bridges y Destroy the Core. ¡Haz click a continuación para saber más sobre cada modo!
game.description.blockwars.team_deathmatch=Domina el campo de batalla y colabora con tu equipo para alcanzar la meta de bajas. ¡Elimina a la mayor cantidad de jugadores posible para ganar la partida!
game.description.disasters=Una serie de desastres aleatorios y disparatados ocurren a lo largo del juego. ¡Sé uno de los últimos jugadores en pie para ganar!
game.description.duels=Lucha junto a otros jugadores o amigos en intensas batallas. ¡Juega duelos normales para disfrutar de la experiencia clásica o en modo sobrepotenciados para una diversión más caótica!
game.description.duels.1v1=1v1
game.description.duels.1v1.fight=Haz click para pelear en un 1v1.
game.description.duels.2v2=2v2
game.description.duels.2v2.fight=Haz click para pelear en un 2v2.
game.description.duels.info=¡Puedes hacer duelos con tus amigos en privado con /duel o invitarlos a una party!
game.description.duels.mode=Selecciona el Modo
game.description.duels.requests=Haz click para ver tus solicitudes.
game.name.about=Acerca de {game}
game.description.blockwars=BlockWars es un juego PvP por equipos donde puedes jugar en diferentes modos, como Capture the Flag, Bridges y Destroy the Core. ¡Haz click a continuación para saber más sobre cada modo!
game.description.eggwars=Lucha para destruir los huevos que dan vida a los demás mientras proteges el tuyo. ¡Si tu huevo se rompe, ya no podrás reaparecer! ¡Usa tus astutas estrategias y nervios de acero para alzarte con la victoria! Ah, y recuerda visitar la tienda.
game.description.free_for_all=¡Cada uno por su cuenta en una batalla furiosa para determinar quién es el más fuerte! Elige un kit, únete a tus amigos y traiciona a tus enemigos antes de que te traicionen. ¡Solo los más fuertes sobrevivirán!
game.description.game_duels=¡Elige entre los juegos más populares de CubeCraft para competir 1 contra 1 con otros jugadores!
game.description.lucky_games=Lucky Games es una colección de juegos donde la suerte te acompaña. ¡Haz click a continuación para saber más sobre cada juego!
game.description.lucky_islands=Lucha contra otros CubeCrafters para romper Bloques de la Suerte y recibir objetos aleatorios, útiles o dañinos. ¿Conseguirás una varita de TNT o simplemente un viaje rápido al vacío?
game.description.lucky_pillars=Aparece en una torre aterradoramente alta, ¡pero con Lucky Blocks! Consigue objetos aleatorios con el tiempo y lucha para ser el último jugador en pie.
game.description.minerware=Compite en una serie de minidesafíos rápidos, desde parkours hasta juegos de memoria, y gana puntos por cada éxito. ¡Adáptate rápido, porque cada microjuego es diferente! ¿Podrás ganarlos todos?
game.description.parkour=Corre por desafiantes mapas de parkour. Vence el reloj para ganar medallas o desafía a tus amigos en el modo competitivo para ver quién llega más rápido.
game.description.pillars_of_fortune=Aparece en una torre terriblemente alta, obtén objetos aleatorios con el tiempo y lucha para convertirte en el último jugador en pie.
game.description.skyblock=¡Lucha contra los elementos desde tu isla! Reúne recursos, completa misiones, expande tu isla y lucha contra jefes para progresar.
game.description.skywars=Lucha contra otros CubeCrafters en el cielo, ¡pero no mires hacia abajo! Para ganar, solo tienes que ser el último jugador en pie. Fácil, ¿verdad?
game.description.skywars.chaos=¡En este modo, todo es más caótico! ¡Usa TNT lanzable, constructores de puentes automáticos, potenciadores y mucho más para disfrutar de experiencias divertidas y caóticas!
game.description.snowman_survival=¡Toca a todos los demás jugadores con nieve mientras seas un Muñeco de nieve o corre a un lugar seguro si eres un Superviviente usando potenciadores! ¡Intenta sobrevivir más tiempo para ganar como superviviente, o convierte todos los supervivientes si eres un muñeco de nieve para ganar!
game.description.survival_games=Busca armas y suministros mientras luchas contra otros. ¡Solo los más inteligentes y fuertes sobrevivirán para alzarse con la victoria!
game.description.survival_games.category=Survival Games es una colección de juegos donde la clave es sobrevivir y ser el último en pie. ¡Haz click a continuación para saber más sobre cada juego!
