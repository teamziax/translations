game.description.battle_arena=Battle Arena est une collection de jeu PvP où vous pouvez jouer a des modes tel que Free For All et Duels. Cliquez en dessous pour en apprendre plus sur ces mode de jeux !
game.description.bedwars=Battez vous pour détruire les lits des autres tout en protégeant le votre. Quand votre lit est cassé, vous ne pouvez plus réapparaître ! Équilibrez une défense intelligente ainsi que des attaques agressive ! Oh, et n'oubliez pas de visiter le magasin d'amélioration et d'objets.
game.description.beta_games=Beta Game est une collection de jeu encore en cours de développement. Ces jeux ne sont pas entièrement terminé, mais vous pouvez les tester pour nous aider a les améliorer. Cliquez ci dessous pour en apprendre plus sur chaques jeux !
game.description.blockwars=BlockWars est un jeu PvP basé en équipe ou vous pouvez jouer a différents modes de jeux comme Capture the flag, Bridges, et Destroy the Core. Cliquez ci dessous pour en apprendre plus sur chaque mode de jeu !
game.description.blockwars.bridges=Gagner des points en sautant dans le portail ennemi tout en défendant le votre des attaquants ! Construction rapide, Des compétences de combat aiguisée et le travail d'équipe est la clé vers la réussite.
game.description.blockwars.capture_the_flag=Volez le drapeau ennemi et ramener le à votre base tout en protégeant la vôtre. Équilibrez offensive et tactiques pour obtenir la victoire.
game.description.blockwars.destroy_the_core=Minez et cassez le noyau ennemi tout en protégeant le noyau de votre équipe ! Soyez à la fois offensive et défensif ; vous avez besoin de construire et fabriquer pour gagner !
game.description.blockwars.giga=BlockWars Giga est une version amplifiée de BlockWars, proposant une carte plus volumineuse et plus de joueurs. Vous pouvez jouer a différents modes de jeu comme Capture the flag, Bridges et Destroy the Core. Cliquez ci dessous pour en apprendre plus sur les différents modes de jeu !
game.description.blockwars.team_deathmatch=Dominez le champ de bataille et travaillez avec votre équipe pour atteindre votre objectif de kill. Eliminez le plus de joueurs possible pour gagner le jeu !
