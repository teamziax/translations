game.description.battle_arena=Battle ArenaはFree For AllやDuelsなどのモードが楽しめるPvPゲーム集です。各ゲームモードの詳細については以下をクリックしてください!
game.description.bedwars=自分のベッドを守りながら相手のベッドを破壊するバトルを繰り広げよう。ベッドが壊されるとリスポーンできなくなるよ!だから巧みな防御と積極的な攻撃のバランスを取ろう!それからアイテムやアップグレードショップにも立ち寄るのを忘れずに。
game.description.beta_games=Beta Gamesとは開発中のゲームを集めてたものです。これらのゲームは正式リリースされていませんがプレイしていただくことでゲームの改善にご協力いただけます。各ゲームの詳細については以下をクリックしてください!
game.description.blockwars=BlockWarsはCapture the FlagやBridgesやDestroy the Coreなどさまざまなゲームモードが楽しめるチーム対戦型PvPゲームです。各ゲームモードの詳細については以下をクリックしてください!
game.description.blockwars.bridges=相手チームのポータルに飛び込んでポイントを獲得しつつ自分のポータルを相手チームから守りましょう!素早い建築や鋭い戦闘スキルそしてチームワークが勝利の鍵となります。
game.description.blockwars.capture_the_flag=相手チームの旗を奪い自陣に持ち帰ろう。また自陣の旗も守ろう。攻撃と防御のバランスを取って勝利を掴み取れ。
game.description.blockwars.destroy_the_core=相手チームのコアを破壊しつつ味方のコアを守ろう!攻撃でも防御でも勝利のためには建築とクラフトが必要不可欠だ!
game.description.blockwars.giga=BlockWars Gigaはより大きなマップとより多くのプレイヤーを特徴とするBlockWarsの拡張版です。Capture the FlagやBridgesやDestroy the Coreなどさまざまなゲームモードをプレイできます。各ゲームモードの詳細については以下をクリックしてください!
game.description.blockwars.team_deathmatch=戦場を制圧しチームメイトと協力して目標キル数を達成しよう。できるだけ多くのプレイヤーを倒して勝利を掴め!
game.description.disasters=ゲーム中ランダムに奇妙な災害が次々と発生します。最後まで生き残ったプレイヤーが勝利です!
game.description.duels=他のプレイヤーやフレンドと一緒に白熱のバトルを繰り広げよう。定番のDuelsでクラシックな体験を楽しむもよしより混沌とした楽しさを求めるならOverpowered Duelsに挑戦するもよし!
