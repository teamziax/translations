game.description.free_for_all=最強を決める激しい戦いの中で全員がライバルとなります! キットを選んで友達と協力し 相手に裏切られる前に先手を打ちましょう。 生き残れるのは最強のプレイヤーだけです!
game.description.game_duels=CubeCraft の人気のゲームから選んで他のプレイヤーと1v1で対戦しましょう。
game.description.lucky_islands=他のCubeCrafterと戦いながらラッキーブロックを壊して 役に立つアイテムや危険なアイテムを手に入れましょう。 あなたが手にするのはTNTの杖でしょうか? それとも奈落への片道切符でしょうか?
game.description.lucky_pillars=ラッキーブロックが設置された恐ろしく高いタワーの上でスポーンします! 時間の経過とともにランダムにアイテムを獲得し 最後の1人になるまで戦い抜きましょう。
game.description.minerware=アスレチックから記憶力ゲームまで 次々と繰り出されるミニゲームに挑戦し 成功するたびにポイントを獲得できます。 すべてのゲームが異なるため 素早い状況判断がカギとなります! あなたはすべてのゲームで勝利できるでしょうか?
game.description.parkour=手強いアスレチックマップを駆け抜けましょう。 制限時間に挑んでメダルを獲得するか 対戦モードで友達と競い合って誰が一番早くゴールできるか勝負です。
game.description.pillars_of_fortune=恐ろしく高いタワーの上からスタートします。 時間の経過とともにランダムなアイテムを入手し 最後の1人になるまで生き残りをかけて戦いましょう。
game.description.skyblock=自分の島で過酷な環境に立ち向かいましょう。 資源を集めてクエストをクリアし 島を広げながらボスを倒してストーリーを進めます。
game.description.skywars=上空を舞台に他のCubeCrafterと戦いましょう。 ただし下を見てはいけません! 勝利条件は最後の1人として生き残ることです。 簡単ですよね?
game.description.skywars.chaos=このモードではすべてがさらにハチャメチャになります! 投擲TNTや自動橋建設 などを駆使して 賑やかでカオスなバトルを楽しみましょう!
game.description.snowman_survival=雪だるまとして雪玉を投げて他のプレイヤー全員をタッチするか 生存者としてパワーアップを駆使して安全な場所へ逃げましょう! サバイバーとして最も長く生き残って勝利を目指すか 雪だるまとしてすべての生存者をタッチして勝利しましょう!
game.description.survival_games=他のプレイヤーと戦いながら 武器や物資をかき集めましょう。 知恵と強さを兼ね備えた者だけが生き残り 勝利を手にすることができます!
game.queue.cannot_join_this_queue=このマッチングには参加できません。
