game.description.eggwars=自分のエッグを守りながら他のプレイヤーと戦闘し相手のエッグを壊そう。自分のエッグが壊されるとリスポーンできなくなるよ!戦略や立ち回りを考えて勝利を掴もう!それとショップを使うのをわすれずにね。
game.description.lucky_games=Lucky Gamesは運を味方につけるゲームが集まったモードです。各ゲームの詳細については以下をクリックしてください。
game.description.survival_games.category=Survival Gamesは生き残って最後の一人または最後のチームになることが鍵となるゲームが集まったモードです。各ゲームの詳細については以下をクリックしてください。
