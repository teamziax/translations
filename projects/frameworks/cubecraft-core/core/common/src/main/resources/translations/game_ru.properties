game.achievements.name.legacy=Устаревшие Достижения
game.description.free_for_all=Здесь каждый сам за себя в яростной битве, которая определит сильнейшего! Выбирайте набор снаряжения, объединяйтесь с друзьями, а затем предайте их, пока они не предали вас. Выживет только сильнейший!
game.description.game_duels=Выбирайте популярные режимы CubeCraft, чтобы сразиться с другими игроками 1 на 1!
game.description.lucky_games=Lucky Games – это коллекция режимов, где всё зависит от вашей удачи. Нажмите ниже, чтобы узнать больше о каждой игре!
game.description.lucky_islands=Сражайтесь с другими игроками CubeCraft и крушите лаки-блоки, чтобы получать случайные предметы – как полезные, так и опасные! Что вам достанется: палочка c TNT или мгновенный полет в бездну?
game.description.lucky_pillars=Вы появитесь на ужасающе высокой башне, но с лаки-блоками! Получайте случайные предметы с течением времени и сражайтесь, чтобы остаться последним выжившим.
game.description.minerware=Соревнуйтесь в серии стремительных мини-испытаний – от паркура до игр на память – и зарабатывайте очки за каждый успех. Адаптируйтесь на ходу, ведь каждая микроигра уникальна! Сможете ли вы победить во всех?
game.description.parkour=Мчитесь по сложнейшим паркур-картам! Обгоните время, чтобы заработать медали, или бросьте вызов друзьям в соревновательном режиме, чтобы узнать, кто финиширует быстрее всех.
game.description.pillars_of_fortune=Вы появитесь на ужасающе высокой башне, получайте случайные предметы с течением времени и сражайтесь, чтобы стать последним выжившим.
game.description.skyblock=Сражайтесь со стихиями на своём острове! Собирайте ресурсы, выполняйте квесты, расширяйте свои владения и побеждайте боссов, чтобы продвигаться вперёд.
game.description.skywars=Сражайтесь с другими игроками CubeCraft прямо в небесах, но только не смотрите вниз! Для победы нужно всего лишь стать последним выжившим. Проще простого, верно?
game.description.skywars.chaos=В этом режиме хаос выходит на новый уровень! Используйте метательный динамит, автостроители мостов, усилители и многое другое для максимально безумного веселья!
game.description.snowman_survival=Закидывай игроков снежками в роли Снеговика или спасайся в роли Выжившего, используя бонусы! Выживи дольше всех для победы, или поймай всех Выживших, играя за Снеговика!
game.description.survival_games=Собирайте оружие и снаряжение, сражаясь с соперниками. Лишь самые хитрые и сильные смогут выжить и победить!
game.description.survival_games.category=Survival Games – это сборник, где главная цель – выжить и остаться последним. Нажмите ниже, чтобы узнать больше о каждой игре!
