game.description.battle_arena=Battle Arena — это сборник PvP-игр, в которых вы можете играть в такие режимы, как «Каждый сам за себя» и «Дуэли». Нажмите ниже, чтобы узнать больше о каждом режиме игры!
game.description.bedwars=Сражайтесь, чтобы уничтожить кровати соперников и защитить свою. Если вашу кровать сломают, вы больше не сможете возродиться! Соблюдайте баланс между хитрой обороной и стремительной атакой. И не забывайте заглядывать в магазин предметов и улучшений.
game.description.beta_games=Бета-игры — это коллекция проектов, которые всё ещё находятся в разработке. Они ещё не вышли официально, но вы можете сыграть в них уже сейчас, чтобы помочь нам с тестированием и улучшениями. Нажмите ниже, чтобы узнать больше о каждой игре!
game.description.blockwars=BlockWars – это командная PvP-игра с различными режимами, такими как «Захват флага», «Мосты» и «Разрушение ядра». Нажмите ниже, чтобы узнать подробнее о каждом из них!
game.description.blockwars.bridges=Зарабатывайте очки, прыгая во вражеский портал, и защищайте собственный от нападения! Быстрое строительство, меткость в бою и слаженная командная работа – вот ключ к победе.
game.description.blockwars.capture_the_flag=Похитьте вражеский флаг и доставьте его на свою базу, не забывая защищать собственный. Умело сочетайте атаку и оборону, чтобы вырвать победу.
game.description.blockwars.destroy_the_core=Добывайте ресурсы и крушите вражеские ядра, защищая ядра своей команды! Нападайте или обороняйтесь – для победы вам придётся много строить и крафтить!
game.description.blockwars.giga=BlockWars Giga – это масштабная версия BlockWars с увеличенными картами и большим количеством игроков. Вы можете играть в различных режимах, таких как «Захват флага», «Мосты» и «Разрушение ядра». Нажмите ниже, чтобы узнать подробнее о каждом из них!
game.description.blockwars.team_deathmatch=Доминируйте на поле боя и действуйте сообща, чтобы первыми набрать нужное количество убийств. Устраните как можно больше соперников, чтобы вырвать победу в матче!
game.description.disasters=На протяжении всей игры случайным образом происходят безумные бедствия. Станьте одним из последних выживших, чтобы победить!
game.description.duels=Сражайтесь плечом к плечу с друзьями или другими игроками в напряжённых битвах. Выбирайте обычные дуэли для классической игры или режим «Усиленный» для безумного веселья!
game.description.duels.1v1=1 на 1
game.description.duels.1v1.fight=Нажмите, чтобы сразиться 1 на 1.
game.description.duels.2v2=2 на 2
game.description.duels.2v2.fight=Нажмите, чтобы сразиться 2 на 2.
game.description.duels.info=Вы можете вызвать друзей на приватную дуэль с помощью команды /duel или пригласить их в компанию!
game.description.duels.mode=Выбор режима
game.description.duels.requests=Нажмите, чтобы посмотреть запросы.
game.description.eggwars=Сражайтесь, чтобы уничтожить дарующие жизнь яйца соперников и защитить собственное. Если ваше яйцо сломают, вы больше не сможете возродиться! Используйте хитрые стратегии и проявите железную выдержку, чтобы выйти победителем. И не забывайте заглядывать в магазин.
