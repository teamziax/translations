game.description.battle_arena=Battle Arena（战斗竞技场）是一个PvP游戏合集，你可以游玩诸如自由混战和决斗等模式。点击下方了解每种游戏模式的详情！
game.description.bedwars=在保护自己床的同时摧毁对手的床。一旦床被破坏，你将无法重生！因此，在巧妙防守与猛烈进攻之间找到平衡吧！哦，对了，别忘了光顾物品与升级商店。
game.description.beta_games=测试版游戏是一个仍在开发中的游戏合集。这些游戏尚未完全发布，但你可以游玩它们来帮助我们测试和改进。点击下方了解每种游戏的详情！
game.description.blockwars=BlockWars是一款基于团队的 PvP 游戏，你可以游玩多种模式，例如夺旗、战桥和摧毁核心。点击下方了解每种游戏模式的详情！
game.description.blockwars.bridges=通过跳入敌方池子来得分，同时抵御进攻者守卫自己的池子！快速建造、精湛的战斗技巧和团队协作是获胜的关键。
game.description.blockwars.capture_the_flag=偷取敌方旗帜并带回己方基地，同时保护自己的旗帜。在进攻与防守之间取得平衡以夺取胜利。
game.description.blockwars.destroy_the_core=挖掘并摧毁敌方核心，同时保护己方核心！无论是进攻还是防守，你都需要通过建造和合成来赢得胜利！
game.description.blockwars.giga=BlockWars Giga是BlockWars的强化版本，拥有更大的地图和更多的玩家。你可以游玩多种模式，例如夺旗、战桥和摧毁核心。点击下方了解每种游戏模式的详情！
game.description.blockwars.team_deathmatch=主宰战场，与团队合作达成击杀目标。尽可能多地淘汰对手以赢得胜利！
game.description.disasters=一系列随机而疯狂的灾难会在游戏中不断发生。坚持到最后成为幸存者即可获胜！
game.description.duels=与其他玩家或好友一起投身激烈的战斗。体验经典模式的常规决斗，或选择超强力模式享受更加混乱的乐趣！
game.description.duels.1v1=1v1
game.description.duels.1v1.fight=点击进行1v1对战。
game.description.duels.2v2=2v2
game.description.duels.2v2.fight=点击进行2v2对战。
game.description.duels.info=你可以使用/duel与好友私下决斗，或将他们邀请到组队中！
game.description.duels.mode=选择模式
game.description.duels.requests=点击以查看你的请求。
game.description.eggwars=在保护己方赋予生命的蛋的同时，摧毁敌方的蛋。一旦蛋被摧毁，你将无法重生！运用你狡诈的策略和钢铁般的意志来夺取胜利！哦，对了，别忘了光顾商店。
game.description.free_for_all=一场激烈的混战，每个人都在为证明谁是最强者而战！选择一个套装，与朋友结盟，然后在他们背叛你之前先背叛他们。只有最强者才能存活！
game.description.game_duels=从热门的CubeCraft游戏中选择，与其他玩家进行1v1对决！
game.description.lucky_games=Lucky Games（幸运游戏）是一个考验运气的游戏合集。点击下方了解每种游戏的详情！
game.description.lucky_islands=与其他CubeCraft玩家对战，打破幸运方块以获取随机物品——可能是助力，也可能是陷阱。你会得到一根TNT法杖，还是直接来一趟虚空之旅？
game.description.lucky_pillars=在令人胆寒的高塔上生成，但这里有幸运方块！随时间获得随机物品，在战斗中坚持到最后成为幸存者。
game.description.minerware=参与一系列快节奏的迷你挑战，从跑酷到记忆游戏，每次成功都能获得分数。每个小游戏都不同，你需要快速适应！你能通通赢下来吗？
game.description.parkour=在富有挑战性的跑酷地图中竞速。争分夺秒赢取奖牌，或在竞技模式中与好友一较高下，看谁最快完成。
game.description.pillars_of_fortune=在令人胆寒的高塔上生成，随时间获得随机物品，在战斗中坚持到最后成为幸存者。
game.description.skyblock=在空岛上与自然元素抗争！收集资源、完成任务、扩建岛屿并挑战Boss来不断推进。
game.description.skywars=在天空中与其他CubeCraft玩家对战，但别往下看！要获胜，你只需成为最后存活的人。很简单，对吧？
game.description.skywars.chaos=在此模式中，一切都更加混乱！使用投掷式TNT、自动搭桥器、增益道具等更多物品，享受有趣又混乱的体验！
game.description.snowman_survival=作为雪人用雪球标记所有其他玩家，或作为幸存者利用增益道具逃往安全地带！作为幸存者尽量活到最后以获胜，或作为雪人标记所有幸存者来赢得胜利！
game.description.survival_games=在与其他玩家对战的同时搜寻武器和物资。只有最聪明、最强大的人才能存活并夺得胜利！
game.description.survival_games.category=Survival Games（生存游戏）是一个以生存并成为最后一人为核心的游戏合集。点击下方了解每种游戏的详情！
game.description.mob_who=我们最新的BETA测试版游戏“Mob Hunt（生物猎手）”是一款别具一格的捉迷藏游戏！伪装成地图中的任意生物并模仿它们的动作来融入环境，或作为搜寻者追捕那些烦人的躲藏者！
