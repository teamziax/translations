prelobby.game_config.title=Game Settings
prelobby.game_config.description=Configure specific options about how the game should behave.

prelobby.map_change.title=Change Map
prelobby.map_change.description=Select a map to play when the game starts.
prelobby.map_change.team_warning=Changing the map may reset the teams of players in the game if the map has a different number of teams or team sizes.
prelobby.map_change.click_to_change=Click to change the map.
prelobby.map_change.not_supported=This map is not supported by the game you are trying to play.
prelobby.map_change.switched={name} will now be played when the game starts.

prelobby.team_assignment.title=Team Assignment
prelobby.team_assignment.description=Assign players to teams before the game starts.

prelobby.team_selector.title=Team Selector
prelobby.team_selector.description=Configure how players can interact with the team selector.
prelobby.team_selector.enabled.title=Enabled
prelobby.team_selector.enabled.description=If players can open the team selector to select a team.
prelobby.team_selector.can_pick_own.title=Can Pick Own Team
prelobby.team_selector.can_pick_own.description=If players can select their own team in the team selector.
prelobby.team_selector.can_spectate.title=Can Spectate
prelobby.team_selector.can_spectate.description=If players can choose to join no team and spectate the game.
prelobby.team_selector.allow_random.title=Allow Random Team
prelobby.team_selector.allow_random.description=If players can select a random team in the team selector. If disabled and players aren't manually assigned to a team, they will be forced to spectator when the game starts.
