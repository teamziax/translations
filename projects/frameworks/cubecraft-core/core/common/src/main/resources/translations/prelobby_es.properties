prelobby.game_config.title=Ajustes de Juego
prelobby.game_config.description=Configura las opciones específicas sobre el comportamiento del juego.
prelobby.map_change.title=Cambiar Mapa
prelobby.map_change.description=Selecciona un mapa para jugar cuando la partida comience.
prelobby.map_change.team_warning=Cambiar el mapa puede reiniciar los equipos de jugadores en la partida si el mapa tiene un número o tamaño de equipos diferentes.
prelobby.map_change.click_to_change=Haz click para cambiar el mapa.
prelobby.map_change.not_supported=Este mapa no es compatible con la partida que estás intentando jugar.
prelobby.map_change.switched={name} ahora será jugado cuando la partida comience.
prelobby.team_assignment.title=Asignación de Equipos
prelobby.team_assignment.description=Asigna jugadores a equipos antes de que comience la partida.
prelobby.team_selector.title=Selector de Equipo
prelobby.team_selector.description=Configura cómo pueden interactuar los jugadores con el selector de equipo.
prelobby.team_selector.enabled.title=Habilitado
prelobby.team_selector.enabled.description=Si los jugadores pueden abrir el selector de equipos para elegir un equipo.
prelobby.team_selector.can_pick_own.title=Pueden Elegir su Equipo
prelobby.team_selector.can_pick_own.description=Si los jugadores pueden elegir sus propios equipos en el selector de equipos.
prelobby.team_selector.can_spectate.title=Pueden Espectear
prelobby.team_selector.can_spectate.description=Si los jugadores pueden elegir no unirse a ningún equipo y quedarse a ver la partida.
prelobby.team_selector.allow_random.title=Permitir Equipos Aleatorios
prelobby.team_selector.allow_random.description=Si los jugadores pueden elegir un equipo aleatorio en el selector de equipos. Si se deshabilita y los jugadores no son asignados manualmente a un equipo, estarán forzados a ser espectadores cuando comience la partida.
