settings.gdpr.overview.line1=Hallo! Wir sind {company_name} und wir sind das Unternehmen, das hinter {server_name} steckt. Wir sind für die Erfassung Ihrer personenbezogenen Daten und die Kontrolle ihrer Verwendung zum Zweck der Verwaltung des Spiels {server_name} für Sie verantwortlich.
settings.gdpr.overview.line2=Bitte lesen Sie {here} unsere Datenschutzerklärung, um mehr darüber zu erfahren, wie die personenbezogenen Daten genutzt werden, die erfasst werden, wenn Sie dem Spiel beitreten, sowie über Ihre Datenschutzrechte in Bezug auf Ihre personenbezogenen Daten.
settings.gdpr.overview.line3=Indem du auf {server_name} spielst, bestätigst du, dass:
settings.gdpr.overview.line4=Du über 13 Jahre alt bist oder von deinen Eltern oder Erziehungsberechtigten die Erlaubnis dazu hast, Minecraft zu spielen; und
settings.gdpr.overview.line5=Du die Bedingungen unserer Datenschutzerklärung gelesen, verstanden und akzeptiert hast.
