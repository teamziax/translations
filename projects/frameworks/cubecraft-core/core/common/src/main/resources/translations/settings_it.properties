settings.gdpr.privacy_agreement=Accordo sulla privacy
settings.gdpr.accept_info=Clicca per accettare la nostra politica sulla privacy e iniziare a giocare.
settings.gdpr.deny_info=Clicca per rifiutare la nostra politica sulla privacy e lasciare il server.
settings.gdpr.accept_confirm=Grazie per accettare la nostra politica sulla privacy. Potrai cambiare scelta nelle tue impostazioni in futuro.
settings.gdpr.deny_confirm=Hai rifiutato le nostre politiche sulla privacy!
settings.gdpr.deny_content=Se vuoi accettare le nostre politiche sulla privacy nel futuro, ti potrai riconnettere quando vuoi.
settings.gdpr.overview.line1=Ciao! Siamo {company_name} e siamo l'azienda dietro {server_name} che è responsabile per collezionare i tuoi dati personali e controllare come verranno usati per amminiztrare il {server_name} gioco per te.
settings.gdpr.overview.line2=Ti prego, guarda la nostra politica sulla privacy {here} per più informazioni su come usiamo i dati personali quando accedi al gioco e i tuoi diritti di privacy in relazione ai tuoi dati personali.
settings.gdpr.overview.line3=Giocando su {server_name}, stai confermando che:
settings.gdpr.overview.line4=Sei più grande di 13 anni o hai il consenso di giocare a Minecraft da un genitore o tutore; e
settings.gdpr.overview.line5=Hai letto, capito e accettato i nostri termini della nostra politica della privacy.
