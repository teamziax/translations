settings.gdpr.title=Revisiona il nostro accordo sulla privacy
settings.gdpr.info=Qui puoi revisionare il nostro accordo sulla privacy.
settings.gdpr.content=Collezioniamo i dati processati in linea con la nostra {policy}. Concordando, confermi di essere più grande di 13 anni o di avere l'approvazione di un tuo tutore, e ci consenti di processare u tuoi dati in questi modi.
settings.gdpr.policy=Politica sulla privacy
