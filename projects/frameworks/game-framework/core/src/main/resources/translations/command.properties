# In the help menu, hover text which adds the command to chat when clicked
command.execution.click_to_prepare=Click to prepare {command}.
# Message shown when a player has no permission for a command
command.execution.no_permission=You do not have permission to execute this command!
command.execution.error=An error occurred when attempting to run this command!
command.execution.not_available=This command is not available on this version of the game!
command.execution.syntax=Invalid syntax! Usage: {usage}
command.execution.too_few_inputs=You have provided too few inputs for the {name} argument!
command.execution.too_many_inputs=You have provided too many inputs for the {name} argument!
command.execution.aliases=You can also use {aliases} to execute this command.
command.execution.alias_last=You can also use {aliases} or {last_alias} to execute this command.
command.execution.available_options=Available options: {options}
command.execution.too_many_players=This command is being executed by too many players at once! Please wait a few seconds and try again.
command.execution.too_fast=You are executing this command too fast! Please try again in {time}.
command.execution.invalid_type=Unable to find type {type}.
# Message shown when a player tries to do something they don't have permission for and the permission is tied to a permanent rank.
command.execution.no_permission.rank=You must have {rank} to execute this command!
# JAVA ONLY - Message shown when a player tries to do something they don't have permission for and the permission is tied to a subscription rank.
command.execution.no_permission.java_subscription=You must have an active {rank} subscription to do this!
# BEDROCK ONLY - Message shown when a player tries to do something they don't have permission for and the permission is tied to a rank pass.
command.execution.no_permission.bedrock_subscription=You must have an active {rank} pass to do this!
