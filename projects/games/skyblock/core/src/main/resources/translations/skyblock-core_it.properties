skyblock_core.augment.sword.lifesteal_1.name=Furto di Vita I
skyblock_core.augment.sword.lifesteal_1.description=6% di probabilità che tu e i giocatori vicini curiate il 20% di tutti i danni inflitti.
skyblock_core.augment.sword.lifesteal_2.name=Furto di Vita II
skyblock_core.augment.sword.lifesteal_2.description=15% di probabilità che tu e i giocatori vicini curiate il 20% di tutti i danni inflitti.
skyblock_core.augment.sword.lifesteal_3.name=Furto di Vita III
skyblock_core.augment.sword.lifesteal_3.description=25% di probabilità che tu e i giocatori vicini curiate il 20% di tutti i danni inflitti.
skyblock_core.augment.sword.lightning_bolt.name=Fulmine
skyblock_core.augment.sword.lightning_bolt.description=Colpire un mostro ha il 5% di probabilità di evocare un fulmine e infliggere il 10% della sua salute massima come danno inbloccabile.
skyblock_core.augment.sword.multi_hit.name=Multi-Colpo
skyblock_core.augment.sword.multi_hit.description=Quando colpisci un mostro, 20% di probabilità di infliggere lo stesso danno a tutti i mostri circostanti.
skyblock_core.augment.sword.precision.name=Precisione
skyblock_core.augment.sword.precision.description=Se colpisci lo stesso mostro 3 volte in 5 secondi, il terzo colpo è un critico garantito.
skyblock_core.augment.sword.slayer_of_the_undead.name=Sterminatore di Non Morti
skyblock_core.augment.sword.slayer_of_the_undead.description=Infligge il 40% di danni aggiuntivi a tutti i non morti.
skyblock_core.augment.sword.unblockable_damage.name=Danno Inbloccabile
skyblock_core.augment.sword.unblockable_damage.description=Se colpisci lo stesso mostro 3 volte in 5 secondi, infliggi 2 cuori di danno inbloccabile.
