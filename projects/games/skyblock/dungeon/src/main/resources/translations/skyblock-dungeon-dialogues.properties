skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina=Adelina
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction1=Thanks for helping me get to safety! The world needs more heroes like you!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction2=You're so sweet! Checking in on me even in these conditions!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step1=Oh hey there! Thanks so much for being a brave soul and helping us out!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step2=I don't know what happened, these Zombies just came out of nowhere!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step3=Like why are these Zombies here? They've already taken control over so much of Pumpkingdom!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step4=Just a few days ago, this was a thriving castle, now everyones been forced into hiding!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step5=Thanks for the help! I'm so grateful!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie1=Oh deary me! That Zombie is so scary!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie2=Woah! That one caught me off guard!

skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan=Bryan
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction1=Heyyyyy... Lets keep moving... Don't stop!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction2=We don't have time for talking!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step1=Oh! Finally! Some help! Lets gooo
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step2=I've been waiting for days hiding up there. Nobody came to help.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step3=I'm not equipped for this. I don't have any weapons. Glad you picked to rescue me!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step4=I should stop talking and let you focus.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step5=What a relief. I'm safe.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie1=WOAH! A ZOMBIE! I'm too scared to move!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie2=Another ZOMBIE! You better get this one first!

skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella=Ella
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.interaction1=I'm so scared! Can you help me?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step1=Ahh! A teammate! Lets get to safety!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step2=Glad to have a friend to work with! These Zombies don't stand a chance!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step3=Look at you go, really racking up the kill count on those Zombies!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step4=Oh alright, I'm not as strong as I might seem. I act tough, but you've got to in these circumstances!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step5=Thanks for the help! Sorry I wasn't more assistance! I dream of being tough like you one day.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie1=Come here Zombie! Lets fight!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie2=Another Zombie! Lets keep fighting until they're all gone!

skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany=Giovany
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction1=We can achieve a lot by talking. Unless it's with Zombies, as they don't really listen.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction2=How's you're day going? I'm sure with all this fighting, nobody has checked in on you, and only worried about their own skin.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step1=Hey there! Much appreciate the assistance.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step2=Hope you're doing all right! I can only support the villagers morals. I'm a terrible fighter.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step3=I'm so grateful for people like you who exist. Too many of the Pumpkingdom's Guards just fled when they saw the Zombies.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step4=You get me back and I'll keep the morals of everyone. Sucks that I can't help more mate. I ain't a fighter.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step5=Thanks there! Stay tough! Keep fighting! I'll look after the people here.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie1=I'm not trained to take on this Zombie. You better deal with it.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie2=Dearest Zombie. Let's talk... Oh... no? AHHH, another disobedient one here!

skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah=Noah
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction1=Can I intrest you in buying some food?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction2=Do you think Zombies are any good as store workers? Can I train one?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction3=My shop, I can't believe it. It was there one day, and surrounded with Zombies the next.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step1=MY SHOP! We can't leave it!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step2=What do you mean we need to get to safety? Can't we just kill all the Zombies?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step3=Oh wow, there's so many Zombies! I did not realise the problem was as bad as it was.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step4=I guess it's for the best you rescued me. I can't believe I lost my shop. That was my life's work.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step5=Thanks I guess. One day check out my store. I'll be back.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie1=Get back you scary Zombie!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie2=Over there! Get that one!

skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick=Rodrick
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction1=I'm curious, what's your thoughts on the reason behind all of this? Bit strange it happened so fast.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction2=I wonder if that loud bang a few days ago had anything to do with it.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step1=Hey there! Why are you going this way? Surely you should be going the other way?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step2=Wouldn't it be important for you soldiers to figure out the source of these Zombies, rather than helping us?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step3=Your help is appreciated, but I'm concerned the problem won't get better until we know the reason behind this.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step4=Did you see that MASSIVE purple spike come out the ground a few days ago? Maybe you should check that out?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step5=Thanks for getting me here, but please go investigate the source. This won't get better without answers.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie1=Woah! A Zombie! Quickly get this one.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie2=So many Zombies! I can't move with so many of them around!

skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie=Sadie
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction1=Will you be my friends. I feel so alone out here.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction2=I'm scared of strangers, but more scared of Zombies.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step1=Oh! Thanks! I'm... Scared :( Must we go?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step2=I can't believe it. I've lost my home.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step3=I've lost my friends too. Can you find them?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step4=This is sad times. I want to curl up in bed but I can't.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step5=Oh yay! I'm safe! A bed! And food! Thanks friend!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie1=Aaaa! Another one!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie2=Please help! It's getting too close!

skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack=Zack
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction1=Wonder why Zombies are stealing pumpkins and stuff? Could they be taking them somewhere?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction2=Thanks for checking in on me, but I'm fine. I've dealt with wars of my own in the past. (Although mostly just rodents eating my crops)
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step1=Names Zack. Can't believe help came for me so fast!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step2=I'm the roughest toughest pumpkin farmer alive. You can rescue me last if you want.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step3=I hear that Zombie flesh was good for pumpkins.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step4=Oh, wait, maybe it was skeleton flesh that was good for crop growth?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step5=These annoying Zombies also keep stealing my pumpkins. I hope I've still got food in a few weeks.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step6=Thanks for getting me here. I'll go prepare some food for the other survivors.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie1=A zombie! Can you get it! I think this one stole my pumpkin.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie2=WAAAAHH! That one totally caught me off guard! You didn't see me over react.

skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.tushar=Tushar
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction1=Hey there. Thanks for coming to assist with the mine clearance. We're in such desperate need of it.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction2=Do you really think you're up for this task? These caves are pretty scary.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step1=Thanks for agreeing to help out.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step2=No time for standing still. We must get going. Let’s walk and talk.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step3=So these are our brand-new mines. About 10 years ago now, this massive crack in the world formed. It was a massive disaster at the time.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step4=However, this ravine appearing overnight gave us access to far more resources than ever before.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step5=It was quickly turned into a massive enterprise, harvesting these resources and selling them to the world.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step6=But ever since the beginning, these creatures have slowly been appearing. We found that they didn't like fire and that kept them at bay.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step7=But not too long ago now, they put the flames out, and now we've just lost control! They've swarmed the caves ever since!
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step8=I need you to go into these caves and relight the flames. That will allow us to regain control.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step9=Let's start simple. This is the smallest of our mines. There should be a flame near the entrance to test out. Stand near it for it to reignite.

skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step1=Woah, you made that look easy. You're quite tough. Let's go to the next one.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step2=These mines allow us to harvest the valuable lapis. Typically, we'd have to distil the water from the lakes to gather it.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step3=Now we can just mine lapis directly from the ground. It's been great for business round here these past few years.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step4=Right, here you go. This one's a big bigger, but the same as the last.

skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step1=I can't believe you handled that. One more to go, and we can all rest easy tonight.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step2=Us locals think that these monsters are taking this lapis elsewhere. We suspect they're working for something or someone.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step3=But we don't know where they're taking all this lapis. Someone in town said they saw a Zombie morph into the ground.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step4=One day we can only hope the source of these creatures is fixed.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step5=One final mine. I wish you the best. This one is big.

skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile1=I think you should deal with the hostilities nearby before I move.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile2=Please take out these nearby monsters. I don't have a flame on me.

skyblock_dungeon_dialogues.overworld.jungle.lucien_lair.lucien=Lucien
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part1=I see, you've decided to take on my absolutely immense power!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part2=My army and I will work to take you down. Should be a breeze.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part1=I see you're still here. My partners in crime aren't pleased that you're stopping us.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part2=Please understand that what they're doing is in my best interest.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part1=You give the monsters what they want, and they'll respect you.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part2=Who knows who their real boss is, but it's not me. They just pay me to disobey human morals.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_4.part1=How are you still here!? You really aren't going to like what's coming your way!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.go_trevor=Go trevor! You got this! You little Demon Zombie!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_5.part1=Fine! You've given me no choice! Time to meet your fate!

skyblock_dungeon_dialogues.overworld.desert.duneside_escape.sunny=Sunny
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.enter.part1=Hey, thanks so much for helping! Enter the escape tunnel and I'll close the door behind you.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part1=You're all alone from here on out.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part2=Oh no, those pesky Zombies have stolen the key to the next room. One of them is bound to have it.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part1=Good job! The lever to release the lava is just up ahead. Flip it to release the lava then run!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part2=You can't come back this way. This door needs to stay closed to protect Duneside!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part1=RUNNN!!!!! The lava is now released!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part2=Oh dear, the Zombies have taken another key. Take some of them out till you get the key again!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part1=Awesome! You've unlocked the next room!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part2=Oh dear, these evil Witches flipped off the power to the next door. You better turn all the switches back on.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part1=Great job. Time to keep moving...
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part2=Oh, what!? The Zombies took another key!? They're really not very inventive with these stalling techniques.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part3=And remember to hurry! That lava is gaining on you.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part1=Well done! These Zombies don't stand a chance against you. And that lava is doing so much work at clearing them out too!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part2=Oh, come on! More witches turning off the door's power!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_4.part1=Good job! It seems the Zombies have the key for the last door as well. You know what to do!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part1=Final stretch now! I think you should get rid of these spawners!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part2=The spawners will survive in the Lava, so it's best to get rid of them.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.exit.part1=Wow! You did it! Now run to the exit! RUNNN!!!

skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.name=Frank
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction1=Let's get this Bastion back under control.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction2=Piglins and Humans working together! Who'd have guessed!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction3=I hope I don't recognise any of these Zombified Piglins. I fear some of them used ot be my friends.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_start=Right, let's go close up this portal and get this Zombified Piglin infestation under control.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_halfway=I'll work on closing up the portal, you keep the infestation under control. Just don't die on me.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_almost=Okay, you've got this. I'll start work on closing this portal.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.clear_remaining=I DID IT! Portal closed! Clear out the remaining creatures and we'll move on!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_start=Good job! Time to deal with the next portal.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_halfway=Hopefully this next portal won't be as much trouble as that first one!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_almost=You know what to do! I'm back on portal duty! Keep me safe!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning1=Woah, do you mind getting this Zombified Piglin away from me.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning2=Aghh! That made me jump. Can you deal with this Zombified Piglin?
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning3=These Zombified Piglins are out of control. Please clear the way for me.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.portal_2_sealed=Second one done! That should be both the portals closed now. Now to just clean up.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.final_room_ahead=You got them all! There's one more room ahead. You go get it, and I'll stay here and inspect this portal.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.more_coming=Careful! There are a lot of them! I think their stronger units are now turning up to help defend!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.last_wave=Oh no, what's that? That's such a strong Zoglin! Be careful!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.victory=You did it! We took back the Bastion! Couldn't have done it without you! I'll start making myself at home again.
