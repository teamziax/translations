skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina=Adelina
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction1=¡Gracias por ayudarme a ponerme a salvo! ¡El mundo necesita más héroes como tú!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction2=¡Eres muy amable! ¡Preocuparte por mí incluso en estas condiciones!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step1=¡Hola! ¡Muchas gracias por ser tan valiente y ayudarnos!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step2=¡No sé qué pasó, estos Zombies salieron de la nada!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step3=¿Por qué están aquí estos Zombies? ¡Ya han tomado el control de mucho de Pumpkingdom!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step4=¡Hace apenas unos días, esto era un castillo próspero, y ahora todo el mundo se ha visto obligado a esconderse!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step5=¡Gracias por la ayuda! ¡Estoy muy agradecida!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie1=¡Ay, Dios mío! ¡Ese Zombie me da mucho miedo!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie2=¡Uf! ¡Ese me ha pillado desprevenida!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan=Bryan
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction1=Eyyy... Sigamos moviéndonos... ¡No te pares!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction2=¡No tenemos tiempo para hablar!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step1=¡Oh! ¡Por fin! ¡Ayuda! ¡Vamos!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step2=Llevo días esperando escondido ahí arriba. Nadie vino a ayudar.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step3=No estoy preparado para esto. No tengo armas. ¡Menos mal que te has decidido a rescatarme!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step4=Debería dejar de hablar y dejarte concentrar.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step5=Qué alivio. Estoy a salvo.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie1=¡UAU! ¡UN ZOMBIE! ¡Estoy demasiado asustado para moverme!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie2=¡Otro ZOMBIE! ¡Será mejor que te encargues de este primero!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella=Ella
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.interaction1=¡Tengo mucho miedo! ¿Puedes ayudarme?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step1=¡Ah! ¡Un compañero! ¡Vamos a ponernos a salvo!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step2=¡Qué bien tener a alguien con quien trabajar! ¡Estos Zombies no tienen ninguna oportunidad!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step3=¡Mírate, acumulando kills de Zombies a toda velocidad!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step4=Bueno, no soy tan fuerte como puedo parecer. Actúo con valentía, ¡pero hay que hacerlo en estas circunstancias!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step5=¡Gracias por la ayuda! ¡Perdona que no haya ayudado más! Sueño con ser tan valiente como tú algún día.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie1=¡Ven aquí, Zombie! ¡Vamos a pelear!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie2=¡Otro Zombie! ¡Sigamos peleando hasta eliminarlos a todos!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany=Giovany
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction1=Podemos lograr mucho hablando. A menos que sea con Zombies, ya que no escuchan mucho que digamos.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction2=¿Qué tal tu día? Con toda esta pelea, seguro que nadie se ha preocupado por ti y solo piensan en salvar su pellejo.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step1=¡Hola! Muchas gracias por la ayuda.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step2=¡Espero que estés bien! Solo puedo apoyar la moral de los aldeanos. Soy un pésimo luchador.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step3=Estoy tan agradecido de que existan personas como tú. Demasiados de los Guardias de Pumpkingdom huyeron al ver los Zombies.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step4=Llévame de vuelta y yo mantendré la moral de todos. Es una pena que no pueda ayudar más, colega. No soy luchador.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step5=¡Gracias! ¡Sé fuerte! ¡Sigue peleando! Yo cuidaré de la gente de aquí.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie1=No estoy entrenado para enfrentarme a este Zombie. Será mejor que te encargues tú.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie2=Querido Zombie. Hablemos... Oh... ¿No? ¡¡¡AAAHH, otro desobediente!!!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah=Noah
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction1=¿Te puedo interesar en comprar algo de comida?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction2=¿Crees que los Zombies sirven para trabajar en una tienda? ¿Puedo entrenar a uno?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction3=Mi tienda, no me lo puedo creer. Estaba allí un día, y rodeada de Zombies al siguiente.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step1=¡MI TIENDA! ¡No podemos abandonarla!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step2=¿Qué quieres decir con que debemos ponernos a salvo? ¿No podemos simplemente matar a todos los Zombies?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step3=Vaya, ¡hay tantísimos Zombies! No me había dado cuenta de que el problema era tan grave.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step4=Supongo que es lo mejor que me hayas rescatado. No puedo creer que haya perdido mi tienda. Era el trabajo de toda mi vida.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step5=Gracias, supongo. Algún día pásate por mi tienda. Volveré.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie1=¡Aléjate, Zombie aterrador!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie2=¡Por allí! ¡Ese, a ese!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick=Rodrick
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction1=Tengo curiosidad, ¿qué opinas sobre el motivo de todo esto? Es bastante raro que haya pasado tan rápido.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction2=Me pregunto si ese fuerte estruendo de hace unos días tuvo algo que ver.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step1=¡Hola! ¿Por qué vas por aquí? ¿No deberías ir por el otro lado?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step2=¿No sería más importante que vosotros, los soldados, descubrierais el origen de estos Zombies en lugar de ayudarnos?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step3=Tu ayuda se agradece, pero me preocupa que el problema no mejore hasta que conozcamos la razón detrás de esto.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step4=¿Viste ese ENORME pico morado que salió del suelo hace unos días? ¡Quizás deberías investigar eso!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step5=Gracias por traerme aquí, pero por favor investiga el origen. Esto no mejorará sin respuestas.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie1=¡Uf! ¡Un Zombie! Rápido, ocúpate de este.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie2=¡Tantos Zombies! ¡No puedo moverme con tantos alrededor!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie=Sadie
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction1=¿Quieres ser mi amigo? Me siento tan sola aquí fuera.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction2=Le tengo miedo a los desconocidos, pero más miedo a los Zombies.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step1=¡Oh! ¡Gracias! Estoy... Asustada :( ¿Hay que irse?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step2=No me lo puedo creer. He perdido mi hogar.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step3=También he perdido a mis amigos. ¿Puedes encontrarlos?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step4=Son tiempos tristes. Quiero meterme en la cama pero no puedo.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step5=¡Oh, bien! ¡Estoy a salvo! ¡Una cama! ¡Y comida! ¡Gracias, amigo!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie1=¡Aaaa! ¡Otro!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie2=¡Ayuda! ¡Se está acercando demasiado!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack=Zack
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction1=¿Por qué los Zombies roban calabazas y cosas así? ¿Podría ser que las llevan a algún sitio?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction2=Gracias por preocuparte por mí, pero estoy bien. He lidiado con mis propias guerras en el pasado. (Aunque la mayoría eran solo roedores comiendo mis cultivos)
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step1=Me llamo Zack. ¡No puedo creer que la ayuda haya llegado tan rápido para mí!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step2=Soy el agricultor de calabazas más duro y curtido que existe. Puedes rescatarme el último si quieres.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step3=He oído que la carne de Zombie es buena para las calabazas.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step4=Oh, espera, ¿no era la carne de esqueleto la buena para el crecimiento de los cultivos?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step5=Estos molestos Zombies también siguen robando mis calabazas. Espero seguir teniendo comida dentro de unas semanas.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step6=Gracias por traerme aquí. Voy a preparar comida para los demás supervivientes.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie1=¡Un zombie! ¡Ocúpate tú! Creo que este me robó mi calabaza.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie2=¡AAAAAHH! ¡Ese me ha pillado completamente desprevenido! No has visto nada.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.tushar=Tushar
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction1=Hola. Gracias por venir a ayudar con la limpieza de la mina. Lo necesitamos muchísimo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction2=¿De verdad crees que estás a la altura de esta tarea? Estas cuevas dan bastante miedo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step1=Gracias por aceptar ayudar.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step2=No hay tiempo para quedarse quieto. Debemos ponernos en marcha. Hablemos mientras caminamos.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step3=Así que estas son nuestras nuevas minas. Hace unos 10 años, se formó una enorme grieta en el mundo. Fue un desastre enorme en su momento.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step4=Sin embargo, esta sima que apareció de la noche a la mañana nos dio acceso a muchos más recursos que nunca.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step5=Rápidamente se convirtió en una gran empresa, recolectando estos recursos y vendiéndolos al mundo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step6=Pero desde el principio, estas criaturas han ido apareciendo poco a poco. Descubrimos que no les gustaba el fuego y eso las mantenía a raya.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step7=Pero no hace mucho, apagaron las llamas, ¡y ahora hemos perdido el control por completo! ¡Han invadido las cuevas desde entonces!
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step8=Necesito que entres en estas cuevas y vuelvas a encender las llamas. Eso nos permitirá recuperar el control.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step9=Empecemos con algo sencillo. Esta es la más pequeña de nuestras minas. Debería haber una llama cerca de la entrada para probar. Quédate cerca de ella para que se encienda de nuevo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step1=Vaya, qué fácil te ha parecido. Eres bastante duro. Vamos a la siguiente.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step2=Estas minas nos permiten recolectar el valioso lapislázuli. Normalmente, tendríamos que destilar el agua de los lagos para obtenerlo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step3=Ahora podemos minar lapislázuli directamente del suelo. Ha sido genial para el negocio por aquí estos últimos años.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step4=Aquí la tienes. Esta es un poco más grande, pero es lo mismo que la anterior.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step1=No puedo creer que hayas podido con eso. Una más y esta noche podremos todos descansar tranquilos.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step2=Los lugareños pensamos que estos monstruos llevan el lapislázuli a otro lugar. Sospechamos que trabajan para algo o alguien.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step3=Pero no sabemos adónde llevan todo ese lapislázuli. Alguien del pueblo dijo que vio a un Zombie hundirse en el suelo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step4=Solo podemos esperar que algún día se encuentre el origen de estas criaturas.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step5=Una última mina. Te deseo lo mejor. Esta es grande.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile1=Creo que deberías ocuparte de las hostilidades cercanas antes de que me mueva.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile2=Por favor, elimina a estos monstruos cercanos. No tengo fuego encima.
skyblock_dungeon_dialogues.overworld.jungle.lucien_lair.lucien=Lucien
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part1=¡Ya veo, has decidido enfrentarte a mi poder absolutamente inmenso!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part2=Mi ejército y yo trabajaremos para derrotarte. Debería ser pan comido.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part1=Veo que sigues aquí. Mis cómplices no están contentos de que los estés frenando.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part2=Por favor, entiende que lo que hacen es por mi bien.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part1=Dale a los monstruos lo que quieren y te respetarán.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part2=Quién sabe quién es su verdadero jefe, pero no soy yo. Solo me pagan para desobedecer la moral humana.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_4.part1=¡¿Cómo sigues aquí!? ¡Lo que se avecina no te va a gustar nada!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.go_trevor=¡Venga, Trevor! ¡Tú puedes! ¡Pequeño Zombie Demonio!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_5.part1=¡Bien! ¡No me has dejado otra opción! ¡Ha llegado tu hora!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.sunny=Sunny
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.enter.part1=¡Oye, muchas gracias por ayudar! Entra en el túnel de escape y yo cerraré la puerta detrás de ti.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part1=A partir de aquí vas solo.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part2=Vaya, esos malditos Zombies han robado la llave de la siguiente habitación. Alguno de ellos tiene que tenerla.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part1=¡Buen trabajo! La palanca para soltar la lava está justo ahí delante. ¡Actívala para soltar la lava y luego corre!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part2=¡No puedes volver por aquí. Esta puerta tiene que permanecer cerrada para proteger Duneside!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part1=¡¡¡CORREEEE!!!!! ¡La lava ya se ha soltado!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part2=¡Dios mío, los Zombies han conseguido otra llave. Elimina a algunos hasta que consigas la llave de nuevo!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part1=¡Genial! ¡Has desbloqueado la siguiente habitación!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part2=Dios mío, estas Brujas malvadas han cortado el suministro de energía de la siguiente puerta. Será mejor que vuelvas a activar todos los interruptores.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part1=Muy bien. Sigamos avanzando...
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part2=¡Oh, qué! ¿Los Zombies han conseguido otra llave? No son muy creativos con estas tácticas dilatorias.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part3=Y recuerda, ¡date prisa! Esa lava te está ganando terreno.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part1=¡Bien hecho! Estos Zombies no tienen ninguna oportunidad contra ti. ¡Y esa lava está haciendo un trabajo increíble limpiándolos!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part2=¡Venga ya! ¡Más Brujas cortando la energía de la puerta!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_4.part1=¡Buen trabajo! Parece que los Zombies también tienen la llave de la última puerta. ¡Ya sabes qué hacer!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part1=¡Ya queda poco! ¡Creo que deberías deshacerte de estos generadores!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part2=Los generadores sobrevivirán a la Lava, así que es mejor eliminarlos.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.exit.part1=¡¡¡Increíble!!! ¡Lo has conseguido! ¡Ahora corre hasta la salida! ¡¡¡CORREEEE!!!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.name=Frank
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction1=Vamos a recuperar el control de esta Bastion.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction2=¡Piglins y humanos trabajando juntos! ¿Quién lo habría dicho?
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction3=Espero no reconocer a ninguno de estos Piglins Zombificados. Temo que algunos de ellos fueran mis amigos.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_start=Bien, vamos a cerrar este portal y a controlar esta infestación de Piglins Zombificados.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_halfway=Yo me encargaré de cerrar el portal, tú mantén la infestación bajo control. Pero no te mueras.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_almost=Venga, tú puedes. Yo voy a empezar a cerrar este portal.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.clear_remaining=¡LO HE CONSEGUIDO! ¡Portal cerrado! ¡Elimina a las criaturas restantes y nos ponemos en marcha!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_start=¡Buen trabajo! Es hora de ocuparse del siguiente portal.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_halfway=¡Ojalá este siguiente portal no dé tantos problemas como el primero!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_almost=¡Ya sabes qué hacer! ¡Vuelvo a los portales! ¡Protégeme!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning1=Vaya, ¿te importaría alejar a este Piglin Zombificado de mí?
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning2=¡Aggh! Qué susto me ha dado. ¿Puedes encargarte de este Piglin Zombificado?
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning3=Estos Piglins Zombificados están descontrolados. Por favor, despeja el camino.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.portal_2_sealed=¡El segundo también hecho! Eso debería haber cerrado ambos portales. Ahora solo queda limpiar.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.final_room_ahead=¡Los has eliminado a todos! Queda una habitación más. Ve a por ella, y yo me quedo aquí a inspeccionar este portal.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.more_coming=¡Cuidado! ¡Son muchos! ¡Creo que sus unidades más fuertes están llegando para ayudar en la defensa!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.last_wave=¡Dios mío, qué es eso! ¡Es un Zoglin increíblemente fuerte! ¡Ten cuidado!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.victory=¡Lo conseguiste! ¡Recuperamos la Bastion! ¡No podría haberlo hecho sin ti! Voy a empezar a instalarme de nuevo.
