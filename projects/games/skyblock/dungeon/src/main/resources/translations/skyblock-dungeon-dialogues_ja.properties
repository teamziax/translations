skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina=Adelina
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction1=安全な場所に避難させてくれてありがとう！世界にはあなたのような人がもっといればいいな！
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction2=あなたはとっても優しい！こんな状況でも私のことを気にかけてくれて！
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step1=勇気を出してまで助けてくれて本当にありがとう！
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step2=何が起きたのかよくわからなかったけど、ゾンビ達が急に現れたことは覚えてるよ！
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step3=なんでまだここにゾンビ達がいるの？すでにゾンビ達はPumpkingdomを支配したはずなのに！
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step4=数日前まではここは賑やかで活気があったが、今はみんながゾンビ達から身を隠すしかなくなったんだ！
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step5=助けてくれてありがとう！本当に感謝してるよ！
