skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina=Adelina
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction1=شكراً لمساعدتك لي على الوصول إلى بر الأمان! العالم بحاجة إلى المزيد من الأبطال مثلك!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction2=أنت طيب جداً! تطمئن عليّ حتى في هذه الظروف!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step1=أوه مرحباً! شكراً جزيلاً لشجاعتك ومساعدتنا!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step2=لا أعرف ما الذي حدث، هؤلاء الزومبي ظهروا فجأة من لا مكان!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step3=لماذا الزومبي هنا أصلاً؟ لقد سيطروا بالفعل على معظم Pumpkingdom!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step4=قبل أيام قليلة فقط، كانت هذه قلعة مزدهرة، والآن اضطر الجميع للاختباء!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step5=شكراً على المساعدة! أنا ممتنة جداً!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie1=يا إلهي! هذا الزومبي مخيف جداً!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie2=واو! هذا أمسكني على حين غرة!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan=Bryan
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction1=هيييي... لنتابع المسير... لا تتوقف!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction2=ليس لدينا وقت للحديث!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step1=أوه! أخيراً! مساعدة! يالّاا
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step2=انتظرت أياماً مختبئاً هناك فوق. لم يأتِ أحد للمساعدة.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step3=أنا غير مجهّز لهذا. لا أملك أي سلاح. أنا سعيد لأنك اخترت إنقاذي!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step4=يجب أن أتوقف عن الكلام وأدعك تركّز.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step5=يا للراحة. أنا بأمان.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie1=واو! زومبي! أنا خائف جداً من الحركة!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie2=زومبي آخر! احرص على التخلص من هذا أولاً!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella=Ella
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.interaction1=أنا خائفة جداً! هل يمكنك مساعدتي؟
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step1=آه! رفيق! لنصل إلى بر الأمان!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step2=أنا سعيدة بوجود صديق للعمل معه! هؤلاء الزومبي لا فرصة لهم!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step3=انظر إليك، تتراكم الانتصارات ضد هؤلاء الزومبي!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step4=حسناً، أعترف أنني لست بالقوة التي أبدو عليها. أتصرف بشجاعة، لكن لا بد من ذلك في هذه الظروف!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step5=شكراً على المساعدة! آسفة لأنني لم أكن ذات فائدة كبيرة! أحلم بأن أكون شجاعة مثلك يوماً ما.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie1=تعال يا زومبي! لنتقاتل!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie2=زومبي آخر! لنستمر في القتال حتى ينتهي الأمر!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany=Giovany
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction1=يمكن تحقيق الكثير بالحوار. إلا مع الزومبي، فهم لا يسمعون حقاً.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction2=كيف يسير حالك؟ أنا متأكد أنه مع كل هذا القتال، لم يسأل عنك أحد واهتمّ الجميع فقط بأنفسهم.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step1=مرحباً! أقدّر المساعدة كثيراً.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step2=أتمنى أن تكون بخير! أنا فقط أستطيع دعم معنويات القرويين. أنا مقاتل سيء للغاية.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step3=أنا ممتن جداً لأشخاص مثلك. كثير من حراس Pumpkingdom فرّوا حين رأوا الزومبي.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step4=أوصلني للأمان وسأحافظ على معنويات الجميع. أتمنى لو كنت أستطيع المساعدة أكثر يا صديقي. أنا لست مقاتلاً.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step5=شكراً! استمر في الصمود! واصل القتال! سأهتم بالناس هنا.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie1=لم أتدرب على مواجهة هذا الزومبي. من الأفضل أن تتعامل معه أنت.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie2=أيها الزومبي العزيز. لنتحدث... أوه... لا؟ آه! زومبي آخر متمرد!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah=Noah
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction1=هل يمكنني أن أعرض عليك شراء بعض الطعام؟
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction2=هل تعتقد أن الزومبي يصلحون للعمل في متجر؟ هل يمكنني تدريب أحدهم؟
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction3=متجري، لا أصدق. كان موجوداً ذات يوم، ثم محاطاً بالزومبي في اليوم التالي.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step1=متجري! لا يمكننا تركه!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step2=ماذا تقصد أننا يجب أن نصل إلى بر الأمان؟ ألا يمكننا فقط قتل جميع الزومبي؟
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step3=واو، كم الزومبي كثيرون! لم أدرك أن المشكلة بهذا السوء.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step4=أعتقد أن من الأفضل أنك أنقذتني. لا أصدق أنني فقدت متجري. كان ذلك عمل حياتي.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step5=شكراً على أي حال. يوماً ما تفقّد متجري. سأعود.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie1=ابتعد أيها الزومبي المخيف!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie2=هناك! تخلّص من ذلك!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick=Rodrick
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction1=أنا فضولي، ما رأيك في سبب كل هذا؟ غريب أنه حدث بهذه السرعة.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction2=أتساءل إذا كان ذلك الدوي الصاخب قبل أيام له علاقة بهذا.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step1=مرحباً! لماذا تسير في هذا الاتجاه؟ بالتأكيد يجب أن تذهب في الاتجاه الآخر؟
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step2=أليس من الأهم لكم كجنود اكتشاف مصدر هؤلاء الزومبي بدلاً من مساعدتنا؟
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step3=مساعدتك محل تقدير، لكنني قلق من أن الوضع لن يتحسن حتى نعرف السبب وراء ذلك.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step4=هل رأيت ذلك الشوكة البنفسجية الضخمة التي ظهرت من الأرض قبل أيام؟ ربما يجب أن تفحص ذلك؟
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step5=شكراً لإيصالي إلى هنا، لكن من فضلك اذهب وحقق في المصدر. لن يتحسن الوضع بدون إجابات.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie1=واو! زومبي! بسرعة تعامل مع هذا.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie2=كم الزومبي كثيرون! لا أستطيع الحركة مع هذا العدد!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie=Sadie
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction1=هل ستكون صديقي؟ أشعر بوحدة شديدة هنا.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction2=أخشى الغرباء، لكنني أخشى الزومبي أكثر.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step1=أوه! شكراً! أنا... خائفة :( هل يجب أن نذهب؟
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step2=لا أصدق. لقد فقدت منزلي.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step3=فقدت أصدقائي أيضاً. هل يمكنك إيجادهم؟
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step4=هذه أوقات حزينة. أريد الانكماش في السرير لكنني لا أستطيع.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step5=أوه يا هلا! أنا بأمان! سرير! وطعام! شكراً يا صديقي!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie1=آه! آخر واحد!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie2=من فضلك ساعد! إنه يقترب جداً!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack=Zack
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction1=أتساءل لماذا يسرق الزومبي اليقطين وما شابه؟ هل ممكن أنهم يأخذونه إلى مكان ما؟
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction2=شكراً للاطمئنان عليّ، لكنني بخير. لقد خضت حروبي الخاصة في الماضي. (وإن كانت معظمها مجرد قوارض تأكل محاصيلي)
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step1=اسمي Zack. لا أصدق أن المساعدة وصلت بهذه السرعة!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step2=أنا أشد مزارعي اليقطين شكيمةً على وجه الأرض. يمكنك إنقاذي آخراً إذا أردت.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step3=سمعت أن لحم الزومبي جيد لليقطين.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step4=أوه، انتظر، ربما كان عظام الهيكل العظمي هي الجيدة لنمو المحاصيل؟
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step5=هؤلاء الزومبي المزعجون يسرقون يقطيني باستمرار. آمل أن يكون لدي طعام بعد بضعة أسابيع.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step6=شكراً لإيصالي إلى هنا. سأذهب لتحضير بعض الطعام للناجين الآخرين.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie1=زومبي! هل يمكنك التعامل معه! أعتقد أن هذا سرق يقطيني.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie2=واااه! هذا أمسكني على حين غرة تماماً! لم ترَ ردّ فعلي المبالغ فيه.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.tushar=Tushar
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction1=مرحباً. شكراً لقدومك للمساعدة في تطهير المنجم. نحن في أمسّ الحاجة لذلك.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction2=هل تعتقد فعلاً أنك مؤهل لهذه المهمة؟ هذه الكهوف مخيفة جداً.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step1=شكراً لموافقتك على المساعدة.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step2=لا وقت للوقوف. يجب أن نمشي. لنتحدث ونمشي في نفس الوقت.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step3=إذن هذه مناجمنا الجديدة. قبل نحو 10 سنوات، تشقّق هائل ظهر في الأرض. كانت كارثة كبيرة في ذلك الوقت.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step4=غير أن ظهور هذا الوادي ليلةً واحدة منحنا إمكانية الوصول إلى موارد أكثر بكثير مما كان من قبل.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step5=سرعان ما تحوّل إلى مشروع ضخم لحصاد هذه الموارد وبيعها للعالم.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step6=لكن منذ البداية، بدأت هذه المخلوقات تظهر تدريجياً. وجدنا أنها لا تحب النار، وكان ذلك يبقيها بعيدة.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step7=لكن قبل فترة وجيزة، أطفأوا النيران، وفقدنا السيطرة تماماً! اجتاحوا الكهوف منذ ذلك الحين!
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step8=أحتاجك للدخول إلى هذه الكهوف وإعادة إشعال النيران. سيمكّننا ذلك من استعادة السيطرة.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step9=لنبدأ ببساطة. هذا أصغر مناجمنا. يجب أن يكون هناك لهب قرب المدخل لتجربته. قف بجانبه ليُشعل من جديد.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step1=واو، جعلت ذلك يبدو سهلاً. أنت قوي جداً. لنذهب للتالي.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step2=هذه المناجم تتيح لنا حصاد اللازورد القيّم. في العادة، كنا نضطر إلى تقطير الماء من البحيرات لجمعه.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step3=الآن يمكننا تعدين اللازورد مباشرةً من الأرض. كان ذلك رائعاً للأعمال هنا في السنوات القليلة الماضية.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step4=حسناً، تفضّل. هذا أكبر قليلاً، لكنه مشابه للأول.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step1=لا أصدق أنك تعاملت مع ذلك. منجم أخير ونستطيع الارتياح الليلة.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step2=يعتقد السكان المحليون أن هذه الوحوش تأخذ اللازورد إلى مكان آخر. نظنّ أنها تعمل لصالح شيء ما أو شخص ما.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step3=لكننا لا نعرف أين تأخذ هذا اللازورد. أخبرني شخص في المدينة أنه رأى زومبي يختفي في الأرض.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step4=يوماً ما لا يمكننا إلا أن نأمل في حل مصدر هذه المخلوقات.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step5=منجم أخير واحد. أتمنى لك التوفيق. هذا كبير.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile1=أعتقد أنك يجب أن تتعامل مع التهديدات القريبة قبل أن أتحرك.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile2=من فضلك تخلّص من هذه الوحوش القريبة. ليس معي لهب.
skyblock_dungeon_dialogues.overworld.jungle.lucien_lair.lucien=Lucien
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part1=أرى، لقد قررت مواجهة قوتي الهائلة المطلقة!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part2=جيشي وأنا سنعمل على إسقاطك. سيكون أمراً سهلاً.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part1=أرى أنك لا تزال هنا. شركائي في الجريمة لا يسعدهم أنك توقفنا.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part2=أرجو أن تتفهم أن ما يفعلونه في مصلحتي.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part1=أعطِ الوحوش ما تريد وستحترمك.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part2=لا أحد يعرف من هو رئيسهم الحقيقي، لكنه ليس أنا. هم فقط يدفعون لي لخرق المعايير البشرية.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_4.part1=كيف لا تزال هنا؟! لن يعجبك ما هو قادم!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.go_trevor=إلى الأمام Trevor! أنت قادر على ذلك! أيها الزومبي الشيطاني الصغير!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_5.part1=حسناً! لم تتركني خياراً! حان وقت لقاء مصيرك!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.sunny=Sunny
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.enter.part1=مرحباً، شكراً جزيلاً على المساعدة! ادخل نفق الهروب وسأغلق الباب خلفك.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part1=أنت وحدك من هنا فصاعداً.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part2=يا حسرتي، هؤلاء الزومبي المزعجون سرقوا مفتاح الغرفة التالية. واحد منهم بالتأكيد يملكه.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part1=أحسنت! الرافعة لإطلاق الحمم في الأمام. اقلبها لإطلاق الحمم ثم اركض!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part2=لا يمكنك العودة من هذا الطريق. يجب أن يبقى هذا الباب مغلقاً لحماية Duneside!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part1=اركض!!!!! الحمم مُطلَقة الآن!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part2=يا إلهي، أخذ الزومبي مفتاحاً آخر. تخلّص من بعضهم حتى تحصل على المفتاح مجدداً!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part1=رائع! لقد فتحت الغرفة التالية!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part2=يا حسرتي، هؤلاء الساحرات الأشريرات أوقفن الكهرباء عن الباب التالي. من الأفضل أن تُعيد تشغيل جميع المفاتيح.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part1=عمل رائع. حان وقت الاستمرار...
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part2=أوه، ماذا؟! أخذ الزومبي مفتاحاً آخر؟! إنهم ليسوا مبدعين حقاً في أساليب التأخير هذه.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part3=وتذكر أن تتسرع! الحمم تلحق بك.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part1=أحسنت! هؤلاء الزومبي لا فرصة لهم أمامك. وتلك الحمم تقوم بعمل رائع في تطهيرهم أيضاً!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part2=لا يعقل! المزيد من الساحرات يوقفن كهرباء الباب!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_4.part1=أحسنت! يبدو أن الزومبي لديهم أيضاً مفتاح الباب الأخير. أنت تعرف ماذا تفعل!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part1=الجولة الأخيرة الآن! أعتقد أنك يجب أن تتخلص من هذه المولّدات!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part2=ستبقى المولّدات حية في الحمم، لذا من الأفضل التخلص منها.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.exit.part1=واو! نجحت! الآن اركض إلى المخرج! اركض!!!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.name=Frank
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction1=لنستعيد السيطرة على هذه القلعة.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction2=Piglins وبشر يعملون معاً! من كان سيتوقع ذلك!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction3=آمل ألا أتعرف على أي من هؤلاء Zombified Piglins. أخشى أن بعضهم كانوا أصدقائي.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_start=حسناً، لنذهب لإغلاق هذه البوابة والسيطرة على غزو Zombified Piglin.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_halfway=سأعمل على إغلاق البوابة، وأنت تبقي الغزو تحت السيطرة. فقط لا تمت عليّ.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_almost=حسناً، أنت قادر على ذلك. سأبدأ العمل على إغلاق هذه البوابة.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.clear_remaining=نجحت! البوابة مغلقة! تخلّص من المخلوقات المتبقية وننتقل!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_start=عمل رائع! حان وقت التعامل مع البوابة التالية.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_halfway=آمل ألا تسبّب هذه البوابة التالية متاعب كالأولى!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_almost=تعرف ماذا تفعل! أنا عائد إلى مهمة البوابة! احمني!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning1=واو، هل يمكنك إبعاد هذا Zombified Piglin عني.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning2=آه! جعلني أقفز. هل يمكنك التعامل مع هذا Zombified Piglin؟
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning3=هؤلاء Zombified Piglins خارجون عن السيطرة. من فضلك امهّد لي الطريق.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.portal_2_sealed=انتهينا من الثانية! يجب أن تكون كلتا البوابتين مغلقتين الآن. حان وقت التنظيف.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.final_room_ahead=أنهيت عليهم جميعاً! توجد غرفة أخيرة أمامك. اذهب وتعامل معها، وأنا سأبقى هنا لأفحص هذه البوابة.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.more_coming=انتبه! عددهم كثير! أعتقد أن وحداتهم الأقوى تأتي الآن للدفاع!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.last_wave=لا يا إلهي، ما هذا؟ هذا Zoglin قوي جداً! انتبه!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.victory=نجحت! استعدنا القلعة! ما كنت لأستطيع فعل ذلك بدونك! سأبدأ في تجعل نفسي مرتاحاً هنا مجدداً.
