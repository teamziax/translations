skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina=Adelina
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction1=Danke, dass du mir in Sicherheit geholfen hast! Die Welt braucht mehr Helden wie dich!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction2=Du bist so süß! Du schaust sogar unter diesen Bedingungen nach mir!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step1=Oh hallo! Vielen Dank, dass du so mutig bist und uns hilfst!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step2=Ich weiß nicht, was passiert ist – diese Zombies kamen einfach aus dem Nichts!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step3=Warum sind diese Zombies hier? Sie haben schon so viel von Pumpkingdom unter ihre Kontrolle gebracht!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step4=Noch vor wenigen Tagen war das hier ein blühendes Schloss, jetzt wurde alle in den Untergrund gezwungen!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step5=Danke für die Hilfe! Ich bin so dankbar!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie1=Ach du meine Güte! Dieser Zombie ist so gruselig!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie2=Wow! Der hat mich völlig überrascht!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan=Bryan
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction1=Heyyy... Weiter, weiter... Nicht anhalten!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction2=Keine Zeit zum Reden!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step1=Oh! Endlich! Hilfe! Los geht's!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step2=Ich habe tagelang dort oben versteckt gewartet. Niemand kam zu helfen.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step3=Ich bin nicht dafür ausgerüstet. Ich habe keine Waffen. Bin froh, dass du mich gerettet hast!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step4=Ich sollte aufhören zu reden und dich konzentrieren lassen.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step5=Was für eine Erleichterung. Ich bin in Sicherheit.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie1=WOAH! EIN ZOMBIE! Ich bin zu verängstigt zum Bewegen!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie2=Noch ein ZOMBIE! Kümmere dich lieber zuerst um den!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella=Ella
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.interaction1=Ich habe so Angst! Kannst du mir helfen?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step1=Ahh! Ein Teamkamerad! Komm, in Sicherheit!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step2=Gut, dass ich jemanden habe, mit dem ich zusammenarbeiten kann! Diese Zombies haben keine Chance!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step3=Schau dir das an – du stapelst die Abschüsse auf diese Zombies!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step4=Okay, ich bin nicht so stark, wie ich vielleicht wirke. Ich tue so, als ob ich tough wäre, aber in diesen Umständen muss man das ja!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step5=Danke für die Hilfe! Tut mir leid, dass ich nicht mehr tun konnte! Ich träume davon, eines Tages so tough wie du zu sein.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie1=Komm her, Zombie! Auf in den Kampf!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie2=Noch ein Zombie! Weiter kämpfen, bis alle weg sind!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany=Giovany
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction1=Mit Reden kann man viel erreichen. Außer mit Zombies – die hören nicht wirklich zu.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction2=Wie läuft's bei dir? Ich bin sicher, dass bei all diesem Kampf niemand nach dir geschaut hat und alle nur an ihre eigene Haut denken.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step1=Hey! Vielen Dank für die Hilfe.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step2=Hoffe, es geht dir gut! Ich kann nur die Moral der Dorfbewohner stärken. Als Kämpfer bin ich eine Katastrophe.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step3=Ich bin so dankbar für Menschen wie dich. Zu viele von Pumpkingdoms Wachen sind einfach geflohen, als sie die Zombies sahen.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step4=Bring mich raus und ich kümmere mich um die Moral aller. Schade, dass ich nicht mehr helfen kann. Ich bin halt kein Kämpfer.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step5=Danke! Bleib stark! Weiterkämpfen! Ich kümmere mich hier um die Leute.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie1=Ich bin nicht darauf trainiert, mit diesem Zombie umzugehen. Das ist deine Aufgabe.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie2=Lieber Zombie. Lass uns reden... Oh... Nein? AHHH, noch ein ungehorsamer hier!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah=Noah
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction1=Kann ich dich zu etwas Essen überreden?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction2=Denkst du, Zombies taugen als Ladenverkäufer? Kann ich einen trainieren?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction3=Mein Laden, ich kann es nicht fassen. Eines Tages war er da, und am nächsten war er von Zombies umzingelt.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step1=MEIN LADEN! Wir können ihn nicht zurücklassen!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step2=Was meinst du, wir müssen uns in Sicherheit bringen? Können wir nicht einfach alle Zombies töten?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step3=Wow, da sind so viele Zombies! Ich hatte nicht geahnt, wie schlimm das Problem ist.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step4=Ich schätze, es war das Beste, dass du mich gerettet hast. Ich kann es nicht fassen, dass ich meinen Laden verloren habe. Das war das Werk meines Lebens.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step5=Danke, schätze ich. Schau eines Tages in meinem Laden vorbei. Ich komme zurück.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie1=Weg von hier, gruseligem Zombie!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie2=Da drüben! Kümmere dich um den!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick=Rodrick
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction1=Ich frage mich, was du über den Grund all dessen denkst? Ein bisschen seltsam, dass es so schnell passiert ist.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction2=Ich frage mich, ob der laute Knall vor ein paar Tagen damit zu tun hatte.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step1=Hey! Warum gehst du in diese Richtung? Du solltest doch eigentlich in die andere Richtung gehen?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step2=Wäre es nicht wichtiger für euch Soldaten, die Quelle dieser Zombies herauszufinden, anstatt uns zu helfen?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step3=Deine Hilfe wird geschätzt, aber ich befürchte, dass das Problem nicht besser wird, bis wir den Grund dafür kennen.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step4=Hast du gesehen, wie vor ein paar Tagen dieser RIESIGE violette Stachel aus dem Boden ragte? Vielleicht solltest du das untersuchen?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step5=Danke, dass du mich hergebracht hast, aber bitte geh die Quelle untersuchen. Das wird sich nicht bessern, ohne Antworten zu finden.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie1=Woah! Ein Zombie! Schnell, kümmere dich um den.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie2=So viele Zombies! Ich kann mich mit so vielen davon nicht bewegen!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie=Sadie
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction1=Willst du mein Freund sein? Ich fühle mich hier so allein.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction2=Ich habe Angst vor Fremden, aber noch mehr Angst vor Zombies.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step1=Oh! Danke! Ich bin... Verängstigt :( Müssen wir wirklich gehen?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step2=Ich kann es nicht fassen. Ich habe mein Zuhause verloren.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step3=Ich habe auch meine Freunde verloren. Kannst du sie finden?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step4=Das sind traurige Zeiten. Ich möchte mich ins Bett verkriechen, aber ich kann nicht.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step5=Oh toll! Ich bin in Sicherheit! Ein Bett! Und Essen! Danke, Freund!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie1=Aaaa! Noch einer!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie2=Bitte hilf! Er kommt zu nah!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack=Zack
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction1=Warum stehlen Zombies Kürbisse und so? Könnten sie irgendwo hinbringen?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction2=Danke, dass du nach mir schaust, aber mir geht's gut. Ich habe in der Vergangenheit meine eigenen Kriege ausgestanden. (Meistens nur Nagetiere, die meine Ernte fraßen)
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step1=Ich heiße Zack. Ich kann nicht glauben, dass so schnell Hilfe kam!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step2=Ich bin der hartgesottenste Kürbisbauer weit und breit. Du kannst mich ruhig als letzten retten.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step3=Ich habe gehört, dass Zombie-Fleisch gut für Kürbisse ist.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step4=Oh, warte, war es vielleicht Skelett-Fleisch, das gut für das Pflanzenwachstum ist?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step5=Diese lästigen Zombies klauen auch ständig meine Kürbisse. Ich hoffe, ich habe in ein paar Wochen noch Essen.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step6=Danke, dass du mich hergebracht hast. Ich gehe mal Essen für die anderen Überlebenden vorbereiten.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie1=Ein Zombie! Kannst du den übernehmen! Ich glaube, der hat meinen Kürbis gestohlen.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie2=WAAAAHH! Der hat mich total überrascht! Du hast meine Überreaktion nicht gesehen.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.tushar=Tushar
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction1=Hey. Danke, dass du zur Hilfe bei der Minen-Säuberung gekommen bist. Wir brauchen das dringend.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction2=Glaubst du wirklich, du bist für diese Aufgabe gewachsen? Diese Höhlen sind ziemlich gruselig.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step1=Danke, dass du zugestimmt hast zu helfen.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step2=Keine Zeit zum Stehenbleiben. Wir müssen los. Lass uns gehen und reden.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step3=Das sind also unsere brandneuen Minen. Vor etwa 10 Jahren entstand ein riesiger Riss in der Welt. Das war damals eine riesige Katastrophe.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step4=Doch dieser Riss, der über Nacht erschien, gab uns Zugang zu weit mehr Ressourcen als je zuvor.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step5=Er wurde schnell zu einem riesigen Unternehmen ausgebaut, das diese Ressourcen abbaut und sie an die Welt verkauft.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step6=Aber seit Anfang an tauchen diese Kreaturen langsam auf. Wir fanden heraus, dass sie kein Feuer mögen, und das hielt sie in Schach.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step7=Aber vor nicht allzu langer Zeit haben sie die Flammen gelöscht, und jetzt haben wir die Kontrolle verloren! Sie haben die Höhlen seitdem überschwemmt!
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step8=Ich brauche dich, damit du in diese Höhlen gehst und die Flammen wieder entzündest. Damit können wir die Kontrolle zurückgewinnen.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step9=Fangen wir einfach an. Das ist die kleinste unserer Minen. Es sollte eine Flamme nahe dem Eingang zum Testen geben. Stell dich in ihre Nähe, um sie wieder zu entzünden.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step1=Wow, das hat einfach ausgesehen. Du bist echt tough. Weiter zum nächsten.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step2=Diese Minen ermöglichen es uns, das wertvolle Lapislazuli abzubauen. Normalerweise müssten wir das Wasser aus den Seen destillieren, um es zu gewinnen.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step3=Jetzt können wir Lapislazuli direkt aus dem Boden abbauen. Das war in den letzten Jahren großartig für das Geschäft hier.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step4=Gut, da wären wir. Diese ist etwas größer, aber sonst gleich wie die letzte.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step1=Ich kann nicht glauben, dass du das geschafft hast. Noch eine, und wir können heute Nacht alle ruhig schlafen.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step2=Wir Einheimischen glauben, dass diese Monster das Lapislazuli woanders hinbringen. Wir vermuten, dass sie für irgendjemanden oder etwas arbeiten.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step3=Aber wir wissen nicht, wo sie all dieses Lapislazuli hinbringen. Jemand in der Stadt sagte, er hätte einen Zombie gesehen, der in den Boden verschwand.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step4=Eines Tages können wir nur hoffen, dass die Quelle dieser Kreaturen beseitigt wird.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step5=Eine letzte Mine. Ich wünsche dir das Beste. Diese ist groß.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile1=Ich denke, du solltest dich erst um die Feinde in der Nähe kümmern, bevor ich mich bewege.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile2=Bitte erledige diese Monster in der Nähe. Ich habe keine Flamme bei mir.
skyblock_dungeon_dialogues.overworld.jungle.lucien_lair.lucien=Lucien
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part1=Ich sehe, du hast beschlossen, meine absolut immense Macht herauszufordern!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part2=Meine Armee und ich werden dich zur Strecke bringen. Ein Kinderspiel.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part1=Ich sehe, du bist noch hier. Meine Komplizen sind nicht erfreut, dass du uns aufhältst.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part2=Bitte verstehe, dass das, was sie tun, in meinem besten Interesse ist.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part1=Gib den Monstern, was sie wollen, und sie werden dich respektieren.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part2=Wer weiß, wer ihr eigentlicher Chef ist, aber ich bin es nicht. Sie bezahlen mich nur dafür, menschliche Moral zu missachten.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_4.part1=Wie bist du noch immer hier!? Du wirst nicht mögen, was als nächstes kommt!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.go_trevor=Los, Trevor! Du schaffst das! Du kleiner Dämonenzombie!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_5.part1=Gut! Du hast mir keine Wahl gelassen! Zeit, dein Schicksal zu erfüllen!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.sunny=Sunny
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.enter.part1=Hey, danke für die Hilfe! Betritt den Fluchttunnel und ich schließe die Tür hinter dir.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part1=Von hier an bist du auf dich allein gestellt.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part2=Oh nein, diese lästigen Zombies haben den Schlüssel zum nächsten Raum gestohlen. Einer von ihnen muss ihn haben.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part1=Gut gemacht! Der Hebel zum Freisetzen der Lava ist direkt da vorne. Leg ihn um, um die Lava freizusetzen, dann lauf!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part2=Du kannst nicht mehr zurück. Diese Tür muss geschlossen bleiben, um Duneside zu schützen!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part1=RENNNN!!!!! Die Lava ist jetzt freigesetzt!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part2=Oh je, die Zombies haben noch einen Schlüssel gestohlen. Erledige einige von ihnen, bis du den Schlüssel zurückbekommst!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part1=Super! Du hast den nächsten Raum entsperrt!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part2=Oh je, diese bösen Hexen haben den Strom zur nächsten Tür abgeschaltet. Dreh alle Schalter wieder ein.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part1=Gute Arbeit. Zeit, weiterzumachen...
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part2=Oh, was!? Die Zombies haben noch einen Schlüssel genommen!? Die sind wirklich nicht sehr einfallsreich mit diesen Verzögerungstaktiken.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part3=Und denk daran, beeil dich! Die Lava holt auf dich auf.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part1=Gut gemacht! Diese Zombies haben keine Chance gegen dich. Und die Lava macht auch gute Arbeit dabei, sie wegzuräumen!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part2=Oh komm schon! Noch mehr Hexen, die den Strom der Tür abschalten!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_4.part1=Gut gemacht! Es scheint, als hätten die Zombies auch den Schlüssel für die letzte Tür. Du weißt, was zu tun ist!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part1=Letzte Runde jetzt! Ich glaube, du solltest diese Spawner loswerden!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part2=Die Spawner überleben in der Lava, also ist es am besten, sie loszuwerden.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.exit.part1=Wow! Du hast es geschafft! Jetzt lauf zum Ausgang! RENNNN!!!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.name=Frank
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction1=Lass uns diese Bastion wieder unter Kontrolle bringen.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction2=Piglins und Menschen arbeiten zusammen! Wer hätte das gedacht!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction3=Ich hoffe, ich erkenne keinen dieser Zombified Piglins. Ich befürchte, dass einige von ihnen früher meine Freunde waren.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_start=Los, lass uns dieses Portal schließen und den Zombified Piglin-Befall unter Kontrolle bringen.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_halfway=Ich kümmere mich darum, das Portal zu schließen. Du hältst den Befall unter Kontrolle. Und stirb mir bloß nicht.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_almost=Okay, du schaffst das. Ich fange an, dieses Portal zu schließen.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.clear_remaining=ICH HABE ES GESCHAFFT! Portal geschlossen! Räume die restlichen Kreaturen weg und dann weiter!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_start=Gut gemacht! Zeit, das nächste Portal zu erledigen.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_halfway=Hoffentlich macht uns das nächste Portal nicht so viel Ärger wie das erste!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_almost=Du weißt, was zu tun ist! Ich bin wieder am Portal! Halt mich in Sicherheit!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning1=Woah, kannst du diesen Zombified Piglin von mir fernhalten.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning2=Aghh! Das hat mich erschreckt. Kannst du dich um diesen Zombified Piglin kümmern?
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning3=Diese Zombified Piglins sind außer Kontrolle. Bitte mach mir den Weg frei.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.portal_2_sealed=Das zweite fertig! Damit sollten beide Portale geschlossen sein. Jetzt noch aufräumen.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.final_room_ahead=Du hast sie alle! Da vorne ist noch ein Raum. Geh rein und erledige das, ich bleibe hier und untersuche dieses Portal.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.more_coming=Vorsicht! Es sind viele! Ich glaube, ihre stärkeren Einheiten kommen jetzt auch zur Verteidigung!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.last_wave=Oh nein, was ist das? Das ist ein extrem starker Zoglin! Sei vorsichtig!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.victory=Du hast es geschafft! Wir haben die Bastion zurückerobert! Ohne dich wäre das nicht möglich gewesen! Ich fange an, es mir hier wieder gemütlich zu machen.
