skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina=Adelina
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction1=Merci de m'avoir mise en sécurité ! Le monde a besoin de plus de héros comme toi !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction2=T'es trop mignon ! Tu viens prendre de mes nouvelles même dans ces conditions !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step1=Oh, salut ! Merci beaucoup d'être courageux et de nous aider !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step2=Je sais pas ce qui s'est passé, ces Zombies ont surgi de nulle part !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step3=Mais pourquoi ces Zombies sont là ? Ils ont déjà pris le contrôle d'une grande partie de Pumpkingdom !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step4=Il y a quelques jours à peine, c'était un château prospère, maintenant tout le monde est obligé de se cacher !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step5=Merci pour ton aide ! Je suis tellement reconnaissante !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie1=Oh mon dieu ! Ce Zombie me fait vraiment peur !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie2=Ouah ! Celui-là m'a prise par surprise !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan=Bryan
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction1=Heyyyy... On continue... Pas d'arrêt !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction2=On n'a pas le temps de parler !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step1=Oh ! Enfin ! Du renfort ! Allons-y !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step2=J'attendais depuis des jours là-haut en me cachant. Personne n'est venu aider.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step3=Je suis pas équipé pour ça. J'ai pas d'armes. Content que tu aies choisi de me sauver !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step4=Je devrais arrêter de parler et te laisser te concentrer.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step5=Quel soulagement. Je suis en sécurité.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie1=OUAH ! UN ZOMBIE ! J'ai trop peur pour bouger !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie2=Encore un ZOMBIE ! T'as intérêt à t'en occuper en premier !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella=Ella
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.interaction1=J'ai trop peur ! Tu peux m'aider ?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step1=Ahh ! Un coéquipier ! Allons nous mettre en sécurité !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step2=Content d'avoir un ami pour travailler ensemble ! Ces Zombies n'ont aucune chance !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step3=Regarde-toi aller, t'accumules vraiment les kills sur ces Zombies !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step4=OK, j'avoue, je suis pas aussi forte que j'en ai l'air. Je fais la dure, mais c'est obligé dans ces circonstances !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step5=Merci pour ton aide ! Désolée de pas t'avoir été plus utile ! Je rêve d'être aussi forte que toi un jour.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie1=Viens ici Zombie ! On se bat !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie2=Encore un Zombie ! On continue à se battre jusqu'à ce qu'ils soient tous éliminés !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany=Giovany
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction1=On peut accomplir beaucoup en discutant. Sauf avec des Zombies, eux n'écoutent vraiment pas.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction2=Comment tu vas ? Je suis sûr qu'avec tout ce combat, personne t'a demandé des nouvelles, tout le monde pense à sa propre peau.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step1=Salut ! J'apprécie vraiment l'aide.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step2=J'espère que tu vas bien ! Moi je peux juste remonter le moral des villageois. Je suis un piètre combattant.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step3=Je suis tellement reconnaissant envers des gens comme toi. Trop de gardes de Pumpkingdom ont juste fui en voyant les Zombies.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step4=Ramène-moi et je maintiendrai le moral de tout le monde. Dommage que je puisse pas aider davantage, pote. Je suis pas un combattant.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step5=Merci ! Reste fort ! Continue à te battre ! Je vais m'occuper des gens ici.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie1=Je suis pas formé pour affronter ce Zombie. Tu ferais mieux de t'en charger.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie2=Cher Zombie. Parlons... Oh... non ? AHHH, encore un récalcitrant !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah=Noah
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction1=Je peux t'intéresser à acheter de la nourriture ?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction2=Tu crois que les Zombies feraient de bons vendeurs ? Je peux en former un ?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction3=Ma boutique, j'arrive pas à y croire. Elle était là un jour, et entourée de Zombies le lendemain.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step1=MA BOUTIQUE ! On peut pas partir !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step2=Qu'est-ce que tu veux dire qu'on doit se mettre en sécurité ? On peut pas juste tuer tous les Zombies ?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step3=Oh la vache, y'a tellement de Zombies ! J'avais pas réalisé que le problème était aussi grave.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step4=Je suppose que c'est mieux que tu m'aies sauvé. Je peux pas croire que j'ai perdu ma boutique. C'était le travail de ma vie.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step5=Merci, j'imagine. Un jour, passe voir ma boutique. Je reviendrai.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie1=Recule, sale Zombie !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie2=Là ! Occupe-toi de celui-là !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick=Rodrick
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction1=Je suis curieux, qu'est-ce que tu penses être la cause de tout ça ? C'est quand même bizarre que ça soit arrivé si vite.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction2=Je me demande si le gros bang d'il y a quelques jours avait un rapport avec ça.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step1=Salut ! Pourquoi tu vas par là ? Tu devrais sûrement aller dans l'autre sens ?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step2=Ce serait pas plus important pour des soldats comme vous de trouver la source de ces Zombies, plutôt que de nous aider ?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step3=Ton aide est appréciée, mais je crains que le problème ne s'arrange pas tant qu'on en connaît pas la raison.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step4=T'as vu cette ÉNORME pointe violette sortir du sol il y a quelques jours ? Tu devrais peut-être aller y jeter un œil ?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step5=Merci de m'avoir ramené ici, mais s'il te plaît, va enquêter sur la source. Ça n'ira pas mieux sans réponses.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie1=Ouah ! Un Zombie ! Vite, occupe-toi de celui-là.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie2=Tellement de Zombies ! Je peux pas bouger avec autant d'eux autour de moi !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie=Sadie
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction1=Tu veux bien être mon ami ? Je me sens tellement seule ici.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction2=J'ai peur des inconnus, mais encore plus peur des Zombies.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step1=Oh ! Merci ! Je... J'ai peur :( On doit vraiment y aller ?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step2=J'arrive pas à y croire. J'ai perdu ma maison.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step3=J'ai perdu mes amis aussi. Tu peux les trouver ?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step4=C'est des moments tristes. J'voudrais m'enrouler dans mon lit mais je peux pas.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step5=Oh super ! Je suis en sécurité ! Un lit ! Et à manger ! Merci mon ami !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie1=Ahhh ! Encore un !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie2=Aide-moi ! Il se rapproche trop !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack=Zack
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction1=Pourquoi les Zombies volent-ils des citrouilles et des trucs ? Ils les emmèneraient quelque part ?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction2=Merci de passer voir, mais je vais bien. J'ai déjà vécu des guerres à ma façon par le passé. (Surtout des rongeurs qui mangeaient mes récoltes)
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step1=Je m'appelle Zack. J'arrive pas à croire que l'aide soit arrivée si vite !
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step2=Je suis le plus robuste des cultivateurs de citrouilles en vie. Tu peux me sauver en dernier si tu veux.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step3=J'entends dire que la chair de Zombie serait bonne pour les citrouilles.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step4=Oh, attends, c'était peut-être la chair de squelette qui était bonne pour la croissance des récoltes ?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step5=Ces Zombies agaçants continuent aussi à me voler mes citrouilles. J'espère qu'il me restera de la nourriture dans quelques semaines.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step6=Merci de m'avoir emmené ici. Je vais préparer à manger pour les autres survivants.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie1=Un zombie ! Tu peux t'en occuper ! Je crois que c'est lui qui a volé ma citrouille.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie2=WAAAAHH ! Celui-là m'a totalement pris par surprise ! T'as pas vu ma réaction exagérée.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.tushar=Tushar
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction1=Salut. Merci d'être venu aider pour le nettoyage de la mine. On en a vraiment grand besoin.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction2=Tu crois vraiment que t'es à la hauteur de cette tâche ? Ces cavernes sont vraiment flippantes.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step1=Merci d'avoir accepté d'aider.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step2=Pas le temps de rester sur place. Il faut y aller. On marche et on parle.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step3=Voilà nos toutes nouvelles mines. Il y a environ 10 ans, une immense fissure s'est formée dans le monde. C'était une catastrophe monumentale à l'époque.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step4=Cependant, ce ravin apparu du jour au lendemain nous a donné accès à bien plus de ressources qu'avant.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step5=Il a vite été transformé en une grande entreprise, récoltant ces ressources et les vendant au monde entier.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step6=Mais depuis le début, ces créatures sont apparues peu à peu. On a découvert qu'elles n'aimaient pas le feu et ça les tenait à distance.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step7=Mais il n'y a pas si longtemps, elles ont éteint les flammes, et là on a complètement perdu le contrôle ! Elles ont envahi les cavernes depuis !
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step8=J'ai besoin que tu entres dans ces cavernes et rallumes les flammes. Ça nous permettra de reprendre le contrôle.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step9=Commençons simple. C'est la plus petite de nos mines. Il devrait y avoir une flamme près de l'entrée pour s'entraîner. Reste près d'elle pour la rallumer.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step1=Ouah, t'as rendu ça facile. T'es vraiment costaud. Allons au suivant.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step2=Ces mines nous permettent de récolter du lapis précieux. D'habitude, il fallait distiller l'eau des lacs pour le recueillir.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step3=Maintenant on peut extraire le lapis directement du sol. Ça a vraiment été excellent pour le commerce par ici ces dernières années.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step4=Allez, c'est parti. Celle-là est un peu plus grande, mais pareil que la dernière.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step1=J'arrive pas à croire que t'aies géré ça. Encore une et on peut tous se reposer tranquillement ce soir.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step2=Nous les habitants, on pense que ces monstres emportent ce lapis ailleurs. On soupçonne qu'ils travaillent pour quelque chose ou quelqu'un.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step3=Mais on sait pas où ils emportent tout ce lapis. Quelqu'un en ville a dit avoir vu un Zombie s'enfoncer dans le sol.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step4=Un jour, on peut seulement espérer que la source de ces créatures sera réglée.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step5=Dernière mine. Je te souhaite bonne chance. Celle-là est grande.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile1=Je pense que tu devrais t'occuper des hostilités à proximité avant que je bouge.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile2=S'il te plaît, élimine ces monstres à proximité. Je n'ai pas de flamme sur moi.
skyblock_dungeon_dialogues.overworld.jungle.lucien_lair.lucien=Lucien
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part1=Je vois, tu as décidé de t'attaquer à ma puissance absolument immense !
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part2=Mon armée et moi allons t'abattre. Ce devrait être un jeu d'enfant.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part1=Je vois que t'es encore là. Mes associés ne sont pas contents que tu nous arrêtes.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part2=Comprends bien que ce qu'ils font est dans mon intérêt.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part1=Tu donnes aux monstres ce qu'ils veulent, et ils te respecteront.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part2=Qui sait qui est leur vrai patron, mais c'est pas moi. Ils me paient juste pour transgresser la morale humaine.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_4.part1=Comment t'es encore là !? Tu vas vraiment pas aimer ce qui t'attend !
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.go_trevor=Vas-y Trevor ! T'as ce qu'il faut ! Petit Zombie Démoniaque !
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_5.part1=Bien ! Tu m'as laissé sans choix ! L'heure de ton destin a sonné !
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.sunny=Sunny
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.enter.part1=Hé, merci beaucoup pour ton aide ! Entre dans le tunnel d'évasion et je ferme la porte derrière toi.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part1=Tu es seul à partir de là.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part2=Oh non, ces satanés Zombies ont volé la clé de la salle suivante. L'un d'eux doit l'avoir.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part1=Bien joué ! Le levier pour libérer la lave est juste devant. Actionne-le pour libérer la lave puis cours !
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part2=Tu peux pas revenir en arrière. Cette porte doit rester fermée pour protéger Duneside !
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part1=COURS !!!!! La lave est maintenant libérée !
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part2=Oh mince, les Zombies ont pris une autre clé. Élimine-en quelques-uns jusqu'à récupérer la clé !
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part1=Super ! Tu as débloqué la salle suivante !
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part2=Oh zut, ces maudites Sorcières ont coupé l'alimentation de la prochaine porte. Mieux vaut rallumer tous les interrupteurs.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part1=Bien joué. Continuons à avancer...
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part2=Oh, quoi !? Les Zombies ont pris encore une clé !? Vraiment pas très inventifs leurs techniques de retardement.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part3=Et rappelle-toi de te dépêcher ! Cette lave te rattrape.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part1=Bien joué ! Ces Zombies n'ont aucune chance contre toi. Et cette lave fait tellement de travail en les éliminant aussi !
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part2=Oh, allez ! Encore des sorcières qui coupent l'alimentation de la porte !
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_4.part1=Bien joué ! Il semblerait que les Zombies aient aussi la clé de la dernière porte. Tu sais quoi faire !
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part1=Dernière ligne droite ! Je pense que tu devrais te débarrasser de ces générateurs !
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part2=Les générateurs survivront dans la Lave, donc mieux vaut s'en débarrasser.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.exit.part1=Wow ! T'as réussi ! Maintenant cours vers la sortie ! COURS !!!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.name=Frank
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction1=Reprenons le contrôle de ce Bastion.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction2=Des Piglins et des Humains qui travaillent ensemble ! Qui l'eût cru !
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction3=J'espère ne reconnaître aucun de ces Zombified Piglins. Je crains que certains d'entre eux aient été mes amis.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_start=Allez, on va fermer ce portail et reprendre le contrôle de cette infestation de Zombified Piglins.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_halfway=Je vais m'occuper de fermer le portail, toi tu gardes l'infestation sous contrôle. Et surtout, crève pas.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_almost=OK, t'as ça en main. Je vais commencer à fermer ce portail.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.clear_remaining=J'AI RÉUSSI ! Portail fermé ! Élimine les créatures restantes et on avance !
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_start=Bien joué ! On s'attaque au prochain portail.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_halfway=Espérons que ce prochain portail sera moins problématique que le premier !
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_almost=Tu sais ce qu'il faut faire ! Je reprends le service de portail ! Protège-moi !
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning1=Eh, tu peux éloigner ce Zombified Piglin de moi, s'il te plaît.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning2=Aïe ! Ça m'a fait sursauter. Tu peux t'occuper de ce Zombified Piglin ?
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning3=Ces Zombified Piglins sont hors de contrôle. S'il te plaît, dégage le chemin.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.portal_2_sealed=Deuxième fait ! Les deux portails devraient être fermés maintenant. Plus qu'à nettoyer.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.final_room_ahead=Tu les as tous eus ! Il y a encore une salle devant. Vas-y, et moi je reste ici pour inspecter ce portail.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.more_coming=Attention ! Ils sont nombreux ! Je crois que leurs unités plus puissantes arrivent pour défendre !
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.last_wave=Oh non, c'est quoi ça ? C'est un Zoglin vraiment très puissant ! Fais attention !
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.victory=T'as réussi ! On a repris le Bastion ! J'aurais pas pu le faire sans toi ! Je vais commencer à me réinstaller.
