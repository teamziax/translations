skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina=Adelina
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction1=Grazie per avermi portato in salvo! Il mondo ha bisogno di più eroi come te!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction2=Sei così dolce! Passare a trovarmi anche in queste condizioni!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step1=Oh ciao! Grazie mille per essere così coraggioso e aiutarci!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step2=Non so cosa sia successo, questi Zombie sono venuti fuori dal nulla!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step3=Ma perché questi Zombie sono qui? Hanno già preso il controllo di così tanta parte di Pumpkingdom!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step4=Solo qualche giorno fa questo era un castello fiorente, ora tutti sono costretti a nascondersi!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step5=Grazie per l'aiuto! Sono così grata!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie1=Oh mio dio! Quello Zombie fa così paura!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie2=Woah! Quello mi ha colto di sorpresa!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan=Bryan
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction1=Ehhh... Andiamo avanti... Non fermarti!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction2=Non abbiamo tempo per parlare!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step1=Oh! Finalmente! Un po' d'aiuto! Andiamoooo
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step2=Ho aspettato giorni nascosto lassù. Nessuno è venuto ad aiutare.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step3=Non sono attrezzato per questo. Non ho armi. Meno male che hai scelto di salvarmi!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step4=Dovrei smettere di parlare e lasciarti concentrare.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step5=Che sollievo. Sono al sicuro.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie1=WOAH! UNO ZOMBIE! Ho troppa paura per muovermi!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie2=Un altro ZOMBIE! È meglio che tu lo elimini prima!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella=Ella
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.interaction1=Ho così paura! Puoi aiutarmi?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step1=Ahh! Un compagno! Mettiamoci in salvo!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step2=Sono contenta di avere un amico con cui lavorare! Questi Zombie non hanno scampo!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step3=Guardati, stai davvero accumulando un bel conteggio di uccisioni su quegli Zombie!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step4=Ok, ammettiamolo, non sono forte come potrei sembrare. Faccio la dura, ma in queste circostanze è necessario!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step5=Grazie per l'aiuto! Scusa se non sono stata di più aiuto! Un giorno sogno di essere forte come te.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie1=Vieni qui Zombie! Combattiamo!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie2=Un altro Zombie! Continuiamo a combattere finché non sono tutti eliminati!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany=Giovany
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction1=Possiamo ottenere molto parlando. A meno che non si tratti di Zombie, che non ascoltano davvero.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction2=Come va la tua giornata? Sono sicuro che con tutto questo combattere, nessuno ti ha chiesto come stai, preoccupato solo per la propria pelle.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step1=Ciao! Apprezzo molto l'aiuto.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step2=Spero tu stia bene! Io posso solo sostenere il morale dei villager. Sono un pessimo combattente.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step3=Sono così grato per persone come te. Troppi delle Guardie di Pumpkingdom sono fuggite quando hanno visto gli Zombie.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step4=Riportami in salvo e manterrò alto il morale di tutti. Peccato che non riesca ad aiutare di più, amico. Non sono un combattente.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step5=Grazie! Resisti! Continua a combattere! Mi prenderò cura delle persone qui.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie1=Non sono addestrato ad affrontare questo Zombie. È meglio che tu ci pensi tu.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie2=Caro Zombie. Parliamo... Oh... no? AHHH, un altro disubbidiente qui!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah=Noah
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction1=Posso interessarti ad acquistare del cibo?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction2=Pensi che gli Zombie siano bravi come commessi? Posso addestrarne uno?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction3=Il mio negozio, non ci posso credere. C'era un giorno, e il giorno dopo era circondato di Zombie.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step1=IL MIO NEGOZIO! Non possiamo lasciarlo!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step2=Cosa intendi che dobbiamo metterci in salvo? Non possiamo semplicemente uccidere tutti gli Zombie?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step3=Wow, ci sono così tanti Zombie! Non mi ero reso conto che il problema fosse così grave.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step4=Suppongo che sia meglio che tu mi abbia salvato. Non riesco a credere di aver perso il mio negozio. Era il lavoro di tutta la mia vita.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step5=Grazie immagino. Un giorno passa dal mio negozio. Tornerò.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie1=Vai via, Zombie spaventoso!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie2=Là! Prendilo!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick=Rodrick
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction1=Sono curioso, cosa ne pensi della ragione dietro tutto questo? È un po' strano che sia successo così in fretta.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction2=Mi chiedo se quel forte botto di qualche giorno fa c'entri qualcosa.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step1=Ciao! Perché vai da questa parte? Di sicuro dovresti andare dall'altra parte?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step2=Non sarebbe più importante per voi soldati scoprire l'origine di questi Zombie, piuttosto che aiutarci?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step3=Il tuo aiuto è apprezzato, ma temo che il problema non migliorerà finché non sapremo il motivo.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step4=Hai visto quella ENORME spiga viola uscire dal suolo qualche giorno fa? Forse dovresti andare a controllare.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step5=Grazie per avermi portato qui, ma per favore vai a indagare sull'origine. Non migliorerà senza risposte.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie1=Woah! Uno Zombie! Presto occupati di questo.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie2=Così tanti Zombie! Non riesco a muovermi con così tanti intorno!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie=Sadie
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction1=Sarai mio amico? Mi sento così sola qui.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction2=Ho paura degli estranei, ma ancora più paura degli Zombie.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step1=Oh! Grazie! Io sono... Spaventata :( Dobbiamo andare?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step2=Non ci posso credere. Ho perso casa mia.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step3=Ho perso anche i miei amici. Li puoi trovare?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step4=Sono tempi tristi. Vorrei rannicchiarmi a letto ma non posso.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step5=Oh sì! Sono al sicuro! Un letto! E cibo! Grazie amico!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie1=Aaaa! Un altro!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie2=Aiuto! Si sta avvicinando troppo!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack=Zack
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction1=Mi chiedo perché gli Zombie rubino zucche e roba simile? Potrebbero portarle da qualche parte?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction2=Grazie per esserti preoccupato per me, ma sto bene. Ho affrontato guerre in passato. (Anche se soprattutto erano roditori che mangiavano i miei raccolti)
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step1=Mi chiamo Zack. Non riesco a credere che l'aiuto sia arrivato così in fretta!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step2=Sono il più duro e resistente coltivatore di zucche in vita. Puoi salvarmi per ultimo se vuoi.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step3=Ho sentito dire che la carne di Zombie fa bene alle zucche.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step4=Oh, aspetta, forse era la carne di scheletro che faceva bene alla crescita dei raccolti?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step5=Questi fastidiosi Zombie continuano anche a rubarmi le zucche. Spero di avere ancora cibo tra qualche settimana.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step6=Grazie per avermi portato qui. Andrò a preparare del cibo per gli altri sopravvissuti.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie1=Uno Zombie! Lo prendi! Penso che questo mi abbia rubato la zucca.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie2=WAAAAHH! Quello mi ha completamente colto di sorpresa! Non hai visto la mia reazione esagerata.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.tushar=Tushar
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction1=Ciao. Grazie per essere venuto ad aiutare con la pulizia della miniera. Ne abbiamo davvero bisogno.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction2=Pensi davvero di essere all'altezza del compito? Queste caverne fanno abbastanza paura.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step1=Grazie per aver accettato di aiutare.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step2=Non c'è tempo per stare fermi. Dobbiamo andare. Camminiamo e parliamo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step3=Quindi queste sono le nostre nuove miniere. Circa 10 anni fa si è formata questa enorme crepa nel mondo. All'epoca fu un disastro enorme.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step4=Tuttavia, questo burrone apparso da un giorno all'altro ci ha dato accesso a molte più risorse di prima.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step5=È stato rapidamente trasformato in un'enorme impresa, che raccoglie queste risorse e le vende al mondo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step6=Ma fin dall'inizio, queste creature sono apparse lentamente. Abbiamo scoperto che non amavano il fuoco e questo le teneva a bada.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step7=Ma non molto tempo fa, hanno spento le fiamme, e ora abbiamo perso il controllo! Da allora hanno invaso le caverne!
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step8=Ho bisogno che tu entri in queste caverne e riaccenda le fiamme. Questo ci permetterà di riprendere il controllo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step9=Iniziamo semplice. Questa è la più piccola delle nostre miniere. Dovrebbe esserci una fiamma vicino all'ingresso per fare una prova. Avvicinati per riaccenderla.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step1=Woah, hai fatto sembrare facile. Sei davvero in gamba. Andiamo alla prossima.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step2=Queste miniere ci permettono di estrarre il prezioso lapislazzuli. Di solito, dovremmo distillare l'acqua dai laghi per raccoglierlo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step3=Ora possiamo estrarre il lapislazzuli direttamente dal suolo. È stato ottimo per gli affari da queste parti negli ultimi anni.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step4=Bene, ci siamo. Questa è un po' più grande, ma uguale all'ultima.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step1=Non riesco a credere che tu abbia gestito quello. Ne manca ancora uno e potremo riposare tranquilli stanotte.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step2=Noi locali pensiamo che questi mostri portino questo lapislazzuli altrove. Sospettiamo che stiano lavorando per qualcosa o qualcuno.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step3=Ma non sappiamo dove stiano portando tutto questo lapislazzuli. Qualcuno in città ha detto di aver visto uno Zombie fondersi con il suolo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step4=Un giorno possiamo solo sperare che l'origine di queste creature venga eliminata.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step5=Un'ultima miniera. Ti auguro il meglio. Questa è grande.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile1=Penso che dovresti occuparti delle ostilità vicine prima che io mi muova.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile2=Per favore elimina questi mostri vicini. Non ho una fiamma con me.
skyblock_dungeon_dialogues.overworld.jungle.lucien_lair.lucien=Lucien
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part1=Vedo che hai deciso di sfidare il mio potere assolutamente immenso!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part2=Il mio esercito e io ti abbatteremo. Dovrebbe essere un gioco da ragazzi.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part1=Vedo che sei ancora qui. I miei complici non sono contenti che tu li stia fermando.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part2=Cerca di capire che quello che fanno è nel mio interesse.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part1=Dai ai mostri quello che vogliono, e ti rispetteranno.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part2=Chissà chi è il loro vero capo, ma non sono io. Mi pagano solo per disubbidire alle regole degli umani.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_4.part1=Come sei ancora qui!? Non ti piacerà proprio quello che sta per arrivare!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.go_trevor=Vai Trevor! Farcela! Piccolo Zombie Demonio!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_5.part1=Bene! Non mi hai lasciato scelta! È ora di incontrare il tuo destino!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.sunny=Sunny
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.enter.part1=Ehi, grazie mille per l'aiuto! Entra nel tunnel di fuga e chiuderò la porta dietro di te.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part1=Da qui in poi sei solo.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part2=Oh no, quegli Zombie fastidiosi hanno rubato la chiave della stanza successiva. Uno di loro deve averla.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part1=Ottimo lavoro! La leva per rilasciare la lava è proprio lì davanti. Azionala per rilasciare la lava, poi corri!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part2=Non puoi tornare indietro da questa parte. Questa porta deve restare chiusa per proteggere Duneside!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part1=CORRIIIII!!!!! La lava è stata rilasciata!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part2=Oh no, gli Zombie hanno preso un'altra chiave. Eliminane qualcuno finché non recuperi la chiave!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part1=Fantastico! Hai sbloccato la stanza successiva!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part2=Oh no, queste Streghe malvagie hanno spento l'alimentazione alla porta successiva. Devi riattivare tutti gli interruttori.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part1=Ottimo lavoro. Continua a muoverti...
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part2=Oh, cosa!? Gli Zombie hanno preso un'altra chiave!? Non sono molto fantasiosi con queste tecniche di ritardo.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part3=E ricorda di sbrigarti! La lava ti sta raggiungendo.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part1=Ben fatto! Questi Zombie non hanno scampo contro di te. E quella lava sta facendo un ottimo lavoro pulendo anche loro!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part2=Oh, dai! Altre Streghe che spengono l'alimentazione alla porta!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_4.part1=Ottimo lavoro! Sembra che gli Zombie abbiano anche la chiave dell'ultima porta. Sai cosa fare!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part1=Ultimo tratto! Penso che dovresti eliminare questi spawner!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part2=Gli spawner sopravvivranno nella Lava, quindi è meglio eliminarli.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.exit.part1=Wow! Ce l'hai fatta! Ora corri verso l'uscita! CORRIIIII!!!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.name=Frank
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction1=Riprendiamo il controllo di questo Bastione.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction2=Piglin e Umani che collaborano! Chi l'avrebbe detto!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction3=Spero di non riconoscere nessuno di questi Zombified Piglin. Temo che alcuni di loro fossero miei amici.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_start=Bene, andiamo a chiudere questo portale e a riprendere il controllo dell'infestazione di Zombified Piglin.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_halfway=Lavoro per chiudere il portale, tu tieni l'infestazione sotto controllo. Solo, non morire.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_almost=Ok, ce la fai. Inizio a lavorare per chiudere questo portale.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.clear_remaining=L'HO FATTO! Portale chiuso! Elimina le creature rimanenti e andiamo avanti!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_start=Ottimo lavoro! Ora occupiamoci del prossimo portale.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_halfway=Speriamo che il prossimo portale non sia problematico quanto il primo!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_almost=Sai cosa fare! Torno al portale! Proteggimi!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning1=Woah, puoi allontanare questo Zombified Piglin da me?
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning2=Aghh! Mi ha fatto saltare. Puoi occuparti di questo Zombified Piglin?
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning3=Questi Zombified Piglin sono fuori controllo. Per favore liberami la strada.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.portal_2_sealed=Secondo fatto! Entrambi i portali dovrebbero essere chiusi ora. Ora basta pulire.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.final_room_ahead=Li hai eliminati tutti! C'è un'altra stanza davanti. Vai a occupartene, e io resto qui a ispezionare questo portale.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.more_coming=Attento! Sono in tanti! Penso che le loro unità più forti stiano arrivando per difendere!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.last_wave=Oh no, cos'è quello? È un Zoglin molto potente! Fai attenzione!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.victory=Ce l'hai fatta! Abbiamo ripreso il Bastione! Non avrei potuto farlo senza di te! Comincerò a sistemarmi di nuovo.
