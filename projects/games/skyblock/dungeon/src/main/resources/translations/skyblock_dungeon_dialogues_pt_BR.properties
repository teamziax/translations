skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina=Adelina
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction1=Obrigada por me ajudar a chegar em segurança! O mundo precisa de mais heróis como você!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.interaction2=Você é tão gentil! Vindo me ver até nestas condições!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step1=Oi, olá! Muito obrigada por ser tão corajoso e nos ajudar!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step2=Não sei o que aconteceu, esses Zumbis apareceram do nada!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step3=Tipo, por que esses Zumbis estão aqui? Eles já tomaram o controle de tanto de Pumpkingdom!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step4=Há poucos dias, este era um castelo próspero, agora todo mundo foi forçado a se esconder!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.step5=Obrigada pela ajuda! Sou muito grata!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie1=Minha nossa! Aquele Zumbi é muito assustador!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.adelina.zombie2=Uau! Esse me pegou de surpresa!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan=Bryan
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction1=Eiiiiii... Vamos continuar andando... Não para!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.interaction2=Não temos tempo para conversa!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step1=Oh! Finalmente! Alguma ajuda! Vamos lá!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step2=Fiquei dias esperando escondido lá em cima. Ninguém veio ajudar.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step3=Não estou preparado para isso. Não tenho armas. Ainda bem que você me escolheu para resgatar!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step4=Acho melhor parar de falar e deixar você se concentrar.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.step5=Que alívio. Estou em segurança.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie1=UAAAAH! UM ZUMBI! Estou com muito medo para me mexer!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.bryan.zombie2=Outro ZUMBI! É melhor você pegar esse primeiro!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella=Ella
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.interaction1=Estou com muito medo! Você pode me ajudar?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step1=Ahh! Um parceiro! Vamos para a segurança!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step2=Que bom ter um amigo para trabalhar junto! Esses Zumbis não têm chance!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step3=Olha você aí, acumulando uma bela contagem de mortes nesses Zumbis!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step4=Tudo bem, não sou tão forte quanto pareço. Ajo durona, mas tem que agir nestas circunstâncias!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.step5=Obrigada pela ajuda! Desculpa não ter sido mais útil! Sonho em ser durona como você um dia.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie1=Vem cá, Zumbi! Vamos lutar!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.ella.zombie2=Outro Zumbi! Vamos continuar lutando até acabar com todos!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany=Giovany
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction1=Podemos alcançar muito conversando. A menos que seja com Zumbis, pois eles não escutam direito.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.interaction2=Como está seu dia? Com tanta luta, tenho certeza que ninguém perguntou sobre você e só se preocupou com a própria pele.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step1=Olá! Muito obrigado pela assistência.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step2=Espero que esteja bem! Só consigo apoiar o moral dos aldeões. Sou um lutador horrível.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step3=Sou muito grato por pessoas como você que existem. Muitos dos Guardas de Pumpkingdom simplesmente fugiram quando viram os Zumbis.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step4=Me leva de volta e eu mantenho o moral de todos. É uma pena não poder ajudar mais, parceiro. Não sou lutador.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.step5=Valeu! Fique forte! Continue lutando! Vou cuidar das pessoas aqui.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie1=Não tenho treinamento para enfrentar esse Zumbi. É melhor você lidar com ele.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.giovany.zombie2=Querido Zumbi. Vamos conversar... Ah... não? AHHH, mais um desobediente aqui!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah=Noah
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction1=Posso te interessar em comprar um pouco de comida?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction2=Você acha que Zumbis servem bem como trabalhadores de loja? Posso treinar um?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.interaction3=Minha loja, não acredito. Estava lá um dia e rodeada de Zumbis no seguinte.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step1=MINHA LOJA! Não podemos deixá-la!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step2=O que quer dizer que precisamos nos colocar em segurança? Não dá para matar todos os Zumbis?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step3=Nossa, tem tantos Zumbis! Não percebi que o problema era tão grave assim.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step4=Acho que foi melhor você me resgatar. Não acredito que perdi minha loja. Era o trabalho da minha vida.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.step5=Obrigado, acho. Um dia dá uma passada na minha loja. Estarei de volta.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie1=Sai daqui, Zumbi assustador!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.noah.zombie2=Ali! Pega aquele!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick=Rodrick
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction1=Fico curioso, o que você acha que está por trás de tudo isso? É bem estranho ter acontecido tão rápido.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.interaction2=Será que aquela explosão barulhenta de alguns dias atrás teve algo a ver com isso.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step1=Olá! Por que está indo por aqui? Com certeza devia ir pelo outro caminho?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step2=Não seria mais importante para vocês soldados descobrir a origem desses Zumbis em vez de nos ajudar?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step3=Sua ajuda é muito bem-vinda, mas estou preocupado que o problema não vai melhorar até descobrirmos a razão por trás disso.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step4=Você viu aquela ENORME ponta roxa que saiu do chão há alguns dias? Talvez você deva verificar isso?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.step5=Obrigado por me trazer aqui, mas por favor investigue a origem. Isso não vai melhorar sem respostas.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie1=Uau! Um Zumbi! Rápido, pega esse.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.rodrick.zombie2=Tantos Zumbis! Não consigo me mover com tantos ao redor!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie=Sadie
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction1=Você vai ser meu amigo? Me sinto tão sozinha aqui.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.interaction2=Tenho medo de estranhos, mas mais medo de Zumbis.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step1=Oh! Obrigada! Eu... Estou com medo :( Precisamos ir?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step2=Não acredito. Perdi minha casa.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step3=Perdi meus amigos também. Você pode encontrá-los?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step4=São tempos tristes. Quero me encolher na cama, mas não consigo.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.step5=Oba! Estou em segurança! Uma cama! E comida! Obrigada, amigo!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie1=Aaaa! Mais um!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.sadie.zombie2=Por favor, ajuda! Está chegando perto demais!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack=Zack
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction1=Será que os Zumbis estão roubando abóboras e outras coisas? Podem estar levando para algum lugar?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.interaction2=Obrigado por me verificar, mas estou bem. Já passei por guerras minhas no passado. (Embora fossem principalmente roedores comendo minhas plantações)
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step1=Me chamo Zack. Não acredito que a ajuda chegou tão rápido!
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step2=Sou o agricultor de abóboras mais durão que existe. Pode me resgatar por último se quiser.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step3=Ouvi dizer que a carne de Zumbi era boa para as abóboras.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step4=Ah, espera, talvez fosse a carne de esqueleto que era boa para o crescimento das plantações?
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step5=Esses Zumbis chatos ficam roubando minhas abóboras também. Espero que ainda tenha comida daqui a algumas semanas.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.step6=Obrigado por me trazer aqui. Vou preparar comida para os outros sobreviventes.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie1=Um zumbi! Você consegue pegar! Acho que esse roubou minha abóbora.
skyblock_dungeon_dialogues.overworld.plains.fallen_castle.zack.zombie2=UAAAHHH! Esse me pegou totalmente de surpresa! Você não viu eu exagerar.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.tushar=Tushar
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction1=Olá. Obrigado por vir ajudar com a limpeza da mina. Estamos precisando muito.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.interaction2=Você realmente acha que está pronto para esta tarefa? Essas cavernas são bem assustadoras.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step1=Obrigado por concordar em ajudar.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step2=Sem tempo para ficar parado. Precisamos ir. Vamos andar e conversar.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step3=Então, estas são nossas minas novíssimas. Há cerca de 10 anos, uma enorme rachadura se formou no mundo. Foi um desastre enorme na época.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step4=No entanto, este desfiladeiro que apareceu do dia para a noite nos deu acesso a muito mais recursos do que nunca.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step5=Foi rapidamente transformado em um enorme empreendimento, colhendo esses recursos e os vendendo para o mundo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step6=Mas desde o início, essas criaturas foram aparecendo aos poucos. Descobrimos que elas não gostavam de fogo e isso as mantinha afastadas.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step7=Mas não muito tempo atrás, elas apagaram as chamas, e agora perdemos totalmente o controle! Elas invadiram as cavernas desde então!
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step8=Preciso que você entre nessas cavernas e reacenda as chamas. Isso nos permitirá recuperar o controle.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_1.step9=Vamos começar simples. Esta é a menor de nossas minas. Deve ter uma chama perto da entrada para testar. Fique perto dela para reacendê-la.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step1=Uau, você fez parecer fácil. Você é bem forte. Vamos para o próximo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step2=Essas minas nos permitem extrair o valioso lapis lazuli. Normalmente, teríamos que destilar a água dos lagos para coletá-lo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step3=Agora podemos minerar lapis diretamente do solo. Tem sido ótimo para os negócios por aqui nos últimos anos.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_2.step4=Certo, aqui estamos. Este é um pouco maior, mas igual ao último.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step1=Não acredito que você aguentou aquilo. Mais um para ir, e todos podemos descansar tranquilos esta noite.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step2=Nós, os moradores locais, achamos que esses monstros estão levando este lapis lazuli para outro lugar. Suspeitamos que estejam trabalhando para algo ou alguém.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step3=Mas não sabemos para onde estão levando todo esse lapis. Alguém da cidade disse que viu um Zumbi se fundir ao solo.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step4=Um dia só podemos esperar que a origem dessas criaturas seja resolvida.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.walk_to_mine_3.step5=Uma última mina. Desejo-lhe boa sorte. Esta é grande.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile1=Acho que você deve lidar com as hostilidades próximas antes de eu me mover.
skyblock_dungeon_dialogues.overworld.cold_taiga.snowy_ravine.hostile2=Por favor, elimine esses monstros próximos. Não tenho uma chama comigo.
skyblock_dungeon_dialogues.overworld.jungle.lucien_lair.lucien=Lucien
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part1=Vejo que você decidiu enfrentar meu poder absolutamente imenso!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_1.part2=Meu exército e eu vamos te derrubar. Deve ser moleza.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part1=Vejo que você ainda está aqui. Meus parceiros no crime não estão contentes que você esteja nos impedindo.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_2.part2=Por favor, entenda que o que eles estão fazendo é do meu interesse.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part1=Você dá aos monstros o que eles querem e eles vão te respeitar.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_3.part2=Quem sabe quem é o verdadeiro chefe deles, mas não sou eu. Eles só me pagam para desobedecer a moral humana.
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_4.part1=Como você ainda está aqui!? Você realmente não vai gostar do que está vindo aí!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.go_trevor=Vai, trevor! Você consegue! Seu pequeno Zumbi Demoníaco!
skyblock_dungeon_dialogues.overworld.jungle.luciens_lair.unlocked_room_5.part1=Tudo bem! Você não me deixou escolha! Hora de encontrar o seu destino!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.sunny=Sunny
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.enter.part1=Ei, muito obrigado pela ajuda! Entre no túnel de fuga e eu fecho a porta atrás de você.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part1=A partir daqui você está por conta própria.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_1.part2=Não, esses Zumbis chatos roubaram a chave da próxima sala. Um deles certamente está com ela.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part1=Bom trabalho! A alavanca para liberar a lava está logo à frente. Acione-a para liberar a lava e corra!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_lever.part2=Você não pode voltar por este caminho. Esta porta precisa ficar fechada para proteger Duneside!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part1=CORREEEEE!!!!! A lava foi liberada agora!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_2.part2=Meu Deus, os Zumbis pegaram outra chave. Elimine alguns deles até conseguir a chave de volta!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part1=Ótimo! Você desbloqueou a próxima sala!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_1.part2=Puxa, essas Bruxas malvadas desligaram a energia da próxima porta. É melhor você ligar todos os interruptores de volta.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part1=Ótimo trabalho. Continue avançando...
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part2=Oi, o quê!? Os Zumbis pegaram outra chave!? Eles realmente não são muito criativos com essas técnicas de atraso.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_3.part3=E lembre-se de se apressar! Aquela lava está ganhando terreno.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part1=Muito bem! Esses Zumbis não têm a menor chance contra você. E aquela lava está fazendo um trabalho incrível de limpeza também!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.flip_the_levers_2.part2=Ah, vai! Mais bruxas desligando a energia da porta!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.obtain_key_4.part1=Bom trabalho! Parece que os Zumbis estão com a chave da última porta também. Você sabe o que fazer!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part1=Reta final! Acho que você deve se livrar desses geradores!
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.break_spawners.part2=Os geradores vão sobreviver na Lava, então é melhor se livrar deles.
skyblock_dungeon_dialogues.overworld.desert.duneside_escape.exit.part1=Uau! Você conseguiu! Agora corra até a saída! CORREEEEE!!!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.name=Frank
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction1=Vamos retomar o controle deste Bastião.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction2=Piglins e Humanos trabalhando juntos! Quem diria!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.interaction3=Espero não reconhecer nenhum desses Piglins Zumbificados. Temo que alguns deles possam ter sido meus amigos.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_start=Certo, vamos fechar este portal e colocar esta infestação de Piglins Zumbificados sob controle.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_halfway=Vou trabalhar para fechar o portal, você mantém a infestação sob controle. Só não morra pra mim.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route1_almost=Ok, você consegue. Vou começar a trabalhar para fechar este portal.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.clear_remaining=FIZ ISSO! Portal fechado! Limpe as criaturas restantes e seguimos em frente!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_start=Bom trabalho! Hora de lidar com o próximo portal.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_halfway=Tomara que este próximo portal não dê tanto trabalho quanto o primeiro!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.route2_almost=Você sabe o que fazer! Estou de volta ao dever do portal! Me mantenha seguro!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning1=Uau, você pode tirar esse Piglin Zumbificado de perto de mim.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning2=Aghhh! Me fez pular de susto. Você pode lidar com esse Piglin Zumbificado?
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.hostile_warning3=Esses Piglins Zumbificados estão descontrolados. Por favor, abra caminho para mim.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.portal_2_sealed=Segundo pronto! Agora devem ser os dois portais fechados. Agora é só limpar.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.final_room_ahead=Você os pegou todos! Tem mais uma sala à frente. Você vai lá, e eu fico aqui inspecionando este portal.
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.more_coming=Cuidado! São muitos deles! Acho que as unidades mais fortes estão chegando para ajudar na defesa!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.last_wave=Não, o que é aquilo? Que Zoglin poderoso! Cuidado!
skyblock_dungeon_dialogues.nether.piglin_colony.zombified_bastion.frank.victory=Você conseguiu! Reconquistamos o Bastião! Não teria conseguido sem você! Vou começar a me instalar aqui de novo.
