skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.hello=اخفض صوتك. الصوت ينتشر هناك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.locked=مش الآن. القرية لا تزال تتعامل مع اهتزازات الأرض. تعال لاحقاً حين تهدأ الأمور.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available=أنت ذاهب إلى منجم الحجارة؟ ممتاز. أنا أكره العناكب هناك. أتحمّل غبار الحجارة. لكن ثمانية أرجل تمر بجانب حذائي؟ لا أستطيع تحمّل ذلك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.whats_changed=ما الذي تغيّر؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.what_you_need=ماذا تحتاج مني؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.whats_changed=أصبحت أجرأ. لم تعد تختبئ في الظلام كما كانت من قبل. وبعض شبكاتها بها صبغة خفيفة. ربما لا يعني شيئاً. ربما.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need=نظّف منجم الحجارة خمس مرات. ليس مرة. خمس. أحتاج أن أعرف إذا كانت العناكب تتكاثر، أو تنتقل، أو يتم دفعها.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.on_it=حسناً. سأفعل ذلك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.five_times=خمس مرات تبدو كثيرة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.why_five=إذا نظّفته مرة، تختبئ. إذا نظّفته مرتين، تتحرك. بعد عدة جولات، تظهر الأنماط. كثافة الشباك. نقاط التوالد. الأشياء التي لا تلاحظها إلا حين تكون متعباً ومنتبهاً في نفس الوقت.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress=ما زلت أعدّ. خمس تنظيفات. حاول ألا تخرج ملفوفاً بالشبكات.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress.response.working=أنا في طور العمل.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete=فعلتها فعلاً. خمس تنظيفات، وأنت لا تزال في كامل صحّتك. المدخل يبدو أفضل بالفعل. شبكات أقل في الهواء. حركة أقل على الحجارة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete_reward=خذ هذا. إذا استمر المنجم في التصرف الغريب، على الأقل يمكنك استخراج حجارتك بنفسك دون أن تعيش فيه.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.glad=يسعدني أنه نفع.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.tint=عن تلك الصبغة التي ذكرتها...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.tint_followup=لا أقول إنها السبب. أقول إنني رأيت أشياء أغرب في الشقوق بعد الزلازل. ابقِ عينيك مفتوحتين هناك. إذا رأيت أي شيء يبدو غريباً، لا تلمسه بيديك العاريتين.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.after_completion=إذا بدأت الشبكات تزحف من جديد، سأعلم قبلك. أستطيع شمّ الرطوبة حين تعشش.
