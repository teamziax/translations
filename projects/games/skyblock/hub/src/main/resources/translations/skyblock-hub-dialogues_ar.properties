skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro=أوه. *أوينك* أنت... لاحظتني.\nأحتفظ بطاسة عدّ. للدوريات التي لم تعد كاملة. إنه عمل هادئ. *أوينك*\nلا أطلب المساعدة من أحد عادةً. لكن الطاسة امتلأت أكثر مما ينبغي. كنت أتساءل إذا... إذا ربما تستطيع تفريغها قليلاً بالانتقام للخسارة؟ *أوينك*... فقط إذا أردت.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro.response.accept=سأساعدك في الطاسة.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress=*أوينك*... أوه. ما زلت تعمل.\nلا تقلق، لا تستعجل. لا أريد إضافة اسمك إلى طاستي أيضاً. أرجوك ابقَ بأمان.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress.response=سأُكمل المهمة.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete=أوه. *أوينك*... شكراً.\nالأسماء لم تُنسَ، وخسارة صديقي الراحل تشعر بأن لها وقعاً الآن. لا أعرف كيف... *أوينك*... شكراً. هذا كل ما عندي.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_1=لا تحتاج قول أي شيء أكثر.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_2=ليرقدوا بسلام.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello=*أوينك*... أوه. مرحباً. لم أكن أتوقع أحداً.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_1=مرحباً، Grak.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_2=لا تعبأ بي.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro=*أوينك* أنت لا تبدو Piglin. يجب أن تكون أحد البشر الغازين هؤلاء.\nلا أثق بكم أيها البشر، تجوبون العالم. نحن Piglins نستطيع التعامل مع وباء Zombified Piglin هذا بأنفسنا! *أوينك*\nحسناً، إذا أردت إثبات نفسك، دعك تفعل.\n*أوينك* صديق حقيقي سيحضر لي ذهباً. هل ستكون صديقي؟
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro.response.accept=نعم، أريد أن أكون صديقك.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro=إذا كنت متحمساً جداً لإثبات نفسك لي، هل أحضرت الذهب؟
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro.response.trade=هذا هو الذهب.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete=أوه، أنت فعلاً تقدّرني كصديق. ظننت أنكم البشر لا تحبّوننا. *أوينك*\nأظن أننا أصدقاء الآن. جيد أن أعلم.\nربما كنت أحكم على البشر بسرعة. *أوينك*
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_1=يسعدني أن أكون صديقك.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_2=أنا فقط أحاول أن أكون لطيفاً
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello=مرحباً صديقي!!!! *أوينك* *أوينك* *أوينك* *أوينك*\nهل معك المزيد من الذهب؟ ;)
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_1=لا، آسف يا صديقي :(
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_2=يبدو أنك متحمس جداً لرؤيتي.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro=أنت أحد البشر الذين يساعدون المستعمرة، أليس كذلك؟ جيد.\nZombified Piglins جهنميون يستمرون في الظهور هنا. أعتقد أن الزومبي العاديين تحت السيطرة، لكنني قلق من أن البشر يتجاهلون خطر الأكثر فتكاً منهم، النوع الناري. هل تمانع الاعتناء بعدد منهم؟
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro.response.accept=سأتخلص منهم.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress=كيف الأمور؟ هل يُثبت النوع الجهنمي تحدياً كما خشيت؟ أخشى أننا ربما نكون قد تأخرنا.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_1=عودة للعمل.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_2=نعم، إنهم صعبون
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete=عمل جيد يا إنسان! أعتقد أنني سأرتاح أكثر معرفةً أن هناك عدداً أقل من تلك المخلوقات النارية العدائية. ليس لأنني كنت قلقاً، لأنني محصّن من النار. أنا حريص على دعم جهود البشر باتخاذ القرارات التي أعتقد أنها ضرورية.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_1=يسعدني أنني استطعت المساعدة.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_2=أحسنت في اتخاذ القرار.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello=أشياء غريبة تحدث هنا. إذا لاحظت أي شيء أعدّه تهديداً مجدداً، سأعلمك.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_1=شكراً!
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_2=أنا هنا دائماً للمساعدة
skyblock_hub_dialogues.nether.piglin_colony.balth.hello=مرحباً بك في Nether! كن حذراً هناك. إنه ليس مكاناً ودوداً.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_1=هذا ترحيب مشجّع.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_2=أتمنى أن تكون بخير.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello=إذا شممت دخاناً، لا تقلق. أحرقت الطعام مجدداً.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_1=محترق؟
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_2=أتمنى أن تنتهي مغامراتك الطبخية بخير.
skyblock_hub_dialogues.nether.piglin_colony.kora.detail_1=نعم، من الطريف أنك لا تزال تستطيع حرق الطعام في أكثر مكان حار في الكون.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello=واو! توقف هناك! كن حذراً وراء تلك البوابات. هناك خطر هناك.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_1=لا تقلق عليّ! عندي خوذة!
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_2=سأكون بأمان
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello=واو، العمارة هنا مذهلة حقاً. من الصعب التصديق أن هذا المكان بُني حرفياً في بضع سنوات بعد الاندماج.
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_1=ما هو الاندماج؟
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_2=نعم، إنه مذهل حقاً
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_3=مهه، أعرف بنّاءين أفضل
skyblock_hub_dialogues.nether.piglin_colony.ruk.detail_1=هو حين اندمج Overworld مع هذا المكان الغريب.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello=كن حذراً هناك. تلك المادة البنفسجية تبدو وكأنها تأكل الكوارتز، ولها إمكانيات سحرية غريبة. أعطتني ذراعاً ثالثة ليوم واحد.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_1=ذراع ثالثة؟
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_2=واو، هذا جنوني.
skyblock_hub_dialogues.nether.piglin_colony.sable.detail_1=نعم، إنها سحر قوي جداً، إذا أعطيتها ما تريد.\nيبدو جلياً أنها تريد الكوارتز.
skyblock_hub_dialogues.nether.piglin_colony.varka.hello=أصنع شفرات ومفصلات وانهياراً عاطفياً عرضياً. أساساً المفصلات.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro=واو، احذر. لم أنتهِ من البناء هنا. هذا الجسر خلفي لا يؤدي إلى مكان بعد.\nلكن عندي مشكلة صغيرة. أنا بنّاء بارع جداً. لكنني فقدت كل فوانيسي، وأنا خائف جداً من الظلام.\nهل تمانع مساعدتي في إيجادها؟ لا يمكن أن تكون ذهبت بعيداً.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro.response.accept=سأجد فوانيسك.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns=أرجوك أسرع، أنا خائف جداً من الظلام.\nأعلم أنها لا يمكن أن تكون ذهبت بعيداً، إلا إذا بدأت الفوانيس تمشي الآن. إذا كان الأمر كذلك، فهذه مشكلة منفصلة، وأنا لست مستعداً لها.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns.response=سأواصل البحث.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit=وجدت الفوانيس؟ رائع. رائع!\nالآن نحتاج ضوءاً كافياً لإضاءة كامل Crimson Exchange. كمية من Glowstone والمشاعل ستكفي.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_1=هذه بعض مستلزمات الإضاءة.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_2=أنا على الأمر.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete=فعلتها. رائع. سيكون هناك مزيد من الضوء هنا الآن.\nلم أعد بحاجة للخوف من الظلام.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_1=أتفق، الظلام مخيف.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_2=يسعدني أنني استطعت المساعدة.
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello=أضأت يومي حرفياً.\nأتمنى لو لم أقبل عملاً في حرفياً أكثر مكان مظلم في الكون...
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello.response=يسعدني أن الأضواء تساعد.
skyblock_hub_dialogues.nether.piglin_colony.vesh.lantern.cant_pick_up=لا أعرف لمن هذه الفوانيس. ربما أتركها في الوقت الحالي.
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello=مرحباً، أهلاً بك في مستعمرة Piglin!\nمستعمرة Piglin تبدو وكأنها كانت مكاناً رائعاً. نحن البشر لم نعرف بوجودها حتى وقت قريب جداً.\nوجدنا هذا البُعد البديل من خلال الشقوق التي تشكّلت بين العوالم.\nتحدثنا مع Piglins، ويبدون مجموعة ودية (وإن كانوا مهووسين قليلاً بالذهب). يبدو أن أوضاعهم أسوأ من أوضاعنا في Overworld.\nأنشأنا هذا المعسكر، Crimson Exchange، للوصول بسهولة إلى Nether لتقديم الدعم لـ Piglins.\nبكل الوسائل، لا تتردد في مساعدتهم، لكن كن واعياً! كثير منهم أصابهم الفساد وتحولوا إلى زومبي!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_1=سأبقى بأمان!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_2=يسعدني رؤيتك مجدداً!

# Zombified Bastion - Dungeon Guard
skyblock_hub_dialogues.nether.piglin_colony.zombified_bastion.dungeon_guard.introduce=هذا الحصن... كان يوماً فخر مستعمرة Piglin.\nللأسف، هو الآن مليء بنسخ مُزمبرة منا نحن Piglins. أصدقاؤنا، تحوّلوا إلى زومبي.\nهل ستساعدني في استعادة الحصن لبقية Piglins الناجين؟\nنحتاج فقط لإغلاق بعض البوابات التي يستخدمها Zombified Piglins للدخول.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction=هل تسمع ذلك؟ إنهم يقطعون الأشجار!!!\nكم من أجيال من العائلات اعتنت بهذه الغابة، والآن يُقطع كل شيء. إذا سألتني هذه علامة سيئة، وإذا استمر الأمر، الأوضاع ستزداد سوءاً فقط.\nهل تمانع مساعدتنا في إيقاف هذا التحطيب المروّع؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_1=سأسأل. هذا يبدو سيئاً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_2=ربما الغابة تتحمل بضع أشجار.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.in_progress_workers=ربما تبدأ بالتحدث مع العمال. أنا متأكدة أنهم يعرفون من وراء كل هذا.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.after_lucien=أوه، إنه Lucien. هذا منطقي تماماً.\nذلك الوحش جشع للغاية. إنه الثريّ هنا، وهو لا يكتفي أبداً بثروته.\nلا غرابة في أنه يدمّر بيتنا لزيادة ثروته أكثر.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete=Lucien أخذ سجلاتك وقال إنه لن يتوقف على أي حال. ذلك الرجل مرعب.\nحسناً، شكراً على المحاولة. أنا متأكدة أن أحداً ما يوماً ما سيجعله يعي. قبل أن تسقط هذه الغابة كلها.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete.response=أتمنى أن تتمكنوا من إنقاذ الغابة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.hello=التحطيب ما زال مستمراً. Lucien سيستمر في ملء جيوبه بالثروة حتى يُوقفه أحد.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned=نعم، أنا أشغّل هذه الآلة. كن حذراً إنها خطيرة جداً.\nهذا ليس من فعلي. أستطيع تأكيد ذلك. Lucien رجل أعمال قوي، وهو من وراء هذا. لا أعتقد أنه يدرك فعلاً أن ما يفعله يضرّ بالغابة. أظن أنه لا يرى غير المال الذي يجنيه من بيع الخشب.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned.response=آه، إذن هو مدفوع بالمال.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.hello=ابعد يدك. هذه الآلة تعضّ.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned=واو، تراجع، كنت على وشك إطلاق ضربة ضخمة على تلك الكومة من السجلات هناك.\nانظر، أفهم أنك تريد إنقاذ الغابة، لكن ليس بإمكاني فعل شيء. أنا فقط أقوم بعملي.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned.response=أوه، آسف. سأتركك تواصل عملك
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.hello=احذر، هذه آلة ضخمة، وأنا أحاول حالياً جمع كل هذا الخشب.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned=أنت الشخص الرابع الذي يحاول إيقافي اليوم.\nأحذّرك، لست في مزاج للتحدث معك.\nإذا أردت إجابات، Lucien هو رجلك. إنه من يدفع لي.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned.response=فهمت.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.hello=Lucien يدفع جيداً. أتمنى لو كان يدفع لي لعدم تدمير بيتنا. لا يمكنني أن يكون لديّ بيت بلا بيت، ولا يمكنني أن يكون لديّ بيت إذا قطعت هذه الغابة.\nلا يمكنني الفوز :(
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront=أنا هنا فقط لكسب المال. استوليت على عمل الأسرة. الآن أقطع الأشجار. لا أصدق أن أحداً لم يفعل هذا من قبل. سأكون ثرياً جداً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_1=أنت تهدم بيتك بيدك.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_2=ماذا يمكنني فعله لإقناعك بالتوقف؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro=لنكن عادلين. أحضر لي كمية من السجلات لتعويض أعمالي المفقودة، وسأتوقف. يبدو ذلك عادلاً؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.response_deposit=تفضّل بعض السجلات
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.dungeon=أريد القتال من أجل الغابة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete=ممتاز. بالضبط ما طلبته.\nالآن، بخصوص الإغلاق.\nلا.\nهذه السجلات تساعد أرقام اليوم. والآلات تساعد أرقام الغد.\nأخبر المحتجين أنهم يمكنهم الاستمرار في طلب إيقافي، لكنني لن أفعل. العمل لن ينمو بكومة صغيرة من السجلات.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_1=سأخبرهم.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_2=أنت وحش.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon=مرحباً، ابتعد عن طريقي. عندي أعمال لأديرها.\nعندي عملاء كثيرون. نعم، هؤلاء العملاء ربما يكونون وحوشاً شريرة، لكنهم يدفعون جيداً. نمو الأعمال سيتوقف إذا بدأت بالانتقاء في عملائي.\nإذا كانت لديك مشكلة، هاتها. لا تستطيع التعامل معي.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_1=هاتها.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_2=أنت تعمل مع وحوش؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters=نعم، أفعل.\nإنهم يريدون مني أشياء. بدلاً من مهاجمتي، وجدت أنه إذا أعطيتهم ما يريدون، يميلون لدعمك.\nفما المشكلة إذا قطعوا كل شيء وسرقوا كل شيء من الجميع...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_1=يجب أن أوقفك.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_2=سأتعامل معك لاحقاً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.kiri.hello=عرفت شخصاً عاش في بيت شجرة في إحدى تلك الأشجار. هذا غير عادل جداً.\nأنا متأكد تقريباً أن بيته تحوّل الآن إلى خشب لجدار في منزل مليونير ثريّ ما.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.paz.hello=سأكون صريحاً. هذه الغابة تبدو... "مسحورة". أعتقد أنه فكرة رهيبة قطع هذه الأشجار. ستعود وتطاردنا.\nلا أعتقد أن تلك المادة البنفسجية التي تتسرب من الأرض علامة جيدة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.marlo.hello=لا أثق بتلك المادة البنفسجية.\nإنها ليست طبيعية.\nلماذا العناكب في كل مكان الآن.\nهذا لا معنى له.\nأعتقد أن هذا مؤشر على حدوث شيء سيئ.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available=مرحباً مجدداً! كنت أعمل على وصفة جديدة. أعتقد حقاً أنها ستعطي أهل Pumpkingdom دفعة معنوية كبيرة.\nأعتقد أنها ستكون طعاماً رائعاً لك أيضاً. هل تريد تجربتها؟
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_1=نعم، أنا دائماً جائع
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_2=دائماً متحمس لطعام شهي جديد
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted=رائع! إليك فكرتي. إنه حساء لحم بقري. سأرقّي كتاب وصفاتك على طاولة الحرفة، حتى تتمكن من رؤية الفكرة التي لديّ.\nاذهب واصنع بعضه، وأخبرني بطعمه!
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_1=هذا يبدو رائعاً
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_2=لست متحمساً للفكرة، لكن سأحاول على أي حال
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder=كيف تسير وصفتي الرائعة؟ آمل ألا تكون تسممت منها.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_1=تسير بشكل جيد
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_2=أووه، الأمور لا تبدو جيدة
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_3=لم أبدأ بعد
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete=حسناً؟ انظر إليك، ما زلت واقفاً ولا تعمل وجه "أندم على كل شيء". هذا واعد. أنا في شوق لمعرفة، هل كان حساء اللحم البقري جيداً؟ هل فشلت مع الجميع كطاهٍ؟
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.tasty=كان جيداً. جيداً حقاً.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.honest=يحتاج بعض التعديل.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.horrible=كان مقرفاً.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup=نعم! كنت أعلم ذلك. الجميع في المملكة سيكونون سعداء جداً. لا أستطيع الانتظار لمشاركة إبداعي مع المزيد من الناس.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_1=يسعدني رؤيتك سعيداً
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_2=استمر في العمل الجيد
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup=حسناً، أظن أنه ليس لكل أحد، ويبدو أنك لم تكرهه. يبدو أنني في الاتجاه الصحيح. أقدّر التغذية الراجعة الصادقة.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_1=لا تقلق، أنا أؤمن بك
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_2=يجب أن تستسلم الآن
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting=يا إلهي. أنا آسف جداً جداً. يجب أن أستسلم كطاهٍ. لا أصدق أنك كرهته بهذه الشدة.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_1=آسف لم أقصد ذلك
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_2=انظر، الطبخ ببساطة ليس موهبتك
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello=كيف حالك؟ أتمنى أن تكون بحال أفضل مني.\nكل أبقاري ما زالت مصابة بشكل غير عادل بتلك المادة البنفسجية. هذا سيئ جداً.
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello.response_1=أنا آسف لسماع ذلك
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer=*تبكي* مرحباً! آسف، أمسكتني في لحظة سيئة.\nأبقاري أصبحت على غير ما يُرام. إنهن يؤذين أهل القرية. لا أستطيع رؤيتهن هكذا.\nلا أريد إيذاءهن. هل تستطيع فعل شيء حيال ذلك؟
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.what_happened=ما الذي حدث لهن؟
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.ill_help=سأحمي أهل القرية
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.what_happened_followup=لا أعرف. يوماً كانت ترعى ثم في اليوم التالي أصابها ذلك الشيء البنفسجي. كالمرض، وأصاب كلهن. من المحزن رؤية ذلك.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.followup.response.accept=سأتولى الأمر
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check=*تبكي* أتمنى أن تسير الأمور بشكل جيد.\nكيف الأمور؟ في الواقع، لا تخبرني. لا أريد أن أعلم.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check.response.on_it=أنا على الأمر
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete=يا إلهي! شكراً جزيلاً لفعل ذلك. هذا مروّع. ما الذي أصابهن. هذا ظالم جداً.\n*تواصل البكاء*\nأبقاري المسكينة.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_1=من فضلك لا تبكي
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_2=في أي وقت يسعدني المساعدة


skyblock_hub_dialogues.panorama.skyblock=Skyblock
skyblock_hub_dialogues.panorama.by_cubecraft=من CubeCraft
skyblock_hub_dialogues.panorama.complete_quests=أنجز المهام
skyblock_hub_dialogues.panorama.explore=استكشف
skyblock_hub_dialogues.panorama.and_upgrade=وطوّر نفسك
skyblock_hub_dialogues.panorama.your_adventure=مغامرتك تبدأ الآن!
skyblock_hub_dialogues.panorama.speak_to_helper=تحدث مع القروي لرؤية مهامك الأولى

# Grot & Nira - A Bolt of Hope
skyblock_hub_dialogues.npc_name.grot=Grot
skyblock_hub_dialogues.npc_name.nira=Nira
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro=أنت. توقف. أحتاج مساعدتك.\nذلك الخنزير بجانبي. هذه زوجتي. Nira. انتشر الفساد البنفسجي عبر قسمنا وتغيّرت. لا تزال هناك في الداخل. أعلم ذلك. ما زالت تنقر أنفها على ساقي كل صباح، كما هو عادتها دائماً.\nقيل لي إن البرق يمكنه اختراق الفساد. أوجد لي قضيب برق. سأفعل الباقي.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro.response.accept=سأجد لك قضيب برق
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro=ما زالت هنا. ما زالت تنقر أنفها على ساقي كل صباح.\nإذا وجدت قضيب برق، سنستخدمه لتوجيه ضربة برق مباشرة عليها.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro.response=تفضّل.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt=حدث شيء. صرخت.\nلكنها ما زالت خنزيرة. الشحنة لم تكن كافية.\nأحتاج المزيد. المزيد بكثير. سنصنع أقوى عاصفة برقية رأيتها في حياتك.\nقضبان البرق لن تكفي. سنحتاج استخدام بلورات الجليد وبخار الماء لتخمير عاصفة القرن.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_1=سأجمع كل شيء
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_2=هذا الكثير من المواد
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro=هل معك كل شيء؟\nكانت Nira تحكي لي عن العواصف. قالت إن الماء يتجمّد في الأعلى في أماكن مثل Snowy Taiga، حيث الهواء سميك وبارد. ثم بخار الماء يرتفع ويضرب الجليد في الأعلى. يولّدون شحنة ضخمة، حتى لا يستطيع السماء احتواءها وتتشقق.\nإذا كدّسنا القضبان لتركيز الشحنة، واستخدمنا الجليد والماء لبناء الشحنة، يمكننا سحب شيء أكبر من أي برق طبيعي. شيء قوي بما يكفي لاختراق الفساد.\nنأمل ألا نُذيب Nether كله.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro.response=هذه مكونات عاصفتك
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete=NIRA!\nانظر إليها. عادت!\nلا أملك الكلمات لهذا. أعدت لي زوجتي.\nشكراً. أعني ذلك.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_1=هي تستحق أن تعود للبيت
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_2=يسعدني أنني استطعت المساعدة
skyblock_hub_dialogues.nether.piglin_colony.grot.hello=Nira ما زالت تستعيد توازنها. كانت خنزيرة لفترة طويلة. لكنها عادت لنفسها. لا أعرف ما كنت سأفعل لولاك.
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_1=هي محظوظة لأن لها مثلك
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_2=اعتنِ بها جيداً
skyblock_hub_dialogues.nether.piglin_colony.nira.hello=أتذكر كل شيء، حتى كخنزيرة، كنت أسمع صوت Grot كل يوم. لم يتركني أبداً. كان لطيفاً جداً معي.\nبالتأكيد سيستغرق الأمر وقتاً مني لأتكيف مجدداً للحياة على قدمين.
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_1=يسعدنا أن عُدتِ
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_2=أنتِ محظوظة جداً
skyblock_hub_dialogues.nether.piglin_colony.nira_pig.hello=أوينك.
