skyblock_hub_dialogues.wurg.cannot_cross=جررر! أنا Wurg الكئيب! نحن Wurgs محلفون على حماية الجسور ومنع كل من لا يستحق من العبور! عُد حين تكتشف المزيد!
skyblock_hub_dialogues.wurg.back_to_work_response=حان وقت العمل!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat=هيه، أنت لا تزال واقفاً! علامة جيدة. هل التقيت بأهل القرية؟ يحبّون الدردشة كثيراً!\nهل ضعت قليلاً؟ لا تقلق! مهامك آمنة في <cc:header>قائمة Skyblock</cc:header> أو اكتب "/skyblock quests"!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_1=شكراً على المعلومة!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_2=نعم، أهل القرية طيبون جداً!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.introduce=هيه يا صديق! مرحباً بك في قرية Oakridge \nأوه، أين ذهبت أخلاقي... نسيت أن أقدّم نفسي!\nاسمي Cubit، أنا دليل القرية هنا في Oakridge!\nتعال معي، سأريك قلب القرية وأعرّفك على أهلها!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_enchanter=هذا هو الساحر!\nبطريقة سحرية غريبة، يمكنه تحسين أدواتك لتصبح أقوى!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_portal=وهذا يعيدنا إلى البوابة...\nيمكنك دائماً استخدام البوابة للعودة إلى البيت، أو القائمة المفيدة في حقيبتك.\nهذه نهاية الجولة في الوقت الحالي، لكن لا تقلق، هناك الكثير لاستكشافه في Oakridge!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_repairer=تعرّف على المصلِّح!\nيمكنه إصلاح أي شيء! حتى لو قضمه شيء ما...\nمثل أرنب أو شيء من هذا القبيل...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_shops=آه، جزئي المفضّل... المحلات!\nفيها كل ما تحتاجه، وكل ما لم تكن تعلم أنك ستحتاجه!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce=هيه! أنت من جديد!\nيجب أن أريك المصهر! إنه المكان الوحيد في عالم Skyblock القادر على عمل ترقيات قوية للأدوات والدروع.\nقد يكون صعب الإيجاد، فلنتحرك!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_1=هيا بنا!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_2=لا أستطيع الانتظار!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge=مرحباً بك في المصهر! هذا المبنى الضخم قوة حقيقية!\nيُقال إن هذا المكان بناه أناس كانوا يبدون كالمسحورين، وأن هذا المكان يمتلك قوى سحرية.\nالرون التي تجدها في أنحاء العالم يمكن استخلاص قواها الحقيقية هنا.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_1=واو، يبدو مخيفاً!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_2=لا أستطيع الانتظار لصنع شيء قوي!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello=كيف حال الأمور في المصهر؟ صنعت شيئاً رائعاً؟\nالزنازين مكان جيد للبداية في البحث عن الرون إذا كنت بحاجة لأي منها.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_1=نعم، الأمور تسير بشكل جيد!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_2=لم أصنع شيئاً جيداً بعد!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.introduce=هيه! Cassandra هنا! أنا مزارعة! يقول البعض إنها أفضل مزارعة في المنطقة!\nيقول البعض إنني <italic>أتفوق</italic> على كل المنافسين!\n\nكمزارعة شمندر، عندي دائماً كميات هائلة من بذور الشمندر! عودي إليّ متى أردتِ صفقة رائعة!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.response=يسعدني لقاؤك!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.chat=هيه، كيف حالك يا رفيق!\nهل تهمّك بذور شمندر بسعر مميز؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.introduce=مممه... Levi هنا.\nأنت لست من هنا، أليس كذلك؟\nالكل يعرفني. أنا ذلك الشخص الذي ينام دائماً أثناء العمل. أعمل على تحسين مهاراتي لأستطيع المساعدة أكثر، لكنني لم أصل بعد.\nإذا واصلت، ستصبح مشهوراً مثلي.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_1=أتمنى ألا تنام دائماً
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_2=تبدو مثيراً للمتاعب
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.hello=هيه، كيف حالك؟\nأنا مشغول بالراحة. هل يمكنك العودة في وقت آخر؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.introduce=مستحيل! أناس جدد!\nأنت جديد، أليس كذلك؟ لا أستطيع الانتظار لمقابلتك. أخبرني بكل شيء.\nكيف حالك؟ عندي كيكة. تريد كيكة؟\nيا إلهي. يجب أن توقفني. سأستمر في الكلام وإلا.\nهل قابلت الجميع؟ هل رأيت المحلات؟ وماذا عن المناجم؟\nأوووه هناك كميات من الأشياء البنفسجية الجنونية النابتة من الأرض، سمعت عنها؟\nانتظر... سأتوقف
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_1=واو، هدّئي نفسك!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_2=أعتقد أننا سنتفاهم
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_3=أنت فوضوية جداً
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello=واو، عُدت للكلام معي! أنا ممنونة.\nكيف حالك؟ صنعت كيكة جديدة. أحب الكيك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello.response_1=أنا أيضاً أحب الكيك
skyblock_hub_dialogues.response.show_me_around=نعم، أرني جولة!
skyblock_hub_dialogues.response.show_me_more=نعم، أرني المزيد!
skyblock_hub_dialogues.response.show_me_what_youve_got=نعم، أرني ما عندك!
skyblock_hub_dialogues.response.thanks_for_help=شكراً لك!
skyblock_hub_dialogues.response.yeah_sure=نعم، بالتأكيد!
skyblock_hub_dialogues.response.lets_go=أنا مستعد تماماً!
skyblock_hub_dialogues.response.ill_pass=ربما في وقت آخر...
skyblock_hub_dialogues.response.yeah_ill_help=نعم، سأساعد!
skyblock_hub_dialogues.response.not_right_now=لا، ليس الآن
skyblock_hub_dialogues.response.okay=حسناً
skyblock_hub_dialogues.response.yes=نعم
skyblock_hub_dialogues.response.tell_me_more=أخبرني أكثر.
skyblock_hub_dialogues.response.i_should_go=يجب أن أذهب.
skyblock_hub_dialogues.response.fair_enough=معقول.
skyblock_hub_dialogues.response.yikes=آخ.
skyblock_hub_dialogues.response.good_luck=حظ موفق.
skyblock_hub_dialogues.response.interesting=مثير للاهتمام.
skyblock_hub_dialogues.response.laugh=هاها!
skyblock_hub_dialogues.response.ill_leave_you_to_it=سأتركك لشأنك.
skyblock_hub_dialogues.response.will_do=سأفعل ذلك!
skyblock_hub_dialogues.response.ellipsis=...
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.introduce=يا إلهي، يا إلهي! كراتي الصغيرة الرقيقة انفلتت من المزلاج مجدداً! كانت تقفز قرب الكوخ، لكنها اختفت في الغابة الآن! هل يمكنك مساعدتي في إعادتها؟ سأكافئك بسخاء، أعدك، أنا فقط أريد صغاري في البيت!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.response=حان وقت مطاردة الأرانب! لا تقلقي يا Aurora!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.hows_it_going=كيف الأمور؟ أي أثر لفنانِي الهروب الصغار؟ تلك الأرانب تدبّر شيئاً، أعلم ذلك... على الأرجح مجرد سرقة وجبات خفيفة وليس تمرداً كاملاً!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks=يا إلهي، الحمد لله! شكراً جزيلاً لمساعدتي... لم أكن لأستطيع تتبّعهم بدونك! سأخبر الجميع في Oakridge عن طيبتك وشجاعتك!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks.response=يسعدني أنني أنقذت الموقف!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.hello=هيه! ما زلت ممنونة جداً لمساعدتك مع أشقيائي الصغار!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro=آخ! ابتعد! أعني مرحباً! الأرانب... مرعبة جداً بالنسبة لي. إنها مخيفة! هل يمكنك أخذ هذا الطعام إلى Aurora؟ حزمت جزراً وشمندراً وقمحاً حتى تبقيهم... راضين.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_1=بالطبع! سأكون بطل التوصيل.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_2=كيف يمكنك أن تخاف؟ إنها مجرد أرانب رقيقة صغيرة!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress=هيه! هل... هل أطعمت تلك المخلوقات المرعبة؟ هل لا تزال جائعة؟
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress.response=ليس بعد، لكنني أعمل على ذلك.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete=أنت الأفضل! بصراحة، الأرانب مجرد وحوش صغيرة مقنّعة. Aurora تقول إنه يجب أن أزورها يوماً ما... ربما سأفعل، إذا كنت موجوداً لحمايتي!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete.response=في أي وقت! سأكون حارسك الخاص من الأرانب.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello=هيه، كيف الأمور! أنا أفضل موردي طعام الحيوانات في الغابة أساساً لأنني لا أحب الاقتراب كثيراً من الحيوانات!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello.response_1=رائع!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro=أوه! هذه يجب أن تكون الجزر التي جمعها Bob. إنه حلو القلب، حتى لو كان قلق بعض الشيء. هل يمكنك تسليمها؟
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro.response.yes=تفضّلي!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks=ممتاز! شكراً جزيلاً. أخبر Bob أنه دائماً مرحب به لزيارتنا، ربما إذا رآهم يأكلون، سيدرك أنهم مجرد أصدقاء طريّون صغار.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks.response=سأخبره.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro=أوه، Bob أرسلك بالوجبات؟ هذا لطيف منه جداً! أنا مشغولة قليلاً مع الأرانب الأخرى، هل يمكنك تغذية هؤلاء مباشرة؟ أخبر Bob أنه مرحب به دائماً!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro.response=أستطيع فعل ذلك!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.catch=<italic>*قفز قفز*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.response=أمسكتك! بهدوء وبرفق.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.intro=هذا الأرنب يحرّك أنفه، يبدو جائعاً للجزر!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.thanks=يأكل الأرنب الجزر بسعادة.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.catch=<italic>*صريخ!*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.response=تعال معي يا صغير!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.intro=يبدو أن هذا الأرنب يريد بعض الشمندر، إنه يحدّق في الحقيبة!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.thanks=يستمتع الأرنب بالشمندر.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.catch=<italic>*مضغ مضغ*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.response=العودة إلى الحظيرة!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.intro=هذا الأرنب ينتظر بصبر قمحه!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.thanks=يقضم الأرنب القمح بارتياح.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.hello=<italic>*يهزّ أنفه*</italic>


skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.intro=هيه! أنت هناك، تعال\nالليلة الماضية... اهتزّت الجدران بعنف وفجأة أصبحت كل المنازل هنا غير مستقرة...\nوبالطبع هذه أصبحت مشكلتي لأحلّها...\nلكن الآن يمكنني جعلها مشكلتك أيضاً، أظن.\nاجلب لي بعض سجلات البلوط والحجارة، وسنتكلم مجدداً حين تنجز ذلك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going=أنت من جديد.\nهل جمعت المواد بعد؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.yes=نعم! عندي بعض الموارد لك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.no=لا، آسف، سأعود إليه :(
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks=واو، فعلتها فعلاً.\nأنا... مندهش.\nشكراً، أعتقد.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks.response.enjoy=أتمنى أن تلك الموارد ساعدت!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well=لا زلازل منذ الليلة الماضية. ربما من الأفضل أن يبقى الأمر كذلك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well.response.glad_to_hear=يسعدني سماع ذلك!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro=هيه، أنت هناك. دعني أعرّفك على شيء بالغ القوة في هذا العالم...\nالمزارات. نعم، أعطها الكثير من العنصر الذي صُنعت منه، وستكافئك بأشياء رائعة.\nانطلق وتجوّل للعثور على كل المزارات التي يقدّمها هذا العالم!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_1=سأبدأ فوراً!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_2=سأراها وأنا أتجوّل، شكراً!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going=هل وجدت كلها بعد؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_1=ما زلت أبحث!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_2=أبذل قصارى جهدي للعثور على الكل!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello=هيه! ما أخبارك!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello.response_1=يسعدني رؤيتك مجدداً!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello=هيه. أنا Gus. يبدو أنني تركت نظارتي في مكان ما هنا.\nأظن أنني سأستمر في البحث.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_1=حظ موفق. أتمنى أن تجدها!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_2=أظن أنك لم تتوقع ذلك...


# Cobblestone Mine - Dungeon Guard
skyblock_hub_dialogues.overworld.oak_forest.cobblestone_mine.dungeon_guard.introduce=منذ وقت ليس ببعيد، كان هذا منجماً مسالماً ومثمراً...\nذاك كان قبل أن تأتي العناكب.\nلم يكن حرس Oakridge مستعداً لهجوم كهذا.\nاجتاحونا فاضطررنا للتراجع.\nالآن المنجم مليء بالعناكب ومخلوقات أخرى.\nهل يمكنك مساعدتنا في تنظيفه؟

# Pumpkingdom - Ella
skyblock_hub_dialogues.overworld.plains.pumpkingdom.ella.flower_shop=هيه! أنا صاحبة محل الزهور هنا في Pumpkingdom!\nهل تهمّك بعض الزهور؟

# Pumpkingdom - Dungeon Guard
skyblock_hub_dialogues.overworld.plains.pumpkingdom.dungeon_guard.introduce=كان هناك الكثير من الزومبي. ما زال يطاردني في أحلامي!\nلا أعرف كيف نجونا. لم يكن بإمكاني فعل شيء أكثر.\nأتساءل هل كنت ستتصرف بشكل أفضل؟ هل تعتقد أنك كنت ستساعد؟ هل كانت النتيجة ستختلف لو كنت موجوداً؟

# Pumpkingdom - Blooming in the Rain
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce=أوه! مرحباً! يبدو عليك أن يديك مناسبتان للبستنة! التربة كانت قلقة مؤخراً، أظن أنها تحتاج بعض الألوان البهيجة لتهدئتها. هل تريد مساعدتي في جمع بعض الزهور؟
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_1=أووه، زهور! يسعدني المساعدة.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_2=أنا مشغول جداً لجمع الزهور الآن.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker=انتظر، انتظر! لا يمكننا اقتلاعها هكذا، الجذور حساسة! قبل أن نخرج، توجّه إلى ذلك المتجر واشترِ أداة قطف الزهور.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker.response_1=حسناً، سأذهب أختار واحدة
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go=أحسنت، حصلت عليها! انظر كيف تلمع! حسناً، ركّزي يا Sandy... ركّزي... هيا نقطف الزهور!!!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go.response_1=نعم! الزهور!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions=انظر إلى هذه الهندباء! إنها كأجزاء صغيرة من الشمس. اقطف بعض الهندباء بالأداة، ثم أحضرها لي!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_1=هذه بعض الهندباء!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_2=آه، دعني أذهب لأجلبها! تشتّت انتباهي قليلاً.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_dandelions=ركّز! تأكد من قطف الهندباء بالأداة حتى لا نزعج الأرض!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys=هل سمعت ذلك؟ الأرض شعرت... بنوع من الطقطقة. هيا نجد بعض الخشخاش. أحمره قوي جداً، مثالي للأطلال.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_1=نعم، هيا نستكشف!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_2=إذا كان لا بد...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys=بسرعة، بسرعة! اقطف بعض الخشخاش بالأداة، ثم أحضر لي بعضه! إنه يخدم الأرض خدمة كبيرة.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_1=هذا بعض الخشخاش!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_2=آه، دعني أذهب لأجلبه!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_poppys=الخشخاش! تأكد من قطف الخشخاش بالأداة!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys=حسناً، شيء أخير واحد... أظن. أووه! هيا نجد بعض الفاوانيا. إنها كبطانيات رقيقة للتراب!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_1=نعم، هيا نستكشف!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_2=حسناً...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys=أليست رائعة؟ اقطف بعض الفاوانيا بالأداة، ثم أحضرها لي! إنها القطعة الأخيرة في ضمادتنا الزهرية!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_1=هذه بعض الفاوانيا!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_2=آه، دعني أذهب لأجلبها!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_peonys=لا تنسَ! تأكد من قطف الفاوانيا بالأداة!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home=أوه! سلّتي تفيض! وقدماي بدأتا تتنميلان... أظن أن هذا يكفي. هيا نعود للبيت.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_1=نعم، هيا نعود للبيت!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_2=ساقاي تؤلمانني من كل هذا المشي :(
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up=كان ذلك جميلاً! الأرض تبدو أهدأ قليلاً بالفعل، أليس كذلك؟ لنكرر هذا في يوم ما.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_1=نعم، استمتعت بذلك أيضاً.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_2=كان جيداً، أظن. لست من أكبر المعجبين بالزهور.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello=هيه، كيف حالك؟ أتمنى أن تكون مشرقاً وجاهزاً لمساعدة الشتلات!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello.response_1=أتمنى أن تكوني كذلك أيضاً!

# Pumpkingdom - Non-Quest NPCs
skyblock_hub_dialogues.overworld.plains.pumpkingdom.cedric.hello=إذا شممت رائحة حرق، فأنت تقترب كثيراً من النار. هذه البطاطس نيئة.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello=اهمس، من فضلك. الفزّاعات تسمع. أو ربما أنا أفقد عقلي.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello.response_1=هل تريد تميمة قرع محظوظة؟
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.detail_1=لا. بالتأكيد لا.\nإذا حملت تميمة حظ وفشلت، سأضطر للبدء بالإيمان بتمائم النحس أيضاً.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello=مرحباً بك أيها المسافر. أنت في Pumpkingdom. عندنا قرع عالمي الشهرة هنا.\nهل يمكنني مساعدتك في شيء؟
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_1=غنِّ لي شيئاً.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_2=لماذا يُسمى Pumpkingdom؟
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_3=أنا فقط عابر.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.verse_1=أيها القرع، أيها القرع، برتقالي ومضيء،\nتنتظر ليلة مرعبة.\nبابتسامة مضحكة أو وجه مخيف،\nأنت أجمل قرعة في المكان.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.detail_1=لأن قول "قرية القرع" كان يبدو كأننا ندعو للغزو.\nأيضاً أعلن العمدة الأول ذلك بسكين نحت، ولم يجادل أحد السكين.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.maeve.hello=مرحباً! أنا Maeve. أحب الكتب، وأحب القراءة. يمكنك تعلّم الكثير من الكتاب. إلا القراءة. تعلّم القراءة من قراءة كتاب لم ينجح مع أي شخص جرّبته.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.quinn.hello=لا تلمس الرافعات.\nفي الواقع، القها. بلطف.\nليس لديّ أي فكرة ما الذي تفعله، لذا إذا انفجر... لا تنظر إليّ!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello=إذا جئت للقرع، خذ الطريق الأيسر.\nإذا جئت لنكات سيئة، تهانيّ. أنت ضائع بالفعل.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_1=أخبرني بنكتة سيئة.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_2=سأتركك لشأنك.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1=كيف تصلح قرعة مكسورة؟\nبرقعة قرع!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1.response_1=هذا مؤلم فعلاً.

# Pumpkin Towers - Potato Zombies
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce=سسس! تبدو وكأنك تستطيع التعامل بمجرفة أو سيف.\nعندنا مشكلة صغيرة هنا... الزومبي يغزون حقولي.\nيدمرون المحاصيل، ويقضمون الأسيجة، والأسوأ من ذلك، يأكلون بطاطسي!\nهل يمكنك مساعدتي وإنقاذ الحصاد؟
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response1=بالطبع! لا أخاف من عدد قليل من الزومبي.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response2=إذا أردت ذلك حقاً...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane=عمل رائع يا صديقي!\nإذا كان لديك وقت فراغ... هل يمكنك زيارة صديقتي Susane؟\nيبدو أنها تعاني من العناكب حول قرعها.\nهل تمانع إيجادها ومساعدتها أيضاً؟
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response1=هيا نسحق بعض العناكب!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response2=سأحمي قرعك!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks=واو، أريتَ تلك الوحوش من هو المسيطر!\nلا أصدق أنك تخلّصت من هذا الكم\nليتها اختفت للأبد... لكن في الوقت الحالي، فعلت فرقاً حقيقياً!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks.response=في أي وقت، المساعدة هي تخصّصي!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hows_it_going=كيف الأوضاع؟\nهل تصدّق أن تلك المخلوقات سيطرت على المكان هكذا فجأة؟\nهذا حظنا...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hello=هل تريد معرفة سرّ صغير؟\nاسمي الحقيقي ليس Fred.\nبدأ الناس يناديني Potato Fred بعد تلك المرة التي علقت فيها داخل كومة من البطاطس.\nما زلت لا أعرف كيف خرجت من هناك...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.see_fred=مرحباً!\nهذا القرع ليس الوحيد الذي ينمو بسرعة، الآفات أيضاً كذلك!\nشريكي، Potato Fred، يحتاج مساعدتك بالتأكيد.\nهل تمانع التوجّه للتحقق منه؟
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred=آآآه!\nعناكب! عناكب في كل مكان!\nتدمّر قرعي!\nهل يمكنك مساعدتي في التخلص منها؟
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response1=آخ، عناكب!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response2=بالطبع، العناكب لا تخيفني!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders=هل تخلّصت من تلك العناكب؟\nأنا خائفة جداً من العودة إذا لم تختفِ...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders.response=ما زال هناك بعضها...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.hello=آه، أحب أن أرى قرعي في حال جيدة...\nتلك العناكب الغبية دائماً تحاول إفساد كل شيء!\nنأمل أن تبتعد هذه المرة للأبد...

# Plains - Pumpkin Towers - Susane & Kipp
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce=أنت هناك! تبدو وكأن لديك إحساساً بالعدالة! هناك برعم شقيّ يجوب المنطقة ويسرق قرعي الفائز بالجوائز لـ"مشاريعه". يجب أن تجده حتى أعطيه محاضرة صارمة لكن عادلة! هل يمكنك مساعدتي في إمساك المذنب؟
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_1=سأتتبع ذلك الشقيّ الصغير!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_2=حسناً، سأساعدك في الوصول لقاع هذه القضية.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going=أي نتيجة في العثور على ذلك الولد ومحاصيله المسروقة؟ قرعي مخصّصة للمهرجان، ليس لرمي السهام!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going.response=ما زلت أعمل، Susane!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete=ها هو! الشيطان الصغير! ...انتظر، لحظة. هل هذه قرعة منحوتة؟ انظر إلى الحرفة... لم يدمّرها، بل حسّنها! واو، هذا مذهل فعلاً. شكراً لإحضاره هو وفنّه إليّ.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete.response=يسعدني أنني حللت سوء الفهم!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce=Susane أرسلتك لتجرّني إليها؟ لا لا لا... ستكون غاضبة جداً! من فضلك، لا تأخذني إليها الآن! أنا لست سارقاً، أنا فنان! انظر، إذا أحضرت لها هدية صلح... ساعدني في إيجاد سكين نحتي، وسأصنع شيئاً يغيّر رأيها.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_1=سأجد سكينك. لنرَ ماذا تستطيع أن تصنع.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_2=حسناً، سأبحث. فقط لا تسبّب المزيد من الفوضى.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint=آخر مرة كان معي كانت بالقرب من صفوف القرع الرئيسية حين كنت أبحث عن لوحة مناسبة. يجب أن يكون هناك في مكان ما!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint.response=أنا على الأمر.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife=وجدته! أنت منقذي. سأجعل هذا سريعاً، سأنحت لها تحفة فنية ستجعلها تنسى كل القرع المفقود!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife.response=هيا. أتمنى التوفيق!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.hello=أبقى هادئاً اليوم. الفن يتطلب تركيزاً، كما تعلم.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.knife.dont_know=هذا السكين غريب أن يُترك هكذا. عليه حرف "Kipp" منقوش في المقبض. يجب أن أعيده إليه.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.hello=هل تسمع ذلك؟ هذا صوت طعام جيد يُطبخ. أهل Pumpkingdom سيحبّون ذلك.\nشكراً على كل جهدك!
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available=إذا شممت رائحة العشاء، فأنا لا أزال أفوز. بصعوبة. صندوق الفحم فارغ، وكثير من الأفران تشقّقت. ساعدني قبل أن تبدأ كل Plains بمضغ البطاطس نيئة.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.help=أستطيع المساعدة.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.plan=ما هي الخطة؟
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.breaking=لماذا تتشقق الأفران؟
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.why_furnaces_break=دورات الحرارة، والأيدي المهملة، وقدر سيئ. في لحظة تكون بخير، ثم تتشقق وتنزّ رماداً. أستطيع التعامل مع فرن مكسور. لكن لا أستطيع التعامل مع مطبخ مكسور.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted=ممتاز. أحتاج ثلاثة أشياء، وأحتاجها بسرعة. فحم للحفاظ على الحرارة ثابتة، وأفران لتحل محل المكسورة، وبطاطس حتى أتمكن من إخراج شيء صالح للأكل.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted.response.all=سأحضر كل شيء.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items=في كل مرة أنظر جانباً، يأتي أحدهم ليـ"يفحص" فرناً ويترك بابه مفتوحاً. أحضر لي فحماً وأفراناً وبطاطس، وسأحوّل الفوضى إلى عشاء.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.deposit=أحضرت الإمدادات.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.working=أعمل على ذلك.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.deposit_thanks=جيد. في الصناديق وعلى الجمر. واصل الإحضار.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage=هذا كل شيء. النيران عادت، والطابور يتحرك، وستأكل Plains طعاماً مطبوخاً للمستقبل المنظور.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.glad=يسعدني أنني استطعت المساعدة.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.save=يوماً ما يجب أن نطبخ بعض الأشياء معاً!

# Plains - Ruins - Lewis
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available=الأطلال ليست مجرد ديكور. إنها طريق.\nحاول تدريب مهاراتك في الأطلال. ستستطيع على الأرجح تحسين حركتك بشكل كبير.\nحاول الوصول إلى Robb الذي رأيته يلعب في الأطلال في وقت سابق.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.accept=حسناً. سأصل إلى المنصة.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.tips=أي نصيحة قبل أن أبدأ؟
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.later=ليس الآن.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips=اختر نقطة هبوطك التالية قبل أن تقفز.\nخذها ببطء. لا داعي للتسرع.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips.response.okay=فهمت.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete=ما زلت هنا في الأسفل؟ إذن لم تصل بعد لقمة الأطلال.\nابقِ عينيك للأعلى وكن صبوراً. ستصل في النهاية.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.remind=ذكّرني أين Robb.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.go=فهمت. سأصعد.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location=في مكان ما بالقرب من القمة على ما أظن. فقدت رؤيته كلما ارتفع في الأطلال.\nإذا سمعت Robb يضحك، فأنت قريب.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location.response.on_my_way=في طريقي.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete=عُدت سليماً كما أرى. عمل جيد.\nهل كان Robb يتصرف بشكل مناسب؟ هل هو بخير؟ أحياناً يكون واثقاً أكثر من اللازم هناك، لكنني أثق به.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.remember=نعم، هو بخير
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.useful=يبدو صغيراً جداً على أن يكون هناك.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools=نعم، هو صغير، لكن ليس لدينا الكثير لنفعله هنا.\nيلعب في هذه الأطلال لتسلية نفسه.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools.response.thanks=أوه، أفهم.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.after_completion=حين ترى الحجارة المكسورة الآن، يجب أن تفكر: طريق، مخبأ، مسار هروب.\nنصيحة مفيدة جداً منذ أن أصبح الزومبي أكثر انتشاراً هنا.

# Plains - Ruins - Robb
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached=هاها! لا أصدق أنك وصلت!!!\nمرحباً بك في القمة! يوجد الكثير لترى من هنا. إنه ممتع جداً اللعب في الأطلال أليس كذلك؟\nكنت أراقبك وأنت تسقط في الطريق للأعلى. من المضحك رؤية الناس يحاولون الصعود.\nهل كان lewis جدياً كعادته؟ ربما يريدني أن أعود للبيت.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.rough=كثير من المرح!
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.easy=Lewis يُعجب بقدرتك على التنقل.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.trick=لا أصدق أنني وصلت أنا أيضاً.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough=مرح مرح حقاً! هاهاها! انظر فقط إلى المنظر. استوعب كل شيء.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough.response.laugh=هاها! نعم! أرى!
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy=أنا متأكد أنه يعجب بي. أنا أتحرك بسرعة كبيرة. أنا الأفضل في الركض هنا.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy.response.okay=لا تكن واثقاً أكثر من اللازم. إنه خطر.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick=الممارسة تصنع الكمال. ستكون أكثر ثقة في المستقبل عند الارتفاعات في الأطلال.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick.response.got_it=فهمت.
skyblock_hub_dialogues.overworld.plains.ruins.robb.hello=هيييي، كيف تجري ممارسة الباركور؟ أنا متأكد أنك تتحسن.


# Jungle - Treetop Tropics - Nilo & Billy
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.hello=هيه، كيف حالك؟ ما زلت على قيد الحياة؟ رائع! شكراً لإيجاد Billy، إنه محظوظ لأنه لطيف وإلا كنت سأحوّله إلى سجادة أرضية!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction=أوه، كارثة! كارثة مطلقة! قطتي Billy اختفت من جديد. إنه في مكان ما فوقنا، على الأرجح يخطط للسيطرة على العالم أو فقط يبحث عن طائر ليزعجه. هل يمكنك مساعدتي في استعادة الوحش قبل أن يقرر العيش في قمة الأشجار للأبد؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_1=هذا رهيب! سأجلبه فوراً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_2=سأبحث حين لا أكون منشغلاً بتجنب الكروم المتساقطة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_3=أنا مشغول جداً الآن. الغابة فوضى اليوم!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks=Billy! يا إلهي الشكر! لا أصدق أنك وجدته فعلاً! إنه دائماً جائع جداً كأن في بطنه ثقباً أسود. سأذهب لإطعامه بعض السمك قبل أن يبدأ بأكل أرضية الغابة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_1=لا يهم. أنا محترف في التحدث مع القطط.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_2=المزيد من السمك؟ هذه القطة لا قرار لها!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking=كيف الأمور؟ أي أثر للهارب المفرعن؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking.response=ما زلت أحاول. القطط ماكرة، وBilly نينجا محترف.

# Billy the Cat
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found=مياو <italic>(ينظر إليك بابتسامة متعجرفة وعارفة)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found.response=تعال معي أيها المشاغب. لنعود للبيت.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1=مياو <italic>(تقرقر بطنه كالرعد)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1.response=تفضّل، خذ بعض السمك. توقف عن الصراخ!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2=مياو <italic>(ينظر إليك بتوقع)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2.response=تفضّل، خذ المزيد من السمك.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3=مياو <italic>(القرقرة مستمرة!)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3.response=هل هذه القطة بلا قاع؟ حسناً، سمك!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4=مياو <italic>(غير مبالٍ)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4.response=هذه السمكة الرابعة. بجدية، Billy؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5=مياو <italic>(يبدو راضياً أخيراً)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5.response=أخيراً! هيا نعود للبيت.


# Jungle - George - Fishy Business
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction=آه، الشعور اللطيف بالسحب على الخيط، وإثارة الصيد المطلقة! شغفي بالصيد أسطوري، لكنني لم أتمكن من إلقاء الخيط منذ وقت طويل. عائلتي هنا في الغابة، ولن أتبادلها بكل محيطات العالم، لكن يا له من شوق للماء! يجب أن تجرّبه، إنه سحر خالص!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_1=حسناً! اقنعتني!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_2=هل هو بهذه الروعة حقاً؟ سأجرب.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_3=ليس الآن، George.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch=كيف تستمتع بالصيد؟ هل وجدت الإيقاع؟ أتمنى أن تحصل على صيد أسطوري!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch.response=أعمل على ذلك، George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit=بمجرد صيد كمية كافية من السمك، أعطها لي للفحص الدقيق!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit.response=تفضّل.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks=قلت لك إنه سيكون ممتعاً! انظر لهؤلاء الجمال، لديك موهبة حقيقية في هذا! شكراً لمشاركتي الإثارة، الصيد وقت رائع، وأفضل بكثير مع الأصدقاء. أسف لأنني لم أستطع الذهاب للبحيرة بنفسي!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks.response=في أي وقت، George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.hello=مرحباً! الماء جميل حتى في الغابة! هل أنت مستعد لإلقاء الخيط؟ لكن تعرف ما الذي يجعله أفضل؟\nالصيد مع صديق عزيز!


# Jungle - Celia - Bean to Bar
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.hello=مرحباً. هل الشوكولاتة طعامك المفضل في الغابة؟ آمل ذلك!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.come_back_for_sugar=مرحباً. إذا عُدت إليّ بعد أن تجد السكر، يمكنني أن أريك كيف تحلّي شوكولاتتك.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available=أنت هناك. هل تريد تعلم صنع الشوكولاتة؟ شوكولاتة لذيذة ورائعة. رغم أنها غير صحية، ستحصل على دفعة من الطاقة منها.\nلنبدأ بالشوكولاتة غير المحلاة. الشوكولاتة بدون سكر بديل أكثر صحة بكثير.\nسأعطيك الوصفة، لكن ستحتاج للذهاب وصنعها. أخبرني بالنتيجة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_1=يممم! شوكولاتة!!!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_2=أوه لا، أكره الشوكولاتة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.in_progress_craft=كيف تسير الشوكولاتة؟ آمل أن الشوكولاتة غير المحلاة ترقى لتوقعاتك.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete=إذن؟ أعطني التقرير.\nهل كانت مرّة؟ ما الآثار الجانبية التي شعرت بها؟\nكثير من الناس يبدأون بالركض بسرعة كبيرة بعد تناول الشوكولاتة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_1=مرّة، لكن رائعة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_2=أظن أنني أحتاج ماء.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available=مرحباً مجدداً. إذن، تريد تعلّم كيفية إضافة السكر للشوكولاتة؟ هيا نفعل ذلك.\nتعرف ما الطريقة. سأعطيك الوصفة، لكن ستحتاج للذهاب وصنعها. أخبرني بالنتيجة.\nكن حذراً: الشوكولاتة غير صحية، ويجب تناولها باعتدال دائماً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_1=نعم، لنصنع المزيد من الشوكولاتة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_2=أنا أحرص على صحتي الآن، لكن حسناً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft=كيف تسير إضافة السكر للشوكولاتة؟ قبل أن تدري، ستكون تعمل نحو إمبراطورية شوكولاتة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_1=عندي هذا. إنه سهل.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_2=لست جيداً في صنع الشوكولاتة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete=فعلتها! شوكولاتة. غنية وكاملة كما كنت تأمل.\nالآن كن عاقلاً ولا تركض بجنون مع تلك الجرعة الكبيرة من السكر.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_1=لا تقلق، أنا ناضج جداً مع الشوكولاتة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_2=انهيار السكر سيؤلم.

# Jungle - Treetop Tropics - Non-Quest
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello=انتظر لحظة. أحتاج أن أتحقق من حبوب الكاكاو هذه. ربما هي جاهزة.\nأوه انتظر، ماذا عن هذه...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello.response_1=أرى أنك مشغول جداً الآن.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello=بنيت بعض هذه المنصات حين تعطّلت. أتمنى أن هندستي جيدة بما يكفي لتبقى ثابتة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_1=بنيت كل هذا؟ هذا مذهل.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_2=تبدو وكأنك على وشك الإغماء.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1=شكراً. حسناً، ليس كل شيء. أنا فقط أصلح الأجزاء حين تتعطل.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_1=الكثير من الدرابزينات. تفضيل شخصي؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_2=خائف من الارتفاع...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_railings=نعم.\n<italic>(يمسك الدرابزين بكلتا يديه.)</italic>\nالخوف من الارتفاع يؤدي إلى إجراءات أمان إضافية.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_advice=لا تسخر مني. لم أختر هذا، وُلدت هكذا.\nرغم أن هذا ذنبي لأنني أساعد هنا في الأعلى. كنت أتمنى أن أكون صياداً على الأرض.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_2=هل رأيت الارتفاع الذي نحن فيه؟! نحن عالٍ جداً، وأنا خائف من الارتفاع! ربما هذا دوار الارتفاع.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello=هيه أنت، هل تريد نكتة سيئة؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_1=حسناً. نكتة واحدة. اجعلها مؤلمة.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_2=لا شكراً. أقدّر السلام.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu=اختر بحكمة. في الغابة كثير من المفترسين، لكن لا أحد لا يرحم مثل خاتمة نكتي.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_1=اضربني بنكتة عن الأوراق.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_2=أعطني شيئاً عن العناكب.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_3=حسناً. اجعل الكاكاو مضحكاً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_1=حاولت ترك الغابة، لكن الكروم قالت: "لا، أنت تبقى."\nأظن أنني في علاقة طويلة الأمد بالورق.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_2=ما اسم عنكبوتَين تزوّجا للتو؟\nزوجان جديدان نسجا حياتهما معاً!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_3=كاكاوي لا ينضج في الوقت المناسب للأكل. إنه دائماً متأخر عن الموعد.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.avaru.hello=هيه! يا له من يوم جميل! يسعدني لقاؤك! أتطلع لرؤيتك في الجوار!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cressida.hello=انظر إلى حجم هذه الشجرة! إنها ضخمة جداً! :O\nأتساءل كيف يصل الماء إلى القمة!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello=إذا رأيت قطاً برياً، لا تطارده. إنه خائف جداً منك.\nهذه النصيحة تنطبق على الناس أيضاً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello.response=سأتدرب على أفضل وجه غير مبالٍ.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.silva.hello=هيه، انظر أين أنا! أنا تحت شجرة!\nكنت خائفاً منها، لكنني لاحظت جذورها. إنها مكعبات. لذا رياضياً أرى الشجرة بُعداً واحداً، لأنني أنظر إلى جذرها التكعيبي.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello=يبدو عليك أنك قادم من Oak Forest.\nمرحباً بك في الغابة أيها المسافر. ستحتاج للتعود على التسلق في الأشجار. أتمنى ألا تكون خائفاً من الارتفاع.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_1=رائع. أنا مرتاح مع الارتفاع.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_2=يا إلهي، لن أتأقلم بشكل جيد.
skyblock_hub_dialogues.misc.optimiser_not_unlocked=مرحباً! أنا المحسِّن! يمكنني تعزيز إنتاج جميع مواردك.\nأنا انتقائي فيمن أعمل معه، لذا عُد حين تتقدم أكثر!

# Shop Dialogues
skyblock_hub_dialogues.shop.blocks.greeting=صباح النور، لن تجد بلوكات أفضل في أي مكان! هل تريد الاطلاع؟
skyblock_hub_dialogues.shop.blocks.greeting.buy=ماذا عندك للبيع؟
skyblock_hub_dialogues.shop.blocks.greeting.sell=دعني أبيعك بعض الأشياء!
skyblock_hub_dialogues.shop.blocks.greeting.nothing=لا، شكراً!
skyblock_hub_dialogues.shop.furniture.greeting=أثاث جميل لشخص رائع! هل أعرض عليك شيئاً؟
skyblock_hub_dialogues.shop.furniture.greeting.buy=أرني ما عندك!
skyblock_hub_dialogues.shop.furniture.greeting.sell=عندي بعض الأشياء للبيع.
skyblock_hub_dialogues.shop.furniture.greeting.nothing=أنا بخير الآن، شكراً.
skyblock_hub_dialogues.shop.garden.greeting=عندي كل ما يجعل حديقتك تزهر! مهتم؟
skyblock_hub_dialogues.shop.garden.greeting.buy=أرني ما عندك للبيع!
skyblock_hub_dialogues.shop.garden.greeting.sell=أريد بيع بعض الأشياء.
skyblock_hub_dialogues.shop.garden.greeting.nothing=لا، شكراً!
skyblock_hub_dialogues.shop.misc.greeting=أراك تتطلع حواليك! ما الذي لفت انتباهك؟
skyblock_hub_dialogues.shop.misc.greeting.buy=ماذا يمكنني اشتراؤه هنا؟
skyblock_hub_dialogues.shop.misc.greeting.sell=في الواقع، عندي بعض الأشياء للبيع.
skyblock_hub_dialogues.shop.misc.greeting.nothing=لا شيء الآن، شكراً.
skyblock_hub_dialogues.shop.ore.greeting=كل الخامات التي تشتهيها! هل تريد الاطلاع؟
skyblock_hub_dialogues.shop.ore.greeting.buy=أرني خاماتك!
skyblock_hub_dialogues.shop.ore.greeting.sell=أريد بيعك بعض الأشياء.
skyblock_hub_dialogues.shop.ore.greeting.nothing=ليس الآن، شكراً.
skyblock_hub_dialogues.shop.spawner.greeting=مستعد لتوليد المزيد من المخلوقات؟ عندي تماماً ما تحتاج!
skyblock_hub_dialogues.shop.spawner.greeting.buy=أرني ما عندك!
skyblock_hub_dialogues.shop.spawner.greeting.sell=في الواقع، أريد بيع بعض الأشياء.
skyblock_hub_dialogues.shop.spawner.greeting.nothing=ربما في المرة القادمة، شكراً.

# Cold Taiga - Ivar - Frozen Harvest
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro=البرد ممسك بقبضة لا تترك، والمخازن تنفد بشكل خطير. أحتاج التأكد من إطعام الجميع طوال فترة التجمد. هل يمكنك الخروج وجمع بعض القمح لي؟
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro.response.accept=بالطبع، سأساعدك! القرية تحتاجه.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources=ابقِ رأسك منخفضاً ويديك تعملان. كيف تسير عملية حصاد القمح؟
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources.response=ما زلت أعمل! الصقيع صعب القطع.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro=يسعدني رؤيتك عُدت. هل وجدت شيئاً للمخازن؟
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro.response.yes=هذا القمح، طازج التحصيد!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks=عمل متين. هذا سيبقي القرية شبعانة لأيام أخرى. أراك قريباً!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks.response=يسعدني المساعدة!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello=كيف الأمور! لا تدع البرد يتسلل لعظامك.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello.response=رائع! أبقى دافئاً!

# Cold Taiga - Felix - Winter Warmth
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro=البرد يشتد الليلة، أليس كذلك؟ أحاول إبقاء الجميع دافئاً، لكن الوقود ينفد من المدافئ. هل يمكنك جمع بعض سجلات التنوب لنبقى دافئين؟
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro.response.accept=بالطبع، سأساعدك! أي شيء يحافظ على دفء القرية.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro=أوه، عُدت! هل تمكنت من إيجاد بعض سجلات التنوب؟ البرد يشتد حقاً هنا، وعائلتي وأنا نبدأ بالشعور بالبرودة!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro.response.yes=هذه سجلات التنوب!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks=ممتاز. شكراً جزيلاً لمساعدتك. قلبك الطيب جداً يجعل هذا المكان يشعر بأنه بيت أكثر.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks.response=يسعدني المساعدة!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello=مرحباً! يسعدني رؤيتك. أتمنى أن يومك كان رائعاً كما أنت!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello.response=مرحباً! ابقَ دافئاً!

# Cold Taiga - Felix - Warmth in the Cold
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro=شكراً لمساعدتنا على البقاء دافئين. هل تمانع المساعدة في الحصول على Snowberries وبرادة قشر التنوب وسكر اللازورد المسحوق؟\nهذه موارد نادرة توجد في Snowy Taiga، لكن يمكن أن تكون ذات قيمة لبقائك.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro.response.accept=سأجمع تلك الأشياء لك!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro=هل وجدت المكونات التي أحتاجها؟\nيمكن إيجادها كلها في Snowy Taiga: Snowberries تفضّل التواجد بالقرب من أشجار التوت. سكر اللازورد المسحوق يتكوّن على سطح البحيرات المتجمدة حين يذوب من الصخر أسفله. أخيراً، برادة قشر التنوب هي الأصعب إيجاداً، لكن يجب أن تجدها بالقرب من أشجار التنوب.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro.response.yes=دعني أعطيك ما عندي!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks=ممتاز! سمعت أن Snowberries مفيدة في الزنازين. تعيد صحتك وتمنحك طبقة إضافية من الحماية!\nهل يمكنك تجربتها؟ حاول أكل بعض Snowberries أثناء استكشاف زنزانة وأخبرني بالنتيجة!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks.response=سأجربها!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress=هل جربت أكل Snowberries في الزنزانة؟ أنا فضولي لمعرفة إذا كانت مفيدة كما أظن!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress.response=ليس بعد، سأذهب لتجربتها!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete=أوه، Snowberries ساعدت في الزنزانة! رائع أن أسمع ذلك! حين آكل واحدة أشعر كأنها تعطيني عناقاً دافئاً.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete.response=على الرحب!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro=الجليد العميق كان يتحرك مؤخراً، مكشوفاً عروقاً زرقاء لا ينبغي أن تكون هناك. أحتاج لازورد لأبحاثي. هل يمكنك جمع بعض باستخدام مجموعة متنوعة من الأدوات؟ أريد أن أرى إذا كانت طريقة الاستخراج تغير رنين الجوهرة.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro.response.accept=بالطبع، سأساعدك في التحقيق!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress=كيف تسير عملية كسر اللازورد بأدوات مختلفة؟ أي اهتزازات غير عادية في الحجر؟
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress.response=ما زلت في العمل!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro=ممتاز. هل يمكنني الحصول على تلك الأحجار الكريمة من اللازورد التي كسرتها بأدوات مختلفة؟ أحتاج مقارنة متانة البنية في كل مجموعة.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro.response.yes=تفضّل!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks=شكراً. انتظر لحظة بينما أفحص هذه...\n...\nحسناً، هذا مخيب للآمال. البنية البلورية لم تتغير على الإطلاق. إنها متطابقة. كان هذا مضيعة كبيرة للوقت.\nعلى الأقل أكدنا أن الفيزياء البسيطة لا تزال تنطبق هنا وأن الأدوات الخشبية عديمة الفائدة لهذا العمق.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_1=أوه، هذا محبط. العلم تجربة وخطأ، أليس كذلك؟
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_2=لا أعرف ما الذي توقعته بصراحة.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello=الجليد يحكي قصصاً إذا نظرت بعمق.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello.response=فعلاً، أليس كذلك...

# Cold Taiga - Sigrid - Feather and Grain
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro=الصقيع يعضّ بعمق هذا الموسم، ومع اهتزاز أرضية الوادي كما تفعل، يجب أن ننتبه لبعضنا. ننجو معاً أو لا ننجو أبداً. هل يمكنك مساعدتي في تحضير مخزون وفير للقرية؟
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro.response.accept=سأنجز ذلك! لا أحد يجب أن يجوع.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro=أوه، عُدت! تعال أقرب للنار يا عزيزي، أرى البرد على كتفيك. كيف تسير عملية الجمع؟
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro.response.yes=هذا الطعام الذي طلبته!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks=بارك الله فيك. هذا سيبقي الصغار دافئين وروح المسنّين عالية. الجهد المشترك مثل جهدك هو ما يمنع الجليد من الوصول لقلوبنا.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks.response=يسعدني مساعدة المجتمع!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello=مرحباً! هناك دائماً مقعد دافئ وكلمة طيبة تنتظرك هنا.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello.response=مرحباً!


# Cold Taiga - Inga - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.before_unlock=Shiverfield دائماً جائعة في هذا الوقت من السنة. إذا كنت تبحث عن وجبة، تكلّم مع Sigrid. أنا مشغولة بما فيه الكفاية هنا.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro=احذر! لا تدوس هناك. سيتكاثرن حول حذائك كأن في جيبك حبوب.\n\nبدأت بعدد قليل من الدجاجات. كافٍ لتشغيل الأفران حين يشتد الصقيع.\n\nلكن مؤخراً؟ كأن الشتاء لا يستطيع لمسهن. الوباء البنفسجي ينتشر، والناس يجوعون، ودجاجاتي تتكاثر كأنهن يسخرن منا.\n\nإنهن في كل مكان. في تلال الثلج. على الأسطح. ينقرن في الأكياس التي لا يمكن استبدالها.\n\nلا أستطيع فقط... إيذاءهن. إنهن لي وهن أحياء. ربّيتهن.\n\nمن فضلك. تكلّم مع Runa في حرس Shiverfield. ستعرف ماذا تفعل. أنا فقط أحتاج إجابة لا تقلب معدتي.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_1=سأتكلم معها.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_2=دجاجات تستولي على بلدة. هذا جديد.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.in_progress=إذا رأيتهن في الشوارع، فقط... لا تطاردهن من أجل المرح، حسناً؟ إنهن تثق بالناس. هذا هو أسوأ جزء.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete=يداك تشمّان الريش.\n\n...لا تكذب. أرى ذلك في عينيك.\n\nفعلت ما أخبرتك به Runa، أليس كذلك؟\n\nأكرهه. أكره أنه منطقي.\n\nShiverfield تحتاج طعاماً. وسهاماً. والشتاء لا يهتم بما نريد.\n\nفي المرة القادمة حين أقول لنفسي إنني أستطيع الحفاظ على كل شيء بنيّات طيبة، ذكّرني بهذا.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_1=آسف. لم يكن لدينا خيار آخر.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_2=قطيعك كان يطعم البلدة، بطريقة أو بأخرى.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_3=سأساعدك في إعادة بناء الحظيرة حتى لا يحدث هذا مجدداً.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.after_completion=ما زلت أحب الدجاج. فقط أحب Shiverfield أكثر.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello=مرحباً.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello.response=مرحباً!

# Cold Taiga - Runa - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro=Inga أرسلتك. سمعت القطيع قبل أن أراك.\n\nانظر، أنا لا أستمتع بهذا. لا أحد هنا يفعل.\n\nلكن الطرق صارت أسوأ الآن. الصيادون لا يعودون بنفس الانتظام. الفساد البنفسجي يجعل الغابة تبدو غريبة، كأن الظلال تستمع.\n\nلدينا بلدة لنطعمها، وبلدة لندافع عنها من الأحداث الغريبة.\n\nالدجاج يعني لحماً للجياع وريشاً للسهام. بدون سهام، نحن الحرس نصبح جداراً من الأيدي الفارغة.\n\nستحتاج لاصطياد عشرة. أحضر لي عشرة ريشات. لن نهدر ما نأخذه.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_1=فهمت. سأتولى الأمر.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_2=Inga لن تكون سعيدة.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_3=سأتأكد من أنه يفيد البلدة.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.in_progress=نحتاج تخفيف عدد الدجاج قليلاً أكثر. ما زالت تغزو كل شيء.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro=هل معك تلك الريش؟\n\nإنها ذات قيمة كبيرة للحرس، ستصنع كميات وفيرة من السهام.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_1=نعم، تفضّل.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_2=لم يعجبني قتل تلك الدجاجات.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks=وفير. كافٍ لتزويد الحرس لفترة.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks.response_1=جيد.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.after_completion=إذا تمكنت من إطعام Shiverfield، تحافظ على حياتها. هذه هي المهمة.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello=كن حذراً هناك. الحرس يستطيع حمايتك في القرب، لكن في أعماق التندرا، أنت مسؤول عن نفسك.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello.response=سأكون حذراً.

# Cold Taiga - Kjell - Corrupted Curiosity
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available=انتبه لقدميك! هذه الدجاجات أصبحت متمردة!\nهناك شيء ما معهن، وإنهن تهاجمني. سلوك غريب جداً.\nأنا Kjell. أنا نوع من العلماء. أحببت دراسة الكيمياء في المدرسة، لكنني أظن أن لديّ فكرة عما يجري هنا.\nهل تمانع جلب إحدى تلك الدجاجات الفاسدة لي لأفحصها أكثر؟
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_1=يا إلهي، دجاجات شريرة. سأتولى الأمر!
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_2=سأساعدك في الوصول لقاع هذا.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro=هل حصلت على تلك الدجاجة الفاسدة؟ لا أستطيع الانتظار للوصول لقاع هذه اللعنة.\nأوه، ومهما تفعل، لا تأكلها. تبدو فكرة رهيبة وليس لها أي فائدة.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro.response_yes=عندي الدجاجة.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit=رائع! حصلت عليها! دعنا نرى ما لدينا هنا...\n...\nأوه، أظنها حية؟ تلك المادة البنفسجية. إنها ليست حجراً.\nحسناً... هذا كل ما يمكنني فعله للمساعدة. قلت إنني جيد في الكيمياء، ليس الأحياء.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_1=حية؟ يا إلهي...
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_2=أظن أننا سنحتاج مواصلة البحث
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.hello=إذا حصلت على مزيد من الإجابات حول ما هي تلك المادة البنفسجية، أنا حريص جداً على المعرفة. لا أستطيع تصديق أنها حية!


skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.dungeon_guard.introduce=واو! هل سمعت أنك هنا للمساعدة؟\nلدينا مشكلة ضخمة في مناجمنا الجديدة.\nكنا نحفر لنحصد كميات كبيرة من اللازورد الثمين من الاحتياطيات تحت البحيرات.\nلكننا اجتُحنا! هناك الكثير من الوحوش والزواحف. يبدون وكأنهم يريدون اللازورد لأنفسهم.\nهل ستساعدنا؟
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro=الحرارة ليست الشيء الوحيد الذي ينهكنا؛ أساس الواحة نفسه يتحرك. نحتاج حجارة رملية لتدعيم المراسي قبل أن يبتلع الرمل ما تبقى على السطح. هل يمكنني الاعتماد على قوتك؟
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro.response.accept=سأساعدك في تأمين الأسس!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro=بثبات الآن. هل تمكنت من تأمين الحجارة الرملية التي طلبتها للتدعيم؟
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro.response.yes=المواد بين يديّ!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks=هذا سيمنحنا بعض الوقت ضد الهبوط. كل حجر يُوضع هو درع ضد الانزلاق الحتمي. شكراً.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks.response=يسعدني الحفاظ على استقرار الصحراء.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello=ابقِ قدميك خفيفتين وعينيك على الأفق. الصحراء لا تتوقف عن التحرك.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello.response=سأبقى يقظاً، Zahra. شكراً.

# Desert - Unsafe Roads
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro=الطرق أصبحت خطيرة؛ الرمال تبتلع العلامات أسرع مما نضعها. هل يمكنك إحضار بعض الحجارة الرملية لتدعيم الطرق؟
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro.response.accept=سأحضر ذلك لك.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress=الكثبان متقلبة اليوم. هل وجدت الكمية الكافية؟ يجب التأكد من أن لدينا ما يكفي لتثبيت الطريق.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress.response=ما زلت أبحث...
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return=أحسنت. الطاقم يفيد بأن الدعامات تتماسك. الوعي هو أفضل دفاع هنا. شكراً.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return.response=في أي وقت!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello=أبقِ عينيك للأعلى. في هذه الصحراء، إذا لم تكن تتتبع الخطر، فالخطر يتتبعك.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello.response=مرحباً!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.intro=Talib أرسلك؟ جيد. الأرض هشّة هنا والكثبان تزحف للداخل. هل معك الحجارة الرملية؟
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.response=هاهي.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks=شكراً، هذا سيجعل الطريق أكثر صلابة. الأرض أقل احتمالاً للانزلاق مع هذا في مكانه.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks.response=رائع!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello=يوم جيد للبناء، شريطة ألا تقرر الريح أخذ تقدمنا معها.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello.response=فعلاً.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.intro=الاهتزازات تقلقل جدران الممر. طوب الطين سيساعد في استقرار الطريق. هل لديك منه؟
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.response=نعم، تفضّل.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks=ممتاز، هذا بالضبط ما نحتاجه لامتصاص الاهتزازات.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks.response=يسعدني المساعدة.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello=كن حذراً على الطرق. الصحراء عندها طريقة للانفتاح حين لا تتوقعه.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello.response=سأكون.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.intro=بدون أساس ثقيل، الرمل يتدفق. الجرانيت أساسي للقاعدة. هل أحضرت منه؟
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.response=عندي جرانيت هنا.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks=هذا جرانيت عالي الجودة! ثقيل بما يكفي لمقاومة الاهتزازات. شكراً.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks.response=عفواً.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello=الصحراء قاسية على من يبني على أرضية هشّة.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello.response=صحيح تماماً.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.intro=نحتاج تدعيم التحاريج قبل أن تنهار. أخيراً، بعض الخشب للدعامات! هل أحضرت ألواح التنوب؟
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.response=نعم، ألواح التنوب كما طُلب.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks=ممتاز! دعّمنا كل شيء الآن. اذهب وأخبر Talib.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks.response=في طريقي!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello=العمل الجاد هو الشيء الوحيد الذي لا يستطيع الرمل تآكله.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello.response=هذا صحيح تماماً.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro=الأيام تزداد حرارة والليالي أكثر غموضاً. نحتاج احتياطيات لضمان عدم انهيار المستوطنة. هل ستساعدني في تأمين مستقبلنا؟
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro.response.accept=يمكنني المساعدة في ذلك.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro=بثبات الآن. كل الإمدادات مهمة حين تبدأ الرمال بالتحرك. هل معك احتياطيات للمخزون؟
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_1=نعم، عندي إياها.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_2=بالطبع! يسعدني دائماً المساعدة!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.no=آسف! ليس الآن!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks=العمل المنهجي يُثمر. هذه الإمدادات ستبقينا صامدين خلال الليالي الطويلة القادمة. شكراً.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks.response=عفواً.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello=الصحراء لا ترحم غير المستعدين. ابقَ بأمان هناك.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello.response=أنت أيضاً.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro=الرمال المتحركة تُخرج أشياء كان ينبغي أن تبقى مدفونة. الطرق تمتلئ بالزومبي، وأصبح التنقل مستحيلاً.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro.response.accept=سأتولى الأمر وأفتح الطريق.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro=الهواء يبدو أخف قليلاً مع ذهاب تلك الوحوش. هل معك أي لحم زومبي؟ أحتاج دليلاً على أن الكثبان أكثر أماناً.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_1=إيخ، لحم عفن. خذه إذا أردت.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_2=أعتقد أنني أستطيع التنازل عن بعضه للقضية.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon=الخطر لا يتلاشى أبداً بالكامل هنا. عُد بعد أن تنظّف الكثبان.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_1=سأفعل! الأمور تسير بشكل جيد!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_2=الزومبي يخيفوني :D
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response=سأفعل.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete=بمساعدتك، أمّنّا هذا الجزء من الطريق. نحن فريق قوي جداً!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_1=يسعدني المساعدة في إبقاء الطرق مفتوحة.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_2=أتفق تماماً!
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello=الصحراء تخفي مخاطر كثيرة تحت سطحها. ابقَ يقظاً.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_1=مرحباً.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_2=أتمنى أن تكون بخير!
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro=في أرض تحاول قتل كل شيء ناعم، ينجو الأكثر حدّة فقط. الصبار مفيد، يوفر الماء والدفاع والصبغة التي لا تتلاشى في هذا الوهج. أحضر لي بعضه.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro.response.accept=سأتولى ذلك فوراً.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro=الرمال تتحرك مجدداً. هل جلبت الصبار لمساعدتنا في تحصين المحيط؟
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro.response.yes=هاهو.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks=هذا سيصمد حين تذبل أشياء أخرى. نبات قاسٍ لعالم قاسٍ. شكراً.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks.response=عفواً!
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello=الحرارة والرمل والوقت، تجرّد كل شيء إلا الحقيقة. أوه مرحباً، كنت أتكلم مع نفسي...
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello.response=مرحباً!
skyblock_hub_dialogues.overworld.desert.duneside.azim.hello=آسف، أنا مشغول الآن. أحاول بناء توربين رياح. الكثير من الطاقة يمكن التقاطها من الريح. لا نريد رفع درجة حرارة الصحراء بحرق الفحم.
skyblock_hub_dialogues.overworld.desert.duneside.todd.hello=هيه! أنا Todd!\nلا تعبأ بي، أنا فقط أحرس هذا الباب لأتأكد من عدم هروب المخلوقات من الداخل. هذا نفق هروب Duneside، لكنه اجتُحن بالمخلوقات.\nإذا أردت المساعدة، Sunny في الجزء السفلي من نفق الهروب. أخشى أنها تعاني وحدها في تنظيفه.\nلا يمكنك الدخول من هنا، لذا ستحتاج إيجاد الطرف الآخر في الجزء السفلي من Duneside.
skyblock_hub_dialogues.overworld.desert.duneside.bashara.hello=لا تدوس على الرمال الداكنة. أعتقد أن هناك شيئاً غامضاً تحتها.
skyblock_hub_dialogues.overworld.desert.duneside.corvin.hello=لا أتذكر هذه الحجارة هنا. آمل أن السقف لا ينهار.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello=العطش يجعلنا نعاني. أبيع شيئاً يساعد، حتى لو كان الجميع يكرهه.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_1=الناس يكرهونه؟
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_2=يسعدني لقاؤك! أنا فقط عابر.
skyblock_hub_dialogues.overworld.desert.duneside.derya.detail_1=أبيع ماء الصبار. إنه ليس ماء عادياً. أحلى قليلاً أظن.\nالجميع يخاف منه لأنني لست جيداً في إزالة أشواك الصبار.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello=مدّ يدك. يمكنني قراءة مستقبلك...
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_1=حسناً. اقرأ مستقبلي.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_2=لا شكراً.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1=أرى ثلاثة أشكال.\nصبّار. باب. وزومبي منزعج جداً.\nلذا أظن أن مستقبلك سيتضمن كل هذه الأشياء.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_1=باب؟
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_2=زومبي منزعج؟
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_3=هذا هراء.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_doorway=للأسف لا أستطيع قراءة أكثر من ذلك. فقط رأيت باباً في رؤيتي. ربما يصبح هذا باباً مهماً جداً بالنسبة لك.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_zombie=هاها! بالتأكيد ستزعج زومبي في المستقبل.\nلم أرَ زومبياً يُظهر أي نوع من المشاعر من قبل، لذا يجب أن تزعجه فعلاً.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_nonsense=بالطبع هو كذلك.\nالهراء أخف للحمل من اليقين. أنا هنا فقط لرفع معنويات الناس من حولي.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello=أوف، الرمل طعمه مقرف. يستمر في الدخول لفمي.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello.response_1=لماذا تقف بهذا القرب من الرمل؟
skyblock_hub_dialogues.overworld.desert.duneside.vesper.detail_1=عندي أماكن يجب الوصول إليها! لن أدع الرمل يعترض طريقي.
skyblock_hub_dialogues.npc_name.devin=Devin
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello=يقول مطورو هذه اللعبة إن الأمر صعب عليهم الاستمرار في ابتكار هذا الكم من الحوارات لشخصيات مختلفة، لذا نسخوا بعضها.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_1=يا لهم من كسالى.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_2=لم ألاحظ ذلك. سأراقب.
skyblock_hub_dialogues.overworld.desert.duneside.dungeon_guard.introduce=هيه! هل تصدّق! نفق هروب Duneside اجتُحن بالمخلوقات الشريرة!\nنفق الهروب أساسي لبقائنا. كثير من العواصف الرملية القوية تدفن المدخل الرئيسي لـ Duneside، ونفق الهروب هو خياطنا الاحتياطي الوحيد!\nلديّ تفويض باستخدام نظامنا القديم لإغراق النفق بالحمم لتعقيمه. أنا مرهق من مجرد المشي للأسفل هنا، لذا لا أعتقد أنه فكرة جيدة أن أتولى هذا بنفسي.\nهل أنت مستعد؟

# NPC Names
skyblock_hub_dialogues.npc_name.alder=Alder
skyblock_hub_dialogues.npc_name.thorne=Thorne
skyblock_hub_dialogues.npc_name.bram=Bram

# Alder Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.before_unlock=يوم مشغول. أشجار للعناية، وخشب للمعالجة. عُد لاحقاً إذا احتجت شيئاً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available=ساعدت Ronan في إصلاح الأضرار من تلك الزلازل، أليس كذلك؟ عمل جيد. لكن لا يمكننا الاستمرار في إصلاح الشقوق كل مرة تتحرك فيها الأرض. كنت أفكر... بلوطات قديمة صمدت أمام ما هو أسوأ. جذورها تنتشر بشكل واسع وتتكيف مع الأرض. ربما يمكننا التعلم منها. هل تريد مساعدتي في اختبار شيء ما؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.what_thinking=ما الذي تفكر فيه؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.got_time=عندي وقت. ماذا تحتاج؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.not_now=ليس الآن، آسف.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation=Bram وأنا نناقش أسساً مرنة، هياكل تتحرك *مع* الأرض بدلاً من التشقق في مواجهتها. الغابة تفعل هذا بالفعل. كل مرة تضرب الريح القمة، تمتص الجذور الضغط. إذا استطعنا تكرار هذا المبدأ... حسناً، في المرة القادمة التي يهتز فيها شيء، ربما تنحني المباني بدلاً من الانكسار.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.how_help=كيف يمكنني المساعدة؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.complicated=يبدو معقداً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.think_about=سأفكر في الأمر.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response=إنه أبسط مما تظن. الطبيعة حلّت المشكلة بالفعل. نحتاج فقط للملاحظة والتكيف. ابدأ بالنظر إلى البلوطة القديمة، جذورها ثابتة منذ عقود. هناك تكمن الإجابة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.im_in=حسناً، أنا معك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.come_back=دعني أعود لهذا.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions=ممتاز. هناك شخص يجب عليك التحدث معه أولاً، Thorne. إنه باحث أشجار يدرس البلوطة القديمة منذ أسابيع. أقام معسكره بالقرب منها. إذا كان أي شخص يفهم كيف تبقى تلك الجذور ثابتة خلال الزلازل، فهو هو. اذهب اعثر على Thorne وانظر ما الذي تعلّمه.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions.response.find_him=سأجده.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active=Thorne ما زال عند البلوطة القديمة يدرس أنظمة الجذور. اذهب وتكلم معه، سيشرح أفضل مني.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active.response.on_way=في طريقي.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return=عُدت. ماذا رأيت؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.roots_web=الجذور تنتشر في كل مكان مثل شبكة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.big_tree=مجرد شجرة كبيرة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.correct_observation=بالضبط. شبكة. كل جذر يدعم الآخرين. حين تتحرك الأرض، تتكيف الشبكة بأكملها معاً، لا نقطة فشل وحيدة. هذا ما تحتاجه المباني. ليس كتلاً صلبة تتشقق تحت الضغط، بل دعامات مترابطة تُوزّع الضغط. يمكن لـ Bram تصميم هيكل الشبكة، لكننا سنحتاج مواد. الكثير منها.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.playful_correction=انظر عن كثب في المرة القادمة. تلك "المجرد شجرة كبيرة" نجت لقرون بكونها أذكى منا. جذورها تنتشر بعيداً وعمقاً حين تتحرك الأرض، تتكيف الشبكة بأكملها. هذا هو السر. في كل الأحوال، رأيت ما يكفي. الآن نحتاج مواد لبناء شيء مشابه.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions=إليك ما نحتاجه: أولاً، اجمع شتلات البلوط. ليس المزروعة، الطبيعية. أريد دراسة أنماط جذورها المبكرة واستخدامها كممتصات صدمات حية حول الهياكل الرئيسية. بينما تفعل ذلك، سنحتاج مكونات مصنوعة. سيحتاج Bram ألواح بلوط. توزّع الوزن أفضل من الكتل الكاملة. وأسيجة بلوط. ستُنشئ دعامات شبكية مرنة، مثل الجذور المتشابكة. يمكنك العمل على كل هذا بالتدريج. عُد حين تحصل على الشتلات، وسلّم القطع المصنوعة إلى Bram.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.got_it=فهمت. شتلات وألواح وأسيجة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.why_saplings=انتظر، لماذا الشتلات؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.lot_crafting=هذا كثير من الصنع.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_explanation=الأشجار الصغيرة تتكيف بشكل أسرع. إذا زرعناها بالقرب من الأسس، ستنمو جذورها في شبكة الدعم بشكل طبيعي. بالإضافة إلى ذلك، دراسة نموها المبكر تخبرنا كيف نُشكّل الشبكات الخشبية. هياكل حية ومبنية تعمل معاً، هذا هو الهدف.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.workload_acknowledgment=هو كذلك. لكن إذا أردنا أن ينجح هذا، نحتاج القيام به بشكل صحيح. خذ وقتك. الغابة لا تتسرع، ونحن أيضاً لا يجب أن نفعل ذلك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check=كيف تسير عملية الجمع؟ أحتاج تلك الستة عشر شتلة من البلوط متى تمكنت. ولا تنسَ أن Bram ينتظر الألواح والأسيجة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.working_on_it=ما زلت أعمل عليه.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.remind_me=ذكّرني بما احتجت؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.requirements_reminder=ستة عشر شتلة بلوط لي. أربعة وستون لوح بلوط واثنان وثلاثون سياج بلوط لـ Bram. كل شيء من خشب البلوط.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered=حصلت على الشتلات! دعني أرى هذه. *(يفحصها)* عينات جيدة، أنظمة الجذور تبدأ بالتشكّل بشكل صحي. ستندمج بشكل مثالي مع دعامات الشبكة بمجرد أن ينهي Bram البناء. عمل ممتاز.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.what_do=ماذا ستفعل بها؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.happy_help=يسعدني المساعدة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.planting_strategy=سأزرعها استراتيجياً حول محيط المباني. بينما تنمو، ستُنشئ جذورها تدعيماً طبيعياً، أسساً حية تتكيف مع الأرض. مع دعامات Bram الخشبية، سيكون لدينا نظام هجين. أفضل ما في العالمين.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram=الشتلات مثالية. الآن نحتاج فقط Bram ليحصل على موارده. هل سلّمت الألواح والأسيجة إليه بعد؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.working=أعمل على ذلك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.not_yet=ليس بعد.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete=فعلت كل ما طلبناه وأكثر. Bram بدأ بالفعل بتجميع إطار الشبكة، وزرعت الشتلات حول الهياكل الحيوية. حين يأتي الزلزال التالي، وسيأتي، هذه القرية لن تتماسك فحسب. ستتكيف. ساعدتنا في بناء شيء يتعلم، شيء يدوم. الغابة تُعطي، لكنك تأكدت من أننا نصغي. شكراً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.will_work=هل سينجح هذا حقاً؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.glad_help=يسعدني أنني استطعت المساعدة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.another_tremor=ماذا يحدث إذا كان هناك زلزال آخر؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.confidence=أعتقد ذلك. المبادئ سليمة، الطبيعة استخدمتها منذ آلاف السنين. حرفية Bram صلبة. وأعطيتنا بالضبط ما نحتاجه. إذا اهتزت الأرض مجدداً، سنكون جاهزين.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_readiness=حينها سنرى إذا كانت هندستنا صامدة. لكن حتى لو لم تصمد، تعلمنا شيئاً. هكذا يعمل التقدم، الملاحظة والتكيف والتحسين. الغابة تعلّم ذلك كل موسم.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion=الأسس المرنة تصمد جيداً حتى الآن. لا زلازل بعد، لكن حين تأتي، سنكون مستعدين. ما زلت أعتني بالشتلات، تنمو بشكل جيد. شكراً مجدداً على مساعدتك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.good_hear=يسعدني سماع ذلك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.other_projects=هل هناك مشاريع أخرى؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_projects=دائماً هناك شيء للتحسين. لكن في الوقت الحالي، أركز على هذا. الغابة تُعطي، أنا فقط أساعدها.

# Thorne Dialogues
skyblock_hub_dialogues.overworld.oak_forest.thorne.before_quest=أوه! مرحباً. أنا Thorne، عالم قياس أعمار الأشجار. بمعنى أبسط، باحث في أعمار الأشجار. كنت أوثّق بنية جذور البلوطة القديمة. عينة رائعة. مرت ما يقارب ثلاثة أسابيع وما زلت أكتشف أنماط تفرّع جديدة!
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction=Alder أرسلك؟ ممتاز! طلب مني شرح نتائجي، أليس كذلك؟ حسناً، جئت إلى المكان الصحيح. هذا البلوط *(يشير إلى الشجرة الضخمة)* عمره أكثر من 300 عام، ونظام جذوره مذهل للغاية. انظر كيف تنتشر الجذور إلى الخارج في شبكة متشابكة؟ كل جذر رئيسي يتفرّع إلى ثانوية، والثانوية إلى ثلاثية... هذا يخلق تكراراً. إذا تضررت أو ضُغط على قسم واحد، يتوزع الحمل عبر الشبكة بأكملها. خلال الزلزال الأسبوع الماضي، شاهدت الأرض تتحرك، يمكنك فعلاً *رؤية* الجذور تنحني، تمتص الحركة. الشجرة بالكاد تمايلت. هذا هو السر: المرونة مضافاً إليها الترابط يساوي الاستقرار.
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.roots_web=إذن الجذور تعمل مثل شبكة؟
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.help_buildings=كيف يساعد ذلك المباني؟
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.incredible=هذا مذهل.
skyblock_hub_dialogues.overworld.oak_forest.thorne.web_confirmation=بالضبط! شبكة ثلاثية الأبعاد تتحرك ككائن واحد. لا نقطة فشل وحيدة. إذا استطاع Alder وBram تكرار هذا المبدأ بدعامات خشبية، ستصمد المباني أمام الزلازل بشكل أفضل بكثير من الأسس الصخرية الصلبة. الطبيعة كانت تُتقن هذا التصميم منذ ملايين السنين، نحن فقط نستعير المخطط.
skyblock_hub_dialogues.overworld.oak_forest.thorne.buildings_explanation=آه! هنا يأتي ذكاء Alder. يريد بناء هياكل دعم تحاكي شبكة الجذور هذه، شبكات خشبية مترابطة يمكنها الانحناء تحت الضغط بدلاً من التشقق. أضف شتلات حية حول المحيط، وبينما تنمو، ستندمج جذورها الحقيقية مع الهياكل المبنية. هندسة هجينة. إنها عبقرية، حقاً.
skyblock_hub_dialogues.overworld.oak_forest.thorne.enthusiastic_response=أليس كذلك؟ يمكنني دراسة هذه الشجرة لسنوات وما زلت أتعلم شيئاً جديداً كل يوم. لكن Alder يحتاج تطبيقات عملية، ليس مجرد ملاحظات أكاديمية. اذهب أخبره بما رأيته، هيكل الشبكة، والمرونة، وتوزيع الحمل. سيعرف ماذا يفعل بهذه المعلومات.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1=هل وجد Alder ملاحظاتي مفيدة؟ آمل ذلك. الأشجار عندها الكثير لتعلّمنا إياه حول المرونة والتكيف.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.working_on_it=إنه يعمل على ذلك.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.what_else=ماذا تعلّمت أكثر؟
skyblock_hub_dialogues.overworld.oak_forest.thorne.other_learnings=أوه، من أين أبدأ؟ أنماط حلقات النمو تشير إلى أن هذه المنطقة شهدت نشاطاً زلزالياً كبيراً قبل نحو 80 عاماً، أسوأ بكثير من الزلزال الأسبوع الماضي. ومع ذلك نجت الشجرة. كنت أيضاً أتتبع شبكات الفطريات في التربة، تربط أشجاراً متعددة تحت الأرض، تتشارك المغذيات والمعلومات. الغابة أكثر ترابطاً بكثير مما يدرك معظم الناس.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion=سمعت أن Alder وBram أنهوا الأسس المرنة! استخدام أبحاث الجذور لهندسة عملية، أنا ممتنّ. الغابة تُعطي حقاً، أليس كذلك؟
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.thanks=شكراً لمساعدتك.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.studying_now=ماذا تدرس الآن؟
skyblock_hub_dialogues.overworld.oak_forest.thorne.acknowledge_thanks=بكل سرور! نادراً ما تجد أبحاثي تطبيقات عملية فورية. عادةً أنشر أوراقاً علمية يقرأها ثلاثة علماء آخرون من نفس المجال. هذا كان... منعشاً.
skyblock_hub_dialogues.overworld.oak_forest.thorne.current_research=أفحص أنماط تآكل اللحاء الآن. أحاول ربطها ببيانات الطقس التاريخية. ليست مثيرة كأنظمة الجذور المقاومة للزلازل، أعترف بذلك، لكنها لا تزال ذات قيمة لفهم تاريخ الغابة.

# Bram Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.before_quest=أعمل. عُد إذا أرسلك Alder.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.quest_accepted=Alder ذكرني؟ جيد. أخبرني حين تكون المواد جاهزة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages=Alder أخبرني عن خطة الأسس المرنة. تفكير ذكي. سأتولى بناء الشبكة، لكنني أحتاج مواد دقيقة. أربعة وستون لوح بلوط واثنان وثلاثون سياج بلوط. الألواح توزّع الوزن دون تشقق. الأسيجة تُنشئ دعامات متشابكة. أحضرها حين تكون مستعداً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.get_crafted=سأصنعها.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_slabs=لماذا الألواح بدلاً من الكتل الكاملة؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_fences=لماذا الأسيجة؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.slabs_explanation=الكتل الكاملة صلبة. الصلب يتكسر. الألواح أرفع، تنضغط قليلاً تحت الضغط ثم تعود لشكلها. مرونة دون فشل. هذا ما نحتاجه.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_explanation=الأسيجة تتشابك. كل عمود يتصل بالتالي. حين يضرب الحمل الشبكة، ينتشر عبر جميع نقاط الاتصال. لا قطعة واحدة تتحمل الحمل كاملاً. نفس مبدأ الجذور. مجرد خشب بدلاً من تراب.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials=ما زلت أحتاج تلك الألواح والأسيجة. خذ وقتك. أفضل الانتظار على عمل جيد من التسرع بعمل سيئ.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.almost_done=تقريباً انتهيت.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.remind=ذكّرني بما احتجت؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.requirements_reminder=أربعة وستون لوح بلوط. اثنان وثلاثون سياج بلوط. كل شيء من البلوط.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.still_need_fences=ما زلت أحتاج الأسيجة. أحضرها، ويمكننا البدء بالبناء.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered=الأسيجة. *(يختبر واحدة)* مفاصل متينة. هذه ستشكّل الشبكة. عمل جيد.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.everything=هل عندك كل شيء الآن؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.thanks=شكراً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.have_everything=مع الألواح والأسيجة، نعم. Alder يتولى الشتلات. سأتولى البناء. تحقق من Alder حين تكون مستعداً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_alder=المواد جاهزة. أبدأ التجميع. تكلّم مع Alder، سيريد الانتهاء من الخطة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion=الشبكة مُركّبة. الأسس تصمد. العمل القوي يدوم.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.good=يسعدني سماع ذلك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.hold_tremor=هل تعتقد أنها ستصمد في الزلزال؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.confident=بنيتها بشكل صحيح. استخدمت المواد الصحيحة. ستصمد.

# Ring The Bell
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.ring_the_bell.investigate=تشدّ الجرس بقوة. يرنّ بصوت واضح ونظيف.\nجرس النهار. هدوء النهار.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.hello=الجرس معلّق بلا حراك.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.locked=آسف، لا أستطيع القيام بـ"خطاب الترحيب".\nإذا لم يصحبك Cubit في جولة حول الساحة بعد، ابدأ من هناك.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.in_progress=جرّب الجرس في الساحة، ثم اسأل Levi وSandy وLiora وLee إذا كانوا سمعوا شيئاً في الليل.\nثم عُد إليّ.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello=مرحباً.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available=مرحباً. أنت الوجه الجديد الذي كان Cubit يصطحبه في الجولة، أليس كذلك؟ جيد. ستكون لديك آذان جديدة.\nاسمع... هل سمعت الجرس في الليل؟\nليس رنين النهار. ليس النوع المبهج. أعني النوع الذي يهبط معدتك.\nأستمر في الاستيقاظ على صوته. وحين أركض للخارج... لا شيء.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.bell_at_night=جرس البلدة؟ في الليل؟
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.dream=ربما كان حلماً؟
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.what_do=ماذا تحتاج مني؟
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request=اذهب للساحة واختبر الجرس. ثم اسأل بعض الناس إذا كانوا سمعوا شيئاً غريباً بعد حلول الظلام.\nLevi وSelena كانا مع Cubit حين وصلت، أليس كذلك؟ ابدأ بهم. وتكلّم مع Liora وLee أيضاً.\nإذا لم يسمع أحد آخر... فالمشكلة أنا. لكنني أحتاج للمعرفة.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.on_it=حسناً. سأسأل في الجوار.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.why_me=لماذا تسألني؟
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.are_you_ok=هل أنت بخير؟
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.why_you=لأنك لا تدين لي بكذبة لطيفة.\nالناس الذين يعرفونك سيحاولون أن يكونوا لطيفين. الناس الذين لا يعرفونك سيخبرونك بما سمعوه.\nوأنا أحتاج الحقيقة.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.are_you_ok=أنا... أتدبّر الأمر.\nفقط اذهب استمع بنفسك. إذا كنت مخطئاً، أريد أن أكون مخطئاً بشكل متعمد، ليس بالصدفة.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete=إذن. لم يسمع أحد.\nهذا... مريح. وأيضاً ليس كذلك.\nحين يحدث مجدداً، سأحاول أن أتذكر هذا الشعور. أن الخارج يمكن أن يكون هادئاً، حتى لو كان رأسي صاخباً.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.not_alone=أنت لست وحدك في هذا.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.something_else=ربما هو شيء آخر، وليس الجرس.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.tell_me=إذا حدث مجدداً، أخبرني.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_not_alone=...شكراً. لا أتذكر دائماً أنني أستطيع طلب المساعدة.\nأحاول.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_something_else=ربما.\nأحياناً الصوت يسافر بشكل غريب عبر الخشب. عبر الجذور.\nأحياناً تسمع شيئاً حقيقياً، لكن ليس من حيث تظن.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_tell_me=سأفعل.\nوإذا ركضت للخارج في منتصف الليل مجدداً... على الأقل سيكون لديّ سبب غير الذعر.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello.after_ring_the_bell=مرحباً. شكراً مجدداً على التحقق.\nإذا رنّ الجرس فعلاً يوماً ما، ستكون على الأرجح أول من يعلم.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked=الجرس في الليل...؟ مممه.\nأسمع أشياء كثيرة في الليل.\nبطانيتي. معدتي. الريح.\nمرة سمعت بسكوية تناديني باسمي. تبيّن أنها كانت... أنا. أنا من كان ينادي البسكوية.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.no=إذن لم تسمعه؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.worried=Chris قلق. هل يمكنك التفكير في أي شيء؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.nope=لا. إذا رنّ الجرس في الليل، كنت سأستيقظ.\nإلا إذا كان مؤدّباً جداً. حينها ربما كنت سأنام خلاله.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.idea=أحياناً الأصوات تترددد.\nمثل... تعرف حين تنقر كوباً ويستمر في الرنين؟\nالخشب يفعل ذلك أيضاً.\nأخبر Chris بشرب الماء. وربما قيلولة.\nالقيلولة تحل معظم الأشياء.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked=الجرس؟ أحب الجرس!\nلكن في الليل؟ لا.\nلو رنّ، كنت سأكون في الخارج فوراً مثل: "من يحتفل؟"\nالليل عبارة عن صراصير و Levi ينخر.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.weird=إذن لم تسمعي شيئاً غريباً؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.chris=Chris يستمر في الاستيقاظ على صوته.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.nothing=لا شيء له صلة بالجرس. أحياناً أسمع *طق طق* صغير مثل صوت بلوطات تنقر على السقف.\nيمكن أن يبدو أحد من المعتاد.\nربما Chris عنده مشكلة بلوطات.\nأو مشكلة سقف.\nأو مشكلة سقف بلوطات!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.concern=آه، المسكين Chris.\nإنه من النوع الذي يسمع صوتاً غريباً واحداً ويحاول فوراً أن يحمله للجميع.\nأخبره أن القرية هادئة. وأنني سأصحبه للبيت إذا خاف.\nفي الواقع لا. هو من سيصحبني للبيت. أنا أتشتت.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked=الجرس صادق.\nيرنّ حين تسحبه الأيدي، وحين تهزّه الريح.\nلكن الغابة يمكن أن تصنع موسيقاها الخاصة.\nالجذور تتحرك. الأغصان تستقر. الخشب القديم يتنهّد.\nإذا سمع Chris رنيناً لم يسمعه أحد آخر... ربما لأنه يصغي بشكل أشد.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.no=إذن أنتِ أيضاً لم تسمعي؟
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.what_sound=هل لديكِ فكرة عما يمكن أن يشبه الجرس؟
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.no=لا. ليس الجرس.\nلكنني أسمع القرية تستقر في الليل.\nمثل بيت يتنفس. مثل الأرض تُخرج زفير.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.what_sound=البلوطات يمكنها فعل ذلك.\nقشرتان تنقران بالإيقاع المناسب. واحدة تتدحرج في مجرى.\nالأصوات الصغيرة تصبح حادة حين تكون خائفاً.\nأخبر Chris أن الخوف يصنع آذاناً ممتازة واستنتاجات فظيعة.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked=في الليل؟ لا جرس.\nوأنا واثق من ذلك تقريباً.\nحين يرنّ الجرس، الحيوانات تتفاعل. الكلاب تشرئب. الطيور تفزع. حتى القطط تتوقف عن مخططاتها الصغيرة.\nإذا رنّ الجرس ولم يلاحظ أحد، كنا سنملك قرية مليئة بأكثر الحيوانات هدوءاً في العالم.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.imagining=إذن تعتقد أن Chris يتخيّل؟
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.notice=ما الذي لاحظته في الليل؟
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.imagining=أظن أن Chris متعب.\nوالأدمغة المتعبة تُنسّج الهراء في أنماط.\nلا يعني أنه يخترع الأمر عمداً.\nفقط يعني أنه يحتاج نوماً أكثر من إجابات.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.notice=بوم. ريح. النوع من الهدوء الذي يجعلك تسمع خطواتك الخاصة.\nأحياناً تلتقط أزيزاً إذا وقفت بالقرب من الخشب القديم فترة كافية.\nليس جرساً. أشبه بـ... ذكرى جرس.
skyblock_hub_dialogues.overworld.oak_forest.liora.hello=تحياتي أيها المتجوّل. بلوطات عتيقة تهمس بقدومك، وأصواتها تُريحني في هذه الغابة الفسيحة. ما الذي يجلبك للاستماع معنا؟
skyblock_hub_dialogues.overworld.oak_forest.lee.hello=مرحباً، لاحظتك تتلوّى عبر الأشجار الصغيرة. السناجب كانت تتشاور حول ذلك. هل كل شيء بخير في الغابة؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro=إذا كان لديك لحظة، هل يمكنك مساعدتي في إعادة تخزين المخزون؟ البنّاؤون يعملون طول اليوم، وقدر فارغ لا يفيد أحداً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.ill_bring=سأحضر لك بعض الحساء.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.why=لماذا حساء الشمندر؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.accepted=شكراً. أحتاج ستة عشر وعاء لإبقاء الطابور متحركاً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup=سهل الطهي بكميات كبيرة، سهل الحمل، ويدفئك من الداخل. البساطة جيدة حين تُطعم مستوطنة كاملة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup.response.ill_bring=سأحضر لك بعض الحساء.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro=أي نتيجة؟ أحتاج ستة عشر وعاء لإبقاء الطابور متحركاً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro.response.yes=تفضّل.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks=ممتاز. هذا سيُبقي الجميع نشيطين. شكراً. مرّ مجدداً إذا أردت وعاء دافئاً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks.response=يسعدني المساعدة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.hello=مرحباً. هل تريد وعاء دافئاً؟

# Hungry Hands (Potato Towers)
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available=توقف. Potato Towers ليست سوقاً. إنها جدار خلفه مؤونة. ومؤخراً، المؤونة نمت لها أرجل.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.zombies=الزومبي مجدداً؟
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.accept=إذا كان أحدهم يسرق، سأجده.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.decline=ليست مشكلتي.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.zombies_clarification=لو كانوا زومبي، كنت سأكون سعيداً. الزومبي لا يجادل. لا يبكي. لا ينظر إليك في عينيك ويسأل لماذا عندك بطاطس وهو لا.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation=أنا كُلِّفت بحماية هذا المكان من الموتى. كان هذا الاتفاق. لكن الأحياء يستمرون في اختبار البوابات. أيدٍ جائعة، وأقدام سريعة، وعشرات الأعذار. أحتاج منك إيجاد من يفعل ذلك وإحضار شيء ملموس. أسماء. نمط. شخص يستمعون له.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.start=من أين أبدأ؟
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.handle=سأتولى الأمر.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.starting_point=الزقاق خلف المحلات. ثلاثة وجوه تظهر باستمرار بالقرب من العربات: Tess وJoss وPerrin. تكلّم معهم. ستعرف من يدير الخيط.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check=إذا كنت ستوقف سرقة، افعلها بحقائق. تكلّم مع Tess وJoss وPerrin. ثم عُد.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.on_it=أنا على الأمر.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.remind=ذكّرني بمن أبحث عنه.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.reminder=Tess وJoss وPerrin. ثلاثة أسماء. قصة واحدة. أحضر لي حقيقتها.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution=للتو تكلّمت مع Ceryn. ليس مجرماً. ليس قديساً. مجرد شخص يثق به الناس.\nالسرقة خطأ. لن أتظاهر بخلاف ذلك.\nلكنني لم أفهم كيف اشتدّت الأوضاع هناك. ظل Pumpkingdom يمتد أبعد من بواباتنا.\nلذا إليك ما سيحدث. البوابات تبقى مغلقة. لكنني سأكون أبطأ في ملاحظة كيس ليس لي. وسأبدأ بالضغط من أجل حصص مناسبة لا تتطلب تسلّلاً.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.fair=هذا... معقول.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.open=لماذا لا تفتح البوابات؟
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.sooner=كان يمكنك فعل هذا مبكراً.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.why_not_open=البوابات المفتوحة لا تدعو للجوع فقط. تدعو للذعر. والزومبي. أستطيع الصمود أمام صف، لكن لا أستطيع الصمود أمام تدافع.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.admission=نعم. وكان يجب أن أطرح أسئلة قبل أن أبدأ بعدّ البطاطس المفقودة كأنها سهام في جعبة. أنا أتعلم.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.after_completion=إذا رأيت أحداً يحدّق في عربة لفترة طويلة، لا تفترض أنه لص. أحياناً هو فقط يحسب إذا كان الطعام يستحق الخزي.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first=إذا أرسلك Garran، يمكنك التوقف عن التحديق. أعلم كيف يبدو هذا.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.stealing=هل تسرق من Potato Towers؟
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.hurt=أنا لست هنا لإيذائك.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.started=أخبريني من بدأ.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.direct_question=أسرق الوقت. أسرق الدفء. أسرق لحظة حين لا تصرخ معدتي. البطاطس هي فقط الشكل الذي تأخذه.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hint=إذا أردت الشخص الذي يستمع له الناس، اعثر على Ceryn. ليس زعيماً. بوصلة. تعسكر بعيداً عن الطريق حيث تتوقف ظلال الأبراج.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first=هل ستجرّني إلى البوابة؟ حسناً. افعل. على الأقل داخل الجدران هناك أضواء.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.why=لماذا تسرق من هنا؟
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.behind=من وراء ذلك؟
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.truth=يمكنني المساعدة إذا أخبرتني بالحقيقة.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.contrast=لأن الهواء هنا يشمّ رائحة الطعام المطبوخ. عند Pumpkingdom يشمّ رائحة حجارة مبللة وأشياء ميتة. الناس لا يسرقون لأنه ممتع. يسرقون لأنه قريب.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hint=Ceryn. هذا من تريد. لا نتخذ خطوة دون سؤال ما كان سيفعله Ceryn. أساساً لأن Ceryn يفكر قبل أن يتحرك.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first=إذا جئت للبطاطس، فاتك الأوان. ما بقي من طعام ذهب.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.following=أبحث عمن تتبعه.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.stop=توقف عن السرقة.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stop_response=وبعدها ماذا؟ أتوقف عن الجوع لأنك قلت جملة؟ نفعل ما نحتاجه للبقاء. تكلّم مع Ceryn إذا أردت معرفة أكثر.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hint=اعثر على Ceryn في المعسكر. Ceryn يكره السرقة أيضاً. يقول إنها تجعلنا أصغر. لكن Ceryn أيضاً يرفض السماح للناس بالتضور.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first=Garran يظن أنني زعيم. لست كذلك. أنا فقط الشخص الذي ينظر إليه الناس حين يكونون على وشك فعل شيء لا يمكن التراجع عنه.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.reason=يقولون إنك سبب سرقتهم.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.starving=Potato Towers عنده ما يكفي. أنتم تتضورون جوعاً.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.escort=تعال معي. تكلّم مع Garran.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.framing=إنهم يسرقون لأنهم جائعون. Potato Towers عنده جبل من البطاطس وخندق من القواعد. هذا ليس عدلاً. لكن السرقة ما زالت سرقة.\nتمشّ معي. سأقول هذا في وجهه. إذا أراد Garran اعتبارها جريمة، بخير. لكنني أريده أن يفهم ما الذي يحميه.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.escort_start=دعنا نتكلم مع Garran. تعال معي. أريد محادثة، لا شغباً.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hello=إذا جئت لاتهامي، وفّر نفسك. أفعل ما يجب للبقاء.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hello=هل ضعت؟ لا أستطيع تقديم الكثير من الحصص للأسف.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hello=كن حذراً هنا. الناس ليسوا ودودين حين يجوعون.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello_before_quest=مرحباً. هل أنت أيضاً جائع؟\nنحن نتعاون لنرى ما من حصص يمكن الحصول عليها من Potato Towers. هذا ما يجب فعله للبقاء.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello=أنا والحرس على علاقة أفضل الآن. نتدبّر الأمر، بفضل مساعدتك.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available=نستضيف وجبة مشتركة لسكان Pumpkingdom. بعد الانهيار، طاولة دافئة تعني أكثر من احتفال.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.whats_wrong=لماذا تبدو متوتراً من أمرها؟
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.need_help=ماذا تحتاج مني؟
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.later=سأعود لاحقاً.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation=Pumpkingdom لم تعد كما كانت منذ الانهيار. بعض الناس فقدوا بيوتاً. وآخرون فقدوا مطابخ. يمكنك إعادة بناء الحجارة، لكن الجوع يجعل الناس يختفون بهدوء.\nRhea وأنا نبقي الليلة بسيطة: شيء مُشبع، لا هدر، وما يكفي جانباً حتى لا تشعر Plains بالأثر غداً.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.what_do_you_need=حسناً. ماذا تحتاج مني؟
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.wasting_food=لماذا تساعد Pumpkingdom؟
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup=لأنهم لا يزالون جيراننا. ولأن الجزء الأصعب بعد الانهيار ليس الأنقاض، بل الأسابيع التي تتوقف فيها عن توقّع أن تُطعم.\nيمكننا إعطاءهم ليلة جيدة واحدة دون تحويل مؤونة Plains إلى وعد لا يمكننا الوفاء به.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup.response.tell_me=معقول. ما هي الخطة؟
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.what_i_need=تكلّم مع Rhea أولاً. هي تقرر ما يذهب للناس وما نحتفظ به للحصص. ستجدها في الطابق العلوي.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions=تكلّم مع Rhea قبل جمع أي شيء. هي تنسّق وجبة الليلة.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.on_it=أنا على الأمر.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.remind=ذكّرني.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions_reminder=اعثر على Rhea في الطابق العلوي. احصل على القائمة. اتبعها بدقة.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder=هل حالفك الحظ في جمع الإمدادات لوجبة Pumpkingdom؟
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.deposit_potatoes=عندي بطاطس للتخزين للاحقاً.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.working=ما زلت أعمل على ذلك.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.potatoes_delivered=جيد. سأأخذ هذه البطاطس للتخزين.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report=هذه هي القطعة الأخيرة التي نحتاجها. Pumpkingdom ستأكل، وPlains ستبقى مخزّنة لفترة. شكراً.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.good=يسعدني أنني استطعت المساعدة.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.close=لم أدرك كم هي الأمور قريبة.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.close_followup=معظم الناس لا يدركون. لهذا أعمل بشكل وثيق مع Rhea للحفاظ على المخزون للمواسم القاسية.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.after_completion=إذا رأيت شخصاً من Pumpkingdom يبدو ضائعاً، دلّه على الطاولة. دعه يأخذ طبقاً ممتلئاً.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.before_quest_started=إذا كنت هنا لوجبة Pumpkingdom، لا تحوم. إما أحضر شيئاً للطاولة أو ابتعد. إذا كنت هنا للعمل، تكلّم مع Nolan.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro=Nolan أرسلك. جيد.\nالليلة نطعم سكان Pumpkingdom. منذ الانهيار، بعضهم كان يعيش على ما يمكن المتاجرة به أو إيجاده أو تمديده. نعطيهم وجبة جيدة واحدة دون المساس بحصص Plains.\nأحضر البطاطس إلى Nolan للتخزين للاحقاً. أحضر 64 قرعة لي لوجبة الليلة.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.why_pumpkins=لماذا القرع للوجبة؟
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.who_wasting=هل هم يعانون فعلاً بهذه الشدة؟
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.got_it=فهمت. سأعود.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.why_pumpkins_followup=نحن في موسم القرع الآن، والإنتاج جيد. لا يُخزّن طويلاً وهو موسمي للغاية.\nالبطاطس تُخزّن لفترة أطول، لذا من الأفضل الاحتفاظ بها للوجبات القادمة.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.who_wasting_followup=نعم. الانهيار يفعل ذلك. حين تنهار مدينة، الأفران تبرد أولاً.\nلن يقولوا ذلك بصراحة، لكن يمكنك رؤيته: ناس يأكلون بسرعة، يحفظون الكسر، يتظاهرون بأنهم ليسوا جائعين. نعطيهم ليلة يمكنهم فيها التوقف عن عدّ اللقمات.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder=هل لديك إمدادات القرع لوجبة الليلة؟
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.deposit_pumpkins=عندي قرع للوجبة.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.on_it=أنا على الأمر.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.pumpkins_delivered=ممتاز. هذا سيصنع وجبة مثالية الليلة.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.after_completion=إذا سمعت ضحكاً الليلة، فأنت من ساعد في تحقيقه.\nمخزوننا ممتلئ والناس سيُطعمون.\nكن فخوراً بنفسك.

# Non-Quest NPCs
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello=أنا نجار. أبني كراسي لا تنهار خلال الزلازل. في معظم الأحيان.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_1=في معظم الأحيان؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_2=هل لديك نكتة نجارين؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_1=إذا اهتزت الأرض، يجب أن يواكب الأثاث الإيقاع. "في معظم الأحيان" يعني أنني خسرت معركة واحدة بالضبط أمام الجاذبية.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_2=حاولت صنع حزام من لحاء البلوط. كان مضيعة للوقت.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello=هل تشعر بذلك؟ الأشجار تطنّ. إما أن زلزالاً قادم، أو أن الغابة تتنمّر مجدداً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_1=الغابة تتنمّر؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_2=كيف تبقى هادئاً؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_3=سأتركك لشأنك.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_1=الريح بين أشجار الغابة تهمس. أنا مقتنع أنها تكلّمني، لكن ربما هو أعصابي. أقسم أنها قالت أمس "خسرت اللعبة"...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_2=أسمّي كل طقطقة وشقشقة. من الأصعب الخوف من شيء اسمه Gerald.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello=هل أنا الوحيد، أم أن البلوطات هنا تبدو وكأنها تمتلك قوى سحرية؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello.response_1=سحر؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.detail_1=نعم. ألم ترها؟ بعضها يُفرز تلك المادة البنفسجية.\nليس لديّ أي فكرة ما هي تلك المادة. إذا سألتني، ليست علامة جيدة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello=أنا لست خائفاً من العناكب. أنا فقط أحترم آراءها ذات الثمانية أرجل.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_1=ما هي آراؤها؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_2=إذن أنت خائف.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_3=أي نصيحة للمنجم؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_1=العناكب تفعل ما تريد. إنها لا تخافك. يمكنك إيجاد حلول للعناكب على الشبكة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2=أنا لست خائفاً. أنا استراتيجي. أفضّل البقاء حياً دون مواجهة تلك المخلوقات الفظيعة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2.response_1=لا تقلق. أنا خائف أيضاً.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello=إذا سمعت الجرس يرنّ، إما أن الخطر قريب أو أنا ملول. خمسون بالمئة في كل حالة.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_1=من فضلك توقف عن قرعه.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_2=ماذا يعني حين يرنّ مرتين؟
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_3=استمر في القرع. أحب الفوضى.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_1=حاولت. الجرس نادى اسمي. بصوت عالٍ. أيضاً الصمت هنا يبدو كأنه ينتظر.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_2=يعني أنني نسيت أنني قرعته مرة بالفعل. أنا ثابتة، لكن لست دقيقة.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello=إذا وقفت بلا حراك لفترة كافية، البرد سيحاول تبنّيك. لا تدعه.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_1=كيف أوقف ذلك؟
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_2=البرد يتبنّى الناس؟
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_3=أنا أحب البرد.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_1=ابقَ متحركاً. ارتدِ شيئاً دافئاً. لا ترتدِ ملابس غير كافية أبداً. هذه البيئات لا ترحم.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_2=نعم. هناك الكثير من الأحوال القاسية هناك. البرد يأخذ من يريد. يمكننا فقط ارتداء الدفء لإبطاء تأثيره.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello=يصبح الجو بارداً جداً هنا، ولا يمكنك الخروج كثيراً. أحسب ندف الثلج لقطع الوقت.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_1=كم حصيلتك حتى الآن؟
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_2=هذا يبدو مُرهقاً.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_1=في آخر مرة وصلت إلى 314 ندفة. كنت سأواصل لكن Snowberry Pie الخاص بي انتهى طهيه، فكان عليّ الذهاب للأكل.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_2=كذلك الشتاء. نحن نتبادل الطاقات.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello=أحيك. أوشحة وقفازات ودعم معنوي. إذا كانت لديك مشكلة، ربما يمكنني تحويلها إلى قبعة.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_1=تحويل ماذا إلى قبعة؟
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_2=هل يمكنني الحصول على وشاح؟
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_1=أي شيء. يعتمد على كيفية نظرتك إليه.\nخذ تلك المشكلة، حوّلها إلى إيجابية، والبسها بفخر. الآن أصبحت قبعة.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_2=فقط إذا وعدت بارتدائه بدرامية. أرخِ طرفه كبطل في عاصفة ثلجية.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello=صنعت قائمة بالأشياء التي ليست ذئاباً. تساعدني في الليل.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_1=ما الذي في القائمة؟
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_2=ماذا عن الذئاب الحقيقية؟
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_3=لماذا تصنع قائمة؟
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_1=أشجار. ظلال. ريح. بعض الناس. على الأرجح. القائمة قيد الإنجاز.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_2=لم تصل للقائمة. مريب. مريب جداً.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_3=الذئاب مرعبة! من لن يخاف منها؟ أحاول إنشاء قائمة بالأشياء غير المخيفة! يساعدني على البقاء هادئاً في الليل.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello=إذا كنت بارداً، اشرب شيئاً دافئاً. إذا كنت حزيناً، اشرب شيئاً دافئاً. إذا كان شيء ما يلاحقك، اشرب شيئاً دافئاً بشكل أسرع.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_1=ماذا تحضّرين؟
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_2=هل يساعد فعلاً؟
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_1=شاي إبر التنوب. طعمه كالشجاعة والإبر. أساساً الإبر.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_2=يساعد إذا آمنت بأنه يساعد. لا تستهن بتأثير الإيهام.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello=أدرّب ضحكتي لتبدو شريرة. استمع. هاه. هاه. هاه.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_1=كان ذلك مرعباً.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_2=لماذا تتدرب؟
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_3=سأتركك تستمر في التدريب.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_1=شكراً. أنا أتحسن. أريد أن يخاف الناس مني.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_2=لأنني أريد السيطرة على العالم، ولا يمكنك فعل ذلك بدون ضحكة شريرة. واضح.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available=أوه. يا إلهي. يبدو عليك بالضبط أنك شخص يستطيع التعامل مع كيكة.\nصنعت وصفة كيكة جديدة باستخدام Snowberries، وأحتاج رأياً ثانياً.\nإذا أعطيتك الوصفة، هل تمانع تجربتها؟
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_1=الكيك تخصصي.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_2=هيا.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder=كيف تسير تجربة الكيك؟ أحتاج أن أعلم...\nأحلامي وطموحاتي في أن أصبح خبّازة مستقبلاً على المحك.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_1=لم آكل منه بعد.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_2=أنا أستمتع بالكيك حتى الآن. فقط أنا ممتلئ.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_3=لا أعتقد أنني أستطيع تحمّل المزيد.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete=إذن؟ إذن؟\nأخبرني بكل شيء. القوام، ونكهة الثمرة، هل كانت Snowberry Cake أفضل من كيكة عادية؟
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_1=كانت فرحة محضة.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_2=أريد قطعة أخرى.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_3=لا أعتقد أن الخبز مناسب لك.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.after_quest=مرحباً يا من تذوّق الكيك.\nإذا رأيت Snowberries، أنت تعرف ما يجب فعله.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.hello=مرحباً، أنا خبّازة طموحة. أحاول صنع كيكة جديدة. ما زلت أفكر في المكوّن السري الخاص بي.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello=لا تثق بالببغاوات. يكررون كل شيء. بما فيه الأسرار. خاصة الأسرار.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_1=ماذا قالوا؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_2=علّمني لغة الببغاء.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_3=أي نصيحة للغابة؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_1=أن أحداً أسقط سمكة. كانوا محقين. فعلت ذلك. الببغاوات لن يسامحوني أبداً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_2=هي أساساً شتائم وطلبات وجبات خفيفة. أحياناً تحذير، إذا دفعت بالبذور.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello=أنا أخترع مطبخاً جديداً: المقرمش. الغابة توفر مرشحين كثيرين.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_1=من فضلك لا تفعل.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_2=ما الذي في القائمة؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_3=أعطني شيئاً عادياً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_1=جبان. لكن معقول. لن أقدّم لك خنفساء اليوم. ربما غداً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_2=خنفساء مشوية. عنكبوت متبّل. سلطة كروم. السلطة تعضّ بالمقابل. هذا هو سحرها.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello=الكروم هي حبال لها طموح. أعلّق فنّي حيث يمكن للجاذبية انتقاده.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_1=أي فن؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_2=هل يسقط؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_3=هل يمكنني المساعدة؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_1=أجراس ريح مصنوعة من البذور. تبدو كعواصف صغيرة تتجادل بأدب. إذا أردت المساعدة، قف تحتها وتظاهر بأنك قصدت أن تكون هناك حين تسقط.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_2=كثيراً. هذا جزء من العرض. إذا لم تسقط، لم تكن شجاعة بما يكفي.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello=الجميع يقول أن القمة جميلة. الجميع ينسى أنها بعيدة جداً عن الأرض.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_1=إذن ابقَ في الأسفل.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_2=ما الذي يخيفك أكثر؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_3=هل تريد تشجيعاً؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_1=حاولت. الغابة بنت سلالم. الغابة تستهزئ بي.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_2=السقوط. وأيضاً عدم السقوط، لأن ذلك يعني الاضطرار للنزول.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello=أرسم خريطة الغابة بالاستماع. الطيور ترسم الحدود. الحشرات تملأ التفاصيل.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_1=هذا يبدو مزيّفاً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_2=هل يمكنني رؤية خريطتك؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_3=إلى أين يجب أن أذهب؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_1=كذلك الغابة. ومع ذلك نحن هنا. استمع بما يكفي والمسارات تُعرّف نفسها.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_2=هي أساساً سهام وتحذيرات. أيضاً رسمة لببغاء وقح جداً.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello=أخبرت كرمة أنها متعلّقة. أخذت ذلك بشكل شخصي.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_1=نكتة أخرى.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_2=أي نصيحة حقيقية؟
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_3=أنت لا يُطاق.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_1=ضعت وطلبت الاتجاهات. قالت الغابة "اتركني وشأني".
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_2=لا تضرب شجرة بها نمل. ستندم على امتلاكك يدين.
skyblock_hub_dialogues.npc_name.balth=Balth
skyblock_hub_dialogues.npc_name.brakka=Brakka
skyblock_hub_dialogues.npc_name.kora=Kora
