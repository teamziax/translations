skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.hello=Parle moins fort. Le son porte, là-dedans.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.locked=Pas maintenant. Le village gère encore les mouvements du sol. Reviens quand ça s'est calmé.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available=Tu vas dans la Cobblestone Mine ? Bien. Je déteste les araignées là-dedans. La poussière de pierre, j'y arrive. Mais huit pattes qui frôlent mes bottes, c'est non.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.whats_changed=Qu'est-ce qui a changé ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.what_you_need=Qu'est-ce que tu veux de moi ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.whats_changed=Elles sont plus hardies. Elles ne restent plus dans le fond sombre comme avant. Et certaines toiles ont une légère teinte. Sûrement rien. Sûrement.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need=Nettoie la Cobblestone Mine cinq fois. Pas une. Cinq. Je dois savoir si les araignées se multiplient, migrent, ou sont repoussées.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.on_it=D'accord. Je le fais.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.five_times=Cinq fois, c'est beaucoup.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.why_five=Si tu nettoies une fois, elles se cachent. Si tu nettoies deux fois, elles bougent. Après quelques passages, des schémas apparaissent. Densité des toiles. Points d'apparition. Le genre de choses qu'on remarque seulement quand on est fatigué et qu'on fait quand même attention.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress=Je compte encore. Cinq sans faute. Essaie de ne pas ressortir emballé dans une toile.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress.response.working=J'y travaille.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete=Tu l'as vraiment fait. Cinq nettoyages, et t'es encore entier. L'entrée a déjà l'air mieux. Moins de toiles en suspension. Moins de frôlements sur la pierre.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete_reward=Prends ça. Si la mine refait des siennes, tu pourras au moins extraire ta propre pierre sans y vivre.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.glad=Tant mieux si ça a aidé.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.tint=À propos de cette teinte dont tu parlais...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.tint_followup=Je dis pas que c'est la cause. Je dis que j'ai vu des choses plus étranges dans les fissures après un tremblement. Garde les yeux ouverts là-dedans. Si tu vois quelque chose de bizarre, ne le touche pas à mains nues.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.after_completion=Si les toiles recommencent à s'étendre, je le saurai avant toi. Je sens l'humidité quand elles nichent.
skyblock_hub_dialogues.npc_name.ore_merchant=Ore Merchant
skyblock_hub_dialogues.npc_name.garden_merchant=Garden Merchant
skyblock_hub_dialogues.npc_name.spawner_merchant=Spawner Merchant
skyblock_hub_dialogues.npc_name.misc_merchant=Misc Merchant
skyblock_hub_dialogues.npc_name.block_merchant=Block Merchant
skyblock_hub_dialogues.npc_name.furniture_merchant=Furniture Merchant
