skyblock_hub_dialogues.npc_name.enchanter=Enchanter
skyblock_hub_dialogues.npc_name.repairer=Repairer
skyblock_hub_dialogues.wurg.cannot_cross=GGGRRR ! Je suis un Wurg grognon ! Nous, les Wurgs, avons juré de protéger les ponts et d'empêcher quiconque n'est pas digne de les franchir ! Reviens quand tu en auras découvert davantage !
skyblock_hub_dialogues.wurg.back_to_work_response=C'est l'heure de se remettre au boulot !


skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat=Hé, t'es toujours debout ! C'est bon signe. T'as rencontré les villageois ? Ils adorent papoter !\nTu te sens un peu perdu ? Pas de souci ! Tes quêtes sont en sécurité dans ton <cc:header>Menu Skyblock</cc:header> ou tape "/skyblock quests" !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_1=Merci pour l'info !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_2=Ouais, les villageois sont trop sympa !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.introduce=Hé toi, salut ! Bienvenue au village d'Oakridge \nOh, où sont passées mes bonnes manières... J'ai oublié de me présenter !\nJe m'appelle Cubit, je suis le guide du village ici à Oakridge !\nSuis-moi, je vais te montrer le cœur du village et te présenter aux villageois !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_enchanter=Voici l'enchanteur !\nD'une manière magique, il peut enchanter tes objets pour les rendre plus puissants !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_portal=Et on revient au portail...\nTu peux toujours utiliser le portail pour rentrer chez toi, ou sinon ce menu bien pratique dans ton inventaire.\nC'est la fin de la visite pour l'instant, mais ne t'inquiète pas, il y a encore plein de choses à explorer à Oakridge !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_repairer=Voici le réparateur !\nIl peut réparer n'importe quoi ! Même si ça a été mâchouillé par quelque chose...\nUn lapin ou un truc comme ça...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_shops=Ah, ma partie préférée... Les boutiques !\nElles ont tout ce dont tu as besoin, et tout ce dont tu ne savais pas avoir besoin !
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce=Hé ! C'est encore toi !\nJe vais te conduire à la Forge ! C'est le seul endroit dans le monde de Skyblock capable d'effectuer de puissantes améliorations d'outils et d'armures.\nÇa peut être un peu compliqué à trouver, alors en route !
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_1=Allons-y !
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_2=J'ai hâte !
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge=Bienvenue à la Forge ! Ce bâtiment imposant est une vraie centrale d'énergie !\nOn dit qu'il a été construit par des gens qui semblaient possédés, et que cet endroit a des pouvoirs magiques.\nLes Runes trouvées à travers le monde peuvent y être affinées pour révéler leurs véritables pouvoirs.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_1=Waoh, ça fait peur !
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_2=J'ai hâte de fabriquer quelque chose de puissant !
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello=Comment ça se passe à la Forge ? T'as fait quelque chose de cool ?\nLes Donjons sont un excellent point de départ pour trouver des Runes si t'en as besoin.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_1=Ouais, ça se passe bien !
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_2=J'ai pas encore fait quelque chose de bien !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.introduce=Hé ! Cassandra, c'est moi ! Je suis fermière ! Certains diraient la meilleure fermière du coin !\nCertains diraient que je <italic>beet</italic> toute la concurrence !\n\nEn tant que productrice de betteraves, j'ai toujours des tonnes de graines de betterave ! Reviens me voir si tu veux une super affaire !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.response=Ravie de te rencontrer !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.chat=Hé, comment ça va partenaire !\nJe peux t'intéresser à de super graines de betterave à prix réduit ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.introduce=Mmh... C'est Levi.\nT'es pas d'ici, hein ?\nTout le monde me connaît. Je suis celui qui dort toujours au boulot. Je bosse sur l'amélioration de mes compétences pour pouvoir aider davantage, mais j'y suis pas encore tout à fait.\nSi tu persévères, tu deviendras aussi célèbre que moi.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_1=J'espère que tu ne dors pas tout le temps
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_2=T'as l'air d'être un cas
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.hello=Hé, comment tu vas ?\nJe suis occupé à me reposer. Ça te dérangerait de revenir un autre moment ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.introduce=C'EST PAS VRAI ! Des nouvelles têtes !\nT'es nouveau, c'est ça ? J'ai trop hâte de te rencontrer. Raconte-moi tout.\nComment tu vas ? J'ai du gâteau. Tu veux du gâteau ?\nOh là là. Il faut que tu m'arrêtes. Sinon je vais pas m'arrêter de parler.\nT'as rencontré tout le monde ? T'as vu les boutiques ? Et les mines ?\nOOOOOO Il y a plein de trucs violets dingues qui poussent du sol, t'en as entendu parler ?\nAttends... Je m'arrête
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_1=Woah, calme-toi !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_2=Je crois qu'on va bien s'entendre
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_3=Tu es vraiment trop chaotique
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello=Woah, t'es revenu me parler ! Je suis honorée.\nÇa va ? J'ai fait encore du gâteau. J'adore le gâteau.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello.response_1=J'adore le gâteau aussi
skyblock_hub_dialogues.response.show_me_around=Oui, montre-moi !
skyblock_hub_dialogues.response.show_me_more=Ouais, montre-moi encore !
skyblock_hub_dialogues.response.show_me_what_youve_got=Ouais, montre ce que t'as !
skyblock_hub_dialogues.response.thanks_for_help=Merci !
skyblock_hub_dialogues.response.yeah_sure=Ouais, bien sûr !
skyblock_hub_dialogues.response.lets_go=Je suis prêt !
skyblock_hub_dialogues.response.ill_pass=Peut-être une autre fois...
skyblock_hub_dialogues.response.yeah_ill_help=Ouais, je vais aider !
skyblock_hub_dialogues.response.not_right_now=Non, pas maintenant
skyblock_hub_dialogues.response.okay=OK
skyblock_hub_dialogues.response.yes=Oui
skyblock_hub_dialogues.response.tell_me_more=Dis-m'en plus.
skyblock_hub_dialogues.response.i_should_go=Je dois y aller.
skyblock_hub_dialogues.response.fair_enough=C'est juste.
skyblock_hub_dialogues.response.yikes=Aïe.
skyblock_hub_dialogues.response.good_luck=Bonne chance.
skyblock_hub_dialogues.response.interesting=Intéressant.
skyblock_hub_dialogues.response.laugh=Haha !
skyblock_hub_dialogues.response.ill_leave_you_to_it=Je te laisse à ça.
skyblock_hub_dialogues.response.will_do=C'est noté !
skyblock_hub_dialogues.response.ellipsis=...
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.introduce=Oh là là, mon dieu ! Mes petites boules de poils adorées se sont encore échappées du loquet ! Elles sautillaient juste près du chalet, mais maintenant elles ont disparu dans les bois ! Tu pourrais m'aider à les rassembler ? Je te récompenserai généreusement, je te le promets, j'ai juste besoin de retrouver mes chéris !
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.response=C'est parti pour rassembler les lapins ! Inquiète-toi pas, Aurora !
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.hows_it_going=Comment ça se passe ? Des traces de mes petits artistes de l'évasion ? Ces lapins mijotent quelque chose, j'en suis sûre... j'espère juste un vol de collation et pas une rébellion en bonne et due forme !
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks=Oh, Dieu merci ! Merci infiniment de m'avoir aidée... J'aurais jamais pu les suivre sans toi ! Je vais dire à tout Oakridge à quel point tu es gentil et courageux !
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks.response=Ravi d'avoir sauvé la mise !
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.hello=Hé ! Je suis encore tellement reconnaissante de ton aide avec mes petits coquins !
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro=Eeek ! Reste loin ! Je veux dire bonjour ! Les lapins sont juste... trop nerveux pour moi. Ils sont terrifiants ! Tu peux apporter cette nourriture à Aurora ? J'ai emballé des carottes, des betteraves et du blé pour qu'elle puisse les garder... satisfaits.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_1=Bien sûr ! Je serai ton héros livreur.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_2=Comment tu peux avoir peur ? Ce sont juste des petits lapins tout doux !
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress=Hé ! T'as... t'as déjà nourri ces créatures terrifiantes ? Ils ont encore faim ?
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress.response=Pas encore, mais j'y vais.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete=T'es le meilleur ! Vraiment, les lapins c'est juste des petits monstres déguisés. Aurora dit que je devrais leur rendre visite un jour... peut-être que je le ferai, si t'es là pour me protéger !
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete.response=Quand tu veux ! Je serai ton garde du corps anti-lapins.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello=Hé, ça va ! Je suis le meilleur fournisseur de nourriture pour animaux des bois surtout parce que j'aime pas trop m'approcher des animaux !
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello.response_1=Content de l'entendre !
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro=Oh ! Ce sont sûrement les carottes que Bob a rassemblées. Il est tellement adorable, même s'il est un peu nerveux. Tu peux me les passer ?
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro.response.yes=Voilà !
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks=Parfait ! Merci beaucoup. Dis à Bob qu'il est toujours le bienvenu pour rendre visite — peut-être qu'en les voyant manger, il réalisera que ce sont juste de petits amis tout doux.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks.response=Je lui dirai.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro=Oh, Bob t'a envoyé avec des collations ? C'est trop gentil de sa part ! Je suis un peu occupée avec les autres lapins, tu pourrais juste nourrir ceux-là directement ? Dis à Bob qu'il est toujours le bienvenu !
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro.response=Je peux faire ça !
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.catch=<italic>*Hop Hop*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.response=Je t'ai eu ! Tout doux.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.intro=Ce lapin remue le nez — il a l'air affamé de carottes !
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.thanks=Le lapin grignote joyeusement les carottes.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.catch=<italic>*Couiic !*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.response=Viens avec moi, petit !
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.intro=Ce lapin semble vouloir de la betterave — il fixe le sac droit dessus !
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.thanks=Le lapin se régale de betterave.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.catch=<italic>*Miam Miam*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.response=Retour au enclos !
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.intro=Ce lapin attend patiemment du blé !
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.thanks=Le lapin grignote le blé avec contentement.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.hello=<italic>*Remue le nez*</italic>


skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.intro=Hé ! Toi, viens là !\nCette nuit... les murs ont tremblé violemment et d'un coup, toutes les maisons ici sont instables maintenant...\nEt bien sûr c'est mon problème à régler...\nMais maintenant je peux en faire ton problème aussi, j'imagine.\nVa me chercher des Rondins de Chêne et de la Cobblestone, on se reparlera quand t'auras fait ça.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going=C'est encore toi.\nT'as réuni les matériaux ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.yes=Oui ! J'ai des ressources pour toi.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.no=Non désolé, je vais me remettre au boulot :(
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks=Woah, t'as vraiment fait ça.\nJe suis... impressionné.\nMerci, j'imagine.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks.response.enjoy=J'espère que ces ressources ont aidé !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well=Pas de secousses depuis cette nuit. Autant que ça reste comme ça.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well.response.glad_to_hear=Tant mieux que ça se passe bien pour toi !


skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro=Hé, toi. Laisse-moi te présenter quelque chose de très puissant dans ce monde...\nLes Sanctuaires. Ouais, donne-leur beaucoup de l'objet dont le Sanctuaire est fait, et il te récompensera avec des trucs géniaux en retour.\nVa te balader pour trouver tous les Sanctuaires que cette terre a à offrir !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_1=Je m'en occupe tout de suite !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_2=Je les verrai en chemin, merci !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going=Tu les as tous trouvés ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_1=Je cherche encore !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_2=Je fais de mon mieux pour les trouver tous !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello=Hé ! Quoi de neuf !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello.response_1=Contente de te revoir !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello=Salut. Je suis Gus. J'ai l'impression d'avoir laissé mes lunettes quelque part par ici.\nJe suppose que je vais continuer à les chercher.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_1=Bonne chance. J'espère que tu les trouveras !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_2=Je parie que tu ne l'as pas vu venir...


# Cobblestone Mine - Dungeon Guard
skyblock_hub_dialogues.overworld.oak_forest.cobblestone_mine.dungeon_guard.introduce=Il n'y a pas si longtemps, c'était une mine paisible et productive...\nÇa, c'était avant l'arrivée des araignées.\nLa Garde d'Oakridge n'était pas prête pour une telle attaque.\nOn a été débordés et on a dû battre en retraite.\nMaintenant la mine est envahie d'araignées et d'autres créatures.\nTu pourrais nous aider à les éliminer ?

# Pumpkingdom - Ella
skyblock_hub_dialogues.overworld.plains.pumpkingdom.ella.flower_shop=Hé ! Je suis la propriétaire du Flower Shop ici à Pumpkingdom !\nJe peux t'intéresser à quelques fleurs ?

# Pumpkingdom - Dungeon Guard
skyblock_hub_dialogues.overworld.plains.pumpkingdom.dungeon_guard.introduce=Il y avait tellement de zombies. Ça me hante !\nJe sais pas comment on a survécu. Il n'y avait rien de plus que je pouvais faire.\nJe me demande si tu t'en serais mieux sorti ? Tu penses que t'aurais pu aider ? Est-ce que le résultat aurait été différent si t'avais été là ?

# Pumpkingdom - Blooming in the Rain
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce=Oh ! Bonjour ! T'as l'air d'avoir de super mains pour jardiner ! La terre est si agitée ces derniers temps, je pense qu'elle a besoin de couleurs vives pour se calmer. Tu veux m'aider à ramasser des fleurs ?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_1=Ooooh, des fleurs ! J'adorerais aider.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_2=Je suis trop occupé pour ramasser des fleurs là.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker=Attends, attends ! On peut pas juste les arracher, les racines sont sensibles ! Avant qu'on parte, passe dans cette boutique et achète un cueille-fleur.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker.response_1=Bien sûr, je vais en choisir un
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go=Super, t'en as un maintenant ! Regarde comme ça brille ! OK, concentre-toi, Sandy... concentre-toi... Allons cueillir des fleurs !!!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go.response_1=Ouais ! Les fleurs !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions=Regarde ces Pissenlits ! On dirait de petits morceaux de soleil. Récolte des pissenlits avec l'outil, puis apporte-moi les pissenlits !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_1=Voici des pissenlits !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_2=Oh, laisse-moi aller les chercher ! Je me suis un peu laissé distraire.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_dandelions=Concentre-toi ! N'oublie pas de récolter les Pissenlits avec les outils pour ne pas déranger la terre !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys=T'as entendu ça ? La terre a semblé un peu... craquante. Allons chercher des coquelicots. Leur rouge est si intense, c'est parfait pour les ruines.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_1=Ouais, allons explorer !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_2=Si on doit...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys=Vite, vite ! Récolte des coquelicots avec l'outil, puis apporte-moi des coquelicots ! Ils font tellement de bien à la terre.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_1=Voici des coquelicots !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_2=Oh, laisse-moi aller les chercher !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_poppys=Les Coquelicots ! N'oublie pas de récolter les Coquelicots avec les outils !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys=OK, une dernière chose... Je crois. Ooh ! Allons chercher des pivoines. C'est comme des couvertures moelleuses pour la terre !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_1=Ouais, allons explorer !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_2=D'accord...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys=Ne sont-elles pas magnifiques ? Récolte des pivoines avec l'outil, puis apporte-les-moi ! C'est la pièce finale de notre pansement floral !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_1=Voici des pivoines !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_2=Oh, laisse-moi aller les chercher !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_peonys=N'oublie pas ! Récolte bien les pivoines avec les outils !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home=Oh ! Mon panier déborde ! Et mes pieds commencent à picoter... Je crois que c'est assez. Rentrons.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_1=Ouais, rentrons !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_2=Mes jambes me font mal de toute cette marche :(
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up=C'était adorable ! La terre se sent déjà un peu plus calme, non ? Refaisons ça à un moment.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_1=Ouais, j'ai bien aimé aussi.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_2=C'était sympa, je crois. Je suis pas le plus grand fan de fleurs.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello=Hé, comment ça va ? J'espère que tu te sens fleuri et prêt à aider les pousses !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello.response_1=J'espère que toi aussi !

# Pumpkingdom - Non-Quest NPCs
skyblock_hub_dialogues.overworld.plains.pumpkingdom.cedric.hello=Si tu sens quelque chose brûler, ton visage est probablement trop près du feu. Ces pommes de terre sont crues.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello=Chuchote, s'il te plaît. Les épouvantails écoutent. Ou peut-être que je perds la tête.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello.response_1=Tu veux un porte-bonheur en forme de citrouille ?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.detail_1=Non. Absolument pas.\nSi je porte un porte-bonheur et qu'il ne marche pas, je devrai aussi commencer à croire aux porte-malheur.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello=Bienvenue, voyageur. Tu es à Pumpkingdom. On a des citrouilles mondialement célèbres ici.\nQuelque chose que je peux faire pour te divertir ?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_1=Chante-moi quelque chose.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_2=Pourquoi l'appeler Pumpkingdom ?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_3=Je suis juste de passage.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.verse_1=Oh, citrouille, citrouille, orange et brillante,\nEn attente d'une nuit effrayante.\nAvec un sourire drôle ou une tête de monstre,\nT'es la plus belle citrouille du registre.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.detail_1=Parce que dire "Village de la Citrouille" donnait l'impression qu'on demandait à se faire piller.\nAussi le premier maire l'a déclaré couteau de sculpture en main, et personne n'a contredit le couteau.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.maeve.hello=Bonjour ! Je suis Maeve. J'aime les livres et j'aime lire. On peut apprendre plein de choses dans un livre. Sauf à lire. Apprendre à lire en lisant un livre, ça n'a encore marché pour personne que j'ai testé.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.quinn.hello=Ne touche pas aux leviers.\nEn fait, touche-en un. Doucement.\nJ'ai aucune idée de ce qu'ils font, donc si ça explose... C'est pas moi !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello=Si tu viens pour les citrouilles, prends le chemin à gauche.\nSi tu viens pour les mauvaises blagues, félicitations. T'es déjà perdu.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_1=Dis-moi une mauvaise blague.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_2=Je te laisse à ça.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1=Comment répare-t-on une citrouille cassée ?\nAvec un patch de citrouille !
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1.response_1=C'était vraiment nul.

# Pumpkin Towers - Potato Zombies
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce=Psst ! T'as l'air de quelqu'un qui sait manier une pelle ou une épée.\nOn a un petit problème ici... Des zombies envahissent mes champs.\nIls piétinent les récoltes, mâchent les clôtures, et pire que tout, mangent mes pommes de terre !\nTu peux donner un coup de main et sauver la récolte ?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response1=Bien sûr ! Quelques zombies me font pas peur.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response2=Si tu y tiens vraiment...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane=Beau boulot, mon ami !\nSi t'as un peu de temps... Tu pourrais rendre visite à mon amie Susane ?\nElle semblait avoir du mal avec des araignées autour de ses citrouilles.\nÇa t'ennuierait d'aller la voir et de lui donner un coup de main aussi ?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response1=On va écraser quelques araignées !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response2=Je vais garder tes citrouilles en sécurité !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks=Wow, t'as vraiment montré à ces monstres qui est le patron !\nJe peux pas croire que t'en aies éliminé autant\nSi seulement ils partaient pour de bon... mais pour l'instant, t'as vraiment fait une différence !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks.response=Quand tu veux, aider c'est ma spécialité !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hows_it_going=Comment ça tient ?\nTu peux croire que ces créatures ont pris le contrôle comme ça ?\nOn a vraiment pas de chance...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hello=Tu veux connaître un petit secret ?\nMon vrai nom c'est pas vraiment Fred.\nLes gens ont commencé à m'appeler Potato Fred après la fois où je me suis retrouvé coincé dans un tas de pommes de terre.\nJe sais toujours pas comment j'en suis sorti...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.see_fred=Salut !\nCe ne sont pas que les citrouilles qui poussent vite, les nuisibles aussi !\nMon partenaire, Potato Fred, pourrait vraiment avoir besoin de ton aide.\nTu peux aller voir comment il va ?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred=AAAAGHH !\nDES ARAIGNÉES ! DES ARAIGNÉES PARTOUT !\nElles ruinent mes citrouilles !\nTu peux m'aider à m'en débarrasser ?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response1=AAAH, DES ARAIGNÉES !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response2=Bien sûr, les araignées me font pas peur !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders=T'as réglé le problème des araignées ?\nJ'ose pas retourner là-bas si elles sont encore là...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders.response=Il en reste encore...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.hello=Ah, j'adore voir mes citrouilles aller bien...\nCes stupides araignées essaient toujours de tout gâcher !\nJ'espère qu'elles vont rester loin cette fois...

# Plains - Pumpkin Towers - Susane & Kipp
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce=Toi là ! T'as l'air de quelqu'un qui a le sens de la justice ! Il y a un petit polisson qui court partout en volant mes citrouilles primées pour ses "projets". Tu dois le trouver pour que je puisse lui faire une mise au point sévère mais juste ! Tu peux m'aider à attraper le coupable ?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_1=Je vais le débusquer, ce petit chenapan !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_2=D'accord, je vais t'aider à tirer ça au clair.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going=T'as trouvé le gamin et ses légumes chapardés ? Mes citrouilles sont pour le festival, pas pour servir de cibles !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going.response=J'y travaille encore, Susane !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete=Le voilà ! Le petit diable ! ...Attends, regarde. C'est une citrouille sculptée ? Regarde le travail... il l'a pas abîmée, il l'a améliorée ! Wow, c'est vraiment incroyable. Merci de me l'avoir ramené avec son art.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete.response=Contente d'avoir pu clarifier le malentendu !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce=Susane t'a envoyé pour me ramener au champ ? Oh non... elle va être tellement en colère ! S'il te plaît, ne m'emmène pas vers elle tout de suite ! Je suis pas un voleur, je suis un artiste ! Regarde, si je lui apporte une offrande de paix... aide-moi à retrouver mon couteau à sculpter, et je vais faire quelque chose qui va lui faire changer d'avis.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_1=Je vais trouver ton couteau. Voyons ce que tu sais faire.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_2=D'accord, je vais chercher. Mais fais pas d'autres bêtises.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint=Je l'avais pour la dernière fois près des rangées de citrouilles principales pendant que je cherchais un bon canvas. Il doit être quelque part là !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint.response=J'y vais.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife=Tu l'as trouvé ! T'es une bouée de sauvetage. Je vais faire vite — je vais lui sculpter un chef-d'œuvre qui lui fera oublier les citrouilles disparues !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife.response=On y va. Croisons les doigts !
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.hello=Je fais profil bas aujourd'hui. L'art demande de la concentration, tu sais ?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.knife.dont_know=Ce couteau est une drôle de chose à traîner comme ça. Il y a "Kipp" gravé sur le manche. Je devrais probablement le lui rendre.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.hello=T'entends ça ? C'est le son d'une bonne cuisine. Les gens de Pumpkingdom vont adorer.\nMerci pour tout ton dur labeur !
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available=Si tu sens le dîner, c'est que je suis encore en train de gagner. Juste. Le bac à charbon est vide, et pas mal de fourneaux ont craqué. Aide-moi avant que toutes les Plains se retrouvent à mâcher des pommes de terre crues.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.help=Je peux aider.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.plan=C'est quoi le plan ?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.breaking=Pourquoi les fourneaux cassent ?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.why_furnaces_break=Les cycles de chaleur, des mains maladroites, et un peu de malchance. Une minute ils vont bien, la minute suivante ils sont fendus et crachent des cendres. Je peux gérer un fourneau cassé. Je peux pas gérer une cuisine en ruine.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted=Parfait. J'ai besoin de trois choses, et vite. Du charbon pour maintenir la chaleur, des fourneaux pour remplacer les cassés, et des pommes de terre pour que je puisse sortir quelque chose de comestible.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted.response.all=Je t'apporte tout.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items=À chaque fois que je regarde ailleurs, quelqu'un "vérifie" un fourneau et laisse la porte grande ouverte. Apporte-moi du charbon, des fourneaux et des pommes de terre, et je transformerai la panique en dîner.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.deposit=J'ai apporté des fournitures.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.working=J'y travaille.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.deposit_thanks=Bien. Dans les bacs et sur les braises. Continue d'en apporter.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage=C'est tout. Les feux sont relancés, la file avance, et les Plains vont manger de la nourriture cuite pour un bon moment.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.glad=Content d'avoir pu aider.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.save=Un jour on devrait cuisiner ensemble !

# Plains - Ruins - Lewis
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available=Les ruines ne sont pas du décor. Ce sont des routes.\nEssaie de pratiquer tes compétences dans les ruines. Tu pourrais vraiment augmenter considérablement ta mobilité.\nEssaie d'atteindre Robb que j'ai vu jouer dans les ruines tout à l'heure.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.accept=D'accord. Je vais atteindre la plateforme.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.tips=Des conseils avant de commencer ?
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.later=Pas maintenant.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips=Repère ton prochain point d'atterrissage avant de sauter.\nPrends ton temps. Pas besoin de se précipiter là-haut.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips.response.okay=Compris.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete=Encore en bas ? Alors t'as pas atteint le sommet des ruines.\nGarde les yeux levés et reste patient. Tu atteindras le sommet des ruines à force.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.remind=Rappelle-moi où est Robb.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.go=Compris. Je monte.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location=Quelque part vers le sommet, je crois. Je l'ai perdu de vue quand il est monté plus haut dans les ruines.\nSi t'entends Robb rire, c'est que tu t'approches.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location.response.on_my_way=J'y vais.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete=Te revoilà en un seul morceau. Bon boulot.\nRobb se tenait bien ? Il est en un seul morceau ? Il a parfois beaucoup trop confiance là-haut, mais je lui fais confiance.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.remember=Ouais, il va bien
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.useful=Il semble un peu jeune pour être là-haut.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools=Ouais, il est jeune, mais on a vraiment pas grand-chose à faire par ici.\nIl joue dans ces ruines pour se distraire.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools.response.thanks=Ah, je vois.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.after_completion=Quand tu vois de la pierre brisée maintenant, tu devrais penser : route, couverture, sortie de secours.\nTrès utile vu que les Zombies sont de plus en plus présents par ici.

# Plains - Ruins - Robb
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached=haha ! j'arrive pas à croire que t'aies réussi !!!\nbienvenue au sommet ! on voit tellement de choses de là-haut. c'est trop fun de jouer dans les ruines hein ?\nje te regardais tomber sur le chemin pour monter. c'est assez drôle de voir les gens essayer de grimper ici.\nlewis était encore tout sérieux ? peut-être qu'il veut que je rentre à la maison.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.rough=C'était trop fun !
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.easy=Lewis admire ta capacité à te déplacer.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.trick=J'arrive pas à croire que j'aie réussi non plus.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough=vraiment trop fun ! hahaha ! regarde juste la vue. prends tout ça en toi.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough.response.laugh=Haha ! Ouais ! Je vois !
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy=je suis sûr qu'il le fait. je me déplace tellement vite. je suis le meilleur pour courir ici.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy.response.okay=Sois pas trop confiant. C'est dangereux.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick=c'est en forgeant qu'on devient forgeron. tu seras plus confiant à l'avenir dans les hauteurs des ruines.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick.response.got_it=Compris.
skyblock_hub_dialogues.overworld.plains.ruins.robb.hello=hééé, comment se passe l'entraînement de parkour. je suis sûr que tu t'améliores.


# Jungle - Treetop Tropics - Nilo & Billy
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.hello=Hé, comment tu vas ? T'es encore vivant ? Super ! Merci d'avoir trouvé Billy, il a de la chance d'être mignon sinon je l'aurais transformé en tapis !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction=Oh, catastrophe ! Catastrophe absolue ! Mon chat, Billy, s'est encore sauvé. Il est quelque part au-dessus de nous, probablement en train de comploter la domination mondiale ou juste de chercher un oiseau à embêter. Tu peux m'aider à récupérer la bête avant qu'il décide de vivre dans la canopée pour toujours ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_1=Oh non, c'est terrible ! Je le ramène tout de suite.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_2=Je vais regarder quand je ne serai plus occupé à esquiver les lianes qui tombent.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_3=Je suis vraiment occupé là. La jungle est n'importe quoi aujourd'hui !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks=BILLY ! Oh, merci les étoiles ! J'arrive pas à croire que tu l'aies vraiment trouvé ! Il a toujours si faim, c'est comme s'il avait un trou noir à la place de l'estomac. Je vais lui donner du poisson avant qu'il commence à manger les planchers de la jungle.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_1=Pas de souci. Je suis un chuchoteur de chats professionnel.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_2=ENCORE DU POISSON ? CE CHAT EST UN GOUFFRE SANS FOND !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking=Comment ça se passe ? Des signes du fugitif poilu ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking.response=J'essaie encore. Les chats sont fourbes, et Billy est un ninja professionnel.

# Billy the Cat
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found=Miaou <italic>(Te regarde avec un sourire suffisant et complice)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found.response=Viens avec moi, petit fauteur de troubles. On rentre à la maison.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1=Miaou <italic>(Le ventre gronde comme un orage)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1.response=Tiens, du poisson. Arrête de grogner !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2=Miaou <italic>(Te regarde avec insistance)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2.response=Tiens, encore du poisson.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3=Miaou <italic>(Le grondement continue !)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3.response=Ce chat est un gouffre sans fond ? Bon, du poisson !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4=Miaou <italic>(L'air peu impressionné)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4.response=Voici le quatrième poisson. Sérieusement, Billy ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5=Miaou <italic>(Semble enfin satisfait)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5.response=Enfin ! Rentrons.


# Jungle - George - Fishy Business
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction=Ah, la légère tension sur la ligne, le frisson absolu de la prise ! Ma passion pour la pêche est légendaire, même si ça fait si longtemps que j'ai pas pu lancer une ligne. Ma famille est ici dans la jungle, et je les échangerais contre aucun océan du monde, mais oh, comme la mer me manque ! Tu dois vraiment essayer — c'est de la magie pure !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_1=D'accord ! Tu m'as convaincu !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_2=C'est vraiment si bien ? J'imagine que je vais essayer.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_3=Pas maintenant, George.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch=Comment tu apprécies la pêche ? T'as trouvé le rythme ? J'espère que tu fais des prises légendaires !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch.response=J'y travaille, George !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit=Une fois que t'as attrapé assez de poissons, donne-les-moi pour que je les examine de près !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit.response=Voilà.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks=Je t'avais dit que ce serait fun ! Regarde toutes ces beautés, t'as vraiment un talent pour ça ! Merci de partager le frisson avec moi ; la pêche c'est tellement bien, et encore mieux entre amis. Dommage que j'aie pas pu aller au lac moi-même !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks.response=Quand tu veux, George !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.hello=Bonjour ! L'eau est bonne, même dans la jungle ! Prêt à lancer une ligne ? Mais tu sais ce qui rendrait ça encore mieux ?\nPêcher avec un aussi bon ami !


# Jungle - Celia - Bean to Bar
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.hello=Bonjour. Le chocolat c'est ta nourriture de jungle préférée ? J'espère que oui !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.come_back_for_sugar=Bonjour. Reviens me voir quand t'auras du sucre, je pourrai te montrer comment sucrer ton chocolat.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available=Toi là. Tu veux apprendre à faire du chocolat ? Du délicieux chocolat. Même si c'est pas très sain, ça pourrait te donner un bon coup de boost d'énergie.\nCommençons par du chocolat non sucré. Le chocolat sans sucre est une alternative bien plus saine.\nJe vais te donner la recette, mais tu devras aller la faire toi-même. Dis-moi comment ça s'est passé.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_1=Miam ! Du chocolat !!!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_2=Oh non, je déteste le chocolat.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.in_progress_craft=Comment avance la fabrication de chocolat ? J'espère que ce chocolat non sucré répond à tes attentes.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete=Alors ? Donne-moi le rapport.\nC'était amer ? Quels effets secondaires t'as eu ?\nTellement de gens se mettent à courir dans tous les sens après avoir mangé du chocolat.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_1=Amer, mais brillant.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_2=Je crois que j'ai besoin d'eau.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available=Rebonjour. Alors, tu veux apprendre à mettre du sucre dans ton chocolat ? C'est parti.\nTu connais le principe. Je vais te donner la recette, mais tu devras aller la faire toi-même. Dis-moi comment ça s'est passé.\nFais attention : le chocolat n'est pas sain, et doit toujours être consommé avec modération.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_1=Ouais, faisons plus de chocolat.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_2=Je fais attention à ma santé, mais OK.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft=Comment se passe l'ajout de sucre dans le chocolat ? Avant que tu t'en rendes compte, tu pourrais être en train de bâtir un empire du chocolat.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_1=J'assure. C'est facile.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_2=Je suis pas très doué pour faire du chocolat.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete=T'as réussi ! Du chocolat. Plein et riche comme tu l'espérais sûrement.\nSois raisonnable et ne cours pas trop vite avec cette montée de sucre.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_1=T'inquiète, je suis très mature avec le chocolat.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_2=Le crash du sucre va faire mal.

# Jungle - Treetop Tropics - Non-Quest
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello=Attends une seconde. Je dois juste vérifier ces Fèves de Cacao. Peut-être qu'elles sont prêtes.\nOh attends, et celles-là...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello.response_1=Je vois que t'es très occupée là.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello=J'ai construit certaines de ces plateformes quand elles ont lâché. J'espère vraiment que mon ingénierie est suffisamment bonne pour qu'elles restent en place.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_1=T'as tout construit ça ? C'est impressionnant.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_2=T'as l'air sur le point de t'évanouir.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1=Merci. Enfin, pas tout. Je répare juste les parties qui se cassent.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_1=Autant de rambardes. Préférence personnelle ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_2=Peur des hauteurs...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_railings=Oui.\n<italic>(Il attrape la rambarde à deux mains.)</italic>\nLa peur des hauteurs entraîne des mesures de sécurité supplémentaires.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_advice=Moque-toi pas. C'est pas mon choix, je suis né comme ça.\nEnfin je suppose que c'est ma faute d'aider là-haut. J'aurais préféré être pêcheur au ras du sol.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_2=T'as vu l'altitude à laquelle on est !? On est tellement haut, et j'ai le vertige ! C'est peut-être le mal des hauteurs qui s'installe.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello=Hé, toi là, tu veux une blague nulle ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_1=Allez. Une blague. Fais-moi souffrir.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_2=Non merci. Je tiens à ma tranquillité.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu=Choisis bien. La jungle a beaucoup de prédateurs, mais aucun d'aussi implacable que mes chutes finales.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_1=Balance une blague sur les feuilles.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_2=Donne-moi quelque chose sur les araignées.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_3=Allez. Rends le cacao drôle.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_1=J'ai essayé de quitter la jungle, mais les lianes ont dit : "Non, reste."\nAinsi je suis dans une re-liane-tion à long terme.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_2=Comment appelle-t-on deux araignées qui viennent de se marier ?\nDes nouveaux mariés en toile !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_3=Mon cacao ne mûrit jamais à temps pour être mangé. C'est toujours trop choco-tard.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.avaru.hello=Hé ! Quelle belle journée ! Ravi de te rencontrer ! J'espère te revoir par ici !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cressida.hello=REGARDE LA TAILLE DE CET ARBRE ! IL EST TELLEMENT GRAND ! :O\nJe me demande comment l'eau monte jusqu'au sommet !
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello=Si tu vois un ocelot, ne le pourchasse pas. Il a très peur de toi.\nCe conseil s'applique aussi aux gens.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello.response=Je vais m'entraîner à faire ma meilleure tête indifférente.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.silva.hello=Hé, regarde où je suis ! Je suis sous un arbre !\nJ'en avais peur avant, mais ensuite j'ai remarqué ses racines. Elles sont cubiques. Donc mathématiquement je vois cet arbre comme unidimensionnel, parce que je regarde sa racine cubique.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello=T'as la tête de quelqu'un qui sort tout juste de l'Oak Forest.\nBienvenue dans la jungle, voyageur. Tu vas devoir t'habituer à grimper haut dans les arbres. J'espère que t'as pas le vertige.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_1=Bon à savoir. Je suis à l'aise avec les hauteurs.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_2=Oh là là, je vais pas m'en sortir.
skyblock_hub_dialogues.misc.optimiser_not_unlocked=Bonjour ! Je suis l'Optimiseur ! Je peux booster la production de toutes tes ressources.\nJe suis assez difficile sur les gens avec qui je travaille, alors reviens quand tu auras progressé davantage !

# Shop Dialogues
skyblock_hub_dialogues.shop.blocks.greeting=Salut, tu trouveras pas de meilleurs blocs ailleurs ! Tu veux jeter un œil ?
skyblock_hub_dialogues.shop.blocks.greeting.buy=Qu'est-ce que t'as en vente ?
skyblock_hub_dialogues.shop.blocks.greeting.sell=Laisse-moi te vendre des trucs !
skyblock_hub_dialogues.shop.blocks.greeting.nothing=Non, merci !
skyblock_hub_dialogues.shop.furniture.greeting=De beaux meubles pour une belle personne ! Je peux t'en proposer ?
skyblock_hub_dialogues.shop.furniture.greeting.buy=Montre-moi ce que t'as !
skyblock_hub_dialogues.shop.furniture.greeting.sell=J'ai des trucs à vendre.
skyblock_hub_dialogues.shop.furniture.greeting.nothing=Je suis bien pour l'instant, merci.
skyblock_hub_dialogues.shop.garden.greeting=J'ai tout ce qu'il faut pour faire fleurir ton jardin ! Intéressé ?
skyblock_hub_dialogues.shop.garden.greeting.buy=Montre-moi ce que t'as en vente !
skyblock_hub_dialogues.shop.garden.greeting.sell=Je voudrais vendre quelques trucs.
skyblock_hub_dialogues.shop.garden.greeting.nothing=Non, merci !
skyblock_hub_dialogues.shop.misc.greeting=Je te vois regarder ! Qu'est-ce qui a attiré ton œil ?
skyblock_hub_dialogues.shop.misc.greeting.buy=Qu'est-ce que je peux acheter ici ?
skyblock_hub_dialogues.shop.misc.greeting.sell=En fait, j'ai des trucs à vendre.
skyblock_hub_dialogues.shop.misc.greeting.nothing=Rien pour l'instant, merci.
skyblock_hub_dialogues.shop.ore.greeting=Tous les minerais dont ton cœur a envie ! Tu veux regarder ?
skyblock_hub_dialogues.shop.ore.greeting.buy=Montre-moi tes minerais !
skyblock_hub_dialogues.shop.ore.greeting.sell=Je veux te vendre des trucs.
skyblock_hub_dialogues.shop.ore.greeting.nothing=Pas maintenant, merci.
skyblock_hub_dialogues.shop.spawner.greeting=Prêt à faire apparaître plus de monstres ? J'ai exactement ce qu'il te faut !
skyblock_hub_dialogues.shop.spawner.greeting.buy=Montre-moi ce que t'as !
skyblock_hub_dialogues.shop.spawner.greeting.sell=En fait, je voudrais vendre quelques trucs.
skyblock_hub_dialogues.shop.spawner.greeting.nothing=Peut-être la prochaine fois, merci.

# Cold Taiga - Ivar - Frozen Harvest
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro=L'hiver serre fort et lâche pas, et les réserves de grain sont dangereusement basses. Je dois m'assurer que tout le monde reste nourri pendant le gel. Tu peux sortir là-bas et me ramener du blé ?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro.response.accept=Bien sûr, je t'aide ! Le village en a besoin.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources=Garde la tête baissée et les mains en mouvement. Comment avance la récolte du blé ?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources.response=J'y travaille encore ! Le givre est dur à couper.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro=Content de te revoir. T'as trouvé quelque chose pour les réserves ?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro.response.yes=Voici le blé, fraîchement récolté !
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks=Bon boulot. Ça va tenir le ventre du village plein encore quelques jours. À bientôt !
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks.response=Avec plaisir !
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello=Comment ça va ! Laisse pas le froid s'installer dans tes os.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello.response=Nickel ! Je me réchauffe !

# Cold Taiga - Felix - Winter Warmth
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro=Le froid s'installe vraiment ce soir, hein ? J'essaie de garder tout le monde au chaud, mais on manque de combustible pour les cheminées. Tu pourrais ramasser des Rondins d'Épicéa pour moi pour qu'on reste au chaud ?
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro.response.accept=Bien sûr, je t'aide ! Tout pour garder le village au chaud.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro=Oh, t'es de retour ! T'as réussi à trouver des Rondins d'Épicéa ? Le froid s'installe vraiment ici, et ma famille et moi commençons à avoir un peu froid !
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro.response.yes=Voici les Rondins d'Épicéa !
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks=Parfait. Merci infiniment pour ton aide. T'as vraiment le cœur le plus gentil, ça donne l'impression que cet endroit est vraiment chez nous.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks.response=Avec plaisir !
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello=Bonjour ! C'est tellement agréable de te voir. J'espère que ta journée est aussi merveilleuse que toi !
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello.response=Coucou ! Garde-toi au chaud !

# Cold Taiga - Felix - Warmth in the Cold
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro=Merci d'avoir aidé à nous garder au chaud. Tu pourrais m'aider à trouver des Snowberries, de la Écorce d'Épicéa Émiettée et du Sucre de Lapis en Poudre ?\nCe sont des ressources rares qu'on trouve dans le Snowy Taiga, mais qui peuvent être précieuses pour ta survie.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro.response.accept=Je vais les réunir pour toi !
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro=T'as trouvé les ingrédients dont j'ai besoin ?\nOn peut tous les trouver dans le Snowy Taiga : Les Snowberries préfèrent être près des buissons à baies. Le Sucre de Lapis en Poudre se forme à la surface des lacs gelés, en se dissolvant dans l'eau depuis la roche en dessous. Enfin, l'Écorce d'Épicéa Émiettée est la plus difficile à trouver, mais tu devrais pouvoir en trouver près des épicéas.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro.response.yes=Laisse-moi te donner ce que j'ai !
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks=Excellent ! Maintenant, j'ai entendu dire que les Snowberries peuvent être très utiles dans les donjons. Elles restaurent ta santé et te donnent une couche de protection supplémentaire !\nTu peux les tester pour moi ? Essaie d'en manger pendant que tu explores un donjon et dis-moi comment elles fonctionnent !
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks.response=Je vais les tester !
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress=T'as essayé de manger les Snowberries dans un donjon ? Je suis curieux de savoir si elles aident vraiment !
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress.response=Pas encore, je vais aller essayer !
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete=Oh, donc les Snowberries ont vraiment aidé dans le Donjon ! C'est super à entendre ! Quand j'en mange une, j'ai l'impression de recevoir un beau câlin chaud.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete.response=Pas de problème !
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro=La glace profonde a bougé dernièrement, révélant des veines de bleu qui ne devraient pas être là. J'ai besoin de lapis pour mes recherches. Tu peux en ramasser en utilisant différents outils ? Je veux voir si la méthode d'extraction change la résonance du cristal.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro.response.accept=Bien sûr, je vais t'aider à investiguer !
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress=Comment ça se passe pour casser du lapis avec différents outils ? Des vibrations inhabituelles dans la pierre ?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress.response=Je continue !
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro=Excellent. Je peux avoir ces cristaux de lapis que t'as cassés avec différents outils ? Je dois comparer l'intégrité structurelle de chaque lot.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro.response.yes=Voilà !
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks=Merci. Attends une seconde que je vérifie ça...\n...\nEh bien, c'est décevant. La structure cristalline n'a pas changé du tout. Ils sont identiques. C'était une belle perte de temps.\nAu moins on a confirmé que la physique simple s'applique encore ici et que les outils en bois sont complètement inutiles à cette profondeur.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_1=Oh, c'est dommage. La science, c'est essai et erreur, non ?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_2=Je suis pas sûr de ce à quoi tu t'attendais, honnêtement.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello=La glace raconte des histoires si tu regardes assez profondément.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello.response=C'est vrai, hein...

# Cold Taiga - Sigrid - Feather and Grain
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro=Le givre mord plus profondément cette saison, et avec le plancher du canyon qui tremble comme il le fait, on doit s'entraider. On survit ensemble, ou pas du tout. Tu peux m'aider à préparer des stocks pour le village ?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro.response.accept=Je m'en occupe ! Personne ne devrait mourir de faim.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro=Oh, t'es de retour ! Viens plus près du feu, mon grand, je vois le froid sur tes épaules. Comment avance la collecte ?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro.response.yes=Voici la nourriture que tu m'as demandée !
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks=Dieu te bénisse. Ça va garder les petits au chaud et remonter le moral des anciens. C'est l'effort partagé comme le tien qui empêche la glace d'atteindre nos cœurs.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks.response=Content d'avoir pu aider la communauté !
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello=Bonjour ! Il y a toujours un siège chaud et un mot gentil qui t'attendent ici.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello.response=Salut !


# Cold Taiga - Inga - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.before_unlock=Shiverfield a toujours faim à cette période de l'année. Si tu cherches un repas, parle à Sigrid. Moi j'ai les mains pleines ici.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro=Attention ! Ne marche pas là. Elles vont envahir tes bottes comme si t'avais du grain dans les poches.\n\nJ'ai commencé avec quelques poules. Juste assez pour garder les fours en marche quand le givre mord le plus fort.\n\nMais ces derniers temps ? C'est comme si l'hiver pouvait plus les toucher. La corruption violette se répand, les gens ont faim, et mes poules se multiplient comme pour se moquer de nous.\n\nElles sont partout. Dans les congères. Sur les toits. Elles percent des trous dans des sacs qu'on peut pas remplacer.\n\nJe peux pas juste... les abattre. Ce sont les miennes et elles sont vivantes. Je les ai élevées.\n\nS'il te plaît. Parle à Runa à la Garde de Shiverfield. Elle saura quoi faire. J'ai juste besoin d'une réponse qui me retourne pas l'estomac.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_1=Je vais lui parler.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_2=Des poules qui envahissent un village. C'est nouveau.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.in_progress=Si tu les vois dans les rues, ne les pourchasse pas pour t'amuser, OK ? Elles font confiance aux humains. C'est le pire dans tout ça.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete=Tes mains sentent les plumes.\n\n...Ne mens pas. Je le vois dans tes yeux.\n\nT'as fait ce que Runa t'a dit, hein ?\n\nJe le déteste. Je déteste que ça ait du sens.\n\nShiverfield a besoin de nourriture. Et de flèches. Et l'hiver se fiche de ce qu'on veut.\n\nLa prochaine fois que je me dis que je peux tout garder en sécurité avec de bonnes intentions, rappelle-moi ce moment.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_1=Je suis désolé. On n'avait pas d'autre choix.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_2=Ton troupeau nourrissait le village, d'une manière ou d'une autre.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_3=Je t'aiderai à reconstruire le poulailler pour que ça n'arrive plus.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.after_completion=J'aime toujours les poules. J'aime juste Shiverfield encore plus.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello=Bonjour.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello.response=Salut !

# Cold Taiga - Runa - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro=Inga t'a envoyé. J'ai entendu le troupeau avant de te voir.\n\nÉcoute, j'aime pas ça. Personne ici n'aime ça.\n\nMais les routes sont pires maintenant. Les chasseurs reviennent moins souvent. La corruption violette rend les bois inquiétants, comme si les ombres écoutaient.\n\nOn a un village à nourrir, et un village à défendre contre ces phénomènes étranges.\n\nLes poules, ça veut dire de la viande pour les affamés et des plumes pour les flèches. Sans flèches, nous les gardes, on est un mur de mains vides.\n\nTu vas devoir en récolter dix. Apporte-moi dix plumes. On ne gaspillera pas ce qu'on prend.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_1=Compris. Je m'en occupe.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_2=Inga sera pas contente.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_3=Je veillerai à ce que ça serve le village.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.in_progress=On doit encore réduire un peu le nombre de poules. Elles envahissent encore tout.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro=T'as les plumes ?\n\nElles sont très précieuses pour la garde, elles feront plein de flèches.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_1=Ouais, les voilà.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_2=J'ai pas aimé tuer ces poules.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks=Amplement. De quoi garder la garde approvisionnée un moment.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks.response_1=Bien.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.after_completion=Si tu peux garder Shiverfield nourrie, tu la gardes en vie. C'est le boulot.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello=Reste prudent là-dehors. La garde peut te protéger à proximité, mais au fond de la toundra, c'est ta responsabilité.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello.response=Je serai prudent.

# Cold Taiga - Kjell - Corrupted Curiosity
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available=Attention ! Ces poules sont devenues folles !\nIl se passe quelque chose avec elles, et elles m'attaquent. Très étrange comme comportement.\nJe suis Kjell. Je suis une sorte de scientifique. J'ai adoré étudier la chimie à l'école, mais j'ai une idée de ce qui se passe ici.\nTu peux me ramener une de ces poules corrompues pour que je l'examine de plus près ?
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_1=Oh là là, des poules maléfiques. J'y vais !
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_2=Je vais t'aider à trouver la cause.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro=T'as cette poule corrompue ? J'ai hâte d'élucider ce mystère.\nOh, et quoi que tu fasses, ne la mange pas. Ça a l'air d'une très mauvaise idée sans le moindre avantage.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro.response_yes=J'ai la poule.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit=Super ! Tu l'as ! Voyons voir ce qu'on a là...\n...\nOh, je crois que c'est vivant ? Ce truc violet. C'est pas une roche.\nEh bien... c'est tout ce que je peux faire. J'ai dit que j'étais fort en chimie, pas en biologie.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_1=Vivant ? Oh là là...
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_2=Je suppose qu'il faut continuer à chercher
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.hello=Si tu as d'autres réponses sur ce qu'est ce truc violet, j'ai tellement envie de savoir. Je peux pas croire que ce soit vivant !


skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.dungeon_guard.introduce=Woah ! J'ai entendu dire que t'étais là pour aider ?\nOn a un gros problème dans nos toutes nouvelles mines.\nOn creusait pour extraire de précieux lapis lazuli des réserves sous les lacs.\nMais on a été débordés ! Il y a plein de monstres et de bestioles. Ils semblent vouloir le lapis pour eux.\nTu peux nous aider ?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro=La chaleur n'est pas la seule chose qui nous use ; les fondations mêmes de cette oasis bougent. On a besoin de grès pour renforcer les ancrages avant que le sable n'avale ce qu'il reste de la surface. Je peux compter sur tes forces ?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro.response.accept=Je vais t'aider à sécuriser les fondations !
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro=Du calme. T'as réussi à récupérer le grès que j'avais demandé pour les renforcements ?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro.response.yes=J'ai les matériaux juste là !
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks=Ça va nous gagner du temps face à l'affaissement. Chaque pierre posée est un bouclier contre l'inévitable glissement. Merci.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks.response=Content d'aider à stabiliser le désert.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello=Garde les pieds légers et les yeux à l'horizon. Le désert ne cesse jamais de bouger.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello.response=Je reste alerte, Zahra. Merci.

# Desert - Unsafe Roads
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro=Les routes deviennent dangereuses ; le sable avale les repères plus vite qu'on peut en poser. Tu peux m'apporter du grès pour qu'on renforce les routes ?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro.response.accept=Je vais m'en occuper.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress=Les dunes sont agitées aujourd'hui. T'en as trouvé assez ? Il faut s'assurer qu'on en a assez pour ancrer le chemin.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress.response=Je cherche encore...
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return=Bien fait. L'équipe signale que les supports tiennent. La vigilance est notre meilleure défense ici. Merci.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return.response=Quand tu veux !
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello=Yeux ouverts. Dans ce désert, si tu ne surveilles pas le danger, c'est le danger qui te surveille.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello.response=Hé !
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.intro=Talib t'a envoyé ? Bien. Le sol est meuble ici et les dunes avancent. T'as le grès ?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.response=Le voilà.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks=Merci, ça va rendre la route beaucoup plus stable. La terre a moins de chances de glisser avec ça en place.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks.response=Super !
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello=Belle journée pour construire, à condition que le vent ne décide pas de reprendre notre travail.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello.response=C'est sûr.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.intro=Les tremblements font vibrer les parois du passage. Les briques de boue vont aider à stabiliser le chemin. T'en as ?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.response=Oui, les voilà.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks=Parfait, c'est exactement ce qu'il nous fallait pour amortir les vibrations.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks.response=Avec plaisir.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello=Fais attention sur les routes. Le désert a tendance à s'ouvrir quand on s'y attend le moins.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello.response=Je ferai attention.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.intro=Sans une base solide, le sable glisse juste. Le granit est essentiel pour les fondations. T'en as apporté ?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.response=J'ai du granit juste là.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks=C'est du granit de haute qualité ! Il est assez lourd pour résister aux tremblements. Merci.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks.response=De rien.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello=Le désert peut être implacable avec ceux qui construisent sur des fondations fragiles.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello.response=Tu m'en parles.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.intro=On doit étayer les surplombs avant qu'ils s'effondrent. Enfin, du bois pour les supports ! T'as les planches d'épicéa ?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.response=Oui, des planches d'épicéa comme demandé.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks=Excellent ! On a tout renforcé maintenant. Va prévenir Talib.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks.response=J'y vais !
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello=Le travail acharné est la seule chose que le sable ne peut pas éroder.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello.response=C'est bien vrai.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro=Les jours sont de plus en plus chauds et les nuits de plus en plus incertaines. On a besoin de réserves pour que le campement ne s'effondre pas. Tu peux m'aider à sécuriser notre avenir ?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro.response.accept=Je peux aider avec ça.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro=Du calme. Chaque fourniture compte quand le sable commence à bouger. T'as des réserves pour le stock ?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_1=Oui, je les ai.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_2=Bien sûr ! Je suis toujours heureux d'aider !
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.no=Oh désolé ! Pas maintenant !
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks=Le travail méthodique porte ses fruits. Ces fournitures vont nous permettre de tenir pendant les longues nuits à venir. Merci.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks.response=De rien.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello=Le désert ne fait pas de quartier aux imprudents. Reste en sécurité là-dehors.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello.response=Toi aussi.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro=Le sable qui se déplace déterrait des choses qui auraient dû rester enterrées. Les routes se remplissent de Zombies, et ça rend les déplacements impossibles.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro.response.accept=Je vais m'en occuper et dégager le chemin.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro=L'air semble un peu plus léger avec ces monstres partis. T'as de la chair de Zombie pour moi ? J'ai besoin de preuves que les dunes sont plus sûres.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_1=Beurk, de la chair pourrie. Tu peux l'avoir si tu veux.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_2=Je crois que j'en ai quelques-unes à donner pour la cause.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon=La menace ne disparaît jamais vraiment ici. Reviens quand tu auras nettoyé les dunes.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_1=Compris ! Ça avance bien !
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_2=Les Zombies me font peur D :
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response=C'est noté.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete=Avec ton aide, on a sécurisé ce tronçon de route. On est une super équipe !
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_1=Content d'aider à garder les routes ouvertes.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_2=Totalement d'accord !
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello=Le désert cache de nombreux dangers sous sa surface. Reste vigilant.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_1=Bonjour.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_2=J'espère que tu vas bien !
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro=Dans une terre qui essaie de tuer tout ce qui est doux, seuls les plus durs survivent. Le cactus est utile : il fournit de l'eau, de la défense et un pigment qui ne pâlit pas sous cette lumière aveuglante. Apportes-en-moi.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro.response.accept=Je m'en occupe tout de suite.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro=Le sable bouge encore. T'as le cactus pour nous aider à fortifier le périmètre ?
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro.response.yes=Le voilà.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks=Ça va durer quand d'autres choses vont se faner. C'est une plante dure pour un monde dur. Merci.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks.response=De rien !
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello=La chaleur, le sable et le temps, ils dépouillent tout sauf la vérité. Oh hé, je me parlais à moi-même...
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello.response=Salut !
skyblock_hub_dialogues.overworld.desert.duneside.azim.hello=Désolé, je suis assez occupé là. J'essaie de construire une éolienne. Tellement d'énergie à capter dans le vent. On veut pas réchauffer encore plus le désert en brûlant du charbon.
skyblock_hub_dialogues.overworld.desert.duneside.todd.hello=Hé ! Je suis Todd !\nNe fais pas attention à moi, je garde juste cette porte pour qu'aucune des créatures à l'intérieur ne s'échappe. C'est le tunnel de fuite de Duneside, mais il a été envahi par des créatures.\nSi tu veux aider, Sunny est au fond du tunnel de fuite. J'ai peur qu'elle ait du mal à tout nettoyer toute seule.\nTu peux pas passer par ici, donc tu devras trouver l'autre bout en bas de Duneside.
skyblock_hub_dialogues.overworld.desert.duneside.bashara.hello=Ne marche pas sur le sable plus sombre. Je crois qu'il y a quelque chose de mystérieux dessous.
skyblock_hub_dialogues.overworld.desert.duneside.corvin.hello=Je me souviens pas de ces pierres ici. J'espère vraiment que le plafond ne s'effondre pas.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello=La soif nous fait souffrir. Je vends quelque chose qui aide, même si tout le monde le déteste.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_1=Les gens le détestent ?
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_2=Ravi de te rencontrer ! Je suis juste de passage.
skyblock_hub_dialogues.overworld.desert.duneside.derya.detail_1=Je vends de l'eau de cactus. C'est pas de l'eau ordinaire. C'est un peu plus sucré je crois.\nTout le monde a peur parce que je suis pas très doué pour enlever les épines de cactus.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello=Tends la main. Je peux lire ton avenir...
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_1=D'accord. Lis mon avenir.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_2=Non merci.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1=Je vois trois formes.\nUn cactus. Une porte. Et un zombie très agacé.\nDonc je suppose que ton avenir comprend tout ça.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_1=Une porte ?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_2=Un zombie agacé ?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_3=C'est n'importe quoi.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_doorway=Je peux pas en lire plus malheureusement. J'ai juste vu une porte dans ma vision. Peut-être que cette porte deviendra très importante pour toi.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_zombie=Haha ! Tu vas clairement agacer un zombie dans le futur.\nJe n'ai jamais vu un zombie montrer le moindre sentiment, donc tu dois vraiment bien l'agacer.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_nonsense=Bien sûr que oui.\nLe n'importe quoi, c'est plus léger à porter que la certitude. Je suis juste là pour remonter le moral des gens autour de moi.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello=Ugh, le sable a un goût dégueu. Il arrête pas de rentrer dans ma bouche.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello.response_1=Pourquoi rester aussi près du sable ?
skyblock_hub_dialogues.overworld.desert.duneside.vesper.detail_1=J'ai des endroits où aller ! Je vais pas laisser le sable se mettre en travers de mon chemin.
skyblock_hub_dialogues.npc_name.devin=Devin
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello=Les développeurs de ce jeu disent que c'est difficile de continuer à inventer autant de dialogues pour différents PNJ, donc ils en ont juste copié-collé certains.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_1=Quel flemmard.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_2=J'ai pas remarqué ça. Je vais garder l'œil ouvert
skyblock_hub_dialogues.overworld.desert.duneside.dungeon_guard.introduce=Hé ! Tu peux le croire ! Le tunnel de fuite de Duneside a été envahi par de mauvaises créatures !\nLe tunnel de fuite est essentiel à notre survie. De nombreuses violentes tempêtes de sable enterrent l'entrée principale de Duneside, et le tunnel de fuite est notre seul plan de secours !\nJ'ai été autorisé à utiliser un vieux système pour inonder le tunnel de Lave pour l'assainir. Je suis déjà à bout de souffle rien qu'en marchant jusqu'ici, donc je pense pas que ce soit une bonne idée que je m'en charge.\nT'es partant ?

# NPC Names
skyblock_hub_dialogues.npc_name.alder=Alder
skyblock_hub_dialogues.npc_name.thorne=Thorne
skyblock_hub_dialogues.npc_name.bram=Bram

# Alder Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.before_unlock=Journée chargée. Des arbres à entretenir, du bois à traiter. Reviens plus tard si t'as besoin de quelque chose.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available=T'as aidé Ronan à réparer les dégâts causés par ces tremblements, non ? Bon boulot. Mais on peut pas continuer à réparer des fissures à chaque fois que le sol décide de bouger. J'y réfléchis... les vieux chênes ont résisté à pire. Leurs racines s'étendent loin, s'adaptent à la terre. Peut-être qu'on peut apprendre d'eux. Tu veux m'aider à tester quelque chose ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.what_thinking=Tu penses à quoi ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.got_time=J'ai le temps. De quoi t'as besoin ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.not_now=Pas maintenant, désolé.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation=Bram et moi discutons de fondations flexibles — des structures qui bougent *avec* le sol au lieu de se fissurer contre lui. La forêt fait déjà ça. Chaque fois que le vent frappe la canopée, les racines absorbent la contrainte. Si on peut reproduire ce principe... eh bien, la prochaine fois que quelque chose tremble, peut-être que les bâtiments plient au lieu de se casser.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.how_help=Comment je peux aider ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.complicated=Ça a l'air compliqué.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.think_about=Je vais y réfléchir.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response=C'est plus simple qu'on croit. La nature a déjà résolu le problème. On doit juste observer et adapter. Commence par regarder le Vieux Chêne — ses racines tiennent bon depuis des décennies. C'est là que se trouve la réponse.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.im_in=D'accord, je suis partant.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.come_back=Laisse-moi revenir là-dessus.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions=Parfait. Il y a quelqu'un à qui tu dois parler d'abord — Thorne. C'est un chercheur en arbres qui étudie le Vieux Chêne depuis des semaines. Il a installé son camp près de lui. Si quelqu'un comprend comment ces racines restent stables pendant les tremblements, c'est lui. Va trouver Thorne et vois ce qu'il a appris.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions.response.find_him=Je vais le trouver.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active=Thorne est toujours près du Vieux Chêne, à étudier ces systèmes racinaires. Va lui parler — il expliquera mieux que moi.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active.response.on_way=J'y vais.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return=Te revoilà. Qu'est-ce que t'as vu ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.roots_web=Les racines s'étendent partout comme une toile.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.big_tree=C'est juste un grand arbre.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.correct_observation=Exactement. Une toile. Chaque racine soutient les autres. Quand le sol bouge, tout le réseau s'adapte ensemble — pas de point de défaillance unique. C'est ce dont les bâtiments ont besoin. Pas des blocs rigides qui craquent sous la pression, mais des supports interconnectés qui distribuent la contrainte. Bram peut concevoir la structure en treillis, mais on aura besoin de matériaux. Beaucoup.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.playful_correction=Regarde mieux la prochaine fois. Ce "juste un grand arbre" a survécu des siècles en étant plus malin que nous. Ses racines s'étendent loin et profond — quand le sol bouge, tout le réseau s'adapte. C'est le secret. De toute façon, t'en as assez vu. Maintenant il nous faut des matériaux pour construire quelque chose de similaire.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions=Voici ce qu'il nous faut : D'abord, ramasse des Pousses de Chêne. Pas des plantées, des naturelles. Je veux étudier leurs premiers schémas racinaires et les utiliser comme amortisseurs vivants autour des structures clés. Pendant ce temps, on aura besoin de composants fabriqués. Bram aura besoin de Dalles de Chêne. Elles répartissent le poids mieux que des blocs entiers. Et des Clôtures de Chêne. Elles vont créer des supports en treillis flexibles, comme des racines qui s'entrelacent. Tu peux travailler sur tout ça à ton rythme. Reviens quand t'as les pousses, et livre les pièces fabriquées à Bram.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.got_it=Compris. Pousses, dalles, clôtures.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.why_saplings=Attends, pourquoi des pousses ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.lot_crafting=Ça fait beaucoup à fabriquer.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_explanation=Les jeunes arbres s'adaptent plus vite. Si on les plante près des fondations, leurs racines vont naturellement se développer dans le réseau de soutien. De plus, étudier leur croissance précoce nous dit comment façonner les treillis en bois. Des structures vivantes et construites qui travaillent ensemble — c'est l'objectif.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.workload_acknowledgment=C'est vrai. Mais si on veut que ça marche, il faut le faire bien. Prends ton temps. La forêt ne se précipite pas, et nous non plus.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check=Comment avance la collecte ? J'ai besoin de ces seize pousses de chêne quand tu peux. Et n'oublie pas que Bram attend les dalles et les clôtures.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.working_on_it=J'y travaille encore.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.remind_me=Rappelle-moi ce dont t'avais besoin ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.requirements_reminder=Seize pousses de chêne pour moi. Soixante-quatre dalles de chêne et trente-deux clôtures de chêne pour Bram. Tout en bois de chêne.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered=T'as les pousses ! Laisse-moi voir ça. *(les examine)* De beaux spécimens — des systèmes racinaires sains qui commencent à se former. Ceux-ci vont parfaitement s'intégrer aux supports en treillis une fois que Bram aura terminé la construction. Excellent boulot.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.what_do=Qu'est-ce que tu vas en faire ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.happy_help=Content d'aider.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.planting_strategy=Je vais les planter stratégiquement autour du périmètre des bâtiments. En grandissant, leurs racines vont créer un renforcement naturel — des fondations vivantes qui s'adaptent au sol. Combiné aux supports en bois de Bram, on aura un système hybride. Le meilleur des deux mondes.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram=Les pousses sont parfaites. Il faut juste que Bram reçoive ses matériaux. T'as livré les dalles et les clôtures ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.working=J'y travaille.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.not_yet=Pas encore.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete=T'as tout fait ce qu'on demandait et plus encore. Bram a déjà commencé à assembler le treillis, et j'ai planté les pousses autour des structures critiques. Quand le prochain tremblement viendra — et il viendra — ce village ne va pas juste tenir ensemble. Il va s'adapter. T'as aidé à construire quelque chose qui apprend, quelque chose qui dure. La forêt donne, mais tu as veillé à ce qu'on l'écoute. Merci.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.will_work=Est-ce que ça va vraiment marcher ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.glad_help=Content d'avoir pu aider.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.another_tremor=Que se passe-t-il s'il y a un autre tremblement ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.confidence=Je le crois. Les principes sont solides — la nature les utilise depuis des millénaires. Le savoir-faire de Bram est solide. Et tu nous as donné exactement ce qu'il fallait. Si le sol tremble encore, on sera prêts.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_readiness=Alors on verra si notre ingénierie tient. Mais même si ça ne tient pas, on aura appris quelque chose. C'est comme ça que le progrès fonctionne — observer, adapter, améliorer. La forêt l'enseigne à chaque saison.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion=Les fondations flexibles tiennent bien jusqu'ici. Pas encore de tremblements, mais quand ils viendront, on sera prêts. Je continue à m'occuper des pousses — elles poussent bien. Merci encore pour ton aide.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.good_hear=Bien à entendre.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.other_projects=D'autres projets ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_projects=Il y a toujours quelque chose à améliorer. Mais pour l'instant, je suis concentré là-dessus. La forêt fournit — je l'aide juste un peu.

# Thorne Dialogues
skyblock_hub_dialogues.overworld.oak_forest.thorne.before_quest=Oh ! Bonjour. Je suis Thorne — dendrochronologiste. C'est un chercheur en âge des arbres, en termes simples. Je documente l'architecture racinaire du Vieux Chêne. Un spécimen fascinant. Ça fait presque trois semaines que je suis là et je découvre encore de nouveaux schémas de ramification !
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction=Alder t'a envoyé ? Excellent ! Il t'a demandé d'écouter mes découvertes, non ? Eh bien, t'es au bon endroit. Ce chêne *(montre le grand arbre)* a plus de 300 ans, et son système racinaire est absolument remarquable. Tu vois comment les racines s'étendent vers l'extérieur en ce treillis entrelacé ? Chaque racine primaire se ramifie en secondaires, qui se ramifient en tertiaires... ça crée de la redondance. Si une section est endommagée ou sous contrainte, la charge se distribue sur tout le réseau. Pendant ce tremblement la semaine dernière, j'ai observé le sol bouger — on pouvait vraiment *voir* les racines s'adapter, absorber le mouvement. L'arbre a à peine bougé. C'est le secret : flexibilité plus interconnexion égale stabilité.
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.roots_web=Donc les racines fonctionnent comme une toile ?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.help_buildings=Comment ça aide les bâtiments ?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.incredible=C'est incroyable.
skyblock_hub_dialogues.overworld.oak_forest.thorne.web_confirmation=Précisément ! Une toile tridimensionnelle qui se déplace comme un seul organisme. Aucun point de défaillance unique. Si Alder et Bram peuvent reproduire ce principe avec des supports en bois, les bâtiments résisteront bien mieux aux tremblements que des fondations en pierre rigide. La nature perfectionne cette conception depuis des millions d'années — on emprunte juste le plan.
skyblock_hub_dialogues.overworld.oak_forest.thorne.buildings_explanation=Ah ! C'est là qu'entre le génie d'Alder. Il veut construire des structures de soutien qui imitent ce réseau racinaire — des treillis en bois interconnectés qui peuvent s'adapter sous la contrainte au lieu de se fissurer. Ajoute des pousses vivantes autour du périmètre, et en grandissant, leurs racines réelles vont s'intégrer aux structures construites. Ingénierie hybride. C'est du génie, vraiment.
skyblock_hub_dialogues.overworld.oak_forest.thorne.enthusiastic_response=N'est-ce pas ? Je pourrais étudier cet arbre pendant des années et apprendre encore quelque chose de nouveau chaque jour. Mais Alder a besoin d'applications pratiques, pas juste d'observations académiques. Va lui dire ce que t'as vu — la structure en réseau, la flexibilité, la distribution de charge. Il saura quoi faire de cette information.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1=Alder a trouvé mes observations utiles ? J'espère. Les arbres ont tellement à nous apprendre sur la résilience et l'adaptation.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.working_on_it=Il y travaille.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.what_else=Qu'est-ce que t'as appris d'autre ?
skyblock_hub_dialogues.overworld.oak_forest.thorne.other_learnings=Oh, par où je commence ? Les schémas des cernes de croissance suggèrent que cette zone a connu une activité sismique significative il y a environ 80 ans — bien pire que le tremblement de la semaine dernière. Pourtant l'arbre a survécu. Je suis aussi en train de suivre les réseaux fongiques dans le sol — ils connectent plusieurs arbres en sous-sol, partageant nutriments et informations. La forêt est bien plus interconnectée que la plupart des gens réalisent.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion=J'ai appris qu'Alder et Bram ont terminé les fondations flexibles ! Utiliser mes recherches sur les racines pour de l'ingénierie pratique — je suis honoré. La forêt fournit vraiment, non ?
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.thanks=Merci pour ton aide.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.studying_now=Qu'est-ce que t'étudies maintenant ?
skyblock_hub_dialogues.overworld.oak_forest.thorne.acknowledge_thanks=Avec plaisir ! C'est rare que mes recherches aient des applications concrètes immédiates. D'habitude je publie juste des articles que trois autres dendrochronologistes lisent. C'était... rafraîchissant.
skyblock_hub_dialogues.overworld.oak_forest.thorne.current_research=J'examine maintenant les schémas d'érosion de l'écorce. J'essaie de les corréler avec des données météo historiques. Pas aussi excitant que des systèmes racinaires résistants aux tremblements, je l'admets, mais toujours précieux pour comprendre l'histoire de la forêt.

# Bram Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.before_quest=Je travaille. Reviens si Alder t'envoie.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.quest_accepted=Alder a parlé de moi ? Bien. Dis-moi quand t'as les matériaux prêts.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages=Alder m'a parlé du plan de fondations flexibles. Bonne idée. Je vais gérer la construction du treillis, mais j'ai besoin de matériaux précis. Soixante-quatre dalles de chêne et trente-deux clôtures de chêne. Les dalles répartissent le poids sans se fissurer. Les clôtures créent des supports entrelockés. Apporte-les quand t'es prêt.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.get_crafted=Je vais les fabriquer.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_slabs=Pourquoi des dalles plutôt que des blocs entiers ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_fences=Pourquoi des clôtures ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.slabs_explanation=Les blocs entiers sont rigides. Le rigide casse. Les dalles sont plus fines — elles se compriment légèrement sous la contrainte, puis reprennent leur forme. Flexibilité sans défaillance. C'est ce qu'il nous faut.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_explanation=Les clôtures s'entrelockent. Un poteau se connecte au suivant. Quand une force frappe le réseau, elle se répartit sur tous les points de connexion. Aucune pièce ne prend toute la charge. Même principe que les racines des arbres. Juste du bois au lieu de la terre.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials=J'attends encore les dalles et les clôtures. Prends ton temps. Je préfère attendre la qualité plutôt que précipiter du mauvais boulot.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.almost_done=Presque fini.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.remind=Rappelle-moi ce dont t'avais besoin ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.requirements_reminder=Soixante-quatre dalles de chêne. Trente-deux clôtures de chêne. Tout en chêne.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.still_need_fences=J'ai encore besoin des clôtures. Apporte-les, et on peut commencer à construire.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered=Les clôtures. *(en teste une)* Joints solides. Ça va former le treillis. Bon boulot.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.everything=T'as tout ce qu'il te faut maintenant ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.thanks=Merci.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.have_everything=Avec les dalles et les clôtures, oui. Alder gère les pousses. Je gère la construction. Va voir Alder quand t'es prêt.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_alder=Les matériaux sont là. Je commence l'assemblage. Va voir Alder — il va vouloir finaliser le plan.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion=Le treillis est installé. Les fondations tiennent. Un bon boulot dure.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.good=Bien à entendre.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.hold_tremor=Tu crois que ça va tenir pendant un tremblement ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.confident=Je l'ai bien construit. Avec les bons matériaux. Ça va tenir.

# Ring The Bell
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.ring_the_bell.investigate=Tu tires la cloche d'un coup ferme. Elle sonne clair et net.\nCloche de jour. Silence de jour.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.hello=La cloche pend immobile.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.locked=Désolé, je peux pas faire le truc du "discours de bienvenue".\nSi Cubit ne t'a pas encore montré la place, commence par là.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.in_progress=Essaie la cloche sur la place, puis demande à Levi, Sandy, Liora et Lee s'ils ont entendu quelque chose la nuit.\nPuis reviens me voir.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello=Salut.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available=Hé. T'es le nouveau visage que Cubit promène partout, non ? Bien. T'auras alors des oreilles fraîches.\nÉcoute... t'as entendu la cloche la nuit ?\nPas la sonnerie de jour. Pas la joyeuse. Je parle de celle qui te retourne l'estomac.\nJe me réveille à cause d'elle. Et quand je cours dehors... rien.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.bell_at_night=La cloche du village ? La nuit ?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.dream=C'était peut-être un rêve ?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.what_do=Qu'est-ce que tu veux que je fasse ?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request=Va sur la place et teste la cloche. Puis demande à quelques personnes si elles ont entendu des choses étranges après la nuit tombée.\nLevi et Sandy étaient avec Cubit quand t'es arrivé, non ? Commence par eux. Et parle aussi à Liora et Lee.\nSi personne d'autre ne l'a entendue... alors le problème c'est moi. Mais il faut que je sache.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.on_it=D'accord. Je vais demander autour.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.why_me=Pourquoi me demander à moi ?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.are_you_ok=Ça va ?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.why_you=Parce que tu me dois pas un mensonge réconfortant.\nLes gens qui te connaissent essaieront d'être gentils. Les gens qui ne te connaissent pas diront juste ce qu'ils ont entendu.\nEt j'ai besoin de la vérité.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.are_you_ok=Je... je gère.\nVa juste écouter toi-même. Si j'ai tort, je veux avoir tort exprès, pas par accident.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete=Donc. Personne ne l'a entendue.\nC'est... un soulagement. Et aussi pas.\nLa prochaine fois que ça arrive, j'essaierai de me souvenir de ce sentiment. Que ça peut être calme là-dehors, même si ma tête est bruyante.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.not_alone=T'es pas seul dans tout ça.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.something_else=Peut-être que c'est autre chose, pas la cloche.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.tell_me=Si ça se reproduit, dis-le-moi.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_not_alone=...Merci. J'oublie pas toujours que je peux demander de l'aide.\nJ'essaie.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_something_else=Peut-être.\nParfois le son voyage bizarrement à travers le bois. À travers les racines.\nParfois t'entends quelque chose de réel, juste pas à l'endroit où tu crois.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_tell_me=Je le ferai.\nEt si je fonce dehors en pleine nuit encore... au moins j'aurai une raison autre que la panique.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello.after_ring_the_bell=Hé. Merci encore d'avoir vérifié.\nSi la cloche sonne vraiment un jour, tu seras probablement le premier à le savoir.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked=La cloche la nuit... ? Mmm.\nJ'entends plein de choses la nuit.\nMa couverture. Mon estomac. Le vent.\nUne fois j'ai entendu un biscuit appeler mon nom. Ça s'est avéré être... moi. En train d'appeler le biscuit.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.no=Donc t'as pas entendu ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.worried=Chris s'inquiète. T'as une idée ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.nope=Nope. Si la cloche sonnait la nuit, je me réveillerais.\nÀ moins qu'elle soit très polie. Dans ce cas je dormirais probablement à travers.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.idea=Parfois les sons rebondissent.\nGenre... tu sais quand tu tapes sur une tasse et elle continue à chanter ?\nLe bois fait ça aussi.\nDis à Chris de boire de l'eau. Et peut-être de faire une sieste.\nLes siestes règlent la plupart des choses.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked=La cloche ? J'adore la cloche !\nMais la nuit ? Non.\nSi elle sonnait, je serais dehors immédiatement genre : 'QUI FAIT LA FÊTE ?'\nLa nuit c'est surtout des grillons et Levi qui ronfle.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.weird=Donc t'as rien entendu de bizarre ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.chris=Chris se réveille à cause d'elle.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.nothing=Rien qui ressemble à une cloche. Parfois j'entends un petit *toc toc* comme des glands qui tapent sur le toit.\nÇa peut sonner plus fort que ça devrait.\nPeut-être que Chris a un problème de glands.\nOu un problème de toit.\nOu un problème de glands sur le toit !
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.concern=Aw, pauvre Chris.\nIl est du genre à entendre un son étrange et à aussitôt essayer de le porter pour tout le monde.\nDis-lui que le village est calme. Et que je l'accompagnerai chez lui s'il prend peur.\nNon en fait. C'est lui qui m'accompagne. Je me laisse distraire.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked=La cloche est honnête.\nElle sonne quand des mains la tirent, et quand le vent la secoue.\nMais la forêt peut faire sa propre musique.\nLes racines bougent. Les branches s'installent. Le vieux bois soupire.\nSi Chris entend une sonnerie que personne d'autre entend... c'est peut-être parce qu'il écoute trop fort.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.no=Donc t'as pas entendu non plus ?
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.what_sound=T'as une idée de ce qui pourrait sonner comme une cloche ?
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.no=Non. Pas la cloche.\nMais j'entends le village se calmer la nuit.\nComme une maison qui respire. Comme le sol qui expire.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.what_sound=Les glands peuvent le faire.\nDeux coques qui tapent dans le bon rythme. Un seul qui roule dans une gouttière.\nLes petits sons deviennent forts quand on a peur.\nDis à Chris que la peur fait d'excellentes oreilles et de terribles conclusions.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked=La nuit ? Pas de cloche.\nEt j'en suis à peu près sûr.\nQuand la cloche sonne, les animaux réagissent. Les chiens dressent les oreilles. Les oiseaux sursautent. Même les chats arrêtent leurs petits complots.\nSi la cloche sonnait et que personne ne le remarquait, on aurait un village plein des animaux les plus calmes du monde.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.imagining=Donc tu penses que Chris l'imagine ?
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.notice=Qu'est-ce que t'as remarqué la nuit ?
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.imagining=Je pense que Chris est fatigué.\nEt les cerveaux fatigués cousent du n'importe quoi en schémas.\nÇa veut pas dire qu'il l'invente exprès.\nÇa veut juste dire qu'il a besoin de sommeil plus que de réponses.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.notice=Des hiboux. Le vent. Le genre de silence qui te fait entendre tes propres pas.\nParfois t'entends un bourdonnement si tu restes longtemps près de vieux bois.\nPas une cloche. Plutôt... le souvenir d'une.
skyblock_hub_dialogues.overworld.oak_forest.liora.hello=Salutations, voyageur. Les vieux chênes murmurent de ton arrivée, et leurs voix m'apportent du réconfort dans ce vaste bois. Qu'est-ce qui t'amène à écouter avec nous ?
skyblock_hub_dialogues.overworld.oak_forest.lee.hello=Hé, je t'ai vu te faufiler dans les sous-bois. Les écureuils en jasaient. Tout va bien par là dans les bois ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro=Si t'as un moment, tu pourrais m'aider à réapprovisionner ? Les bâtisseurs travaillent toute la journée, et un pot vide n'aide personne.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.ill_bring=Je vais t'apporter de la soupe.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.why=Pourquoi de la soupe à la betterave ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.accepted=Merci. J'ai besoin de seize bols pour garder la file qui avance.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup=Facile à faire en grandes quantités, facile à transporter, et ça te réchauffe de l'intérieur. Simple c'est bien quand tu nourris tout un campement.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup.response.ill_bring=Je vais t'apporter de la soupe.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro=De la chance ? J'ai besoin de seize bols pour garder la file qui avance.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro.response.yes=Voilà.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks=Parfait. Ça va tenir tout le monde. Merci. Repasse si tu veux un bol chaud.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks.response=Avec plaisir.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.hello=Bonjour. Tu veux un bol chaud ?

# Hungry Hands (Potato Towers)
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available=Stop. Potato Towers n'est pas un marché. C'est un mur avec un garde-manger derrière. Et ces derniers temps, le garde-manger a poussé des pattes.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.zombies=Des zombies encore ?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.accept=Si quelqu'un vole, je vais le trouver.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.decline=C'est pas mon problème.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.zombies_clarification=Si c'étaient des zombies, je serais content. Les zombies ne discutent pas. Ils ne pleurent pas. Ils ne te regardent pas dans les yeux pour te demander pourquoi t'as des pommes de terre et pas eux.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation=On m'a fait venir pour défendre cet endroit contre les morts. C'était le deal. Mais les vivants continuent à tester les portes. Des mains affamées, des pieds rapides et une douzaine d'excuses. J'ai besoin que tu trouves qui fait ça et que tu m'apportes quelque chose de concret. Des noms. Un schéma. Quelqu'un à qui ils obéissent.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.start=Par où je commence ?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.handle=Je m'en occupe.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.starting_point=L'allée derrière les boutiques. Trois visages reviennent sans cesse près des charrettes : Tess, Joss et Perrin. Parle-leur. Tu vas découvrir qui tire les ficelles.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check=Si tu veux arrêter un vol, fais-le avec des faits. Parle à Tess, Joss et Perrin. Puis reviens.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.on_it=J'y vais.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.remind=Rappelle-moi qui je cherche.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.reminder=Tess, Joss et Perrin. Trois noms. Une histoire. Apporte-moi la vérité.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution=Je viens de parler avec Ceryn. Ni criminel. Ni saint. Juste quelqu'un en qui les gens ont confiance.\nVoler c'est mal. Je vais pas prétendre le contraire.\nMais je comprenais pas à quel point c'était grave là-dehors. L'ombre de Pumpkingdom porte plus loin que nos portes.\nVoici ce qui va se passer. Les portes restent fermées. Mais je serai plus lent à remarquer un sac qui n'est pas le mien. Et je vais commencer à pousser pour des rations correctes qui ne nécessitent pas de se faufiler.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.fair=C'est... juste.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.open=Pourquoi ne pas ouvrir les portes ?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.sooner=T'aurais pu faire ça plus tôt.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.why_not_open=Des portes ouvertes attirent plus que la faim. Elles attirent la panique. Et les zombies. Je peux tenir une ligne, mais je peux pas tenir une foule en débandade.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.admission=Oui. Et j'aurais dû poser des questions avant de commencer à compter les pommes de terre manquantes comme si c'étaient des flèches dans un carquois. J'apprends.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.after_completion=Si tu vois quelqu'un fixer une charrette trop longtemps, ne suppose pas que c'est un voleur. Parfois ils calculent juste si la nourriture vaut la honte.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first=Si Garran t'a envoyé, t'as pas besoin de me fusiller du regard. Je sais à quoi ça ressemble.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.stealing=Tu voles à Potato Towers ?
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.hurt=Je suis pas là pour te faire du mal.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.started=Dis-moi qui a commencé.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.direct_question=Je vole du temps. Je vole de la chaleur. Je vole un moment où mon estomac ne crie pas. Les pommes de terre, c'est juste la forme que ça prend.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hint=Si tu veux celui à qui les gens obéissent, trouve Ceryn. Pas un chef. Une boussole. Campé hors de la route là où les tours arrêtent de faire de l'ombre.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first=Tu vas me ramener à la porte ? OK. Fais-le. Au moins à l'intérieur des murs il y a de la lumière.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.why=Pourquoi voler ici ?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.behind=Qui est derrière tout ça ?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.truth=Je peux aider si tu me dis la vérité.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.contrast=Parce qu'ici l'air sent la nourriture cuite. Du côté de Pumpkingdom, ça sent la pierre humide et les choses mortes. Les gens ne volent pas parce que c'est fun. Ils volent parce que c'est proche.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hint=Ceryn. C'est à qui tu veux parler. On ne fait pas un pas sans demander ce que Ceryn ferait. Surtout parce que Ceryn réfléchit avant d'agir.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first=Si tu viens pour des pommes de terre, t'arrives trop tard. Les quelques restes de nourriture qu'on avait ont disparu maintenant.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.following=Je cherche celui que tu suis.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.stop=Arrête de voler.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stop_response=Et ensuite quoi ? Je cesse d'avoir faim parce que t'as dit une phrase ? On fait ce qu'on doit pour survivre. Parle à Ceryn si tu veux en savoir plus.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hint=Trouve Ceryn au camp. Ceryn déteste le vol aussi. Dit que ça nous rend plus petits. Mais Ceryn refuse aussi de laisser les gens mourir de faim.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first=Garran pense que je suis un chef. Je le suis pas. Je suis juste celui que les gens regardent quand ils sont sur le point de faire quelque chose qu'ils ne peuvent pas défaire.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.reason=Ils disent que c'est à cause de toi qu'ils volent.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.starving=Potato Towers a assez. Vous mourez de faim.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.escort=Viens avec moi. Parle à Garran.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.framing=Ils volent parce qu'ils ont faim. Potato Towers a une montagne de pommes de terre et un fossé de règles. C'est pas de la justice. Mais le vol reste du vol.\nMarche avec moi. Je vais le dire en face. Si Garran veut appeler ça un crime, OK. Mais je veux qu'il comprenne ce qu'il défend.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.escort_start=Parlons à Garran. Viens avec moi. Je veux une conversation, pas une émeute.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hello=Si tu es là pour m'accuser, garde ton souffle. Je fais ce que je dois pour survivre.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hello=T'es perdu ? Je peux pas offrir beaucoup de rations malheureusement.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hello=Fais attention par ici. Les gens sont pas sympas quand ils ont faim.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello_before_quest=Bonjour. T'as aussi faim ?\nOn s'organise pour voir quelles rations on peut tirer de Potato Towers. C'est ce qu'on doit faire pour survivre.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello=Moi et les gardes sommes sur de meilleurs termes. On s'en sort maintenant, grâce à toi.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available=On organise un repas partagé pour les civils de Pumpkingdom. Après l'effondrement, une table chaude signifie plus qu'une célébration.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.whats_wrong=Pourquoi t'es si tendu à ce sujet ?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.need_help=De quoi t'as besoin de moi ?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.later=Je reviendrai plus tard.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation=Pumpkingdom n'est plus pareil depuis qu'elle est tombée. Certains ont perdu leur maison. D'autres leur cuisine. On peut reconstruire la pierre, mais la faim fait disparaître les gens en silence.\nRhea et moi gardons ça simple ce soir : quelque chose de nourrissant, rien de gaspillé, et assez de côté pour que les Plains ne le ressentent pas demain.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.what_do_you_need=D'accord. De quoi t'as besoin de moi ?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.wasting_food=Pourquoi aider Pumpkingdom ?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup=Parce que ce sont encore nos voisins. Et parce que le plus dur après un effondrement, c'est pas les décombres, c'est les semaines où on cesse d'espérer être nourri.\nOn peut leur offrir une bonne nuit sans transformer le garde-manger des Plains en une promesse qu'on peut pas tenir.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup.response.tell_me=Juste. C'est quoi le plan ?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.what_i_need=Parle d'abord à Rhea. C'est elle qui décide ce qui va aux gens et ce qu'on rationne pour plus tard. Tu peux la trouver à l'étage.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions=Parle à Rhea avant de collecter quoi que ce soit. C'est elle qui coordonne le repas de ce soir.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.on_it=J'y vais.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.remind=Rappelle-moi.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions_reminder=Trouve Rhea à l'étage. Prends la liste. Suis-la exactement.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder=T'as réussi à rassembler des provisions pour le repas de Pumpkingdom ?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.deposit_potatoes=J'ai des pommes de terre à stocker pour plus tard.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.working=J'y travaille encore.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.potatoes_delivered=Bien. Je vais faire stocker ces pommes de terre.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report=C'est la dernière pièce dont on avait besoin. Pumpkingdom va manger, les Plains vont rester approvisionnées un moment. Merci.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.good=Content d'avoir pu aider.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.close=Je réalisais pas à quel point c'était serré.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.close_followup=La plupart des gens ne réalisent pas. C'est pourquoi je travaille si étroitement avec Rhea pour garder de la nourriture en stock pour les saisons plus difficiles.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.after_completion=Si tu vois quelqu'un de Pumpkingdom qui a l'air perdu, montre-lui le chemin vers la table. Laisse-le avoir une assiette pleine.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.before_quest_started=Si tu es là pour le repas de Pumpkingdom, ne traîne pas dans les jambes. Soit t'apportes quelque chose à la table, soit tu dégages. Si tu es là pour travailler, parle à Nolan.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro=Nolan t'a envoyé. Bien.\nCe soir on nourrit les civils de Pumpkingdom. Depuis l'effondrement, certains vivent de ce qu'ils peuvent échanger, récupérer ou étirer. On leur donne un bon repas sans mettre les rations des Plains en danger.\nApporte des pommes de terre à Nolan pour les stocker pour plus tard. Apporte-moi 64 citrouilles pour le repas de ce soir.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.why_pumpkins=Pourquoi des citrouilles pour le repas ?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.who_wasting=Ils souffrent vraiment autant ?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.got_it=Compris. Je reviens.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.why_pumpkins_followup=On est en saison des citrouilles là, et on en a plein. Elles se conservent pas longtemps et sont assez saisonnières.\nLes pommes de terre se conservent plus longtemps, donc il vaut mieux les stocker pour les repas suivants.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.who_wasting_followup=Oui. L'effondrement fait ça. Quand une ville se brise, les fours refroidissent en premier.\nIls le diront pas à voix haute, mais tu peux le voir : les gens mangent trop vite, gardent les croûtes, font semblant de ne pas avoir faim. On leur offre une nuit où ils peuvent arrêter de compter les bouchées.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder=T'as les provisions de citrouilles pour le repas de ce soir ?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.deposit_pumpkins=J'ai des citrouilles pour le repas.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.on_it=J'y vais.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.pumpkins_delivered=Parfait. Ça va faire un excellent repas ce soir.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.after_completion=Si t'entends des rires ce soir, c'est toi qui les as rendus possibles.\nNos réserves sont pleines et les gens vont être nourris.\nSois fier de toi.

# Non-Quest NPCs
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello=Je suis charpentier. Je fabrique des chaises qui ne s'effondrent pas pendant les tremblements. La plupart du temps.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_1=La plupart du temps ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_2=T'as des blagues de charpentier ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_1=Si le sol tremble, les meubles doivent garder le rythme. "La plupart du temps" signifie que j'ai perdu exactement une bataille contre la gravité.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_2=J'ai essayé de faire une ceinture avec de l'écorce de chêne. C'était une perte de taille.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello=Tu le sens ? Les arbres bourdonnent. Soit un tremblement arrive, soit la forêt potine encore.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_1=La forêt potine ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_2=Comment tu restes calme ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_3=Je te laisse à ça.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_1=Le vent entre les arbres de la forêt chuchote. Je suis convaincu qu'il me parle, mais c'est peut-être juste mes nerfs. Je suis convaincu qu'hier il a dit 'J'ai perdu la partie'...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_2=Je donne un nom à chaque craquement et grincement. C'est plus difficile d'avoir peur de quelque chose qui s'appelle Gerald.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello=C'est moi ou les Glands par ici semblent avoir des pouvoirs magiques ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello.response_1=De la magie ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.detail_1=Ouais. T'as pas vu ? Certains suintent ce truc violet.\nJ'ai aucune idée de ce que c'est. Si tu veux mon avis, c'est pas bon signe.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello=J'ai pas peur des araignées. Je respecte juste leurs opinions à huit pattes.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_1=Quelles opinions ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_2=Donc t'as peur.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_3=Des conseils pour la mine ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_1=Les araignées font ce qu'elles veulent. Elles n'ont pas peur de toi. Tu peux trouver des solutions aux araignées sur la toile.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2=J'ai pas peur. Je suis stratégique. Je préfère rester en vie sans avoir à affronter ces horribles créatures.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2.response_1=T'inquiète. Moi aussi j'ai peur.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello=Si t'entends la cloche sonner, soit le danger est proche, soit je m'ennuie. C'est fifty-fifty.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_1=S'il te plaît, arrête de la sonner.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_2=Qu'est-ce que ça veut dire quand elle sonne deux fois ?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_3=Sonne tant que tu veux. J'aime le chaos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_1=J'ai essayé. La cloche a appelé mon nom. Fort. Aussi le silence ici donne l'impression d'attendre.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_2=Ça veut dire que j'ai oublié que je l'avais déjà sonnée une fois. Je suis constante, pas précise.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello=Si tu restes immobile assez longtemps, le froid VA essayer de t'adopter. NE le laisse PAS faire.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_1=Comment je l'empêche ?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_2=Le froid adopte les gens ?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_3=J'aime le froid.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_1=Continue à bouger. Porte quelque chose de chaud. NE sors JAMAIS mal habillé. Ces environnements sont impitoyables.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_2=Oui. Il y a tellement de conditions impitoyables là-dehors. Le froid prend qui il veut. On peut juste s'habiller chaudement pour en ralentir les effets.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello=Il fait vraiment froid ici, et on peut pas sortir souvent. Je compte les flocons de neige pour passer le temps.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_1=T'en es à combien ?
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_2=Ça a l'air épuisant.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_1=La dernière fois j'en ai compté 314. J'aurais continué mais ma Tarte aux Snowberries finissait de cuire, donc j'ai dû aller manger.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_2=L'hiver aussi. On est sur la même longueur d'onde.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello=Je tricote. Des écharpes, des moufles, du soutien moral. Si t'as un problème, je peux probablement le transformer en chapeau.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_1=Transformer quoi en chapeau ?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_2=Je peux avoir une écharpe ?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_1=N'importe quoi. Ça dépend juste comment tu le vois.\nPrends ce problème, tourne-le en positif et porte-le avec fierté. Maintenant c'est un chapeau.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_2=Seulement si tu promets de la porter de façon dramatique. La lancer comme un héros dans une tempête de neige.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello=J'ai fait une liste de choses qui ne sont pas des loups. Ça aide la nuit.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_1=C'est quoi dans la liste ?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_2=Et les vrais loups ?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_3=Pourquoi faire une liste ?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_1=Des arbres. Des ombres. Du vent. Des gens. Probablement. La liste est en cours.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_2=Ils n'ont pas fait la liste. Suspect. Très suspect.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_3=Les loups font vraiment peur ! Qui n'en aurait pas peur. J'essaie de faire une liste de choses qui ne font pas peur ! Ça m'aide à rester calme la nuit.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello=Si t'as froid, bois quelque chose de chaud. Si tu es triste, bois quelque chose de chaud. Si tu es pourchassé, bois quelque chose de chaud plus vite.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_1=Qu'est-ce que tu prépares ?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_2=Est-ce que ça aide vraiment ?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_1=Du Thé à l'Aiguille d'Épicéa. Ça a le goût du courage et des aiguilles. Surtout des aiguilles.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_2=Ça t'aide si tu crois que ça t'aide. Ne sous-estime pas un placebo.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello=Je m'entraîne à rire de façon maléfique. Écoute. Ha. Ha. Ha.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_1=C'était terrifiant.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_2=Pourquoi s'entraîner ?
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_3=Je te laisse continuer à t'entraîner.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_1=Merci. Je m'améliore. Je veux que les gens aient peur de moi.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_2=Parce que je veux dominer le monde, et on peut pas faire ça sans un rire maléfique. Logique.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available=Oh. Oh wow. T'as exactement la tête de quelqu'un qui peut s'occuper d'un gâteau.\nJ'ai fait une nouvelle recette de gâteau aux snowberries, et j'ai besoin d'un deuxième avis.\nSi je partage la recette avec toi, ça te dérangerait de la tester ?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_1=Le gâteau c'est ma spécialité.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_2=Vas-y.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder=Comment avance le test du gâteau ? J'AI BESOIN de savoir...\nMes espoirs et rêves de devenir boulangère sont en jeu.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_1=Je n'en ai encore mangé aucun.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_2=J'adore le gâteau jusqu'ici. Je suis juste rassasié.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_3=Je suis pas sûr de pouvoir en avaler un de plus.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete=Alors ? Alors ?\nDis-moi tout. La texture, le goût de la baie — ton Gâteau aux Snowberries était-il meilleur qu'un gâteau ordinaire ?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_1=C'était pur bonheur.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_2=Je veux une autre part.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_3=Je crois que la pâtisserie c'est pas pour toi.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.after_quest=Hé, goûteur.\nSi tu vois des snowberries, tu sais quoi faire.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.hello=Hé, je suis une future boulangère. J'essaie de faire un nouveau gâteau. Je travaille encore sur mon ingrédient spécial.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello=Ne fais pas confiance aux perroquets. Ils répètent tout. Y compris les secrets. Surtout les secrets.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_1=Qu'est-ce qu'ils ont dit ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_2=Apprends-moi la langue des perroquets.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_3=Des conseils pour la jungle ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_1=Que quelqu'un avait laissé tomber un poisson. Ils avaient raison. C'était moi. Les perroquets ne me pardonneront jamais.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_2=C'est surtout des insultes et des demandes de collation. Parfois un avertissement, si tu paies en graines.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello=J'invente une nouvelle cuisine : le croquant. La jungle offre de nombreux candidats.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_1=S'il te plaît non.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_2=C'est quoi au menu ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_3=Donne-moi quelque chose de normal.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_1=Lâche. Mais juste. Je vais pas te servir de scarabée aujourd'hui. Peut-être demain.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_2=Scarabée rôti. Araignée épicée. Salade de lianes. La salade mord en retour. C'est le charme.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello=Les lianes ne sont que des cordes avec de l'ambition. Je suspends mon art là où la gravité peut le critiquer.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_1=Quel art ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_2=Est-ce que ça tombe ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_3=Je peux aider ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_1=Des carillons faits de graines. Ils sonnent comme de minuscules tempêtes qui se disputent poliment. Si tu veux aider, mets-toi en dessous et fais semblant d'avoir voulu être là quand ça tombe.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_2=Souvent. C'est ça le spectacle. Si ça ne tombe pas, c'était pas assez courageux.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello=Tout le monde dit que la canopée est magnifique. Tout le monde oublie qu'elle est aussi très loin du sol.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_1=Alors reste en bas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_2=Qu'est-ce qui te fait le plus peur ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_3=Tu veux des encouragements ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_1=J'ai essayé. La jungle a construit des escaliers. La jungle se moque de moi.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_2=Tomber. Et aussi ne pas tomber, parce qu'ensuite il faut redescendre.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello=Je cartographie la jungle en écoutant. Les oiseaux tracent les frontières. Les insectes remplissent les détails.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_1=Ça a l'air inventé.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_2=Je peux voir ta carte ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_3=Où est-ce que je devrais aller ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_1=La jungle aussi. Pourtant nous voilà. Écoute assez longtemps et les chemins se présentent.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_2=C'est surtout des flèches et des avertissements. Aussi un gribouilli d'un perroquet très impoli.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello=J'ai dit à une liane qu'elle était collante. Elle l'a mal pris.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_1=Encore une.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_2=Un vrai conseil ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_3=T'es insupportable.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_1=Je me suis perdu et j'ai demandé mon chemin. La jungle a dit : 'laisse-moi tranquille'.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_2=Ne frappe pas un arbre avec des fourmis dedans. Tu regretteras d'avoir des mains.
skyblock_hub_dialogues.npc_name.balth=Balth
skyblock_hub_dialogues.npc_name.brakka=Brakka
skyblock_hub_dialogues.npc_name.kora=Kora
skyblock_hub_dialogues.npc_name.nyssa=Nyssa
skyblock_hub_dialogues.npc_name.ruk=Ruk
skyblock_hub_dialogues.npc_name.sable=Sable
skyblock_hub_dialogues.npc_name.varka=Varka
skyblock_hub_dialogues.npc_name.zarn=Zarn
skyblock_hub_dialogues.npc_name.grak=Grak
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro=Oh. *Groin* Toi... tu m'as remarqué.\nJe tiens un bol de décompte. Pour les patrouilles qui ne reviennent pas entières. C'est un travail silencieux. *Groin*\nJe demande rarement de l'aide. Mais le bol est trop plein. Je me demandais si... si tu pouvais en libérer certains en vengeant leur perte ? *Groin*... Seulement si tu veux.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro.response.accept=Je vais t'aider avec le bol.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress=*Groin*... Oh. T'es encore en train de travailler là-dessus.\nT'inquiète, rien ne presse. Je veux pas ajouter ton nom dans mon bol aussi. Reste en sécurité.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress.response=Je vais aller jusqu'au bout.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete=Oh. *Groin*... Merci.\nLes noms ne sont pas oubliés, et la perte de mon ami déchu prend maintenant du sens. Je sais pas vraiment comment... *Groin*... Merci. C'est tout ce que j'ai.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_1=T'as pas besoin d'en dire plus.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_2=Qu'ils reposent en paix.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello=*Groin*... Oh. Bonjour. Je n'attendais personne.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_1=Bonjour, Grak.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_2=Ne fais pas attention à moi.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro=*Groin* T'as pas l'air d'un Piglin. Tu dois être l'un de ces Humains envahissants.\nJe vous fais pas confiance, vous les Humains, qui courez partout dans le monde. Nous les Piglins, on peut gérer cette infestation de Piglins Zombifiés nous-mêmes ! *Groin*\nBon, si tu veux te prouver, je te laisse faire.\n*Groin* Seul un ami m'apporterait de l'or. Tu seras mon ami ?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro.response.accept=Oui, je veux être ton ami.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro=Si tu tiens vraiment à te prouver à moi, t'as apporté l'or ?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro.response.trade=Voici l'or.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete=Oh, tu me values vraiment comme ami. Je pensais que vous les Humains ne nous aimiez pas. *Groin*\nJe crois qu'on est amis maintenant. Bon à savoir.\nJ'ai peut-être jugé les humains trop vite. *Groin*
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_1=Content d'être ton ami.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_2=J'essaie juste d'être sympa
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello=Hé l'ami !!!! *Groin* *Groin* *Groin* *Groin*\nT'as encore de l'or ? ;)
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_1=Non, désolé l'ami :(
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_2=T'as l'air beaucoup trop content de me voir.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro=T'es l'un des humains qui aident la colonie, non ? Bien.\nDes Piglins Zombifiés Infernaux continuent d'apparaître par ici. Je pense que les Piglins Zombifiés normaux sont sous contrôle, mais j'ai peur que les humains ignorent la menace des plus mortels, les enflammés. Tu peux en éliminer quelques-uns ?
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro.response.accept=Je vais les nettoyer.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress=Comment ça avance ? Ces Infernaux sont un vrai défi, comme je le craignais ? J'ai peur qu'on soit déjà trop en retard.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_1=Je retourne au boulot.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_2=Ouais, ils sont coriaces
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete=Bon boulot humain ! Je crois que je dormirai mieux en sachant qu'il y a moins de ces créatures enflammées hostiles dehors. Pas que j'étais inquiet, je suis immunisé au feu. Je suis motivé à soutenir les efforts des Humains en prenant les décisions que je crois nécessaires.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_1=Content d'avoir pu aider.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_2=Bonne décision de ta part.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello=Des trucs bizarres se passent par ici. Si je remarque encore quelque chose que je juge être une menace, je te le ferai savoir.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_1=Merci !
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_2=Je suis toujours là pour aider
skyblock_hub_dialogues.nether.piglin_colony.balth.hello=Bienvenue dans le Nether ! Fais attention là-dehors. C'est pas un endroit accueillant.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_1=C'est très accueillant comme accueil.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_2=J'espère que tu vas bien.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello=Si tu sens la fumée, panique pas. J'ai juste encore brûlé la nourriture.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_1=Brûlé ?
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_2=J'espère que tes aventures culinaires se terminent bien.
skyblock_hub_dialogues.nether.piglin_colony.kora.detail_1=Ouais, bizarrement on peut encore brûler de la nourriture dans l'endroit le plus chaud de l'univers.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello=Woah ! Stop ! Fais attention au-delà de ces portes. C'est dangereux là-dehors.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_1=T'inquiète pour moi ! J'ai un casque !
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_2=Je vais être prudent
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello=Woah, l'architecture ici est vraiment impressionnante. Fou de penser que cet endroit a été littéralement construit en quelques années après la fusion.
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_1=C'est quoi la fusion ?
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_2=Ouais, c'est vraiment impressionnant
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_3=Bof, je connais de meilleurs bâtisseurs
skyblock_hub_dialogues.nether.piglin_colony.ruk.detail_1=C'est quand l'Overworld a fusionné avec cet endroit étrange.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello=Fais attention là-bas. Ce truc violet semble manger le quartz, et possède d'étranges pouvoirs magiques. Il m'a donné un troisième bras pendant une journée.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_1=Un troisième bras ?
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_2=Oh wow, c'est dingue.
skyblock_hub_dialogues.nether.piglin_colony.sable.detail_1=Ouais, c'est une magie vraiment puissante, si tu lui donnes ce qu'elle veut.\nClairement elle veut vraiment du quartz.
skyblock_hub_dialogues.nether.piglin_colony.varka.hello=Je forge des lames, des charnières, et à l'occasion une crise émotionnelle. Surtout des charnières.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro=Woah, attention là. Je n'ai pas encore fini de construire par ici. Ce pont derrière moi ne mène nulle part pour l'instant.\nJ'ai un petit problème, cependant. Je suis un bâtisseur très compétent. Mais j'ai perdu toutes mes lanternes, et j'ai une peur mortelle du noir.\nTu peux m'aider à les retrouver ? Elles n'ont pas pu aller loin.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro.response.accept=Je vais trouver tes lanternes.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns=Dépêche-toi s'il te plaît, j'ai vraiment peur du noir.\nJe sais qu'elles n'ont pas pu aller loin, à moins que les lanternes aient commencé à marcher. Si c'est le cas, c'est un autre problème, et je suis pas prêt pour ça.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns.response=Je continue à chercher.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit=T'as trouvé les lanternes ? Bien. Bien !\nMaintenant on a besoin d'assez de lumière pour tout le Crimson Exchange. Un tas de Glowstone et de torches devrait faire l'affaire.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_1=Voici des fournitures d'éclairage.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_2=J'y vais.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete=T'as réussi. Nickel. Il va y avoir tellement plus de lumière ici maintenant.\nJe n'ai plus besoin d'avoir peur du noir.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_1=Je suis d'accord, le noir fait peur.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_2=Content d'avoir pu aider.
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello=Tu as vraiment illuminé ma journée.\nJ'aurais vraiment préféré ne pas accepter un boulot de construction dans littéralement l'endroit le plus sombre de l'univers...
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello.response=Content que les lumières aident.
skyblock_hub_dialogues.nether.piglin_colony.vesh.lantern.cant_pick_up=Je sais pas à qui elles appartiennent. Je ferais peut-être mieux de les laisser là pour l'instant.
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello=Hé, bienvenue dans la Piglin Colony !\nLa Piglin Colony semble avoir été un bel endroit autrefois. Nous les Humains ne connaissions son existence que depuis très récemment.\nOn a trouvé cette dimension alternative à travers des fissures qui se sont formées entre les mondes.\nOn a parlé aux Piglins, et ils semblent sympas (ils sont juste un peu obsédés par l'or). Il paraît qu'ils ont ça plus difficile que nous dans l'Overworld.\nOn a installé cette base, le Crimson Exchange, pour accéder facilement au Nether afin d'offrir du soutien aux Piglins.\nN'hésite pas à les aider, mais fais attention ! Beaucoup d'entre eux ont été envahis par la corruption et se sont transformés en Zombies !
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_1=Je vais rester en sécurité !
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_2=Content de te revoir !

# Zombified Bastion - Dungeon Guard
skyblock_hub_dialogues.nether.piglin_colony.zombified_bastion.dungeon_guard.introduce=Ce bastion... il était autrefois la fierté de la Piglin Colony.\nMalheureusement, il est maintenant envahi par des variantes Zombifiées de nous les Piglins. Nos amis, maintenant devenus Zombies.\nTu pourrais m'aider à reprendre le Bastion pour nous les Piglins survivants ?\nOn doit juste sceller quelques-uns des portails que les Piglins Zombifiés utilisent pour entrer.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction=T'entends ça ? Ils coupent les arbres !!!\nTant de générations de familles qui ont pris soin de cette jungle, et maintenant tout est en train d'être abattu. Si tu veux mon avis c'est un mauvais signe, et si ça continue, les choses vont juste empirer.\nTu peux nous aider à arrêter cette horrible déforestation ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_1=Je vais demander. Ça a l'air grave.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_2=La Jungle peut peut-être se permettre quelques arbres.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.in_progress_workers=Peut-être que tu devrais commencer par parler aux travailleurs. Je suis sûre qu'ils savent qui est derrière tout ça.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.after_lucien=Oh, c'est Lucien. Ça fait totalement sens.\nCe monstre est juste tellement avide. C'est le riche du coin, et il est jamais satisfait de sa richesse.\nPas surprenant qu'il détruise notre maison pour augmenter encore sa fortune.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete=Lucien a pris tes rondins et a dit qu'il n'allait pas arrêter de toute façon. Cet homme est horrible.\nBon, merci d'avoir essayé. Je suis sûre qu'un jour quelqu'un lui fera entendre raison. Avant que toute cette forêt tombe.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete.response=J'espère que tu pourras sauver la forêt.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.hello=La déforestation continue. Lucien va continuer à remplir ses poches tant que quelqu'un ne pourra pas l'arrêter.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned=Ouais, c'est moi qui gère cette machine. Fais attention, c'est vraiment dangereux.\nC'est pas moi qui ai décidé ça. Je t'assure. Lucien, c'est un homme d'affaires puissant, et c'est lui qui est derrière tout ça. Je suis pas sûr qu'il réalise vraiment que ce qu'il fait nuit à la forêt. Je crois qu'il voit juste l'argent qu'il gagne en vendant le bois.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned.response=Ah, donc c'est motivé par l'argent.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.hello=Garde les mains à l'écart. Ce truc mord.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned=Woah, recule - j'étais sur le point de donner un énorme coup dans ce tas de rondins là-bas.\nÉcoute, je comprends que tu veuilles sauver la forêt, mais je peux rien faire. Je fais juste mon boulot.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned.response=Oh, désolé. Je te laisse retourner au boulot
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.hello=Fais attention, c'est une grosse machine, et j'essaie de collecter tout ce bois.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned=T'es le quatrième à essayer de m'arrêter aujourd'hui.\nJe te préviens, je suis vraiment pas d'humeur à te parler.\nSi tu veux des réponses, Lucien c'est ton homme. C'est lui qui me paie.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned.response=Compris.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.hello=Lucien paie bien. J'aimerais juste qu'il me paie pour ne pas détruire notre maison. Je peux pas avoir de chez moi sans chez moi, et je peux pas avoir de chez moi si j'abats cette forêt.\nJe peux pas gagner :(
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront=Je suis juste là pour faire de l'argent. J'ai repris l'entreprise familiale. Maintenant je coupe des arbres. J'arrive pas à croire que personne n'ait fait ça avant. Je vais être tellement riche.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_1=Tu démantèles ta propre maison.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_2=Qu'est-ce que je peux faire pour que tu arrêtes ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro=Soyons justes. Tu m'apportes un chargement de rondins pour compenser mes pertes commerciales, et j'arrête. Ça te semble juste ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.response_deposit=Tiens, quelques rondins
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.dungeon=Je veux me battre pour la forêt.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete=Excellent. Exactement ce que j'avais demandé.\nMaintenant, à propos d'arrêter.\nNon.\nCes rondins aident les chiffres d'aujourd'hui. Les machines aident ceux de demain.\nDis aux manifestants qu'ils peuvent continuer à me demander d'arrêter, mais je ne le ferai pas. L'entreprise ne va pas grandir avec un si petit tas de rondins.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_1=Je leur dirai.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_2=Monstre.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon=Hé, pousse-toi de là. J'ai des affaires à gérer.\nJ'ai de nombreux clients. Oui, ces clients pourraient être des monstres maléfiques, mais ils paient bien. La croissance de l'entreprise stagnerait si je commençais à faire le difficile avec mes clients.\nSi t'as un problème, amène-toi. Tu peux pas me gérer.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_1=Amène-toi.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_2=Tu travailles avec des monstres ?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters=Oui.\nIls veulent des trucs de moi. Plutôt que de me faire attaquer, j'ai juste trouvé que si tu leur donnes des trucs, ils ont tendance à te soutenir.\nPeu importe s'ils abattent tout et volent tout à tout le monde...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_1=Je dois t'arrêter.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_2=Je m'occuperai de toi plus tard.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.kiri.hello=Je connaissais un gars qui vivait dans une cabane dans les arbres dans l'un de ces arbres. C'est tellement injuste.\nJe suis presque certain que sa cabane a maintenant été transformée en bois pour le mur d'une maison d'un riche millionnaire.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.paz.hello=Je suis honnête. Cette forêt semble... "enchantée". Je pense que c'est une très mauvaise idée d'abattre ces arbres. Ça va nous revenir nous hanter.\nJe crois pas que ce truc violet qui suinte du sol soit un bon signe.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.marlo.hello=Je fais pas confiance à ce truc violet.\nC'est pas naturel.\nPourquoi y a-t-il des araignées partout maintenant.\nÇa fait pas sens.\nJe pense que c'est le signe que quelque chose de grave se passe.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available=Rebonjour ! Je travaille sur une nouvelle recette. Je pense vraiment qu'elle va donner un énorme coup de moral aux gens de Pumpkingdom.\nJe parie que ça sera aussi une super nourriture pour toi. T'es partant pour essayer ?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_1=Ouais, j'ai toujours faim
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_2=Toujours partant pour une nouvelle délicatesse
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted=Super ! Voilà mon idée. C'est un ragoût de bœuf. Je vais mettre à jour ton livre de recettes sur une table de craft, pour que tu puisses voir ce que j'ai en tête.\nVas en faire quelques-uns, et dis-moi ce que t'en penses au niveau du goût !
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_1=Ça a l'air merveilleux
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_2=L'idée me plaît pas trop, mais je vais quand même essayer
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder=Comment avance ma magnifique recette ? J'espère que t'as pas été empoisonné par elle.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_1=Ça avance bien
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_2=Ooo, ça se présente pas très bien
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_3=Je n'ai pas encore commencé
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete=Alors ? Regarde-toi, encore debout et sans faire la tête de quelqu'un qui "regrette tout". C'est prometteur. Je meurs d'envie de savoir, le ragoût de bœuf était-il bon ? Est-ce que j'ai raté tout le monde en tant que chef ?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.tasty=C'était bon. Vraiment bon.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.honest=Ça a besoin d'un peu de travail.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.horrible=C'était dégoûtant.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup=Oui ! Je le savais. Tout le monde dans le royaume va être tellement heureux. J'ai hâte de partager ma création avec plus de gens.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_1=Je suis content de te voir si heureux
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_2=Continue comme ça
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup=Bon, je suppose que c'est pas pour tout le monde, et il paraît que t'as pas détesté. On dirait que je suis dans la bonne direction. J'apprécie l'honnêteté.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_1=T'inquiète, je crois en toi
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_2=Tu devrais abandonner maintenant
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting=Oh là là. Je suis vraiment vraiment désolé. Je devrais juste arrêter d'être chef. Je peux pas croire que t'aies autant détesté.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_1=Je suis désolé, je voulais pas dire ça
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_2=Écoute, la cuisine c'est juste pas pour toi
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello=Comment ça va ? J'espère que tu vas mieux que moi.\nToutes mes vaches sont encore injustement corrompues par ce truc violet. C'est vraiment grave.
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello.response_1=Je suis désolé d'apprendre ça
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer=*En pleurant* Hé ! Désolé, tu me prends à un mauvais moment.\nMes vaches ont mal tourné. Elles font du mal aux villageois. Je peux pas les voir comme ça.\nJe veux pas leur faire du mal. Tu peux faire quelque chose ?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.what_happened=Qu'est-ce qui leur est arrivé ?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.ill_help=Je vais protéger les villageois
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.what_happened_followup=Je sais pas. Un jour elles broutaient tranquillement et puis le lendemain elles étaient infestées par ce truc violet. C'est comme une maladie, et ça les a toutes infectées. C'est tellement triste à voir.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.followup.response.accept=Je vais m'en occuper
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check=*En pleurant* J'espère que ça avance bien.\nComment ça se passe ? En fait, dis-moi pas. Je veux pas savoir.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check.response.on_it=J'y suis
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete=Oh mon dieu ! Merci tellement d'avoir fait ça. C'est tellement horrible. Qu'est-ce qui leur a pris. C'est tellement injuste.\n*Continue de pleurer*\nMes pauvres vaches.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_1=S'il te plaît ne pleure pas
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_2=Avec plaisir n'importe quand


skyblock_hub_dialogues.panorama.skyblock=Skyblock
skyblock_hub_dialogues.panorama.by_cubecraft=par CubeCraft
skyblock_hub_dialogues.panorama.complete_quests=Complète des Quêtes
skyblock_hub_dialogues.panorama.explore=Explore
skyblock_hub_dialogues.panorama.and_upgrade=Et Améliore-toi
skyblock_hub_dialogues.panorama.your_adventure=Ton Aventure Commence Maintenant !
skyblock_hub_dialogues.panorama.speak_to_helper=Parle au Villageois pour voir tes Quêtes initiales

# Grot & Nira - A Bolt of Hope
skyblock_hub_dialogues.npc_name.grot=Grot
skyblock_hub_dialogues.npc_name.nira=Nira
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro=Toi. Stop. J'ai besoin de ton aide.\nCe cochon à côté de moi. C'est ma femme. Nira. La pourriture violette a traversé notre section et elle a changé. Elle est toujours là. Je le sais. Elle donne des petits coups de nez contre ma jambe chaque matin, comme toujours.\nOn m'a dit que la foudre peut briser la pourriture. Trouve-moi un paratonnerre. Je ferai le reste.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro.response.accept=Je vais te trouver un paratonnerre
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro=Elle est toujours là. Elle donne encore des petits coups de nez contre ma jambe chaque matin.\nSi t'as trouvé un paratonnerre, on va l'utiliser pour diriger une frappe de foudre droit sur elle.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro.response=Tiens, prends-le.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt=Quelque chose s'est passé. Elle a poussé un couinement.\nMais elle est encore un cochon. La charge n'était pas suffisante.\nJ'en ai besoin de plus. Beaucoup plus. On va créer la tempête de foudre la plus puissante que t'aies jamais vue.\nLes paratonnerres ne suffiront pas. Il va falloir utiliser des cristaux de glace et de la vapeur d'eau pour préparer la tempête du siècle.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_1=Je vais tout rassembler
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_2=Ça fait beaucoup de matériaux
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro=T'as tout ?\nNira me racontait des histoires sur les orages. Elle disait que l'eau gèle très haut dans des endroits comme le Snowy Taiga, là où l'air est épais et froid. Ensuite la vapeur d'eau monte et frappe la glace en altitude. Elles créent une énorme charge, jusqu'à ce que le ciel ne puisse plus la contenir et se fissure.\nSi on empile les paratonnerres pour la focaliser, et qu'on utilise la glace et l'eau pour construire la charge, on peut attirer quelque chose de plus puissant que n'importe quel éclair naturel. Quelque chose d'assez fort pour briser la pourriture.\nEspérons qu'on ne fasse pas fondre tout le Nether.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro.response=Voici tes ingrédients de tempête
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete=NIRA !\nRegarde-la. Elle est de retour !\nJe n'ai pas les mots pour ça. Tu m'as rendu ma femme.\nMerci. Je le pense vraiment.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_1=Elle mérite d'être chez elle
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_2=Content d'avoir pu aider
skyblock_hub_dialogues.nether.piglin_colony.grot.hello=Nira reprend encore ses marques. Elle était cochon depuis longtemps. Mais elle est de nouveau elle-même. Je sais pas ce que j'aurais fait sans toi.
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_1=Elle a de la chance de t'avoir
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_2=Prends bien soin d'elle
skyblock_hub_dialogues.nether.piglin_colony.nira.hello=Je me souviens de tout, même en tant que cochon, j'entendais la voix de Grot chaque jour. Il ne m'a jamais quittée. Il était tellement doux avec moi.\nÇa va certainement me prendre du temps pour me réadapter à la vie sur deux jambes.
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_1=C'est bon de t'avoir de retour
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_2=Tu as beaucoup de chance
skyblock_hub_dialogues.nether.piglin_colony.nira_pig.hello=Groin.
skyblock_hub_dialogues.laptop.name=SDP Laptop
skyblock_hub_dialogues.laptop.laptop_1=Bonjour à toute l'équipe SDP,\n\nJ'espère que vous recevrez tous ce message en temps voulu.\n\nTout d'abord, je tiens à fêter le 100e anniversaire de Dorothy ! J'espère que tu vas bien, Dorothy.\n\nDeuxièmement, je voudrais rappeler à tous ceux qui travaillent ici que la vigilance au travail est extrêmement importante. Ce que nous faisons est une question de vie ou de mort et il est primordial que vous restiez concentrés sur votre travail. Rester assis à jouer à des jeux sur votre téléphone ne compte pas comme du travail. Je ne veux pas avoir à commencer à citer des noms, Rob.\n\nKen\nRessources humaines\nProgramme de défense Skyblock
skyblock_hub_dialogues.laptop.laptop_2=Bouclier SDP\nNom : Skyblock 2.0\nLimite de charge recommandée : Helios - 20 km\nÉtat : HORS LIGNE\nErreur : Puissance insuffisante
skyblock_hub_dialogues.laptop.laptop_3=À Ivy,\n\nFélicitations pour l'obtention de ton diplôme en Découverte et prévention d'Hélios. Au sein du SDP, nous admirons tes notes exceptionnelles et serions ravis de t'offrir l'opportunité de travailler avec nous. Tes compétences seraient inestimables si tu choisissais de nous rejoindre, et tu aurais ainsi l'occasion de sauver de nombreuses vies.\n\nLes postes disponibles au sein du SDP sont limités. Si cette offre vous intéresse, veuillez répondre dès que possible afin que nous puissions entamer les discussions sur le salaire.\n\nEsme\nRecrutement\nSkyblock Defence Program
skyblock_hub_dialogues.laptop.laptop_4=Euh, Rafael,\n\nTu as vu les résultats de laboratoire hier au boulot ? Pourquoi personne n'en parle ? Les mesures d'Helios étaient différentes. On dirait presque qu'ils ont investi tellement d'argent dans la mise à niveau de la technologie, et maintenant qu'ils ont leurs réponses, ils ont trop peur d'agir en conséquence.\n\nÀ quoi avons-nous affaire ? Je croyais qu'il s'agissait de prévenir les impacts de météores, mais j'ai l'impression que ce ne sont plus des météores. QU'EST-CE QUE C'EST ?! QUELLES SONT CES CHOSES QUI VOLENT VERS NOUS ? EST-CE QU'ON VA BIEN ?
skyblock_hub_dialogues.laptop.laptop_5=Rapport : les 5 prochains Hélios en approche\n\n- Helios A5B - Taille : 49 m - Menace : faible\n- Helios X9V - Taille : 952 m - Menace : moyenne\n- Helios F45 - Taille : 67 m - Menace : faible (et Ken)\n- Helios R2A - Taille : 604 m - Menace : moyenne\n- Helios 94H - Taille : 523 km - Menace : CRITIQUE
skyblock_hub_dialogues.laptop.laptop_6=Bonjour à toute l'équipe,\n\nJe comprends que la nouvelle concernant Helios 94H puisse faire peur. Je sais que nous n'avons jamais eu affaire à un Helios de cette taille auparavant, mais il est important de savoir que c'est précisément pour cela que le SDP a été créé. Bloquer des corps célestes dans le ciel, c'est ce que nous faisons de mieux.\n\nIl n'y a rien à craindre. L'équipe de recherche et développement vient de réaliser une avancée majeure dans ce domaine. Fière de cette bonne nouvelle, je suis fière de vous annoncer la dernière version de Skyblock. Skyblock 3.0 sera capable de bloquer des corps célestes d'un diamètre supérieur à 500 km. Il s'agit d'une avancée technologique sans précédent. Je suis très fière du chemin parcouru par notre équipe.\n\nAu plaisir de vous voir tous au travail demain,\n\nHelen\nPDG\nSkyblock Defence Program
