skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.hello=静かにして。ここは声が響きやすいですから。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.locked=今はダメ。村は今地盤沈下で混乱しています。状況が落ち着いてからまた来てください。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available=Cobblestone Mineに行くのか？よかった。私はそこにいるクモが大嫌いなんだ。石の粉塵は平気だけど8本の足がブーツにまとわりつくのは耐えられないよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.whats_changed=何が変わったの？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.what_you_need=私に何をして欲しいの？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.whats_changed=彼らは以前よりも大胆になって昔のように暗闇に隠れていない。そして巣の一部にはかすかに色がついている。それらはおそらくなんでもないだろう。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need=Cobblestone Mineを5回クリアしてください。1回ではなく5回です。私はクモが増殖しているのか移動しているのかそれとも追い出されているのかを知る必要がある。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.on_it=わかった。やってみるね。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.five_times=5回というのは多いように思うよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.why_five=一度クリアすると奴らは隠れる。二度クリアすると移動する。何度か繰り返すうちにパターンが見えてくはずだ。クモの巣の量や位置。それらは注意深く観察している時だけ気づくような類のことでしょう。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress=5回クリアまでまだ何回か残っている。慣れたからって調子に乗らないようにするんだ。包帯グルグル巻きにならないようにな。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress.response.working=今取り組んでるよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete=よくやったよ。5回クリアして無事に帰ってこれた。入り口も良くなってきたしクモの巣なども減ったし石の上を滑る虫も減った。
skyblock_hub_dialogues.npc_name.forge_miners_light=Durgan
skyblock_hub_dialogues.npc_name.forge_fast_sell=Togunda
skyblock_hub_dialogues.npc_name.forge_toughened_armour=Lucildara
skyblock_hub_dialogues.npc_name.traveller=Traveller
skyblock_hub_dialogues.npc_name.dimension_balloon=Dimension Balloon
skyblock_hub_dialogues.npc_name.to_overworld=オーバーワールド
skyblock_hub_dialogues.npc_name.to_nether=ネザー
skyblock_hub_dialogues.wurg.cannot_cross=グルルル！ワシは不機嫌なWurgだ！我々Wurg族は橋を守り、資格のない者が渡るのを阻止することを誓っている！もっと発見をしてから、また来るんだな！
skyblock_hub_dialogues.wurg.back_to_work_response=仕事に戻る時間だ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat=おや、まだ立っていられるじゃないか！いい兆候だね。もう村人たちには会ったかい？みんなおしゃべりが大好きなんだ！\n少し迷ってしまったかな？心配はいらないよ！クエストは<cc:header>Skyblock メニュー</cc:header>に保存されているよ。もしくは”/skyblock quests”とチャット欄に入力してね！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_1=情報をありがとう！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_2=うん、村人たちはとても親切だね！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.introduce=やあ！Oakridgeの村へようこそ！\nおっと、失礼！自己紹介を忘れていたよ！\n僕の名前はCubit！ここOakridgeで村の案内役をしているんだ！\nさあ、ついてきて！村の中心を案内して、村人たちを紹介するよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_enchanter=こちらがEnchanterだよ！\n不思議な魔法の力で、アイテムにエンチャントを施して、アイテムを強力にしてくれるんだ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_portal=そして、ここが最初のポータルだよ…\nいつでもこのポータルを使って帰ることができるよ。あるいは、インベントリにある便利なメニューから戻ることもできるんだ。\n今回の案内はここまで！でも心配しないで。Oakridgeにはまだまだ探索できる場所がたくさんあるよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_repairer=こちらがRepairerだよ！\nどんなものでも修理してくれるんだ！たとえ何かにかじられたものでもね…\n例えば、ウサギとかそんな感じのものでもね…
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_shops=ああ、僕のお気に入りの場所……ショップだよ！\nここには必要なものはもちろん、自分でも必要だと気づいていなかったものまで、何でも揃っているんだ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce=やあ！また会ったね！\nForgeまで案内したほうがよさそうだね！ここはSkyblockの世界で、強力なツールや防具の強化ができる唯一の場所なんだ。\n少し見つけにくいかもしれないから、さっそく出発しよう！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_1=わかった、行こう！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_2=待ちきれないよ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge=Forgeへようこそ！この巨大な建物は、まさに強化のための施設だよ！\nこの場所は、何かに取り憑かれたかのような人々によって建てられ、魔法の力を宿していると言われているんだ。\n世界各地で見つかるルーンは、ここで本来の力を引き出すことができるよ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_1=うわぁ、なんだか怖そうだね！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_2=強力なアイテムを作るのが待ちきれないよ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello=Forgeでの調子はどう？何かすごいものは作れたかい？\nRuneが必要なら、ダンジョンが集めるのに最適な場所だと思うよ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_1=うん、順調だよ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_2=まだいいものは何も作れていないよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.introduce=やあ！私はCassandra！農家をしているの！この辺りでは一番の農家だと言う人もいるわ！\n競争相手なんて、私には<italic>敵わない</italic>って言う人もいるわね！\n\nビートルート農家だから、ビートルートの種をたくさん持っているの！お得に手に入れたいときは、いつでも私のところに来てね！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.response=会えて嬉しいよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.chat=やあ、調子はどう？\nお得なビートルートの種はいかが？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.introduce=えっと…Leviだよ。\n君、この辺りの人じゃないよね？\nみんな僕のことを知っているよ。仕事中にいつも居眠りしている人としてね。もっとみんなの役に立てるようにスキルを磨いているんだけど、まだまだなんだ。\n君も努力を続ければ、僕くらい有名になれるよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_1=いつも寝ているわけじゃないといいけど…
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_2=なんだか厄介そうな人だね
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.hello=やあ、調子はどう？\n今は休むのに忙しいんだ。また別の機会に来てくれる？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.introduce=うそでしょ！！新しい人だ！！\n君、新人だよね？会えるのをずっと楽しみにしてたんだ！何でもいいから話を聞かせて！\n元気？ケーキがあるんだけど、食べる？\nもう、誰か止めてよ！このままだとずっとしゃべり続けちゃう！\nみんなには会った？ショップは見た？鉱山はどう？\nわあああ！！地面から紫色の変なものがいっぱい生えてるんだけど、あの話聞いた！？\n待って……もうやめるね
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_1=まあまあ、落ち着いて！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_2=私たち、気が合いそうだね
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_3=君、ちょっと騒がしいね
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello=また私に話しかけに来てくれたんだね！光栄だよ。\n元気にしてる？またケーキを作ったんだ。私、ケーキが大好きなの。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello.response_1=私もケーキが大好きだよ
skyblock_hub_dialogues.response.show_me_around=うん、案内して！
skyblock_hub_dialogues.response.show_me_more=うん、もっと案内して！
skyblock_hub_dialogues.response.show_me_what_youve_got=うん、見せてみて！
skyblock_hub_dialogues.response.thanks_for_help=ありがとう！
skyblock_hub_dialogues.response.yeah_sure=うん、いいよ！
skyblock_hub_dialogues.response.lets_go=準備万端だよ！
skyblock_hub_dialogues.response.ill_pass=また今度にするよ…
skyblock_hub_dialogues.response.yeah_ill_help=うん、手伝うよ！
skyblock_hub_dialogues.response.not_right_now=今はやめておくよ
skyblock_hub_dialogues.response.okay=わかった。
skyblock_hub_dialogues.response.yes=はい。
skyblock_hub_dialogues.response.tell_me_more=もっと詳しく教えて。
skyblock_hub_dialogues.response.i_should_go=そろそろ行くね。
skyblock_hub_dialogues.response.fair_enough=結構です。
skyblock_hub_dialogues.response.yikes=うわっ。
skyblock_hub_dialogues.response.good_luck=幸運を祈るよ。
skyblock_hub_dialogues.response.interesting=興味深いね。
skyblock_hub_dialogues.response.laugh=ハハハ！
skyblock_hub_dialogues.response.ill_leave_you_to_it=あとは任せるよ。
skyblock_hub_dialogues.response.will_do=そうするよ！
skyblock_hub_dialogues.response.ellipsis=...
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.introduce=ああ、なんてこと！大切なふわふわちゃんたちが、また鍵をすり抜けて逃げ出してしまったの！さっきまで小屋の近くでぴょんぴょん跳ねていたのに、今は森の中に消えてしまったわ！お願い、あの子たちを探して連れ戻してくれないかしら？お礼はたっぷり払うわ。お願いだから、あの子たちを家に連れ戻して！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.response=ウサギたちを捕まえに行こう！Aurora、心配しないで！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.hows_it_going=調子はどう？うちの脱走名人たちの手がかりは見つかったかしら？\nあのウサギたち、何か企んでいるに違いないわ…おやつを盗む程度ならいいけれど、まさか本格的な反乱を起こそうとしているんじゃないでしょうね！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks=ああ、本当によかった！助けてくれて本当にありがとう……あなたがいなかったら、あの子たちを見つけられなかったわ！\nあなたの優しさと勇敢さをOakridgeのみんなに伝えておくわね！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks.response=力になれてよかったよ！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.hello=やあ！うちのいたずらっ子たちを助けてくれたこと、本当に感謝しているわ！
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro=ひえっ！近寄らないで！……あ、こんにちは！\nウサギって、その……動きが素早すぎて苦手なんだ。恐ろしいよ！\nこの食料をAuroraに届けてくれないかな？ニンジン、ビートルート、小麦を詰めておいたんだ。これであの子たちのお腹を満たしてあげられるはずだよ。
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_1=もちろん！配達なら任せて！
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_2=どうして怖がるの？ただのふわふわした小さなウサギじゃないか！
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress=やあ！あの恐ろしい生き物たちに、もう餌をあげたかい？まだお腹を空かせているのかな？
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress.response=今、取り組んでるところだよ。
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete=君は最高だよ！本当に、ウサギって小さな怪物が化けているだけなんじゃないかな。\nAuroraには、いつかウサギたちに会いに行くよう勧められているんだ……君が守ってくれるなら、行ってみてもいいかな！
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete.response=いつでもどうぞ！ウサギ対策のボディーガードになってあげるよ。
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello=やあ、調子はどう？僕は森で一番の動物用飼料の供給業者なんだ。まあ、動物たちにあまり近づきたくないからなんだけどね！
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello.response_1=それはよかった！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro=あら！これがBobが集めてくれたニンジンね。ちょっと臆病だけど、本当に優しい人なのよ。こちらに渡してくれる？
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro.response.yes=はい、どうぞ！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks=完璧よ！本当にありがとう。Bobに、いつでも遊びに来ていいと伝えておいてね。ウサギたちが餌を食べているところを見れば、ただのふわふわした小さな友達だって分かるかもしれないわ。
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks.response=彼に伝えておくよ。
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro=あら、Bobがおやつを届けてくれたの？なんて親切なの！\n今はほかのウサギたちの世話で手が離せないの。代わりに、この子たちに直接餌をあげてくれる？\nBobには、いつでも遊びに来ていいと伝えておいてね！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro.response=もちろん、任せて！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.catch=<italic>*ぴょんぴょん*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.response=終わったよ！楽勝だったね。
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.intro=このウサギは鼻をひくひくさせている。ニンジンを欲しがっているようだ！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.thanks=ウサギは嬉しそうにニンジンを頬張っている。
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.catch=<italic>*キュッ！*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.response=おいで、小さな子！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.intro=このウサギはビートルートを欲しがっているようだ。袋をじっと見つめている！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.thanks=ウサギはビートルートをおいしそうに食べているね。
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.catch=<italic>*もぐもぐ*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.response=さあ、小屋に戻ろう！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.intro=このウサギは小麦をじっと待っている！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.thanks=ウサギは満足そうに小麦をかじっている。
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.hello=<italic>*鼻をひくひくさせる*</italic>
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.intro=おい、そこの君！ちょっとこっちに来てくれ。\n昨夜……壁が激しく揺れてな。そのせいで、この辺りの家はどれも不安定になってしまった……。\n当然、その修理をするのは俺の仕事になったわけだ……。\nだが、君にも手伝ってもらうことにしよう。\nオークの原木と丸石を集めてきてくれ。それが済んだら、また話そう。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going=また君か。\n必要な資材はもう集まったか？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.yes=うん！資材を持ってきたよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.no=ごめん、まだだよ。引き続き集めてくるね :(
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks=おお、本当に集めてきたのか。\n……感心したよ。\nまあ、ありがとう。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks.response.enjoy=その資材が役に立つといいな！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well=昨夜から地震は起きていない。このまま何事もないといいんだが。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well.response.glad_to_hear=うまくいっているようでよかったよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro=そこの君。この世界にある、とても強力なものを紹介してやろう……\nそれはShrineだ。そう、Shrineが求めているアイテムを大量に捧げれば、その見返りに素晴らしい報酬が手に入る。\nこの土地を歩き回って、すべてのShrineを探してみるんだ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_1=さっそく行ってくるよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_2=歩き回りながら探してみるよ、ありがとう！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going=もう全部見つけたかい？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_1=まだ探しているところだよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_2=全部見つけられるように頑張っているよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello=やあ！調子はどう？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello.response_1=また会えて嬉しいよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello=やあ。俺はGusだ。確かこの辺りのどこかにメガネを置き忘れた気がするんだ。\nもう少し探してみることにするよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_1=頑張って。見つかるといいね！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_2=まさかそんな展開になるとは思わなかっただろうね…
skyblock_hub_dialogues.overworld.oak_forest.cobblestone_mine.dungeon_guard.introduce=ほんの少し前まで、ここは平和で活気のある鉱山だったんだ……。\nあのクモたちがやって来るまでは。\nOakridge Guardは、あんな襲撃に備えられていなかった。\n敵に圧倒され、撤退せざるを得なかったんだ。\n今では鉱山はクモやほかの魔物に占拠されてしまっている。\nどうか、奴らを一掃するのを手伝ってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.ella.flower_shop=こんにちは！私はここPumpkingdomにあるお花屋さんの店主よ！\nお花はいかがかしら？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.dungeon_guard.introduce=ゾンビがあまりにも多かった。今でもあの光景が頭から離れない！\nどうやって生き延びられたのか分からない。私にできることは、もう何もなかったんだ。\n君ならもっと上手くやれただろうか？助けることができたと思うか？もし君があの場にいたら、結果は変わっていただろうか？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce=あら！こんにちは！あなた、園芸の才能がありそうね！最近、土がずいぶん落ち着かない様子なの。きっと鮮やかな色で元気づけてあげる必要があるんだと思うわ。お花を集めるのを手伝ってくれない？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_1=わあ、お花！ぜひ手伝いたいよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_2=今は忙しくて、お花を集める時間がないんだ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker=待って、待って！ただ引き抜けばいいってわけじゃないの。根はとても繊細なんだから！行動する前に、あのお店に寄って花摘み道具を買ってきてね。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker.response_1=分かった、買ってくるよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go=よし、ちゃんと手に入れたわね！見て、その輝き！さあ、集中するのよ、私…集中…それじゃ、お花を摘みに行きましょう！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go.response_1=やった！お花だ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions=見て、このタンポポ！小さな太陽のかけらみたいね。道具を使ってタンポポをいくつか採取して、私のところに持ってきてちょうだい！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_1=タンポポを持ってきたよ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_2=あっ、ちょっと取りに行ってくるね！少し気を取られちゃってた。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_dandelions=集中して！大地を傷つけないように、必ず道具を使ってタンポポを採取してね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys=今の聞こえた？地面が少し……バリバリした気がするわ。ポピーを探しに行きましょう。その鮮やかな赤色は、遺跡にぴったりなの。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_1=うん、探しに行こう！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_2=どうしてもって言うなら…
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys=急いで、急いで！道具を使ってポピーをいくつか採取して、私のところに持ってきてね！ポピーはこの土地にたくさんの恵みをもたらしてくれるの。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_1=ポピーを持ってきたよ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_2=あっ、ちょっと取りに行ってくるね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_poppys=ポピーよ！必ず道具を使って採取してね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys=わあ！ボタンを探しに行きましょう。土をふんわり包み込む毛布みたいなお花なの！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_1=うん、探しに行こう！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_2=分かったよ…
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys=なんて見事なお花なのかしら！道具を使ってボタンをいくつか採取して、私のところに持ってきてね！これで花の絆創膏が完成するわ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_1=ボタンを持ってきたよ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_2=あっ、ちょっと取りに行ってくるね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_peonys=忘れないで、必ず道具を使ってボタンを採取してね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home=あら！カゴが花でいっぱいになっちゃった！それに、足も少しピリピリしてきたわ…もう十分ね。家に帰りましょう。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_1=うん、帰ろう！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_2=歩き回りすぎて足が痛いよ :(
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up=楽しかったわね！もう地面が少し落ち着いたように感じない？またいつか一緒にやりましょう。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_1=うん、私も楽しかったよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_2=まあ、悪くはなかったかな。花はあまり好きじゃないんだけどね。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello=やあ、調子はどう？花のように元気で、新芽たちを手伝う準備ができているといいな！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello.response_1=君も同じように元気だといいね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.cedric.hello=焦げ臭いにおいがするなら、顔を火に近づけすぎている可能性が高いぞ。このジャガイモはまだ生だからな。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello=静かに話してくれ。カカシたちに聞かれているんだ。……いや、もしかしたら俺がおかしくなってきただけかもしれない。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello.response_1=幸運を呼ぶカボチャのお守りはいらないかい？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.detail_1=いや、絶対にいらない。\n幸運のお守りを持っていて効果がなかったら、不運のお守りの存在まで信じなきゃいけなくなるからな。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello=ようこそ、旅人さん。ここはPumpkingdomです。世界的に有名なカボチャの産地なんですよ。\n何かお手伝いできることはありますか？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_1=何か歌ってよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_2=どうしてPumpkingdomっていう名前なの？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_3=ちょっと通りかかっただけだよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.verse_1=ああ、カボチャ、カボチャ、鮮やかなオレンジ色！\n不気味な夜が来るのを待っている。\nおどけた笑顔も、怖い顔も、\nこの場所で一番かわいいカボチャさ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.detail_1=Pumpkin Villageなんて名前にしたら、襲撃してくださいと言っているようなものだからね。\nそれに、初代町長が彫刻刀でこの名前を宣言したんだ。誰もその刃物に逆らおうとはしなかったよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.maeve.hello=こんにちは！私はMaeve。本が好きで、読書も好きなの。本からはたくさんのことを学べるわ。\nただし、読むことは別ね。本を読むことで読み方を学べるかどうか、何人かで試してみたけれど、今のところ誰もうまくいっていないの。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.quinn.hello=レバーには触らないでくれ。\nいや、やっぱり触ってもいいぞ。そっとな。\n実はあれが何をするものなのか、さっぱり分からないんだ。だから、もし爆発しても……私のせいにしないでくれよ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello=カボチャを買いに来たなら、左の道へ進んでくれ。\nくだらないジョークを聞きに来たなら、おめでとう。もう道に迷っているよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_1=くだらないジョークを聞かせてよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_2=あとは任せたよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1=壊れたカボチャはどうやって直す？\nカボチャ畑でね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1.response_1=本当にひどいジョークだったよ。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce=おい、ちょっと聞いてくれ！君はシャベルや剣を扱えそうな人に見えるな。\n実はここでちょっとした問題が起きているんだ…ゾンビたちが俺の畑に押し寄せてきている。\n作物を踏み荒らし、柵をかじり、挙げ句の果てには俺のジャガイモまで食べているんだ！\n手を貸して、作物を守ってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response1=もちろん！ゾンビが何体かいたって怖くないよ。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response2=そこまで言うなら、手伝ってもいいけど……
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane=見事な仕事ぶりだったぞ、相棒！\nもし時間があるなら……俺の友人のSusaneを訪ねてくれないか？\n彼女のカボチャ畑の周りにクモが現れて、少し困っているようなんだ。\n彼女を見つけて、手を貸してやってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response1=了解！クモたちを退治しよう！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response2=君のカボチャは私が守るよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks=すごいな、あのモンスターたちに誰がボスなのか思い知らせてやったな！\nあれだけの数を倒すなんて信じられないよ。\nこのまま二度と戻ってこなければいいんだが…でも、少なくとも君のおかげで状況は大きく改善したよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks.response=いつでもどうぞ！人助けならお任せあれ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hows_it_going=その後、状況はどうだ？\nあの化け物たちが、あっという間にこの場所を占拠してしまうなんて信じられるか？\nまったく、ついてないよ…
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hello=ちょっとした秘密を知りたくないか？\n実は俺の本名はFredじゃないんだ。\n一度ジャガイモの山に埋もれて抜け出せなくなったことがあって、それ以来みんなにPotato Fredと呼ばれるようになったんだ。\n今でも、どうやってあそこから抜け出せたのか分からないよ…
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.see_fred=やあ！\n成長が早いのはカボチャだけじゃないんだ。害虫たちもどんどん増えているよ！\n私の相棒、Potato Fredが君の助けを必要としているんだ。\n彼の様子を見に行ってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred=うわあああ！\nクモだ！そこら中クモだらけだ！\nあいつらが私のカボチャを台無しにしているんだ！\n頼む、クモたちを追い払うのを手伝ってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response1=ひゃあっ、クモだ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response2=もちろん、クモなんて怖くないよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders=もうクモたちは退治してくれた？\nまだ残っているなら、怖くて戻れないよ……
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders.response=まだ少し残っているよ…
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.hello=ああ、カボチャが元気に育っている姿を見るのは最高だね……。\nあの厄介なクモたちは、いつも何もかも台無しにしようとするんだ！\n今度こそ、もう二度と近寄ってこないことを願おう……
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce=そこの君！正義感がありそうな人だね！実は、いたずら好きの小さな子が私の自慢のカボチャを「作品作り」のために盗んで、あちこち走り回っているんだ。\nそいつを見つけて、きちんと、でも公平にお説教してやらないとね！\n犯人を捕まえるのを手伝ってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_1=そのいたずらっ子を追いかけて捕まえてくるよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_2=分かった、この件の真相を突き止めるのを手伝うよ。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going=あの子と盗まれたカボチャは見つかったかい？私のカボチャはお祭り用なんだ。的当ての練習に使うものじゃないよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going.response=まだ捜索中だよ、Susane！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete=あそこにいたよ！このいたずらっ子め！……待って、ちょっと待って。これって彫刻したカボチャなのかい？なんて見事な出来栄えなんだ……。台無しにしたどころか、むしろ素晴らしく仕上げてくれたんだね！わあ、本当にすごいよ。あの子と作品を私のところまで連れてきてくれてありがとう。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete.response=誤解が解けてよかったよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce=Susaneに畑まで連れ戻すよう頼まれたの？そんな……彼女、きっとすごく怒るよ！\nお願い、まだ彼女のところへ連れて行かないで！僕は泥棒じゃない、芸術家なんだ！\nそうだ、彼女に仲直りの贈り物を持っていけば……僕の彫刻刀を探すのを手伝ってくれない？それがあれば、彼女の考えを変えられるような作品を作ってみせるよ。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_1=彫刻刀を探してくるよ。どんな作品を作るのか見せてもらおうじゃないか。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_2=分かった、探してくるよ。これ以上騒ぎを起こさないでね。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint=いい作品を作るための題材を探していたとき、最後に使ったのはメインのカボチャ畑の近くだったよ。きっとその辺りのどこかにあるはず！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint.response=任せて。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife=見つけてくれたんだね！本当に助かったよ。さっそく取りかかるよ。彼女がなくなったカボチャのことなんて忘れちゃうくらい、傑作を彫ってみせる！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife.response=さあ、やってみよう。うまくいくといいね！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.hello=今日は作業に集中してるんだ。集中力が必要だからね。わかるでしょ？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.knife.dont_know=こんなナイフがその辺に放置されているなんて、妙な話だな。柄にはKippと刻まれている。Kippに返してあげたほうがよさそうだ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.hello=聞こえるかい？おいしい料理ができあがる音だよ。Pumpkingdomのみんなもきっと喜んでくれるはずさ。\n君がたくさん手伝ってくれて、本当にありがとう！
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available=夕食の匂いがするなら、まだ何とかやれている証拠さ。ギリギリだけどね。石炭置き場は空っぽだし、かまどもいくつも壊れてしまった。このままじゃPlains中の人たちが生のジャガイモをかじる羽目になる。そうなる前に、手を貸してくれないか。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.help=手伝うよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.plan=どうすればいい？
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.breaking=どうしてかまどが壊れているの？
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.why_furnaces_break=温度変化に、不注意な扱い、それにちょっとした不運さ。さっきまで何ともなかったのに、次の瞬間にはひび割れて、灰を吹き出しているんだ。かまどが1つ壊れたくらいなら何とかなる。でも、調理場全体が使えなくなったらお手上げさ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted=助かるよ。必要なものは3つある。しかも、すぐに必要なんだ。火力を安定させるための石炭、壊れたものと交換するためのかまど、それから、食べられるものを作って提供するためのジャガイモだ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted.response.all=全部持ってくるよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items=ちょっと目を離すたびに、誰かがかまどを「点検」して、扉を開けっぱなしにしていくんだ。石炭とかまどとジャガイモを持ってきてくれれば、この大混乱を夕食に変えてみせるよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.deposit=必要なものを持ってきたよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.working=今取りかかっているところだよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.deposit_thanks=よし。石炭は石炭置き場に、かまどは所定の場所に入れてくれ。引き続き頼むよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage=これで全部そろったよ。火も戻ったし、料理の提供も再開できた。これでしばらくはPlainsのみんなも、ちゃんと火の通った料理を食べられるね。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.glad=力になれてよかったよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.save=いつか一緒に何か料理を作ろうよ！
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available=遺跡はただの景色じゃない。移動ルートなんだ。\n遺跡の中でスキルを磨いてみるといい。移動能力を大幅に向上させられるかもしれない。\nさっき遺跡の中で遊んでいるのを見かけたRobbのところまで行ってみてくれ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.accept=分かった。あの足場まで行ってみるよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.tips=始める前に何かアドバイスはある？
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.later=今はやめておくよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips=ジャンプする前に、次に着地する場所を決めておくんだ。\n焦らずゆっくり進めばいい。上を目指すのに急ぐ必要はないよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips.response.okay=分かったよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete=まだ下にいるのか？ それなら、まだ遺跡の頂上には到達していないようだね。\n上を見て、焦らず進むんだ。いつか必ず遺跡の頂上にたどり着けるよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.remind=Robbがどこにいるのか、もう一度教えて。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.go=分かった。上を目指して進むよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location=おそらく頂上付近にいるはずだ。遺跡を上っていくうちに、彼を見失ってしまってね。\nRobbの笑い声が聞こえたら、もうすぐそこだよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location.response.on_my_way=今から向かうよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete=無事に戻ってきたようだね。よくやった。\nRobbは大人しくしていたかい？ 彼も無事だったか？ あの場所では自信過剰になることがあるけれど、彼のことは信頼しているよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.remember=うん、彼は無事だったよ
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.after_completion=これからは壊れた石造りを見かけたら、ルート、身を隠す場所、逃げ道を考えるんだ。\nこの辺りではゾンビがますます増えているから、とても役に立つアドバイスだよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached=ははっ！本当にここまで来るなんて信じられないよ！！！\n頂上へようこそ！ここからは見どころがたくさんあるんだ。遺跡で遊ぶのって、なかなか楽しいだろ？\nここに来る途中、君が落ちるところを見てたよ。みんながここまで登ろうとして失敗するのを見るのって、すごく面白いんだ。\nLewisはまた堅苦しいことを言ってた？ もしかして、僕に帰ってきてほしいのかな。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.rough=すごく楽しかったよ！
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.easy=Lewisは君の身のこなしに感心しているよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.trick=自分でもここまで来られたなんて信じられないよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough=本当に楽しいよ！ ははは！ この景色を見てよ。ゆっくり眺めて、満喫していってね。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough.response.laugh=ははっ！うん、そうだね！よく分かるよ！
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy=そうだろうね。僕は移動がすごく速いからね。ここを走り回ることなら、誰にも負けないよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy.response.okay=あまり調子に乗らないでね。危ないよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick=練習を重ねれば上達するよ。これから遺跡の高い場所にも、もっと自信を持って登れるようになるさ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick.response.got_it=分かったよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.hello=やっほーー！パルクールの練習はどう？ きっと上達してきてるよね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.hello=やあ、元気にしてるかい？ まだ生きてる？ それはよかった！ Billyを見つけてくれてありがとう。あの子はかわいいから助かったね。そうじゃなかったら、床に敷くラグにしていたところだよ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction=大変だ！ まさに大惨事だよ！ うちの猫、Billyがまた行方不明になっちゃったんだ。どうやら僕たちの頭上のどこかにいるらしい。世界征服を企んでいるのか、それとも鳥を追い回そうとしているだけなのか。あの子がずっと樹冠に住み着いてしまう前に、連れ戻すのを手伝ってくれないか？
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_1=それは大変だね！ すぐに連れ戻してくるよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_2=ツタが落ちてくるのを避けるのに忙しくなくなったら、探してみるよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_3=今は本当に忙しいんだ。今日はジャングルが大変なことになっていてね！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks=BILLY！ ああ、なんてありがたいんだ！ 本当に見つけてくれるなんて信じられないよ！ あの子はいつもお腹を空かせていて、まるで胃袋にブラックホールでもあるみたいなんだ。ジャングルの床板まで食べ始める前に、魚をあげてくるよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_1=気にしないで。僕は猫の扱いならプロだからね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_2=また魚？ あの猫、底なしの胃袋でも持ってるのかよ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking=調子はどうだい？ あの毛むくじゃらの逃亡者は見つかったかい？
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking.response=まだ探しているところだよ。猫はずる賢いし、Billyは忍者のプロだからね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found=ニャー <italic>(何もかもお見通しといった得意げな笑みでこちらを見つめている)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found.response=ほら、お騒がせな子猫ちゃん。お家に帰ろうね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1=ニャー <italic>(お腹が雷鳴のようにゴロゴロ鳴っている)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1.response=ほら、魚をあげるよ。唸るのはやめて！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2=ニャー <italic>(期待に満ちた目でこちらを見つめている)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2.response=ほら、もっと魚をあげるよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3=ニャー <italic>(まだお腹がゴロゴロ鳴っている！)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3.response=この猫、底なしの胃袋なの？ もう、分かったよ。ほら、魚だよ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4=ニャー <italic>(不満そうな様子)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4.response=これで4匹目の魚だよ。本当にもうBillyは…
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5=ニャー <italic>(ようやく満足した様子)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5.response=やっと満足したね！ さあ、お家に帰ろう。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction=釣り糸に伝わるかすかな引き、そして魚がかかったときのあの胸の高鳴り！ 私の釣り好きは有名なんだが、もう長いこと釣り糸を垂らせていなくてね。家族はここジャングルにいるし、世界中の海と引き換えにするつもりはない。でも、ああ、どれほど水辺が恋しいことか！ 君もぜひ一度やってみるといい。釣りはまさに魔法のような体験だよ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_1=分かった！ その話を聞いて、やってみたくなったよ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_2=本当にそんなに楽しいの？ まあ、一度試してみるよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_3=今は遠慮しておくよ、George。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch=釣りは楽しめているかい？ もうコツはつかめたかな？ 伝説級の大物が釣れているといいんだが！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch.response=今頑張っているところだよ、George！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit=魚が十分に釣れたら、詳しく調べたいから私に渡してくれ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit.response=はい、どうぞ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks=楽しいって言っただろう！ この見事な魚たちを見てごらん。君には本当に釣りの才能があるね！ この楽しさを一緒に味わわせてくれてありがとう。釣りは本当に最高だよ。友達と一緒なら、なおさらだね。私自身が湖まで行けなかったのが残念だよ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks.response=いつでもどうぞ、George！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.hello=こんにちは！ ジャングルにいても、水辺は最高だよ！ 釣り糸を垂らす準備はできているかい？ でも、もっと楽しくする方法があるんだ。\nそれは、こんなに仲のいい友達と一緒に魚を釣ることさ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.hello=こんにちは。チョコレートはジャングルで一番好きな食べ物かしら？ そうだと嬉しいわ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.come_back_for_sugar=こんにちは。砂糖を手に入れたら、また私のところに来てね。チョコレートを甘くする方法を教えてあげるわ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available=そこのあなた。チョコレートの作り方を学んでみない？ とってもおいしいチョコレートよ。体にはあまりよくないけれど、食べれば元気が湧いてくるかもしれないわ。\nまずは無糖チョコレートから始めましょう。砂糖を使わないチョコレートは、ずっと健康的な選択肢なのよ。\nレシピを渡すから、あとは自分で作ってみてね。できたら、どうだったか教えてちょうだい。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_1=おいしそう！ チョコレートだ！！！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_2=うわ、チョコレートは大嫌いなんだ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.in_progress_craft=チョコレート作りは順調かしら？ 無糖チョコレートが期待どおりの出来になっているといいわね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete=それで、どうだった？ 感想を聞かせてちょうだい。\n苦かったかしら？ 食べたあとに何か副作用はあった？\nチョコレートを食べると、あちこち走り回り始める人が多いのよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_1=苦かったけど、最高だったよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_2=水が欲しくなったよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available=また会ったわね。今度はチョコレートに砂糖を加える方法を学びたいのかしら？ さっそく始めましょう。\nやり方は分かっているわね。レシピを渡すから、あとは自分で作ってみてね。できたら、どうだったか教えてちょうだい。\n気をつけてね。チョコレートは健康に良いものではないから、必ず適量を食べるようにしてね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_1=うん、もっとチョコレートを作ろう。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_2=今は健康に気を使っているけど、まあいいよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft=チョコレートに砂糖を加える作業は順調かしら？ 気づけば、チョコレート帝国を築き上げているかもしれないわね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_1=任せて。こんなの簡単だよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_2=チョコレート作りはあまり得意じゃないんだ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete=やったわね！ チョコレートの完成よ。あなたが期待していたとおり、濃厚で甘い仕上がりになったわね。\nさあ、砂糖の摂りすぎで大はしゃぎして走り回ったりしないように、ほどほどにしておくのよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_1=心配しないで。チョコレートの扱いには慣れているから。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_2=砂糖の摂りすぎで、あとからひどい目に遭いそうだね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello=ちょっと待っててね。ここのカカオ豆の様子を確認しないと。そろそろ収穫できるかもしれないわ。\nあら、待って。この子たちはどうかしら…
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello.response_1=今はとても忙しそうだね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello=壊れたときに、ここの足場のいくつかを修理したんだ。自分の設計や施工が十分しっかりしていて、もう壊れずにいてくれるといいんだけど。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_1=これを全部作ったの？ すごいね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_2=今にも倒れそうな顔をしているね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1=ありがとう。まあ、全部じゃないけどね。壊れたところを見つけたら、ちょこちょこ修理しているだけさ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_1=手すりがずいぶん多いね。個人的なこだわりなの？
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_2=高いところが怖いんだ…
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_railings=そうなんだ。\n<italic>(両手で手すりをぎゅっと握る。)</italic>\n高所恐怖症だから、安全対策は念入りにしているんだ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_advice=からかわないでくれよ。好きでこうなったわけじゃないんだ。生まれつきなんだから。\nまあ、ここで手伝うことにしたのは自分の責任だけどね。地上で釣り人をしていたかったよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_2=今いる高さを見てよ！？ こんなに高いところにいるんだよ。僕は高所恐怖症なのに！ 高山病まで出てきたのかもしれない。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello=おい、そこの君。ひどいジョークを聞いていかないか？
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_1=いいよ。ジョークは一つだけね。思いっきりひどいやつを頼むよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_2=遠慮しておくよ。平穏が一番だからね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu=慎重に選びなよ。ジャングルにはたくさんの捕食者がいるけど、僕のオチほど容赦ないものはいないからね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_1=葉っぱにちなんだジョークを聞かせてよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_2=クモにちなんだジョークを聞かせてよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_3=分かった。カカオを面白くしてみてよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_1=ジャングルを出ようとしたんだけど、ツタに「ダメだ、ここにいろ」って言われちゃってね。\nどうやら、長い付き合い(リーフ・レイションシップ)になりそうだよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_2=新婚のクモ2匹のことを何て呼ぶ？\n新婚の巣(新婚夫婦)ってね！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_3=うちのカカオは食べごろになるのがいつも遅いんだ。だって、いつもチョコっと遅い(チョコレート・レイト)からね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.avaru.hello=やあ！ なんて素敵な日なんだ！ 会えて嬉しいよ！ またどこかで会えるのを楽しみにしているよ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cressida.hello=この木の大きさを見てよ！ ものすごく大きいね！ :O\nどうやってこんな高いところまで水を届けているんだろう！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello=ヤマネコを見かけても、追いかけちゃダメだよ。君のことをとても怖がっているからね。\nこの忠告は人間にも当てはまるよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello.response=できるだけ無関心そうな顔をする練習をしておくよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.silva.hello=やあ、見てよ！ 木の下にいるんだ！\n昔はこの木が怖かったんだけど、根っこに気づいてからは平気になったんだ。だって、根っこは立方体なんだよ。数学的に考えれば、この木は一次元ってことになる。だって、見ているのはこの木の立方根だからね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello=Oak Forestから来たばかりって感じだね。\nジャングルへようこそ、旅人さん。木の高いところまで登ることに慣れてもらわないとね。高いところが苦手じゃないといいけど。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_1=それはよかった。高いところは平気だよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_2=困ったな、うまくやっていけそうにないよ。
skyblock_hub_dialogues.misc.optimiser_not_unlocked=こんにちは！ 私はOptimiserだ！ 君が持つすべての資源の生産量を増やすことができるぞ。\n一緒に働く相手はかなり慎重に選んでいるんだ。もっと冒険を進めてから、また会いに来てくれ！
skyblock_hub_dialogues.forge.miners_light.greeting=暗闇が怖くなったことはあるか？ ああ、その気持ちはよく分かるぞ。わしの採掘者のライトルーンをヘルメットに付ければ、もう暗闇の中で手探りしながらツルハシを振るう必要はなくなるぞ。
skyblock_hub_dialogues.forge.miners_light.greeting.buy=どんなものがあるのか見せてもらおう。
skyblock_hub_dialogues.forge.miners_light.greeting.nothing=今のところは、暗闇の中でも頑張ってみるよ。
skyblock_hub_dialogues.forge.fast_sell.greeting=君は仕事ができそうな人だな。何かを大量に作りすぎて、それを引き取ってもらうために誰かのところまで運ぶのさえ面倒になったことはないか？
skyblock_hub_dialogues.forge.fast_sell.greeting.buy=商談といこうじゃないか。
skyblock_hub_dialogues.forge.fast_sell.greeting.nothing=自分で運び続けることにするよ。
skyblock_hub_dialogues.forge.toughened_armour.greeting=この辺りで使われている防具の製造技術には、まだ改良の余地があると思っている。防具がすり減る問題を解決する方法を、ついに完成させたんだ。
skyblock_hub_dialogues.forge.toughened_armour.greeting.buy=もっと詳しく聞かせてくれ…
skyblock_hub_dialogues.forge.toughened_armour.greeting.nothing=今の防具で十分頑丈だからね。
skyblock_hub_dialogues.shop.blocks.greeting=やあ！ うちより良いブロックを売っている店は、ほかにはないよ！ ちょっと見ていかないか？
skyblock_hub_dialogues.shop.blocks.greeting.buy=どんなものを売っているの？
skyblock_hub_dialogues.shop.blocks.greeting.sell=いくつか商品を売らせてくれ！
skyblock_hub_dialogues.shop.blocks.greeting.nothing=いや、遠慮しておくよ！
skyblock_hub_dialogues.shop.furniture.greeting=素敵なあなたにぴったりの、美しい家具を取りそろえているよ！ 何か見ていかないかい？
skyblock_hub_dialogues.shop.furniture.greeting.buy=どんなものがあるのか見せてよ！
skyblock_hub_dialogues.shop.furniture.greeting.sell=売りたいものがいくつかあるんだ。
skyblock_hub_dialogues.shop.furniture.greeting.nothing=今は大丈夫だよ、ありがとう。
skyblock_hub_dialogues.shop.garden.greeting=あなたの庭を花いっぱいにするための商品なら、何でもそろっているよ！ 見ていかないかい？
skyblock_hub_dialogues.shop.garden.greeting.buy=どんな商品があるのか見せてよ！
skyblock_hub_dialogues.shop.garden.greeting.sell=いくつか売りたいものがあるんだ。
skyblock_hub_dialogues.shop.garden.greeting.nothing=いや、遠慮しておくよ！
skyblock_hub_dialogues.shop.misc.greeting=あちこち見て回っているようだね！ 何か気になるものでもあったかい？
skyblock_hub_dialogues.shop.misc.greeting.buy=ここでは何が買えるの？
skyblock_hub_dialogues.shop.misc.greeting.sell=実は、売りたいものがいくつかあるんだ。
skyblock_hub_dialogues.shop.misc.greeting.nothing=今のところは何もないよ、ありがとう。
skyblock_hub_dialogues.shop.ore.greeting=欲しい鉱石なら何でもそろっているよ！ ちょっと見ていかないかい？
skyblock_hub_dialogues.shop.ore.greeting.buy=どんな鉱石があるのか見せてよ！
skyblock_hub_dialogues.shop.ore.greeting.sell=いくつか買い取ってほしいものがあるんだ。
skyblock_hub_dialogues.shop.ore.greeting.nothing=今は遠慮しておくよ、ありがとう。
skyblock_hub_dialogues.shop.spawner.greeting=もっとモブをスポーンさせる準備はできているかい？ 必要なものなら、うちにそろっているよ！
skyblock_hub_dialogues.shop.spawner.greeting.buy=どんなものがあるのか見せてよ！
skyblock_hub_dialogues.shop.spawner.greeting.sell=実は、いくつか売りたいものがあるんだ。
skyblock_hub_dialogues.shop.spawner.greeting.nothing=また今度にするよ、ありがとう。
skyblock_hub_dialogues.npc.traveller.greeting=やあ！ このDimension Balloonを使えば、オーバーワールドとネザーの間を行き来できるよ。さあ、空の旅へ出発だ！
skyblock_hub_dialogues.npc.traveller.thanks=教えてくれてありがとう！
skyblock_hub_dialogues.skyblock_pass.first=追加ワールドと常時ブースト
skyblock_hub_dialogues.skyblock_pass.second=家具など！
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro=冬の寒さがなかなか去らず、穀物の備蓄が危険なほど少なくなっている。厳しい寒さの間も、みんなが食べ物に困らないようにしなければならない。外に出て、小麦を集めてきてくれないか？
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro.response.accept=もちろん、手伝うよ！ 村のみんなのためだからね。
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources=よそ見せず、手を動かし続けるんだ。小麦の収穫は順調に進んでいるか？
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources.response=まだ作業中だよ！ 霜がなかなか手強くて、刈り取るのが大変なんだ。
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro=戻ってきてくれて嬉しいよ。備蓄用の小麦は集まったか？
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro.response.yes=はい、収穫したばかりの小麦を持ってきたよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks=よくやってくれた。これで村のみんなも、あと数日は食べ物に困らずに済むだろう。また会おう！
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks.response=力になれてよかったよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello=調子はどうだ！ 寒さが骨身に染みないよう、気をつけるんだぞ。
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello.response=最高だよ！ ちゃんと暖かくしてるよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro=今夜はずいぶん冷え込んできたね。みんなが暖かく過ごせるようにしているんだけど、暖炉の燃料が足りなくなってきているんだ。みんなで暖かく過ごせるように、トウヒの原木を集めてきてくれないかな？
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro.response.accept=もちろん、手伝うよ！ 村のみんなが暖かく過ごせるなら何でもするよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro=おや、戻ってきたんだね！ トウヒの原木は見つかったかい？ ここもずいぶん冷え込んできて、僕も家族も少し寒くなってきたんだ！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro.response.yes=トウヒの原木を持ってきたよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks=完璧だよ。本当に助かった、ありがとう。君は本当に心優しい人だね。おかげで、この場所がずっと居心地のいい我が家のように感じられるよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks.response=力になれてよかったよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello=こんにちは！ 会えてとても嬉しいよ。君のように素敵な一日を過ごせているといいな！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello.response=やあ！ 暖かくして過ごしてね！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro=暖かく過ごせるように手伝ってくれてありがとう。スノーベリー、トウヒの樹皮、ラピスラズリの粉末を集めるのも手伝ってもらえないかな？\nこれらはSnowy Taigaのあちこちで見つかる珍しい資源だけど、君が生き延びるうえでも役に立つはずだよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro.response.accept=それらを集めてくるよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro=必要な材料は見つかったかな？\nどれもSnowy Taigaで見つけることができるよ。\nスノーベリー:ベリーの茂みの周辺に生えていることが多いよ。\nラピスラズリの粉末:凍った湖の表面にできるんだ。下にある岩から溶け出して、水に溶け込むことで形成されるんだよ。\nトウヒの樹皮のかけら:これが一番見つけにくいけど、トウヒの木の近くで見つけられるはずだよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro.response.yes=集めたものを渡すよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks=素晴らしい！実は、スノーベリーはダンジョンでとても役立つと聞いたんだ。体力を回復して、さらに防御力まで高めてくれるらしいよ！\n試しに使ってみてくれないか？ダンジョンを探索しているときにスノーベリーを食べて、どんな効果があるか教えてほしいんだ！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks.response=試してみるよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress=もうダンジョンでスノーベリーを食べてみたかい？思っている通りの効果があるのか、ぜひ聞かせてほしいな！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress.response=まだだよ、これから試してみるね！
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete=おお、スノーベリーはダンジョンでも役に立ったんだね！それはよかった！食べるたびに、まるで温かく抱きしめてもらったような気分になるんだよね。
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete.response=どういたしまして！
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro=最近、深い氷が動いて、本来そこにはあるはずのない青い鉱脈が姿を現しているんだ。研究にラピスラズリが必要でね。いろいろな道具を使って採掘してきてくれないか？採掘方法によって宝石の共鳴に変化が生じるか調べたいんだ。
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro.response.accept=もちろん、調査に協力するよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress=道具を変えてラピスラズリを採掘する調子はどうだい？石から何か変わった振動は感じられたかい？
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress.response=まだ作業中だよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro=素晴らしい。異なる道具で採掘したラピスラズリを渡してもらえるかな？それぞれの鉱石の構造的な強度を比較する必要があるんだ。
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro.response.yes=はい、どうぞ！
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks=ありがとう。ちょっと待ってくれ、今確認するから…\n…\nうーん、残念だ。結晶構造にはまったく変化がない。どれも同じだよ。まったくの時間の無駄だったな。\n少なくとも、ここでも基本的な物理法則が通用することと、この深さでは木製の道具がまったく役に立たないことは確認できたね。
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_1=それは残念だったね。でも、科学は試行錯誤の繰り返しでしょ？
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_2=正直、何を期待していたのかよく分からないよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello=氷を深く見つめれば、そこに刻まれた物語が見えてくるんだ。
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello.response=本当にそうだよね…
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro=今年は例年以上に霜が厳しく、渓谷の底もあれほど震えている。だからこそ、私たちは互いに助け合わなければならない。皆で生き延びるか、誰も生き残れないか、そのどちらかだ。村のために、栄養たっぷりの食料を備蓄するのを手伝ってくれないか？
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro.response.accept=すぐに取りかかるよ！誰もお腹を空かせるべきじゃないからね。
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro=あら、おかえり！さあ、火のそばにおいで。肩がすっかり冷えきっているのが分かるよ。食料集めの調子はどうだい？
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro.response.yes=頼まれていた食料を持ってきたよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks=本当にありがとうね。これで子どもたちは暖かく過ごせるし、お年寄りたちも元気でいられるよ。あなたのように力を貸してくれる人がいるからこそ、氷に心まで凍らされずに済むんだ。
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks.response=村のみんなの力になれてよかったよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello=こんにちは！ここにはいつでも、暖かい席と優しい言葉を用意して待っているよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello.response=やあ！
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.before_unlock=この時期のShiverfieldはいつも腹ぺこなの。食事が欲しいなら、Sigridに話しかけてみて。私はここで手一杯だから。
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro=気をつけて！そこを踏まないで。ポケットに穀物でも入っているかのように、鶏たちが靴に群がってくるから。\n\n最初は数羽の雌鶏だけだったの。霜が最も厳しくなる時期に、かまどを動かし続けるために必要な分だけね。\n\nでも最近はどう？まるで冬の寒さなんて関係ないみたい。紫色の病害が広がり、人々は食料に困っているのに、鶏たちは私たちをあざ笑うかのように増え続けている。\n\nどこにでもいるの。雪の吹きだまりにも、屋根の上にも。もう替えのない袋にまで穴を開けてついばんでいるわ。\n\nだからといって、ただ…殺すわけにはいかない。あの子たちは私の鶏で、生きているんだもの。私が育てたんだから。\n\nお願い。Shiverfield GuardのRunaに相談してみて。彼女ならどうすればいいか分かるはず。私には、考えるだけで胸が悪くなるような方法以外の解決策が必要なの。
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_1=彼女に話を聞いてみるよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_2=鶏が町を乗っ取るなんてね。こんなの初めてだよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.in_progress=もし通りで鶏たちを見かけても、面白半分で追いかけたりしないでね。いい？あの子たちは人を信頼しているの。それが一番つらいところなのよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete=羽毛の匂いがするわね。\n\n…嘘はつかないで。目を見れば分かるわ。\n\nRunaに言われた通りにしたんでしょう？\n\n嫌だわ。本当に嫌。でも、それが理にかなっているのが分かるから余計につらい。\n\nShiverfieldには食料が必要なの。そして矢も。冬は私たちの望みなんてお構いなしだから。\n\n次に、優しい気持ちさえあればすべてを守れるなんて自分に言い聞かせていたら、今日のことを思い出させてちょうだい。
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_1=ごめん。ほかに方法がなかったんだ。
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_2=どのみち、あなたの鶏たちは町の人々の食料になっていたんだよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_3=二度とこんなことが起きないように、小屋の再建を手伝うよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.after_completion=今でも鶏は好きよ。ただ、Shiverfieldのほうがもっと大切なだけ。
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello=こんにちは。
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello.response=やあ！
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro=Ingaに頼まれて来たんだね。君の姿を見る前から、鶏の群れの音が聞こえていたよ。\n\n聞いてくれ、私だってこんなことは望んでいない。ここの誰もね。\n\nでも、今では街道の状況がさらに悪くなっている。狩人たちが戻ってくることも少なくなった。紫色の汚染のせいで森の様子がおかしいんだ。まるで、木々の影がこちらの話に聞き耳を立てているようでね。\n\n私たちには、町の人々を養い、奇妙な出来事から町を守る責任がある。\n\n鶏がいれば、食料に困っている人々には肉を、矢羽根を作るためには羽毛を提供できる。矢がなければ、私たち衛兵はただ手ぶらで立ちはだかるだけの壁になってしまう。\n\n鶏を10羽、処分してもらう必要がある。羽毛を10枚持ってきてくれ。奪った命を無駄にはしないよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_1=分かった。私が引き受けるよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_2=Ingaは喜ばないだろうね。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_3=必ず町の役に立ててみせるよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.in_progress=鶏の数をもう少し減らす必要がある。まだどこもかしこも鶏に占領されたままなんだ。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro=羽毛は持ってきてくれたかい？\n\n衛兵にとってはとても貴重なものなんだ。これだけあれば、たくさんの矢を作れるからね。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_1=うん、これが頼まれていた羽毛だよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_2=あの鶏たちを殺すのは、気が進まなかったよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks=十分な量だ。これだけあれば、しばらく衛兵の備蓄を維持できるよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks.response_1=よかった。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.after_completion=Shiverfieldの人々に食料を届け続けることが、町を守ることにつながる。それが私たちの務めだ。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello=外では十分に気をつけてくれ。衛兵も近くにいれば君を守れるが、ツンドラの奥深くでは、自分の身は自分で守らなければならないよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello.response=気をつけるよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available=足元に気をつけて！この鶏たちは凶暴化しているんだ！\n何かがおかしいんだよ。僕に襲いかかってくるんだ。実に奇妙な行動だね。\n僕はKjell。ちょっとした科学者なんだ。学校では化学の勉強が大好きだったんだけど、ここで何が起きているのか、どうも心当たりがあるんだ。\n詳しく調べたいから、あの汚染された鶏を何羽か捕まえてきてくれないか？
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_1=なんてこった、邪悪な鶏か。すぐに取りかかるよ！
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_2=この謎の真相を突き止める手伝いをするよこの謎の真相を突き止める手伝いをするよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro=汚染された鶏は手に入ったかい？この呪いの謎を解き明かすのが待ちきれないよ。\nそれと、何があっても絶対に食べないでくれ。見るからに食べたらひどい目に遭いそうだし、何のメリットもないからね。
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro.response_yes=鶏を持ってきたよ。
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit=素晴らしい！ちゃんと手に入れてくれたんだね！さっそく調べてみよう。いったい何が分かるかな…\n…\nあれ、これって生きているんじゃないか？この紫色の物質は……岩じゃないぞ。\nうーん……僕にできることはここまでだ。化学が得意だとは言ったけど、生物学が得意だとは言っていないからね。
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_1=生きているの？それは大変だ…
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_2=まだ調査を続ける必要がありそうだね。
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.hello=この紫色の物質の正体について、何か新しいことが分かったらぜひ教えてほしいな。まさか生きているなんて、今でも信じられないよ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.dungeon_guard.introduce=おお！君が助けに来てくれたって聞いたんだけど、本当かい？\n新しく開いた鉱山の奥で、とんでもない問題が起きているんだ。\n湖の下にある鉱脈から、貴重なラピスラズリを大量に採掘しようとしていたんだが…\nモンスターや気味の悪い虫たちに占拠されてしまった！どうやら奴らもラピスラズリを独り占めしたいらしい。\n力を貸してくれないか？
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro=私たちを苦しめているのは暑さだけじゃない。このオアシスの土台そのものが揺らいでいるんだ。砂に地上の残されたものまで飲み込まれてしまう前に、支柱を補強するための砂岩が必要なの。あなたの力を貸してもらえるかい？
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro.response.accept=もちろん、土台の補強を手伝うよ！
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro=落ち着いて。補強用にお願いしていた砂岩は、無事に集められたかい？
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro.response.yes=必要な資材なら、ここに持ってきたよ！
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks=これで地盤沈下に対して、しばらくは時間を稼げそうだ。積み上げた石の一つ一つが、避けられない崩落から私たちを守る盾になる。ありがとう。
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks.response=砂漠の安定を保つ手助けができてよかったよ。
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello=足取りは軽く、目は地平線に向けておきなさい。砂漠は決して動きを止めないからね。
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello.response=気を抜かないようにするよ、Zahra。ありがとう。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro=街道がどんどん危険になっているんだ。砂が標識を設置するよりも速く飲み込んでしまう。街道を補強するために、砂岩をいくつか持ってきてくれないか？
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro.response.accept=分かった、集めてくるよ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress=今日は砂丘の動きが特に激しいな。必要な量は見つかったかい？道をしっかり固定するために、十分な量を確保しなければならないんだ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress.response=まだ探しているところだよ…
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return=よくやってくれた。作業員たちから、支柱がしっかり持ちこたえていると報告があったよ。この辺りでは、常に周囲に気を配ることが何よりの防衛策なんだ。ありがとう。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return.response=いつでもどうぞ！
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello=周囲に気を配るんだ。この砂漠では、危険を警戒していなければ、危険のほうから君を狙ってくるぞ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello.response=やあ！
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.intro=Talibに頼まれて来たのか？よし。ここの地面は柔らかく、砂丘がじわじわと迫ってきている。砂岩は持ってきたか？
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.response=これだよ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks=ありがとう。これで道がずっとしっかりするはずだ。これを設置すれば、地面が崩れにくくなるだろう。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks.response=よかった！
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello=建設作業には絶好の日だな。風がせっかくの成果を吹き飛ばしてしまわなければ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello.response=本当にそうだね。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.intro=地震で通路の壁が揺れているわ。泥レンガがあれば道を安定させられるはずよ。持ってきてくれた？
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.response=うん、これだよ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks=完璧よ。振動を和らげるために、まさにこれが必要だったの。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks.response=役に立ててよかったよ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello=道では気をつけてね。砂漠では、思いもよらないところで地面に穴が開くことがあるのよ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello.response=気をつけるよ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.intro=しっかりした基礎がなければ、砂は流されてしまうだけよ。基礎を作るには花崗岩が欠かせないの。持ってきてくれた？
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.response=花崗岩ならここにあるよ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks=これは上質な花崗岩ね！地震の揺れにも耐えられるくらい重いわ。ありがとう。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks.response=どういたしまして。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello=砂漠では、地盤の浅い場所に建物を建てる者には容赦ないわ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello.response=まったく、その通りだよ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.intro=崩落する前に、張り出した部分を補強しなければならない。ようやく支柱用の木材が手に入るぞ！トウヒの板材は持ってきてくれたか？
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.response=頼まれていたトウヒの板材だよ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks=素晴らしい！これで補強作業はすべて完了だ。Talibに報告してきてくれ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks.response=今向かうよ！
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello=砂にも侵食されないものがあるとすれば、それは努力の積み重ねだけだ。
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello.response=確かにそうだね。
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro=日中はますます暑くなり、夜は何が起こるか分からなくなってきているわ。集落が崩壊しないよう、備蓄を確保しておく必要があるの。私たちの未来を守るために、力を貸してくれない？
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro.response.accept=それなら手伝えるよ。
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro=落ち着いて。砂が動き始めたときには、どんな物資も貴重になるわ。備蓄に回せる物資は何か持っている？
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_1=うん、持っているよ。
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_2=もちろん！喜んで手伝うよ！
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.no=あ、ごめん！今は無理なんだ！
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks=着実に作業を進めた甲斐があったわ。これらの物資があれば、これから訪れる長い夜も乗り越えられるはずよ。ありがとう。
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks.response=どういたしまして。
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello=砂漠は備えのない者に容赦しないわ。気をつけてね。
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello.response=あなたも気をつけてね。
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro=移動する砂によって、本来なら埋もれたままであるべきものが掘り起こされているんだ。ゾンビが街道を埋め尽くしていて、移動するのもままならない状況だよ。
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro.response.accept=ゾンビを倒して、道を切り開いてくるよ。
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro=あのモンスターたちがいなくなって、空気が少し澄んだ気がするよ。ゾンビの肉は持っているかい？砂丘の安全が確保された証拠が必要なんだ。
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_1=うわ、腐った肉だ。欲しいならあげるよ。
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_2=この目的のためなら、少しくらい分けてもいいかな。
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon=ここでは脅威が完全に消え去ることはないんだ。砂丘のゾンビを一掃したら、また戻ってきてくれ。
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_1=分かった！順調に進んでいるよ！
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_2=ゾンビ怖いよ D:
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response=分かったよ。
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete=君のおかげで、この道路区間の安全を確保できたよ。僕たちって本当に頼もしいチームだね！
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_1=道路の安全を守る手助けができてよかったよ。
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_2=まったくその通りだね！
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello=砂漠の地中には、数多くの危険が潜んでいるんだ。油断しないようにね。
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_1=こんにちは。
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_2=元気にしているといいな！
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro=柔らかなものを何もかも枯らそうとするこの土地では、最も鋭いものだけが生き残る。サボテンは水分や防御手段になり、この強烈な日差しの中でも色褪せない染料にもなる。サボテンをいくつか持ってきてくれ。
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro.response.accept=すぐに取りかかるよ。
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro=また砂が動き始めた。周囲を強化するためのサボテンは持ってきてくれたか？
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro.response.yes=これだよ。
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks=ほかのものが枯れ果てても、これは耐え抜くだろう。過酷な世界にふさわしい、たくましい植物だ。ありがとう。
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks.response=どういたしまして！
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello=熱気と砂、そして時間。それらは真実以外のすべてを削ぎ落としていく。おっと、独り言を言っていたよ…
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello.response=やあ！
skyblock_hub_dialogues.overworld.desert.duneside.azim.hello=すまない、今はかなり忙しいんだ。風力タービンを建設しようとしていてね。風には利用できるエネルギーがたくさんあるんだ。石炭を燃やして砂漠の気温をさらに上げるわけにはいかないからね。
skyblock_hub_dialogues.overworld.desert.duneside.todd.hello=やあ！僕はToddだ！\n気にしないでくれ。中にいるクリーチャーたちが逃げ出さないよう、この扉を見張っているだけさ。ここはDunesideの脱出トンネルなんだけど、クリーチャーたちに占拠されてしまってね。\n手を貸してくれるなら、脱出トンネルの最下層にSunnyがいるよ。彼女一人では、クリーチャーたちを片付けるのに苦労しているんじゃないかと心配なんだ。\nこちらからは進めないから、Dunesideの最下層にある反対側の入口を探してくれ。
skyblock_hub_dialogues.overworld.desert.duneside.bashara.hello=色の濃い砂の上は歩かないでくれ。その下には何か不思議なものが埋まっていると思うんだ。
skyblock_hub_dialogues.overworld.desert.duneside.corvin.hello=ここにこんな石があった覚えはないんだ。天井が崩れかけているんじゃないといいんだけど。
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello=喉の渇きは私たちを苦しめる。みんな嫌がるものだけど、少しでも役に立つものを売っているのよ。
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_1=みんな嫌がっているの？
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_2=はじめまして！ちょっと立ち寄っただけだよ。
skyblock_hub_dialogues.overworld.desert.duneside.derya.detail_1=私はサボテン水を売っているの。普通の水とは違って、少し甘い…と思うわ。\nみんなが怖がるのは、サボテンのトゲを取り除くのがあまり得意じゃないからなのよ。
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello=手を出してごらん。君の未来を占ってあげよう…
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_1=いいよ。僕の未来を占ってみて。
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_2=遠慮しておくよ。
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1=3つの形が見える…\nサボテン。出入口。そして、とても不機嫌なゾンビ。\nつまり、君の未来にはこの3つすべてが待ち受けている、ということだろうね。
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_1=出入口？
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_2=不機嫌なゾンビ？
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_3=何のことだかさっぱり分からないよ。
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_doorway=残念ながら、それ以上は読み取れないんだ。占いの中で出入口が見えただけさ。もしかすると、君にとって非常に重要な出入口になるのかもしれないね。
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_zombie=はは！君は将来、間違いなくゾンビを怒らせることになるだろうね。\nゾンビが感情を表すところなんて今まで見たことがないよ。それほど怒らせるなんて、相当なものだね。
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_nonsense=もちろん、そうだろうね。\n確かなことよりも、でたらめのほうが気楽に受け止められるものさ。私はただ、周りの人たちを元気づけるためにここにいるんだ。
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello=うえぇ、砂って本当にまずい。風で口の中にどんどん入ってくるんだよ。
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello.response_1=どうしてそんなに砂の近くに立っているの？
skyblock_hub_dialogues.overworld.desert.duneside.vesper.detail_1=行かなきゃいけない場所があるんだ！砂なんかに邪魔されてたまるか。
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello=このゲームの開発者たちは、NPCごとに大量の会話を考え続けるのは大変だから、いくつかの会話をそのままコピー＆ペーストしていると言っているんだ。
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_1=なんて怠け者なんだ。
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_2=そんな経験はないな。これから気をつけて見ておくよ。
skyblock_hub_dialogues.overworld.desert.duneside.dungeon_guard.introduce=やあ！信じられるかい？Dunesideの脱出トンネルが邪悪なクリーチャーたちに占拠されてしまったんだ！\n脱出トンネルは、私たちが生き延びるうえで非常に重要なんだ。強力な砂嵐によってDunesideの正面入口が埋まってしまうことがよくあるからね。そんなとき、脱出トンネルが唯一の予備ルートになるんだ！\nトンネルを浄化するために、昔使っていた仕組みを利用して、溶岩を流し込む許可を得ているんだ。だが、ここまで歩いて降りてきただけで息が切れてしまってね。私自身がこの作業をするのは無理そうだ。\n君、引き受けてくれないか？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.before_unlock=今日は忙しいんだ。手入れが必要な木もあれば、加工しなきゃならない木材もある。何か用があるなら、また後で来てくれ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available=君はRonanが地震による被害を修復するのを手伝ったんだろう？よくやってくれた。だが、地面が揺れるたびにひび割れを修理し続けるわけにもいかない。\n実は、少し考えていたことがあってね…古いオークの木々は、もっとひどい揺れにも耐えてきた。その根は広く張り巡らされ、地面の動きに合わせてしなやかに揺れる。もしかすると、私たちもそこから学べることがあるかもしれない。\n私の実験に協力してくれないか？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.what_thinking=何を考えているんだ？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.got_time=時間ならあるよ。何をすればいい？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.not_now=今はちょっと無理なんだ、ごめん。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation=Bramと私は、地面の揺れに逆らってひび割れるのではなく、地面と一緒に動く柔軟な基礎構造について話し合っているんだ。\n森はすでにそれを実現している。風が樹冠に吹きつけるたびに、木の根がその負荷を吸収しているんだ。この原理を再現できれば…次に何かが揺れたとき、建物は壊れるのではなく、しなやかに揺れて耐えられるかもしれない。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.how_help=どうすれば手伝える？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.complicated=なんだか複雑そうだね。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.think_about=少し考えさせてくれ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response=君が思っているほど複雑なことじゃないよ。自然はすでにこの問題を解決しているんだ。私たちはそれを観察して、応用すればいい。\nまずはAncient Oakを見てみてくれ。あの木の根は何十年もの間、地面をしっかりと支え続けている。答えはそこにあるはずだ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.im_in=よし、協力するよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.come_back=また後で考えさせてくれ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions=よし。まずは話を聞いてほしい人がいるんだ。Thorneという人物だ。彼は何週間も前からAncient Oakの研究を続けている樹木研究者で、あの木の近くにキャンプを設営している。\n地震が起きても、あの木の根がどうして安定していられるのかを理解しているとすれば、彼をおいて他にいないだろう。Thorneを探し出して、彼が何を発見したのか聞いてきてくれ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions.response.find_him=彼を探してくるよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active=ThorneはまだAncient Oakで、あの根の構造を研究しているよ。彼に話を聞いてみてくれ。私よりも詳しく説明してくれるはずだ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active.response.on_way=今向かうよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return=戻ってきたね。何を見てきたんだい？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.roots_web=根が網の目のように、あらゆる方向へ広がっていたよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.big_tree=ただの大きな木だったよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.correct_observation=その通りだ。網目状になっているんだ。一本一本の根が互いを支え合っている。地面が動いたときも、根全体が一緒にしなやかに動くから、どこか一か所が壊れても全体が崩れることはない。\n建物にも必要なのは、まさにそれなんだ。圧力がかかるとひび割れてしまうような硬いブロックではなく、負荷を分散させる相互につながった支柱だ。\nBramなら格子構造を設計できるだろう。だが、そのためには材料が必要だ。大量にな。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.playful_correction=次はもっとよく観察してみるといい。「ただの大きな木」が何世紀もの間生き延びてこられたのは、私たち人間よりも賢い仕組みを持っているからなんだ。\n地面が動くと、根は広く深く張り巡らされ、根全体がしなやかに動く。それが秘密なんだ。\nまあ、もう十分に見てきただろう。次は、同じようなものを作るための材料が必要だ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions=必要なものを説明しよう。まずはオークの苗木を集めてきてくれ。植えられたものではなく、自然に生えているものがいい。若い木の根の成長パターンを調べて、重要な構造物の周囲に生きた衝撃吸収材として利用したいんだ。\nそれと並行して、加工した部品も必要になる。Bramにはオークのハーフブロックが必要だ。通常のブロックよりも重量をうまく分散できるからね。それからオークのフェンスも必要だ。根が絡み合うように、柔軟な格子状の支柱を作るために使うんだ。\nこれらは自分のペースで進めてくれて構わない。苗木を集めたら私のところに戻り、加工した部品はBramに届けてくれ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.got_it=了解。苗木にハーフブロック、それからフェンスだね。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.why_saplings=ちょっと待って、どうして苗木が必要なんだ？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.lot_crafting=作るものがかなり多いね。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_explanation=若い木は環境への適応が早いんだ。基礎の近くに植えれば、その根が自然に支えのネットワークへと成長していくはずだ。それに、若木の成長初期を研究すれば、木製の格子構造をどう設計すればいいかも分かる。\n生きた構造物と人工の構造物を組み合わせる。それが私たちの目標なんだ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.workload_acknowledgment=確かにそうだね。だが、これを成功させるには、きちんと取り組む必要がある。焦らずに進めてくれ。森は急いだりしない。私たちもそうあるべきじゃない。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check=素材集めは順調かい？オークの苗木16本が必要なんだ。都合がついたら持ってきてくれ。それと、Bramがハーフブロックとフェンスを待っていることも忘れないでくれよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.working_on_it=まだ作業中だよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.remind_me=必要なものをもう一度教えてくれる？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.requirements_reminder=私にはオークの苗木が16本。Bramにはオークのハーフブロックが64個と、オークのフェンスが32個必要だ。すべてオークで頼むよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered=苗木を持ってきてくれたんだね！見せてくれ。(苗木を調べる) いい苗木だ。健康な根が育ち始めている。Bramが格子状の支柱を完成させれば、これらの苗木はうまく組み込めるだろう。\n素晴らしい仕事だ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.what_do=この苗木をどうするつもりなんだ？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.happy_help=喜んで手伝うよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.planting_strategy=建物の外周に、位置を考えながら苗木を植えるつもりだ。成長するにつれて根が自然な補強構造となり、地面の揺れに合わせてしなやかに動く生きた基礎になる。Bramの木製支柱と組み合わせれば、両方の長所を活かしたハイブリッド構造が完成する。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram=苗木は申し分ない出来だ。あとはBramに材料が届けばいい。ハーフブロックとフェンスはもう彼に届けてくれたかい？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.working=今取り組んでいるところだよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.not_yet=まだだよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete=君は頼んだことをすべてやり遂げてくれた。それどころか、それ以上のことまでしてくれたね。Bramはすでに格子状の骨組みの組み立てを始めていて、私も重要な構造物の周囲に苗木を植え終えたところだ。\n次に地震が起きたとき…いや、必ず起きるだろう。そのとき、この村はただ崩れずに持ちこたえるだけではない。揺れに適応するんだ。\n君のおかげで、学び続け、長く残り続けるものを築くことができた。森は多くのものを与えてくれる。そして君は、私たちがその教えに耳を傾けられるようにしてくれた。ありがとう。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.will_work=本当にうまくいくのかい？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.glad_help=力になれてよかったよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.another_tremor=また地震が起きたら、どうなるんだ？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.confidence=そう信じているよ。原理は確かなものだ。自然は何千年もの間、この仕組みを利用してきたんだからね。Bramの技術も申し分ない。そして君は、私たちが必要としていたものをすべて届けてくれた。次に地面が揺れても、私たちはきっと大丈夫だ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_readiness=そのときは、私たちの技術がどこまで耐えられるか確かめることになるね。たとえうまくいかなかったとしても、何かを学べるはずだ。それが進歩というものだよ。観察し、適応し、改善する。森は季節が巡るたびに、そのことを教えてくれるんだ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion=今のところ、柔軟な基礎構造はしっかり機能しているよ。まだ地震は起きていないが、次に起きたときには備えができているはずだ。苗木の手入れも続けているよ。順調に育っている。改めて、協力してくれてありがとう。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.good_hear=それはよかった。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.other_projects=ほかにも何か取り組んでいる計画はあるのかい？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_projects=改善できることは常にあるよ。でも今は、この計画に集中しているんだ。森は必要なものを与えてくれる。私はそれを少し手助けしているだけさ。
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.roots_web=つまり、根が網のように機能しているってこと？
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.help_buildings=それが建物にどう役立つんだ？
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.incredible=それはすごいね。
