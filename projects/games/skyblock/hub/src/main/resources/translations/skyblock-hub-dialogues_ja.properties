skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.hello=静かにして。ここは声が響きやすいですから。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.locked=今はダメ。村は今地盤沈下で混乱しています。状況が落ち着いてからまた来てください。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available=Cobblestone Mineに行くのか？よかった。私はそこにいるクモが大嫌いなんだ。石の粉塵は平気だけど8本の足がブーツにまとわりつくのは耐えられないよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.whats_changed=何が変わったの？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.what_you_need=私に何をして欲しいの？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.whats_changed=彼らは以前よりも大胆になって昔のように暗闇に隠れていない。そして巣の一部にはかすかに色がついている。それらはおそらくなんでもないだろう。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need=Cobblestone Mineを5回クリアしてください。1回ではなく5回です。私はクモが増殖しているのか移動しているのかそれとも追い出されているのかを知る必要がある。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.on_it=わかった。やってみるね。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.five_times=5回というのは多いように思うよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.why_five=一度クリアすると奴らは隠れる。二度クリアすると移動する。何度か繰り返すうちにパターンが見えてくはずだ。クモの巣の量や位置。それらは注意深く観察している時だけ気づくような類のことでしょう。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress=5回クリアまでまだ何回か残っている。慣れたからって調子に乗らないようにするんだ。包帯グルグル巻きにならないようにな。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress.response.working=今取り組んでるよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete=よくやったよ。5回クリアして無事に帰ってこれた。入り口も良くなってきたしクモの巣なども減ったし石の上を滑る虫も減った。
skyblock_hub_dialogues.npc_name.forge_miners_light=Durgan
skyblock_hub_dialogues.npc_name.forge_fast_sell=Togunda
skyblock_hub_dialogues.npc_name.forge_toughened_armour=Lucildara
skyblock_hub_dialogues.npc_name.traveller=Traveller
skyblock_hub_dialogues.npc_name.dimension_balloon=Dimension Balloon
skyblock_hub_dialogues.npc_name.to_overworld=オーバーワールド
skyblock_hub_dialogues.npc_name.to_nether=ネザー
skyblock_hub_dialogues.wurg.cannot_cross=グルルル！ワシは不機嫌なWurgだ！我々Wurg族は橋を守り、資格のない者が渡るのを阻止することを誓っている！もっと発見をしてから、また来るんだな！
skyblock_hub_dialogues.wurg.back_to_work_response=仕事に戻る時間だ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat=おや、まだ立っていられるじゃないか！いい兆候だね。もう村人たちには会ったかい？みんなおしゃべりが大好きなんだ！\n少し迷ってしまったかな？心配はいらないよ！クエストは<cc:header>Skyblock メニュー</cc:header>に保存されているよ。もしくは”/skyblock quests”とチャット欄に入力してね！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_1=情報をありがとう！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_2=うん、村人たちはとても親切だね！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.introduce=やあ！Oakridgeの村へようこそ！\nおっと、失礼！自己紹介を忘れていたよ！\n僕の名前はCubit！ここOakridgeで村の案内役をしているんだ！\nさあ、ついてきて！村の中心を案内して、村人たちを紹介するよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_enchanter=こちらがEnchanterだよ！\n不思議な魔法の力で、アイテムにエンチャントを施して、アイテムを強力にしてくれるんだ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_portal=そして、ここが最初のポータルだよ…\nいつでもこのポータルを使って帰ることができるよ。あるいは、インベントリにある便利なメニューから戻ることもできるんだ。\n今回の案内はここまで！でも心配しないで。Oakridgeにはまだまだ探索できる場所がたくさんあるよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_repairer=こちらがRepairerだよ！\nどんなものでも修理してくれるんだ！たとえ何かにかじられたものでもね…\n例えば、ウサギとかそんな感じのものでもね…
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_shops=ああ、僕のお気に入りの場所……ショップだよ！\nここには必要なものはもちろん、自分でも必要だと気づいていなかったものまで、何でも揃っているんだ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce=やあ！また会ったね！\nForgeまで案内したほうがよさそうだね！ここはSkyblockの世界で、強力なツールや防具の強化ができる唯一の場所なんだ。\n少し見つけにくいかもしれないから、さっそく出発しよう！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_1=わかった、行こう！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_2=待ちきれないよ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge=Forgeへようこそ！この巨大な建物は、まさに強化のための施設だよ！\nこの場所は、何かに取り憑かれたかのような人々によって建てられ、魔法の力を宿していると言われているんだ。\n世界各地で見つかるルーンは、ここで本来の力を引き出すことができるよ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_1=うわぁ、なんだか怖そうだね！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_2=強力なアイテムを作るのが待ちきれないよ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello=Forgeでの調子はどう？何かすごいものは作れたかい？\nRuneが必要なら、ダンジョンが集めるのに最適な場所だと思うよ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_1=うん、順調だよ！
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_2=まだいいものは何も作れていないよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.introduce=やあ！私はCassandra！農家をしているの！この辺りでは一番の農家だと言う人もいるわ！\n競争相手なんて、私には敵わないって言う人もいるわね！\nビートルート農家だから、ビートルートの種をたくさん持っているの！お得に手に入れたいときは、いつでも私のところに来てね！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.response=会えて嬉しいよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.chat=やあ、調子はどう？\nお得なビートルートの種はいかが？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.introduce=えっと…Leviだよ。\n君、この辺りの人じゃないよね？\nみんな僕のことを知っているよ。仕事中にいつも居眠りしている人としてね。もっとみんなの役に立てるようにスキルを磨いているんだけど、まだまだなんだ。\n君も努力を続ければ、僕くらい有名になれるよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_1=いつも寝ているわけじゃないといいけど…
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_2=なんだか厄介そうな人だね。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.hello=やあ、調子はどう？\n今は休むのに忙しいんだ。また別の機会に来てくれる？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.introduce=うそでしょ！！新しい人だ！！\n君、新人だよね？会えるのをずっと楽しみにしてたんだ！何でもいいから話を聞かせて！\n元気？ケーキがあるんだけど、食べる？\nもう、誰か止めてよ！このままだとずっとしゃべり続けちゃう！\nみんなには会った？ショップは見た？鉱山はどう？\nわあああ！！地面から紫色の変なものがいっぱい生えてるんだけど、あの話聞いた！？\n待って……もうやめるね。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_1=まあまあ、落ち着いて！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_2=私たち、気が合いそうだね。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_3=君、ちょっと騒がしいね。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello=また私に話しかけに来てくれたんだね！光栄だよ。\n元気にしてる？またケーキを作ったんだ。私、ケーキが大好きなの。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello.response_1=私もケーキが大好きだよ。
skyblock_hub_dialogues.response.show_me_around=うん、案内して！
skyblock_hub_dialogues.response.show_me_more=うん、もっと案内して！
skyblock_hub_dialogues.response.show_me_what_youve_got=うん、見せてみて！
skyblock_hub_dialogues.response.thanks_for_help=ありがとう！
skyblock_hub_dialogues.response.yeah_sure=うん、いいよ！
skyblock_hub_dialogues.response.lets_go=準備万端だよ！
skyblock_hub_dialogues.response.ill_pass=また今度にするよ…
skyblock_hub_dialogues.response.yeah_ill_help=うん、手伝うよ！
skyblock_hub_dialogues.response.not_right_now=今はやめておくよ。
skyblock_hub_dialogues.response.okay=わかった。
skyblock_hub_dialogues.response.yes=はい。
skyblock_hub_dialogues.response.tell_me_more=もっと詳しく教えて。
skyblock_hub_dialogues.response.i_should_go=そろそろ行くね。
skyblock_hub_dialogues.response.fair_enough=結構です。
skyblock_hub_dialogues.response.yikes=うわっ。
skyblock_hub_dialogues.response.good_luck=幸運を祈るよ。
skyblock_hub_dialogues.response.interesting=興味深いね。
skyblock_hub_dialogues.response.laugh=ハハハ！
skyblock_hub_dialogues.response.ill_leave_you_to_it=あとは任せるよ。
skyblock_hub_dialogues.response.will_do=そうするよ！
skyblock_hub_dialogues.response.ellipsis=...
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.introduce=ああ、なんてこと！大切なふわふわちゃんたちが、また鍵をすり抜けて逃げ出してしまったの！\nさっきまで小屋の近くでぴょんぴょん跳ねていたのに、今は森の中に消えてしまったわ！\nお願い、あの子たちを探して連れ戻してくれないかしら？お礼はたっぷり払うわ。お願いだから、あの子たちを家に連れ戻して！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.response=ウサギたちを捕まえに行こう！Aurora、心配しないで！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.hows_it_going=調子はどう？うちの脱走名人たちの手がかりは見つかったかしら？\nあのウサギたち、何か企んでいるに違いないわ…おやつを盗む程度ならいいけれど、まさか本格的な反乱を起こそうとしているんじゃないでしょうね！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks=ああ、本当によかった！助けてくれて本当にありがとう……あなたがいなかったら、あの子たちを見つけられなかったわ！\nあなたの優しさと勇敢さをOakridgeのみんなに伝えておくわね！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks.response=力になれてよかったよ！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.hello=やあ！うちのいたずらっ子たちを助けてくれたこと、本当に感謝しているわ！
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro=ひえっ！近寄らないで！……あ、こんにちは！\nウサギって、その……動きが素早すぎて苦手なんだ。恐ろしいよ！\nこの食料をAuroraに届けてくれないかな？ニンジン、ビートルート、小麦を詰めておいたんだ。これであの子たちのお腹を満たしてあげられるはずだよ。
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_1=もちろん！配達なら任せて！
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_2=どうして怖がるの？ただのふわふわした小さなウサギじゃないか！
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress=やあ！あの恐ろしい生き物たちに、もう餌をあげたかい？まだお腹を空かせているのかな？
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress.response=今、取り組んでるところだよ。
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete=君は最高だよ！本当に、ウサギって小さな怪物が化けているだけなんじゃないかな。\nAuroraには、いつかウサギたちに会いに行くよう勧められているんだ……君が守ってくれるなら、行ってみてもいいかな！
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete.response=いつでもどうぞ！ウサギ対策のボディーガードになってあげるよ。
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello=やあ、調子はどう？僕は森で一番の動物用飼料の供給業者なんだ。まあ、動物たちにあまり近づきたくないからなんだけどね！
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello.response_1=それはよかった！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro=あら！これがBobが集めてくれたニンジンね。ちょっと臆病だけど、本当に優しい人なのよ。こちらに渡してくれる？
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro.response.yes=はい、どうぞ！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks=完璧よ！本当にありがとう。Bobに、いつでも遊びに来ていいと伝えておいてね。ウサギたちが餌を食べているところを見れば、ただのふわふわした小さな友達だって分かるかもしれないわ。
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks.response=彼に伝えておくよ。
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro=あら、Bobがおやつを届けてくれたの？なんて親切なの！\n今はほかのウサギたちの世話で手が離せないの。代わりに、この子たちに直接餌をあげてくれる？\nBobには、いつでも遊びに来ていいと伝えておいてね！
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro.response=もちろん、任せて！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.catch=<italic>*ぴょんぴょん*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.response=終わったよ！楽勝だったね。
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.intro=このウサギは鼻をひくひくさせている。ニンジンを欲しがっているようだ！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.thanks=ウサギは嬉しそうにニンジンを頬張っている。
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.catch=<italic>*キュッ！*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.response=おいで、小さな子！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.intro=このウサギはビートルートを欲しがっているようだ。袋をじっと見つめている！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.thanks=ウサギはビートルートをおいしそうに食べているね。
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.catch=<italic>*もぐもぐ*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.response=さあ、小屋に戻ろう！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.intro=このウサギは小麦をじっと待っている！
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.thanks=ウサギは満足そうに小麦をかじっている。
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.hello=<italic>*鼻をひくひくさせる*</italic>
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.intro=おい、そこの君！ちょっとこっちに来てくれ。\n昨夜……壁が激しく揺れてな。そのせいで、この辺りの家はどれも不安定になってしまった……。\n当然、その修理をするのは俺の仕事になったわけだ……。\nだが、君にも手伝ってもらうことにしよう。\nオークの原木と丸石を集めてきてくれ。それが済んだら、また話そう。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going=また君か。\n必要な資材はもう集まったか？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.yes=うん！資材を持ってきたよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.no=ごめん、まだだよ。引き続き集めてくるね :(
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks=おお、本当に集めてきたのか。\n……感心したよ。\nまあ、ありがとう。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks.response.enjoy=その資材が役に立つといいな！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well=昨夜から地震は起きていない。このまま何事もないといいんだが。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well.response.glad_to_hear=うまくいっているようでよかったよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro=そこの君。この世界にある、とても強力なものを紹介してやろう……\nそれはShrineだ。そう、Shrineが求めているアイテムを大量に捧げれば、その見返りに素晴らしい報酬が手に入る。\nこの土地を歩き回って、すべてのShrineを探してみるんだ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_1=さっそく行ってくるよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_2=歩き回りながら探してみるよ、ありがとう！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going=もう全部見つけたかい？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_1=まだ探しているところだよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_2=全部見つけられるように頑張っているよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello=やあ！調子はどう？
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello.response_1=また会えて嬉しいよ！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello=やあ。俺はGusだ。確かこの辺りのどこかにメガネを置き忘れた気がするんだ。\nもう少し探してみることにするよ。
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_1=頑張って。見つかるといいね！
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_2=まさかそんな展開になるとは思わなかっただろうね…
skyblock_hub_dialogues.overworld.oak_forest.cobblestone_mine.dungeon_guard.introduce=ほんの少し前まで、ここは平和で活気のある鉱山だったんだ……。\nあのクモたちがやって来るまでは。\nOakridge Guardは、あんな襲撃に備えられていなかった。\n敵に圧倒され、撤退せざるを得なかったんだ。\n今では鉱山はクモやほかの魔物に占拠されてしまっている。\nどうか、奴らを一掃するのを手伝ってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.ella.flower_shop=こんにちは！私はここPumpkingdomにあるお花屋さんの店主よ！\nお花はいかがかしら？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.dungeon_guard.introduce=ゾンビがあまりにも多かった。今でもあの光景が頭から離れない！\nどうやって生き延びられたのか分からない。私にできることは、もう何もなかったんだ。\n君ならもっと上手くやれただろうか？助けることができたと思うか？もし君があの場にいたら、結果は変わっていただろうか？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce=あら！こんにちは！あなた、園芸の才能がありそうね！最近、土がずいぶん落ち着かない様子なの。きっと鮮やかな色で元気づけてあげる必要があるんだと思うわ。\nお花を集めるのを手伝ってくれない？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_1=わあ、お花！ぜひ手伝いたいよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_2=今は忙しくて、お花を集める時間がないんだ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker=待って、待って！ただ引き抜けばいいってわけじゃないの。根はとても繊細なんだから！行動する前に、あのお店に寄って花摘み道具を買ってきてね。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker.response_1=分かった、買ってくるよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go=よし、ちゃんと手に入れたわね！見て、その輝き！さあ、集中するのよ、私…集中…それじゃ、お花を摘みに行きましょう！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go.response_1=やった！お花だ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions=見て、このタンポポ！小さな太陽のかけらみたいね。道具を使ってタンポポをいくつか採取して、私のところに持ってきてちょうだい！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_1=タンポポを持ってきたよ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_2=あっ、ちょっと取りに行ってくるね！少し気を取られちゃってた。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_dandelions=集中して！大地を傷つけないように、必ず道具を使ってタンポポを採取してね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys=今の聞こえた？地面が少し……バリバリした気がするわ。ポピーを探しに行きましょう。その鮮やかな赤色は、遺跡にぴったりなの。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_1=うん、探しに行こう！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_2=どうしてもって言うなら…
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys=急いで、急いで！道具を使ってポピーをいくつか採取して、私のところに持ってきてね！ポピーはこの土地にたくさんの恵みをもたらしてくれるの。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_1=ポピーを持ってきたよ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_2=あっ、ちょっと取りに行ってくるね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_poppys=ポピーよ！必ず道具を使って採取してね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys=わあ！ボタンを探しに行きましょう。土をふんわり包み込む毛布みたいなお花なの！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_1=うん、探しに行こう！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_2=分かったよ…
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys=なんて見事なお花なのかしら！道具を使ってボタンをいくつか採取して、私のところに持ってきてね！これで花の絆創膏が完成するわ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_1=ボタンを持ってきたよ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_2=あっ、ちょっと取りに行ってくるね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_peonys=忘れないで、必ず道具を使ってボタンを採取してね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home=あら！カゴが花でいっぱいになっちゃった！それに、足も少しピリピリしてきたわ…もう十分ね。家に帰りましょう。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_1=うん、帰ろう！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_2=歩き回りすぎて足が痛いよ :(
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up=楽しかったわね！もう地面が少し落ち着いたように感じない？またいつか一緒にやりましょう。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_1=うん、私も楽しかったよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_2=まあ、悪くはなかったかな。花はあまり好きじゃないんだけどね。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello=やあ、調子はどう？花のように元気で、新芽たちを手伝う準備ができているといいな！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello.response_1=君も同じように元気だといいね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.cedric.hello=焦げ臭いにおいがするなら、顔を火に近づけすぎている可能性が高いぞ。このジャガイモはまだ生だからな。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello=静かに話してくれ。カカシたちに聞かれているんだ。……いや、もしかしたら俺がおかしくなってきただけかもしれない。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello.response_1=幸運を呼ぶカボチャのお守りはいらないかい？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.detail_1=いや、絶対にいらない。\n幸運のお守りを持っていて効果がなかったら、不運のお守りの存在まで信じなきゃいけなくなるからな。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello=ようこそ、旅人さん。ここはPumpkingdomです。世界的に有名なカボチャの産地なんですよ。\n何かお手伝いできることはありますか？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_1=何か歌ってよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_2=どうしてPumpkingdomっていう名前なの？
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_3=ちょっと通りかかっただけだよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.verse_1=ああ、カボチャ、カボチャ、鮮やかなオレンジ色！\n不気味な夜が来るのを待っている。\nおどけた笑顔も、怖い顔も、\nこの場所で一番かわいいカボチャさ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.detail_1=Pumpkin Villageなんて名前にしたら、襲撃してくださいと言っているようなものだからね。\nそれに、初代町長が彫刻刀でこの名前を宣言したんだ。誰もその刃物に逆らおうとはしなかったよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.maeve.hello=こんにちは！私はMaeve。本が好きで、読書も好きなの。本からはたくさんのことを学べるわ。\nただし、読むことは別ね。本を読むことで読み方を学べるかどうか、何人かで試してみたけれど、今のところ誰もうまくいっていないの。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.quinn.hello=レバーには触らないでくれ。\nいや、やっぱり触ってもいいぞ。そっとな。\n実はあれが何をするものなのか、さっぱり分からないんだ。だから、もし爆発しても……私のせいにしないでくれよ！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello=カボチャを買いに来たなら、左の道へ進んでくれ。\nくだらないジョークを聞きに来たなら、おめでとう。もう道に迷っているよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_1=くだらないジョークを聞かせてよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_2=あとは任せたよ。
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1=壊れたカボチャはどうやって直す？\nカボチャ畑でね！
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1.response_1=本当にひどいジョークだったよ。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce=おい、ちょっと聞いてくれ！君はシャベルや剣を扱えそうな人に見えるな。\n実はここでちょっとした問題が起きているんだ…ゾンビたちが俺の畑に押し寄せてきている。\n作物を踏み荒らし、柵をかじり、挙げ句の果てには俺のジャガイモまで食べているんだ！\n手を貸して、作物を守ってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response1=もちろん！ゾンビが何体かいたって怖くないよ。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response2=そこまで言うなら、手伝ってもいいけど……
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane=見事な仕事ぶりだったぞ、相棒！\nもし時間があるなら……俺の友人のSusaneを訪ねてくれないか？\n彼女のカボチャ畑の周りにクモが現れて、少し困っているようなんだ。\n彼女を見つけて、手を貸してやってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response1=了解！クモたちを退治しよう！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response2=君のカボチャは私が守るよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks=すごいな、あのモンスターたちに誰がボスなのか思い知らせてやったな！\nあれだけの数を倒すなんて信じられないよ。\nこのまま二度と戻ってこなければいいんだが…でも、少なくとも君のおかげで状況は大きく改善したよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks.response=いつでもどうぞ！人助けならお任せあれ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hows_it_going=その後、状況はどうだ？\nあの化け物たちが、あっという間にこの場所を占拠してしまうなんて信じられるか？\nまったく、ついてないよ…
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hello=ちょっとした秘密を知りたくないか？\n実は俺の本名はFredじゃないんだ。\n一度ジャガイモの山に埋もれて抜け出せなくなったことがあって、それ以来みんなにPotato Fredと呼ばれるようになったんだ。\n今でも、どうやってあそこから抜け出せたのか分からないよ…
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.see_fred=やあ！\n成長が早いのはカボチャだけじゃないんだ。害虫たちもどんどん増えているよ！\n私の相棒、Potato Fredが君の助けを必要としているんだ。\n彼の様子を見に行ってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred=うわあああ！\nクモだ！そこら中クモだらけだ！\nあいつらが私のカボチャを台無しにしているんだ！\n頼む、クモたちを追い払うのを手伝ってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response1=ひゃあっ、クモだ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response2=もちろん、クモなんて怖くないよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders=もうクモたちは退治してくれた？\nまだ残っているなら、怖くて戻れないよ……
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders.response=まだ少し残っているよ…
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.hello=ああ、カボチャが元気に育っている姿を見るのは最高だね……。\nあの厄介なクモたちは、いつも何もかも台無しにしようとするんだ！\n今度こそ、もう二度と近寄ってこないことを願おう……
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce=そこの君！正義感がありそうな人だね！実は、いたずら好きの小さな子が私の自慢のカボチャを「作品作り」のために盗んで、あちこち走り回っているんだ。\nそいつを見つけて、きちんと、でも公平にお説教してやらないとね！\n犯人を捕まえるのを手伝ってくれないか？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_1=そのいたずらっ子を追いかけて捕まえてくるよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_2=分かった、この件の真相を突き止めるのを手伝うよ。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going=あの子と盗まれたカボチャは見つかったかい？私のカボチャはお祭り用なんだ。的当ての練習に使うものじゃないよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going.response=まだ捜索中だよ、Susane！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete=あそこにいたよ！このいたずらっ子め！……待って、ちょっと待って。これって彫刻したカボチャなのかい？なんて見事な出来栄えなんだ……。台無しにしたどころか、むしろ素晴らしく仕上げてくれたんだね！わあ、本当にすごいよ。あの子と作品を私のところまで連れてきてくれてありがとう。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete.response=誤解が解けてよかったよ！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce=Susaneに畑まで連れ戻すよう頼まれたの？そんな……彼女、きっとすごく怒るよ！\nお願い、まだ彼女のところへ連れて行かないで！僕は泥棒じゃない、芸術家なんだ！\nそうだ、彼女に仲直りの贈り物を持っていけば……僕の彫刻刀を探すのを手伝ってくれない？それがあれば、彼女の考えを変えられるような作品を作ってみせるよ。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_1=彫刻刀を探してくるよ。どんな作品を作るのか見せてもらおうじゃないか。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_2=分かった、探してくるよ。これ以上騒ぎを起こさないでね。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint=いい作品を作るための題材を探していたとき、最後に使ったのはメインのカボチャ畑の近くだったよ。きっとその辺りのどこかにあるはず！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint.response=任せて。
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife=見つけてくれたんだね！本当に助かったよ。さっそく取りかかるよ。彼女がなくなったカボチャのことなんて忘れちゃうくらい、傑作を彫ってみせる！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife.response=さあ、やってみよう。うまくいくといいね！
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.hello=今日は作業に集中してるんだ。集中力が必要だからね。わかるでしょ？
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.knife.dont_know=こんなナイフがその辺に放置されているなんて、妙な話だな。柄にはKippと刻まれている。Kippに返してあげたほうがよさそうだ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.hello=聞こえるかい？おいしい料理ができあがる音だよ。Pumpkingdomのみんなもきっと喜んでくれるはずさ。\n君がたくさん手伝ってくれて、本当にありがとう！
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available=夕食の匂いがするなら、まだ何とかやれている証拠さ。ギリギリだけどね。石炭置き場は空っぽだし、かまどもいくつも壊れてしまった。このままじゃPlains中の人たちが生のジャガイモをかじる羽目になる。そうなる前に、手を貸してくれないか。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.help=手伝うよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.plan=どうすればいい？
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.breaking=どうしてかまどが壊れているの？
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.why_furnaces_break=温度変化に、不注意な扱い、それにちょっとした不運さ。さっきまで何ともなかったのに、次の瞬間にはひび割れて、灰を吹き出しているんだ。かまどが1つ壊れたくらいなら何とかなる。でも、調理場全体が使えなくなったらお手上げさ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted=助かるよ。必要なものは3つある。しかも、すぐに必要なんだ。火力を安定させるための石炭、壊れたものと交換するためのかまど、それから、食べられるものを作って提供するためのジャガイモだ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted.response.all=全部持ってくるよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items=ちょっと目を離すたびに、誰かがかまどを「点検」して、扉を開けっぱなしにしていくんだ。石炭とかまどとジャガイモを持ってきてくれれば、この大混乱を夕食に変えてみせるよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.deposit=必要なものを持ってきたよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.working=今取りかかっているところだよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.deposit_thanks=よし。石炭は石炭置き場に、かまどは所定の場所に入れてくれ。引き続き頼むよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage=これで全部そろったよ。火も戻ったし、料理の提供も再開できた。これでしばらくはPlainsのみんなも、ちゃんと火の通った料理を食べられるね。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.glad=力になれてよかったよ。
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.save=いつか一緒に何か料理を作ろうよ！
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available=遺跡はただの景色じゃない。移動ルートなんだ。\n遺跡の中でスキルを磨いてみるといい。移動能力を大幅に向上させられるかもしれない。\nさっき遺跡の中で遊んでいるのを見かけたRobbのところまで行ってみてくれ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.accept=分かった。あの足場まで行ってみるよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.tips=始める前に何かアドバイスはある？
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.later=今はやめておくよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips=ジャンプする前に、次に着地する場所を決めておくんだ。\n焦らずゆっくり進めばいい。上を目指すのに急ぐ必要はないよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips.response.okay=分かったよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete=まだ下にいるのか？ それなら、まだ遺跡の頂上には到達していないようだね。\n上を見て、焦らず進むんだ。いつか必ず遺跡の頂上にたどり着けるよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.remind=Robbがどこにいるのか、もう一度教えて。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.go=分かった。上を目指して進むよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location=おそらく頂上付近にいるはずだ。遺跡を上っていくうちに、彼を見失ってしまってね。\nRobbの笑い声が聞こえたら、もうすぐそこだよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location.response.on_my_way=今から向かうよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete=無事に戻ってきたようだね。よくやった。\nRobbは大人しくしていたかい？ 彼も無事だったか？ あの場所では自信過剰になることがあるけれど、彼のことは信頼しているよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.remember=うん、彼は無事だったよ。
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.after_completion=これからは壊れた石造りを見かけたら、ルート、身を隠す場所、逃げ道を考えるんだ。\nこの辺りではゾンビがますます増えているから、とても役に立つアドバイスだよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached=ははっ！本当にここまで来るなんて信じられないよ！！！\n頂上へようこそ！ここからは見どころがたくさんあるんだ。遺跡で遊ぶのって、なかなか楽しいだろ？\nここに来る途中、君が落ちるところを見てたよ。みんながここまで登ろうとして失敗するのを見るのって、すごく面白いんだ。\nLewisはまた堅苦しいことを言ってた？ もしかして、僕に帰ってきてほしいのかな。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.rough=すごく楽しかったよ！
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.easy=Lewisは君の身のこなしに感心しているよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.trick=自分でもここまで来られたなんて信じられないよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough=本当に楽しいよ！ ははは！ この景色を見てよ。ゆっくり眺めて、満喫していってね。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough.response.laugh=ははっ！うん、そうだね！よく分かるよ！
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy=そうだろうね。僕は移動がすごく速いからね。ここを走り回ることなら、誰にも負けないよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy.response.okay=あまり調子に乗らないでね。危ないよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick=練習を重ねれば上達するよ。これから遺跡の高い場所にも、もっと自信を持って登れるようになるさ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick.response.got_it=分かったよ。
skyblock_hub_dialogues.overworld.plains.ruins.robb.hello=やっほーー！パルクールの練習はどう？ きっと上達してきてるよね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.hello=やあ、元気にしてるかい？ まだ生きてる？ それはよかった！ Billyを見つけてくれてありがとう。あの子はかわいいから助かったね。そうじゃなかったら、床に敷くラグにしていたところだよ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction=大変だ！ まさに大惨事だよ！ うちの猫、Billyがまた行方不明になっちゃったんだ。どうやら僕たちの頭上のどこかにいるらしい。世界征服を企んでいるのか、それとも鳥を追い回そうとしているだけなのか。あの子がずっと樹冠に住み着いてしまう前に、連れ戻すのを手伝ってくれないか？
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_1=それは大変だね！ すぐに連れ戻してくるよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_2=ツタが落ちてくるのを避けるのに忙しくなくなったら、探してみるよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_3=今は本当に忙しいんだ。今日はジャングルが大変なことになっていてね！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks=BILLY！ ああ、なんてありがたいんだ！ 本当に見つけてくれるなんて信じられないよ！ あの子はいつもお腹を空かせていて、まるで胃袋にブラックホールでもあるみたいなんだ。ジャングルの床板まで食べ始める前に、魚をあげてくるよ。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_1=気にしないで。僕は猫の扱いならプロだからね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_2=また魚？ あの猫、底なしの胃袋でも持ってるのかよ！
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking=調子はどうだい？ あの毛むくじゃらの逃亡者は見つかったかい？
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking.response=まだ探しているところだよ。猫はずる賢いし、Billyは忍者のプロだからね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found=ニャー <italic>(何もかもお見通しといった得意げな笑みでこちらを見つめている)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found.response=ほら、お騒がせな子猫ちゃん。お家に帰ろうね。
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1=ニャー <italic>(お腹が雷鳴のようにゴロゴロ鳴っている)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1.response=ほら、魚をあげるよ。唸るのはやめて！
