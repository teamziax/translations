skyblock_hub_dialogues.wurg.cannot_cross=GGGRRR! I'm a grumpy Wurg! We Wurgs are sworn to protect bridges and prevent \
anyone who is not worthy from crossing the bridges! Come back once you've discovered more!
skyblock_hub_dialogues.wurg.back_to_work_response=Time get back to work!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat=Hey, you're still standing! That's a good sign. Met the villagers yet? They love a good chat!\n\
Feeling a bit lost? No worries! Your quests are safe and sound in your <cc:header>Skyblock Menu</cc:header> or type "/skyblock quests"!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_1=Thanks for the info!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_2=Yeah, the villagers are so nice!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.introduce=Hey there, friend! Welcome to the village of Oakridge \n\
Oh, where are my manners... I forgot to introduce myself!\n\
My name is Cubit, I'm the village guide here in Oakridge!\n\
Follow me, I'll show you the heart of the village and introduce you to the villagers!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_enchanter=This is the enchanter!\n\
In some magical way, they can enchant your items to make them more powerful!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_portal=And that brings us back to the portal...\n\
You can always use the portal to return home, or alternatively use that handy menu in your inventory.\n\
That's the end of the tour for now, but fear not, there's so much more to explore in Oakridge!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_repairer=Meet the repairer!\n\
They are able to repair anything! Even if it's been chewed on by something...\n\
Like a bunny or something...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_shops=Ah, my favourite part... The shops!\n\
They've got everything you need, and everything you didn't know you needed!

skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce=Hey there! It's you again!\n\
I better show you to the Forge! It's the only place in the world of Skyblock capable of doing powerful tool and armour upgrades.\n\
It can be a bit tricky to find, so let's get moving!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_1=Lets go!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_2=I can't wait!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge=Welcome to the Forge! This massive building is a true powerhouse!\n\
This place is said to be built by people who were seemly possessed, and that this place has magical powers.\n\
Runes found around the world can have their true powers refined here.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_1=Woah, sounds scary!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_2=I can't wait to make something powerful!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello=How's it going at the forge? Made anything awesome?\n\
Dungeons should be a great starting place for finding runes if you're in need of any.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_1=Yeah, it's going well!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_2=Haven't made anything good yet!

skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.introduce=Hey there! Cassandra here! I'm a farmer! Some would say the best farmer around here!\n\
Some would say that I <italic>beet</italic> all the competition!\n\
\n\
As a beet farmer, I always have tons of beetroot seeds! Come back to me if ever you want a great deal!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.response=Lovely to meet you!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.chat=Hey, how'd it going partner!\n\
Can I intrest you in some great value beetroot seeds?

skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.introduce=Mmh... Levi here.\n\
You're not from around here, are you?\n\
Everyone knows me. I'm the one who's always sleeping on the job. I'm working on improving my skills to be able to help out more, but I'm not quite there yet.\n\
If you keep at it, you'll become as famous as me.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_1=I hope you don't always sleep
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_2=You sound like trouble
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.hello=Hey, how you doing?\n\
I'm being busy, resting. Mind coming back at some other point?

skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.introduce=NO WAY! New people!\n\
You're new right? I can't wait to meet you. Tell me everything.\n\
How are you? I have cake. You want cake?\n\
Oh my word. You've gotta stop me. I'll keep talking otherwise.\n\
You met everyone? Have you seen the shops? What about the mines?\n\
OOOOOO There's loads of crazy purple stuff growing out the ground, you here about that?\n\
Wait... I'll stop
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_1=Woah, chill!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_2=I think we're going to get along
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_3=You are far too chaotic

skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello=Woah, you came to speak to me again! I'm honoured.\n\
You doing alright? I've made more cake. I love cake.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello.response_1=I love cake too

skyblock_hub_dialogues.response.show_me_around=Yes, show me around!
skyblock_hub_dialogues.response.show_me_more=Yeah, show me more!
skyblock_hub_dialogues.response.show_me_what_youve_got=Yeah, show me what you've got!
skyblock_hub_dialogues.response.thanks_for_help=Thank you!
skyblock_hub_dialogues.response.yeah_sure=Yeah, sure!
skyblock_hub_dialogues.response.lets_go=I'm so ready!
skyblock_hub_dialogues.response.ill_pass=Maybe another time...
skyblock_hub_dialogues.response.yeah_ill_help=Yeah, I'll help!
skyblock_hub_dialogues.response.not_right_now=No, not right now
skyblock_hub_dialogues.response.okay=Okay
skyblock_hub_dialogues.response.yes=Yes
skyblock_hub_dialogues.response.tell_me_more=Tell me more.
skyblock_hub_dialogues.response.i_should_go=I should go.
skyblock_hub_dialogues.response.fair_enough=Fair enough.
skyblock_hub_dialogues.response.yikes=Yikes.
skyblock_hub_dialogues.response.good_luck=Good luck.
skyblock_hub_dialogues.response.interesting=Interesting.
skyblock_hub_dialogues.response.laugh=Haha!
skyblock_hub_dialogues.response.ill_leave_you_to_it=I'll leave you to it.
skyblock_hub_dialogues.response.will_do=Will do!
skyblock_hub_dialogues.response.ellipsis=...

skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.introduce=Oh dear, oh heavens! My precious little fluff-balls have slipped the latch again! They were just hopping near the cottage, but now they've vanished into the woods! Could you please help me round them up? I'll pay you handsomely, I promise I just need my babies home!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.response=Time for a rabbit roundup! Don't you worry, Aurora!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.hows_it_going=How's it going? Any sign of my little escape artists? Those rabbits are plotting something, I just know it... hopefully just a snacks-heist and not a full-blown rebellion!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks=Oh, thank goodness! Thank you so much for helping me... I wouldn't have been able to keep track of them without you! I'm going to tell everyone in Oakridge about your kindness and bravery!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks.response=Happy I could help save the day!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.hello=Hey! I am still just so super thankful for your help with my little rascals!

skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro=Eeek! Stay back! I mean hello! Bunnies are just... too twitchy for me. They're terrifying! Can you please take this food to Aurora? I've packed carrots, beetroot, and wheat so she can keep them... satisfied.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_1=Of course! I'll be your delivery hero.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_2=How can you be scared? They're just fluffy little rabbits!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress=Hey! Have you... have you fed those terrifying creatures yet? Are they still hungry?
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress.response=Not yet, but I'm on it.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete=You are the best! Honestly, bunnies are just little monsters in disguise. Aurora says I should visit them sometime... maybe I will, if you’re there to protect me!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete.response=Anytime! I'll be your bunny-bodyguard.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello=Hey, how's it going! I'm the best animal food supplier in the woods mostly because I don't like getting too close to the animals!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello.response_1=Great to hear!

skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro=Oh! These must be the carrots Bob gathered. He's such a sweetheart, even if he is a bit jumpy. Can you hand them over?
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro.response.yes=Here you go!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks=Perfect! Thank you so much. Tell Bob he is always welcome to visit maybe if he sees them munching, he'll realize they're just soft little friends.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks.response=I will let him know.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro=Oh, Bob sent you with snacks? That's so kind of him! I'm a bit tied up with the other rabbits, could you just feed these ones directly? Tell Bob he's welcome anytime!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro.response=I can do that!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.catch=<italic>*Hop Hop*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.response=Got you! Nice and easy.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.intro=This rabbit is wiggling its nose it looks hungry for some carrots!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.thanks=The rabbit happily munches on the carrots.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.catch=<italic>*Squeek!*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.response=Come with me, little one!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.intro=This rabbit seems to want some beetroot it's looking right at the bag!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.thanks=The rabbit enjoys the beetroot.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.catch=<italic>*Nom Nom*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.response=Back to the pen we go!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.intro=This rabbit is waiting patiently for some wheat!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.thanks=The rabbit nibbles on the wheat contentedly.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.hello=<italic>*Wiggles nose*</italic>


skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.intro=Hey! You there, c'mere\n\
Last night... The walls shook violently and just like that, all of the houses around here are unstable now...\n\
And of course that ends up being my problem to fix...\n\
But now I can make it your problem too, I guess.\n\
Go fetch me some Oak logs and Cobblestone, we'll talk again once you've done that.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going=It's you again.\n\
Have you gathered the materials yet?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.yes=Yes! I have some resources for you.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.no=No sorry, I'll get back to it :(
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks=Woah, you actually did it.\n\
I'm... impressed.\n\
Thanks, I guess.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks.response.enjoy=I hope those resources helped!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well=No quakes since last night. Maybe it's best that it stays that way.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well.response.glad_to_hear=Glad to hear it's working out for you!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro=Hey, you there. Let me introduce you to something mighty powerful in this world...\n\
Shrines. Yeah, give them a lot of whatever item the shrine is made for, and it will pay you with awesome stuff in return.\n\
Go walk around to find all the shrines this land has to offer!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_1=I'll get right to it!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_2=I'll see them as I go, thank you!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going=Have you found all of them yet?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_1=Still looking!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_2=I'm doing my best to find them all!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello=Hey! What's up!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello.response_1=Nice to see you again!

skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello=Hey. I'm Gus. I seem to remember leaving my glasses somewhere around here.\n\
I guess I'll keep looking for them.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_1=Good luck. Hope you find them!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_2=I bet you didn't see that coming...


# Cobblestone Mine - Dungeon Guard
skyblock_hub_dialogues.overworld.oak_forest.cobblestone_mine.dungeon_guard.introduce=Not too long ago, this was a peaceful, productive mine...\n\
That was until the spiders came.\n\
The Oakridge Guard wasn't prepared for an attack like that.\n\
We were overwhelmed and had to retreat.\n\
Now the mine is overrun with spiders and other creatures.\n\
Could you please help us clear them out?

# Pumpkingdom - Ella
skyblock_hub_dialogues.overworld.plains.pumpkingdom.ella.flower_shop=Hey there! I'm the owner of the Flower Shop here in Pumpkingdom!\n\
Can I intrest you in some flowers?

# Pumpkingdom - Dungeon Guard
skyblock_hub_dialogues.overworld.plains.pumpkingdom.dungeon_guard.introduce=There were so many zombies. It haunts me!\n\
I don't know how we survived. There was nothing more I could've done.\n\
I wonder if you could've done better? Do you think you could've helped? Would the outcome have changed if you were there?

# Pumpkingdom - Blooming in the Rain
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce=Oh! Hello! You look like you have great hands for gardening! The soil has been so restless lately, I think it needs some bright colors to calm it down. Want to help me gather some flowers?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_1=Oooo, flowers! I'd love to help.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_2=I'm too busy to get flowers right now.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker=Wait, wait! We can't just pull them out, the roots are sensitive! Before we head out, pop into that store and buy a flower picker.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker.response_1=Sure, I'll go pick one out
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go=Righty, you got it now! Look at that shine! Okay, focus, Sandy... focus... Lets go pick some flowers!!!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go.response_1=Yeah! Flowers!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions=Look at these Dandelions! They’re like little pieces of the sun. Harvest some dandelions using the tool, then bring me the dandelions!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_1=Here are some dandelions!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_2=Oh, let me go get them! I got a bit distracted.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_dandelions=Concentrate! Make sure to harvest the Dandelions using the tools so we don't upset the earth!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys=Did you hear that? The ground felt a bit... crunchy. Lets go find some poppies. Their red is so strong, it's perfect for the ruins.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_1=Yeah, lets go explore!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_2=If we must...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys=Quick, quick! Harvest some poppies using the tool, then bring me some poppies! They do so much work for the land.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_1=Here are some poppies!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_2=Oh, let me go get them!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_poppys=The Poppies! Make sure to harvest the Poppies using the tools!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys=Okay, one last thing... I think. Ooo! Lets go find some peonies. They’re like fluffy blankets for the dirt!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_1=Yeah, lets go explore!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_2=Sure...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys=Aren't they magnificent? Harvest some peonies using the tool, then bring me them! They're the final piece of our floral bandage!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_1=Here are some peonys!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_2=Oh, let me go get them!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_peonys=Don't forget! Make sure to harvest the peonies using the tools!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home=Oh! My basket is overflowing! And my feet are starting to tingle... I think that's enough. Lets head home.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_1=Yeah, lets go home!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_2=My legs hurt from all this walking :(
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up=That was lovely! The ground feels a little bit quieter already, doesn't it? Lets do that again at some point.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_1=Yeah, I enjoyed that too.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_2=It was alright, I guess. Not the biggest fan of flowers.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello=Hey, how's it going? I hope you're feeling flowery and ready to help the sprouts!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello.response_1=I hope you're feeling the same!

# Pumpkingdom - Non-Quest NPCs
skyblock_hub_dialogues.overworld.plains.pumpkingdom.cedric.hello=If you can smell burning, your face is likely too close to the fire. These potatoes are raw.

skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello=Whisper, please. The scarecrows are listening. Or maybe I'm just losing it.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello.response_1=Do you want a lucky pumpkin charm?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.detail_1=No. Absolutely not.\nIf I carry a lucky charm and it fails, I'll have to start believing in unlucky ones too.

skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello=Welcome, traveler. You're in Pumpkingdom. We've got world famous pumpkins here.\nAnything I can do to help entertain you?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_1=Sing me something.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_2=Why call it Pumpkingdom?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_3=I'm just passing through.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.verse_1=Oh, pumpkin, pumpkin, orange and bright,\n\
Waiting for a spooky night.\n\
With a funny smile or a scary face,\n\
You're the cutest pumpkin in the place.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.detail_1=Because saying "Pumpkin Village" sounded like we were asking to be raided.\nAlso the first mayor declared it with a carving knife, and nobody argued with the knife.

skyblock_hub_dialogues.overworld.plains.pumpkingdom.maeve.hello=Hello! I am Maeve. I like books, and I like reading. You can learn a lot from a book. Except reading. Learning to read from reading a book hasn't worked yet for anyone I tested it with.

skyblock_hub_dialogues.overworld.plains.pumpkingdom.quinn.hello=Do not touch the levers.\nActually, do touch it. Gently.\nI haven't got a clue what they do, so if it blows up... Don't look at me!

skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello=If you came for pumpkins, take the left path.\nIf you came for terrible jokes, congratulations. You're already lost.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_1=Tell me a terrible joke.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_2=I'll leave you to it.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1=How do you fix a broken pumpkin?\nWith a pumpkin patch!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1.response_1=That was genuinely upsetting.

# Pumpkin Towers - Potato Zombies
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce=Psst! You look like someone who can handle a shovel or a sword.\n\
We have a bit of a situation out here... Zombies are invading my fields.\n\
They're trampling the crops, chewing the fences, and worst of all, eating my potatoes!\n\
Could you lend a hand and save the harvest?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response1=Of course! I'm not scared of a few zombies.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response2=If you really want me to...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane=Mighty fine work there, buddy!\n\
If you have some time to spare... Could you pay my friend Susane a visit?\n\
She seemed to be struggling a bit with spiders around her pumpkins.\n\
Would you mind finding her and giving her a hand too?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response1=Let's squash some spiders!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response2=I'll keep your pumpkins safe!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks=Wow, you really showed those monsters who's boss!\n\
I can't believe you took out so many\n\
If only they'd stay gone for good... but for now, you've really made a difference!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks.response=Anytime, helping is my specialty!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hows_it_going=How're things holding up?\n\
Can you believe that those creatures took the place over just like that?\n\
Just our luck...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hello=Would you like to know a little secret?\n\
My real name is not actually Fred.\n\
People started calling me Potato Fred after that one time I got stuck in a pile of potatoes.\n\
I still don't know how I got out of there...

skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.see_fred=Howdy!\n\
These pumpkins aren't the only thing growing fast, the pests are too!\n\
My partner, Potato Fred, could sure use your help.\n\
Mind heading over to check on him?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred=AAAAGHH!\n\
SPIDERS! SPIDERS EVERYWHERE!\n\
They're ruining my pumpkins!\n\
Can you please help me get rid of them?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response1=EEK, SPIDERS!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response2=Of course, spiders don't scare me!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders=Did you deal with those spiders yet?\n\
I'm too scared to go back if they're not gone...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders.response=There is still some left...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.hello=Ah, I love to see my pumpkins doing well...\n\
Those stupid spiders always try to ruin everything!\n\
Let's hope they stay away for good this time...

# Plains - Pumpkin Towers - Susane & Kipp
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce=You there! You look like someone with a sense of justice! There's a certain mischievous little sprout running around stealing my prize-winning pumpkins for his 'projects.' You have to find him so I can give him a stern but fair talking to! Can you help me catch the culprit?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_1=I'll track the little rascal down!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_2=Alright, I'll help you get to the bottom of this.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going=Any luck finding that kid and his pilfered produce? My pumpkins are meant for the festival, not for target practice!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going.response=Still working on it, Susane!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete=There he is! The little devil! ...Wait, hold on. Is that a carved pumpkin? Look at the craftsmanship... he didn't ruin it, he improved it! Wow, that’s actually incredible. Thank you for bringing him and his art to me.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete.response=Happy to help clear up the misunderstanding!

skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce=Susane sent you to drag me back to the patch? Oh no... she’s going to be so cross! Please, don't bring me to her yet! I’m not a thief, I’m an artist! Look, if I bring her a peace offering... help me find my carving knife, and I’ll make something that will change her mind.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_1=I'll find your knife. Let's see what you can do.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_2=Alright, I'll look. Just don't cause any more chaos.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint=I last had it near the main pumpkin rows while I was scouting for a good canvas. It’s gotta be there somewhere!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint.response=I'm on it.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife=You found it! You're a lifesaver. I'll make this quick I’m gonna carve her a masterpiece that’ll make her forget all about the missing pumpkins!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife.response=Let's go. Fingers crossed!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.hello=I'm keeping my head down today. Art takes focus, you know?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.knife.dont_know=This knife is a strange thing to be left lying around like that. It’s got 'Kipp' etched into the handle. I should probably get this back to him.

skyblock_hub_dialogues.overworld.plains.cookhouse.basil.hello=Hear that? That's the sound of good food cooking. The people of Pumpkingdom are going to love it.\n\
Thanks for all of your hard work!

skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available=If you can smell dinner, it means I'm still winning. Barely. The coal bin's empty, and many furnaces cracked. Help me out before the whole Plains starts chewing raw potatoes.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.help=I can help.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.plan=What's the plan?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.breaking=Why are furnaces breaking?

skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.why_furnaces_break=Heat cycles, careless hands, and a little bad luck. One minute they're fine, the next they're cracked and bleeding ash. I can work around one broken furnace. I can't work around a broken cookhouse.

skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted=Perfect. I need three things, and I need them fast. Coal to keep the heat steady, furnaces to replace the busted ones, and potatoes so I can get something edible out the door.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted.response.all=I'll bring everything.

skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items=Every time I look away, someone 'checks' a furnace and leaves the door hanging open. Bring me coal, furnaces, and potatoes, and I'll turn the panic into dinner.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.deposit=I've brought supplies.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.working=Working on it.

skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.deposit_thanks=Good. Into the bins and onto the coals. Keep them coming.

skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage=That's everything. Fires are back, the line's moving, and the Plains gets to eat cooked food for the foreseeable future.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.glad=Glad I could help.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.save=One day we should cook some stuff together!

# Plains - Ruins - Lewis
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available=Ruins are not scenery. They are a route.\n\
Try practicing your skills in the ruins. You may very well be able to massively increase your mobility.\n\
Try reaching Robb who I saw playing in the ruins earlier.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.accept=Alright. I'll reach the platform.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.tips=Any advice before I start?
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.later=Not right now.

skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips=Pick your next landing before you jump.\n\
Take is slow. There's no need to rush up there.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips.response.okay=Got it.

skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete=Still down here? Then you have not reached the top of the ruins.\n\
Keep your eyes up and remain patient. You will reach the top of the ruins eventually.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.remind=Remind me where Robb is.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.go=Got it. I'm heading up.

skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location=Somewhere near the top I suspect. I lost sight of him as he got higher in the ruins.\n\
If you hear Robb laughing, you are close.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location.response.on_my_way=On my way.

skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete=Back in one piece I see. Good job.\n\
Was Robb behaving? Is it he in one piece? He sometimes has far too much confidence up there, but I trust him.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.remember=Yeah, he's fine
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.useful=He seems a bit young to be up there.

skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools=Yeah, he's young, but we don't really have too much to do around here.\n\
He plays on these ruins to keep himself entertained.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools.response.thanks=Oh, I see.

skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.after_completion=When you see broken stone now, you should be thinking: route, cover, escape.\n\
Very useful advise since the Zombies have become more prevalent around here.

# Plains - Ruins - Robb
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached=haha! i can't believe you made it!!!\n\
welcome to the top! there's so much to see from up here. it's pretty fun playing in the ruins isn't it?\n\
i was watching you fall off on the way up here. it's pretty funny seeing people try and get up here.\n\
was lewis being all serious again? maybe he wants me to come home.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.rough=So much fun!
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.easy=Lewis admires your ability to get around.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.trick=Can't believe I made it here too.

skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough=really really fun! hahaha! just look at the view. take it all in.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough.response.laugh=Haha! Yeah! I see!

skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy=i'm sure he does. i get around so fast. i'm the best at running around up here.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy.response.okay=Don't get too confident. It's dangerous.

skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick=practice makes perfect. you'll be more confident in the future up in the heights of the ruins.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick.response.got_it=Got it.

skyblock_hub_dialogues.overworld.plains.ruins.robb.hello=heeyyyy, how's the parkour practice. i'm sure you're getting better.


# Jungle - Treetop Tropics - Nilo & Billy
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.hello=Hey, how are you doing? Still alive? Good! Thanks for finding Billy, he’s lucky he’s cute or I might have turned him into a floor rug!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction=Oh, crisis! Absolute catastrophe! My cat, Billy, has gone missing again. He’s somewhere above us, probably plotting world domination or just looking for a bird to harass. Can you help me retrieve the beast before he decides to live in the canopy forever?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_1=Oh, that's terrible! I'll get him immediately.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_2=I'll have a look when I'm not busy dodging falling vines.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_3=I'm really busy right now. The jungle is a mess today!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks=BILLY! Oh, thank the stars! I can't believe you actually found him! He’s always so hungry it's like he’s got a black hole for a stomach. I'll go feed him some fish before he starts eating the jungle floorboards.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_1=No worries. I'm a professional cat-whisperer.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_2=MORE FISH? THAT CAT IS A BOTTOMLESS PIT!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking=How's it going? Any sign of the furry fugitive?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking.response=Still trying. Cats are sneaky, and Billy is a professional ninja.

# Billy the Cat
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found=Meow <italic>(Looks at you with a smug, knowing smile)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found.response=Come with me, you little troublemaker. Let's get you home.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1=Meow <italic>(Tummy rumbles like a thunderstorm)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1.response=Here, have some fish. Stop growling!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2=Meow <italic>(Looking at you expectantly)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2.response=Here, have some more fish.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3=Meow <italic>(The rumble continues!)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3.response=Is this cat a bottomless pit? Fine, fish!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4=Meow <italic>(Unimpressed)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4.response=Here is the fourth fish. Seriously, Billy?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5=Meow <italic>(Finally looks satisfied)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5.response=Finally! Let's go home.


# Jungle - George - Fishy Business
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction=Ah, the gentle tug on the line, the absolute thrill of the catch! My passion for fishing is legendary, though I haven't been able to cast a line in such a long time. My family is here in the jungle, and I wouldn't trade them for all the oceans in the world, but oh, how I miss the water! You simply have to give it a shot it’s pure magic!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_1=Okay! You've convinced me!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_2=Is it really that good? I guess I'll give it a shot.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_3=Not right now, George.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch=How are you enjoying the fishing? Find that rhythm yet? I hope you're getting some legendary catches!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch.response=I'm working on it, George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit=Once you've caught enough fish, give them to me for some close inspection!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit.response=Here you go.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks=I told you it'd be fun! Look at all these beauties, you’ve got a real talent for this! Thank you for sharing the thrill with me; fishing is just such a great time, and even better with friends. Shame I wasn't able to make it to the lake myself!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks.response=Any time, George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.hello=Hello! The water is fine, even in the jungle! Ready to cast a line? But you know what would make it even better?\nCatching some fish with such a close friend!


# Jungle - Celia - Bean to Bar
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.hello=Hello. Is chocolate your favourite jungle food? I hope so!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.come_back_for_sugar=Hello. If you come back to me once you've got sugar, I can show you how to sweeten your chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available=You there. Want to learn how to make chocolate? Lovely and tasty chocolate. Even though it's unhealthy for you, you might be able to get a burst of energy from it.\n\
Let's start with unsweetened chocolate. Chocolate without sugar is a far healthier alternative.\n\
I'll give you the recipe, but you'll need to go away and make it. Let me know how it goes.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_1=Yum! Chocolate!!!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_2=Oh no, I hate chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.in_progress_craft=How's the chocolate making going? I hope that unsweetened chocolate is living up to your expectations.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete=So? Give me the report.\nWas it bitter? What side effects did you get from it?\nSo many people start wizzing around after eating chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_1=Bitter, but brilliant.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_2=I think I need water.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available=Hey again. So, you want to learn how to put sugar into your chocolate? Let's do this.\n\
You know the drill. I'll give you the recipe, but you'll need to go away and make it. Let me know how it goes.\n\
Be careful: Chocolate is not healthy, and should always be consumed in moderation.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_1=Yeah, let's make more chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_2=I'm being health conscious now, but sure.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft=How's the sugar addition going into the chocolate? Before you know it, you might be working towards a chocolate empire.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_1=I've got this. It's easy.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_2=I'm not very good at making chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete=You did it! Chocolate. Fully and rich as I'm sure you'd hoped.\nNow be sensible and don't go running round too crazily with that massive sugar rush.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_1=Don't worry, I'm very mature with chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_2=The sugar crash is going to hurt.

# Jungle - Treetop Tropics - Non-Quest
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello=Bare with me a minute. I just need to check on these Cocoa Beans. Maybe they're ready.\nOh wait, what about these ones...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello.response_1=I see you're very busy right now.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello=I built some of these platforms when they failed. I really hope that my engeneering is good enough for them to stay fixed.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_1=You built all this? That is impressive.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_2=You look like you are about to faint.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1=Thank you. Well, not all of it. I just fixed up bits when they get broken.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_1=So many railings. Personal preference?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_2=Scared of heights...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_railings=Yes.\n<italic>(He grips the railing with both hands.)</italic>\nFear of heights results in extra safety measures.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_advice=Don't make fun of me. It's not my choice I was born this way.\nAlthough I guess it's my fault for helping out up here. I wish I was an angler on the ground.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_2=Have you seen the height we're at!? We're so high, and I'm afraid of heights! It might be some altitude sickness kicking in.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello=Hey, you there, you want a horrible joke?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_1=All right. One joke. Make it hurt.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_2=No thank you. I value peace.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu=Choose wisely. The jungle has many predators, but none as relentless as my punchlines.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_1=Hit me with a leaf joke.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_2=Give me something spider-related.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_3=Fine. Make cocoa funny.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_1=I tried to quit the jungle, but the vines said, "No, you stay."\nSo I guess I am stuck in a long-term re-leaf-tionship.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_2=What do you call two newly married spiders?\nNewly webs!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_3=My cocoa never ripens in time for being eaten. It's always too choco-late.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.avaru.hello=Hey! What a lovely day! Great to meet you! Look forward to seeing you around!

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cressida.hello=LOOK AT THE SIZE OF THIS TREE! IT IS SO BIG! :O\nI wonder how it gets water all the way to the top!

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello=If you see an ocelot, do not chase it. It is very scared of you.\nThis advice applies to people too.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello.response=I will practice my best unimpressed face.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.silva.hello=Hey, look where I am! I'm under a tree!\nI used to be scared of it, but then I noticed its roots. They are cubes. So mathematically I just view this tree as one dimensional, because I am looking at the cube root of it.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello=You've got the look of someone fresh out of the Oak Forest.\nWelcome to the jungle, traveller. You'll need to get used to climbing high in the trees. I hope you're not afraid of heights.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_1=Good to know. I'm good with heights.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_2=Oh dear, I'm not going to cope well.

skyblock_hub_dialogues.misc.optimiser_not_unlocked=Hello! I am the Optimiser! I can boost the production of all your resources.\n\
I'm quite picky who I'm happy to work with, so please come back once you've progressed further!

# Shop Dialogues
skyblock_hub_dialogues.shop.blocks.greeting=G'day, you won't find better blocks anywhere else! Want to take a look?
skyblock_hub_dialogues.shop.blocks.greeting.buy=What do you have for sale?
skyblock_hub_dialogues.shop.blocks.greeting.sell=Let me sell you some stuff!
skyblock_hub_dialogues.shop.blocks.greeting.nothing=No, thank you!

skyblock_hub_dialogues.shop.furniture.greeting=Beautiful furniture for a lovely person! Can I interest you in some?
skyblock_hub_dialogues.shop.furniture.greeting.buy=Show me what you've got!
skyblock_hub_dialogues.shop.furniture.greeting.sell=I've got some things to sell.
skyblock_hub_dialogues.shop.furniture.greeting.nothing=I'm good for now, thanks.

skyblock_hub_dialogues.shop.garden.greeting=I've got everything to keep your garden blooming! Interested?
skyblock_hub_dialogues.shop.garden.greeting.buy=Show me what you have for sale!
skyblock_hub_dialogues.shop.garden.greeting.sell=I would like to sell some things.
skyblock_hub_dialogues.shop.garden.greeting.nothing=No, thank you!

skyblock_hub_dialogues.shop.misc.greeting=I see you looking around! What caught your eye?
skyblock_hub_dialogues.shop.misc.greeting.buy=What can I buy here?
skyblock_hub_dialogues.shop.misc.greeting.sell=Actually, I have some things to sell.
skyblock_hub_dialogues.shop.misc.greeting.nothing=Nothing for now, thanks.

skyblock_hub_dialogues.shop.ore.greeting=All the ores your heart desires! Care to take a look?
skyblock_hub_dialogues.shop.ore.greeting.buy=Show me your ores!
skyblock_hub_dialogues.shop.ore.greeting.sell=I want to sell you some stuff.
skyblock_hub_dialogues.shop.ore.greeting.nothing=Not right now, thank you.

skyblock_hub_dialogues.shop.spawner.greeting=Ready to spawn more mobs? I've got just what you need!
skyblock_hub_dialogues.shop.spawner.greeting.buy=Show me what you've got!
skyblock_hub_dialogues.shop.spawner.greeting.sell=Actually, I would like to sell some things.
skyblock_hub_dialogues.shop.spawner.greeting.nothing=Maybe next time, thanks.

# Cold Taiga - Ivar - Frozen Harvest
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro=Winter’s got a grip that won't let go, and the grain stores are running dangerously low. I need to ensure everyone stays fed through the freeze. Can you get out there and gather me some wheat?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro.response.accept=Sure, I'll help you out! The village needs it.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources=Keep your head down and your hands moving. How's it going harvesting that wheat?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources.response=Still working on it! The frost is tough to cut through.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro=Glad to see you back. Find anything for the stores?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro.response.yes=Here's the wheat, freshly gathered!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks=Solid work. This will keep the belly of the village full for another few days. See you around!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks.response=Happy to help!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello=How's it going! Don't let the cold settle in your bones.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello.response=Wicked! Keepin' warm!

# Cold Taiga - Felix - Winter Warmth
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro=The chill is really settling in tonight, isn't it? I’m trying to keep everyone cozy, but we’re running low on fuel for the fireplaces. Could you gather some spruce logs for me so we can stay warm?
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro.response.accept=Sure, I'll help you out! Anything to keep the village cozy.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro=Oh, you're back! Did you manage to find some spruce logs? The chill is really settling in here, and my family and I are getting a bit cold!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro.response.yes=Here are the spruce logs!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks=Perfect. Thank you so much for your help. You really have the kindest heart, it makes this place feel so much more like home.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks.response=Happy to help!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello=Hello! It's so nice to see you. I hope your day has been as wonderful as you are!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello.response=Hey there! Stay warm!

# Cold Taiga - Felix - Warmth in the Cold
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro=Thanks for helping out keeping us warm. Would you mind assisting in getting some Snowberries, Spruce Bark Crumbs, and Powdered Lapis Sugar?\nThese are some rare resources found around the Snowy Taiga, but can be valuable to your survival.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro.response.accept=I'll gather those for you!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro=Have you found the ingredients I need?\n\
They can all be found in the Snowy Taiga: The Snowberries prefer to be around berry bushes. The Powdered Lapis Sugar is formed on the surface of frozen lakes, as it dissolves into the water from the rock below. Finally, the Spruce Bark Crumbs are the hardest to find, however, you should be able to find it next to spruce trees.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro.response.yes=Let me give you what I have!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks=Excellent! Now, I've heard that Snowberries can be quite helpful in dungeons. They restore your health and give you that extra layer of protection!\nCould you test them for me? Try eating some Snowberries while you're exploring a dungeon and let me know how they work!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks.response=I'll test them out!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress=Have you tried eating the Snowberries in a dungeon yet? I'm curious to hear if they're as helpful as I think!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress.response=Not yet, I'll go try them!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete=Oh, so the Snowberries did help in the Dungeon! That's great to hear! Whenever I eat one it feels like it gives me a nice warm hug.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete.response=No problem!

skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro=The deep ice has been moving lately, revealing veins of blue that shouldn't be there. I need lapis for my research. Can you gather some using a range of tools? I want to see if the extraction method changes the gem's resonance.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro.response.accept=Sure, I'll help you investigate!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress=How's it going breaking lapis with different tools? Any unusual vibrations in the stone?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress.response=Still at it!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro=Excellent. Can I have those lapis gems that you broke with different tools? I need to compare the structural integrity of each batch.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro.response.yes=Here you go!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks=Thanks. Just wait a second while I check these...\n\
...\n\
Well, that’s disappointing. The crystalline structure hasn't changed at all. They're identical. That was a great big waste of time.\n\
At least we’ve confirmed that simple physics still applies here and that wooden tools are completely useless for this depth.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_1=Oh, that sucks. Science is trial and error, right?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_2=I'm not sure what you expected, honestly.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello=The ice tells stories if you look deep enough.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello.response=It really does, doesn't it...

# Cold Taiga - Sigrid - Feather and Grain
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro=The frost is biting deeper this season, and with the canyon floor shivering the way it does, we must look out for one another. We survive together, or not at all. Can you help me prepare a hearty stock for the village?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro.response.accept=I'll get to it! No one should go hungry.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro=Oh, you're back! Come closer to the fire, dear, I can see the chill on your shoulders. How's the gathering coming along?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro.response.yes=Here is the food you asked for!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks=Bless your heart. This will keep the little ones warm and the elders' spirits high. It's shared effort like yours that keeps the ice from reaching our hearts.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks.response=Glad I could help the community!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello=Hello there! There’s always a warm seat and a kind word waiting for you here.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello.response=Hi!


# Cold Taiga - Inga - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.before_unlock=Shiverfield's always hungry this time of year. If you're looking for a meal, speak to Sigrid. I keep my hands full here.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro=Careful! Don't step there. They'll swarm your boots like you've got grain in your pockets.\n\
\n\
I started with a few hens. Just enough to keep the ovens going when the frost bites hardest.\n\
\n\
But lately? It's like winter can't touch them. The purple blight spreads, folk go hungry, and my chickens multiply like they're mocking us.\n\
\n\
They're everywhere. In the snowbanks. On the roofs. Pecking holes in sacks we can't replace.\n\
\n\
I can't just... cut them down. They're mine and they're living. I raised them.\n\
\n\
Please. Talk to Runa at the Shiverfield Guard. She'll know what to do. I just need an answer that doesn't make my stomach turn.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_1=I'll talk to her.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_2=Chickens taking over a town. That's new.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.in_progress=If you see them in the streets, just... don't chase them for fun, alright? They trust people. That's the worst part.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete=Your hands smell like feathers.\n\
\n\
...Don't lie. I can see it in your eyes.\n\
\n\
You did what Runa told you to do, didn't you?\n\
\n\
I hate it. I hate that it makes sense.\n\
\n\
Shiverfield needs food. And arrows. And winter doesn't care about what we want.\n\
\n\
Next time I tell myself I can keep everything safe with kind intentions, remind me of this.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_1=I'm sorry. We didn't have another option.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_2=Your flock was feeding the town, one way or another.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_3=I'll help you rebuild the coop so it doesn't happen again.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.after_completion=I still like chickens. I just like Shiverfield more.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello=Hello.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello.response=Hi!

# Cold Taiga - Runa - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro=Inga sent you. I heard the flock before I saw you.\n\
\n\
Look, I don't enjoy this. No one here does.\n\
\n\
But the roads are worse now. Hunters don't come back as often. The purple corruption makes the woods feel wrong, like the shadows are listening.\n\
\n\
We have a town to feed, and a town to defend from the strange happenings.\n\
\n\
Chickens mean meat for the hungry and feathers for fletching. Without arrows, us guards become a wall of empty hands.\n\
\n\
You're going to have to harvest ten. Bring me ten feathers. We won't waste what we take.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_1=Understood. I'll handle it.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_2=Inga won't be happy.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_3=I'll make sure it helps the town.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.in_progress=We need to thin the number of the chickens a bit more. They're overrunning everything still.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro=Do you have those feathers?\n\
\n\
They are very valuable to the guard, as they'll make plenty of arrows.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_1=Yeah, here they are.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_2=I did not like killing those chickens.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks=Plenty. Enough to keep the guard stocked for a bit.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks.response_1=Good.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.after_completion=If you can keep Shiverfield fed, you keep it alive. That's the job.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello=Stay careful out there. The guard can protect you nearby, but in the depths of the tundra, it's your own responsibility.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello.response=I'll be careful.

# Cold Taiga - Kjell - Corrupted Curiosity
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available=Watch your step! These chickens have gone rouge!\n\
Something's up with them, and they're attacking me. Very strange behaviour.\n\
I'm Kjell. I am somewhat of a scientist. I loved studying chemistry at school, but I think I have a hunch as to what's going on here.\n\
Mind getting me of those corrupted chickens for me to insect further?
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_1=Oh dear, evil chickens. On it!
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_2=I'll help you get to the bottom of this.

skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro=You got that corrupted chicken? I can't wait to get to the bottom of this curse.\n\
Oh, and whatever you do, don't eat it. It looks like a terrible idea and has no upsides.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro.response_yes=I have the chicken.

skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit=Great! You got it! Lets have a look and see what we've got here then...\n\
...\n\
Oh, I think it's alive? That purple stuff. It's not a rock.\n\
Well... that's all I can do to help. I said I was good with chemistry, not biology.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_1=Alive? Oh dear...
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_2=I guess we'll need to keep looking

skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.hello=If you get any more answers on what this purple stuff is, I'm so keen to know. I can't believe it's alive!


skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.dungeon_guard.introduce=Woah! Did I hear you were hear to help out?\n\
We've got a massive problem down in our brand-new mines.\n\
We were digging trying to harvest lots of valuable lapis lazuli from the reserves under the lakes.\n\
However, we've been overrun! There are so many monsters and creepy crawlies. They seem to want the lapis for themselves.\n\
Will you help us out?

skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro=The heat isn't the only thing wearing us down; the very foundation of this oasis is shifting. We need sandstone to reinforce the anchors before the sand swallows what’s left of the surface. Can I count on your strength?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro.response.accept=I'll help you secure the foundations!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro=Steady now. Did you manage to secure the sandstone I requested for the reinforcements?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro.response.yes=I have the materials right here!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks=This will buy us some time against the subsidence. Every stone placed is a shield against the inevitable slide. Thank you.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks.response=Glad I could help keep the desert stable.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello=Keep your feet light and your eyes on the horizon. The desert never stops moving.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello.response=I'll stay alert, Zahra. Thank you.

# Desert - Unsafe Roads
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro=The routes are becoming treacherous; the sand is swallowing the markers faster than we can place them. Can you bring me some sandstone so we can reinforce the routes?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro.response.accept=I'll get that for you.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress=The dunes are restless today. Have you found enough? We have to make sure we have enough to anchor the path.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress.response=I'm still looking...
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return=Well done. The crew reports the supports are holding. Awareness is our best defense out here. Thank you.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return.response=Any time!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello=Eyes up. In this desert, if you aren't tracking the danger, the danger is tracking you.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello.response=Hey!

skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.intro=Talib sent you? Good. The ground is soft here and the dunes are creeping in. Got that sandstone?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.response=Here it is.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks=Thanks, this will make the road much firmer. The earth is less likely to slide with this in place.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks.response=Great!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello=A fine day to build, provided the wind doesn't decide to take our progress back.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello.response=It sure is.

skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.intro=The tremors are rattling the passage walls. The mud bricks will help stabilize the path. Do you have them?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.response=Yes, here they are.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks=Perfect, these are exactly what we needed to buffer against the vibrations.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks.response=Happy to help.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello=Be careful on the roads. The desert has a way of opening up when you least expect it.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello.response=I will.

skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.intro=Without a heavy foundation, the sand just drifts. Granite is essential for the foundation. Did you bring any?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.response=I have granite right here.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks=This is some high-quality granite! It’s heavy enough to resist the tremors. Thank you.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks.response=You're welcome.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello=The desert can be unforgiving to those who build on shallow ground.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello.response=Tell me about it.

skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.intro=We need to brace the overhangs before they collapse. Finally, some wood for the supports! Did you get the spruce planks?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.response=Yes, spruce planks as requested.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks=Excellent! We've got everything reinforced now. Go let Talib know.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks.response=On my way!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello=Hard work is the only thing the sand can't erode.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello.response=It certainly does.

skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro=The days are getting hotter and the nights more uncertain. We need reserves to ensure the settlement doesn't crumble. Will you help me secure our future?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro.response.accept=I can help with that.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro=Steady now. Every supply counts when the sands begin to shift. Do you have any reserves for the stock?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_1=Yes, I have them.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_2=Of course! I'm always happy to help!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.no=Oh sorry! Not right now!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks=Methodical work pays off. These supplies will keep us standing through the long nights ahead. Thanks.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks.response=You're welcome.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello=The desert shows no mercy to the unprepared. Stay safe out there.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello.response=You too.

skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro=The shifting sands are unearthing things that should have stayed buried. Routes are getting buried in Zombies, and it's making travel impossible.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro.response.accept=I'll take care of them and clear the path.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro=The air feels a bit lighter with those monsters gone. Have you got any Zombie flesh for me? I need proof the dunes are safer.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_1=Eww, rotten flesh. You can have it if you want.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_2=I guess I can spare a few for the cause.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon=The threat never truly fades out here. Come back once you've cleared the dunes.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_1=Will do! It's coming on well!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_2=Zombies scare me D:
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response=Will do.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete=With your help, we've secured this stretch of the road. We're such a powerful team!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_1=Glad to help keep the roads open.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_2=Totally agree!
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello=The desert hides many dangers beneath its surface. Stay vigilant.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_1=Hello.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_2=Hope you're doing well!

skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro=In a land that tries to kill everything soft, only the sharpest survive. Cactus is useful, it provides water, defense, and pigment that doesn't fade in this glare. Bring me some.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro.response.accept=I'll get right on that.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro=The sand is moving again. Have you got the cactus to help us fortify the perimeter?
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro.response.yes=Here it is.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks=This will endure when other things wither. It's a hard plant for a hard world. Thanks.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks.response=You're welcome!
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello=The heat, the sand, and the time, they strip away everything but the truth. Oh hey, I was talking to myself...
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello.response=Hi!

skyblock_hub_dialogues.overworld.desert.duneside.azim.hello=Sorry, am quite busy now. I'm trying to build a wind turbine. So much energy to be captured in the wind. We don't want to make the desert temperature hotter by burning coal.

skyblock_hub_dialogues.overworld.desert.duneside.todd.hello=Hey there! I'm Todd!\n\
Don't mind me, I'm just guarding this door to make sure none of the creatures inside escape. This is the Duneside escape tunnel, but it's been overrun with creatures.\n\
If you want to help, Sunny's at the bottom of the escape tunnel. I fear she's struggling to clear it alone.\n\
You can't come this way, so you'll need to find the other end at the bottom of Duneside.

skyblock_hub_dialogues.overworld.desert.duneside.bashara.hello=Do not step on the darker sand. I believe there is something mysterious under it.

skyblock_hub_dialogues.overworld.desert.duneside.corvin.hello=I don't remember these stones here. I really hope that the ceiling isn't collapsing.

skyblock_hub_dialogues.overworld.desert.duneside.derya.hello=Thirst makes us struggle. I sell something that helps, even if everyone hates it.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_1=People hate it?
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_2=Nice to meet! I'm just passing through.
skyblock_hub_dialogues.overworld.desert.duneside.derya.detail_1=I sell cactus-water. It's not regular water. It's a bit sweeter I guess.\nEveryone fears it because I'm not very good at getting the cactus spines out.

skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello=Hold out your hand. I can read your future...
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_1=Alright. Read my future.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_2=No thanks.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1=I see three shapes.\nA cactus. A doorway. And a very annoyed zombie.\nSo I'm guessing your future entails all of these things.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_1=Doorway?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_2=Annoyed zombie?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_3=This is nonsense.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_doorway=I can't read more than that unfortunately. I just saw a doorway in my vision. Maybe this becomes a very important doorway to you.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_zombie=Haha! You're clearly going to annoy a zombie in the future.\nI've never seen a zombie show any sort of emotion before, so you must really annoy it.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_nonsense=Of course it is.\nNonsense is lighter to carry than certainty. I'm just here to boost the morals of the people around me.

skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello=Ughh, sand tastes disgusting. It keeps blowing in my mouth.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello.response_1=Why stand so close to the sand?
skyblock_hub_dialogues.overworld.desert.duneside.vesper.detail_1=I've got places I need to be! I'm not going to let the sand get in my way.

skyblock_hub_dialogues.npc_name.devin=Devin
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello=The developers of this game say that it's hard to keep coming up with some many dialogues for different NPCs, so they just copy-pasted some of them.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_1=How lazy.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_2=I've not experienced that. I'll keep an eye out

skyblock_hub_dialogues.overworld.desert.duneside.dungeon_guard.introduce=Hey! Can you believe it! The duneside escape tunnel has been overrun by evil creatures!\n\
The escape tunnel is critical to our survival. Many strong sandstorms bury the main entrance to Duneside, and the escape tunnel is our only backup!\n\
I've been authorised to use an old system of ours to flood the tunnel with Lava to help serilize it. I'm out of breath just walking down here, so I don't think this is a good idea for me to tackle this.\n\
Would you be up for it?

# NPC Names
skyblock_hub_dialogues.npc_name.alder=Alder
skyblock_hub_dialogues.npc_name.thorne=Thorne
skyblock_hub_dialogues.npc_name.bram=Bram

# Alder Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.before_unlock=Busy day. Trees to tend, wood to process. Come back later if you need something.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available=You helped Ronan patch up the damage from those tremors, didn't you? Good work. But we can't just keep repairing cracks every time the ground decides to move. I've been thinking... the old oaks have stood through worse. Their roots spread wide, flex with the earth. Maybe we can learn from them. Want to help me test something?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.what_thinking=What are you thinking?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.got_time=I've got time. What do you need?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.not_now=Not right now, sorry.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation=Bram and I have been discussing flexible foundations structures that move *with* the ground instead of cracking against it. The forest already does this. Every time wind hits the canopy, the roots absorb the stress. If we can replicate that principle... well, next time something shakes, maybe the buildings bend instead of break.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.how_help=How do I help?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.complicated=Sounds complicated.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.think_about=I'll think about it.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response=It's simpler than you'd think. Nature's already solved the problem. We just need to observe and adapt. Start by looking at the Ancient Oak its roots have been holding steady for decades. That's where the answer is.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.im_in=Alright, I'm in.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.come_back=Let me come back to this.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions=Perfect. There's someone you should talk to first Thorne. He's a tree researcher who's been studying the Ancient Oak for weeks now. He's set up camp near it. If anyone understands how those roots stay stable through tremors, it's him. Go find Thorne and see what he's learned.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions.response.find_him=I'll find him.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active=Thorne's still at the Ancient Oak, studying those root systems. Go talk to him he'll explain better than I can.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active.response.on_way=On my way.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return=You're back. What did you see?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.roots_web=The roots spread everywhere like a web.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.big_tree=It's just a big tree.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.correct_observation=Exactly. A web. Each root supports the others. When the ground shifts, the whole network flexes together no single point of failure. That's what buildings need. Not rigid blocks that crack under pressure, but interconnected supports that distribute stress. Bram can design the lattice structure, but we'll need materials. Lots of them.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.playful_correction=Look closer next time. That 'just a big tree' has survived centuries by being smarter than we are. Its roots spread wide and deep when the ground moves, the whole network flexes. That's the secret. Anyway, you saw enough. Now we need materials to build something similar.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions=Here's what we need: First, gather oak saplings. Not planted ones, natural ones. I want to study their early root patterns and use them as living shock absorbers around key structures. While you're doing that, we'll need crafted components. Bram will need oak slabs. They distribute weight better than full blocks. And oak fences. They'll create flexible lattice supports, like roots intertwining. You can work on all of this at your own pace. Come back when you've got the saplings, and deliver the crafted pieces to Bram.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.got_it=Got it. Saplings, slabs, fences.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.why_saplings=Wait, why saplings?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.lot_crafting=That's a lot of crafting.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_explanation=Young trees adapt faster. If we plant them near foundations, their roots will grow into the support network naturally. Plus, studying their early growth tells us how to shape the wooden lattices. Living and built structures working together that's the goal.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.workload_acknowledgment=It is. But if we're going to make this work, we need to do it right. Take your time. The forest doesn't rush, and neither should we.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check=How's the gathering going? I need those sixteen oak saplings whenever you can manage it. And don't forget Bram's waiting on the slabs and fences.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.working_on_it=Still working on it.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.remind_me=Remind me what you needed?

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.requirements_reminder=Sixteen oak saplings for me. Sixty-four oak slabs and thirty-two oak fences for Bram. All oak wood.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered=You've got the saplings! Let me see those. *(examines them)* Good specimens healthy root systems starting to form. These will integrate perfectly with the lattice supports once Bram finishes construction. Excellent work.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.what_do=What will you do with them?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.happy_help=Happy to help.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.planting_strategy=I'll plant them strategically around the buildings' perimeters. As they grow, their roots will create natural reinforcement living foundations that flex with the ground. Combined with Bram's wooden supports, we'll have a hybrid system. Best of both worlds.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram=The saplings are perfect. Now we just need Bram to get his materials. Have you delivered the slabs and fences to him yet?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.working=Working on it.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.not_yet=Not yet.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete=You've done everything we asked and more. Bram's already started assembling the lattice framework, and I've planted the saplings around the critical structures. When the next tremor comes and it will this village won't just hold together. It'll adapt. You've helped us build something that learns, something that lasts. The forest provides, but you made sure we were listening. Thank you.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.will_work=Will this really work?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.glad_help=Glad I could help.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.another_tremor=What happens if there's another tremor?

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.confidence=I believe so. The principles are sound nature's been using them for millennia. Bram's craftsmanship is solid. And you've given us exactly what we needed. If the ground shakes again, we'll be ready.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_readiness=Then we'll see if our engineering holds up. But even if it doesn't, we've learned something. That's how progress works observe, adapt, improve. The forest teaches that every season.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion=The flexible foundations are holding well so far. No tremors yet, but when they come, we'll be ready. Still tending the saplings they're growing nicely. Thanks again for your help.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.good_hear=Good to hear.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.other_projects=Any other projects?

skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_projects=Always something to improve. But for now, I'm focused on this. The forest provides I just help it along.

# Thorne Dialogues
skyblock_hub_dialogues.overworld.oak_forest.thorne.before_quest=Oh! Hello there. I'm Thorne dendrochronologist. That's a tree age researcher, in simpler terms. I've been documenting the Ancient Oak's root architecture. Fascinating specimen. Been here almost three weeks now and I'm still finding new branching patterns!

skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction=Alder sent you? Excellent! He asked me to explain my findings, didn't he? Well, you've come to the right place. This oak *(gestures at the massive tree)* is over 300 years old, and its root system is absolutely remarkable. See how the roots spread outward in this interlocking lattice? Each primary root branches into secondaries, which branch into tertiaries... it creates redundancy. If one section is damaged or stressed, the load distributes across the entire network. During that tremor last week, I watched the ground shift you could actually *see* the roots flexing, absorbing the movement. The tree barely swayed. That's the secret: flexibility plus interconnection equals stability.
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.roots_web=So the roots work like a web?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.help_buildings=How does that help buildings?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.incredible=That's incredible.

skyblock_hub_dialogues.overworld.oak_forest.thorne.web_confirmation=Precisely! A three-dimensional web that moves as one organism. No single point of failure. If Alder and Bram can replicate that principle with wooden supports, the buildings will survive tremors far better than rigid stone foundations ever could. Nature's been perfecting this design for millions of years we're just borrowing the blueprint.

skyblock_hub_dialogues.overworld.oak_forest.thorne.buildings_explanation=Ah! That's where Alder's brilliance comes in. He wants to build support structures that mimic this root network interconnected wooden lattices that can flex under stress instead of cracking. Add living saplings around the perimeter, and as they grow, their actual roots will integrate with the built structures. Hybrid engineering. It's genius, really.

skyblock_hub_dialogues.overworld.oak_forest.thorne.enthusiastic_response=Isn't it? I could study this tree for years and still learn something new every day. But Alder needs practical applications, not just academic observations. Go tell him what you've seen the network structure, the flexibility, the load distribution. He'll know what to do with that information.

skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1=Did Alder find my observations useful? I hope so. Trees have so much to teach us about resilience and adaptation.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.working_on_it=He's working on it.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.what_else=What else have you learned?

skyblock_hub_dialogues.overworld.oak_forest.thorne.other_learnings=Oh, where do I even start? The growth ring patterns suggest this area experienced significant seismic activity about 80 years ago much worse than last week's tremor. Yet the tree survived. I've also been tracking fungal networks in the soil they connect multiple trees underground, sharing nutrients and information. The forest is far more interconnected than most people realize.

skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion=I heard Alder and Bram finished the flexible foundations! Using my root research for practical engineering I'm honored. The forest truly does provide, doesn't it?
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.thanks=Thanks for your help.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.studying_now=What are you studying now?

skyblock_hub_dialogues.overworld.oak_forest.thorne.acknowledge_thanks=My pleasure! It's rare that my research has immediate real-world applications. Usually I just publish papers that three other dendrochronologists read. This was... refreshing.

skyblock_hub_dialogues.overworld.oak_forest.thorne.current_research=I'm examining bark erosion patterns now. Trying to correlate them with historical weather data. Not as exciting as earthquake-proof root systems, I'll admit, but still valuable for understanding the forest's history.

# Bram Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.before_quest=Working. Come back if Alder sends you.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.quest_accepted=Alder mention me? Good. Let me know when you've got materials ready.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages=Alder told me about the flexible foundation plan. Smart thinking. I'll handle the lattice construction, but I need precision materials. Sixty-four oak slabs and thirty-two oak fences. Slabs distribute weight without cracking. Fences create interlocking supports. Bring them when you're ready.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.get_crafted=I'll get them crafted.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_slabs=Why slabs instead of full blocks?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_fences=Why fences?

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.slabs_explanation=Full blocks are rigid. Rigid breaks. Slabs are thinner they compress slightly under stress, then spring back. Flexibility without failure. That's what we need.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_explanation=Fences interlock. One post connects to the next. When force hits the network, it spreads across all connection points. No single piece takes the full load. Same principle as tree roots. Just wood instead of soil.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials=Still need those slabs and fences. Take your time. I'd rather wait for quality than rush bad work.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.almost_done=Almost done.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.remind=Remind me what you needed?

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.requirements_reminder=Sixty-four oak slabs. Thirty-two oak fences. All oak.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.still_need_fences=Still need the fences. Bring those, and we can start building.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered=Fences. *(tests one)* Solid joints. These'll form the lattice. Good work.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.everything=Everything you need now?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.thanks=Thanks.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.have_everything=With the slabs and fences, yes. Alder's handling the saplings. I'll handle construction. Check back with Alder when you're ready.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_alder=Materials are in. I'm starting assembly. Talk to Alder he'll want to finalize the plan.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion=Lattice is installed. Foundations are holding. Strong work lasts.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.good=Good to hear.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.hold_tremor=Think it'll hold in a tremor?

skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.confident=Built it right. Used the right materials. It'll hold.

# Ring The Bell
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.ring_the_bell.investigate=You give the bell a firm pull. It rings bright and clean.\n\
Daytime bell. Daytime quiet.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.hello=The bell hangs still.

skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.locked=Sorry, I can't do the whole 'welcome speech' thing.\n\
If Cubit hasn't pointed you around the square yet, start there.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.in_progress=Try the bell in the square, then ask Levi, Sandy, Liora, and Lee if they've heard anything at night.\n\
Then come back to me.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello=Hey.

skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available=Hey. You're the new face Cubit has been parading around, right? Good. Then you'll have fresh ears.\n\
Listen... have you heard the bell at night?\n\
Not the daytime ring. Not the cheerful kind. I mean the kind that makes your stomach drop.\n\
I keep waking up to it. And when I run outside... nothing.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.bell_at_night=The town bell? At night?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.dream=Maybe it was a dream?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.what_do=What do you need me to do?

skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request=Go to the square and test the bell. Then ask a few people if they've heard anything strange after dark.\n\
Levi and Sandy were with Cubit when you arrived, right? Start with them. And talk to Liora and Lee too.\n\
If nobody else has heard it... then the problem is me. But I need to know.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.on_it=Alright. I'll ask around.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.why_me=Why ask me?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.are_you_ok=Are you okay?

skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.why_you=Because you don't owe me a comforting lie.\n\
People who know you will try to be kind. People who don't will just tell you what they heard.\n\
And I need the truth.

skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.are_you_ok=I'm... managing.\n\
Just go listen for yourself. If I'm wrong, I want to be wrong on purpose, not by accident.

skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete=So. Nobody heard it.\n\
That's... a relief. And also not.\n\
When it happens again, I'll try to remember this feeling. That it can be quiet out there, even if my head is loud.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.not_alone=You're not alone in this.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.something_else=Maybe it's something else, not the bell.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.tell_me=If it happens again, tell me.

skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_not_alone=...Thanks. I don't always remember I can ask for help.\n\
I'm trying.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_something_else=Maybe.\n\
Sometimes sound travels weird through wood. Through roots.\n\
Sometimes you hear a thing that's real, just not where you think it is.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_tell_me=I will.\n\
And if I sprint outside in the middle of the night again... at least I'll have a reason besides panic.

skyblock_hub_dialogues.overworld.oak_forest.chris.hello.after_ring_the_bell=Hey. Thanks again for checking.\n\
If the bell ever really does ring, you'll probably be the first to know.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked=Bell at night...? Mmm.\n\
I hear lots of things at night.\n\
My blanket. My stomach. The wind.\n\
One time I heard a cookie calling my name. Turned out it was just... me. Calling the cookie.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.no=So you haven't heard it?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.worried=Chris is worried. Can you think of anything?

skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.nope=Nope. If the bell rang at night, I'd wake up.\n\
Unless it was very polite. Then I'd probably sleep through it.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.idea=Sometimes sounds bounce.\n\
Like... you know when you tap a mug and it keeps singing?\n\
Wood does that too.\n\
Tell Chris to drink water. And maybe nap.\n\
Naps fix most things.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked=The bell? I love the bell!\n\
But at night? No.\n\
If it rang, I'd be outside immediately like: 'WHO'S HAVING A PARTY?'\n\
Nighttime is mostly crickets and Levi snoring.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.weird=So you haven't heard anything weird?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.chris=Chris keeps waking up to it.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.nothing=Nothing bell-ish. Sometimes I hear a little *tick tick* like acorns tapping the roof.\n\
It can sound sharper than it should.\n\
Maybe Chris has an acorn problem.\n\
Or a roof problem.\n\
Or an acorn roof problem!

skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.concern=Aw, poor Chris.\n\
He's the kind of person who hears one strange sound and immediately tries to carry it for everyone.\n\
Tell him the village is quiet. And that I'll walk him home if he gets spooked.\n\
Actually no. He'll walk me home. I get distracted.

skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked=The bell is honest.\n\
It rings when hands pull it, and when wind shakes it.\n\
But the forest can make its own music.\n\
Roots shift. Branches settle. Old wood sighs.\n\
If Chris hears a ring that nobody else hears... it might be because he's listening too hard.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.no=So you didn't hear it either?
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.what_sound=Any idea what could sound like a bell?

skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.no=No. Not the bell.\n\
But I do hear the village settle at night.\n\
Like a house breathing. Like the ground exhaling.

skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.what_sound=Acorns can do it.\n\
Two shells tapping in the right rhythm. A single one rolling in a gutter.\n\
Small sounds become sharp when you're afraid.\n\
Tell Chris that fear makes excellent ears and terrible conclusions.

skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked=At night? No bell.\n\
And I'm pretty sure about that.\n\
When the bell rings, the animals react. Dogs perk up. Birds startle. Even the cats pause their little schemes.\n\
If the bell rang and nobody noticed, we'd have a village full of the world's calmest wildlife.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.imagining=So you think Chris is imagining it?
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.notice=What have you noticed at night?

skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.imagining=I think Chris is tired.\n\
And tired brains stitch nonsense into patterns.\n\
Doesn't mean he's making it up on purpose.\n\
Just means he needs sleep more than answers.

skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.notice=Owls. Wind. The sort of quiet that makes you hear your own footsteps.\n\
Sometimes you catch a hum if you stand near old wood long enough.\n\
Not a bell. More like... a memory of one.

skyblock_hub_dialogues.overworld.oak_forest.liora.hello=Greetings, wanderer. The ancient oaks whisper of your coming, and their voices bring me comfort in this vast wood. What brings you to listen with us?
skyblock_hub_dialogues.overworld.oak_forest.lee.hello=Hey, I spotted you weaving through the underbrush. The squirrels were chattering about it. Everything okay out there in the woods?

skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro=If you have a moment, could you help me restock? The builders are working through the day, and an empty pot does nobody any good.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.ill_bring=I'll bring you some soup.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.why=Why beetroot soup?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.accepted=Thank you. I need sixteen bowls to keep the line moving.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup=Easy to make in batches, easy to carry, and it warms you up from the inside out. Simple is good when you're feeding a whole settlement.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup.response.ill_bring=I'll bring you some soup.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro=Any luck? I need sixteen bowls to keep the line moving.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro.response.yes=Here you go.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks=Perfect. This will keep everyone going. Thank you. Come by again if you want a warm bowl.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks.response=Happy to help.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.hello=Hello. Need a warm bowl?

# Hungry Hands (Potato Towers)
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available=Hold. Potato Towers is not a marketplace. It is a wall with a pantry behind it. And lately, the pantry has grown legs.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.zombies=Zombies again?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.accept=If someone's stealing, I'll find them.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.decline=Not my problem.

skyblock_hub_dialogues.overworld.plains.potato_towers.garran.zombies_clarification=If it were zombies, I'd be happy. Zombies do not argue. They do not cry. They do not look you in the eyes and ask why you have potatoes and they do not.

skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation=I was made to defend this place from the dead. That was the deal. But the living keep testing the gates. Hungry hands, quick feet, and a dozen excuses. I need you to find who is doing it and bring me something solid. Names. A pattern. Someone they listen to.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.start=Where do I start?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.handle=I'll handle it.

skyblock_hub_dialogues.overworld.plains.potato_towers.garran.starting_point=The alley behind the stores. Three faces keep showing up near the carts: Tess, Joss, and Perrin. Talk to them. You'll learn who is pulling the string.

skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check=If you are going to stop a theft, do it with facts. Talk to Tess, Joss, and Perrin. Then come back.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.on_it=On it.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.remind=Remind me who I'm looking for.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.reminder=Tess, Joss, and Perrin. Three names. One story. Bring me the truth of it.

skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution=I just spoke with Ceryn. Not a criminal. Not a saint. Just someone people trust.\nStealing is wrong. I will not pretend otherwise.\nBut I did not understand how bad it had gotten out there. Pumpkingdom's shadow reaches farther than our gates.\nSo here's what will happen. The gates stay closed. But I will be slower to notice a sack that is not mine. And I will start pushing for proper rations that do not require sneaking.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.fair=That's... fair.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.open=Why not open the gates?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.sooner=You could have done this sooner.

skyblock_hub_dialogues.overworld.plains.potato_towers.garran.why_not_open=Open gates invite more than hunger. They invite panic. And zombies. I can hold a line, but I cannot hold a stampede.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.admission=Yes. And I should have asked questions before I started counting missing potatoes like they were arrows in a quiver. I am learning.

skyblock_hub_dialogues.overworld.plains.potato_towers.garran.after_completion=If you see someone eyeing a cart too long, do not assume they are a thief. Sometimes they are just calculating whether food is worth shame.

skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first=If Garran sent you, you can stop glaring. I know what this looks like.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.stealing=Are you stealing from Potato Towers?
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.hurt=I'm not here to hurt you.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.started=Tell me who started it.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.direct_question=I steal time. I steal warmth. I steal a moment where my stomach is not screaming. Potatoes are just the shape it takes.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hint=If you want the one people listen to, find Ceryn. Not a boss. A compass. Camped off the road where the towers stop casting shade.

skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first=You going to drag me back to the gate? Fine. Do it. At least inside the walls there are lights.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.why=Why steal from here?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.behind=Who is behind it?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.truth=I can help if you tell me the truth.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.contrast=Because here the air smells like cooked food. Out by Pumpkingdom, it smells like damp stone and dead things. People don't steal because it's fun. They steal because it's close.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hint=Ceryn. That's who you want. We don't take a step without asking what Ceryn would do. Mostly because Ceryn thinks before moving.

skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first=If you came for potatoes, you're late. The few scraps of food we had are now gone.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.following=I'm looking for whoever you're following.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.stop=Stop stealing.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stop_response=And then what? I stop being hungry because you said a sentence? We do what we need to survive. Speak to Ceryn if you need to know more.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hint=Find Ceryn at the camp. Ceryn hates the stealing too. Says it makes us smaller. But Ceryn also refuses to let people starve.

skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first=Garran thinks I'm a leader. I'm not. I'm just the one people look at when they're about to do something they can't take back.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.reason=They say you're the reason they're stealing.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.starving=Potato Towers has enough. You're starving.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.escort=Come with me. Talk to Garran.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.framing=They're stealing because they're hungry. Potato Towers has a mountain of potatoes and a moat of rules. That is not justice. But theft is still theft.\nWalk with me. I will say it to his face. If Garran wants to call it a crime, fine. But I want him to understand what he's defending.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.escort_start=Let's speak to Garran. Come with me. I want a conversation, not a riot.

skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hello=If you're here to accuse me, save your breath. I do what I must to survive.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hello=You lost? I can't offer out many rations regrettably.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hello=Careful around here. People aren't friendly when they're hungry.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello_before_quest=Hello there. Are you starving too?\nWe're working together to try and see what rations we can get out of the of Potato Towers. It's what we need to do to survive.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello=Me and the guards are on better terms. We're getting by now, thanks to your help.

skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available=We are hosting a shared meal for the civilians of Pumpkingdom. After the collapse, a warm table means more than a celebration.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.whats_wrong=Why are you so tense about it?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.need_help=What do you need from me?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.later=I'll come back later.

skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation=Pumpkingdom has not been the same since it fell. Some people lost homes. Others lost kitchens. You can rebuild stone, but hunger makes people disappear quietly.\nRhea and I are keeping tonight simple: something filling, nothing wasteful, and enough set aside so the Plains do not feel it tomorrow.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.what_do_you_need=Alright. What do you need from me?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.wasting_food=Why help Pumpkingdom?

skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup=Because they are still our neighbours. And because the hardest part after a collapse is not rubble, it is the weeks where you stop expecting to be fed.\nWe can give them one good night without turning the Plains pantry into a promise we cannot keep.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup.response.tell_me=Fair. What is the plan?

skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.what_i_need=Talk to Rhea first. She is deciding what goes to people and what we ration for later. You can find her upstairs.

skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions=Talk to Rhea before you collect anything. She is coordinating tonight's meal.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.on_it=On it.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.remind=Remind me.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions_reminder=Find Rhea upstairs. Get the list. Follow it exactly.

skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder=Any luck gathering supplies for the Pumpkingdom meal?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.deposit_potatoes=I have potatoes for storing for later.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.working=Still working on it.

skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.potatoes_delivered=Good. I'll get these potatoes taken to storage.

skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report=That is the last piece we needed. Pumpkingdom will eat, the Plains will stay stocked for a while. Thank you.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.good=Glad I could help.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.close=I did not realise how close it gets.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.close_followup=Most people do not. That is why I work so closely with Rhea to keep food stocked for harsher seasons.

skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.after_completion=If you see someone from Pumpkingdom looking lost, point them toward the table. Let them have a full plate.

skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.before_quest_started=If you are here for the Pumpkingdom meal, do not hover. Either bring something to the table or get out of the way. If you are here for work, talk to Nolan.

skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro=Nolan sent you. Good.\nTonight we feed Pumpkingdom civilians. Since the collapse, some of them have been living on whatever they can trade, scavenge, or stretch. We are giving them one good meal without putting the Plains rations at risk.\nBring potatoes to Nolan for storing for later. Bring 64 pumpkins to me for the meal tonight.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.why_pumpkins=Why pumpkins for the meal?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.who_wasting=Are they really struggling that badly?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.got_it=Got it. I'll be back.

skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.why_pumpkins_followup=We're in pumpkin season right now, and are doing well on supply. They don't keep for long and are quite seasonal.\nThe potatoes will store for longer, so we're better storing those for later meals.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.who_wasting_followup=Yes. Collapse does that. When a city breaks, the ovens go cold first.\nThey will not say it out loud, but you can see it: people eating too fast, saving crusts, pretending they are not hungry. We are giving them a night where they can stop counting bites.

skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder=Do you have the pumpkin supplies for the meal tonight?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.deposit_pumpkins=I have pumpkins for the meal.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.on_it=On it.

skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.pumpkins_delivered=Perfect. This will make a perfect meal tonight.

skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.after_completion=If you hear laughter tonight, you helped make it possible.\nOur storage is full and people will be fed.\nBe proud of yourself.

# Non-Quest NPCs
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello=I am a Carpenter. I build chairs that do not collapse during tremors. Mostly.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_1=Mostly?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_2=Got any carpenter jokes?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_1=If the ground shakes, the furniture has to keep rhythm. 'Mostly' means I have lost exactly one battle to gravity.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_2=I tried to make a belt from oak bark. It was a waist of time.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello=Do you feel it? The trees are humming. Either a tremor is coming, or the forest is gossiping again.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_1=The forest gossips?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_2=How do you stay calm?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_3=I will leave you to it.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_1=The wind between the trees in the forest whispers. I'm convinced it's speaking to me, but maybe it's my nerves getting to me. I'm convinced yesterday it said 'I lost the game'...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_2=I name every creak and crack. It is harder to fear something with a name like Gerald.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello=Is it me, or do the Acorns around here seem to possess magical powers?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello.response_1=Magic?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.detail_1=Yeah. Have you not seem them? Some are just oozing that purple stuff.\n\
I haven't got a clue what that stuff is. If you ask me, it's not a good sign.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello=I am not scared of spiders. I am simply respectful of their eight-legged opinions.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_1=What opinions?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_2=So you are scared.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_3=Any advice for the mine?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_1=Spiders do what they want. They are not afraid of you. You can find solutions to spiders on the web.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2=I am not scared. I am strategic. I prefer to be alive not having to face those horrible creatures.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2.response_1=Don't worry. I'm scared too.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello=If you hear the bell ring, either danger is near or I am bored. It is fifty-fifty.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_1=Please stop ringing it.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_2=What does it mean when it rings twice?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_3=Ring away. I like chaos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_1=I tried. The bell called my name. Loudly. Also the silence here feels like it is waiting.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_2=It means I forgot I already rang it once. I am consistent, not accurate.

skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello=If you stand still long enough, the cold WILL try to adopt you. DO NOT let it.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_1=How do I stop that?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_2=The cold adopts people?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_3=I like the cold.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_1=Keep moving. Wear something warm. NEVER go out underdressed. These environments are unforgiving.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_2=Yes. There are so many unforgiving conditions out there. The cold takes who it wants. We can only dress up warm to help slow it's effects.

skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello=It gets pretty cold here, and you can't go out a lot of the time. I count snowflakes to pass the time.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_1=How many so far?
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_2=That sounds exhausting.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_1=Last time I got up to 314 snowflakes. I'd have kept going but my Snowberry Pie finished cooking, so I needed to go and eat.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_2=So is winter. We match energies.

skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello=I knit. Scarves, mittens, moral support. If you have a problem, I can probably turn it into a hat.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_1=Turn what into a hat?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_2=Can I get a scarf?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_1=Anything. It just depends how you view it.\n\
Take that problem, spin it into a positive, and wear it proud. Now it is a hat.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_2=Only if you promise to wear it dramatically. Flare it like a hero in a blizzard.

skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello=I made a list of things that are not wolves. It helps at night.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_1=What is on the list?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_2=What about actual wolves?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_3=Why create a list?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_1=Trees. Shadows. Wind. Some people. Probably. The list is a work in progress.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_2=They did not make the list. Suspicious. Very suspicious.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_3=Wolves are terrifying! Who wouldn't be scared of them. I'm trying to create a list of things that are not scary! Helps me to stay clam at night.

skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello=If you are cold, drink something warm. If you are sad, drink something warm. If you are being chased, drink something warm faster.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_1=What are you brewing?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_2=Does it actually help?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_1=Spruce Needle Tea. It tastes like courage and needles. Mostly needles.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_2=It helps you if you believe it helps. Don't underestimate a placebo.

skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello=I am training my laugh to sound villainous. Listen. Ha. Ha. Ha.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_1=That was terrifying.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_2=Why practice?
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_3=I'll leave you to get back to practicing.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_1=Thank you. I am improving. I want people to be scared of me.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_2=Because I want to take over the world, and you can't do that without an evil laugh. Duh.

skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available=Oh. Oh wow. You have the exact look of someone who can handle a cake.\nI made a new cake recipe using snowberries, and I need a second opinion.\nIf I share the recipe with you, would you mind testing it out?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_1=Cake is my specialty.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_2=Bring it on.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder=How's the cake testing going? I NEED to know...\nMy hopes and dreams of being a baker in the future are at stake.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_1=Still have yet to eat any.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_2=I'm loving the cake so far. I'm just full.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_3=Not sure if I can stomach any more.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete=So? So?\nTell me everything. The texture, the berry bite, was your Snowberry Cake better than a standard cake?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_1=It was pure joy.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_2=I want another slice.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_3=I don't think baking is for you.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.after_quest=Hey, taste-tester.\nIf you see snowberries, you know what to do.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.hello=Hey, I'm an aspiring baker. I'm trying to make a new cake. I' still working on figuring out my special ingredient.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello=Do not trust parrots. They repeat everything. Including secrets. Especially secrets.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_1=What have they said?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_2=Teach me parrot language.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_3=Any jungle advice?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_1=That someone dropped a fish. They were right. I did. The parrots will never forgive me.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_2=It is mostly insults and snack requests. Occasionally a warning, if you pay in seeds.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello=I am inventing a new cuisine: crunchy. The jungle provides many candidates.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_1=Please do not.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_2=What is on the menu?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_3=Give me something normal.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_1=Coward. But fair. I will not serve you beetle today. Maybe tomorrow.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_2=Roasted beetle. Spiced spider. Vine salad. The salad bites back. That is the charm.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello=Vines are just ropes with ambition. I hang my art where gravity can critique it.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_1=What art?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_2=Does it fall?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_3=Can I help?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_1=Wind chimes made from seeds. They sound like tiny storms arguing politely. If you want to help, stand underneath and pretend you meant to be there when it falls.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_2=Often. That is part of the show. If it does not fall, it was not brave enough.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello=Everyone says the canopy is beautiful. Everyone forgets it is also very far from the ground.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_1=So stay low.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_2=What scares you most?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_3=Want encouragement?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_1=I tried. The jungle built stairs. The jungle is mocking me.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_2=Falling. And also not falling, because then you have to climb down.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello=I map the jungle by listening. Birds draw the borders. Bugs fill in the details.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_1=That sounds fake.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_2=Can I see your map?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_3=Where should I go?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_1=So does the jungle. Yet here we are. Listen long enough and the paths introduce themselves.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_2=It is mostly arrows and warnings. Also one doodle of a very rude parrot.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello=I told a vine it was clingy. It took that personally.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_1=Another one.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_2=Any real advice?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_3=You are unbearable.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_1=I got lost and asked for directions. The jungle said, 'leaf me alone'.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_2=Do not punch a tree with ants in it. You will regret having hands.

skyblock_hub_dialogues.npc_name.balth=Balth
skyblock_hub_dialogues.npc_name.brakka=Brakka
skyblock_hub_dialogues.npc_name.kora=Kora
skyblock_hub_dialogues.npc_name.nyssa=Nyssa
skyblock_hub_dialogues.npc_name.ruk=Ruk
skyblock_hub_dialogues.npc_name.sable=Sable
skyblock_hub_dialogues.npc_name.varka=Varka
skyblock_hub_dialogues.npc_name.zarn=Zarn
skyblock_hub_dialogues.npc_name.grak=Grak

skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro=Oh. *Oink* You... you noticed me.\n\
I keep a counting bowl. For patrols that don't come back whole. It is a quiet job. *Oink*\n\
I don't usually ask anyone for help. But the bowl is getting too full. I was wondering if... if maybe you could clear some of them out by avenging their loss? *Oink*... Only if you want to.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro.response.accept=I'll help you with the bowl.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress=*Oink*... Oh. You're still working on it.\n\
Don't worry, no rush. I don't want to add your name into my bowl as well. Please stay safe.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress.response=I'll see it through.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete=Oh. *Oink*... Thank you.\n\
The names are not forgotten, and my fallen friend's loss feels impactful now. I don't really know how to... *Oink*... Thank you. That's all I have.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_1=You don't need to say anything more.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_2=May they rest.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello=*Oink*... Oh. Hello. I wasn't expecting anyone.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_1=Hello, Grak.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_2=Don't mind me.

skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro=*Oink* You don't look like a Piglin. You must be one of those invasive Humans.\n\
I don't trust you Humans, running around the world. Us Piglins can deal with this Zombified Piglin infestation ourselves! *Oink*\n\
Fine, if you want to prove yourself, I'll let you.\n\
*Oink* Only a friend would bring me gold. Will you be my friend?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro.response.accept=Yes, I want to be your friend.

skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro=If you're so set on proving yourself to me, have you bought the gold?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro.response.trade=Here's the gold.

skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete=Oh, you really do value me as a friend. I thought you Humans didn't like us. *Oink*\n\
I guess we're friends now. Good to know.\n\
Maybe I was too quick to judge humans. *Oink*
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_1=Glad to be your friend.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_2=I'm just trying to be nice

skyblock_hub_dialogues.nether.piglin_colony.zarn.hello=Hey friend!!!! *Oink* *Oink* *Oink* *Oink*\n\
You got more gold? ;)
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_1=No, sorry friend :(
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_2=You seem way too excited to see me.

skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro=You are one of the humans helping the colony, yes? Good.\nInfernal Zombified Piglins keep appearing around here. I think the normal Zombified Piglins are under control, but I'm worried that the humans are ignoring the threat of the more deadly, firey, ones. Will you mind taking care of a few of them?
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro.response.accept=I'll clear them out.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress=How's it coming on? Are those Infernal ones proving a challenge, like I feared. I fear we might be too late.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_1=Back to work.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_2=Yeah, they're proving though
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete=Good job human! I think I'll rest easier knowing there's less of those hostile firey creatures out there. Not that I was worried, as I'm immune to fire. I'm keen to support the efforts of the Humans by making the calls that I believe need to be made.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_1=Glad I could help.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_2=Good job making the call.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello=Strange stuff going on around here. If I notice anything I deem a threat again, I'll let you know.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_1=Thanks!
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_2=I'm always here to help

skyblock_hub_dialogues.nether.piglin_colony.balth.hello=Welcome to the Nether! Be careful out there. It's not a friendly place.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_1=That is welcoming.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_2=I hope you're doing well.

skyblock_hub_dialogues.nether.piglin_colony.kora.hello=If you smell smoke, do not panic. I've just burnt the food again.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_1=Burnt?
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_2=I hope your cooking endeavours end well.
skyblock_hub_dialogues.nether.piglin_colony.kora.detail_1=Yeah, funnily enough you can still burn food in the hottest place in the universe.

skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello=Woah! Stop there! Be careful beyond these gates. It's dangerous out there.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_1=Don't worry about me! I have a helmet!
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_2=I'll be safe

skyblock_hub_dialogues.nether.piglin_colony.ruk.hello=Woah, the architecture around here is really impressive. Crazy to think this place was literally built in a few years after the merging.
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_1=What's the merging?
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_2=Yeah, it's really impressive
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_3=Meh, I know better builers
skyblock_hub_dialogues.nether.piglin_colony.ruk.detail_1=It's when the overworld merged with this strange place.

skyblock_hub_dialogues.nether.piglin_colony.sable.hello=Careful down there. That purple stuff seems to eat quartz, and possesses strange magical potential. It gave me a third arm for a day.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_1=A third arm?
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_2=Oh wow, that's crazy.
skyblock_hub_dialogues.nether.piglin_colony.sable.detail_1=Yeah, it's really powerful magic, if you give it what it wants.\nClearly it really wants quartz.

skyblock_hub_dialogues.nether.piglin_colony.varka.hello=I forge blades, hinges, and the occasional emotional breakdown. Mostly hinges.

skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro=Woah, careful there. I've not finished building around here. This bridge behind me goes to nowhere for now.\nI've got a small issue, though. I'm a very capable builder. However, I've lost all of my lanterns, and I'm deadly afraid of the dark.\nDo you mind helping me find them? They can't have gone far.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro.response.accept=I'll find your lanterns.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns=Please hurry, I'm quite scared of the dark.\nI know they cannot have gone far, unless lanterns have started walking now. If they have, that is a separate problem, and I am not ready for it.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns.response=I'll keep searching.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit=You found the lanterns? Good. Good!\nNow we need enough light to make the whole Crimson Exchange. A bunch of Glowstone and torches should do the trick.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_1=Here are some lighting supplies.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_2=I'm on it.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete=You did it. Nice. There will be so much more light around here now.\nI no longer need to be afraid of the dark.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_1=I agree, the dark is scary.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_2=Glad I could help.
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello=You really brightened my day.\nI really wish I didn't accept a job building in literally the darkest place in the universe...
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello.response=Glad the lights are helping.
skyblock_hub_dialogues.nether.piglin_colony.vesh.lantern.cant_pick_up=I'm not sure whose these are. Maybe I should leave them alone for now.

skyblock_hub_dialogues.nether.piglin_colony.cubit.hello=Hey, welcome to the Piglin Colony!\n\
The Piglin Colony sounds like it used to be a lovely place. Us Humans didn't know of its existence till very recently.\n\
We found this alternative dimension through cracks that formed between the worlds.\n\
We spoke with the Piglins, and they seem a friendly bunch (they do get a little obsessed with gold though). It sounds like they've got it worse than us in the Overworld.\n\
We set up this base, the Crimson Exchange, to easily access the Nether as to offer support to the Piglins.\n\
By all means, feel free to help them out, but be aware! Many of them have been taken over by the corruption and turned into Zombies!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_1=I'll stay safe!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_2=Nice to see you again!

# Zombified Bastion - Dungeon Guard
skyblock_hub_dialogues.nether.piglin_colony.zombified_bastion.dungeon_guard.introduce=This bastion... it was once the pride of the Piglin Colony.\n\
Unfortunately, it's now overrun by Zombified variants of us Piglins. Our friends, now turned Zombies.\n\
Would you assist me in taking back the Bastion for the rest of us surviving Piglins?\n\
We just need to seal off a few of the portals that the Zombified Piglins are using to get in.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction=You hear that? They're chopping down the trees!!!\nSo many generations of families looking after this jungle, and that now it's all being chopped down. If you ask me this is a bad sign, and if this continues, stuff is only getting worse.\nMind helping us stop this horrific deforestation?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_1=I will ask. This sounds bad.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_2=Maybe the Jungle can handle a few trees.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.in_progress_workers=Maybe you should start by speaking to the workers. I'm sure they know who's behind all of this.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.after_lucien=Oh, it's Lucien. That makes total sense.\nThat monster is just so greedy. He's the wealthy one around here, and he's just never satisfied with his wealth.\nNo surprise he's ruining our home to increase his wealth further.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete=Lucien took your logs and said that he wasn't going to stop anyway. That man is horrifying.\nOh well, thanks for trying. I'm sure one day someone will speak some sense into him. Before this whole forest falls.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete.response=I hope you're able to save the forest.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.hello=The deforestation is still happening. Lucien will continue to fill his pockets with wealth until he can be stopped.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned=Yeah, I run this machine. Be careful it's really dangerous.\nThis is not my doing. I can assure you of that. Luicen, is a strong business man, and he's the one behind this. I'm not sure he really understands that what he's doing is harming the forest. I think all he can see is the money he gets from selling the wood.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned.response=Ahh, so it's being driven by money.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.hello=Keep your hands clear. This thing bites.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned=Woah, stand back - I was about to take a massive swing at that pile of logs over there.\nLook, I get you want to save the forest, but there isn't anything I can do. I'm just doing my job.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned.response=Oh, I'm sorry. I'll let you get back to work
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.hello=Careful, this is a massive machine, and I'm currently trying to collect all this wood.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned=You're the fourth person today try and stop me.\nI warn you, I'm not really in the mood to talk to you.\nIf you want answers, Luicen is your man. He's the one paying me.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned.response=Got it.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.hello=Luicen pays well. I just wish he paid me to not destroy our home. I can't have my home without home, and I can't have my home if I cut this forest down.\nI can't win :(

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront=I'm just here to make money. I've taken over the family business. Now I'm chopping down trees. I can't believe nobody did this before. I'm going to be so rich.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_1=You are tearing your own home apart.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_2=What can I do to get you to stop?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro=Lets be fair. You bring me a load of logs to make up for my lost business, and I'll stop. That sound fair?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.response_deposit=Here have some logs
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.dungeon=I wish to fight for the forest.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete=Excellent. Exactly what I asked for.\nNow, about shutting down.\nNo.\nThese logs help today's numbers. The machines help tomorrow's.\nTell the protestors they can keep asking me to stop, but I am not. The business isn't going to grow with such a small pile of logs.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_1=I'll tell them.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_2=You monster.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon=Hey, get out of my way. I've got businesses to run.\n\
I've got many clients. Yes, these clients might be evil monsters, but they pay well. Business growth would stagnate if I started being picky about my clients.\n\
If you've got a problem, bring it on. You can't handle me.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_1=Bring it on.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_2=You work with monsters?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters=Yes, I do.\nThey want stuff from me. Rather than them attacking me, I just found if you give them stuff, they tend support you.\n\
So what if they chop everything down and steal everything from everyone...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_1=I must stop you.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_2=I'll deal with you later.

skyblock_hub_dialogues.overworld.jungle.treetop_tropics.kiri.hello=I knew a guy you lived in a tree house in one of those trees. It's so unfair.\nI'm fairly sure that his treehouse has now been turned into wood for a wall on some rich millionaires' house.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.paz.hello=I'll be honest. This forest seems... "enchanted". I think it's a terrible idea to cutting down these trees. It's going to come back an haunt us.\nI don't think that purple stuff leaking through the floor is good sign.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.marlo.hello=I don't trust this purple stuff.\nIt's not natural.\nWhy are there spiders everywhere now.\nIt doesn't make sense.\nI think this is a sign something bad is going on.

skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available=Hello again! I've been working on a new recipe. I really think it's going to give the people of Pumpkingdom a massive moral boost.\nI recon it'll even be great food for you. You down to give it a try?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_1=Yeah, I'm always hungry
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_2=Always excited for a new delicacy
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted=Great! Here's my idea. It's a beef stew. I'll upgrade your recipe book in a crafting table, so that you can see the idea I've got.\nGo and make a few, and let me know what you think of the taste!
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_1=That sounds wonderful
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_2=I'm not keen on the idea, but I'll try anyway
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder=How is my beautiful recipe going? I hope you've not been poisoned by it.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_1=It's coming on well
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_2=Ooo, it's not looking good
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_3=I've not started yet
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete=Well? Look at you, still standing and not making the \"I regret everything\" face. That is promising. I'm dying to know, was the beef stew any good? Have I failed everyone as a chef?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.tasty=It was good. Really good.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.honest=It needs a little work.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.horrible=It was disgusting.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup=Yes! I knew it. Everyone in the kingdom is going to be so happy. I can't wait to share my creation with more people.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_1=I'm glad to see you so happy
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_2=Keep up the good work
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup=Well, I guess it's not for everyone, and it sounds like you didn't hate it. It sounds like I'm heading in the right direction. I appreciate the honest feedback.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_1=Don't worry, I believe in you
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_2=You should give up now
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting=Oh dear. I'm so so sorry. I should just give up as a chef. I can't believe you hated it so much.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_1=I'm sorry I didn't mean it
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_2=Look, cooking is just not for you

skyblock_hub_dialogues.overworld.plains.fields.elowen.hello=How's it going? I hope you're doing better than me.\n\
All my cows are still unfairly corrupted with purple stuff. It's very bad.
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello.response_1=I'm sorry to hear that

skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer=*Sobbing* Hey! Sorry, you've caught me at a bad time.\n\
My cows have gone bad. They're harming the villagers. I can't stand seeing them like this.\n\
I don't want to hurt them. Are you able to do something about it?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.what_happened=What happened to them?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.ill_help=I'll protect the villagers
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.what_happened_followup=I don't know. One day they were grazing and then the next they were infested by that purple stuff. It's like a disease, and it's infected all of them. It's so sad to see.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.followup.response.accept=I'll take care of it

skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check=*Sobbing* I hope you're getting on well.\n\
How's it coming along? Actually, don't tell me. I don't want to know.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check.response.on_it=I'm on it

skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete=Oh my word! Thanks so much for doing that. It's so horrible. What came over them. It's so unfair.\n\
*Continues sobbing*\n\
My poor cows.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_1=Please don't cry
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_2=Happy to help anytime


