skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.hello=Keep your voice down. Sound carries in there.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.locked=Not now. The village is still dealing with the ground shifts. Come back when things settle.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available=You heading into the Cobblestone Mine? Good. I hate the spiders in there. I can handle stone dust. I cannot handle eight legs brushing past my boots.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.whats_changed=What's changed?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.what_you_need=What do you need from me?

skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.whats_changed=They are bolder. They do not stay back in the dark like they used to. And some of the webbing has a faint tint to it. Probably nothing. Probably.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need=Clear the Cobblestone Mine five times. Not once. Five. I need to know if the spiders are multiplying, migrating, or being pushed.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.on_it=Alright. I'll do it.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.five_times=Five times seems a lot.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.why_five=If you clear it once, they hide. If you clear it twice, they move. After a few runs, patterns show. Web density. Spawn points. The kind of things you only notice when you are tired and paying attention anyway.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress=Still counting. Five clears. Try not to come out wrapped up.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress.response.working=I'm working on it.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete=You actually did it. Five clears, and you're still in one piece. The entrance already looks better. Less webbing in the air. Fewer skitters on the stone.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete_reward=Take this. If the mine keeps acting up, at least you can pull your own stone without living in it.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.glad=Glad it helped.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.tint=About that tint you mentioned...

skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.tint_followup=I am not saying it is the cause. I am saying I have seen stranger things in cracks after a tremor. Keep your eyes open down there. If you see anything that looks wrong, do not touch it with your bare hands.

skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.after_completion=If the webs start creeping again, I'll know before you do. I can smell the damp when they nest.

