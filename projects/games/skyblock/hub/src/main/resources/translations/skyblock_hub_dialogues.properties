# Grot & Nira - A Bolt of Hope
skyblock_hub_dialogues.npc_name.grot=Grot
skyblock_hub_dialogues.npc_name.nira=Nira

skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro=You. Stop. I need your help.\nThat pig standing beside me. That is my wife. Nira. The purple rot spread through our section and she changed. She is still in there. I know it. She bumps her nose against my leg every morning, same as always.\nI was told lightning can break through the rot. Find me a lightning rod. I will do the rest.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro.response.accept=I'll find you a lightning rod
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro=She is still here. Still bumping her nose against my leg every morning.\nIf you have found a lightning rod, we'll use it to target a lightning strike right on her.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro.response=Here, take it.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt=Something happened. She squealed.\nBut she is still a pig. The charge was not enough.\nI need more. Much more. We're going to make the most powerful lightning storm you've ever seen.\n\
Lightning rods won't be enough. We'll need to use ice crystals and water vapour to brew up the storm of the century.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_1=I'll gather everything
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_2=That is a lot of materials
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro=Do you have all of it?\nNira used to tell me about storms. She said water freezes very high up in places like the cold taiga, where the air is thick and cold. Then you have water vapour that rises and hits the ice up high. They build massive charge, until the sky cannot hold it and cracks open.\nIf we stack the rods to focus it, and use the ice and water to build the charge, we can pull something bigger than any natural bolt. Something strong enough to break through the rot.\nLet's hope we don't melt the whole nether.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro.response=Here are your storm ingredients
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete=NIRA!\nLook at her. She is back!\nI do not have the words for this. You brought my wife back to me.\nThank you. I mean that.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_1=She deserves to be home
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_2=Glad I could help
skyblock_hub_dialogues.nether.piglin_colony.grot.hello=Nira is still getting her feet under her. She was a pig for a long time. But she is herself again. I do not know what I would have done without you.
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_1=She is lucky to have you
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_2=Take good care of her

skyblock_hub_dialogues.nether.piglin_colony.nira.hello=I remember all of it, even as a pig, I heard Grot's voice every day. He never left me. He was so sweet to me.\nIt's certainly going to take me some time to readjust to life on two legs again.
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_1=It is good to have you back
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_2=You are very lucky

skyblock_hub_dialogues.nether.piglin_colony.nira_pig.hello=Oink.

skyblock_hub_dialogues.laptop.name=SDP Laptop
skyblock_hub_dialogues.laptop.laptop_1=Hello Team SDP,\n\n\
I hope you’re all receiving this message in due time.\n\n\
Firstly, I would like to celebrate Dorothy’s 100th Birthday! I hope you’re doing well Dorothy.\n\n\
Secondly, I would like to remind everyone that works here, that attentiveness at work is extremely important. What we do is a matter of life and death and it’s of utmost importance that you focus at your job. Sitting playing games on your phone does not count as working. I don’t want to have to start calling names, Rob.\n\n\
Ken\n\
Human Resources\n\
Skyblock Defence Program
skyblock_hub_dialogues.laptop.laptop_2=SDP Shield\n\
Name: Skyblock 2.0\n\
Recommended load prevention: Helios - 20km\n\
Status: OFFLINE\n\
Error: Insufficient Power
skyblock_hub_dialogues.laptop.laptop_3=To Ivy,\n\n\
Congratulations for passing your degree in Helios Discovery and Prevention. We here at the SDP admire your outstanding grades and would love you an opportunity to work with us. Your skills would be invaluable if you choose to work with us, and you’d get the opportunity to save many lives.\n\n\
Positions to work at the SDP are limited, so if this is something you are interested in please respond as soon as possible, and we can start discussions on salaries.\n\n\
Esme\nRecruiment\nSkyblock Defence Program
skyblock_hub_dialogues.laptop.laptop_4=Uhh, Rafael,\n\n\
Did you see those lab results at work yesterday? Why is nobody talking about it? Those Helios readings were different. It’s almost like they’ve invested so much money in upgrading the tech, and now they’ve got their answers they’re too scared to act upon it.\n\n\
What are we dealing with? I thought we were dealing with meteor prevention, but somehow I don’t think they’re meteors anymore? WHAT ARE THEY!? WHAT ARE THE THINGS FLYING TO US? ARE WE OKAY?
skyblock_hub_dialogues.laptop.laptop_5=Report: Next 5 inbound Helios\n\n\
- Helios A5B - Size: 49m - Threat: Low\n\
- Helios X9V - Size: 952m - Threat: Medium\n\
- Helios F45 - Size: 67m - Threat: Low (and Ken)\n\
- Helios R2A - Size: 604m - Threat: Medium\n\
- Helios 94H - Size: 523km - Threat: CRITICAL
skyblock_hub_dialogues.laptop.laptop_6=Hello Team,\n\n\
I understand that the news of Helios 94H is scary. I understand that we’ve never dealt with a Helios of this size before, but it’s important to know that this is what the SDP is founded for. Blocking celestial bodies in the sky is what we do best.\n\n\
There is nothing to fear. The research and development team have recently made a new massive break through in the field. With this good news I’m proud to announce our latest iteration of the Skyblock. Skyblock 3.0 will be able to block celestial bodies over 500km in diameter. An unprecedented break through in technology. I’m very proud of where we are as a team.\n\n\
Looking forward to seeing you all at work tomorrow,\n\n\
Helen\n\
CEO\n\
Skyblock Defence Program
