skyblock_hub_dialogues.npc_name.optimiser=Optimiser
skyblock_hub_dialogues.npc_name.enchanter=Enchanter
skyblock_hub_dialogues.npc_name.repairer=Repairer
skyblock_hub_dialogues.wurg.cannot_cross=GRRRRR! Ich bin ein mürrischer Wurg! Wir Wurgs haben geschworen, Brücken zu bewachen und alle daran zu hindern, sie zu überqueren, die nicht würdig sind! Komm zurück, wenn du mehr entdeckt hast!
skyblock_hub_dialogues.wurg.back_to_work_response=Zeit, wieder an die Arbeit zu gehen!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat=Hey, du stehst noch! Das ist ein gutes Zeichen. Hast du die Dorfbewohner schon kennengelernt? Die unterhalten sich total gerne!\nFühlst du dich ein bisschen verloren? Kein Problem! Deine Quests sind sicher in deinem <cc:header>Skyblock-Menü</cc:header> oder tippe "/skyblock quests"!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_1=Danke für den Hinweis!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_2=Ja, die Dorfbewohner sind so nett!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.introduce=Hey, Freund! Willkommen im Dorf Oakridge!\nOh, wo sind meine Manieren... Ich hab vergessen, mich vorzustellen!\nMein Name ist Cubit, ich bin der Dorfführer hier in Oakridge!\nFolg mir, ich zeig dir das Herzstück des Dorfes und stell dich den Bewohnern vor!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_enchanter=Das ist der Verzauberer!\nAuf irgendeine magische Weise kann er deine Gegenstände verzaubern und mächtiger machen!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_portal=Und damit sind wir wieder am Portal...\nDu kannst das Portal jederzeit nutzen, um nach Hause zu kommen, oder alternativ das praktische Menü in deinem Inventar.\nDas war die Tour für jetzt, aber keine Sorge – in Oakridge gibt es noch so viel mehr zu entdecken!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_repairer=Darf ich vorstellen: der Reparateur!\nEr kann alles reparieren! Selbst wenn es von irgendwas angeknabbert wurde...\nVon einem Häschen oder so...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_shops=Ah, mein liebster Teil... Die Läden!\nDie haben alles, was du brauchst, und alles, von dem du nicht wusstest, dass du es brauchst!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce=Hey! Du bist's wieder!\nIch zeig dir besser die Schmiede! Sie ist der einzige Ort in der Welt von Skyblock, der mächtige Werkzeug- und Rüstungs-Upgrades durchführen kann.\nSie ist ein bisschen schwer zu finden, also los geht's!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_1=Los geht's!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_2=Ich kann's kaum erwarten!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge=Willkommen in der Schmiede! Dieses riesige Gebäude ist ein echtes Kraftwerk!\nEs heißt, dieser Ort wurde von Menschen erbaut, die wie besessen wirkten, und dass er magische Kräfte besitzt.\nRunen, die in der ganzen Welt gefunden werden, können hier zu ihrer wahren Kraft veredelt werden.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_1=Wow, klingt unheimlich!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_2=Ich kann's kaum erwarten, etwas Mächtiges herzustellen!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello=Wie läuft's an der Schmiede? Hast du schon was Cooles gemacht?\nVerliese sind ein super Startpunkt, um Runen zu finden, falls du welche brauchst.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_1=Ja, läuft gut!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_2=Hab noch nichts Gutes gemacht!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.introduce=Hey! Cassandra hier! Ich bin Bäuerin! Manche würden sagen, die beste Bäuerin weit und breit!\nManche würden sagen, ich <italic>stich</italic> die Konkurrenz aus!\n\nAls Rote-Beete-Bäuerin hab ich immer jede Menge Rote-Beete-Samen! Komm gerne wieder zu mir, wenn du ein tolles Angebot willst!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.response=Schön, dich kennenzulernen!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.chat=Hey, wie läuft's!\nKann ich dich für ein paar super günstige Rote-Beete-Samen begeistern?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.introduce=Hmm... Levi hier.\nDu bist nicht von hier, oder?\nJeder kennt mich. Ich bin derjenige, der immer auf der Arbeit einschläft. Ich arbeite daran, meine Fähigkeiten zu verbessern, um mehr helfen zu können, aber so weit bin ich noch nicht.\nWenn du dranbleibst, wirst du genauso berühmt wie ich.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_1=Ich hoffe, du schläfst nicht immer
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_2=Du klingst nach Ärger
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.hello=Hey, wie geht's dir?\nIch bin gerade beschäftigt damit, mich auszuruhen. Kannst du vielleicht zu einem anderen Zeitpunkt wiederkommen?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.introduce=NICHT WAHR! Neue Leute!\nDu bist neu, oder? Ich kann es kaum erwarten, dich kennenzulernen. Erzähl mir alles.\nWie geht's dir? Ich hab Kuchen. Willst du Kuchen?\nOh Gott. Du musst mich aufhalten. Ich rede sonst einfach weiter.\nHast du alle kennengelernt? Hast du die Läden gesehen? Was ist mit den Minen?\nOOOOOO Da draußen wächst so ein verrücktes lila Zeug aus dem Boden, hast du davon gehört?\nWarte... Ich hör auf
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_1=Woah, ruhig mal!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_2=Ich glaube, wir werden uns gut verstehen
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_3=Du bist viel zu chaotisch
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello=Woah, du bist wieder zum Reden zu mir gekommen! Das ehrt mich.\nGeht's dir gut? Ich hab noch mehr Kuchen gemacht. Ich liebe Kuchen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello.response_1=Ich liebe Kuchen auch
skyblock_hub_dialogues.response.show_me_around=Ja, zeig mir alles!
skyblock_hub_dialogues.response.show_me_more=Ja, zeig mir mehr!
skyblock_hub_dialogues.response.show_me_what_youve_got=Ja, zeig mal her!
skyblock_hub_dialogues.response.thanks_for_help=Danke!
skyblock_hub_dialogues.response.yeah_sure=Ja, klar!
skyblock_hub_dialogues.response.lets_go=Ich bin bereit!
skyblock_hub_dialogues.response.ill_pass=Vielleicht ein anderes Mal...
skyblock_hub_dialogues.response.yeah_ill_help=Ja, ich helfe!
skyblock_hub_dialogues.response.not_right_now=Nein, gerade nicht
skyblock_hub_dialogues.response.okay=Okay
skyblock_hub_dialogues.response.yes=Ja
skyblock_hub_dialogues.response.tell_me_more=Erzähl mir mehr.
skyblock_hub_dialogues.response.i_should_go=Ich sollte los.
skyblock_hub_dialogues.response.fair_enough=Ist fair.
skyblock_hub_dialogues.response.yikes=Autsch.
skyblock_hub_dialogues.response.good_luck=Viel Glück.
skyblock_hub_dialogues.response.interesting=Interessant.
skyblock_hub_dialogues.response.laugh=Haha!
skyblock_hub_dialogues.response.ill_leave_you_to_it=Dann lass ich dich mal.
skyblock_hub_dialogues.response.will_do=Mach ich!
skyblock_hub_dialogues.response.ellipsis=...
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.introduce=Oh je, oh Himmel! Meine süßen kleinen Flauschbälle sind wieder durch die Klappe entwischt! Sie hüpften noch direkt ums Häuschen, aber jetzt sind sie im Wald verschwunden! Könntest du mir bitte helfen, sie einzusammeln? Ich bezahl dich gut dafür, ich verspreche es – ich brauche nur meine Kleinen wieder zu Hause!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.response=Zeit für ein Hasen-Rodeo! Keine Sorge, Aurora!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.hows_it_going=Wie läuft's? Irgendeine Spur von meinen kleinen Ausreißern? Diese Hasen planen garantiert irgendwas, das weiß ich genau... hoffentlich nur einen Snack-Raub und keine vollständige Rebellion!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks=Oh, Gott sei Dank! Vielen Dank, dass du mir geholfen hast... Ich hätte sie ohne dich nicht aufspüren können! Ich werde allen in Oakridge von deiner Freundlichkeit und Tapferkeit erzählen!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks.response=Schön, dass ich den Tag retten konnte!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.hello=Hey! Ich bin immer noch so unglaublich dankbar für deine Hilfe mit meinen kleinen Rackern!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro=Eeek! Bleib weg! Ich meine hallo! Hasen sind einfach... zu zappelig für mich. Die sind zum Gruseln! Kannst du dieses Futter zu Aurora bringen? Ich hab Karotten, Rote Beete und Weizen eingepackt, damit sie sie... bei Laune halten kann.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_1=Natürlich! Ich bin dein Lieferheld.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_2=Wie kannst du Angst haben? Das sind doch nur flauschige Häschen!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress=Hey! Hast du... hast du diese schrecklichen Viecher schon gefüttert? Haben die noch Hunger?
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress.response=Noch nicht, aber ich bin dabei.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete=Du bist die Beste! Ehrlich, Hasen sind kleine Monster im Flausch-Kostüm. Aurora meint, ich sollte sie mal besuchen... vielleicht tu ich's, wenn du dabei bist, um mich zu beschützen!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete.response=Jederzeit! Ich bin dein Hasen-Bodyguard.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello=Hey, wie läuft's! Ich bin der beste Tierfutter-Lieferant im Wald, vor allem weil ich ungern zu nah an die Tiere rankomme!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello.response_1=Schön zu hören!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro=Oh! Das müssen die Karotten sein, die Bob gesammelt hat. Er ist so ein Schatz, auch wenn er etwas nervös ist. Kannst du sie rüberbringen?
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro.response.yes=Hier, bitte!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks=Perfekt! Vielen Dank. Sag Bob, er ist jederzeit willkommen – vielleicht merkt er beim Zuschauen, wie sie mampfen, dass sie einfach kleine Freunde sind.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks.response=Ich richte es ihm aus.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro=Oh, Bob hat dich mit Snacks geschickt? So nett von ihm! Ich bin gerade mit den anderen Hasen beschäftigt – könntest du diese hier direkt füttern? Sag Bob, er ist herzlich willkommen!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro.response=Das kann ich machen!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.catch=<italic>*Hüpf Hüpf*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.response=Erwischt! Ganz easy.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.intro=Dieser Hase zuckt mit der Nase – er scheint Hunger auf Karotten zu haben!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.thanks=Der Hase kaut glücklich die Karotten.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.catch=<italic>*Quietsch!*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.response=Komm mit, Kleines!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.intro=Dieser Hase scheint Rote Beete zu wollen – er schaut direkt auf die Tasche!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.thanks=Der Hase genießt die Rote Beete.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.catch=<italic>*Mampf Mampf*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.response=Ab zurück ins Gehege!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.intro=Dieser Hase wartet geduldig auf etwas Weizen!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.thanks=Der Hase knabbert zufrieden am Weizen.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.hello=<italic>*Zuckt mit der Nase*</italic>


skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.intro=Hey! Du da, komm mal her!\nLetzte Nacht... die Wände haben stark gebebt, und auf einmal sind alle Häuser hier instabil...\nUnd natürlich fällt mir das als Problem zu lösen zu...\nAber jetzt kann ich es auch zu deinem Problem machen, schätze ich.\nHol mir ein paar Eichenholzstämme und Bruchstein, dann reden wir wieder, wenn du das erledigt hast.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going=Ach, du bist's wieder.\nHast du die Materialien schon gesammelt?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.yes=Ja! Ich hab ein paar Ressourcen für dich.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.no=Nein, sorry, ich mach weiter :(
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks=Wow, du hast es wirklich gemacht.\nIch bin... beeindruckt.\nDanke, schätze ich.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks.response.enjoy=Ich hoffe, die Ressourcen haben geholfen!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well=Keine Erschütterungen seit letzter Nacht. Vielleicht ist es besser, wenn das so bleibt.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well.response.glad_to_hear=Schön zu hören, dass es klappt!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro=Hey, du da. Lass mich dir etwas wirklich Mächtiges in dieser Welt vorstellen...\nSchreine. Ja, gib ihnen jede Menge von dem Gegenstand, für den der Schrein gemacht ist, und er belohnt dich mit tollen Sachen.\nLauf durch die Gegend und find alle Schreine, die dieses Land zu bieten hat!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_1=Ich leg sofort los!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_2=Ich schau sie mir unterwegs an, danke!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going=Hast du sie alle gefunden?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_1=Ich suche noch!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_2=Ich gebe mein Bestes, alle zu finden!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello=Hey! Was geht?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello.response_1=Schön, dich wieder zu sehen!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello=Hey. Ich bin Gus. Ich glaube, ich hab meine Brille irgendwo hier liegen lassen.\nIch suche wohl weiter.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_1=Viel Glück. Ich hoffe, du findest sie!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_2=Das hättest du nicht kommen sehen...


# Cobblestone Mine - Dungeon Guard
skyblock_hub_dialogues.overworld.oak_forest.cobblestone_mine.dungeon_guard.introduce=Vor gar nicht langer Zeit war das hier eine friedliche, produktive Mine...\nDas war, bis die Spinnen kamen.\nDie Oakridge-Wache war auf so einen Angriff nicht vorbereitet.\nWir wurden überrannt und mussten uns zurückziehen.\nJetzt wimmelt die Mine von Spinnen und anderen Kreaturen.\nKönntest du uns bitte helfen, sie zu vertreiben?

# Pumpkingdom - Ella
skyblock_hub_dialogues.overworld.plains.pumpkingdom.ella.flower_shop=Hey! Ich bin die Besitzerin des Blumenladens hier in Pumpkingdom!\nDarf ich dich für ein paar Blumen begeistern?

# Pumpkingdom - Dungeon Guard
skyblock_hub_dialogues.overworld.plains.pumpkingdom.dungeon_guard.introduce=So viele Zombies. Das verfolgt mich noch!\nIch weiß nicht, wie wir überlebt haben. Ich hätte nichts mehr tun können.\nIch frage mich, ob du es besser hingekriegt hättest? Glaubst du, du hättest helfen können? Hätte sich das Ergebnis verändert, wenn du dabei gewesen wärst?

# Pumpkingdom - Blooming in the Rain
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce=Oh! Hallo! Du siehst aus, als hättest du tolle Hände fürs Gärtnern! Der Boden war in letzter Zeit so unruhig, ich glaube, er braucht ein paar leuchtende Farben zur Beruhigung. Magst du mir helfen, Blumen zu sammeln?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_1=Ooo, Blumen! Ich helfe gerne.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_2=Ich bin gerade zu beschäftigt für Blumen.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker=Warte, warte! Wir können sie nicht einfach rausreißen, die Wurzeln sind empfindlich! Bevor wir losgehen, geh in den Laden und kauf einen Blumenpflücker.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker.response_1=Klar, ich geh mir einen aussuchen
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go=Klasse, du hast ihn! Schau dir den Glanz an! Okay, konzentrier dich, Sandy... konzentrier dich... Los geht's, Blumen pflücken!!!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go.response_1=Ja! Blumen!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions=Schau dir diese Löwenzahn an! Die sind wie kleine Sonnenstücke. Ernte etwas Löwenzahn mit dem Werkzeug und bring ihn mir dann!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_1=Hier ist etwas Löwenzahn!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_2=Oh, ich hol sie schnell! Ich hab mich ein bisschen ablenken lassen.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_dandelions=Konzentrier dich! Ernte den Löwenzahn unbedingt mit den Werkzeugen, damit wir die Erde nicht aufstören!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys=Hast du das gehört? Der Boden hat sich ein bisschen... knusprig angefühlt. Lass uns Mohnblumen suchen. Ihr Rot ist so kräftig, perfekt für die Ruinen.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_1=Ja, lass uns erkunden!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_2=Wenn es sein muss...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys=Schnell, schnell! Ernte etwas Mohnblumen mit dem Werkzeug und bring mir dann welche! Sie tun so viel Gutes für das Land.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_1=Hier sind ein paar Mohnblumen!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_2=Oh, ich hol sie schnell!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_poppys=Die Mohnblumen! Ernte die Mohnblumen unbedingt mit den Werkzeugen!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys=Okay, eine letzte Sache... Ich glaube. Ooo! Lass uns Pfingstrosen suchen. Die sind wie flauschige Decken für den Dreck!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_1=Ja, lass uns erkunden!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_2=Na gut...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys=Sind sie nicht herrlich? Ernte etwas Pfingstrosen mit dem Werkzeug und bring sie mir! Sie sind das letzte Stück unseres Blumenverbandes!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_1=Hier sind ein paar Pfingstrosen!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_2=Oh, ich hol sie schnell!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_peonys=Nicht vergessen! Ernte die Pfingstrosen unbedingt mit den Werkzeugen!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home=Oh! Mein Korb quillt über! Und meine Füße kribbeln... Ich glaube, das reicht. Lass uns nach Hause gehen.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_1=Ja, lass uns nach Hause!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_2=Meine Beine tun weh von dem ganzen Laufen :(
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up=Das war wunderschön! Der Boden fühlt sich schon ein kleines bisschen ruhiger an, oder? Das machen wir irgendwann nochmal.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_1=Ja, das hat mir auch gefallen.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_2=War ganz nett, schätze ich. Bin nicht der größte Blumenfan.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello=Hey, wie läuft's? Ich hoffe, du fühlst dich blumig und bist bereit, den Setzlingen zu helfen!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello.response_1=Ich hoffe, dir geht's genauso!

# Pumpkingdom - Non-Quest NPCs
skyblock_hub_dialogues.overworld.plains.pumpkingdom.cedric.hello=Wenn du Rauch riechst, ist dein Gesicht wahrscheinlich zu nah am Feuer. Diese Kartoffeln sind noch roh.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello=Bitte flüstern. Die Vogelscheuchen hören zu. Oder ich drehe vielleicht durch.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello.response_1=Willst du einen Glücks-Kürbis-Anhänger?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.detail_1=Nein. Auf gar keinen Fall.\nWenn ich einen Glücksbringer trage und er versagt, muss ich auch an Unglücksbringer glauben. Das will ich nicht.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello=Willkommen, Reisender. Du bist in Pumpkingdom. Wir haben weltberühmte Kürbisse hier.\nKann ich irgendwie zur Unterhaltung beitragen?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_1=Sing mir was.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_2=Warum heißt es Pumpkingdom?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_3=Ich bin nur auf der Durchreise.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.verse_1=Oh, Kürbis, Kürbis, orange und hell,\nWartend auf eine gruselige Nacht.\nMit lustigem Lächeln oder gruseligem Gesicht,\nBist du der süßeste Kürbis im Licht.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.detail_1=Weil "Kürbisdorf" klang, als würden wir darum bitten, überfallen zu werden.\nAußerdem hat der erste Bürgermeister es mit einem Schnitzmesser ausgerufen, und niemand widersprach dem Messer.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.maeve.hello=Hallo! Ich bin Maeve. Ich mag Bücher und ich lese gerne. Aus einem Buch kann man viel lernen. Außer Lesen. Das Lesen aus einem Buch lernen hat bei niemandem geklappt, den ich damit getestet habe.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.quinn.hello=Fass die Hebel nicht an.\nEigentlich, fass sie doch an. Vorsichtig.\nIch hab keine Ahnung, was die machen, wenn's also hochgeht... Schau mich nicht an!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello=Wenn du wegen Kürbissen hier bist, nimm den linken Weg.\nWenn du wegen schlechten Witzen hier bist, herzlichen Glückwunsch. Du bist bereits verloren.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_1=Erzähl mir einen schlechten Witz.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_2=Ich lass dich mal in Ruhe.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1=Wie repariert man einen kaputten Kürbis?\nMit einem Kürbis-Pflaster!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1.response_1=Das war wirklich schrecklich.

# Pumpkin Towers - Potato Zombies
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce=Psst! Du siehst aus, als könntest du mit Schaufel oder Schwert umgehen.\nWir haben hier draußen ein kleines Problem... Zombies überfallen meine Felder.\nDie trampeln die Ernte, nagen an den Zäunen, und das Schlimmste: Sie fressen meine Kartoffeln!\nKannst du mir helfen und die Ernte retten?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response1=Natürlich! Vor ein paar Zombies hab ich keine Angst.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response2=Wenn du meinst...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane=Klasse Arbeit, Kumpel!\nWenn du noch etwas Zeit hast... Könntest du auch meiner Freundin Susane einen Besuch abstatten?\nSie hatte wohl etwas Mühe mit Spinnen rund um ihre Kürbisse.\nWürdest du sie finden und ihr auch helfen?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response1=Los, die Spinnen plattmachen!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response2=Ich pass auf deine Kürbisse auf!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks=Wow, du hast denen wirklich gezeigt, wer der Boss ist!\nIch kann's nicht glauben, wie viele du erledigt hast.\nWenn sie nur endgültig weg blieben... aber fürs Erste hast du wirklich was bewirkt!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks.response=Jederzeit, Helfen ist meine Spezialität!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hows_it_going=Wie hält sich die Lage?\nKannst du glauben, dass die Kreaturen einfach so alles übernommen haben?\nSo ein Pech...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hello=Willst du ein kleines Geheimnis wissen?\nMein richtiger Name ist eigentlich nicht Fred.\nDie Leute haben mich Potato Fred genannt, weil ich mal in einem Kartoffelhaufen stecken geblieben bin.\nIch weiß immer noch nicht, wie ich da rausgekommen bin...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.see_fred=Howdy!\nNicht nur die Kürbisse wachsen schnell, die Schädlinge auch!\nMein Partner, Potato Fred, könnte deine Hilfe gut gebrauchen.\nHättest du Lust, kurz nach ihm zu sehen?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred=AAAAAAH!\nSPINNEN! SPINNEN ÜBERALL!\nDie ruinieren meine Kürbisse!\nKannst du mir bitte helfen, sie loszuwerden?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response1=IGITT, SPINNEN!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response2=Natürlich, vor Spinnen hab ich keine Angst!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders=Hast du die Spinnen schon erledigt?\nIch traue mich nicht zurück, wenn die noch da sind...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders.response=Es sind noch welche übrig...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.hello=Ach, ich liebe es zu sehen, wie meine Kürbisse gut gedeihen...\nDiese blöden Spinnen versuchen immer, alles zu ruinieren!\nLass uns hoffen, dass sie diesmal für immer weg bleiben...

# Plains - Pumpkin Towers - Susane & Kipp
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce=Du! Du siehst aus, als hättest du Gerechtigkeitssinn! Da läuft so ein kleiner Unruhestifter rum und klaut meine preisgekrönten Kürbisse für seine "Projekte". Du musst ihn finden, damit ich ein ernstes, aber faires Wörtchen mit ihm reden kann! Hilfst du mir, den Täter zu schnappen?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_1=Ich spüre den kleinen Racker auf!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_2=Alright, ich helfe dir, dem Ganzen auf den Grund zu gehen.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going=Irgendein Erfolg bei der Suche nach dem Kind und seinem gestohlenen Gemüse? Meine Kürbisse sind für das Fest gedacht, nicht als Zielscheibe!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going.response=Noch in Arbeit, Susane!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete=Da ist er! Der kleine Teufel! ...Warte mal. Ist das ein geschnitzter Kürbis? Schau dir die Handwerkskunst an... er hat ihn nicht ruiniert, er hat ihn verbessert! Wow, das ist tatsächlich unglaublich. Danke, dass du ihn und seine Kunst zu mir gebracht hast.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete.response=Gern, das Missverständnis aufzuklären!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce=Susane hat dich geschickt, um mich zurückzubringen? Oh nein... Sie wird so sauer sein! Bitte bring mich noch nicht zu ihr! Ich bin kein Dieb, ich bin ein Künstler! Schau, wenn ich ihr ein Friedensangebot bringe... hilf mir, mein Schnitzmesser zu finden, und ich mach etwas, das ihre Meinung ändert.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_1=Ich finde dein Messer. Mal sehen, was du kannst.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_2=Alright, ich schaue. Aber kein weiteres Chaos mehr.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint=Ich hatte es zuletzt bei den Kürbisreihen, als ich nach einer guten Vorlage gesucht hab. Da muss es irgendwo sein!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint.response=Ich bin dran.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife=Du hast es gefunden! Du bist ein Lebensretter. Ich mach das schnell – ich schnitze ihr ein Meisterwerk, das sie die fehlenden Kürbisse vergessen lässt!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife.response=Los geht's. Drücken wir die Daumen!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.hello=Ich halte mich heute etwas bedeckt. Kunst braucht Konzentration, weißt du?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.knife.dont_know=Es ist seltsam, dass dieses Messer einfach so rumliegt. Auf dem Griff steht "Kipp" eingraviert. Ich sollte es ihm zurückbringen.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.hello=Hörst du das? Das ist der Klang von gutem Essen, das kocht. Die Leute von Pumpkingdom werden es lieben.\nDanke für deine ganze harte Arbeit!
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available=Wenn du Abendessen riechen kannst, bedeutet das, ich gewinne noch. Aber knapp. Der Kohlenbehälter ist leer und mehrere Öfen sind gesprungen. Hilf mir, bevor die ganze Plains anfängt, rohe Kartoffeln zu kauen.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.help=Ich kann helfen.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.plan=Was ist der Plan?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.breaking=Warum gehen Öfen kaputt?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.why_furnaces_break=Hitzezyklen, unachtsame Hände und ein bisschen Pech. Eine Minute funktionieren sie noch, im nächsten Moment sind sie gerissen und bluten Asche. Mit einem kaputten Ofen kann ich umgehen. Nicht mit einer kaputten Küche.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted=Perfekt. Ich brauche drei Dinge, und zwar schnell. Kohle, damit die Hitze konstant bleibt, Öfen als Ersatz für die kaputten, und Kartoffeln, damit ich etwas Essbares rausbekomme.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted.response.all=Ich bringe alles.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items=Jedes Mal, wenn ich wegschaue, "kontrolliert" jemand einen Ofen und lässt die Tür offen. Bring mir Kohle, Öfen und Kartoffeln, und ich mach aus der Panik ein Abendessen.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.deposit=Ich habe Vorräte mitgebracht.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.working=Ich bin dabei.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.deposit_thanks=Gut. In die Behälter und auf die Kohlen. Bring weiter nach.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage=Das war's. Die Feuer sind wieder an, die Schlange läuft, und die Plains bekommt auf absehbare Zeit gekochtes Essen.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.glad=Schön, dass ich helfen konnte.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.save=Eines Tages sollten wir zusammen kochen!

# Plains - Ruins - Lewis
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available=Ruinen sind keine Kulisse. Sie sind ein Weg.\nÜbe deine Fähigkeiten in den Ruinen. Du kannst deine Beweglichkeit dadurch enorm steigern.\nVersuch, Robb zu erreichen, den ich vorhin in den Ruinen spielen sah.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.accept=Alright. Ich erreiche die Plattform.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.tips=Hast du Tipps für mich?
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.later=Gerade nicht.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips=Such dir die nächste Landestelle, bevor du springst.\nNimm es langsam. Du musst nicht hetzen.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips.response.okay=Verstanden.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete=Noch hier unten? Dann hast du die Spitze der Ruinen noch nicht erreicht.\nHalte den Blick oben und bleib geduldig. Du wirst die Spitze irgendwann erreichen.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.remind=Erinner mich, wo Robb ist.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.go=Alright. Ich geh hoch.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location=Irgendwo oben, schätze ich. Ich hab ihn aus den Augen verloren, als er höher kletterte.\nWenn du Robb lachen hörst, bist du nah dran.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location.response.on_my_way=Ich bin unterwegs.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete=Wieder in einem Stück, wie ich sehe. Gute Arbeit.\nHat Robb sich anständig benommen? Ist er noch ganz? Er hat manchmal viel zu viel Selbstvertrauen da oben, aber ich vertraue ihm.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.remember=Ja, ihm geht's gut
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.useful=Er scheint ein bisschen jung dafür da oben zu sein.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools=Ja, er ist jung, aber wir haben hier wirklich nicht viel zu tun.\nEr spielt auf den Ruinen, um sich zu beschäftigen.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools.response.thanks=Oh, ich verstehe.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.after_completion=Wenn du jetzt auf zerbrochenen Stein schaust, solltest du denken: Route, Deckung, Fluchtweg.\nSehr nützlicher Ratschlag, da die Zombies hier immer häufiger werden.

# Plains - Ruins - Robb
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached=haha! ich kann's nicht glauben, dass du's geschafft hast!!!\nwillkommen an der Spitze! Von hier aus sieht man so viel. Das Spielen in den Ruinen macht echt Spaß, oder?\nIch hab zugesehen, wie du auf dem Weg nach oben runtergefallen bist. Es ist ziemlich lustig zu sehen, wie Leute versuchen, hier hochzukommen.\nWar Lewis wieder so ernst? Vielleicht will er, dass ich nach Hause komme.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.rough=So viel Spaß!
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.easy=Lewis bewundert deine Fähigkeit, hier rumzuklettern.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.trick=Ich kann auch kaum glauben, dass ich's geschafft hab.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough=wirklich richtig viel Spaß! hahaha! Schau dir nur den Ausblick an. Saug ihn in dich rein.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough.response.laugh=Haha! Ja! Ich seh's!
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy=Das glaube ich ihm. Ich komme so schnell voran. Ich bin der Beste beim Herumrennen hier oben.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy.response.okay=Nicht zu selbstsicher werden. Das ist gefährlich.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick=Übung macht den Meister. In Zukunft bist du sicherer in luftigen Höhen der Ruinen.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick.response.got_it=Verstanden.
skyblock_hub_dialogues.overworld.plains.ruins.robb.hello=heeey, wie geht's mit dem Parkour-Training. Ich bin sicher, du wirst besser.


# Jungle - Treetop Tropics - Nilo & Billy
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.hello=Hey, wie geht's dir? Noch am Leben? Gut! Danke, dass du Billy gefunden hast – er kann froh sein, dass er so süß ist, sonst wäre er vielleicht schon ein Bodenteppich!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction=Oh, Krise! Absolute Katastrophe! Meine Katze, Billy, ist schon wieder verschwunden. Er ist irgendwo über uns, plant wahrscheinlich die Weltherrschaft oder sucht einen Vogel zum Nerven. Kannst du mir helfen, das Biest zurückzuholen, bevor er für immer im Blätterdach lebt?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_1=Oh, das ist schrecklich! Ich hole ihn sofort.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_2=Ich schaue, wenn ich nicht damit beschäftigt bin, fallenden Lianen auszuweichen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_3=Ich bin gerade wirklich beschäftigt. Der Dschungel ist heute ein Chaos!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks=BILLY! Oh, Gott sei Dank! Ich kann nicht glauben, dass du ihn wirklich gefunden hast! Er hat immer so Hunger, als hätte er ein schwarzes Loch als Magen. Ich geh ihm schnell Fisch geben, bevor er anfängt, die Dschungeldielen zu fressen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_1=Kein Problem. Ich bin ein professioneller Katzenflüsterer.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_2=NOCH MEHR FISCH? DIESE KATZE IST EIN BODENLOSES FASS!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking=Wie läuft's? Irgendein Zeichen des pelzigen Flüchtlings?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking.response=Ich versuche es. Katzen sind hinterlistig, und Billy ist ein Profi-Ninja.

# Billy the Cat
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found=Miau <italic>(Schaut dich mit einem selbstgefälligen, wissenden Lächeln an)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found.response=Komm mit, du kleiner Unruhestifter. Lass uns nach Hause gehen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1=Miau <italic>(Bauch knurrt wie ein Donner)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1.response=Hier, etwas Fisch. Hör auf zu knurren!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2=Miau <italic>(Schaut dich erwartungsvoll an)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2.response=Hier, noch mehr Fisch.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3=Miau <italic>(Das Knurren geht weiter!)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3.response=Ist diese Katze ein Fass ohne Boden? Na gut, Fisch!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4=Miau <italic>(Unbeeindruckt)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4.response=Hier ist der vierte Fisch. Wirklich, Billy?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5=Miau <italic>(Wirkt endlich zufrieden)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5.response=Endlich! Lass uns nach Hause gehen.


# Jungle - George - Fishy Business
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction=Ah, das sanfte Zucken an der Leine, der absolute Nervenkitzel des Fangs! Meine Leidenschaft fürs Angeln ist legendär, obwohl ich schon so lange keine Leine mehr auswerfen konnte. Meine Familie ist hier im Dschungel, und ich würde sie für alle Ozeane der Welt nicht eintauschen, aber oh, wie vermisse ich das Wasser! Du musst es einfach ausprobieren – es ist pure Magie!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_1=Okay! Du hast mich überzeugt!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_2=Ist es wirklich so gut? Ich versuch's mal.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_3=Gerade nicht, George.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch=Wie genießt du das Angeln? Hast du den Rhythmus schon gefunden? Ich hoffe, du machst legendäre Fänge!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch.response=Ich arbeite dran, George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit=Wenn du genug Fisch gefangen hast, bring ihn mir zur genauen Inspektion!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit.response=Hier bitte.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks=Hab ich's dir nicht gesagt, dass es Spaß macht! Schau dir all diese Schönheiten an – du hast wirklich Talent dafür! Danke, dass du den Nervenkitzel mit mir geteilt hast; Angeln macht so viel Spaß, und mit Freunden noch mehr. Schade, dass ich selbst nicht zum See konnte!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks.response=Jederzeit, George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.hello=Hallo! Das Wasser ist schön, sogar im Dschungel! Lust auf einen Angelausflug? Aber weißt du, was es noch besser machen würde?\nMit so einem guten Freund angeln!


# Jungle - Celia - Bean to Bar
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.hello=Hallo. Ist Schokolade dein Lieblings-Dschungel-Essen? Ich hoffe es!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.come_back_for_sugar=Hallo. Wenn du mit Zucker zurückkommst, kann ich dir zeigen, wie du deine Schokolade süßen kannst.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available=Du da. Willst du lernen, wie man Schokolade macht? Tolle und leckere Schokolade. Auch wenn sie nicht unbedingt gesund ist, verschafft sie dir vielleicht einen Energieschub.\nFangen wir mit ungesüßter Schokolade an. Schokolade ohne Zucker ist eine viel gesündere Alternative.\nIch gebe dir das Rezept, aber du musst es selbst machen. Sag mir, wie es war.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_1=Lecker! Schokolade!!!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_2=Oh nein, ich mag keine Schokolade.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.in_progress_craft=Wie läuft die Schokoladenherstellung? Ich hoffe, die ungesüßte Schokolade erfüllt deine Erwartungen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete=Also? Gib mir den Bericht.\nWar sie bitter? Welche Nebenwirkungen hattest du?\nSo viele Leute drehen nach dem Schokoladenessen völlig durch.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_1=Bitter, aber brillant.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_2=Ich glaube, ich brauche Wasser.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available=Hey nochmal. Also, willst du lernen, wie man Zucker in die Schokolade gibt? Dann los.\nDu kennst den Ablauf. Ich gebe dir das Rezept, aber du musst es selbst machen. Sag mir, wie es war.\nVorsicht: Schokolade ist nicht gesund und sollte immer in Maßen genossen werden.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_1=Ja, lass uns mehr Schokolade machen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_2=Ich achte auf meine Gesundheit, aber na gut.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft=Wie läuft das Süßen der Schokolade? Ehe du's weißt, baust du ein Schokoladenimperium auf.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_1=Ich hab's. Easy.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_2=Ich bin nicht besonders gut im Schokolade machen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete=Du hast es geschafft! Schokolade. Vollmundig und reichhaltig, wie du es dir erhofft hast.\nJetzt bleib vernünftig und lauf nicht mit dem riesigen Zuckerrausch wild rum.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_1=Keine Sorge, ich bin sehr besonnen mit Schokolade.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_2=Der Zuckereinbruch wird wehtun.

# Jungle - Treetop Tropics - Non-Quest
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello=Einen Moment bitte. Ich muss nur kurz nach diesen Kakaobohnen schauen. Vielleicht sind sie reif.\nOh warte, was ist mit denen da...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello.response_1=Ich sehe, du bist gerade sehr beschäftigt.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello=Ich hab einige dieser Plattformen gebaut, als sie kaputt waren. Ich hoffe wirklich, dass mein Bauen gut genug ist, damit sie halten.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_1=Du hast das alles gebaut? Das ist beeindruckend.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_2=Du siehst aus, als würdest du gleich in Ohnmacht fallen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1=Danke. Na ja, nicht alles. Ich repariere nur Teile, wenn sie kaputt gehen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_1=So viele Geländer. Persönliche Vorliebe?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_2=Höhenangst...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_railings=Ja.\n<italic>(Er hält das Geländer mit beiden Händen fest.)</italic>\nHöhenangst führt zu zusätzlichen Sicherheitsmaßnahmen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_advice=Mach dich nicht drüber lustig. Ich kann nichts dafür, so bin ich eben.\nObwohl es natürlich meine Schuld ist, dass ich hier oben helfe. Ich wäre lieber unten am Boden als Angler.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_2=Hast du gesehen, in welcher Höhe wir uns befinden?! Wir sind so hoch, und ich hab Höhenangst! Vielleicht setzt da oben gerade Höhenkrankheit ein.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello=Hey, du da, willst du einen schrecklichen Witz?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_1=Na gut. Einen Witz. Lass es wehtun.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_2=Nein danke. Ich schätze meinen Seelenfrieden.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu=Wähl weise. Der Dschungel hat viele Raubtiere, aber keines ist so unerbittlich wie meine Pointe.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_1=Hau mir einen Blätterwitz rein.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_2=Gib mir was mit Spinnen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_3=Na gut. Mach Kakao lustig.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_1=Ich wollte den Dschungel verlassen, aber die Lianen sagten: "Nein, du bleibst."\nAlso stecke ich wohl in einer langen Blatt-schaft.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_2=Was nennt man zwei frisch verheiratete Spinnen?\nFrisch ver-netzt!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_3=Mein Kakao reift nie rechtzeitig. Er ist immer zu schoko-spät.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.avaru.hello=Hey! Was für ein wunderschöner Tag! Schön, dich kennenzulernen! Ich freue mich, dich öfter zu sehen!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cressida.hello=SCHAU DIR DIESEN BAUM AN! ER IST SO GROSS! :O\nWie kommt das Wasser bloß bis ganz nach oben?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello=Wenn du einen Ozelot siehst, jag ihn nicht. Er hat großen Respekt vor dir.\nDieser Rat gilt auch für Menschen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello.response=Ich übe mein bestes unbeeindrucktes Gesicht.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.silva.hello=Hey, schau wo ich bin! Ich bin unter einem Baum!\nFrüher hatte ich Angst davor, aber dann hab ich seine Wurzeln bemerkt. Die sind Würfel. Also betrachte ich diesen Baum rein mathematisch als eindimensional, weil ich auf seine Kubikwurzel schaue.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello=Du siehst frisch aus dem Oak Forest aus.\nWillkommen im Dschungel, Reisender. Du musst dich daran gewöhnen, hoch in den Bäumen zu klettern. Ich hoffe, du hast keine Höhenangst.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_1=Gut zu wissen. Höhen sind kein Problem für mich.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_2=Oh nein, das wird schwierig für mich.
skyblock_hub_dialogues.misc.optimiser_not_unlocked=Hallo! Ich bin der Optimierer! Ich kann die Produktion all deiner Ressourcen ankurbeln.\nIch bin ziemlich wählerisch, mit wem ich arbeite, also komm bitte wieder, wenn du weiter fortgeschritten bist!

# Shop Dialogues
skyblock_hub_dialogues.shop.blocks.greeting=Moin, bessere Blöcke findest du nirgendwo! Willst du mal reinschauen?
skyblock_hub_dialogues.shop.blocks.greeting.buy=Was hast du zu verkaufen?
skyblock_hub_dialogues.shop.blocks.greeting.sell=Ich will dir was verkaufen!
skyblock_hub_dialogues.shop.blocks.greeting.nothing=Nein danke!
skyblock_hub_dialogues.shop.furniture.greeting=Tolle Möbel für eine tolle Person! Darf ich dir welche zeigen?
skyblock_hub_dialogues.shop.furniture.greeting.buy=Zeig mir, was du hast!
skyblock_hub_dialogues.shop.furniture.greeting.sell=Ich hab ein paar Sachen zu verkaufen.
skyblock_hub_dialogues.shop.furniture.greeting.nothing=Ich bin gut versorgt, danke.
skyblock_hub_dialogues.shop.garden.greeting=Ich hab alles, damit dein Garten blüht! Interesse?
skyblock_hub_dialogues.shop.garden.greeting.buy=Zeig mir, was du zu verkaufen hast!
skyblock_hub_dialogues.shop.garden.greeting.sell=Ich würde gerne ein paar Sachen verkaufen.
skyblock_hub_dialogues.shop.garden.greeting.nothing=Nein danke!
skyblock_hub_dialogues.shop.misc.greeting=Ich seh dich umschauen! Was hat dein Auge erwischt?
skyblock_hub_dialogues.shop.misc.greeting.buy=Was kann ich hier kaufen?
skyblock_hub_dialogues.shop.misc.greeting.sell=Ich hab eigentlich ein paar Sachen zu verkaufen.
skyblock_hub_dialogues.shop.misc.greeting.nothing=Gerade nichts, danke.
skyblock_hub_dialogues.shop.ore.greeting=Alle Erze, die dein Herz begehrt! Willst du mal schauen?
skyblock_hub_dialogues.shop.ore.greeting.buy=Zeig mir deine Erze!
skyblock_hub_dialogues.shop.ore.greeting.sell=Ich will dir was verkaufen.
skyblock_hub_dialogues.shop.ore.greeting.nothing=Gerade nicht, danke.
skyblock_hub_dialogues.shop.spawner.greeting=Bereit, mehr Monster zu spawnen? Ich hab genau das Richtige!
skyblock_hub_dialogues.shop.spawner.greeting.buy=Zeig mir, was du hast!
skyblock_hub_dialogues.shop.spawner.greeting.sell=Ich möchte eigentlich gerne ein paar Sachen verkaufen.
skyblock_hub_dialogues.shop.spawner.greeting.nothing=Vielleicht nächstes Mal, danke.

# Cold Taiga - Ivar - Frozen Harvest
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro=Der Winter hat uns fest im Griff und die Getreidespeicher werden gefährlich leer. Ich muss dafür sorgen, dass alle durch den Frost satt bleiben. Kannst du rausgehen und mir etwas Weizen sammeln?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro.response.accept=Klar, ich helfe dir! Das Dorf braucht es.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources=Kopf unten und Hände in Bewegung. Wie läuft's mit dem Weizenernte?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources.response=Noch dabei! Der Frost ist schwer zu durchschneiden.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro=Schön, dich zurück zu sehen. Etwas für die Speicher gefunden?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro.response.yes=Hier ist der Weizen, frisch geerntet!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks=Gute Arbeit. Das hält das Dorf ein paar Tage satt. Bis bald!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks.response=Gerne!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello=Wie läuft's! Lass die Kälte nicht in deine Knochen eindringen.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello.response=Super! Bleib warm!

# Cold Taiga - Felix - Winter Warmth
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro=Die Kälte setzt sich heute Nacht wirklich fest, oder? Ich versuche, alle warm zu halten, aber uns geht der Brennstoff für die Kamine aus. Könntest du mir ein paar Fichtenstämme sammeln, damit wir warm bleiben?
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro.response.accept=Klar, ich helfe dir! Hauptsache, das Dorf bleibt behaglich.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro=Oh, du bist zurück! Hast du ein paar Fichtenstämme gefunden? Die Kälte setzt sich hier wirklich fest, meine Familie und ich werden schon etwas frostig!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro.response.yes=Hier sind die Fichtenstämme!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks=Perfekt. Vielen Dank für deine Hilfe. Du hast wirklich das herzlichste Gemüt – das macht diesen Ort so viel mehr wie ein Zuhause.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks.response=Gerne!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello=Hallo! Es ist so schön, dich zu sehen. Ich hoffe, dein Tag war genauso wunderbar wie du!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello.response=Hey! Bleib warm!

# Cold Taiga - Felix - Warmth in the Cold
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro=Danke, dass du uns warm gehalten hast. Würdest du mir auch helfen, etwas Schneebeeren, Fichtenkrümel und gepuderten Lapis-Zucker zu besorgen?\nDas sind seltene Ressourcen aus der Snowy Taiga, aber für dein Überleben wertvoll.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro.response.accept=Ich sammle das für dich!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro=Hast du die Zutaten gefunden, die ich brauche?\nSie sind alle in der Snowy Taiga zu finden: Die Schneebeeren wachsen bevorzugt nahe Beerensträuchern. Der gepuderte Lapis-Zucker bildet sich auf der Oberfläche gefrorener Seen, da er sich aus dem darunter liegenden Gestein ins Wasser löst. Und die Fichtenkrümel sind am schwierigsten zu finden, aber du solltest sie neben Fichten entdecken.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro.response.yes=Ich gebe dir, was ich habe!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks=Ausgezeichnet! Ich habe gehört, dass Schneebeeren in Verliesen sehr hilfreich sein können. Sie stellen deine Gesundheit wieder her und geben dir eine zusätzliche Schutzschicht!\nKannst du sie für mich testen? Iss im Verlies ein paar Schneebeeren und sag mir, wie sie wirken!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks.response=Ich teste sie!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress=Hast du die Schneebeeren schon in einem Verlies probiert? Ich bin gespannt, ob sie so hilfreich sind, wie ich denke!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress.response=Noch nicht, ich geh sie gleich testen!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete=Oh, die Schneebeeren haben also im Verlies geholfen! Das freut mich! Wenn ich eine esse, fühlt es sich an wie eine warme Umarmung.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete.response=Kein Problem!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro=Das Eis in der Tiefe bewegt sich in letzter Zeit und legt blaue Adern frei, die dort nicht sein sollten. Ich brauche Lapislazuli für meine Forschung. Kannst du etwas mit verschiedenen Werkzeugen abbauen? Ich möchte sehen, ob die Abbaumethode die Resonanz des Steins verändert.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro.response.accept=Klar, ich helfe dir bei der Untersuchung!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress=Wie läuft's mit dem Lapislazuli-Abbauen mit verschiedenen Werkzeugen? Irgendwelche ungewöhnlichen Vibrationen im Stein?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress.response=Ich bin noch dabei!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro=Ausgezeichnet. Kann ich die Lapislazuli-Stücke haben, die du mit verschiedenen Werkzeugen abgebaut hast? Ich muss die strukturelle Integrität jeder Charge vergleichen.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro.response.yes=Hier bitte!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks=Danke. Einen Moment, ich überprüfe das...\n...\nNun ja, enttäuschend. Die Kristallstruktur hat sich überhaupt nicht verändert. Sie sind identisch. Das war eine riesige Zeitverschwendung.\nZumindest haben wir bestätigt, dass hier noch einfache Physik gilt und Holzwerkzeuge für diese Tiefe völlig nutzlos sind.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_1=Oh, schade. Wissenschaft ist Versuch und Irrtum, oder?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_2=Ich weiß nicht genau, was du erwartet hast, ehrlich gesagt.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello=Das Eis erzählt Geschichten, wenn man tief genug schaut.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello.response=Das stimmt wirklich...

# Cold Taiga - Sigrid - Feather and Grain
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro=Der Frost beißt diese Saison tiefer, und mit dem Zittern des Canyonbodens müssen wir füreinander sorgen. Wir überleben zusammen, oder gar nicht. Kannst du mir helfen, einen ordentlichen Vorrat für das Dorf anzulegen?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro.response.accept=Ich leg gleich los! Niemand sollte hungern.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro=Oh, du bist zurück! Komm näher ans Feuer, Kleines, ich seh die Kälte auf deinen Schultern. Wie läuft das Sammeln?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro.response.yes=Hier ist das Essen, das du gebeten hast!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks=Herzlichen Dank. Das hält die Kleinen warm und die Stimmung der Älteren hoch. Solche Gemeinschaftsleistung wie deine hält das Eis davon ab, unsere Herzen zu erreichen.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks.response=Schön, der Gemeinschaft helfen zu können!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello=Hallo! Hier wartet immer ein warmer Platz und ein freundliches Wort auf dich.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello.response=Hi!


# Cold Taiga - Inga - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.before_unlock=Shiverfield hat diese Jahreszeit immer Hunger. Wenn du etwas zu essen suchst, sprich mit Sigrid. Ich hab hier alle Hände voll zu tun.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro=Vorsicht! Tritt nicht da drauf. Die werden auf deine Stiefel losgehen, als hättest du Getreide in der Tasche.\n\nIch fing mit ein paar Hennen an. Gerade genug, um die Öfen am Laufen zu halten, wenn der Frost am härtesten zuschlägt.\n\nAber in letzter Zeit? Es ist, als könnte der Winter sie nicht berühren. Die lila Seuche breitet sich aus, die Menschen hungern, und meine Hühner vermehren sich, als würden sie uns auslachen.\n\nDie sind überall. In den Schneewehen. Auf den Dächern. Sie picken Löcher in Säcke, die wir nicht ersetzen können.\n\nIch kann sie nicht einfach... niedermachen. Sie sind meine und sie leben. Ich hab sie großgezogen.\n\nBitte. Sprich mit Runa bei der Shiverfield-Wache. Sie weiß, was zu tun ist. Ich brauche eine Antwort, die mir den Magen nicht umdreht.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_1=Ich spreche mit ihr.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_2=Hühner, die ein Dorf übernehmen. Das ist neu.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.in_progress=Wenn du sie in den Straßen siehst, jag sie bitte nicht zum Spaß. Sie vertrauen Menschen. Das ist das Schlimmste daran.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete=Deine Hände riechen nach Federn.\n\n...Lüg nicht. Ich seh's in deinen Augen.\n\nDu hast getan, was Runa dir gesagt hat, oder?\n\nIch hasse es. Ich hasse, dass es Sinn ergibt.\n\nShiverfield braucht Essen. Und Pfeile. Und dem Winter ist es egal, was wir wollen.\n\nWenn ich mir das nächste Mal sage, dass ich alles mit guten Absichten schützen kann, erinnere mich bitte daran.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_1=Es tut mir leid. Wir hatten keine andere Wahl.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_2=Deine Herde hat das Dorf genährt, auf die eine oder andere Art.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_3=Ich helfe dir, den Stall neu aufzubauen, damit es nicht nochmal passiert.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.after_completion=Ich mag Hühner immer noch. Ich mag Shiverfield nur mehr.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello=Hallo.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello.response=Hi!

# Cold Taiga - Runa - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro=Inga hat dich geschickt. Ich hab die Herde gehört, bevor ich dich gesehen hab.\n\nSchau, das macht mir niemand Spaß. Niemandem hier.\n\nAber die Straßen werden schlimmer. Jäger kommen seltener zurück. Die lila Korruption lässt den Wald falsch anfühlen, als würden die Schatten lauschen.\n\nWir haben ein Dorf zu ernähren und vor den seltsamen Dingen da draußen zu schützen.\n\nHühner bedeuten Fleisch für die Hungrigen und Federn zum Befiedern der Pfeile. Ohne Pfeile sind wir Wächter nur eine Mauer aus leeren Händen.\n\nDu wirst zehn ernten müssen. Bring mir zehn Federn. Wir verschwenden nichts, was wir nehmen.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_1=Verstanden. Ich erledige es.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_2=Inga wird nicht erfreut sein.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_3=Ich sorge dafür, dass es dem Dorf nützt.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.in_progress=Wir müssen die Hühnerzahl noch etwas weiter reduzieren. Sie überrennen immer noch alles.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro=Hast du die Federn?\n\nSie sind sehr wertvoll für die Wache, da sie viele Pfeile daraus machen.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_1=Ja, hier sind sie.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_2=Ich mochte es nicht, diese Hühner zu töten.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks=Reichlich. Genug, um die Wache eine Weile zu versorgen.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks.response_1=Gut.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.after_completion=Wenn du Shiverfield ernähren kannst, hältst du es am Leben. Das ist die Aufgabe.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello=Sei da draußen vorsichtig. Die Wache kann dich in der Nähe schützen, aber in den Tiefen der Tundra bist du selbst verantwortlich.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello.response=Ich pass auf mich auf.

# Cold Taiga - Kjell - Corrupted Curiosity
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available=Vorsicht! Diese Hühner sind ausgerastet!\nMit denen stimmt was nicht, und sie greifen mich an. Sehr seltsames Verhalten.\nIch bin Kjell. Ich bin so eine Art Wissenschaftler. Ich habe Chemie in der Schule geliebt, aber ich glaube, ich hab eine Ahnung, was hier vor sich geht.\nKönntest du mir eines dieser korrupten Hühner holen, damit ich es genauer untersuchen kann?
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_1=Oh je, böse Hühner. Ich kümmere mich darum!
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_2=Ich helfe dir, der Sache auf den Grund zu gehen.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro=Hast du das korrupte Huhn? Ich kann es kaum erwarten, diesem Fluch auf den Grund zu gehen.\nAch, und was auch immer du tust – iss es nicht. Das sieht nach einer furchtbaren Idee aus und hat keinerlei Vorteile.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro.response_yes=Ich habe das Huhn.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit=Super! Du hast es! Lass uns mal sehen, was wir hier haben...\n...\nOh, ich glaube, es ist lebendig? Das lila Zeug. Das ist kein Stein.\nNun... mehr kann ich nicht beitragen. Ich hab gesagt, ich bin gut in Chemie, nicht in Biologie.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_1=Lebendig? Oh je...
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_2=Ich schätze, wir müssen weitersuchen
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.hello=Wenn du mehr Antworten zu dem lila Zeug bekommst, will ich es unbedingt wissen. Ich kann nicht glauben, dass es lebendig ist!


skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.dungeon_guard.introduce=Woah! Hab ich gehört, dass du hier bist, um zu helfen?\nWir haben ein riesiges Problem unten in unseren brandneuen Minen.\nWir haben gegraben und versucht, wertvolle Lapislazuli-Vorräte unter den Seen zu fördern.\nAber wir sind überrannt worden! Da sind so viele Monster und Krabbeltiere. Es scheint, als wollten sie den Lapislazuli für sich selbst.\nWirst du uns helfen?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro=Die Hitze ist nicht das Einzige, was uns zermürbt – das Fundament dieser Oase verschiebt sich. Wir brauchen Sandstein, um die Anker zu verstärken, bevor der Sand das Letzte der Oberfläche verschluckt. Kann ich auf deine Stärke zählen?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro.response.accept=Ich helfe dir, die Fundamente zu sichern!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro=Ruhig jetzt. Hast du den Sandstein für die Verstärkungen besorgt?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro.response.yes=Ich habe die Materialien hier!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks=Das gibt uns etwas Zeit gegen das Absinken. Jeder platzierte Stein ist ein Schild gegen das unvermeidliche Abrutschen. Danke.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks.response=Schön, dass ich helfen konnte, die Wüste stabil zu halten.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello=Halt die Füße leicht und die Augen am Horizont. Die Wüste hört nie auf, sich zu bewegen.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello.response=Ich bleibe wachsam, Zahra. Danke.

# Desert - Unsafe Roads
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro=Die Routen werden gefährlicher – der Sand verschluckt die Markierungen schneller, als wir sie setzen können. Kannst du mir etwas Sandstein bringen, damit wir die Routen verstärken können?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro.response.accept=Ich besorge das für dich.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress=Die Dünen sind heute unruhig. Hast du genug gefunden? Wir müssen sicherstellen, dass wir genug haben, um den Weg zu verankern.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress.response=Ich suche noch...
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return=Gut gemacht. Die Mannschaft meldet, dass die Stützen halten. Aufmerksamkeit ist unsere beste Verteidigung hier. Danke.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return.response=Jederzeit!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello=Augen auf. In dieser Wüste: Wenn du die Gefahr nicht im Blick hast, hat die Gefahr dich im Blick.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello.response=Hey!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.intro=Talib hat dich geschickt? Gut. Der Boden ist hier weich und die Dünen rücken vor. Hast du den Sandstein?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.response=Hier ist er.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks=Danke, das macht die Straße viel fester. Die Erde rutscht damit weniger wahrscheinlich ab.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks.response=Prima!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello=Ein schöner Tag zum Bauen, sofern der Wind unsere Arbeit nicht wieder zunichte macht.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello.response=Stimmt.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.intro=Die Erschütterungen lassen die Passagewände zittern. Die Schlammziegel helfen, den Weg zu stabilisieren. Hast du sie?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.response=Ja, hier sind sie.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks=Perfekt, genau das brauchten wir als Puffer gegen die Vibrationen.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks.response=Gerne.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello=Sei vorsichtig auf den Straßen. Die Wüste hat eine Art, sich aufzutun, wenn man es am wenigsten erwartet.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello.response=Werde ich sein.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.intro=Ohne ein schweres Fundament treibt der Sand einfach weg. Granit ist für das Fundament unerlässlich. Hast du welchen mitgebracht?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.response=Ich habe Granit dabei.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks=Das ist hochwertiger Granit! Er ist schwer genug, um den Erschütterungen standzuhalten. Danke.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks.response=Gern geschehen.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello=Die Wüste kann für die ungnädig sein, die auf flachem Grund bauen.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello.response=Sag mir davon.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.intro=Wir müssen die Überhänge abstützen, bevor sie einstürzen. Endlich etwas Holz für die Stützen! Hast du die Fichtenbretter?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.response=Ja, Fichtenbretter wie gewünscht.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks=Ausgezeichnet! Wir haben jetzt alles verstärkt. Geh und sag Talib Bescheid.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks.response=Ich bin schon unterwegs!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello=Harte Arbeit ist das Einzige, was der Sand nicht erodieren kann.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello.response=Das stimmt wirklich.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro=Die Tage werden heißer und die Nächte unsicherer. Wir brauchen Vorräte, damit die Siedlung nicht zusammenbricht. Hilfst du mir, unsere Zukunft zu sichern?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro.response.accept=Ich kann dabei helfen.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro=Ruhig jetzt. Jeder Vorrat zählt, wenn der Sand anfängt sich zu verschieben. Hast du Vorräte für den Lagerbestand?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_1=Ja, ich habe sie.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_2=Natürlich! Ich helfe immer gerne!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.no=Oh, tut mir leid! Gerade nicht!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks=Methodische Arbeit zahlt sich aus. Diese Vorräte halten uns durch die langen Nächte aufrecht. Danke.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks.response=Gern geschehen.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello=Die Wüste kennt keine Gnade für die Unvorbereiteten. Pass da draußen auf dich auf.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello.response=Du auch.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro=Der wandernde Sand legt Dinge frei, die vergraben hätten bleiben sollen. Die Routen werden von Zombies überschwemmt und das macht das Reisen unmöglich.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro.response.accept=Ich kümmere mich darum und räume den Weg frei.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro=Die Luft fühlt sich etwas leichter an, jetzt wo diese Monster weg sind. Hast du etwas Zombiefleisch für mich? Ich brauche einen Beweis, dass die Dünen sicherer sind.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_1=Igitt, faules Fleisch. Du kannst's haben, wenn du willst.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_2=Ich kann wohl ein paar für die gute Sache abgeben.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon=Die Bedrohung verblasst hier nie wirklich. Komm zurück, wenn du die Dünen geräumt hast.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_1=Mach ich! Es läuft gut!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_2=Zombies machen mir Angst D:
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response=Mach ich.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete=Mit deiner Hilfe haben wir diesen Straßenabschnitt gesichert. Wir sind so ein starkes Team!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_1=Schön, die Straßen offen zu halten.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_2=Absolut einverstanden!
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello=Die Wüste birgt viele Gefahren unter ihrer Oberfläche. Bleib wachsam.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_1=Hallo.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_2=Ich hoffe, es geht dir gut!
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro=In einem Land, das versucht, alles Zarte zu töten, überleben nur die Härtesten. Kaktus ist nützlich – er liefert Wasser, Schutz und ein Pigment, das in diesem grellen Licht nicht verblasst. Bring mir etwas davon.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro.response.accept=Ich mache mich sofort daran.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro=Der Sand bewegt sich wieder. Hast du den Kaktus, um den Perimeter zu befestigen?
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro.response.yes=Hier ist er.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks=Das wird bestehen, wenn andere Dinge verwelken. Es ist eine harte Pflanze für eine harte Welt. Danke.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks.response=Gern geschehen!
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello=Die Hitze, der Sand und die Zeit – sie streifen alles ab bis auf die Wahrheit. Oh hey, ich hab mit mir selbst geredet...
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello.response=Hi!
skyblock_hub_dialogues.overworld.desert.duneside.azim.hello=Entschuldige, ich bin gerade ziemlich beschäftigt. Ich versuche, eine Windturbine zu bauen. So viel Energie lässt sich im Wind einfangen. Wir wollen die Wüstentemperatur nicht durch Kohleverbrennung weiter erhöhen.
skyblock_hub_dialogues.overworld.desert.duneside.todd.hello=Hey! Ich bin Todd!\nStöre mich nicht, ich bewache nur diese Tür, damit keine Kreaturen von drinnen entkommen. Das ist der Duneside-Fluchttunnel, aber er ist von Kreaturen überrannt worden.\nWenn du helfen willst, ist Sunny unten im Fluchttunnel. Ich befürchte, sie schafft es alleine nicht.\nDu kannst hier nicht rein, also musst du den anderen Eingang unten in Duneside finden.
skyblock_hub_dialogues.overworld.desert.duneside.bashara.hello=Tritt nicht auf den dunkleren Sand. Ich glaube, da ist etwas Geheimnisvolles darunter.
skyblock_hub_dialogues.overworld.desert.duneside.corvin.hello=Ich erinnere mich nicht an diese Steine hier. Ich hoffe wirklich, dass die Decke nicht einstürzt.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello=Durst bringt uns ins Kämpfen. Ich verkaufe etwas, das hilft, auch wenn alle es hassen.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_1=Die Leute hassen es?
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_2=Schön, dich kennenzulernen! Ich bin nur auf der Durchreise.
skyblock_hub_dialogues.overworld.desert.duneside.derya.detail_1=Ich verkaufe Kaktuswasser. Das ist kein normales Wasser. Es ist etwas süßer, schätze ich.\nAlle fürchten sich davor, weil ich die Kaktusstacheln nicht besonders gut rausbekomme.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello=Halt deine Hand hin. Ich kann deine Zukunft lesen...
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_1=Alright. Lies meine Zukunft.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_2=Nein danke.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1=Ich sehe drei Formen.\nEinen Kaktus. Eine Tür. Und einen sehr genervten Zombie.\nIch schätze also, deine Zukunft enthält all diese Dinge.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_1=Eine Tür?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_2=Ein genervter Zombie?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_3=Das ist doch Unsinn.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_doorway=Ich kann leider nicht mehr lesen als das. Ich habe nur eine Tür in meiner Vision gesehen. Vielleicht wird diese Tür für dich sehr bedeutsam.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_zombie=Haha! Du wirst in der Zukunft eindeutig einen Zombie nerven.\nIch hab noch nie gesehen, dass ein Zombie irgendeine Art von Emotion zeigt, du musst ihn also wirklich auf die Palme bringen.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_nonsense=Natürlich ist es das.\nUnsinn ist leichter zu tragen als Gewissheit. Ich bin nur hier, um die Moral der Menschen um mich herum zu stärken.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello=Ugh, Sand schmeckt ekelhaft. Er weht mir immer in den Mund.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello.response_1=Warum stehst du so nah am Sand?
skyblock_hub_dialogues.overworld.desert.duneside.vesper.detail_1=Ich hab Orte, wo ich hin muss! Ich lasse mich vom Sand nicht aufhalten.
skyblock_hub_dialogues.npc_name.devin=Devin
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello=Die Entwickler dieses Spiels sagen, es sei schwer, immer so viele Dialoge für verschiedene NPCs zu schreiben, also haben sie einfach einige davon kopiert.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_1=Wie faul.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_2=Das hab ich noch nicht erlebt. Ich werde ein Auge drauf haben
skyblock_hub_dialogues.overworld.desert.duneside.dungeon_guard.introduce=Hey! Kannst du das glauben! Der Duneside-Fluchttunnel ist von bösen Kreaturen überrannt worden!\nDer Fluchttunnel ist überlebenswichtig für uns. Viele starke Sandstürme verschütten den Haupteingang zu Duneside, und der Fluchttunnel ist unser einziger Notausgang!\nIch bin ermächtigt worden, unser altes System zu nutzen, um den Tunnel mit Lava zu fluten und ihn zu desinfizieren. Allein bis hier runtergegangen zu sein hat mich schon außer Atem gebracht, ich glaube nicht, dass ich das selbst anpacken sollte.\nHättest du Lust dazu?

# NPC Names
skyblock_hub_dialogues.npc_name.alder=Alder
skyblock_hub_dialogues.npc_name.thorne=Thorne
skyblock_hub_dialogues.npc_name.bram=Bram

# Alder Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.before_unlock=Viel zu tun. Bäume pflegen, Holz verarbeiten. Komm später wieder, wenn du was brauchst.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available=Du hast Ronan geholfen, die Schäden von den Erschütterungen zu reparieren, oder? Gute Arbeit. Aber wir können nicht einfach weiter Risse ausbessern, jedes Mal wenn der Boden sich bewegt. Ich denke schon eine Weile... die alten Eichen haben Schlimmeres überstanden. Ihre Wurzeln breiten sich weit aus und geben mit der Erde nach. Vielleicht können wir von ihnen lernen. Willst du mir helfen, etwas zu testen?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.what_thinking=Was hast du im Sinn?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.got_time=Ich hab Zeit. Was brauchst du?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.not_now=Gerade nicht, tut mir leid.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation=Bram und ich haben über flexible Fundamente gesprochen – Strukturen, die sich *mit* dem Boden bewegen, anstatt dagegen zu reißen. Der Wald macht das bereits. Jedes Mal, wenn der Wind die Baumkronen trifft, absorbieren die Wurzeln den Stress. Wenn wir dieses Prinzip nachahmen können... nun, dann biegen sich die Gebäude beim nächsten Beben vielleicht, anstatt zu brechen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.how_help=Wie kann ich helfen?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.complicated=Klingt kompliziert.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.think_about=Ich denke darüber nach.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response=Es ist einfacher als du denkst. Die Natur hat das Problem schon gelöst. Wir müssen nur beobachten und anpassen. Fang damit an, die Alte Eiche anzuschauen – ihre Wurzeln halten seit Jahrzehnten stand. Da liegt die Antwort.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.im_in=Alright, ich mach mit.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.come_back=Lass mich dazu nochmal zurückkommen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions=Perfekt. Es gibt jemanden, mit dem du zuerst sprechen solltest – Thorne. Er ist ein Baumforscher, der die Alte Eiche seit Wochen studiert. Er hat ein Lager in der Nähe aufgeschlagen. Wenn jemand versteht, wie diese Wurzeln durch Erschütterungen stabil bleiben, dann er. Finde Thorne und schau, was er herausgefunden hat.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions.response.find_him=Ich finde ihn.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active=Thorne ist noch bei der Alten Eiche und studiert die Wurzelsysteme. Geh zu ihm – er erklärt das besser als ich.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active.response.on_way=Ich bin auf dem Weg.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return=Du bist zurück. Was hast du gesehen?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.roots_web=Die Wurzeln breiten sich überall aus wie ein Netz.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.big_tree=Das ist nur ein großer Baum.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.correct_observation=Genau. Ein Netz. Jede Wurzel stützt die anderen. Wenn der Boden sich verschiebt, gibt das gesamte Netzwerk gemeinsam nach – kein einzelner Versagungspunkt. Das brauchen Gebäude. Nicht starre Blöcke, die unter Druck reißen, sondern miteinander verbundene Stützen, die Stress verteilen. Bram kann die Gitterstruktur entwerfen, aber wir brauchen Materialien. Viele davon.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.playful_correction=Schau beim nächsten Mal genauer hin. Dieser "einfache große Baum" hat Jahrhunderte überlebt, indem er klüger war als wir. Seine Wurzeln breiten sich weit und tief aus – wenn der Boden sich bewegt, gibt das gesamte Netzwerk nach. Das ist das Geheimnis. Jedenfalls hast du genug gesehen. Jetzt brauchen wir Materialien, um etwas Ähnliches zu bauen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions=Das brauchen wir: Zuerst sammle Eichensetzlinge. Nicht gepflanzte – natürliche. Ich möchte ihre frühen Wurzelmuster studieren und sie als lebende Stoßdämpfer rund um wichtige Strukturen nutzen. Währenddessen brauchen wir gefertigte Komponenten. Bram braucht Eichenplatten. Sie verteilen das Gewicht besser als ganze Blöcke. Und Eichenzäune. Sie schaffen flexible Gitterstützen, wie sich verflechtende Wurzeln. Du kannst das alles in deinem eigenen Tempo erledigen. Komm zurück, wenn du die Setzlinge hast, und liefere die gefertigten Teile an Bram.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.got_it=Verstanden. Setzlinge, Platten, Zäune.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.why_saplings=Warte, warum Setzlinge?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.lot_crafting=Das ist eine Menge Craften.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_explanation=Junge Bäume passen sich schneller an. Wenn wir sie neben Fundamenten pflanzen, wachsen ihre Wurzeln auf natürliche Weise in das Stütznetzwerk hinein. Außerdem verrät uns ihr frühes Wachstum, wie wir die Holzgitter formen sollen. Lebende und gebaute Strukturen, die zusammenarbeiten – das ist das Ziel.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.workload_acknowledgment=Das stimmt. Aber wenn wir das zum Laufen bringen wollen, müssen wir es richtig machen. Lass dir Zeit. Der Wald eilt nicht, und du auch nicht.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check=Wie läuft das Sammeln? Ich brauche diese sechzehn Eichensetzlinge, sobald du sie zusammen hast. Und vergiss nicht, dass Bram auf die Platten und Zäune wartet.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.working_on_it=Ich arbeite dran.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.remind_me=Erinner mich, was du brauchst?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.requirements_reminder=Sechzehn Eichensetzlinge für mich. Vierundsechzig Eichenplatten und zweiunddreißig Eichenzäune für Bram. Alles Eichenholz.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered=Du hast die Setzlinge! Lass mich die mal ansehen. *(untersucht sie)* Gute Exemplare – gesunde Wurzelsysteme bilden sich schon. Diese werden sich perfekt mit den Gitterstützen verbinden, wenn Bram fertig mit dem Bau ist. Ausgezeichnete Arbeit.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.what_do=Was machst du mit ihnen?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.happy_help=Gerne geholfen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.planting_strategy=Ich pflanze sie strategisch rund um die Gebäude. Wenn sie wachsen, schaffen ihre Wurzeln eine natürliche Verstärkung – lebende Fundamente, die mit dem Boden nachgeben. Kombiniert mit Brams Holzstützen bekommen wir ein Hybridsystem. Das Beste aus beiden Welten.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram=Die Setzlinge sind perfekt. Jetzt müssen nur noch Brams Materialien her. Hast du ihm die Platten und Zäune schon gebracht?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.working=Ich bin dabei.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.not_yet=Noch nicht.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete=Du hast alles getan, was wir gefragt haben, und noch mehr. Bram hat bereits begonnen, das Gittergerüst zusammenzubauen, und ich habe die Setzlinge rund um die kritischen Strukturen gepflanzt. Wenn das nächste Beben kommt – und es wird kommen – wird dieses Dorf nicht einfach zusammenhalten. Es wird sich anpassen. Du hast uns geholfen, etwas zu bauen, das lernt – etwas, das hält. Der Wald gibt, aber du hast dafür gesorgt, dass wir zuhören. Danke.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.will_work=Wird das wirklich funktionieren?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.glad_help=Schön, dass ich helfen konnte.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.another_tremor=Was passiert, wenn es ein weiteres Beben gibt?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.confidence=Ich glaube schon. Die Prinzipien sind solide – die Natur nutzt sie seit Jahrtausenden. Brams Handwerkskunst ist gut. Und du hast uns genau das gegeben, was wir brauchten. Wenn der Boden wieder bebt, werden wir bereit sein.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_readiness=Dann sehen wir, ob unser Bauwerk standhält. Aber selbst wenn nicht, haben wir etwas gelernt. So funktioniert Fortschritt – beobachten, anpassen, verbessern. Das lehrt der Wald jede Saison.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion=Die flexiblen Fundamente halten bislang gut. Noch keine Beben, aber wenn sie kommen, sind wir bereit. Ich pflege die Setzlinge noch – sie wachsen schön. Nochmals danke für deine Hilfe.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.good_hear=Schön zu hören.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.other_projects=Noch andere Projekte?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_projects=Es gibt immer etwas zu verbessern. Aber fürs Erste konzentriere ich mich darauf. Der Wald gibt – ich helfe ihm nur ein wenig.

# Thorne Dialogues
skyblock_hub_dialogues.overworld.oak_forest.thorne.before_quest=Oh! Hallo. Ich bin Thorne – Dendrochronologe. Das bedeutet Baumalterforscher, um es einfacher zu sagen. Ich dokumentiere die Wurzelarchitektur der Alten Eiche. Faszinantes Exemplar. Ich bin jetzt fast drei Wochen hier und entdecke immer noch neue Verzweigungsmuster!
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction=Alder hat dich geschickt? Ausgezeichnet! Er hat dich gebeten, meine Erkenntnisse zu erfahren, oder? Nun, du bist am richtigen Ort. Diese Eiche *(zeigt auf den riesigen Baum)* ist über 300 Jahre alt, und ihr Wurzelsystem ist absolut bemerkenswert. Siehst du, wie die Wurzeln sich in einem ineinandergreifenden Gitter nach außen ausbreiten? Jede Hauptwurzel verzweigt sich in Sekundärwurzeln, die sich in Tertiärwurzeln verzweigen... das schafft Redundanz. Wenn ein Abschnitt beschädigt oder belastet wird, verteilt sich die Last über das gesamte Netzwerk. Während des Bebens letzte Woche hab ich beobachtet, wie sich der Boden verschob – man konnte die Wurzeln tatsächlich *sehen*, wie sie sich bogen und die Bewegung absorbierten. Der Baum schwankte kaum. Das ist das Geheimnis: Flexibilität plus Vernetzung ergibt Stabilität.
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.roots_web=Also wirken die Wurzeln wie ein Netz?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.help_buildings=Wie hilft das bei Gebäuden?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.incredible=Das ist unglaublich.
skyblock_hub_dialogues.overworld.oak_forest.thorne.web_confirmation=Genau! Ein dreidimensionales Netz, das sich wie ein Organismus bewegt. Kein einzelner Versagungspunkt. Wenn Alder und Bram dieses Prinzip mit Holzstützen nachahmen können, überstehen die Gebäude Erschütterungen viel besser als starre Steinfundamente. Die Natur perfektioniert dieses Design seit Millionen Jahren – wir leihen uns nur den Bauplan.
skyblock_hub_dialogues.overworld.oak_forest.thorne.buildings_explanation=Ah! Das ist, wo Alders Genialität ins Spiel kommt. Er will Stützstrukturen bauen, die dieses Wurzelnetzwerk nachahmen – miteinander verbundene Holzgitter, die unter Stress nachgeben, statt zu reißen. Füge lebende Setzlinge rund um den Perimeter hinzu, und wenn sie wachsen, integrieren sich ihre tatsächlichen Wurzeln in die gebauten Strukturen. Hybridbau. Das ist wirklich genial.
skyblock_hub_dialogues.overworld.oak_forest.thorne.enthusiastic_response=Nicht wahr? Ich könnte diesen Baum jahrelang studieren und täglich noch etwas Neues lernen. Aber Alder braucht praktische Anwendungen, nicht nur akademische Beobachtungen. Sag ihm, was du gesehen hast – die Netzstruktur, die Flexibilität, die Lastverteilung. Er weiß, was er damit anfangen soll.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1=Hat Alder meine Beobachtungen nützlich gefunden? Ich hoffe es. Bäume haben uns so viel über Widerstandsfähigkeit und Anpassung beizubringen.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.working_on_it=Er arbeitet dran.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.what_else=Was hast du noch herausgefunden?
skyblock_hub_dialogues.overworld.oak_forest.thorne.other_learnings=Oh, wo soll ich anfangen? Die Wachstumsringmuster deuten darauf hin, dass diese Region vor etwa 80 Jahren erhebliche seismische Aktivität erlebt hat – viel schlimmer als das Beben letzte Woche. Und doch überlebte der Baum. Ich verfolge auch Pilznetzwerke im Boden – sie verbinden mehrere Bäume unterirdisch und teilen Nährstoffe und Informationen. Der Wald ist viel vernetzter, als die meisten Menschen ahnen.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion=Ich habe gehört, dass Alder und Bram die flexiblen Fundamente fertiggestellt haben! Meine Wurzelforschung für praktischen Einsatz im Bauwesen – das ehrt mich. Der Wald gibt wirklich, oder?
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.thanks=Danke für deine Hilfe.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.studying_now=Was studierst du jetzt?
skyblock_hub_dialogues.overworld.oak_forest.thorne.acknowledge_thanks=Gern geschehen! Es ist selten, dass meine Forschung unmittelbare praktische Anwendungen hat. Normalerweise veröffentliche ich Artikel, die drei andere Dendrochronologen lesen. Das war... erfrischend.
skyblock_hub_dialogues.overworld.oak_forest.thorne.current_research=Ich untersuche jetzt Rindenerosionsmuster. Ich versuche, sie mit historischen Wetterdaten zu korrelieren. Nicht so aufregend wie erdbebenresistente Wurzelsysteme, gebe ich zu, aber trotzdem wertvoll für das Verständnis der Geschichte des Waldes.

# Bram Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.before_quest=Ich arbeite. Komm zurück, wenn Alder dich schickt.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.quest_accepted=Alder hat mich erwähnt? Gut. Sag mir Bescheid, wenn du die Materialien bereit hast.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages=Alder hat mir von dem flexiblen Fundamentplan erzählt. Clever. Ich übernehme den Gitterbau, aber ich brauche präzise Materialien. Vierundsechzig Eichenplatten und zweiunddreißig Eichenzäune. Platten verteilen das Gewicht ohne zu reißen. Zäune schaffen ineinandergreifende Stützen. Bring sie, wenn du fertig bist.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.get_crafted=Ich crafte sie.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_slabs=Warum Platten statt ganzer Blöcke?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_fences=Warum Zäune?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.slabs_explanation=Ganze Blöcke sind starr. Starr bricht. Platten sind dünner – sie komprimieren leicht unter Stress und federn dann zurück. Flexibilität ohne Versagen. Das brauchen wir.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_explanation=Zäune verzahnen sich. Ein Pfosten verbindet sich mit dem nächsten. Wenn Kraft das Netzwerk trifft, verteilt sie sich über alle Verbindungspunkte. Kein einzelnes Teil trägt die volle Last. Gleiches Prinzip wie Baumwurzeln. Nur Holz statt Erde.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials=Ich brauche noch diese Platten und Zäune. Lass dir Zeit. Ich warte lieber auf Qualität als schlechte Arbeit zu überstürzen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.almost_done=Fast fertig.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.remind=Erinner mich, was du brauchst?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.requirements_reminder=Vierundsechzig Eichenplatten. Zweiunddreißig Eichenzäune. Alles Eiche.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.still_need_fences=Ich brauche noch die Zäune. Bring die, und wir können anfangen zu bauen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered=Zäune. *(testet einen)* Solide Verbindungen. Die werden das Gitter bilden. Gute Arbeit.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.everything=Hast du jetzt alles, was du brauchst?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.thanks=Danke.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.have_everything=Mit den Platten und Zäunen, ja. Alder kümmert sich um die Setzlinge. Ich kümmere mich um den Bau. Geh zu Alder zurück, wenn du bereit bist.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_alder=Die Materialien sind da. Ich fange mit dem Zusammenbau an. Sprich mit Alder – er will den Plan finalisieren.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion=Das Gitter ist installiert. Die Fundamente halten. Solide Arbeit hält.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.good=Schön zu hören.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.hold_tremor=Glaubst du, es hält bei einem Beben?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.confident=Richtig gebaut. Richtige Materialien verwendet. Es hält.

# Ring The Bell
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.ring_the_bell.investigate=Du ziehst die Glocke fest an. Sie klingt hell und klar.\nTageslicht-Glocke. Tageslicht-Stille.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.hello=Die Glocke hängt still.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.locked=Tut mir leid, ich kann den ganzen "Willkommens-Vortrag" gerade nicht machen.\nWenn Cubit dich noch nicht um den Platz geführt hat, fang dort an.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.in_progress=Probier die Glocke auf dem Platz, und frag dann Levi, Sandy, Liora und Lee, ob sie nachts etwas gehört haben.\nDann komm zu mir zurück.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello=Hey.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available=Hey. Du bist das neue Gesicht, das Cubit herumgezeigt hat, oder? Gut. Du hast frische Ohren.\nHör mal... hast du die Glocke nachts gehört?\nNicht das Tagesgeläut. Nicht das fröhliche. Ich meine die Art, die einem den Magen umdreht.\nIch wache immer wieder dadurch auf. Und wenn ich rauslaufe... nichts.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.bell_at_night=Die Dorfglocke? Nachts?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.dream=Vielleicht war es ein Traum?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.what_do=Was soll ich tun?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request=Geh auf den Platz und teste die Glocke. Dann frag ein paar Leute, ob sie nachts etwas Merkwürdiges gehört haben.\nLevi und Sandy waren doch bei Cubit, als du ankamst, oder? Fang mit ihnen an. Sprich auch mit Liora und Lee.\nWenn niemand sonst es gehört hat... dann liegt das Problem bei mir. Aber ich muss es wissen.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.on_it=Alright. Ich frage mal rum.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.why_me=Warum fragst du mich?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.are_you_ok=Geht es dir gut?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.why_you=Weil du mir keine aufmunternde Lüge schuldest.\nLeute, die dich kennen, werden nett sein wollen. Leute, die dich nicht kennen, sagen dir einfach, was sie gehört haben.\nUnd ich brauche die Wahrheit.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.are_you_ok=Ich komme... zurecht.\nGeh und hör selbst nach. Wenn ich falsch liege, will ich absichtlich falsch liegen, nicht aus Versehen.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete=Also. Niemand hat es gehört.\nDas ist... eine Erleichterung. Und auch irgendwie nicht.\nWenn es wieder passiert, werde ich versuchen, mich an dieses Gefühl zu erinnern. Dass es da draußen still sein kann, auch wenn es in meinem Kopf laut ist.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.not_alone=Du bist damit nicht allein.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.something_else=Vielleicht ist es etwas anderes, nicht die Glocke.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.tell_me=Wenn es wieder passiert, sag mir Bescheid.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_not_alone=...Danke. Ich erinnere mich nicht immer daran, dass ich um Hilfe bitten kann.\nIch versuche es.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_something_else=Vielleicht.\nManchmal überträgt sich Schall merkwürdig durch Holz. Durch Wurzeln.\nManchmal hörst du etwas, das echt ist, nur nicht dort, wo du es vermutest.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_tell_me=Das werde ich.\nUnd wenn ich wieder mitten in der Nacht raussprinte... habe ich wenigstens einen Grund außer Panik.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello.after_ring_the_bell=Hey. Nochmals danke fürs Nachfragen.\nWenn die Glocke wirklich mal läutet, bist du wahrscheinlich die Erste, die es erfährt.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked=Glocke nachts...? Mmm.\nIch höre nachts viele Sachen.\nMeine Decke. Meinen Magen. Den Wind.\nEinmal hab ich einen Keks gehört, der meinen Namen rief. Stellte sich heraus, es war... ich selbst. Der den Keks rief.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.no=Du hast sie also nicht gehört?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.worried=Chris macht sich Sorgen. Fällt dir etwas ein?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.nope=Nö. Wenn die Glocke nachts läuten würde, würde ich aufwachen.\nAußer sie wäre sehr höflich. Dann würde ich wahrscheinlich durchschlafen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.idea=Manchmal prallen Schallwellen zurück.\nWeißt du, wenn du gegen eine Tasse tippst und sie immer noch klingt?\nHolz macht das auch.\nSag Chris, er soll Wasser trinken. Und vielleicht ein Nickerchen machen.\nNickerchen beheben die meisten Dinge.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked=Die Glocke? Ich liebe die Glocke!\nAber nachts? Nein.\nWenn sie läutete, wäre ich sofort draußen und so: "WER FEIERT HIER EINE PARTY?"\nNachts gibt es meistens Grillen und Levi, der schnarcht.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.weird=Du hast also nichts Merkwürdiges gehört?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.chris=Chris wacht immer wieder dadurch auf.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.nothing=Nichts Glockenartiges. Manchmal höre ich ein kleines *tick tick*, wie Eicheln, die aufs Dach tippen.\nDas kann schärfer klingen, als es ist.\nVielleicht hat Chris ein Eicheln-Problem.\nOder ein Dach-Problem.\nOder ein Eicheln-Dach-Problem!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.concern=Ach, der arme Chris.\nEr ist der Typ, der ein seltsames Geräusch hört und es sofort für alle tragen möchte.\nSag ihm, das Dorf ist ruhig. Und dass ich ihn nach Hause begleite, wenn er sich erschreckt.\nEigentlich nein. Er begleitet mich nach Hause. Ich lenke mich zu leicht ab.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked=Die Glocke ist ehrlich.\nSie läutet, wenn Hände sie ziehen, und wenn Wind sie schüttelt.\nAber der Wald kann seine eigene Musik machen.\nWurzeln verschieben sich. Äste setzen sich. Altes Holz seufzt.\nWenn Chris ein Läuten hört, das niemand sonst hört... vielleicht hört er zu genau hin.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.no=Du hast es also auch nicht gehört?
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.what_sound=Hast du eine Ahnung, was wie eine Glocke klingen könnte?
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.no=Nein. Nicht die Glocke.\nAber ich höre das Dorf nachts sich setzen.\nWie ein Haus, das atmet. Wie der Boden, der ausatmet.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.what_sound=Eicheln können das tun.\nZwei Schalen, die im richtigen Rhythmus aneinanderschlagen. Eine einzelne, die in einer Rinne rollt.\nKleine Geräusche werden scharf, wenn man Angst hat.\nSag Chris, dass Angst ausgezeichnete Ohren macht – und schreckliche Schlussfolgerungen.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked=Nachts? Keine Glocke.\nUnd davon bin ich ziemlich überzeugt.\nWenn die Glocke läutet, reagieren die Tiere. Hunde spitzen die Ohren. Vögel erschrecken. Selbst die Katzen unterbrechen ihre kleinen Ränke.\nWenn die Glocke geläutet hätte und niemand es bemerkt hätte, wäre das Dorf voll mit der entspanntesten Tierwelt der Welt.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.imagining=Du glaubst also, Chris bildet es sich ein?
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.notice=Was hast du nachts bemerkt?
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.imagining=Ich glaube, Chris ist müde.\nUnd müde Gehirne nähen Unsinn zu Mustern zusammen.\nDas heißt nicht, dass er es absichtlich erfindet.\nEs bedeutet nur, dass er Schlaf mehr braucht als Antworten.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.notice=Eulen. Wind. Die Art von Stille, die dich deine eigenen Schritte hören lässt.\nManchmal hört man ein Summen, wenn man lange genug neben altem Holz steht.\nKeine Glocke. Eher... eine Erinnerung an eine.
skyblock_hub_dialogues.overworld.oak_forest.liora.hello=Sei gegrüßt, Wanderer. Die alten Eichen flüstern von deinem Kommen, und ihre Stimmen bringen mir Trost in diesem weiten Wald. Was bringt dich dazu, mit uns zu lauschen?
skyblock_hub_dialogues.overworld.oak_forest.lee.hello=Hey, ich hab dich durch das Unterholz streifen sehen. Die Eichhörnchen haben davon gechattet. Alles in Ordnung da draußen im Wald?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro=Wenn du einen Moment hast, könntest du mir beim Auffüllen helfen? Die Bauarbeiter schuften den ganzen Tag, und ein leerer Topf nützt niemandem etwas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.ill_bring=Ich bringe dir etwas Suppe.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.why=Warum Rote-Beete-Suppe?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.accepted=Danke. Ich brauche sechzehn Schüsseln, damit die Schlange in Bewegung bleibt.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup=Einfach in großen Mengen zu kochen, einfach zu transportieren, und sie wärmt dich von innen heraus. Einfach ist gut, wenn man eine ganze Siedlung versorgt.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup.response.ill_bring=Ich bringe dir etwas Suppe.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro=Irgendwas dabei? Ich brauche sechzehn Schüsseln, damit die Schlange in Bewegung bleibt.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro.response.yes=Hier bitte.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks=Perfekt. Das hält alle am Laufen. Danke. Schau gerne wieder vorbei, wenn du eine warme Schüssel willst.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks.response=Gerne.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.hello=Hallo. Willst du eine warme Schüssel?

# Hungry Hands (Potato Towers)
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available=Moment. Potato Towers ist kein Marktplatz. Es ist eine Mauer mit einer Speisekammer dahinter. Und in letzter Zeit hat die Speisekammer Beine bekommen.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.zombies=Schon wieder Zombies?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.accept=Wenn jemand stiehlt, finde ich denjenigen.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.decline=Nicht mein Problem.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.zombies_clarification=Wenn es Zombies wären, wäre ich erleichtert. Zombies streiten nicht. Sie weinen nicht. Sie schauen dich nicht in die Augen und fragen, warum du Kartoffeln hast und sie nicht.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation=Ich sollte diesen Ort vor den Toten schützen. Das war der Deal. Aber die Lebenden testen ständig die Tore. Hungrige Hände, schnelle Füße und ein Dutzend Ausreden. Ich brauche dich, um herauszufinden, wer das tut, und mir etwas Handfestes zu bringen. Namen. Ein Muster. Jemanden, auf den sie hören.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.start=Wo fange ich an?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.handle=Ich kümmere mich darum.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.starting_point=Die Gasse hinter den Läden. Drei Gesichter tauchen immer wieder in der Nähe der Karren auf: Tess, Joss und Perrin. Sprich mit ihnen. Du wirst herausfinden, wer die Fäden zieht.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check=Wenn du einen Diebstahl stoppen willst, tu es mit Fakten. Sprich mit Tess, Joss und Perrin. Dann komm zurück.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.on_it=Ich bin dran.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.remind=Erinner mich, wen ich suche.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.reminder=Tess, Joss und Perrin. Drei Namen. Eine Geschichte. Bring mir die Wahrheit davon.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution=Ich hab gerade mit Ceryn gesprochen. Kein Krimineller. Kein Heiliger. Nur jemand, dem die Leute vertrauen.\nStehlen ist falsch. Das werde ich nicht so tun als wäre es anders.\nAber ich hatte keine Ahnung, wie schlimm es da draußen geworden ist. Pumpkingdoms Schatten reicht weiter als unsere Tore.\nAlso läuft es so: Die Tore bleiben zu. Aber ich werde langsamer bemerken, was nicht meins ist. Und ich werde mich für richtige Rationen einsetzen, bei denen man nicht schleichen muss.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.fair=Das ist... fair.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.open=Warum die Tore nicht öffnen?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.sooner=Das hättest du früher tun können.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.why_not_open=Offene Tore laden mehr ein als Hunger. Sie laden Panik ein. Und Zombies. Ich kann eine Linie halten, aber keine Stampede.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.admission=Ja. Und ich hätte Fragen stellen sollen, bevor ich anfing, fehlende Kartoffeln zu zählen wie Pfeile in einem Köcher. Ich lerne dazu.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.after_completion=Wenn du jemanden siehst, der zu lange auf einen Karren schaut, geh nicht davon aus, dass er ein Dieb ist. Manchmal berechnen sie nur, ob Essen die Scham wert ist.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first=Wenn Garran dich geschickt hat, kannst du aufhören zu starren. Ich weiß, wie das aussieht.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.stealing=Stiehlst du von Potato Towers?
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.hurt=Ich bin nicht hier, um dir zu schaden.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.started=Sag mir, wer damit angefangen hat.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.direct_question=Ich stehle Zeit. Ich stehle Wärme. Ich stehle einen Moment, in dem mein Magen nicht schreit. Kartoffeln sind nur die Form, die es annimmt.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hint=Wenn du denjenigen willst, auf den die Leute hören, finde Ceryn. Kein Anführer. Ein Kompass. Lagert abseits der Straße, wo die Türme keinen Schatten mehr werfen.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first=Du willst mich zurück zum Tor schleppen? Gut. Tu es. Zumindest gibt es drinnen Licht.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.why=Warum stehlen von hier?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.behind=Wer steckt dahinter?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.truth=Ich kann helfen, wenn du mir die Wahrheit sagst.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.contrast=Weil die Luft hier nach gekochtem Essen riecht. Bei Pumpkingdom riecht es nach feuchtem Stein und toten Dingen. Leute stehlen nicht zum Spaß. Sie stehlen, weil es nah ist.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hint=Ceryn. Das ist, wer du willst. Wir machen keinen Schritt, ohne zu fragen, was Ceryn tun würde. Meistens, weil Ceryn denkt, bevor er sich bewegt.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first=Wenn du wegen Kartoffeln hier bist, bist du zu spät. Die wenigen Essensreste, die wir hatten, sind jetzt weg.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.following=Ich suche denjenigen, dem ihr folgt.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.stop=Hört auf zu stehlen.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stop_response=Und dann? Ich höre auf zu hungern, weil du einen Satz gesagt hast? Wir tun, was wir müssen, um zu überleben. Sprich mit Ceryn, wenn du mehr wissen willst.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hint=Finde Ceryn im Lager. Ceryn hasst das Stehlen auch. Sagt, es macht uns kleiner. Aber Ceryn lässt auch keine Menschen verhungern.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first=Garran denkt, ich bin ein Anführer. Bin ich nicht. Ich bin nur derjenige, den die Leute anschauen, wenn sie etwas tun wollen, das sie nicht rückgängig machen können.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.reason=Sie sagen, du bist der Grund, warum sie stehlen.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.starving=Potato Towers hat genug. Ihr verhungert.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.escort=Komm mit mir. Sprich mit Garran.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.framing=Sie stehlen, weil sie hungern. Potato Towers hat einen Berg Kartoffeln und einen Graben voller Regeln. Das ist keine Gerechtigkeit. Aber Stehlen ist trotzdem Stehlen.\nGeh mit mir. Ich sage es ihm ins Gesicht. Wenn Garran es Verbrechen nennen will, gut. Aber ich will, dass er versteht, was er verteidigt.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.escort_start=Lass uns mit Garran sprechen. Komm mit mir. Ich will ein Gespräch, keine Revolte.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hello=Wenn du hier bist, um mich zu beschuldigen, spar dir den Atem. Ich tue, was ich muss, um zu überleben.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hello=Du bist verloren? Ich kann leider nicht viele Rationen anbieten.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hello=Sei hier vorsichtig. Die Leute sind nicht freundlich, wenn sie hungern.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello_before_quest=Hallo. Hungerst du auch?\nWir arbeiten zusammen, um zu sehen, welche Rationen wir aus Potato Towers rausbekommen. Das ist das, was wir zum Überleben tun müssen.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello=Ich und die Wachen verstehen uns besser. Wir kommen jetzt zurecht, dank deiner Hilfe.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available=Wir veranstalten ein gemeinsames Essen für die Zivilisten von Pumpkingdom. Nach dem Zusammenbruch bedeutet ein warmer Tisch mehr als eine Feier.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.whats_wrong=Warum bist du deswegen so angespannt?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.need_help=Was brauchst du von mir?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.later=Ich komme später wieder.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation=Pumpkingdom ist nicht mehr dasselbe seit dem Zusammenbruch. Manche haben Häuser verloren. Andere Küchen. Stein kann man neu aufbauen, aber Hunger lässt Menschen leise verschwinden.\nRhea und ich halten es heute Nacht einfach: etwas Sättigend es, nichts Verschwenderisches, und genug zurückbehalten, damit die Plains es morgen nicht spüren.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.what_do_you_need=Alright. Was brauchst du von mir?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.wasting_food=Warum Pumpkingdom helfen?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup=Weil sie immer noch unsere Nachbarn sind. Und weil das Schwierigste nach einem Zusammenbruch nicht der Schutt ist, sondern die Wochen, in denen man aufhört zu erwarten, versorgt zu werden.\nWir können ihnen eine gute Nacht geben, ohne die Plains-Speisekammer zu einer Verpflichtung zu machen, die wir nicht einhalten können.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup.response.tell_me=Fair. Was ist der Plan?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.what_i_need=Sprich zuerst mit Rhea. Sie entscheidet, was an die Leute geht und was wir rationieren. Du findest sie oben.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions=Sprich mit Rhea, bevor du etwas sammelst. Sie koordiniert das heutige Abendessen.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.on_it=Ich bin dran.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.remind=Erinner mich.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions_reminder=Finde Rhea oben. Hol die Liste. Folge ihr genau.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder=Läuft das Sammeln von Vorräten für das Pumpkingdom-Essen?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.deposit_potatoes=Ich habe Kartoffeln zum Einlagern.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.working=Noch dabei.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.potatoes_delivered=Gut. Ich bringe diese Kartoffeln in die Lagerung.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report=Das war das letzte, was wir brauchten. Pumpkingdom wird essen, die Plains bleibt eine Weile bestückt. Danke.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.good=Schön, dass ich helfen konnte.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.close=Ich hatte keine Ahnung, wie knapp es wird.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.close_followup=Die meisten nicht. Deshalb arbeite ich so eng mit Rhea zusammen, um Essen für härtere Jahreszeiten vorrätig zu halten.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.after_completion=Wenn du jemanden aus Pumpkingdom siehst, der verloren wirkt, zeig ihm den Weg zum Tisch. Lass ihn einen vollen Teller haben.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.before_quest_started=Wenn du wegen des Pumpkingdom-Essens hier bist, steh nicht rum. Entweder bring etwas auf den Tisch oder komm nicht im Weg. Wenn du wegen Arbeit hier bist, sprich mit Nolan.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro=Nolan hat dich geschickt. Gut.\nHeute Nacht versorgen wir Pumpkingdom-Zivilisten. Seit dem Zusammenbruch leben manche von ihnen von dem, was sie handeln, suchen oder strecken können. Wir geben ihnen eine gute Mahlzeit, ohne die Plains-Rationen zu gefährden.\nBring Kartoffeln zu Nolan zum Einlagern. Bring 64 Kürbisse zu mir für das heutige Abendessen.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.why_pumpkins=Warum Kürbisse für das Essen?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.who_wasting=Haben die wirklich so sehr gelitten?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.got_it=Verstanden. Ich bin gleich zurück.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.why_pumpkins_followup=Wir haben gerade Kürbisvorsaison und sind gut versorgt. Die halten sich nicht lange und sind ziemlich saisonal.\nDie Kartoffeln lagern sich länger, also ist es besser, die für spätere Mahlzeiten aufzuheben.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.who_wasting_followup=Ja. Ein Zusammenbruch macht das so. Wenn eine Stadt bricht, kühlen die Öfen zuerst aus.\nSie sagen es nicht laut, aber man sieht es: Leute, die zu schnell essen, Brotkrusten aufheben, so tun, als hätten sie keinen Hunger. Wir geben ihnen eine Nacht, in der sie aufhören können, die Bissen zu zählen.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder=Hast du die Kürbisvorrräte für das heutige Abendessen?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.deposit_pumpkins=Ich habe Kürbisse für das Essen.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.on_it=Ich bin dran.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.pumpkins_delivered=Perfekt. Das wird heute Nacht ein tolles Essen ergeben.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.after_completion=Wenn du heute Nacht Lachen hörst, hast du dazu beigetragen, es möglich zu machen.\nUnser Lager ist voll und die Leute werden satt.\nSei stolz auf dich.

# Non-Quest NPCs
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello=Ich bin Zimmermann. Ich baue Stühle, die bei Erschütterungen nicht zusammenbrechen. Meistens.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_1=Meistens?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_2=Kennst du Zimmermannwitze?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_1=Wenn der Boden bebt, muss das Möbel mithalten. "Meistens" heißt, ich hab genau einmal gegen die Schwerkraft verloren.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_2=Ich hab versucht, einen Gürtel aus Eichenrinde zu machen. Das war totale Zeitverschwendung.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello=Spürst du es? Die Bäume summen. Entweder kommt ein Beben, oder der Wald tratscht wieder.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_1=Der Wald tratscht?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_2=Wie bleibst du ruhig?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_3=Ich lasse dich in Ruhe.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_1=Der Wind zwischen den Bäumen im Wald flüstert. Ich bin überzeugt, er spricht mit mir, aber vielleicht liegen auch meine Nerven bloß blank. Ich bin überzeugt, gestern hat er gesagt: "Ich hab das Spiel verloren"...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_2=Ich gebe jedem Knarren und Knacken einen Namen. Es ist schwerer, etwas zu fürchten, das einen Namen wie Gerald hat.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello=Bilde ich mir das ein, oder haben die Eicheln hier irgendwie magische Kräfte?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello.response_1=Magie?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.detail_1=Ja. Hast du sie nicht gesehen? Manche triefen regelrecht mit dem lila Zeug.\nIch hab keine Ahnung, was das ist. Wenn du mich fragst, ist das kein gutes Zeichen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello=Ich habe keine Angst vor Spinnen. Ich respektiere nur ihre Meinung auf acht Beinen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_1=Welche Meinungen?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_2=Du hast also Angst.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_3=Hast du Tipps für die Mine?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_1=Spinnen machen, was sie wollen. Sie haben keine Angst vor dir. Lösungen für Spinnen findest du im Netz.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2=Ich hab keine Angst. Ich bin strategisch. Ich bleibe lieber am Leben, ohne diesen schrecklichen Kreaturen begegnen zu müssen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2.response_1=Mach dir keine Sorgen. Ich hab auch Angst.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello=Wenn du die Glocke läuten hörst, ist entweder Gefahr nah oder ich langweile mich. Fünfzig-fünfzig.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_1=Hör bitte auf, sie zu läuten.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_2=Was bedeutet es, wenn sie zweimal läutet?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_3=Läut ruhig. Ich mag Chaos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_1=Ich hab's versucht. Die Glocke hat meinen Namen gerufen. Laut. Außerdem fühlt sich die Stille hier an, als würde sie auf etwas warten.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_2=Das bedeutet, ich hab vergessen, dass ich sie schon einmal geläutet hab. Ich bin konsequent, nicht präzise.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello=Wenn du lange genug still stehst, WIRD die Kälte versuchen, dich zu adoptieren. LASS es NICHT zu.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_1=Wie verhindere ich das?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_2=Die Kälte adoptiert Menschen?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_3=Ich mag die Kälte.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_1=Bleib in Bewegung. Zieh was Warmes an. Geh NIEMALS untergekleidet raus. Diese Umgebungen sind unerbittlich.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_2=Ja. Es gibt so viele unerbittliche Bedingungen da draußen. Die Kälte nimmt, wen sie will. Wir können uns nur warm anziehen, um ihre Wirkung zu verlangsamen.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello=Es wird hier ziemlich kalt, und man kann oft nicht rausgehen. Ich zähle Schneeflocken, um die Zeit zu überbrücken.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_1=Wie viele bisher?
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_2=Das klingt erschöpfend.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_1=Beim letzten Mal bin ich bis 314 Schneeflocken gekommen. Ich hätte weitergemacht, aber mein Schneebeeren-Kuchen war fertig, also musste ich essen.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_2=So ist auch der Winter. Wir passen uns aneinander an.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello=Ich stricke. Schals, Fäustlinge, moralische Unterstützung. Wenn du ein Problem hast, kann ich es wahrscheinlich in einen Hut verwandeln.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_1=Was in einen Hut verwandeln?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_2=Kann ich einen Schal bekommen?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_1=Alles. Es kommt nur auf die Sichtweise an.\nNimm das Problem, drehe es in etwas Positives um und trag es stolz. Jetzt ist es ein Hut.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_2=Nur wenn du versprichst, ihn dramatisch zu tragen. Schwing ihn wie ein Held im Blizzard.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello=Ich hab eine Liste mit Dingen gemacht, die keine Wölfe sind. Das hilft nachts.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_1=Was steht auf der Liste?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_2=Was ist mit echten Wölfen?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_3=Warum eine Liste erstellen?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_1=Bäume. Schatten. Wind. Manche Menschen. Wahrscheinlich. Die Liste ist noch in Arbeit.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_2=Die haben es nicht auf die Liste geschafft. Verdächtig. Sehr verdächtig.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_3=Wölfe sind erschreckend! Wer hätte keine Angst vor ihnen. Ich versuche, eine Liste mit Dingen zu erstellen, die nicht gruselig sind! Das hilft mir, nachts ruhig zu bleiben.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello=Wenn du frierst, trink was Warmes. Wenn du traurig bist, trink was Warmes. Wenn dich jemand jagt, trink schneller was Warmes.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_1=Was brühst du gerade auf?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_2=Hilft das wirklich?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_1=Fichten-Nadel-Tee. Er schmeckt nach Mut und Nadeln. Meistens Nadeln.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_2=Es hilft dir, wenn du glaubst, dass es hilft. Unterschätze einen Placebo nicht.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello=Ich trainiere mein Lachen, um bösartig zu klingen. Hör zu. Ha. Ha. Ha.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_1=Das war erschreckend.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_2=Warum üben?
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_3=Ich lasse dich weiterüben.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_1=Danke. Ich werde besser. Ich möchte, dass die Leute Angst vor mir haben.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_2=Weil ich die Welt übernehmen will, und das kann man nicht ohne böses Lachen. Duh.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available=Oh. Oh wow. Du siehst genau so aus, als könntest du mit einem Kuchen umgehen.\nIch habe ein neues Kuchenrezept mit Schneebeeren gemacht und brauche eine zweite Meinung.\nWenn ich dir das Rezept teile, könntest du es testen?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_1=Kuchen ist meine Spezialität.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_2=Leg los.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder=Wie läuft das Kuchen-Testen? Ich MUSS es wissen...\nMeine Träume und Hoffnungen, in Zukunft Bäcker zu werden, stehen auf dem Spiel.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_1=Ich hab noch nichts gegessen.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_2=Mir gefällt der Kuchen bisher. Ich bin nur satt.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_3=Ich weiß nicht, ob ich noch mehr verträgee.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete=Also? Also?\nErzähl mir alles. Die Konsistenz, der Beeren-Biss – war dein Schneebeeren-Kuchen besser als ein normaler Kuchen?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_1=Das war pure Freude.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_2=Ich will noch ein Stück.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_3=Ich glaube, Backen ist nichts für dich.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.after_quest=Hey, Testesser.\nWenn du Schneebeeren siehst, weißt du, was zu tun ist.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.hello=Hey, ich bin angehende Bäckerin. Ich versuche, einen neuen Kuchen zu machen. Ich arbeite noch daran, meine besondere Zutat herauszufinden.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello=Vertrau den Papageien nicht. Die wiederholen alles. Inklusive Geheimnisse. Besonders Geheimnisse.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_1=Was haben sie gesagt?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_2=Bring mir die Papageiensprache bei.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_3=Irgendwelche Dschungel-Tipps?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_1=Dass jemand einen Fisch fallen gelassen hat. Die hatten recht. Ich schon. Die Papageien werden mir nie vergeben.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_2=Meistens Beleidigungen und Snack-Anfragen. Gelegentlich eine Warnung, wenn man mit Samen bezahlt.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello=Ich erfinde eine neue Küche: knusprig. Der Dschungel bietet viele Kandidaten.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_1=Bitte tu das nicht.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_2=Was steht auf der Speisekarte?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_3=Gib mir was Normales.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_1=Feigling. Aber fair. Ich serviere dir heute keinen Käfer. Vielleicht morgen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_2=Gerösteter Käfer. Gewürzige Spinne. Ranken-Salat. Der Salat beißt zurück. Das ist der Charme.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello=Lianen sind nur Seile mit Ehrgeiz. Ich hänge meine Kunst dort, wo die Schwerkraft sie kritisieren kann.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_1=Was für Kunst?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_2=Fällt sie runter?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_3=Kann ich helfen?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_1=Windspiele aus Samen. Sie klingen wie winzige Stürme, die höflich streiten. Wenn du helfen willst, stell dich darunter und tu so, als wärst du absichtlich da, wenn es fällt.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_2=Oft. Das ist Teil der Vorstellung. Wenn es nicht fällt, war es nicht mutig genug.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello=Alle sagen, das Blätterdach ist wunderschön. Alle vergessen, dass es auch sehr weit vom Boden entfernt ist.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_1=Dann bleib unten.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_2=Was macht dir am meisten Angst?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_3=Willst du Aufmunterung?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_1=Ich hab's versucht. Der Dschungel hat Treppen gebaut. Der Dschungel macht sich über mich lustig.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_2=Fallen. Und auch nicht Fallen, weil man dann runterklettern muss.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello=Ich kartiere den Dschungel durch Zuhören. Vögel ziehen die Grenzen. Käfer füllen die Details aus.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_1=Das klingt erfunden.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_2=Kann ich deine Karte sehen?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_3=Wohin soll ich gehen?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_1=So klingt auch der Dschungel. Und dennoch sind wir hier. Hör lang genug zu, und die Wege stellen sich vor.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_2=Es sind meistens Pfeile und Warnungen. Außerdem ein Gekritzel eines sehr unverschämten Papageis.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello=Ich habe einer Liane gesagt, sie sei anhänglich. Das hat sie persönlich genommen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_1=Noch einer.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_2=Irgendwelche echten Ratschläge?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_3=Du bist unerträglich.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_1=Ich hab mich verlaufen und nach dem Weg gefragt. Der Dschungel sagte: "Lass mich in Ruhe".
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_2=Schlag keinen Baum mit Ameisen drin. Du wirst bereuen, Hände zu haben.
skyblock_hub_dialogues.npc_name.balth=Balth
skyblock_hub_dialogues.npc_name.brakka=Brakka
skyblock_hub_dialogues.npc_name.kora=Kora
skyblock_hub_dialogues.npc_name.nyssa=Nyssa
skyblock_hub_dialogues.npc_name.ruk=Ruk
skyblock_hub_dialogues.npc_name.sable=Sable
skyblock_hub_dialogues.npc_name.varka=Varka
skyblock_hub_dialogues.npc_name.zarn=Zarn
skyblock_hub_dialogues.npc_name.grak=Grak
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro=Oh. *Oink* Du... du hast mich bemerkt.\nIch führe eine Zählschale. Für Patrouillen, die nicht vollständig zurückkommen. Es ist eine stille Aufgabe. *Oink*\nNormalerweise bitte ich niemanden um Hilfe. Aber die Schale wird zu voll. Ich frage mich, ob du... ob du vielleicht einige von ihnen durch Rache räumen könntest? *Oink*... Nur wenn du möchtest.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro.response.accept=Ich helfe dir mit der Schale.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress=*Oink*... Oh. Du arbeitest noch daran.\nKeine Eile. Ich möchte deinen Namen nicht auch in meine Schale eintragen müssen. Pass bitte auf dich auf.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress.response=Ich ziehe das durch.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete=Oh. *Oink*... Danke.\nDie Namen werden nicht vergessen, und der Verlust meines gefallenen Freundes fühlt sich jetzt bedeutsam an. Ich weiß nicht wirklich, wie ich... *Oink*... Danke. Das ist alles, was ich habe.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_1=Du musst nichts mehr sagen.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_2=Mögen sie ruhen.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello=*Oink*... Oh. Hallo. Ich hab niemanden erwartet.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_1=Hallo, Grak.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_2=Stör dich nicht an mir.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro=*Oink* Du siehst nicht wie ein Piglin aus. Du musst einer dieser aufdringlichen Menschen sein.\nIch vertraue euch Menschen nicht, wie ihr die Welt durchstreift. Wir Piglins können diese verseuchten Zombified Piglins auch alleine loswerden! *Oink*\nNa gut, wenn du dich beweisen willst, lass ich dich.\n*Oink* Nur ein Freund würde mir Gold bringen. Willst du mein Freund sein?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro.response.accept=Ja, ich will dein Freund sein.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro=Wenn du dir so sicher bist, dich mir beweisen zu wollen – hast du das Gold?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro.response.trade=Hier ist das Gold.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete=Oh, du schätzt mich wirklich als Freund. Ich dachte, ihr Menschen mögt uns nicht. *Oink*\nIch schätze, wir sind jetzt Freunde. Gut zu wissen.\nVielleicht war ich zu schnell damit, Menschen zu verurteilen. *Oink*
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_1=Schön, dein Freund zu sein.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_2=Ich versuche nur nett zu sein
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello=Hey Freund!!!! *Oink* *Oink* *Oink* *Oink*\nHast du mehr Gold? ;)
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_1=Nein, sorry Freund :(
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_2=Du scheinst viel zu aufgeregt, mich zu sehen.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro=Du bist einer der Menschen, die der Kolonie helfen, oder? Gut.\nHöllische Zombified Piglins tauchen hier immer wieder auf. Ich denke, die normalen Zombified Piglins haben wir unter Kontrolle, aber ich mache mir Sorgen, dass die Menschen die Bedrohung durch die tödlicheren, feurigen ignorieren. Könntest du ein paar von denen erledigen?
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro.response.accept=Ich räume sie weg.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress=Wie läuft's? Bereiten die Höllischen so eine Herausforderung, wie ich befürchtet habe? Ich fürchte, wir könnten zu spät sein.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_1=Zurück an die Arbeit.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_2=Ja, die sind wirklich zäh
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete=Gute Arbeit! Ich werde besser schlafen, wenn ich weiß, dass weniger von diesen feindlichen Feuerwesen da draußen sind. Nicht dass ich besorgt war – ich bin ja immun gegen Feuer. Ich unterstütze gerne die Bemühungen der Menschen, indem ich die Entscheidungen treffe, die ich für notwendig halte.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_1=Schön, dass ich helfen konnte.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_2=Gut, dass du die Entscheidung getroffen hast.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello=Hier ist einiges Seltsames im Gange. Wenn mir wieder etwas als Bedrohung auffällt, sage ich dir Bescheid.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_1=Danke!
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_2=Ich bin immer hier, um zu helfen
skyblock_hub_dialogues.nether.piglin_colony.balth.hello=Willkommen im Nether! Sei da draußen vorsichtig. Es ist kein freundlicher Ort.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_1=Das ist einladend.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_2=Ich hoffe, es geht dir gut.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello=Wenn du Rauch riechst, keine Panik. Ich hab das Essen wieder angebrannt.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_1=Angebrannt?
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_2=Ich hoffe, deine Kochversuche enden gut.
skyblock_hub_dialogues.nether.piglin_colony.kora.detail_1=Ja, lustigerweise kann man Essen selbst am heißesten Ort im Universum noch verbrennen.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello=Woah! Stopp! Sei vorsichtig hinter diesen Toren. Da draußen ist es gefährlich.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_1=Keine Sorge um mich! Ich hab einen Helm!
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_2=Ich pass schon auf mich auf
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello=Woah, die Architektur hier ist wirklich beeindruckend. Verrückt, wenn man bedenkt, dass dieser Ort buchstäblich in ein paar Jahren nach der Verschmelzung gebaut wurde.
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_1=Was ist die Verschmelzung?
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_2=Ja, wirklich beeindruckend
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_3=Meh, ich kenne bessere Baumeister
skyblock_hub_dialogues.nether.piglin_colony.ruk.detail_1=Das ist, als die Oberwelt mit diesem seltsamen Ort verschmolzen ist.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello=Vorsicht da unten. Das lila Zeug scheint Quarz zu fressen und hat seltsames magisches Potenzial. Es hat mir für einen Tag einen dritten Arm gegeben.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_1=Einen dritten Arm?
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_2=Oh wow, das ist verrückt.
skyblock_hub_dialogues.nether.piglin_colony.sable.detail_1=Ja, es ist wirklich mächtige Magie, wenn man ihm gibt, was es will.\nAnscheinend will es wirklich Quarz.
skyblock_hub_dialogues.nether.piglin_colony.varka.hello=Ich schmiede Klingen, Scharniere und gelegentliche emotionale Zusammenbrüche. Meistens Scharniere.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro=Woah, vorsichtig. Ich bin hier noch nicht fertig mit dem Bauen. Die Brücke hinter mir führt gerade ins Nirgendwo.\nIch habe aber ein kleines Problem. Ich bin ein sehr fähiger Baumeister. Allerdings hab ich alle meine Laternen verloren, und ich hab schreckliche Angst vor der Dunkelheit.\nWürdest du mir helfen, sie zu finden? Sie können nicht weit sein.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro.response.accept=Ich finde deine Laternen.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns=Bitte beeil dich, ich hab ziemlich Angst vor der Dunkelheit.\nIch weiß, sie können nicht weit sein, es sei denn, Laternen haben angefangen zu laufen. Wenn das so ist, ist das ein separates Problem, und ich bin nicht bereit dafür.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns.response=Ich suche weiter.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit=Du hast die Laternen gefunden? Gut. Gut!\nJetzt brauchen wir genug Licht für die ganze Crimson Exchange. Ein paar Glowstone und Fackeln sollten reichen.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_1=Hier sind ein paar Lichtsachen.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_2=Ich kümmere mich darum.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete=Du hast es geschafft. Schön. Hier wird es jetzt viel heller sein.\nIch muss keine Angst mehr vor der Dunkelheit haben.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_1=Ich stimme zu, die Dunkelheit ist gruselig.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_2=Schön, dass ich helfen konnte.
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello=Du hast meinen Tag wirklich aufgehellt.\nIch wünschte wirklich, ich hätte keinen Job angenommen, an dem dunkelsten Ort im Universum zu bauen...
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello.response=Schön, dass das Licht hilft.
skyblock_hub_dialogues.nether.piglin_colony.vesh.lantern.cant_pick_up=Ich bin nicht sicher, wessen das ist. Vielleicht lass ich sie vorerst liegen.
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello=Hey, willkommen in der Piglin Colony!\nDie Piglin Colony klingt, als wäre sie früher ein toller Ort gewesen. Wir Menschen wussten bis vor Kurzem nichts von ihrer Existenz.\nWir haben diese alternative Dimension durch Risse entdeckt, die sich zwischen den Welten gebildet haben.\nWir haben mit den Piglins gesprochen, und sie wirken wie eine freundliche Truppe (sie werden ein bisschen besessen von Gold, aber okay). Anscheinend haben sie es im Overworld schlimmer als wir.\nWir haben diese Basis, die Crimson Exchange, eingerichtet, um leicht auf den Nether zugreifen und die Piglins unterstützen zu können.\nDu kannst ihnen gerne helfen, aber Vorsicht! Viele von ihnen wurden von der Korruption übernommen und in Zombies verwandelt!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_1=Ich pass auf mich auf!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_2=Schön, dich wieder zu sehen!

# Zombified Bastion - Dungeon Guard
skyblock_hub_dialogues.nether.piglin_colony.zombified_bastion.dungeon_guard.introduce=Diese Bastion... sie war einst der Stolz der Piglin Colony.\nLeider ist sie jetzt von Zombified Varianten unserer Piglins überrannt. Unsere Freunde, jetzt zu Zombies geworden.\nWürdest du mir helfen, die Bastion für den Rest von uns überlebenden Piglins zurückzuerobern?\nWir müssen nur ein paar der Portale versiegeln, durch die die Zombified Piglins eindringen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction=Hörst du das? Die fällen die Bäume!!!\nSo viele Generationen von Familien haben diesen Dschungel gepflegt, und jetzt wird alles gefällt. Wenn du mich fragst, ist das ein schlechtes Zeichen, und wenn das so weitergeht, wird alles nur schlimmer.\nHilfst du uns, diese schreckliche Abholzung zu stoppen?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_1=Ich werde nachfragen. Das klingt schlimm.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_2=Vielleicht verträgt der Dschungel ein paar Bäume.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.in_progress_workers=Vielleicht solltest du mit den Arbeitern sprechen. Die wissen sicher, wer dahinter steckt.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.after_lucien=Oh, es ist Lucien. Das ergibt total Sinn.\nDas Monster ist einfach so gierig. Er ist der Reiche hier, und ihm reicht sein Reichtum nie.\nKein Wunder, dass er unser Zuhause ruiniert, um seinen Reichtum weiter zu mehren.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete=Lucien hat deine Stämme genommen und gesagt, er höre sowieso nicht auf. Dieser Mensch ist erschreckend.\nNa ja, danke fürs Versuchen. Ich bin sicher, jemand bringt ihm irgendwann zur Vernunft. Bevor der ganze Wald fällt.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete.response=Ich hoffe, du kannst den Wald retten.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.hello=Die Abholzung geht weiter. Lucien wird weiterhin seine Taschen füllen, bis er aufgehalten werden kann.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned=Ja, ich bediene diese Maschine. Vorsicht, die ist wirklich gefährlich.\nDas ist nicht meine Idee. Das kann ich dir versichern. Lucien ist ein starker Geschäftsmann und er ist derjenige dahinter. Ich bin mir nicht sicher, ob er wirklich versteht, dass das, was er tut, dem Wald schadet. Ich glaube, er sieht nur das Geld, das er mit dem Holzverkauf macht.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned.response=Ahh, es wird also von Geld angetrieben.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.hello=Halte deine Hände fern. Die Maschine beißt.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned=Woah, zurück – ich wollte gerade einen massiven Schwung auf diesen Stapel Stämme da machen.\nSchau, ich verstehe, dass du den Wald retten willst, aber ich kann nichts tun. Ich tue nur meinen Job.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned.response=Oh, tut mir leid. Ich lass dich weiterarbeiten
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.hello=Vorsicht, das ist eine riesige Maschine, und ich sammle gerade das ganze Holz ein.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned=Du bist der vierte heute, der versucht, mich aufzuhalten.\nIch sage dir, ich bin nicht wirklich in der Stimmung zu reden.\nWenn du Antworten willst, ist Lucien dein Mann. Er ist derjenige, der mich bezahlt.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned.response=Alright.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.hello=Lucien zahlt gut. Ich wünschte nur, er würde mich dafür bezahlen, unser Zuhause nicht zu zerstören. Ohne Zuhause hab ich kein Zuhause, und ich kann kein Zuhause haben, wenn ich diesen Wald abholze.\nIch kann nicht gewinnen :(
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront=Ich bin nur hier, um Geld zu verdienen. Ich hab das Familiengeschäft übernommen. Jetzt fälle ich Bäume. Ich kann nicht glauben, dass das noch niemand vorher gemacht hat. Ich werde so reich werden.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_1=Du reißt dein eigenes Zuhause auseinander.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_2=Was kann ich tun, damit du aufhörst?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro=Sei fair. Du bringst mir eine Ladung Stämme als Ausgleich für mein entgangenes Geschäft, und ich höre auf. Klingt das fair?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.response_deposit=Hier, nimm ein paar Stämme
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.dungeon=Ich will für den Wald kämpfen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete=Ausgezeichnet. Genau das, worum ich gebeten hatte.\nJetzt, was das Aufhören angeht.\nNein.\nDiese Stämme helfen den heutigen Zahlen. Die Maschinen helfen den morgigen.\nSag den Demonstranten, sie können mich weiter bitten aufzuhören, aber das tue ich nicht. Das Geschäft wächst nicht mit so einem kleinen Stapel Stämme.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_1=Ich sag's ihnen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_2=Du Monster.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon=Hey, geh mir aus dem Weg. Ich hab Geschäfte zu führen.\nIch hab viele Kunden. Ja, diese Kunden mögen böse Monster sein, aber sie zahlen gut. Das Geschäft würde stagnieren, wenn ich bei meinen Kunden wählerisch wäre.\nWenn du ein Problem hast, leg los. Du kannst mir nicht das Wasser reichen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_1=Leg los.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_2=Du arbeitest mit Monstern zusammen?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters=Ja, das tue ich.\nSie wollen Sachen von mir. Statt mich anzugreifen, hab ich einfach festgestellt, dass sie dich unterstützen, wenn du ihnen was gibst.\nNa und, wenn sie alles abholzen und allen alles stehlen...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_1=Ich muss dich aufhalten.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_2=Ich rechne später mit dir ab.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.kiri.hello=Ich kannte einen Typ, der in einem Baumhaus in einem dieser Bäume lebte. So unfair.\nIch bin ziemlich sicher, dass sein Baumhaus jetzt zu Holz für die Wand irgendeines reichen Millionärs wurde.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.paz.hello=Ich sag's mal ehrlich. Dieser Wald wirkt... "verzaubert". Ich glaube, es ist eine schreckliche Idee, diese Bäume zu fällen. Das wird uns noch heimsuchen.\nIch glaube nicht, dass das lila Zeug, das durch den Boden sickert, ein gutes Zeichen ist.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.marlo.hello=Ich vertraue diesem lila Zeug nicht.\nEs ist nicht natürlich.\nWarum sind jetzt überall Spinnen.\nDas ergibt keinen Sinn.\nIch glaube, das ist ein Zeichen, dass etwas Schlimmes passiert.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available=Hallo nochmal! Ich habe an einem neuen Rezept gearbeitet. Ich glaube wirklich, es wird die Leute von Pumpkingdom moralisch enorm stärken.\nIch schätze, es wird auch tolles Essen für dich sein. Hast du Lust, es zu probieren?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_1=Ja, ich hab immer Hunger
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_2=Immer gespannt auf neue Köstlichkeiten
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted=Super! Hier ist meine Idee. Es ist ein Rindereintopf. Ich aktualisiere dein Rezeptbuch am Crafting-Tisch, damit du die Idee siehst.\nMach ein paar davon und sag mir, wie er schmeckt!
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_1=Das klingt wunderbar
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_2=Ich bin nicht so begeistert, aber ich versuch's
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder=Wie läuft es mit meinem tollen Rezept? Ich hoffe, du wurdest nicht davon vergiftet.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_1=Es läuft gut
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_2=Ooo, es sieht nicht gut aus
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_3=Ich hab noch nicht angefangen
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete=Na? Schau dich an, noch stehend und ohne das "Ich bereue alles"-Gesicht. Das ist vielversprechend. Ich sterbe vor Neugier – war der Rindereintopf gut? Habe ich als Koch versagt?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.tasty=Er war gut. Wirklich gut.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.honest=Er braucht noch etwas Arbeit.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.horrible=Er war widerlich.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup=Ja! Ich hab's gewusst. Alle im Königreich werden so glücklich sein. Ich kann es kaum erwarten, mein Werk mit mehr Menschen zu teilen.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_1=Ich freue mich, dich so glücklich zu sehen
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_2=Weiter so
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup=Nun, ich schätze, er ist nicht für jeden, und es klingt, als hättest du ihn nicht gehasst. Es klingt, als wäre ich auf dem richtigen Weg. Ich schätze das ehrliche Feedback.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_1=Keine Sorge, ich glaube an dich
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_2=Du solltest jetzt aufgeben
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting=Oh Gott. Es tut mir so leid. Ich sollte als Koch einfach aufgeben. Ich kann nicht glauben, dass er dir so sehr missfallen hat.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_1=Tut mir leid, ich hab es nicht so gemeint
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_2=Schau, Kochen ist einfach nichts für dich
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello=Wie läuft's? Ich hoffe, es geht dir besser als mir.\nAlle meine Kühe sind immer noch mit dem lila Zeug korrupt. Das ist sehr schlimm.
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello.response_1=Das tut mir leid zu hören
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer=*Schluchzend* Hey! Sorry, du hast mich in einem schlechten Moment erwischt.\nMeine Kühe sind schlecht geworden. Sie schaden den Dorfbewohnern. Ich kann sie nicht so sehen.\nIch will ihnen nicht weh tun. Kannst du etwas dagegen tun?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.what_happened=Was ist mit ihnen passiert?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.ill_help=Ich schütze die Dorfbewohner
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.what_happened_followup=Ich weiß es nicht. Eines Tages grasten sie noch, und dann waren sie plötzlich mit dem lila Zeug befallen. Es ist wie eine Krankheit, und alle sind infiziert. Es ist so traurig zu sehen.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.followup.response.accept=Ich kümmere mich darum
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check=*Schluchzend* Ich hoffe, es läuft gut bei dir.\nWie läuft's? Eigentlich, sag mir nichts. Ich will es nicht wissen.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check.response.on_it=Ich bin dabei
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete=Oh mein Gott! Vielen Dank, dass du das gemacht hast. Das ist so schrecklich. Was ist über sie gekommen. Das ist so unfair.\n*Schluchzt weiter*\nMeine armen Kühe.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_1=Bitte wein nicht
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_2=Jederzeit gern


skyblock_hub_dialogues.panorama.skyblock=Skyblock
skyblock_hub_dialogues.panorama.by_cubecraft=von CubeCraft
skyblock_hub_dialogues.panorama.complete_quests=Quests abschließen
skyblock_hub_dialogues.panorama.explore=Erkunde
skyblock_hub_dialogues.panorama.and_upgrade=Und verbessere dich
skyblock_hub_dialogues.panorama.your_adventure=Dein Abenteuer beginnt jetzt!
skyblock_hub_dialogues.panorama.speak_to_helper=Sprich mit dem Dorfbewohner, um deine ersten Quests zu sehen

# Grot & Nira - A Bolt of Hope
skyblock_hub_dialogues.npc_name.grot=Grot
skyblock_hub_dialogues.npc_name.nira=Nira
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro=Du. Stopp. Ich brauche deine Hilfe.\nDas Schwein neben mir. Das ist meine Frau. Nira. Die lila Fäulnis hat sich durch unseren Bereich ausgebreitet und sie hat sich verändert. Sie ist noch da drin. Das weiß ich. Sie stößt jeden Morgen ihre Nase gegen mein Bein, wie immer.\nIch hörte, Blitze können die Fäulnis durchbrechen. Find mir einen Blitzableiter. Den Rest erledige ich.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro.response.accept=Ich finde dir einen Blitzableiter
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro=Sie ist noch hier. Stößt immer noch jeden Morgen ihre Nase gegen mein Bein.\nWenn du einen Blitzableiter gefunden hast, nutzen wir ihn, um einen Blitzeinschlag direkt auf sie zu lenken.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro.response=Hier, nimm ihn.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt=Etwas ist passiert. Sie hat gequietscht.\nAber sie ist immer noch ein Schwein. Die Entladung war nicht stark genug.\nIch brauche mehr. Viel mehr. Wir werden den mächtigsten Gewittersturm herbeiführen, den du je gesehen hast.\nBlitzableiter werden nicht reichen. Wir müssen Eiskristalle und Wasserdampf nutzen, um den Sturm des Jahrhunderts zu brauen.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_1=Ich sammle alles
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_2=Das sind viele Materialien
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro=Hast du alles?\nNira hat mir früher von Stürmen erzählt. Sie sagte, Wasser gefriert sehr hoch oben an Orten wie der Cold Taiga, wo die Luft dick und kalt ist. Dann gibt es Wasserdampf, der aufsteigt und auf das Eis oben trifft. Sie bauen massive Ladung auf, bis der Himmel sie nicht mehr halten kann und aufreißt.\nWenn wir die Ableiter stapeln, um es zu fokussieren, und das Eis und Wasser nutzen, um die Ladung aufzubauen, können wir etwas Größeres als jeden natürlichen Blitz erzeugen. Etwas stark genug, um durch die Fäulnis zu brechen.\nHoffen wir, dass wir dabei nicht den gesamten Nether schmelzen.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro.response=Hier sind deine Sturmzutaten
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete=NIRA!\nSchau sie an. Sie ist zurück!\nIch habe keine Worte dafür. Du hast mir meine Frau zurückgebracht.\nDanke. Das meine ich ernst.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_1=Sie verdient es, zu Hause zu sein
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_2=Schön, dass ich helfen konnte
skyblock_hub_dialogues.nether.piglin_colony.grot.hello=Nira findet sich noch zurecht. Sie war lange ein Schwein. Aber sie ist wieder sie selbst. Ich weiß nicht, was ich ohne dich getan hätte.
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_1=Sie ist glücklich, dich zu haben
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_2=Pass gut auf sie auf
skyblock_hub_dialogues.nether.piglin_colony.nira.hello=Ich erinnere mich an alles, selbst als Schwein habe ich jeden Tag Grots Stimme gehört. Er hat mich nie verlassen. Er war so süß zu mir.\nEs wird sicher einige Zeit dauern, bis ich mich wieder an das Leben auf zwei Beinen gewöhnt habe.
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_1=Es ist schön, dich zurückzuhaben
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_2=Du hast wirklich Glück
skyblock_hub_dialogues.nether.piglin_colony.nira_pig.hello=Oink.
