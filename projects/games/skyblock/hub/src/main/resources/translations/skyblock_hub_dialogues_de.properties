skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.hello=Halt die Stimme unten. Schall trägt dort drin.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.locked=Nicht jetzt. Das Dorf kämpft noch mit den Bodenverschiebungen. Komm wieder, wenn sich die Lage beruhigt hat.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available=Du gehst in die Cobblestone Mine? Gut. Ich hasse die Spinnen da drin. Mit Steinstaub komme ich klar. Aber acht Beine, die an meinen Stiefeln vorbeischrappen – das geht gar nicht.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.whats_changed=Was hat sich verändert?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.what_you_need=Was brauchst du von mir?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.whats_changed=Sie werden mutiger. Sie bleiben nicht mehr im Dunkeln, wie früher. Und manche Netze haben einen leichten Schimmer. Wahrscheinlich nichts. Wahrscheinlich.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need=Räum die Cobblestone Mine fünfmal frei. Nicht einmal. Fünfmal. Ich muss wissen, ob sich die Spinnen vermehren, wandern oder verdrängt werden.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.on_it=Alright. Ich mach's.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.five_times=Fünfmal klingt nach viel.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.why_five=Wenn du sie einmal vertreibst, verstecken sie sich. Beim zweiten Mal ziehen sie um. Nach ein paar Durchgängen zeigen sich Muster. Netzdichte. Spawnpunkte. Die Art von Dingen, die man nur bemerkt, wenn man müde ist und trotzdem aufpasst.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress=Ich zähle noch mit. Fünf Treffer. Versuch, nicht eingewickelt rauszukommen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress.response.working=Ich arbeite dran.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete=Du hast es wirklich gemacht. Fünfmal, und du bist noch in einem Stück. Am Eingang sieht's schon besser aus. Weniger Netze in der Luft. Weniger Gekrabbel am Stein.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete_reward=Nimm das. Falls die Mine weiter Ärger macht, kannst du wenigstens selbst Stein abbauen, ohne drin zu wohnen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.glad=Schön, dass es geholfen hat.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.tint=Der Schimmer, den du erwähnt hast...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.tint_followup=Ich sag nicht, dass er die Ursache ist. Ich sage nur, ich hab nach Erschütterungen schon Seltsameres in Rissen gesehen. Halt die Augen unten offen. Wenn du was siehst, das nicht stimmt – fass es nicht mit bloßen Händen an.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.after_completion=Wenn die Netze wieder anfangen zu wuchern, weiß ich's vor dir. Ich rieche die Feuchtigkeit, wenn sie nisten.
skyblock_hub_dialogues.npc_name.ore_merchant=Ore Merchant
skyblock_hub_dialogues.npc_name.garden_merchant=Garden Merchant
skyblock_hub_dialogues.npc_name.spawner_merchant=Spawner Merchant
