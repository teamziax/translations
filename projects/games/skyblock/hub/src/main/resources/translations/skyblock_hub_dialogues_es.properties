skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.hello=Baja la voz. El sonido se propaga ahí dentro.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.locked=Ahora no. El pueblo todavía está lidiando con los movimientos del suelo. Vuelve cuando las cosas se calmen.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available=¿Vas a entrar a la Cobblestone Mine? Bien. Odio las arañas de ahí dentro. El polvo de piedra lo aguanto. Las ocho patas rozándome las botas, no.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.whats_changed=¿Qué ha cambiado?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.what_you_need=¿Qué necesitas de mí?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.whats_changed=Están más atrevidas. Ya no se quedan en la oscuridad como antes. Y algunas telarañas tienen un tono extraño. Probablemente no es nada. Probablemente.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need=Limpia la Cobblestone Mine cinco veces. No una. Cinco. Necesito saber si las arañas se están multiplicando, migrando o si algo las está empujando.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.on_it=De acuerdo. Lo haré.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.five_times=Cinco veces parece mucho.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.why_five=Si la limpias una vez, se esconden. Si la limpias dos veces, se mueven. Después de varias pasadas, empiezan a aparecer patrones. Densidad de telarañas. Puntos de aparición. El tipo de cosas que solo notas cuando estás cansado y aún así prestas atención.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress=Sigo contando. Cinco limpiezas. Intenta no salir envuelto en telarañas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress.response.working=Estoy en ello.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete=Lo has conseguido de verdad. Cinco limpiezas y sigues entero. La entrada ya tiene mejor pinta. Menos telarañas en el aire. Menos movimiento sobre la piedra.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete_reward=Toma esto. Si la mina sigue dando problemas, al menos podrás sacar piedra tú solo sin tener que vivir dentro.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.glad=Me alegra haber podido ayudar.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.tint=Sobre ese tono que mencionaste...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.tint_followup=No digo que sea la causa. Digo que he visto cosas más raras en las grietas después de un temblor. Mantén los ojos abiertos ahí abajo. Si ves algo que no tenga buen aspecto, no lo toques con las manos desnudas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.after_completion=Si las telarañas vuelven a avanzar, me enteraré antes que tú. Noto la humedad cuando anidan.
