skyblock_hub_dialogues.wurg.cannot_cross=¡¡¡GGGRRR!!! ¡Soy un Wurg de muy mal humor! ¡Los Wurgs juramos proteger los puentes e impedir que cruce cualquiera que no sea digno! ¡Vuelve cuando hayas descubierto más cosas!
skyblock_hub_dialogues.wurg.back_to_work_response=¡Hora de volver al trabajo!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat=¡Ey, sigues en pie! Buena señal. ¿Ya conociste a los aldeanos? ¡Les encanta charlar!\n¿Te sientes un poco perdido? ¡No te preocupes! Tus misiones están a salvo en tu <cc:header>Menú de Skyblock</cc:header> o escribe "/skyblock quests"!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_1=¡Gracias por la info!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_2=¡Sí, los aldeanos son muy amables!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.introduce=¡Hola, amigo! Bienvenido al pueblo de Oakridge \nVaya, qué poco educado... ¡Se me olvidó presentarme!\nMe llamo Cubit, ¡soy el guía del pueblo aquí en Oakridge!\n¡Sígueme, te enseñaré el corazón del pueblo y te presentaré a los aldeanos!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_enchanter=¡Este es el encantador!\nDe alguna manera mágica, puede encantar tus objetos para hacerlos más poderosos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_portal=Y con esto volvemos al portal...\nSiempre puedes usar el portal para volver a casa, o también el práctico menú de tu inventario.\n¡Esto es todo el recorrido por ahora, pero no te preocupes, hay mucho más por explorar en Oakridge!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_repairer=¡Conoce al reparador!\n¡Puede reparar cualquier cosa! Aunque le hayan dado mordiscos...\nComo un conejo o algo así...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_shops=Ah, mi parte favorita... ¡Las tiendas!\n¡Tienen todo lo que necesitas y todo lo que no sabías que necesitabas!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce=¡Ey, eres tú de nuevo!\n¡Mejor te llevo a la Forja! Es el único lugar del mundo de Skyblock capaz de hacer mejoras poderosas a herramientas y armaduras.\nPuede ser un poco difícil de encontrar, ¡así que vamos allá!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_1=¡Vamos!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_2=¡No puedo esperar!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge=¡Bienvenido a la Forja! ¡Este enorme edificio es una auténtica bestia!\nSe dice que fue construido por personas que parecían estar poseídas y que tiene poderes mágicos.\nLas Runas encontradas por el mundo pueden refinar aquí sus verdaderos poderes.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_1=¡Uf, da un poco de miedo!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_2=¡Tengo muchas ganas de crear algo poderoso!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello=¿Qué tal en la forja? ¿Has hecho algo alucinante?\nLas Mazmorras son un buen punto de partida para encontrar Runas si te hacen falta.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_1=¡Sí, va bien!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_2=¡Todavía no he hecho nada bueno!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.introduce=¡Ey, qué tal! ¡Soy Cassandra! ¡Soy granjera! ¡Algunos dirían que soy la mejor granjera de por aquí!\n¡Algunos dirían que <italic>me cosecho</italic> a toda la competencia!\n\nComo granjera de remolacha, ¡siempre tengo toneladas de semillas de remolacha! ¡Vuelve a verme si alguna vez quieres un trato genial!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.response=¡Encantada de conocerte!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.chat=¡Ey, qué tal, compi!\n¿Te puedo ofrecer unas semillas de remolacha a buen precio?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.introduce=Mmh... Soy Levi.\nNo eres de por aquí, ¿verdad?\nTodo el mundo me conoce. Soy el que siempre se queda dormido en el trabajo. Estoy trabajando para mejorar mis habilidades y poder ayudar más, pero todavía no he llegado ahí.\nSi sigues así, llegarás a ser tan famoso como yo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_1=Espero que no te duermas siempre
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_2=Pareces un problema con patas
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.hello=Ey, ¿cómo estás?\nEstoy muy ocupado... descansando. ¿Puedes volver en otro momento?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.introduce=¡NO ME LO PUEDO CREER! ¡Gente nueva!\nEres nuevo, ¿verdad? Tengo muchísimas ganas de conocerte. Cuéntame todo.\n¿Cómo estás? Tengo tarta. ¿Quieres tarta?\nDios mío. Para que me pares. Si no, sigo hablando sin parar.\n¿Ya conociste a todos? ¿Has visto las tiendas? ¿Y las minas?\n¡OOOOOOHH! Hay un montón de cosas moradas raras saliendo del suelo, ¿te has enterado?\nEspera... paro
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_1=¡Para, para!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_2=Creo que nos vamos a llevar bien
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_3=Eres demasiado caótica
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello=¡Wow, has vuelto a hablar conmigo! Me siento honrada.\n¿Estás bien? He hecho más tarta. Me encanta la tarta.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello.response_1=A mí también me encanta la tarta
skyblock_hub_dialogues.response.show_me_around=¡Sí, enséñame el lugar!
skyblock_hub_dialogues.response.show_me_more=¡Sí, enséñame más!
skyblock_hub_dialogues.response.show_me_what_youve_got=¡Sí, enséñame lo que tienes!
skyblock_hub_dialogues.response.thanks_for_help=¡Gracias!
skyblock_hub_dialogues.response.yeah_sure=¡Sí, claro!
skyblock_hub_dialogues.response.lets_go=¡Estoy listo!
skyblock_hub_dialogues.response.ill_pass=Quizás en otro momento...
skyblock_hub_dialogues.response.yeah_ill_help=¡Sí, te ayudo!
skyblock_hub_dialogues.response.not_right_now=No, ahora mismo no
skyblock_hub_dialogues.response.okay=Vale
skyblock_hub_dialogues.response.yes=Sí
skyblock_hub_dialogues.response.tell_me_more=Cuéntame más.
skyblock_hub_dialogues.response.i_should_go=Debería irme.
skyblock_hub_dialogues.response.fair_enough=Tiene sentido.
skyblock_hub_dialogues.response.yikes=Vaya.
skyblock_hub_dialogues.response.good_luck=Buena suerte.
skyblock_hub_dialogues.response.interesting=Interesante.
skyblock_hub_dialogues.response.laugh=¡Jaja!
skyblock_hub_dialogues.response.ill_leave_you_to_it=Te dejo con ello.
skyblock_hub_dialogues.response.will_do=¡Entendido!
skyblock_hub_dialogues.response.ellipsis=...
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.introduce=¡Ay, madre mía! ¡Mis preciosas bolitas de pelo se han escapado otra vez! Estaban saltando cerca de la cabaña, ¡pero ahora han desaparecido en el bosque! ¿Podrías ayudarme a reunirlos? Te lo pagaré bien, ¡te lo prometo, solo necesito que mis bebés vuelvan a casa!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.response=¡A por los conejos! No te preocupes, Aurora.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.hows_it_going=¿Cómo va? ¿Algún rastro de mis pequeños artistas del escape? Esos conejos están tramando algo, lo sé... espero que solo sea un robo de tentempié y no una rebelión en toda regla.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks=¡Oh, gracias a los cielos! Muchísimas gracias por ayudarme... ¡No habría podido controlarlos sin ti! ¡Voy a contarle a todo Oakridge lo amable y valiente que eres!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks.response=¡Me alegra haber podido salvar el día!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.hello=¡Ey! ¡Sigo siendo súper agradecida por tu ayuda con mis pequeños traviesos!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro=¡Eeek! ¡Aléjate! O sea, ¡hola! Los conejos son demasiado nerviosos para mí. ¡Son aterradores! ¿Puedes llevarle esta comida a Aurora? He preparado zanahorias, remolacha y trigo para que los tenga... satisfechos.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_1=¡Claro! Seré tu héroe de los recados.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_2=¿Cómo puedes tener miedo? ¡Si son conejitos esponjosos!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress=Ey, ¿ya has... ya les has dado de comer a esas criaturas terroríficas? ¿Siguen teniendo hambre?
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress.response=Todavía no, pero estoy en ello.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete=¡Eres el mejor! En serio, los conejos son monstruos disfrazados de peluche. Aurora dice que debería ir a visitarlos algún día... quizás lo hago, ¡si estás tú para protegerme!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete.response=¡Cuando quieras! Seré tu guardaespaldas de conejos.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello=¡Ey, qué tal! ¡Soy el mejor proveedor de comida para animales del bosque, sobre todo porque no me gusta acercarme demasiado a los animales!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello.response_1=¡Me alegra oír eso!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro=¡Oh! Estas deben de ser las zanahorias que ha reunido Bob. Es tan atento, aunque sea un poco nervioso. ¿Me las das?
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro.response.yes=¡Aquí las tienes!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks=¡Perfecto! Muchísimas gracias. Dile a Bob que siempre es bienvenido a visitar; quizás si los ve masticando se dará cuenta de que solo son amiguitos suaves.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks.response=Se lo diré.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro=¿Bob te mandó con aperitivos? ¡Qué amable! Estoy un poco liada con los otros conejos, ¿podrías darles de comer directamente a estos? ¡Dile a Bob que puede venir cuando quiera!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro.response=¡Puedo hacerlo!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.catch=<italic>*Hop Hop*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.response=¡Te tengo! Con calma.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.intro=Este conejo mueve la nariz... ¡tiene pinta de querer zanahorias!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.thanks=El conejo mastica felizmente las zanahorias.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.catch=<italic>*¡Chillido!*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.response=¡Ven conmigo, pequeño!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.intro=Este conejo parece querer remolacha... ¡está mirando la bolsa fijamente!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.thanks=El conejo disfruta la remolacha.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.catch=<italic>*Ñam Ñam*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.response=¡De vuelta al corral!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.intro=¡Este conejo espera pacientemente un poco de trigo!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.thanks=El conejo mordisquea el trigo con satisfacción.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.hello=<italic>*Mueve la nariz*</italic>


skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.intro=¡Ey! Tú, ven aquí\nAnoche... las paredes temblaron con violencia y así, de repente, todas las casas de aquí están inestables...\nY claro, ese acaba siendo mi problema a resolver...\nPero ahora supongo que puedo hacerlo tu problema también.\nVe a buscarme troncos de roble y piedra, hablaremos cuando lo hayas hecho.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going=Eres tú otra vez.\n¿Ya has reunido los materiales?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.yes=¡Sí! Tengo algunos recursos para ti.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.no=No, lo siento, vuelvo a ello :(
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks=Vaya, de verdad lo hiciste.\nEstoy... impresionado.\nGracias, supongo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks.response.enjoy=¡Espero que esos recursos hayan servido de algo!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well=Sin terremotos desde anoche. Quizás es mejor que siga así.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well.response.glad_to_hear=¡Me alegra que esté funcionando bien!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro=Ey, tú. Déjame presentarte algo muy poderoso de este mundo...\nLos Santuarios. Sí, dales un montón de cualquier objeto para el que esté hecho el santuario, y te recompensará con cosas increíbles.\n¡Ve a explorar para encontrar todos los Santuarios que tiene esta tierra!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_1=¡Me pongo a ello!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_2=¡Los veré sobre la marcha, gracias!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going=¿Ya los has encontrado todos?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_1=¡Sigo buscando!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_2=¡Estoy haciendo todo lo posible por encontrarlos todos!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello=¡Ey! ¿Qué hay?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello.response_1=¡Qué gusto verte de nuevo!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello=Ey. Soy Gus. Creo que dejé mis gafas por aquí en algún sitio.\nSupongo que seguiré buscándolas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_1=Buena suerte. ¡Espero que las encuentres!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_2=Apuesto a que no lo viste venir...


# Cobblestone Mine - Dungeon Guard
skyblock_hub_dialogues.overworld.oak_forest.cobblestone_mine.dungeon_guard.introduce=No hace mucho, esta era una mina tranquila y productiva...\nEso fue hasta que llegaron las arañas.\nLa Guardia de Oakridge no estaba preparada para un ataque así.\nNos desbordaron y tuvimos que retirarnos.\nAhora la mina está repleta de arañas y otras criaturas.\n¿Podrías ayudarnos a limpiarla?

# Pumpkingdom - Ella
skyblock_hub_dialogues.overworld.plains.pumpkingdom.ella.flower_shop=¡Ey, qué tal! ¡Soy la dueña de la Floristería aquí en Pumpkingdom!\n¿Te puedo ofrecer unas flores?

# Pumpkingdom - Dungeon Guard
skyblock_hub_dialogues.overworld.plains.pumpkingdom.dungeon_guard.introduce=Había tantísimos zombis. ¡Me persiguen en sueños!\nNo sé cómo sobrevivimos. No podría haber hecho nada más.\nMe pregunto si tú lo habrías hecho mejor. ¿Crees que habrías podido ayudar? ¿Habría cambiado el resultado si hubieras estado allí?

# Pumpkingdom - Blooming in the Rain
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce=¡Oh! ¡Hola! ¡Tienes pinta de tener unas manos estupendas para la jardinería! La tierra ha estado muy inquieta últimamente; creo que necesita colores vivos para calmarse. ¿Me ayudas a recoger algunas flores?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_1=¡Ooh, flores! Me encantaría ayudar.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_2=Ahora mismo estoy demasiado ocupado para recoger flores.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker=¡Espera, espera! No podemos arrancarlas sin más, ¡las raíces son muy delicadas! Antes de salir, pasa por esa tienda y compra un recogeflores.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker.response_1=Claro, voy a por uno
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go=¡Muy bien, ya lo tienes! ¡Mira qué brillo tiene! Vale, concéntrate, Sandy... concéntrate... ¡¡¡Vamos a recoger flores!!!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go.response_1=¡Sí! ¡Flores!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions=¡Mira estos Dientes de León! Son como trocitos de sol. ¡Cosecha unos cuantos con la herramienta y luego tráemelos!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_1=¡Aquí tienes unos dientes de león!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_2=Oh, voy a por ellos. Me he distraído un poco.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_dandelions=¡Concéntrate! Asegúrate de cosechar los Dientes de León con la herramienta para no molestar a la tierra.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys=¿Has oído eso? El suelo sonaba un poco... crujiente. Vamos a buscar unas amapolas. Su rojo es tan intenso, perfecto para las ruinas.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_1=¡Sí, vamos a explorar!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_2=Si no hay más remedio...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys=¡Rápido, rápido! Cosecha unas amapolas con la herramienta y luego tráemelas. Hacen tanto por la tierra.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_1=¡Aquí tienes unas amapolas!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_2=Oh, voy a por ellas.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_poppys=¡Las Amapolas! ¡Asegúrate de cosechar las Amapolas con la herramienta!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys=Bien, una última cosa... creo. ¡Ooh! Vamos a buscar unas peonías. ¡Son como mantas esponjosas para la tierra!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_1=¡Sí, vamos a explorar!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_2=Claro...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys=¿No son magníficas? Cosecha unas peonías con la herramienta y tráemelas. ¡Son la pieza final de nuestro vendaje floral!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_1=¡Aquí tienes unas peonías!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_2=Oh, voy a por ellas.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_peonys=¡No te olvides! ¡Asegúrate de cosechar las peonías con la herramienta!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home=¡Oh! ¡Mi cesta está desbordándose! Y me empiezan a hormiguear los pies... creo que ya es suficiente. Vamos a casa.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_1=¡Sí, vamos a casa!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_2=Me duelen las piernas de tanto caminar :(
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up=¡Ha sido muy bonito! La tierra ya parece un poquito más tranquila, ¿verdad? Repitamos esto en algún momento.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_1=Sí, yo también lo he disfrutado.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_2=No estuvo mal, supongo. Las flores no son lo mío.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello=¡Ey, qué tal! Espero que estés de humor florido y listo para ayudar a los brotes.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello.response_1=¡Espero que tú también!

# Pumpkingdom - Non-Quest NPCs
skyblock_hub_dialogues.overworld.plains.pumpkingdom.cedric.hello=Si hueles a quemado, es que tienes la cara demasiado cerca del fuego. Estas patatas están crudas.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello=Habla en susurros, por favor. Los espantapájaros están escuchando. O igual me estoy volviendo loco.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello.response_1=¿Quieres un amuleto de la suerte de calabaza?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.detail_1=No. Ni hablar.\nSi llevo un amuleto de la suerte y falla, tendré que empezar a creer también en los de mala suerte.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello=Bienvenido, viajero. Estás en Pumpkingdom. Tenemos las calabazas más famosas del mundo.\n¿Hay algo en lo que pueda entretenerte?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_1=Cántame algo.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_2=¿Por qué se llama Pumpkingdom?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_3=Solo estoy de paso.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.verse_1=Oh, calabaza, calabaza, naranja y brillante,\nEsperando una noche espeluznante.\nCon una sonrisa graciosa o una cara de miedo,\nEres la calabaza más mona de este lugar.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.detail_1=Porque decir "Pueblo de la Calabaza" sonaba como pedir que nos saquearan.\nAdemás, el primer alcalde lo declaró con un cuchillo de tallar, y nadie le discutió al cuchillo.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.maeve.hello=¡Hola! Soy Maeve. Me gustan los libros y me gusta leer. Se puede aprender mucho de un libro. Excepto a leer. Aprender a leer leyendo un libro todavía no le ha funcionado a ninguno de los que he probado.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.quinn.hello=No toques las palancas.\nBueno, tócala. Suave.\nNo tengo ni idea de qué hacen, así que si explota... ¡No me mires a mí!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello=Si vienes por calabazas, toma el camino de la izquierda.\nSi vienes por chistes malos, enhorabuena. Ya estás perdido.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_1=Cuéntame un chiste malo.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_2=Te dejo con lo tuyo.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1=¿Cómo arreglas una calabaza rota?\n¡Con un parche de calabaza!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1.response_1=Eso ha sido genuinamente horrible.

# Pumpkin Towers - Potato Zombies
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce=¡Psst! Tienes pinta de saber manejar una pala o una espada.\nTenemos un pequeño problemilla aquí fuera... Los zombis están invadiendo mis campos.\nEstán pisoteando los cultivos, mordiendo las vallas y, lo peor de todo, ¡comiéndose mis patatas!\n¿Me echas una mano y salvas la cosecha?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response1=¡Claro! A mí unos cuantos zombis no me asustan.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response2=Si de verdad lo necesitas...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane=¡Muy buen trabajo, amigo!\nSi tienes un momento... ¿Podrías pasarte a ver a mi amiga Susane?\nParecía estar teniendo problemas con las arañas alrededor de sus calabazas.\n¿Te importaría ir a encontrarla y echarle una mano también?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response1=¡Vamos a aplastar algunas arañas!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response2=¡Mantendré tus calabazas a salvo!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks=¡Vaya, de verdad les has enseñado quién manda!\nNo puedo creer que hayas acabado con tantos\nOjalá se fueran para siempre... pero de momento, ¡has marcado la diferencia de verdad!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks.response=¡Cuando quieras, ayudar es lo mío!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hows_it_going=¿Cómo van las cosas?\n¿Puedes creer que esas criaturas se apoderaran del lugar así sin más?\nVaya suerte la nuestra...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hello=¿Quieres saber un pequeño secreto?\nMi nombre real no es Fred.\nLa gente empezó a llamarme Potato Fred después de aquella vez que me quedé atascado en un montón de patatas.\nTodavía no sé cómo salí de ahí...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.see_fred=¡Buenas!\nLas calabazas no son lo único que crece rápido, ¡las plagas también!\nA mi compañero, Potato Fred, le vendría bien tu ayuda.\n¿Te importa ir a ver cómo está?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred=¡¡¡AAAAGHH!!!\n¡¡¡ARAÑAS!!! ¡¡¡ARAÑAS POR TODAS PARTES!!!\n¡Están arruinando mis calabazas!\n¿Puedes ayudarme a deshacerme de ellas?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response1=¡QUÉ HORROR, ARAÑAS!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response2=¡Claro, las arañas no me asustan!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders=¿Ya te has encargado de esas arañas?\nNo me atrevo a volver si todavía están ahí...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders.response=Todavía quedan algunas...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.hello=Ah, me encanta ver mis calabazas en buen estado...\n¡Esas estúpidas arañas siempre intentan arruinarlo todo!\nEsperemos que se alejen para siempre esta vez...

# Plains - Pumpkin Towers - Susane & Kipp
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce=¡Tú! ¡Tienes pinta de tener sentido de la justicia! Hay un pequeño travieso corriendo por ahí robando mis calabazas ganadoras para sus "proyectos". ¡Tienes que encontrarlo para que yo pueda darle una reprimenda firme pero justa! ¿Me ayudas a atrapar al culpable?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_1=¡Voy a encontrar a ese pequeño granuja!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_2=De acuerdo, te ayudo a llegar al fondo de esto.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going=¿Has tenido suerte encontrando a ese niño y sus calabazas robadas? ¡Mis calabazas son para el festival, no para hacer de diana!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going.response=¡Sigo en ello, Susane!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete=¡Ahí está! ¡El muy pillo! ...Espera, para. ¿Eso es una calabaza tallada? Mira esa artesanía... no la ha arruinado, ¡la ha mejorado! Vaya, eso es increíble de verdad. Gracias por traerme a él y a su arte.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete.response=¡Me alegra haber podido aclarar el malentendido!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce=¿Susane te mandó a arrastrarme de vuelta al campo? ¡Ay, no... va a estar muy enfadada! Por favor, ¡no me lleves con ella todavía! ¡No soy un ladrón, soy un artista! Mira, si le llevo un regalo de reconciliación... ayúdame a encontrar mi cuchillo de tallar y haré algo que le cambie la opinión.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_1=Busco tu cuchillo. Veamos qué puedes hacer.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_2=Bueno, lo busco. Pero no causes más caos.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint=La última vez que lo tuve fue cerca de las hileras principales de calabazas mientras buscaba un buen lienzo. ¡Tiene que estar por ahí!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint.response=Estoy en ello.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife=¡Lo encontraste! Eres un salvavidas. Voy rápido, le voy a tallar una obra maestra que hará que se le olvide todo lo de las calabazas que faltan.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife.response=Vamos. ¡Dedos cruzados!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.hello=Hoy voy con el perfil bajo. El arte requiere concentración, ¿sabes?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.knife.dont_know=Qué cosa tan rara dejar tirado por ahí este cuchillo. Tiene "Kipp" grabado en el mango. Debería devolvérselo.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.hello=¿Oyes eso? Es el sonido de buena comida cocinándose. A la gente de Pumpkingdom le va a encantar.\n¡Gracias por todo tu duro trabajo!
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available=Si hueles la cena, significa que sigo ganando. Por los pelos. El cubo del carbón está vacío y varios hornos se han roto. Ayúdame antes de que toda la Plains empiece a masticar patatas crudas.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.help=Puedo ayudar.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.plan=¿Cuál es el plan?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.breaking=¿Por qué se rompen los hornos?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.why_furnaces_break=Ciclos de calor, manos descuidadas y un poco de mala suerte. Un momento están bien y al siguiente están agrietados y soltando ceniza. Me las puedo arreglar con un horno roto. No puedo con una cocina rota.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted=Perfecto. Necesito tres cosas, y las necesito rápido. Carbón para mantener el calor estable, hornos para sustituir los rotos y patatas para poder sacar algo comestible.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted.response.all=Lo traigo todo.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items=Cada vez que me doy la vuelta, alguien "revisa" un horno y lo deja con la puerta abierta. Tráeme carbón, hornos y patatas, y yo convertiré el pánico en cena.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.deposit=He traído suministros.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.working=Estoy en ello.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.deposit_thanks=Bien. A los cubos y a los braseros. Sigue trayendo.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage=Con eso está todo. Los fuegos vuelven a encenderse, la cola se mueve y la Plains podrá comer comida cocinada en el futuro previsible.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.glad=Me alegra haber podido ayudar.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.save=¡Algún día deberíamos cocinar juntos!

# Plains - Ruins - Lewis
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available=Las ruinas no son decorado. Son una ruta.\nIntenta practicar tus habilidades en las ruinas. Podrías mejorar muchísimo tu movilidad.\nIntenta llegar hasta Robb, a quien vi jugando en las ruinas antes.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.accept=De acuerdo. Llegaré a la plataforma.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.tips=¿Algún consejo antes de empezar?
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.later=Ahora mismo no.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips=Elige tu próximo aterrizaje antes de saltar.\nVe despacio. No hay prisa por subir.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips.response.okay=Entendido.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete=¿Todavía aquí abajo? Entonces no has llegado a lo alto de las ruinas.\nMantén los ojos arriba y ten paciencia. Llegarás a lo alto de las ruinas tarde o temprano.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.remind=Recuérdame dónde está Robb.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.go=Entendido. Voy subiendo.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location=En algún lugar cerca de lo alto, creo. Lo perdí de vista cuando fue subiendo por las ruinas.\nSi oyes reírse a Robb, estás cerca.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location.response.on_my_way=Voy para allá.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete=Te veo de una pieza. Buen trabajo.\n¿Se portó bien Robb? ¿Está entero? A veces tiene demasiada confianza ahí arriba, pero me fío de él.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.remember=Sí, está bien
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.useful=Parece un poco joven para estar ahí arriba.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools=Sí, es joven, pero aquí tampoco tenemos demasiado que hacer.\nJuega en esas ruinas para entretenerse.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools.response.thanks=Ah, ya veo.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.after_completion=Cuando veas piedra rota ahora, deberías pensar: ruta, cobertura, escapatoria.\nMuy útil teniendo en cuenta que los Zombis se han vuelto más habituales por aquí.

# Plains - Ruins - Robb
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached=jaja! ¡no me puedo creer que hayas llegado!\n¡bienvenido a lo alto! hay tanto que ver desde aquí. qué divertido es jugar en las ruinas, ¿verdad?\nte estaba viendo caer en el camino. es muy gracioso ver a la gente intentar subir.\n¿lewis estaba siendo muy serio otra vez? igual quiere que vuelva a casa.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.rough=¡Es muy divertido!
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.easy=Lewis admira tu habilidad para moverte por aquí.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.trick=Tampoco yo me puedo creer que haya llegado.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough=¡muy muy divertido! ¡jajaja! mira qué vistas. disfrútalas.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough.response.laugh=¡Jaja! ¡Sí! ¡Lo veo!
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy=seguro que sí. me muevo muy rápido. soy el mejor corriendo por aquí arriba.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy.response.okay=No te pases de confiado. Es peligroso.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick=la práctica hace al maestro. en el futuro te sentirás más seguro en las alturas de las ruinas.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick.response.got_it=Entendido.
skyblock_hub_dialogues.overworld.plains.ruins.robb.hello=heyyyy, ¿qué tal el entrenamiento de parkour? seguro que cada vez lo haces mejor.


# Jungle - Treetop Tropics - Nilo & Billy
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.hello=Ey, ¿cómo estás? ¿Sigues vivo? ¡Bien! ¡Gracias por encontrar a Billy, es un suertudo de ser guapo o igual lo habría convertido en alfombra!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction=¡Oh, catástrofe! ¡Absoluta catástrofe! Mi gato, Billy, ha vuelto a desaparecer. Está en algún lugar por encima de nosotros, probablemente tramando la dominación mundial o simplemente buscando un pájaro al que molestar. ¿Puedes ayudarme a recuperar a la bestia antes de que decida vivir en el dosel para siempre?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_1=¡Qué horror! Lo traigo ahora mismo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_2=Lo buscaré cuando no esté esquivando lianas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_3=Ahora mismo estoy muy liado. ¡La selva está hecha un desastre hoy!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks=¡BILLY! ¡Oh, gracias a las estrellas! ¡No me puedo creer que lo hayas encontrado de verdad! Siempre tiene tanta hambre que parece que tiene un agujero negro en el estómago. Voy a darle de comer un poco de pescado antes de que se empiece a comer el suelo de la selva.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_1=Sin problema. Soy un domador de gatos profesional.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_2=¿MÁS PESCADO? ¡ESE GATO ES UN POZO SIN FONDO!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking=¿Cómo va? ¿Algún rastro del fugitivo peludo?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking.response=Sigo intentando. Los gatos son escurridizos, y Billy es un ninja profesional.

# Billy the Cat
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found=Miau <italic>(Te mira con una sonrisa arrogante y satisfecha)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found.response=Ven conmigo, pequeño problemático. Vamos a llevarte a casa.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1=Miau <italic>(El barrigón ruge como una tormenta)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1.response=Toma, un poco de pescado. ¡Para de gruñir!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2=Miau <italic>(Te mira con expectación)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2.response=Toma, un poco más de pescado.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3=Miau <italic>(¡El rugido continúa!)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3.response=¿Este gato es un pozo sin fondo? Venga, ¡más pescado!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4=Miau <italic>(Sin impresionarse lo más mínimo)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4.response=Aquí tienes el cuarto pescado. En serio, ¿Billy?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5=Miau <italic>(Por fin parece satisfecho)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5.response=¡Por fin! Vamos a casa.


# Jungle - George - Fishy Business
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction=¡Ah, el suave tirón del sedal, la emoción absoluta de la captura! Mi pasión por la pesca es legendaria, aunque hace mucho que no puedo lanzar el anzuelo. Mi familia está aquí en la selva y no los cambiaría por todos los océanos del mundo, ¡pero cuánto echo de menos el agua! ¡Tienes que probarlo, es pura magia!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_1=¡Vale! ¡Me has convencido!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_2=¿De verdad es tan bueno? Supongo que lo intento.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_3=Ahora no, George.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch=¿Qué tal la pesca? ¿Ya encontraste ese ritmo? ¡Espero que estés consiguiendo capturas legendarias!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch.response=¡Estoy en ello, George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit=Cuando hayas pescado suficientes, ¡tráemelos para que los examine de cerca!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit.response=Aquí los tienes.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks=¡Ya te dije que sería divertido! Mira qué bellezas, ¡tienes un talento real para esto! Gracias por compartir la emoción conmigo; la pesca es algo increíble, y aún mejor con amigos. ¡Lástima que yo no haya podido llegar al lago!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks.response=¡Cuando quieras, George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.hello=¡Hola! ¡El agua está genial, incluso en la selva! ¿Listo para lanzar el anzuelo? Pero sabes qué lo haría aún mejor,\n¡pescar con tan buen amigo!


# Jungle - Celia - Bean to Bar
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.hello=Hola. ¿El chocolate es tu comida favorita de la selva? ¡Espero que sí!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.come_back_for_sugar=Hola. Si vuelves una vez que tengas azúcar, puedo enseñarte a endulzar el chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available=Tú. ¿Quieres aprender a hacer chocolate? Chocolate rico y sabroso. Aunque no sea muy sano, puede darte un chute de energía.\nEmpecemos con chocolate sin azúcar. El chocolate sin azúcar es una alternativa mucho más saludable.\nTe doy la receta, pero tendrás que prepararlo tú. Cuéntame cómo te va.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_1=¡Qué rico! ¡Chocolate!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_2=Ay, es que odio el chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.in_progress_craft=¿Qué tal con el chocolate? Espero que ese chocolate sin azúcar esté cumpliendo tus expectativas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete=¿Y bien? Dame el parte.\n¿Estaba amargo? ¿Qué efectos secundarios notaste?\nTanta gente sale disparada después de comer chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_1=Amargo, pero brillante.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_2=Creo que necesito agua.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available=Hola de nuevo. Entonces, ¿quieres aprender a añadirle azúcar al chocolate? Vamos allá.\nYa sabes cómo va. Te doy la receta, pero tendrás que prepararlo tú. Cuéntame cómo te va.\nCuidado: el chocolate no es sano y siempre hay que consumirlo con moderación.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_1=Sí, hagamos más chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_2=Ahora estoy cuidando la dieta, pero bueno.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft=¿Cómo va lo de añadir el azúcar al chocolate? Antes de que te des cuenta, quizás estés trabajando hacia un imperio de chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_1=Lo tengo controlado. Es fácil.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_2=No se me da muy bien hacer chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete=¡Lo conseguiste! Chocolate. Completo y rico como seguro que esperabas.\nAhora sé sensato y no salgas corriendo como loco con ese subidón de azúcar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_1=Tranquila, soy muy maduro con el chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_2=El bajón de azúcar va a doler.

# Jungle - Treetop Tropics - Non-Quest
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello=Dame un momento. Solo necesito revisar estos Granos de Cacao. A ver si ya están listos.\nOh espera, ¿y estos otros...?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello.response_1=Ya veo que estás muy ocupada ahora mismo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello=Construí algunas de estas plataformas cuando fallaron. Espero de verdad que mi ingeniería sea suficientemente buena para que se mantengan en pie.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_1=¿Construiste todo esto? Es impresionante.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_2=Tienes cara de estar a punto de desmayarte.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1=Gracias. Bueno, no todo. Solo arreglé las partes cuando se rompen.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_1=Cuántas barandillas. ¿Preferencia personal?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_2=Miedo a las alturas...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_railings=Sí.\n<italic>(Se agarra a la barandilla con ambas manos.)</italic>\nEl miedo a las alturas lleva a tomar medidas de seguridad extra.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_advice=No te burles de mí. No es algo que haya elegido, nací así.\nAunque supongo que es culpa mía por venir a ayudar aquí arriba. Ojalá fuera pescador en tierra firme.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_2=¿Has visto a qué altura estamos? ¡Estamos altísimos y yo tengo vértigo! Puede que sea el mal de altura.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello=Ey, tú, ¿quieres un chiste horrible?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_1=Bueno. Un chiste. Que duela.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_2=No, gracias. Valoro la paz.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu=Elige bien. La selva tiene muchos depredadores, pero ninguno tan implacable como mis remates.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_1=Suéltame un chiste de hojas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_2=Dame algo relacionado con arañas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_3=Venga, hazme gracia con el cacao.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_1=Intenté dejar la selva, pero las lianas dijeron: "No, tú te quedas."\nAsí que supongo que estoy atrapado en una re-lación-liana a largo plazo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_2=¿Cómo se llaman dos arañas recién casadas?\n¡Recién tejidas!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_3=Mi cacao nunca madura a tiempo para comerlo. Siempre llega demasiado cho-co-tarde.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.avaru.hello=¡Ey! ¡Qué día tan bonito! ¡Un placer conocerte! ¡Espero verte por aquí!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cressida.hello=¡MIRA EL TAMAÑO DE ESTE ÁRBOL! ¡ES GIGANTÍSIMO! :O\n¡Me pregunto cómo llega el agua hasta la copa!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello=Si ves un ocelote, no lo persigas. Tiene mucho miedo de ti.\nEste consejo también aplica a las personas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello.response=Voy a practicar mi mejor cara de indiferencia.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.silva.hello=¡Ey, mira dónde estoy! ¡Bajo un árbol!\nAntes me daba miedo, pero luego me fijé en sus raíces. Son cubos. Así que matemáticamente solo lo veo en una dimensión, porque estoy mirando la raíz cúbica.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello=Tienes pinta de venir recién salido del Oak Forest.\nBienvenido a la selva, viajero. Tendrás que acostumbrarte a trepar alto por los árboles. Espero que no tengas miedo a las alturas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_1=Bueno saberlo. Con las alturas me manejo bien.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_2=Ay, esto no va a ir bien.
skyblock_hub_dialogues.misc.optimiser_not_unlocked=¡Hola! ¡Soy el Optimizador! Puedo aumentar la producción de todos tus recursos.\nSoy bastante selectivo con quién me apetece trabajar, ¡así que vuelve cuando hayas avanzado un poco más!

# Shop Dialogues
skyblock_hub_dialogues.shop.blocks.greeting=¡Buenas, no encontrarás mejores bloques en ningún otro sitio! ¿Quieres echar un vistazo?
skyblock_hub_dialogues.shop.blocks.greeting.buy=¿Qué tienes a la venta?
skyblock_hub_dialogues.shop.blocks.greeting.sell=¡Déjame venderte algo!
skyblock_hub_dialogues.shop.blocks.greeting.nothing=¡No, gracias!
skyblock_hub_dialogues.shop.furniture.greeting=¡Muebles preciosos para una persona encantadora! ¿Te interesa ver algo?
skyblock_hub_dialogues.shop.furniture.greeting.buy=¡Enséñame lo que tienes!
skyblock_hub_dialogues.shop.furniture.greeting.sell=Tengo algunas cosas que vender.
skyblock_hub_dialogues.shop.furniture.greeting.nothing=De momento estoy bien, gracias.
skyblock_hub_dialogues.shop.garden.greeting=¡Tengo todo lo que necesitas para que tu jardín florezca! ¿Te interesa?
skyblock_hub_dialogues.shop.garden.greeting.buy=¡Enséñame lo que tienes a la venta!
skyblock_hub_dialogues.shop.garden.greeting.sell=Me gustaría vender algunas cosas.
skyblock_hub_dialogues.shop.garden.greeting.nothing=¡No, gracias!
skyblock_hub_dialogues.shop.misc.greeting=¡Te veo mirando! ¿Qué te ha llamado la atención?
skyblock_hub_dialogues.shop.misc.greeting.buy=¿Qué puedo comprar aquí?
skyblock_hub_dialogues.shop.misc.greeting.sell=De hecho, tengo algunas cosas que vender.
skyblock_hub_dialogues.shop.misc.greeting.nothing=Nada por ahora, gracias.
skyblock_hub_dialogues.shop.ore.greeting=¡Todos los minerales que tu corazón desee! ¿Quieres echar un vistazo?
skyblock_hub_dialogues.shop.ore.greeting.buy=¡Enséñame tus minerales!
skyblock_hub_dialogues.shop.ore.greeting.sell=Quiero venderte algunas cosas.
skyblock_hub_dialogues.shop.ore.greeting.nothing=Ahora mismo no, gracias.
skyblock_hub_dialogues.shop.spawner.greeting=¿Listo para generar más mobs? ¡Tengo justo lo que necesitas!
skyblock_hub_dialogues.shop.spawner.greeting.buy=¡Enséñame lo que tienes!
skyblock_hub_dialogues.shop.spawner.greeting.sell=De hecho, me gustaría vender algunas cosas.
skyblock_hub_dialogues.shop.spawner.greeting.nothing=Quizás la próxima vez, gracias.

# Cold Taiga - Ivar - Frozen Harvest
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro=El invierno tiene un agarre que no suelta, y las reservas de grano van bajando peligrosamente. Necesito asegurarme de que todo el mundo esté alimentado durante el hielo. ¿Puedes salir ahí y traerme algo de trigo?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro.response.accept=¡Claro, te ayudo! El pueblo lo necesita.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources=Mantén la cabeza gacha y las manos activas. ¿Cómo va la cosecha de trigo?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources.response=¡Sigo en ello! La escarcha es muy dura de cortar.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro=Qué bien verte de vuelta. ¿Has encontrado algo para las reservas?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro.response.yes=¡Aquí está el trigo, recién cosechado!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks=Buen trabajo. Esto mantendrá el estómago del pueblo lleno unos días más. ¡Nos vemos!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks.response=¡Me alegra haber ayudado!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello=¡Qué tal! No dejes que el frío se te meta en los huesos.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello.response=¡Genial! ¡Abrigado!

# Cold Taiga - Felix - Winter Warmth
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro=El frío se va asentando esta noche, ¿verdad? Intento mantener a todos calentitos, pero nos está quedando poco combustible para las chimeneas. ¿Podrías recoger unos troncos de abeto para que podamos mantenernos calientes?
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro.response.accept=¡Claro, te ayudo! Lo que sea para mantener al pueblo calentito.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro=¡Oh, has vuelto! ¿Conseguiste encontrar algunos troncos de abeto? El frío se está asentando aquí y mi familia y yo estamos pasando algo de frío.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro.response.yes=¡Aquí están los troncos de abeto!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks=Perfecto. Muchísimas gracias por tu ayuda. De verdad que tienes un corazón muy grande, hace que este lugar se sienta mucho más como un hogar.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks.response=¡Me alegra haber ayudado!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello=¡Hola! Qué bien verte. ¡Espero que tu día haya sido tan maravilloso como tú!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello.response=¡Ey! ¡Abrígate!

# Cold Taiga - Felix - Warmth in the Cold
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro=Gracias por ayudarnos a mantenernos calientes. ¿Te importaría conseguirme algunas Bayas de Nieve, Migas de Corteza de Abeto y Azúcar de Lapislázuli en Polvo?\nSon recursos raros que se encuentran por el Snowy Taiga, pero pueden ser muy valiosos para tu supervivencia.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro.response.accept=¡Las reúno para ti!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro=¿Has encontrado los ingredientes que necesito?\nTodos se encuentran en el Snowy Taiga: las Bayas de Nieve prefieren estar cerca de arbustos de bayas. El Azúcar de Lapislázuli en Polvo se forma en la superficie de los lagos congelados, al disolverse en el agua desde la roca de abajo. Por último, las Migas de Corteza de Abeto son las más difíciles de encontrar, pero deberías poder encontrarlas junto a los abetos.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro.response.yes=¡Deja que te dé lo que tengo!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks=¡Excelente! Ahora bien, he oído que las Bayas de Nieve pueden ser muy útiles en las mazmorras. ¡Restauran tu salud y te dan una capa extra de protección!\n¿Podrías probarlas para mí? Prueba a comer algunas Bayas de Nieve mientras exploras una mazmorra y cuéntame cómo funcionan.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks.response=¡Las pruebo!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress=¿Ya has probado las Bayas de Nieve en una mazmorra? Tengo curiosidad por saber si son tan útiles como creo.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress.response=Todavía no, ¡voy a probarlas!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete=¡Oh, entonces las Bayas de Nieve sí ayudaron en la Mazmorra! ¡Qué bien! Cada vez que como una me parece que me da un cálido abrazo.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete.response=¡De nada!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro=El hielo profundo ha estado moviéndose últimamente y está dejando al descubierto venas de azul que no deberían estar ahí. Necesito lapislázuli para mi investigación. ¿Puedes reunir algo usando distintas herramientas? Quiero ver si el método de extracción cambia la resonancia de la gema.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro.response.accept=¡Claro, te ayudo a investigar!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress=¿Cómo va lo de romper lapislázuli con distintas herramientas? ¿Alguna vibración inusual en la piedra?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress.response=¡Sigo en ello!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro=Excelente. ¿Me das esas gemas de lapislázuli que rompiste con distintas herramientas? Necesito comparar la integridad estructural de cada lote.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro.response.yes=¡Aquí tienes!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks=Gracias. Dame un momento para examinar estas...\n...\nVaya decepción. La estructura cristalina no ha cambiado nada. Son idénticas. Ha sido un enorme desperdicio de tiempo.\nAl menos hemos confirmado que la física simple sigue aplicando aquí y que las herramientas de madera son completamente inútiles a esta profundidad.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_1=Oh, qué fastidio. La ciencia es ensayo y error, ¿no?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_2=Sinceramente, no sé qué esperabas.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello=El hielo cuenta historias si miras lo suficientemente hondo.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello.response=De verdad que sí...

# Cold Taiga - Sigrid - Feather and Grain
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro=La escarcha muerde más hondo esta temporada y con el suelo del cañón temblando como lo hace, debemos cuidarnos los unos a los otros. Sobrevivimos juntos o no sobrevivimos. ¿Puedes ayudarme a preparar buenas reservas para el pueblo?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro.response.accept=¡Me pongo a ello! Nadie debería pasar hambre.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro=¡Oh, has vuelto! Acércate al fuego, cariño, que noto el frío en tus hombros. ¿Cómo va la recolección?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro.response.yes=¡Aquí está la comida que pediste!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks=Que el cielo te bendiga. Esto mantendrá a los pequeños calientes y levantará el ánimo de los mayores. Es el esfuerzo compartido como el tuyo lo que evita que el hielo llegue a nuestros corazones.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks.response=¡Me alegra poder ayudar a la comunidad!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello=¡Hola! Siempre hay un asiento cálido y una palabra amable esperándote aquí.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello.response=¡Hola!


# Cold Taiga - Inga - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.before_unlock=Shiverfield siempre pasa hambre esta época del año. Si buscas algo de comer, habla con Sigrid. Yo tengo las manos llenas aquí.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro=¡Cuidado! No pises ahí. Te rodearán las botas como si llevaras grano en los bolsillos.\n\nEmpecé con unas pocas gallinas. Lo justo para tener los hornos funcionando cuando el hielo aprieta más.\n\n¿Pero últimamente? Es como si el invierno no pudiera tocarlas. La plaga morada se extiende, la gente pasa hambre y mis gallinas se multiplican como si se estuvieran burlando de nosotros.\n\nEstán en todas partes. En los bancos de nieve. En los tejados. Picoteando sacos que no podemos reponer.\n\nNo puedo simplemente... acabar con ellas. Son mías y están vivas. Las crié yo.\n\nPor favor. Habla con Runa en la Guardia de Shiverfield. Ella sabrá qué hacer. Solo necesito una respuesta que no me revuelva el estómago.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_1=Hablaré con ella.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_2=Gallinas tomando el control de un pueblo. Eso es nuevo.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.in_progress=Si las ves por las calles, no las persigas por diversión, ¿vale? Confían en las personas. Esa es la peor parte.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete=Tus manos huelen a plumas.\n\n...No me mientas. Lo veo en tus ojos.\n\nHiciste lo que te dijo Runa, ¿verdad?\n\nLo odio. Odio que tenga sentido.\n\nShiverfield necesita comida. Y flechas. Y el invierno no se preocupa por lo que queremos.\n\nLa próxima vez que me diga a mí misma que puedo protegerlo todo con buenas intenciones, recuérdame esto.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_1=Lo siento. No teníamos otra opción.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_2=Tu bandada estaba alimentando al pueblo de una forma u otra.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_3=Te ayudaré a reconstruir el gallinero para que no vuelva a pasar.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.after_completion=Todavía me gustan las gallinas. Solo me gusta más Shiverfield.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello=Hola.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello.response=¡Hola!

# Cold Taiga - Runa - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro=Inga te mandó. Oí la bandada antes de verte.\n\nMira, no me gusta esto. Nadie aquí lo disfruta.\n\nPero los caminos están peor ahora. Los cazadores no vuelven tan a menudo. La corrupción morada hace que el bosque se sienta extraño, como si las sombras escucharan.\n\nTenemos un pueblo que alimentar y un pueblo que defender de las cosas extrañas que están pasando.\n\nLas gallinas significan carne para los hambrientos y plumas para el arqueo. Sin flechas, los guardias somos una pared de manos vacías.\n\nVas a tener que cosechar diez. Tráeme diez plumas. No desperdiciaremos lo que tomemos.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_1=Entendido. Me encargo yo.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_2=Inga no va a estar contenta.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_3=Me aseguraré de que ayude al pueblo.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.in_progress=Necesitamos reducir un poco más el número de gallinas. Todavía lo están invadiendo todo.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro=¿Tienes esas plumas?\n\nSon muy valiosas para la guardia, ya que servirán para hacer muchas flechas.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_1=Sí, aquí las tienes.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_2=No me gustó matar esas gallinas.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks=Suficientes. Las justas para tener a la guardia abastecida un tiempo.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks.response_1=Bien.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.after_completion=Si puedes mantener a Shiverfield alimentada, la mantienes viva. Ese es el trabajo.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello=Ten cuidado ahí fuera. La guardia puede protegerte cerca, pero en lo profundo de la tundra, es responsabilidad tuya.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello.response=Tendré cuidado.

# Cold Taiga - Kjell - Corrupted Curiosity
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available=¡Cuidado! ¡Estas gallinas se han vuelto locas!\nAlgo les pasa y me están atacando. Un comportamiento muy extraño.\nSoy Kjell. Soy algo así como un científico. Me encantaba estudiar química en el colegio, pero creo que tengo una corazonada sobre lo que está pasando aquí.\n¿Me traes una de esas gallinas corrompidas para que pueda inspeccionarla mejor?
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_1=Vaya, gallinas malvadas. ¡Me pongo a ello!
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_2=Te ayudaré a llegar al fondo de esto.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro=¿Tienes esa gallina corrompida? Tengo muchas ganas de descubrir el origen de esta maldición.\nAh, y hagas lo que hagas, no te la comas. Tiene muy mala pinta y no tiene ningún beneficio.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro.response_yes=Tengo la gallina.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit=¡Genial! ¡La tienes! Echemos un vistazo a ver qué tenemos aquí...\n...\n¿Está viva? ¿Esa cosa morada? No es una roca.\nPues... eso es todo lo que puedo hacer. Dije que era bueno con la química, no con la biología.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_1=¿Viva? Ay, qué mal...
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_2=Supongo que tendremos que seguir investigando
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.hello=Si descubres algo más sobre qué es esa cosa morada, muero por saberlo. ¡No me puedo creer que esté viva!


skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.dungeon_guard.introduce=¡Vaya! ¿He oído bien que has venido a ayudar?\nTenemos un problema enorme en nuestras minas nuevas.\nEstábamos excavando para extraer grandes cantidades de valioso lapislázuli de las reservas bajo los lagos.\n¡Pero nos han desbordado! Hay un montón de monstruos y bichos raros. Parecen querer el lapislázuli para ellos.\n¿Nos ayudas?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro=El calor no es lo único que nos desgasta; los mismos cimientos de este oasis se están desplazando. Necesitamos arenisca para reforzar los anclajes antes de que la arena se trague lo que queda de la superficie. ¿Puedo contar con tu fuerza?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro.response.accept=¡Ayudaré a asegurar los cimientos!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro=Con calma. ¿Conseguiste la arenisca que pedí para los refuerzos?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro.response.yes=¡Aquí tengo los materiales!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks=Esto nos dará algo de tiempo contra el hundimiento. Cada piedra colocada es un escudo contra el inevitable deslizamiento. Gracias.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks.response=Me alegra haber podido ayudar a estabilizar el desierto.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello=Mantén los pies ligeros y los ojos en el horizonte. El desierto nunca para de moverse.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello.response=Estaré alerta, Zahra. Gracias.

# Desert - Unsafe Roads
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro=Las rutas se están volviendo peligrosas; la arena está tragándose las marcas más rápido de lo que podemos ponerlas. ¿Puedes traerme algo de arenisca para reforzar las rutas?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro.response.accept=Te lo traigo.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress=Las dunas están inquietas hoy. ¿Has encontrado suficiente? Tenemos que asegurarnos de tener suficiente para anclar el camino.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress.response=Sigo buscando...
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return=Bien hecho. El equipo informa de que los soportes aguantan. La consciencia es nuestra mejor defensa aquí. Gracias.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return.response=¡Cuando quieras!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello=Ojos arriba. En este desierto, si no rastreas el peligro, el peligro te rastrea a ti.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello.response=¡Ey!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.intro=¿Te mandó Talib? Bien. El suelo es blando aquí y las dunas están avanzando. ¿Traes esa arenisca?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.response=Aquí está.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks=Gracias, esto hará la carretera mucho más firme. Es menos probable que la tierra se deslice con esto en su sitio.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks.response=¡Genial!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello=Un buen día para construir, siempre que el viento no decida llevarse el trabajo.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello.response=Ya lo creo.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.intro=Los temblores están sacudiendo las paredes del paso. Los ladrillos de barro ayudarán a estabilizar el camino. ¿Los tienes?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.response=Sí, aquí están.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks=Perfecto, justo lo que necesitábamos para amortiguar las vibraciones.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks.response=Me alegra haber ayudado.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello=Ten cuidado en los caminos. El desierto tiene la costumbre de abrirse cuando menos te lo esperas.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello.response=Lo tendré en cuenta.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.intro=Sin una base sólida, la arena simplemente se corre. El granito es fundamental para los cimientos. ¿Trajiste?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.response=Tengo granito aquí mismo.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks=¡Es granito de muy buena calidad! Es lo bastante pesado para resistir los temblores. Gracias.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks.response=De nada.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello=El desierto puede ser despiadado con quienes construyen sobre terreno poco firme.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello.response=No me lo cuentes.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.intro=Necesitamos apuntalar los voladizos antes de que se derrumben. ¡Por fin madera para los soportes! ¿Trajiste las tablas de abeto?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.response=Sí, tablas de abeto como pediste.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks=¡Excelente! Ahora tenemos todo reforzado. Ve a avisarle a Talib.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks.response=¡Voy para allá!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello=El trabajo duro es lo único que la arena no puede erosionar.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello.response=Desde luego.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro=Los días se calientan más y las noches son más inciertas. Necesitamos reservas para que el asentamiento no se derrumbe. ¿Me ayudarás a asegurar nuestro futuro?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro.response.accept=Puedo ayudar con eso.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro=Con calma. Cada suministro cuenta cuando las arenas empiezan a moverse. ¿Tienes reservas para el almacén?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_1=Sí, las tengo.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_2=¡Claro! ¡Siempre me alegra ayudar!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.no=¡Oh, lo siento! ¡Ahora mismo no!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks=El trabajo metódico da frutos. Estos suministros nos mantendrán en pie durante las largas noches que vienen. Gracias.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks.response=De nada.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello=El desierto no tiene piedad con los desprevenidos. Cuídate ahí fuera.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello.response=Tú también.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro=Las arenas movedizas están desenterrando cosas que deberían haberse quedado enterradas. Las rutas están llenándose de Zombis y se está haciendo imposible viajar.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro.response.accept=Me encargo de ellos y despejaré el camino.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro=El aire se siente un poco más ligero con esos monstruos fuera. ¿Tienes algo de carne de Zombi para mí? Necesito pruebas de que las dunas son más seguras.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_1=Puaj, carne podrida. Si la quieres, te la doy.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_2=Supongo que puedo ceder unas pocas por la causa.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon=La amenaza nunca desaparece del todo por aquí. Vuelve una vez que hayas limpiado las dunas.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_1=¡Entendido! ¡Va bien!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_2=Los zombis me dan miedo D:
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response=Entendido.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete=Con tu ayuda hemos asegurado este tramo del camino. ¡Somos un equipo muy poderoso!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_1=Me alegra haber ayudado a mantener los caminos abiertos.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_2=¡Totalmente de acuerdo!
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello=El desierto esconde muchos peligros bajo su superficie. Estate alerta.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_1=Hola.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_2=¡Espero que estés bien!
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro=En una tierra que intenta matar todo lo que es suave, solo sobreviven los más resistentes. El cactus es útil: da agua, defensa y pigmento que no se desvanece con este resplandor. Tráeme algunos.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro.response.accept=Me pongo a ello ahora mismo.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro=La arena vuelve a moverse. ¿Tienes el cactus para ayudarnos a fortalecer el perímetro?
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro.response.yes=Aquí está.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks=Esto aguantará cuando otras cosas se marchiten. Es una planta dura para un mundo duro. Gracias.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks.response=¡De nada!
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello=El calor, la arena y el tiempo lo despojan todo menos la verdad. Ah, hola, estaba hablando solo...
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello.response=¡Hola!
skyblock_hub_dialogues.overworld.desert.duneside.azim.hello=Perdona, ahora estoy muy ocupado. Intento construir un aerogenerador. Hay tanta energía que capturar en el viento. No queremos que el desierto se caliente aún más quemando carbón.
skyblock_hub_dialogues.overworld.desert.duneside.todd.hello=¡Ey, qué tal! ¡Soy Todd!\nNo me hagas caso, solo estoy vigilando esta puerta para asegurarme de que ninguna de las criaturas de dentro escape. Este es el túnel de escape de Duneside, pero está lleno de criaturas.\nSi quieres ayudar, Sunny está al fondo del túnel de escape. Me temo que le está costando limpiarlo sola.\nNo puedes pasar por aquí, así que tendrás que encontrar el otro extremo en la parte baja de Duneside.
skyblock_hub_dialogues.overworld.desert.duneside.bashara.hello=No pises la arena más oscura. Creo que hay algo misterioso debajo.
skyblock_hub_dialogues.overworld.desert.duneside.corvin.hello=No recuerdo haber visto estas piedras aquí. Espero de verdad que el techo no se esté derrumbando.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello=La sed nos hace sufrir. Vendo algo que ayuda, aunque todo el mundo lo odie.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_1=¿La gente lo odia?
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_2=¡Un placer! Yo solo estoy de paso.
skyblock_hub_dialogues.overworld.desert.duneside.derya.detail_1=Vendo agua de cactus. No es agua normal. Es un poco más dulce, supongo.\nTodo el mundo le tiene miedo porque no se me da muy bien quitar las espinas del cactus.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello=Extiende la mano. Te puedo leer el futuro...
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_1=Bueno. Léeme el futuro.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_2=No, gracias.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1=Veo tres formas.\nUn cactus. Una puerta. Y un zombi muy enfadado.\nAsí que supongo que tu futuro incluye todo eso.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_1=¿Una puerta?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_2=¿Un zombi enfadado?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_3=Esto no tiene ningún sentido.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_doorway=Por desgracia no puedo leer más. Solo vi una puerta en mi visión. Quizás se convierta en una puerta muy importante para ti.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_zombie=¡Jaja! Claramente vas a enfadar a un zombi en el futuro.\nNunca había visto a un zombi mostrar ningún tipo de emoción, así que debes de irritarle muchísimo.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_nonsense=Pues claro.\nEl sinsentido es más ligero de llevar que la certeza. Solo estoy aquí para levantar la moral a la gente de alrededor.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello=Ugh, la arena sabe asquerosa. No para de metérseme en la boca.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello.response_1=¿Por qué estás tan cerca de la arena?
skyblock_hub_dialogues.overworld.desert.duneside.vesper.detail_1=¡Tengo sitios a los que llegar! No voy a dejar que la arena se interponga en mi camino.
skyblock_hub_dialogues.npc_name.devin=Devin
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello=Los desarrolladores de este juego dicen que es difícil seguir inventando tantos diálogos para diferentes NPCs, así que simplemente copiaron y pegaron algunos de ellos.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_1=Qué vagos.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_2=Yo no lo he notado. Estaré atento.
skyblock_hub_dialogues.overworld.desert.duneside.dungeon_guard.introduce=¡Ey! ¡No me lo puedo creer! ¡El túnel de escape de Duneside ha sido tomado por criaturas malvadas!\nEl túnel de escape es fundamental para nuestra supervivencia. Muchas tormentas de arena intensas entierran la entrada principal de Duneside y el túnel de escape es nuestro único respaldo.\nMe han autorizado a usar un viejo sistema nuestro para inundar el túnel con Lava y así esterilizarlo. Me quedo sin aliento solo de bajar hasta aquí, así que no creo que sea una buena idea para mí hacerlo.\n¿Te atreves tú?

# NPC Names
skyblock_hub_dialogues.npc_name.alder=Alder
skyblock_hub_dialogues.npc_name.thorne=Thorne
skyblock_hub_dialogues.npc_name.bram=Bram

# Alder Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.before_unlock=Día ocupado. Árboles que cuidar, madera que procesar. Vuelve más tarde si necesitas algo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available=Tú ayudaste a Ronan a reparar los daños de esos temblores, ¿verdad? Buen trabajo. Pero no podemos seguir reparando grietas cada vez que el suelo decide moverse. He estado pensando... los viejos robles han aguantado cosas peores. Sus raíces se extienden mucho y se flexionan con la tierra. Quizás podamos aprender de ellos. ¿Me ayudas a probar algo?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.what_thinking=¿Qué estás pensando?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.got_time=Tengo tiempo. ¿Qué necesitas?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.not_now=Ahora mismo no, lo siento.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation=Bram y yo hemos estado hablando de cimientos flexibles: estructuras que se muevan *con* el suelo en vez de agrietarse contra él. El bosque ya hace esto. Cada vez que el viento golpea el dosel, las raíces absorben el estrés. Si podemos replicar ese principio... bueno, la próxima vez que algo tiemble, quizás los edificios se doblen en vez de romperse.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.how_help=¿Cómo puedo ayudar?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.complicated=Suena complicado.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.think_about=Lo pensaré.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response=Es más sencillo de lo que crees. La naturaleza ya ha resuelto el problema. Solo necesitamos observar y adaptarnos. Empieza por fijarte en el Roble Antiguo; sus raíces llevan décadas aguantando firmes. Ahí está la respuesta.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.im_in=Bueno, me apunto.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.come_back=Déjame volver a esto.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions=Perfecto. Hay alguien con quien deberías hablar primero: Thorne. Es un investigador de árboles que lleva semanas estudiando el Roble Antiguo. Ha montado su campamento cerca. Si alguien entiende cómo esas raíces se mantienen estables durante los temblores, es él. Ve a encontrar a Thorne y ve qué ha aprendido.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions.response.find_him=Lo encontraré.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active=Thorne sigue en el Roble Antiguo estudiando esos sistemas de raíces. Ve a hablar con él; lo explicará mejor que yo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active.response.on_way=Voy para allá.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return=Has vuelto. ¿Qué viste?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.roots_web=Las raíces se extienden por todas partes como una red.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.big_tree=Es solo un árbol grande.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.correct_observation=Exacto. Una red. Cada raíz sostiene a las demás. Cuando el suelo se desplaza, toda la red se flexiona junta: ningún punto de fallo único. Eso es lo que necesitan los edificios. No bloques rígidos que se agrieten bajo presión, sino soportes interconectados que distribuyan el estrés. Bram puede diseñar la estructura de celosía, pero necesitaremos materiales. Muchos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.playful_correction=Míralo más de cerca la próxima vez. Ese simple "árbol grande" ha sobrevivido siglos siendo más inteligente que nosotros. Sus raíces se extienden amplia y profundamente; cuando el suelo se mueve, toda la red se flexiona. Ese es el secreto. De todas formas, ya viste suficiente. Ahora necesitamos materiales para construir algo similar.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions=Esto es lo que necesitamos: Primero, reúne brotes de roble. No los plantados, los naturales. Quiero estudiar sus patrones de raíces tempranas y usarlos como amortiguadores vivos alrededor de las estructuras clave. Mientras haces eso, también necesitaremos componentes elaborados. Bram necesitará losas de roble. Distribuyen el peso mejor que los bloques enteros. Y vallas de roble. Crearán soportes de celosía flexibles, como raíces entrelazándose. Puedes trabajar en todo esto a tu ritmo. Vuelve cuando tengas los brotes y entrega las piezas elaboradas a Bram.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.got_it=Entendido. Brotes, losas, vallas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.why_saplings=Espera, ¿por qué brotes?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.lot_crafting=Eso es mucho que elaborar.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_explanation=Los árboles jóvenes se adaptan más rápido. Si los plantamos cerca de los cimientos, sus raíces crecerán de forma natural en la red de soportes. Además, estudiar su crecimiento temprano nos dice cómo dar forma a las celosías de madera. Estructuras vivas y construidas trabajando juntas: ese es el objetivo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.workload_acknowledgment=Lo es. Pero si queremos que esto funcione, hay que hacerlo bien. Tómate tu tiempo. El bosque no tiene prisa, y tú tampoco deberías tenerla.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check=¿Cómo va la recolección? Necesito esos dieciséis brotes de roble cuando puedas. Y no te olvides de que Bram está esperando las losas y las vallas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.working_on_it=Sigo en ello.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.remind_me=¿Me recuerdas qué necesitabas?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.requirements_reminder=Dieciséis brotes de roble para mí. Sesenta y cuatro losas de roble y treinta y dos vallas de roble para Bram. Todo de madera de roble.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered=¡Tienes los brotes! Déjame verlos. *(los examina)* Buenos ejemplares, con sistemas de raíces sanas empezando a formarse. Se integrarán perfectamente con los soportes de celosía una vez que Bram termine la construcción. Excelente trabajo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.what_do=¿Qué harás con ellos?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.happy_help=Me alegra haber podido ayudar.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.planting_strategy=Los plantaré estratégicamente alrededor de los perímetros de los edificios. A medida que crezcan, sus raíces crearán refuerzos naturales: cimientos vivos que se flexionan con el suelo. Combinado con los soportes de madera de Bram, tendremos un sistema híbrido. Lo mejor de los dos mundos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram=Los brotes son perfectos. Ahora solo necesitamos que Bram consiga sus materiales. ¿Ya le has entregado las losas y las vallas?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.working=Estoy en ello.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.not_yet=Todavía no.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete=Has hecho todo lo que pedimos y más. Bram ya ha empezado a montar la estructura de celosía y yo he plantado los brotes alrededor de las estructuras críticas. Cuando llegue el próximo temblor, y llegará, este pueblo no solo se mantendrá unido. Se adaptará. Has ayudado a construir algo que aprende, algo que dura. El bosque provee, pero tú te aseguraste de que lo escucháramos. Gracias.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.will_work=¿Funcionará de verdad?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.glad_help=Me alegra haber podido ayudar.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.another_tremor=¿Qué pasa si hay otro temblor?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.confidence=Creo que sí. Los principios son sólidos; la naturaleza los usa desde hace milenios. La artesanía de Bram es de fiar. Y nos has dado exactamente lo que necesitábamos. Si el suelo vuelve a temblar, estaremos listos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_readiness=Entonces veremos si nuestra ingeniería aguanta. Pero aunque no lo haga, habremos aprendido algo. Así funciona el progreso: observar, adaptarse, mejorar. El bosque lo enseña cada temporada.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion=Los cimientos flexibles aguantan bien hasta ahora. Todavía no ha habido temblores, pero cuando lleguen, estaremos listos. Sigo cuidando los brotes; van creciendo bien. Gracias de nuevo por tu ayuda.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.good_hear=Me alegra oírlo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.other_projects=¿Tienes otros proyectos?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_projects=Siempre hay algo que mejorar. Pero por ahora me centro en esto. El bosque provee; yo solo lo ayudo.

# Thorne Dialogues
skyblock_hub_dialogues.overworld.oak_forest.thorne.before_quest=¡Oh! Hola. Soy Thorne, dendrocronólogo. En términos más sencillos, investigador de la edad de los árboles. Llevo documentando la arquitectura de raíces del Roble Antiguo. Un ejemplar fascinante. ¡Llevo casi tres semanas aquí y sigo encontrando nuevos patrones de ramificación!
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction=¿Alder te mandó? ¡Excelente! Me pidió que explicara mis hallazgos, ¿verdad? Pues has venido al lugar correcto. Este roble *(señala el enorme árbol)* tiene más de 300 años y su sistema de raíces es absolutamente extraordinario. ¿Ves cómo las raíces se extienden hacia afuera en esta celosía entrelazada? Cada raíz principal se ramifica en secundarias, que se ramifican en terciarias... crea redundancia. Si una sección se daña o sufre estrés, la carga se distribuye por toda la red. Durante el temblor de la semana pasada, vi el suelo desplazarse y se podía *ver* cómo las raíces se flexionaban, absorbiendo el movimiento. El árbol apenas se movió. Ese es el secreto: flexibilidad más interconexión igual a estabilidad.
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.roots_web=¿Entonces las raíces funcionan como una red?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.help_buildings=¿Cómo ayuda eso a los edificios?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.incredible=Es increíble.
skyblock_hub_dialogues.overworld.oak_forest.thorne.web_confirmation=¡Exactamente! Una red tridimensional que se mueve como un solo organismo. Sin punto de fallo único. Si Alder y Bram pueden replicar ese principio con soportes de madera, los edificios sobrevivirán los temblores mucho mejor que unos cimientos de piedra rígidos. La naturaleza lleva millones de años perfeccionando este diseño; nosotros solo tomamos prestado el plano.
skyblock_hub_dialogues.overworld.oak_forest.thorne.buildings_explanation=¡Ah! Ahí es donde entra el ingenio de Alder. Quiere construir estructuras de soporte que imiten esta red de raíces: celosías de madera interconectadas que puedan flexionarse bajo el estrés en vez de agrietarse. Añade brotes vivos alrededor del perímetro y, a medida que crezcan, sus raíces reales se integrarán con las estructuras construidas. Ingeniería híbrida. Es genial, de verdad.
skyblock_hub_dialogues.overworld.oak_forest.thorne.enthusiastic_response=¿Verdad? Podría estudiar este árbol durante años y seguir aprendiendo algo nuevo cada día. Pero Alder necesita aplicaciones prácticas, no solo observaciones académicas. Ve a contarle lo que has visto: la estructura de red, la flexibilidad, la distribución de carga. Él sabrá qué hacer con esa información.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1=¿Le resultaron útiles mis observaciones a Alder? Espero que sí. Los árboles tienen mucho que enseñarnos sobre la resiliencia y la adaptación.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.working_on_it=Está trabajando en ello.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.what_else=¿Qué más has aprendido?
skyblock_hub_dialogues.overworld.oak_forest.thorne.other_learnings=Oh, ¿por dónde empiezo? Los patrones de anillos de crecimiento sugieren que esta zona experimentó una actividad sísmica significativa hace unos 80 años, mucho peor que el temblor de la semana pasada. Aun así, el árbol sobrevivió. También he estado rastreando redes de hongos en el suelo; conectan varios árboles subterráneamente, compartiendo nutrientes e información. El bosque está mucho más interconectado de lo que la mayoría de la gente se da cuenta.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion=¡Me enteré de que Alder y Bram terminaron los cimientos flexibles! Usar mi investigación de raíces para la ingeniería práctica... me siento honrado. El bosque de verdad que provee, ¿no?
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.thanks=Gracias por tu ayuda.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.studying_now=¿Qué estudias ahora?
skyblock_hub_dialogues.overworld.oak_forest.thorne.acknowledge_thanks=¡El placer es mío! Es raro que mi investigación tenga aplicaciones prácticas inmediatas en el mundo real. Normalmente solo publico artículos que leen otros tres dendrocronólogos. Esto fue... refrescante.
skyblock_hub_dialogues.overworld.oak_forest.thorne.current_research=Ahora examino patrones de erosión de la corteza. Intento correlacionarlos con datos históricos del tiempo. No tan emocionante como los sistemas de raíces a prueba de terremotos, lo admito, pero sigue siendo valioso para entender la historia del bosque.

# Bram Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.before_quest=Trabajando. Vuelve si Alder te manda.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.quest_accepted=¿Alder te habló de mí? Bien. Avísame cuando tengas los materiales listos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages=Alder me habló del plan de cimientos flexibles. Buena idea. Me encargo de la construcción de la celosía, pero necesito materiales precisos. Sesenta y cuatro losas de roble y treinta y dos vallas de roble. Las losas distribuyen el peso sin agrietarse. Las vallas crean soportes entrelazados. Tráelos cuando estés listo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.get_crafted=Los elaboro ahora.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_slabs=¿Por qué losas y no bloques enteros?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_fences=¿Por qué vallas?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.slabs_explanation=Los bloques enteros son rígidos. Lo rígido se rompe. Las losas son más delgadas; se comprimen ligeramente bajo el estrés y luego vuelven. Flexibilidad sin fallos. Eso es lo que necesitamos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_explanation=Las vallas se entrelazan. Un poste conecta con el siguiente. Cuando la fuerza golpea la red, se distribuye por todos los puntos de conexión. Ninguna pieza aguanta toda la carga sola. Mismo principio que las raíces de los árboles. Solo que madera en vez de tierra.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials=Todavía necesito esas losas y vallas. Tómate tu tiempo. Prefiero esperar por calidad que apresurar un trabajo malo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.almost_done=Casi listo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.remind=¿Me recuerdas qué necesitabas?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.requirements_reminder=Sesenta y cuatro losas de roble. Treinta y dos vallas de roble. Todo de roble.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.still_need_fences=Todavía necesito las vallas. Tráelas y podremos empezar a construir.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered=Vallas. *(prueba una)* Uniones sólidas. Estas formarán la celosía. Buen trabajo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.everything=¿Tienes ya todo lo que necesitas?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.thanks=Gracias.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.have_everything=Con las losas y las vallas, sí. Alder se encarga de los brotes. Yo me encargo de la construcción. Vuelve a hablar con Alder cuando estés listo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_alder=Los materiales están. Estoy empezando el montaje. Habla con Alder; querrá finalizar el plan.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion=La celosía está instalada. Los cimientos aguantan. El trabajo bien hecho dura.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.good=Me alegra oírlo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.hold_tremor=¿Crees que aguantará un temblor?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.confident=Lo construí bien. Usé los materiales correctos. Aguantará.

# Ring The Bell
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.ring_the_bell.investigate=Le das un tirón firme a la campana. Suena brillante y limpia.\nCampana de día. Silencio de día.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.hello=La campana cuelga quieta.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.locked=Lo siento, no puedo hacer el "discurso de bienvenida".\nSi Cubit todavía no te ha enseñado la plaza, empieza por ahí.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.in_progress=Prueba la campana de la plaza, luego pregúntale a Levi, Sandy, Liora y Lee si han oído algo de noche.\nLuego vuelve a verme.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello=Ey.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available=Ey. Eres la cara nueva que Cubit ha estado paseando, ¿verdad? Bien. Así tendrás los oídos frescos.\nOye... ¿Has oído la campana de noche?\nNo el tañido de día. No el tipo alegre. Me refiero al tipo que te revuelve el estómago.\nSigo despertándome con él. Y cuando salgo corriendo... nada.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.bell_at_night=¿La campana del pueblo? ¿De noche?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.dream=¿Quizás fue un sueño?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.what_do=¿Qué necesitas que haga?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request=Ve a la plaza y prueba la campana. Luego pregúntale a algunas personas si han oído algo raro después de que oscurezca.\nLevi y Sandy estaban con Cubit cuando llegaste, ¿verdad? Empieza por ellos. Y habla también con Liora y Lee.\nSi nadie más lo ha oído... entonces el problema soy yo. Pero necesito saberlo.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.on_it=Bueno. Preguntaré por ahí.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.why_me=¿Por qué me lo preguntas a mí?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.are_you_ok=¿Estás bien?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.why_you=Porque no me debes una mentira amable.\nLa gente que te conoce intentará ser amable. La que no te conoce simplemente te dice lo que oyó.\nY yo necesito la verdad.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.are_you_ok=Estoy... tirando.\nVe a escuchar por ti mismo. Si me equivoco, quiero equivocarme a propósito, no por accidente.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete=Entonces. Nadie la oyó.\nEso es... un alivio. Y también no.\nLa próxima vez que pase, intentaré recordar esta sensación. Que ahí afuera puede haber silencio, aunque mi cabeza haga ruido.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.not_alone=No estás solo en esto.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.something_else=Quizás es otra cosa, no la campana.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.tell_me=Si vuelve a pasar, cuéntamelo.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_not_alone=...Gracias. No siempre recuerdo que puedo pedir ayuda.\nLo estoy intentando.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_something_else=Puede que sí.\nA veces el sonido viaja raro a través de la madera. A través de las raíces.\nA veces oyes algo real, solo que no donde crees.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_tell_me=Lo haré.\nY si vuelvo a salir corriendo en medio de la noche... al menos tendré una razón además del pánico.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello.after_ring_the_bell=Ey. Gracias de nuevo por comprobarlo.\nSi la campana suena de verdad algún día, probablemente serás el primero en saberlo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked=¿La campana de noche...? Mmm.\nDe noche oigo muchas cosas.\nMi manta. Mi estómago. El viento.\nUna vez oí a una galleta llamándome por mi nombre. Resultó ser... yo. Llamando a la galleta.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.no=¿Entonces no la has oído?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.worried=Chris está preocupado. ¿Se te ocurre algo?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.nope=No. Si la campana sonara de noche, me despertaría.\nA menos que fuera muy educada. Entonces probablemente dormiría a través de ella.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.idea=A veces los sonidos rebotan.\nComo... ya sabes cuando golpeas una taza y sigue cantando.\nLa madera también hace eso.\nDile a Chris que beba agua. Y que eche una siesta.\nLas siestas lo arreglan casi todo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked=¿La campana? ¡Me encanta la campana!\n¿Pero de noche? No.\nSi sonara, estaría fuera inmediatamente: '¿QUIÉN DA UNA FIESTA?'\nDe noche solo hay grillos y Levi roncando.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.weird=¿Entonces no has oído nada raro?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.chris=Chris sigue despertándose con ella.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.nothing=Nada que suene a campana. A veces oigo un pequeño *tic tic* como bellotas golpeando el tejado.\nPuede sonar más agudo de lo que debería.\nQuizás Chris tiene un problema de bellotas.\nO un problema de tejado.\n¡O un problema de tejado con bellotas!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.concern=Ay, pobre Chris.\nEs del tipo de personas que oye un sonido raro e inmediatamente intenta cargarlo por todos.\nDile que el pueblo está tranquilo. Y que yo lo acompañaré a casa si se asusta.\nEn realidad no. Él me acompañará a casa a mí. Me distraigo.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked=La campana es honesta.\nSuena cuando manos la jalan, y cuando el viento la sacude.\nPero el bosque puede hacer su propia música.\nLas raíces se desplazan. Las ramas se asientan. La madera vieja suspira.\nSi Chris oye un tañido que nadie más oye... puede ser que esté escuchando demasiado.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.no=¿Entonces tú tampoco la oíste?
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.what_sound=¿Alguna idea de qué podría sonar como una campana?
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.no=No. La campana no.\nPero sí oigo al pueblo asentarse de noche.\nComo una casa respirando. Como el suelo exhalando.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.what_sound=Las bellotas pueden hacerlo.\nDos cáscaras golpeando en el ritmo correcto. Una sola rodando por un canalón.\nLos sonidos pequeños se vuelven agudos cuando tienes miedo.\nDile a Chris que el miedo da un oído excelente y conclusiones terribles.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked=¿De noche? Ninguna campana.\nY estoy bastante seguro de eso.\nCuando la campana suena, los animales reaccionan. Los perros se ponen alerta. Los pájaros se asustan. Hasta los gatos detienen sus pequeñas conspiraciones.\nSi la campana sonara y nadie lo notara, tendríamos un pueblo lleno de la fauna más tranquila del mundo.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.imagining=¿Entonces crees que Chris se lo imagina?
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.notice=¿Qué has notado tú de noche?
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.imagining=Creo que Chris está cansado.\nY un cerebro cansado teje tonterías en forma de patrones.\nNo significa que lo esté inventando a propósito.\nSolo significa que necesita dormir más que respuestas.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.notice=Búhos. Viento. El tipo de silencio que hace que oigas tus propios pasos.\nA veces captas un zumbido si te quedas lo suficientemente cerca de madera vieja.\nNo una campana. Más como... el recuerdo de una.
skyblock_hub_dialogues.overworld.oak_forest.liora.hello=Saludos, caminante. Los viejos robles susurran tu llegada, y sus voces me dan consuelo en este vasto bosque. ¿Qué te trae a escuchar con nosotros?
skyblock_hub_dialogues.overworld.oak_forest.lee.hello=Ey, te vi zigzaguear entre la maleza. Las ardillas no paraban de parlotear sobre ello. ¿Todo bien ahí fuera en el bosque?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro=Si tienes un momento, ¿podrías ayudarme a reponer existencias? Los constructores están trabajando todo el día y una olla vacía no le hace bien a nadie.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.ill_bring=Te traeré algo de sopa.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.why=¿Por qué sopa de remolacha?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.accepted=Gracias. Necesito dieciséis boles para que la cola siga moviéndose.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup=Fácil de hacer en grandes cantidades, fácil de transportar y te calienta por dentro. Lo simple es bueno cuando tienes que alimentar a todo un asentamiento.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup.response.ill_bring=Te traeré algo de sopa.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro=¿Algún resultado? Necesito dieciséis boles para que la cola siga moviéndose.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro.response.yes=Aquí tienes.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks=Perfecto. Esto mantendrá a todos en marcha. Gracias. Vuelve cuando quieras un bol caliente.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks.response=Me alegra haber ayudado.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.hello=Hola. ¿Quieres un bol caliente?

# Hungry Hands (Potato Towers)
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available=Para. Potato Towers no es un mercado. Es un muro con una despensa detrás. Y últimamente, la despensa ha adquirido patas.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.zombies=¿Zombis otra vez?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.accept=Si alguien está robando, lo encontraré.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.decline=No es mi problema.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.zombies_clarification=Si fueran zombis, estaría contento. Los zombis no discuten. No lloran. No te miran a los ojos y te preguntan por qué tú tienes patatas y ellos no.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation=Me pusieron a defender este lugar de los muertos. Ese era el trato. Pero los vivos siguen poniendo a prueba las puertas. Manos hambrientas, pies rápidos y una docena de excusas. Necesito que encuentres a quien lo hace y me traigas algo sólido. Nombres. Un patrón. Alguien a quien escuchen.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.start=¿Por dónde empiezo?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.handle=Me encargo yo.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.starting_point=El callejón detrás de las tiendas. Tres caras siguen apareciendo cerca de los carros: Tess, Joss y Perrin. Habla con ellos. Descubrirás quién está tirando de los hilos.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check=Si vas a parar un robo, hazlo con hechos. Habla con Tess, Joss y Perrin. Luego vuelve.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.on_it=Estoy en ello.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.remind=Recuérdame a quién busco.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.reminder=Tess, Joss y Perrin. Tres nombres. Una historia. Tráeme la verdad.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution=Acabo de hablar con Ceryn. No es un criminal. Tampoco un santo. Solo alguien en quien la gente confía.\nRobar está mal. No voy a fingir lo contrario.\nPero no entendía cuánto habían empeorado las cosas ahí fuera. La sombra de Pumpkingdom llega más lejos que nuestras puertas.\nAsí que esto es lo que va a pasar. Las puertas permanecen cerradas. Pero me costará más notar un saco que no es mío. Y voy a empujar para que haya raciones adecuadas que no requieran esconderse.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.fair=Eso... es justo.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.open=¿Por qué no abrir las puertas?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.sooner=Podrías haberlo hecho antes.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.why_not_open=Las puertas abiertas invitan a algo más que hambre. Invitan al pánico. Y a zombis. Puedo mantener una línea, pero no puedo contener una estampida.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.admission=Sí. Y debería haber hecho preguntas antes de empezar a contar patatas que faltaban como si fueran flechas en una aljaba. Estoy aprendiendo.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.after_completion=Si ves a alguien mirando un carro demasiado rato, no asumas que es un ladrón. A veces solo están calculando si la comida vale la vergüenza.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first=Si Garran te mandó, puedes dejar de fulminarte con la mirada. Sé cómo parece esto.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.stealing=¿Estás robando de Potato Towers?
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.hurt=No estoy aquí para hacerte daño.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.started=Cuéntame quién empezó todo esto.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.direct_question=Robo tiempo. Robo calor. Robo un momento en que mi estómago no grita. Las patatas son solo la forma que toma.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hint=Si quieres a quien la gente escucha, busca a Ceryn. No un jefe. Una brújula. Acampado fuera del camino donde las torres dejan de dar sombra.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first=¿Vas a arrastrarme de vuelta a la puerta? Bien. Hazlo. Al menos dentro de los muros hay luz.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.why=¿Por qué robar de aquí?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.behind=¿Quién está detrás de todo esto?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.truth=Puedo ayudarte si me dices la verdad.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.contrast=Porque aquí el aire huele a comida cocinada. Cerca de Pumpkingdom huele a piedra húmeda y cosas muertas. La gente no roba porque sea divertido. Roba porque está cerca.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hint=Ceryn. Eso es a quien quieres. No damos un paso sin preguntarnos qué haría Ceryn. Sobre todo porque Ceryn piensa antes de moverse.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first=Si venías por patatas, llegaste tarde. Las pocas migajas de comida que teníamos se han acabado ya.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.following=Busco a quien sigues.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.stop=Para de robar.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stop_response=¿Y luego qué? ¿Dejo de tener hambre porque dijiste una frase? Hacemos lo que tenemos que hacer para sobrevivir. Habla con Ceryn si quieres saber más.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hint=Encuentra a Ceryn en el campamento. A Ceryn también le molesta el robo. Dice que nos hace más pequeños. Pero Ceryn también se niega a dejar que la gente se muera de hambre.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first=Garran cree que soy un líder. No lo soy. Solo soy el que la gente mira cuando está a punto de hacer algo de lo que no podrá volver atrás.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.reason=Dicen que tú eres la razón por la que roban.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.starving=Potato Towers tiene de sobra. Vosotros os morís de hambre.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.escort=Ven conmigo. Habla con Garran.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.framing=Roban porque tienen hambre. Potato Towers tiene una montaña de patatas y un foso de normas. Eso no es justicia. Pero el robo sigue siendo robo.\nCamina conmigo. Se lo diré a la cara. Si Garran quiere llamarlo un delito, bien. Pero quiero que entienda qué está defendiendo.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.escort_start=Hablemos con Garran. Ven conmigo. Quiero una conversación, no un motín.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hello=Si has venido a acusarme, ahórrate el aliento. Hago lo que debo para sobrevivir.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hello=¿Te has perdido? No puedo ofrecer muchas raciones, por desgracia.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hello=Ten cuidado por aquí. La gente no es amable cuando tiene hambre.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello_before_quest=Hola. ¿Tú también tienes hambre?\nEstamos trabajando juntos para ver qué raciones podemos sacar de Potato Towers. Es lo que hay que hacer para sobrevivir.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello=Yo y los guardias nos llevamos mejor. Salimos adelante ahora, gracias a tu ayuda.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available=Estamos organizando una comida compartida para los civiles de Pumpkingdom. Después del derrumbe, una mesa caliente significa más que una celebración.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.whats_wrong=¿Por qué estás tan tenso?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.need_help=¿Qué necesitas de mí?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.later=Vuelvo más tarde.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation=Pumpkingdom no ha sido lo mismo desde que cayó. Algunos perdieron sus casas. Otros, sus cocinas. Se puede reconstruir piedra, pero el hambre hace que la gente desaparezca en silencio.\nRhea y yo vamos a mantenerlo simple esta noche: algo que llene, nada que se desperdicie y suficiente reservado para que la Plains no lo note mañana.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.what_do_you_need=De acuerdo. ¿Qué necesitas de mí?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.wasting_food=¿Por qué ayudar a Pumpkingdom?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup=Porque siguen siendo nuestros vecinos. Y porque lo más duro después de un derrumbe no son los escombros, sino las semanas en que dejas de esperar que te alimenten.\nPodemos darles una buena noche sin convertir la despensa de la Plains en una promesa que no podemos cumplir.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup.response.tell_me=Justo. ¿Cuál es el plan?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.what_i_need=Habla primero con Rhea. Ella decide qué va a la gente y qué guardamos para después. La encuentras arriba.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions=Habla con Rhea antes de recoger nada. Ella coordina la cena de esta noche.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.on_it=Estoy en ello.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.remind=Recuérdame.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions_reminder=Encuentra a Rhea arriba. Consigue la lista. Síguelas al pie de la letra.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder=¿Has tenido suerte reuniendo suministros para la cena de Pumpkingdom?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.deposit_potatoes=Tengo patatas para guardar para después.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.working=Sigo en ello.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.potatoes_delivered=Bien. Llevaré estas patatas al almacén.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report=Esa era la última pieza que nos faltaba. Pumpkingdom va a comer y la Plains va a estar bien abastecida un tiempo. Gracias.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.good=Me alegra haber podido ayudar.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.close=No me daba cuenta de lo ajustado que está todo.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.close_followup=La mayoría no lo sabe. Por eso trabajo tan de cerca con Rhea para mantener comida almacenada para las temporadas más duras.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.after_completion=Si ves a alguien de Pumpkingdom con cara de perdido, indícale la mesa. Que tenga un plato lleno.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.before_quest_started=Si estás aquí por la cena de Pumpkingdom, no merodees. O traes algo a la mesa o quítate de en medio. Si estás aquí para trabajar, habla con Nolan.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro=Nolan te mandó. Bien.\nEsta noche alimentamos a los civiles de Pumpkingdom. Desde el derrumbe, algunos de ellos viven de lo que pueden intercambiar, rebuscar o estirar. Les damos una buena comida sin poner en riesgo las raciones de la Plains.\nTrae patatas a Nolan para guardar para después. Tráeme a mí 64 calabazas para la cena de esta noche.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.why_pumpkins=¿Por qué calabazas para la cena?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.who_wasting=¿De verdad están tan mal?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.got_it=Entendido. Vuelvo enseguida.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.why_pumpkins_followup=Ahora mismo es temporada de calabazas y el suministro va bien. No duran mucho y son bastante estacionales.\nLas patatas se guardan más tiempo, así que es mejor reservarlas para comidas posteriores.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.who_wasting_followup=Sí. El derrumbe hace eso. Cuando una ciudad se rompe, los hornos se enfrían primero.\nNo lo dicen en voz alta, pero se nota: gente que come demasiado rápido, guardando migajas, fingiendo que no tiene hambre. Les vamos a dar una noche en que puedan dejar de contar bocados.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder=¿Tienes los suministros de calabazas para la cena de esta noche?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.deposit_pumpkins=Tengo calabazas para la cena.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.on_it=Estoy en ello.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.pumpkins_delivered=Perfecto. Esto hará una cena perfecta esta noche.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.after_completion=Si esta noche escuchas risas, tú ayudaste a hacerlas posibles.\nNuestro almacén está lleno y la gente va a comer.\nSiéntete orgulloso.

# Non-Quest NPCs
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello=Soy carpintero. Construyo sillas que no se derrumban durante los temblores. En su mayoría.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_1=¿En su mayoría?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_2=¿Tienes algún chiste de carpintero?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_1=Si el suelo tiembla, los muebles tienen que seguir el ritmo. "En su mayoría" significa que he perdido exactamente una batalla contra la gravedad.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_2=Intenté hacer un cinturón de corteza de roble. Fue una pérdida de cintura.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello=¿Lo notas? Los árboles están zumbando. O viene un temblor o el bosque está cotilleando otra vez.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_1=¿El bosque cotillea?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_2=¿Cómo te mantienes tranquilo?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_3=Te dejo con lo tuyo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_1=El viento entre los árboles del bosque susurra. Estoy convencido de que me habla, pero quizás son los nervios. Ayer me convencí de que dijo "perdí el juego"...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_2=Le pongo nombre a cada crujido. Es más difícil tenerle miedo a algo que se llama Gerald.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello=¿Soy yo, o las bellotas de aquí parecen tener poderes mágicos?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello.response_1=¿Magia?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.detail_1=Sí. ¿Es que no las has visto? Algunas están rezumando esa cosa morada.\nNo tengo ni idea de qué es eso. Si me preguntas, no es buena señal.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello=No tengo miedo a las arañas. Solo respeto sus opiniones de ocho patas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_1=¿Qué opiniones?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_2=O sea, que sí tienes miedo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_3=¿Algún consejo para la mina?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_1=Las arañas hacen lo que quieren. No te tienen miedo. Puedes encontrar soluciones a las arañas en la web.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2=No tengo miedo. Soy estratégico. Prefiero estar vivo sin tener que enfrentarme a esas criaturas horribles.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2.response_1=No te preocupes. Yo también tengo miedo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello=Si oyes sonar la campana, o hay peligro cerca o estoy aburrida. Es cincuenta y cincuenta.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_1=Por favor, deja de tocarla.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_2=¿Qué significa cuando suena dos veces?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_3=Tócala. Me gusta el caos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_1=Lo intenté. La campana me llamó. En voz alta. Además, el silencio de aquí parece que está esperando algo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_2=Significa que olvidé que ya la había tocado una vez. Soy constante, no precisa.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello=Si te quedas quieto el tiempo suficiente, el frío INTENTARÁ adoptarte. NO lo dejes.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_1=¿Cómo lo evito?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_2=¿El frío adopta a la gente?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_3=Me gusta el frío.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_1=Muévete. Abrígate. NUNCA salgas mal vestido. Estos entornos no perdonan.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_2=Sí. Hay tantas condiciones implacables ahí fuera. El frío se lleva a quien quiere. Solo podemos abrigarnos bien para ayudar a ralentizar sus efectos.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello=Aquí hace mucho frío y no se puede salir mucho. Cuento copos de nieve para pasar el tiempo.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_1=¿Cuántos llevas?
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_2=Eso suena agotador.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_1=La última vez llegué a 314 copos. Habría seguido, pero se terminó de cocer mi Tarta de Bayas de Nieve y tenía que ir a comerla.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_2=Igual que el invierno. Nos equiparamos en energías.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello=Hago punto. Bufandas, manoplas, apoyo moral. Si tienes un problema, probablemente pueda convertirlo en un sombrero.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_1=¿Convertir qué en un sombrero?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_2=¿Me puedes hacer una bufanda?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_1=Cualquier cosa. Depende de cómo lo veas.\nToma ese problema, dale un giro positivo y lúcelo con orgullo. Ya es un sombrero.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_2=Solo si prometes ponértela dramáticamente. Agítala como un héroe en una tormenta de nieve.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello=Hice una lista de cosas que no son lobos. Ayuda de noche.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_1=¿Qué hay en la lista?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_2=¿Y los lobos de verdad?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_3=¿Por qué hacer una lista?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_1=Árboles. Sombras. Viento. Algunas personas. Probablemente. La lista está en progreso.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_2=No entraron en la lista. Sospechoso. Muy sospechoso.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_3=¡Los lobos dan muchísimo miedo! Quién no les tendría miedo. ¡Intento crear una lista de cosas que no me asusten! Me ayuda a quedarme más tranquilo de noche.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello=Si tienes frío, bebe algo caliente. Si estás triste, bebe algo caliente. Si te están persiguiendo, bebe algo caliente más rápido.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_1=¿Qué estás preparando?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_2=¿De verdad ayuda?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_1=Té de Aguja de Abeto. Sabe a valentía y agujas. Sobre todo a agujas.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_2=Te ayuda si crees que te ayuda. No subestimes un placebo.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello=Estoy entrenando mi risa para que suene villana. Escucha. Ja. Ja. Ja.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_1=Eso ha sido aterrador.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_2=¿Por qué practicar?
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_3=Te dejo seguir practicando.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_1=Gracias. Estoy mejorando. Quiero que la gente me tenga miedo.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_2=Porque quiero dominar el mundo, y no puedes hacerlo sin una risa malvada. Obviamente.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available=Oh. Vaya. Tienes exactamente la pinta de alguien que sabe manejar una tarta.\nHe creado una nueva receta de tarta con bayas de nieve y necesito una segunda opinión.\nSi te comparto la receta, ¿te importaría probarla?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_1=La tarta es mi especialidad.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_2=Venga.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder=¿Qué tal la prueba de tarta? NECESITO saberlo...\nMi sueño de ser repostera está en juego.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_1=Todavía no he comido nada.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_2=Me está encantando la tarta hasta ahora. Solo estoy lleno.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_3=No creo que pueda tragar más.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete=¿Y bien? ¿Y bien?\nCuéntamelo todo. La textura, el toque de baya, ¿tu Tarta de Bayas de Nieve superó a una tarta normal?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_1=Fue una alegría pura.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_2=Quiero otro trozo.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_3=No creo que la repostería sea lo tuyo.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.after_quest=Ey, catador.\nSi ves bayas de nieve, ya sabes lo que hacer.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.hello=Ey, soy una repostera en ciernes. Intento hacer una tarta nueva. Todavía estoy buscando mi ingrediente especial.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello=No confíes en los loros. Repiten todo. Incluso los secretos. Especialmente los secretos.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_1=¿Qué han dicho?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_2=Enséñame el idioma loro.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_3=¿Algún consejo para la selva?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_1=Que alguien dejó caer un pescado. Tenían razón. Lo dejé caer yo. Los loros nunca me lo van a perdonar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_2=Son sobre todo insultos y peticiones de aperitivos. De vez en cuando una advertencia, si pagas en semillas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello=Estoy inventando una nueva cocina: lo crujiente. La selva ofrece muchos candidatos.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_1=Por favor, no lo hagas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_2=¿Qué hay en el menú?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_3=Dame algo normal.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_1=Cobarde. Pero justo. Hoy no te sirvo escarabajo. Quizás mañana.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_2=Escarabajo asado. Araña especiada. Ensalada de liana. La ensalada muerde de vuelta. Ese es el encanto.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello=Las lianas son cuerdas con ambición. Cuelgo mi arte donde la gravedad pueda criticarlo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_1=¿Qué arte?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_2=¿Se cae?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_3=¿Puedo ayudar?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_1=Campanillas de viento hechas de semillas. Suenan como pequeñas tormentas discutiendo con educación. Si quieres ayudar, ponte debajo y finge que tenías intención de estar ahí cuando caiga.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_2=A menudo. Eso es parte del espectáculo. Si no cae, es que no fue lo bastante valiente.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello=Todo el mundo dice que el dosel es precioso. Todo el mundo olvida que también está muy lejos del suelo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_1=Entonces quédate abajo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_2=¿Qué es lo que más te da miedo?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_3=¿Quieres ánimos?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_1=Lo intenté. La selva construyó escaleras. La selva se está burlando de mí.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_2=Caerme. Y también no caerme, porque entonces hay que bajar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello=Mapeo la selva escuchando. Los pájaros trazan las fronteras. Los insectos rellenan los detalles.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_1=Eso suena inventado.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_2=¿Puedo ver tu mapa?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_3=¿A dónde debería ir?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_1=Igual que la selva. Aun así, aquí estamos. Escucha el tiempo suficiente y los caminos se presentan solos.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_2=Son sobre todo flechas y advertencias. También un garabato de un loro muy maleducado.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello=Le dije a una liana que era pegajosa. Se lo tomó a mal.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_1=Otro más.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_2=¿Algún consejo de verdad?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_3=Eres insoportable.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_1=Me perdí y pedí indicaciones. La selva dijo: "Déjame en-hojas".
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_2=No golpees un árbol con hormigas. Te arrepentirás de tener manos.
skyblock_hub_dialogues.npc_name.balth=Balth
skyblock_hub_dialogues.npc_name.brakka=Brakka
skyblock_hub_dialogues.npc_name.kora=Kora
skyblock_hub_dialogues.npc_name.nyssa=Nyssa
skyblock_hub_dialogues.npc_name.ruk=Ruk
skyblock_hub_dialogues.npc_name.sable=Sable
skyblock_hub_dialogues.npc_name.varka=Varka
skyblock_hub_dialogues.npc_name.zarn=Zarn
skyblock_hub_dialogues.npc_name.grak=Grak
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro=Oh. *Oink* Tú... me has visto.\nTengo un cuenco donde cuento. Para las patrullas que no vuelven completas. Es un trabajo silencioso. *Oink*\nNo suelo pedir ayuda a nadie. Pero el cuenco se está llenando demasiado. Me preguntaba si... si quizás podrías vaciarlo un poco vengando su pérdida. *Oink*... Solo si quieres.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro.response.accept=Te ayudaré con el cuenco.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress=*Oink*... Oh. Sigues en ello.\nNo te preocupes, sin prisa. No quiero añadir tu nombre a mi cuenco también. Por favor, cuídate.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress.response=Lo acabaré.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete=Oh. *Oink*... Gracias.\nLos nombres no se olvidan y la pérdida de mi amigo caído ahora tiene peso. No sé muy bien cómo... *Oink*... Gracias. Es todo lo que tengo.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_1=No necesitas decir nada más.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_2=Que descansen.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello=*Oink*... Oh. Hola. No esperaba a nadie.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_1=Hola, Grak.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_2=No me hagas caso.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro=*Oink* Tú no pareces un Piglin. Debes de ser uno de esos Humanos invasores.\nNo confío en vosotros los Humanos, corriendo por el mundo. ¡Nosotros los Piglins podemos manejar solos esta infestación de Piglins Zombificados! *Oink*\nBien, si quieres demostrarte, te dejaré.\n*Oink* Solo un amigo me traería oro. ¿Quieres ser mi amigo?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro.response.accept=Sí, quiero ser tu amigo.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro=Si de verdad quieres demostrarme algo, ¿has traído el oro?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro.response.trade=Aquí tienes el oro.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete=Oh, de verdad me valoras como amigo. Pensé que a vosotros los Humanos no os caíamos bien. *Oink*\nSupongo que ahora somos amigos. Bien saberlo.\nQuizás fui demasiado rápido juzgando a los humanos. *Oink*
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_1=Me alegra ser tu amigo.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_2=Solo intento ser amable
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello=¡¡¡¡Ey amigo!!!! *Oink* *Oink* *Oink* *Oink*\n¿Tienes más oro? ;)
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_1=No, lo siento amigo :(
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_2=Pareces demasiado emocionado de verme.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro=Eres uno de los humanos que ayuda a la colonia, ¿verdad? Bien.\nSiguen apareciendo Piglins Zombificados Infernales por aquí. Creo que los Piglins Zombificados normales están bajo control, pero me preocupa que los humanos estén ignorando la amenaza de los más mortales, los ígneos. ¿Te importaría encargarte de algunos?
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro.response.accept=Los elimino.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress=¿Cómo va? ¿Los Infernales están siendo un desafío, como temía? Me temo que puede que ya sea demasiado tarde.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_1=Vuelvo al trabajo.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_2=Sí, son muy duros
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete=¡Buen trabajo, humano! Creo que podré descansar más tranquilo sabiendo que hay menos de esas hostiles criaturas ígneas por ahí. Aunque yo soy inmune al fuego, así que no es que me preocuparan. Me alegra apoyar los esfuerzos de los Humanos tomando las decisiones que creo que hay que tomar.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_1=Me alegra haber podido ayudar.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_2=Bien hecho tomando la decisión.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello=Cosas raras pasando por aquí. Si noto algo que considere una amenaza de nuevo, te aviso.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_1=¡Gracias!
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_2=Siempre estoy aquí para ayudar
skyblock_hub_dialogues.nether.piglin_colony.balth.hello=¡Bienvenido al Nether! Ten cuidado ahí fuera. No es un lugar amigable.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_1=Vaya bienvenida.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_2=Espero que estés bien.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello=Si hueles a quemado, no te asustes. Es que volví a quemar la comida.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_1=¿Quemada?
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_2=Espero que tus aventuras culinarias acaben bien.
skyblock_hub_dialogues.nether.piglin_colony.kora.detail_1=Sí, resulta que incluso en el lugar más caliente del universo puedes quemar la comida.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello=¡Vaya! ¡Para! Ten cuidado más allá de estas puertas. Ahí fuera es peligroso.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_1=¡No te preocupes! ¡Tengo casco!
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_2=Estaré a salvo
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello=¡Vaya, la arquitectura de aquí es muy impresionante! Es increíble pensar que este lugar se construyó literalmente en pocos años después de la fusión.
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_1=¿Qué es la fusión?
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_2=Sí, es muy impresionante
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_3=Bah, conozco mejores constructores
skyblock_hub_dialogues.nether.piglin_colony.ruk.detail_1=Es cuando el Overworld se fusionó con este extraño lugar.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello=Cuidado ahí abajo. Esa cosa morada parece comerse el cuarzo y tiene un extraño potencial mágico. A mí me dio un tercer brazo durante un día.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_1=¿Un tercer brazo?
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_2=Vaya, qué locura.
skyblock_hub_dialogues.nether.piglin_colony.sable.detail_1=Sí, es magia muy poderosa si le das lo que quiere.\nClaramente quiere mucho el cuarzo.
skyblock_hub_dialogues.nether.piglin_colony.varka.hello=Forjo espadas, bisagras y, de vez en cuando, alguna crisis existencial. Sobre todo bisagras.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro=Vaya, cuidado. Todavía no he terminado de construir por aquí. El puente que tengo detrás no lleva a ningún sitio por ahora.\nTengo un pequeño problema, eso sí. Soy un constructor muy capaz. Sin embargo, he perdido todas mis linternas y le tengo un miedo atroz a la oscuridad.\n¿Te importa ayudarme a encontrarlas? No pueden haber ido muy lejos.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro.response.accept=Encuentro tus linternas.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns=Por favor, date prisa, le tengo bastante miedo a la oscuridad.\nSé que no pueden haber ido muy lejos, a menos que las linternas hayan empezado a caminar. Si es así, ese es un problema aparte y no estoy preparado para eso.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns.response=Sigo buscando.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit=¿Encontraste las linternas? ¡Bien. Bien!\nAhora necesitamos suficiente luz para iluminar todo The Crimson Exchange. Un buen montón de Piedra Luminosa y antorchas debería bastar.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_1=Aquí tienes algunos suministros de iluminación.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_2=Estoy en ello.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete=Lo conseguiste. Bien. Ahora habrá mucha más luz por aquí.\nYa no necesito tenerle miedo a la oscuridad.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_1=De acuerdo, la oscuridad da miedo.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_2=Me alegra haber podido ayudar.
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello=Me has alegrado el día de verdad.\nOjalá no hubiera aceptado un trabajo construyendo en literalmente el lugar más oscuro del universo...
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello.response=Me alegra que las luces estén ayudando.
skyblock_hub_dialogues.nether.piglin_colony.vesh.lantern.cant_pick_up=No sé de quién son estas cosas. Quizás debería dejarlas tranquilas por ahora.
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello=¡Ey, bienvenido a la Colonia Piglin!\nLa Colonia Piglin suena como si hubiera sido un lugar encantador. Los Humanos no sabíamos de su existencia hasta hace muy poco.\nEncontramos esta dimensión alternativa a través de grietas que se formaron entre los mundos.\nHablamos con los Piglins y parecen un grupo amigable (aunque se obsesionan un poco con el oro). Parece que lo tienen peor que nosotros en el Overworld.\nMontamos esta base, The Crimson Exchange, para acceder fácilmente al Nether y ofrecer apoyo a los Piglins.\nPor supuesto, siéntete libre de ayudarlos, ¡pero ten cuidado! ¡Muchos de ellos han sido tomados por la corrupción y se han convertido en Zombis!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_1=¡Estaré a salvo!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_2=¡Qué bueno verte de nuevo!

# Zombified Bastion - Dungeon Guard
skyblock_hub_dialogues.nether.piglin_colony.zombified_bastion.dungeon_guard.introduce=Esta fortaleza... era el orgullo de la Colonia Piglin.\nPor desgracia, ahora está invadida por variantes Zombificadas de nosotros los Piglins. Nuestros amigos, convertidos en Zombis.\n¿Nos ayudarías a recuperar la Fortaleza para el resto de nosotros los Piglins supervivientes?\nSolo necesitamos sellar algunos de los portales que los Piglins Zombificados usan para entrar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction=¿Oyes eso? ¡Están talando los árboles!\nTantas generaciones de familias cuidando esta selva, y ahora la están talando toda. Si me preguntas, es una mala señal, y si esto sigue, las cosas solo van a empeorar.\n¿Nos ayudas a detener esta horrible deforestación?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_1=Preguntaré. Esto suena muy mal.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_2=Quizás la Jungle puede aguantar unos cuantos árboles menos.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.in_progress_workers=Quizás deberías empezar hablando con los trabajadores. Seguro que saben quién está detrás de todo esto.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.after_lucien=Oh, es Lucien. Tiene todo el sentido del mundo.\nEse monstruo es un codicioso sin límites. Es el ricachón de por aquí y nunca está satisfecho con su riqueza.\nNo me sorprende que esté arruinando nuestro hogar para aumentar aún más su fortuna.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete=Lucien se quedó con tus troncos y dijo que de todas formas no iba a parar. Ese hombre es horrible.\nEn fin, gracias por intentarlo. Estoy segura de que algún día alguien le hará entrar en razón. Antes de que todo el bosque caiga.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete.response=Espero que podáis salvar el bosque.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.hello=La deforestación sigue. Lucien seguirá llenándose los bolsillos de riqueza hasta que alguien pueda pararlo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned=Sí, manejo esta máquina. Ten cuidado, es muy peligrosa.\nYo no tengo nada que ver con esto. Puedo asegurártelo. Lucien es un hombre de negocios poderoso y él está detrás de todo esto. No creo que entienda de verdad que lo que hace daña el bosque. Creo que solo puede ver el dinero que gana vendiendo la madera.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned.response=Ah, así que todo lo mueve el dinero.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.hello=Mantén las manos alejadas. Esta cosa muerde.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned=Vaya, para, que estaba a punto de darle un golpe enorme a esa pila de troncos de ahí.\nMira, entiendo que quieres salvar el bosque, pero no hay nada que yo pueda hacer. Solo cumplo con mi trabajo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned.response=Oh, lo siento. Te dejo volver al trabajo
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.hello=Cuidado, esta es una máquina enorme y ahora mismo estoy recogiendo toda esta madera.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned=Eres la cuarta persona que hoy intenta pararme.\nTe aviso, no estoy de humor para hablar contigo.\nSi quieres respuestas, Lucien es tu hombre. Él es quien me paga.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned.response=Entendido.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.hello=Lucien paga bien. Ojalá me pagara por no destruir nuestro hogar. No puedo tener mi casa sin tener una casa, y no puedo tener una casa si talo este bosque.\nNo puedo ganar :(
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront=Solo estoy aquí para ganar dinero. Me hice cargo del negocio familiar. Ahora talo árboles. No puedo creer que nadie lo hiciera antes. Voy a ser muy rico.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_1=Estás destruyendo tu propio hogar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_2=¿Qué puedo hacer para que pares?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro=Seamos justos. Me traes un montón de troncos para compensar mi negocio perdido, y paro. ¿Te parece justo?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.response_deposit=Aquí tienes unos troncos
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.dungeon=Quiero luchar por el bosque.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete=Excelente. Exactamente lo que pedí.\nAhora, sobre cerrar el negocio.\nNo.\nEstos troncos ayudan a los números de hoy. Las máquinas ayudan a los de mañana.\nDiles a los manifestantes que pueden seguir pidiéndome que pare, pero no lo voy a hacer. El negocio no va a crecer con una pila de troncos tan pequeña.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_1=Se lo diré.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_2=Monstruo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon=Ey, quítate de mi camino. Tengo negocios que gestionar.\nTengo muchos clientes. Sí, puede que estos clientes sean monstruos malvados, pero pagan bien. El crecimiento del negocio se estancaría si empezara a ser selectivo con mis clientes.\nSi tienes un problema, venga. No puedes conmigo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_1=Venga.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_2=¿Trabajas con monstruos?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters=Sí.\nQuieren cosas de mí. En vez de atacarme, descubrí que si les das cosas, tienden a apoyarte.\nY si lo talan todo y se lo roban a todo el mundo, pues...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_1=Debo detenerte.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_2=Me ocuparé de ti más tarde.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.kiri.hello=Conocí a un tipo que vivía en una casa en el árbol en uno de esos árboles. Tan injusto.\nEstoy bastante seguro de que su casa en el árbol ya se convirtió en madera para la pared de la mansión de algún millonario.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.paz.hello=Seré honesto. Este bosque parece... "encantado". Creo que es una pésima idea talar estos árboles. Va a volver a perseguirnos.\nNo creo que esa cosa morada que rezuma por el suelo sea buena señal.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.marlo.hello=No confío en esa cosa morada.\nNo es natural.\nPor qué hay arañas por todas partes ahora.\nNo tiene sentido.\nCreo que es una señal de que algo malo está pasando.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available=¡Hola de nuevo! He estado trabajando en una nueva receta. Creo que va a darle a la gente de Pumpkingdom un gran subidón de moral.\nCreo que incluso será buena comida para ti. ¿Te apuntas a probarla?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_1=Sí, siempre tengo hambre
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_2=Siempre emocionado con una nueva delicia
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted=¡Genial! Esta es mi idea. Es un estofado de ternera. Actualizaré tu libro de recetas en una mesa de trabajo para que puedas ver la idea que tengo.\n¡Ve a hacer unos cuantos y cuéntame qué te parece el sabor!
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_1=Suena estupendo
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_2=No me convence mucho la idea, pero lo intentaré de todas formas
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder=¿Cómo va mi preciosa receta? Espero que no te hayas envenenado con ella.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_1=Va bien
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_2=Ooh, no tiene buena pinta
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_3=Todavía no he empezado
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete=¿Y bien? Mírarte, todavía en pie y sin poner la cara de "me arrepiento de todo". Eso es prometedor. Me muero de ganas de saber, ¿estaba bueno el estofado de ternera? ¿He fallado a todos como chef?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.tasty=Estaba bueno. Muy bueno.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.honest=Necesita un poco más de trabajo.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.horrible=Estaba asqueroso.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup=¡Sí! Lo sabía. Todo el reino va a estar muy contento. Tengo muchas ganas de compartir mi creación con más gente.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_1=Me alegra verte tan feliz
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_2=Sigue con el buen trabajo
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup=Bueno, supongo que no es para todo el mundo, y parece que tampoco te desagradó del todo. Parece que voy en la dirección correcta. Agradezco el feedback honesto.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_1=No te preocupes, creo en ti
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_2=Deberías rendirte ahora
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting=Ay, lo siento muchísimo. Debería rendirme como chef. No puedo creer que te haya odiado tanto.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_1=Lo siento, no lo decía en serio
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_2=Mira, la cocina simplemente no es lo tuyo
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello=¿Cómo estás? Espero que mejor que yo.\nTodas mis vacas siguen injustamente corrompidas con esa cosa morada. Es muy malo.
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello.response_1=Lo siento mucho
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer=*Llorando* ¡Ey! Lo siento, me has pillado en mal momento.\nMis vacas se han vuelto malas. Están haciendo daño a los aldeanos. No puedo soportar verlas así.\nNo quiero hacerles daño. ¿Puedes hacer algo al respecto?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.what_happened=¿Qué les pasó?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.ill_help=Protegeré a los aldeanos
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.what_happened_followup=No lo sé. Un día estaban pastando y al siguiente estaban infestadas de esa cosa morada. Es como una enfermedad que las ha infectado a todas. Es tan triste verlas así.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.followup.response.accept=Me encargo
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check=*Llorando* Espero que vaya bien.\n¿Cómo va? En realidad, no me lo cuentes. No quiero saber.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check.response.on_it=Estoy en ello
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete=¡Dios mío! Muchas gracias por hacer eso. Es tan horrible. Qué les habrá pasado. Es tan injusto.\n*Sigue llorando*\nMis pobres vacas.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_1=Por favor, no llores
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_2=A tu disposición cuando quieras


