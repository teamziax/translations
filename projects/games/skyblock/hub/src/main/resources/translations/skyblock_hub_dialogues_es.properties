# Grot & Nira - A Bolt of Hope
skyblock_hub_dialogues.npc_name.grot=Grot
skyblock_hub_dialogues.npc_name.nira=Nira
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro=Tú. Para. Necesito tu ayuda.\nEse cerdo que está a mi lado. Es mi esposa. Nira. La podredumbre morada se extendió por nuestra sección y cambió. Sigue ahí dentro. Lo sé. Cada mañana me roza la pata contra la pierna, igual que siempre.\nMe dijeron que el rayo puede atravesar la podredumbre. Encuéntrame un pararrayos. Yo haré el resto.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro.response.accept=Te encontraré un pararrayos
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro=Sigue aquí. Sigue rozándome la pata contra la pierna cada mañana.\nSi encontraste un pararrayos, lo usaremos para dirigir un rayo directamente sobre ella.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro.response=Toma, cógelo.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt=Algo ha pasado. Chilló.\nPero sigue siendo un cerdo. La descarga no fue suficiente.\nNecesito más. Mucho más. Vamos a crear la tormenta eléctrica más poderosa que hayas visto nunca.\nLos pararrayos no bastarán. Necesitaremos usar cristales de hielo y vapor de agua para generar la tormenta del siglo.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_1=Lo reúno todo
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_2=Son muchos materiales
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro=¿Lo tienes todo?\nNira me hablaba de las tormentas. Decía que el agua se congela muy arriba en lugares como el Snowy Taiga, donde el aire es espeso y frío. Luego está el vapor de agua que sube y choca con el hielo de arriba. Acumulan una carga enorme, hasta que el cielo no puede contenerla y se abre con un chasquido.\nSi apilamos los pararrayos para enfocarla y usamos el hielo y el agua para construir la carga, podremos atraer algo más grande que cualquier rayo natural. Algo lo suficientemente poderoso como para atravesar la podredumbre.\nEsperemos no fundir todo el Nether.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro.response=Aquí están tus ingredientes para la tormenta
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete=¡NIRA!\n¡Mírala. Ha vuelto!\nNo tengo palabras para esto. Me devolviste a mi esposa.\nGracias. Lo digo de verdad.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_1=Merece estar en casa
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_2=Me alegra haber podido ayudar
skyblock_hub_dialogues.nether.piglin_colony.grot.hello=Nira todavía está encontrando su sitio. Fue un cerdo durante mucho tiempo. Pero ya es ella misma de nuevo. No sé qué habría hecho sin ti.
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_1=Tiene suerte de tenerte
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_2=Cuídala bien
skyblock_hub_dialogues.nether.piglin_colony.nira.hello=Lo recuerdo todo, incluso siendo un cerdo, oía la voz de Grot cada día. Nunca me abandonó. Fue muy dulce conmigo.\nDe verdad que me va a costar un tiempo readaptarme a la vida con dos piernas.
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_1=Es un placer tenerte de vuelta
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_2=Eres muy afortunada
skyblock_hub_dialogues.nether.piglin_colony.nira_pig.hello=Oink.
skyblock_hub_dialogues.laptop.name=Portátil del SDP
skyblock_hub_dialogues.laptop.laptop_1=Hola, Equipo del SDP,\n\nEspero que todos puedan recibir este mensaje en su debido tiempo.\n\nDe primeras, ¡me gustaría felicitar a Dorothy por su cumpleaños número 100! Espero que te encuentres bien, Dorothy.\n\nSegundo, quisiera recordar a todos aquellos que trabajen aquí, que la atención al trabajo es extremadamente importante. Nuestra labor es un asunto de vida o muerte y es de extrema importancia que se concentren en sus puestos. Estar ahí sentado jugando con el móvil no cuenta como trabajo. Y no quisiera tener que empezar a mencionar nombres, Rob.\n\nKen\nRecursos Humanos\nSkyblock Defence Program
skyblock_hub_dialogues.laptop.laptop_2=Escudo del SDP\nNombre: Skyblock 2.0\nCarga de prevención recomendada: Helios - 20km\nEstado: FUERA DE SERVICIO\nError: Energía Insuficiente
skyblock_hub_dialogues.laptop.laptop_3=Estimada Ivy,\n\nFelicidades por aprobar su grado en Descubrimiento y Prevención de Helios. Desde el SDP admiramos sus impresionantes calificaciones y quisiéramos darle una oportunidad de trabajar con nosotros. Sus conocimientos serían imprescindibles en el caso de decidir trabajar con nosotros, y tendrías la oportunidad de salvar múltiples vidas.\n\nLas plazas de empleo en el SDP son limitadas, así que si está interesada en esto por favor responda lo antes posible, para que podamos proceder a negociar salarios.\n\nEsme\nReclutamiento\nSkyblock Defence Program
skyblock_hub_dialogues.laptop.laptop_4=Ehh, Rafael,\n\n¿Viste los resultados de laboratorio ayer en el trabajo? ¿Por qué nadie está hablando sobre eso? Aquellos análisis de Helios eran diferentes. Casi parece que invirtieron tantos fondos en actualizar nuestra tecnología, y ahora que conocen la verdad, ya no quieren actuar ante ello por miedo.\n\n¿A qué nos estamos enfrentando? Creía que esto se trataba de prevenir meteoritos, pero ¿resulta que esos ya no son meteoritos? ¿¡QUÉ DIANTRES SON!? ¿QUÉ SON ESAS COSAS QUE SE DIRIGEN HACIA NOSOTROS? ¿ESTAREMOS A SALVO?
