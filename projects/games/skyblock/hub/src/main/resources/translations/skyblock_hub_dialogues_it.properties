skyblock_hub_dialogues.wurg.cannot_cross=GGGRRR! Sono un Wurg di pessimo umore! Noi Wurg siamo giurati a proteggere i ponti e a impedire a chiunque non sia degno di attraversarli! Torna quando avrai scoperto di più!
skyblock_hub_dialogues.wurg.back_to_work_response=È ora di tornare al lavoro!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat=Ehi, sei ancora in piedi! Buon segno. Hai già incontrato i villagers? Adorano chiacchierare!\nTi senti un po' perso? Nessun problema! Le tue missioni sono al sicuro nel tuo <cc:header>Menu Skyblock</cc:header> oppure scrivi "/skyblock quests"!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_1=Grazie per le info!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_2=Sì, i villagers sono così simpatici!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.introduce=Ehi, amico! Benvenuto nel villaggio di Oakridge \nOh, dove ho lasciato le mie buone maniere... Mi sono dimenticato di presentarmi!\nMi chiamo Cubit, sono la guida del villaggio qui a Oakridge!\nSeguimi, ti mostro il cuore del villaggio e ti presento i villagers!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_enchanter=Questo è l'incantatore!\nIn qualche modo magico, può incantare i tuoi oggetti per renderli più potenti!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_portal=E con questo siamo tornati al portale...\nPuoi sempre usare il portale per tornare a casa, o in alternativa usa quel pratico menu nel tuo inventario.\nQuesto è tutto per il tour di oggi, ma non preoccuparti, c'è ancora tanto da esplorare a Oakridge!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_repairer=Ecco il riparatore!\nÈ in grado di riparare qualsiasi cosa! Anche se è stata mordicchiata da qualcosa...\nTipo un coniglio o roba del genere...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_shops=Ah, la mia parte preferita... I negozi!\nHanno tutto quello che ti serve, e tutto quello di cui non sapevi di aver bisogno!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce=Ehi! Sei tu di nuovo!\nTi mostro subito la Forgia! È l'unico posto nel mondo di Skyblock capace di fare potenziamenti potenti a strumenti e armature.\nÈ un po' difficile da trovare, quindi muoviamoci!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_1=Andiamo!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_2=Non vedo l'ora!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge=Benvenuto alla Forgia! Questo enorme edificio è una vera potenza!\nSi dice che sia stato costruito da persone che sembravano possedute e che questo luogo abbia poteri magici.\nLe Rune trovate nel mondo possono essere qui affinate nella loro vera potenza.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_1=Cavoli, fa quasi paura!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_2=Non vedo l'ora di creare qualcosa di potente!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello=Come va alla Forgia? Hai già creato qualcosa di fantastico?\nI Dungeon sono un ottimo punto di partenza per trovare Rune se ne hai bisogno.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_1=Sì, va alla grande!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_2=Non ho ancora creato niente di buono!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.introduce=Ehi! Sono Cassandra! Sono una contadina! Qualcuno dice che sono la migliore contadina qui intorno!\nQualcuno dice che <italic>batto</italic> tutta la concorrenza!\n\nCome allevatrice di barbabietole ho sempre un sacco di semi di barbabietola! Torna da me se vuoi un'offerta fantastica!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.response=Piacere di conoscerti!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.chat=Ehi, come va, amico!\nPosso interessarti a dei semi di barbabietola a ottimo prezzo?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.introduce=Mmh... sono Levi.\nNon sei di queste parti, vero?\nTutti mi conoscono. Sono quello che dorme sempre sul lavoro. Sto lavorando per migliorare le mie capacità e poter aiutare di più, ma non ci sono ancora del tutto.\nSe ci metti impegno, diventerai famoso quanto me.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_1=Spero che tu non dorma sempre
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_2=Sembri un tipo problematico
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.hello=Ehi, come stai?\nSono occupato a riposare. Puoi tornare in un altro momento?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.introduce=NON CI POSSO CREDERE! Gente nuova!\nSei nuovo, vero? Non vedo l'ora di conoscerti. Dimmi tutto.\nCome stai? Ho della torta. La vuoi?\nOddio. Devi fermarmi. Altrimenti continuo a parlare.\nHai incontrato tutti? Hai visto i negozi? E le miniere?\nOOOOO C'è tanta di quella roba viola folle che cresce dal terreno, ne hai sentito parlare?\nAspetta... mi fermo
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_1=Woah, calmati!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_2=Credo che andremo molto d'accordo
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_3=Sei decisamente troppo caotica
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello=Woah, sei tornato a parlarmi! Mi onori.\nStai bene? Ho fatto altra torta. Adoro la torta.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello.response_1=Anch'io adoro la torta
skyblock_hub_dialogues.response.show_me_around=Sì, mostrami il giro!
skyblock_hub_dialogues.response.show_me_more=Sì, mostrami di più!
skyblock_hub_dialogues.response.show_me_what_youve_got=Sì, mostrami quello che hai!
skyblock_hub_dialogues.response.thanks_for_help=Grazie!
skyblock_hub_dialogues.response.yeah_sure=Sì, certo!
skyblock_hub_dialogues.response.lets_go=Sono prontissimo!
skyblock_hub_dialogues.response.ill_pass=Magari un'altra volta...
skyblock_hub_dialogues.response.yeah_ill_help=Sì, ti aiuto!
skyblock_hub_dialogues.response.not_right_now=No, adesso no
skyblock_hub_dialogues.response.okay=Ok
skyblock_hub_dialogues.response.yes=Sì
skyblock_hub_dialogues.response.tell_me_more=Dimmi di più.
skyblock_hub_dialogues.response.i_should_go=Devo andare.
skyblock_hub_dialogues.response.fair_enough=È giusto.
skyblock_hub_dialogues.response.yikes=Che roba.
skyblock_hub_dialogues.response.good_luck=Buona fortuna.
skyblock_hub_dialogues.response.interesting=Interessante.
skyblock_hub_dialogues.response.laugh=Haha!
skyblock_hub_dialogues.response.ill_leave_you_to_it=Ti lascio fare.
skyblock_hub_dialogues.response.will_do=Fatto!
skyblock_hub_dialogues.response.ellipsis=...
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.introduce=Oh caro, oh cielo! I miei preziosi batuffolini sono scappati di nuovo dal cancelletto! Stavano saltellando vicino al cottage, ma ora sono spariti nel bosco! Potresti aiutarmi a raccoglierli? Ti ripagherò bene, te lo prometto, ho solo bisogno che i miei cuccioli tornino a casa!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.response=Pronti per la caccia ai conigli! Non preoccuparti, Aurora!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.hows_it_going=Come va? C'è traccia dei miei piccoli fuggitivi? Quei conigli stanno tramando qualcosa, lo so... speriamo solo che sia un furto di spuntini e non una vera ribellione!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks=Oh, grazie al cielo! Grazie mille per avermi aiutata... Non avrei saputo tenerli d'occhio senza di te! Dirò a tutti a Oakridge della tua gentilezza e del tuo coraggio!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks.response=Felice di aver salvato la situazione!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.hello=Ehi! Sono ancora così super grata per il tuo aiuto con i miei monellini!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro=Eeek! Stai lontano! Cioè, ciao! I conigli sono solo... troppo nervosi per me. Sono terrificanti! Puoi portare questo cibo ad Aurora? Ho preparato carote, barbabietole e grano così può tenerli... soddisfatti.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_1=Certo! Sarò il tuo eroe delle consegne.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_2=Come puoi avere paura? Sono solo conigli pelosi!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress=Ehi! Hai... hai già dato da mangiare a quelle creature terrificanti? Hanno ancora fame?
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress.response=Non ancora, ma ci sto.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete=Sei il migliore! Davvero, i conigli sono dei mostri travestiti da animali carini. Aurora dice che dovrei andarli a trovare qualche volta... forse lo farò, se ci sei tu a proteggermi!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete.response=Quando vuoi! Sarò la tua guardia del corpo anti-coniglio.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello=Ehi, come va! Sono il miglior fornitore di cibo per animali del bosco, soprattutto perché non mi piace avvicinarmi troppo agli animali!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello.response_1=Ottimo!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro=Oh! Queste devono essere le carote che ha raccolto Bob. È un tesoro, anche se è un po' nervosetto. Me le dai?
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro.response.yes=Eccole!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks=Perfetto! Grazie mille. Di' a Bob che è sempre il benvenuto, magari se li vede sgranocchiare capisce che sono solo dolci amichetti.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks.response=Glielo dico.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro=Oh, Bob ti ha mandato con degli snack? Che gentilezza! Sono un po' impegnata con gli altri conigli, potresti darglieli direttamente? Di' a Bob che è sempre il benvenuto!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro.response=Posso farlo!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.catch=<italic>*Hop Hop*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.response=Preso! Tranquillo tranquillo.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.intro=Questo coniglio muove il naso sembra affamato di carote!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.thanks=Il coniglio sgranocchia felice le carote.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.catch=<italic>*Squittio!*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.response=Vieni con me, piccolino!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.intro=Questo coniglio sembra volere della barbabietola fissa la borsa con quegli occhietti!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.thanks=Il coniglio gusta la barbabietola.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.catch=<italic>*Nom Nom*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.response=Torniamo al recinto!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.intro=Questo coniglio aspetta pazientemente un po' di grano!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.thanks=Il coniglio rosicchia il grano con aria soddisfatta.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.hello=<italic>*Muove il naso*</italic>


skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.intro=Ehi! Tu lì, vieni qua\nIeri notte... i muri hanno tremato violentemente e così, di colpo, tutte le case qui intorno sono diventate instabili...\nE ovviamente tocca a me sistemare la faccenda...\nMa adesso posso rendere il problema anche tuo, immagino.\nVai a prendermi dei tronchi di quercia e della pietrisco, poi parliamo quando hai finito.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going=Sei tu di nuovo.\nHai già raccolto i materiali?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.yes=Sì! Ho delle risorse per te.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.no=No, scusa, ci torno subito :(
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks=Woah, l'hai davvero fatto.\nSono... impressionato.\nGrazie, immagino.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks.response.enjoy=Spero che quelle risorse siano state utili!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well=Nessuna scossa dall'altra notte. Speriamo che rimanga così.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well.response.glad_to_hear=Contento che stia andando bene!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro=Ehi, tu. Lascia che ti presenti qualcosa di molto potente in questo mondo...\nI Santuari. Sì, dagli tanto di qualunque oggetto sia il tema del Santuario e ti ricompenserà con roba fantastica.\nVai a girare per trovare tutti i Santuari che questa terra ha da offrire!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_1=Mi ci metto subito!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_2=Li vedrò mentre giro, grazie!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going=Li hai trovati tutti?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_1=Sto ancora cercando!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_2=Sto cercando di trovarli tutti!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello=Ehi! Tutto bene!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello.response_1=Bello rivederti!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello=Ehi. Sono Gus. Mi sembra di aver lasciato i miei occhiali da qualche parte qui intorno.\nContinuerò a cercarli, immagino.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_1=In bocca al lupo. Spero che li trovi!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_2=Scommetto che non te lo aspettavi...


# Cobblestone Mine - Dungeon Guard
skyblock_hub_dialogues.overworld.oak_forest.cobblestone_mine.dungeon_guard.introduce=Non molto tempo fa, questa era una miniera tranquilla e produttiva...\nQuesto finché non sono arrivati i ragni.\nLa Guardia di Oakridge non era preparata per un attacco del genere.\nSiamo stati sopraffatti e abbiamo dovuto ritirarci.\nOra la miniera è invasa da ragni e altre creature.\nPotresti aiutarci a liberarla?

# Pumpkingdom - Ella
skyblock_hub_dialogues.overworld.plains.pumpkingdom.ella.flower_shop=Ehi! Sono la proprietaria del Negozio di Fiori qui a Pumpkingdom!\nTi posso interessare a dei fiori?

# Pumpkingdom - Dungeon Guard
skyblock_hub_dialogues.overworld.plains.pumpkingdom.dungeon_guard.introduce=C'erano così tanti zombi. Mi ossessiona!\nNon so come siamo sopravvissuti. Non c'era altro che potessi fare.\nMi chiedo se tu ce la saresti cavata meglio. Pensi che avresti potuto aiutare? Il risultato sarebbe cambiato se ci fossi stato tu?

# Pumpkingdom - Blooming in the Rain
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce=Oh! Ciao! Sembri avere due mani d'oro per il giardinaggio! Il terreno è stato così agitato ultimamente, credo abbia bisogno di colori vivaci per calmarsi. Vuoi aiutarmi a raccogliere dei fiori?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_1=Ooo, i fiori! Mi farebbe piacere aiutare.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_2=Sono troppo occupato per i fiori adesso.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker=Aspetta, aspetta! Non possiamo strapparli così, le radici sono delicate! Prima di uscire, passa in quel negozio e compra uno strumento per raccogliere fiori.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker.response_1=Certo, vado a prenderne uno
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go=Ok, ce l'hai! Guarda quanto brilla! Ok, concentrati, Sandy... concentrati... Andiamo a raccogliere dei fiori!!!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go.response_1=Sì! I fiori!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions=Guarda questi tarassachi! Sono come piccoli pezzi di sole. Raccogli dei tarassachi con lo strumento, poi portameli!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_1=Ecco dei tarassachi!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_2=Oh, vado a prenderli! Mi sono un po' distratto.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_dandelions=Attenzione! Assicurati di raccogliere i Tarassachi con gli strumenti per non disturbare la terra!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys=Hai sentito? Il terreno sembrava un po'... scricchiolante. Andiamo a trovare dei papaveri. Il loro rosso è così intenso, è perfetto per le rovine.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_1=Sì, andiamo a esplorare!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_2=Se proprio dobbiamo...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys=Forza, forza! Raccogli dei papaveri con lo strumento, poi portamene un po'! Fanno tanto bene alla terra.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_1=Ecco dei papaveri!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_2=Oh, vado a prenderli!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_poppys=I Papaveri! Assicurati di raccogliere i Papaveri con gli strumenti!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys=Ok, un'ultima cosa... credo. Ooo! Andiamo a cercare delle peonie. Sono come coperte soffici per il terriccio!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_1=Sì, andiamo a esplorare!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_2=D'accordo...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys=Non sono magnifiche? Raccogli delle peonie con lo strumento, poi portamele! Sono il pezzo finale della nostra benda floreale!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_1=Ecco delle peonie!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_2=Oh, vado a prenderle!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_peonys=Non dimenticare! Assicurati di raccogliere le peonie con gli strumenti!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home=Oh! Il mio cestino è stracolmo! E i piedi mi stanno cominciando a formicolare... Penso che sia abbastanza. Torniamo a casa.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_1=Sì, torniamo a casa!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_2=Mi fanno male le gambe da tutto questo camminare :(
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up=È stato bellissimo! Il terreno sembra già un po' più tranquillo, vero? Rifacciamolo presto.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_1=Sì, mi è piaciuto anche a me.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_2=È stato carino, suppongo. Non sono il più grande fan dei fiori.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello=Ehi, come va? Spero tu sia in vena di fiori e pronto ad aiutare i germogli!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello.response_1=Spero lo stesso per te!

# Pumpkingdom - Non-Quest NPCs
skyblock_hub_dialogues.overworld.plains.pumpkingdom.cedric.hello=Se senti odore di bruciato, probabilmente hai il viso troppo vicino al fuoco. Queste patate sono crude.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello=Parla sottovoce, ti prego. Gli spaventapasseri ascoltano. O forse sto perdendo la testa.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello.response_1=Vuoi un amuleto portafortuna a forma di zucca?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.detail_1=No. Assolutamente no.\nSe porto un amuleto portafortuna e fallisce, dovrò cominciare a credere anche a quelli sfigati.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello=Benvenuto, viaggiatore. Sei a Pumpkingdom. Abbiamo zucche famose nel mondo intero.\nPosso fare qualcosa per intrattenerti?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_1=Cantami qualcosa.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_2=Perché si chiama Pumpkingdom?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_3=Sono solo di passaggio.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.verse_1=Oh, zucca, zucca, arancione e splendente,\nIn attesa di una notte spaventosa.\nCon un sorrisetto buffo o una faccia da paura,\nSei la zucca più carina del posto.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.detail_1=Perché dire "Villaggio delle Zucche" suonava come un invito alle razzie.\nInoltre il primo sindaco lo dichiarò con un coltello da intaglio in mano, e nessuno discusse con il coltello.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.maeve.hello=Ciao! Sono Maeve. Mi piacciono i libri e mi piace leggere. Si impara molto da un libro. Tranne a leggere. Imparare a leggere leggendo un libro non ha ancora funzionato con nessuno che ho testato.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.quinn.hello=Non toccare le leve.\nAnzi, toccale. Con delicatezza.\nNon ho la minima idea di cosa facciano, quindi se esplode... Non guardare me!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello=Se sei venuto per le zucche, prendi il sentiero a sinistra.\nSe sei venuto per battute orribili, congratulazioni. Ti sei già perso.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_1=Dimmi una battuta orribile.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_2=Ti lascio fare.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1=Come si ripara una zucca rotta?\nCon una toppa di zucca!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1.response_1=È genuinamente doloroso.

# Pumpkin Towers - Potato Zombies
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce=Psst! Sembri uno che sa usare una pala o una spada.\nQui abbiamo un piccolo problema... I zombi stanno invadendo i miei campi.\nStanno calpestando i raccolti, rosicchiando le recinzioni, e soprattutto mangiando le mie patate!\nPuoi darmi una mano e salvare il raccolto?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response1=Certo! Non ho paura di qualche zombi.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response2=Se proprio ci tieni...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane=Ottimo lavoro, amico!\nSe hai un po' di tempo... Potresti andare a trovare la mia amica Susane?\nSembrava in difficoltà coi ragni attorno alle sue zucche.\nLe daresti una mano?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response1=Andiamo a schiacciare quei ragni!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response2=Terrò le tue zucche al sicuro!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks=Wow, hai proprio fatto vedere a quei mostri chi comanda!\nNon posso credere che ne hai eliminati così tanti\nMagari non se ne andranno per sempre... ma per ora hai fatto davvero la differenza!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks.response=Quando vuoi, aiutare è il mio punto forte!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hows_it_going=Come stanno le cose?\nRiesci a credere che quelle creature abbiano preso possesso del posto così, di botto?\nChe sfiga...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hello=Vuoi sapere un piccolo segreto?\nIl mio vero nome non è Fred.\nLa gente ha cominciato a chiamarmi Potato Fred dopo quella volta che sono rimasto bloccato in un mucchio di patate.\nNon so ancora come me ne sono uscito...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.see_fred=Howdy!\nNon sono solo le zucche a crescere in fretta, anche i parassiti!\nIl mio partner, Potato Fred, potrebbe davvero avere bisogno del tuo aiuto.\nPuoi andare a controllare come sta?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred=AAAHHH!\nRAGNI! RAGNI DAPPERTUTTO!\nStanno rovinando le mie zucche!\nPuoi aiutarmi a sbarazzarmene?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response1=EEK, I RAGNI!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response2=Certo, i ragni non mi spaventano!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders=Hai già eliminato quei ragni?\nHo troppa paura di tornare se non se ne sono andati...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders.response=Ce ne sono ancora alcuni...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.hello=Ah, mi piace vedere le mie zucche fiorire...\nQuei ragni stupidi cercano sempre di rovinare tutto!\nSperiamo che stavolta rimangano via per sempre...

# Plains - Pumpkin Towers - Susane & Kipp
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce=Tu là! Sembri uno che ha senso della giustizia! C'è un certo monellino dispettoso in giro che ruba le mie zucche premiate per i suoi 'progetti'. Devi trovarlo così gli faccio una bella ramanzina, ma giusta! Puoi aiutarmi a catturare il colpevole?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_1=Trovo io quel birichino!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_2=Ok, ti aiuto a vederci chiaro.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going=Hai trovato quel ragazzo e la sua refurtiva? Le mie zucche sono per la festa, non per fare da bersaglio!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going.response=Ci sto ancora lavorando, Susane!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete=Eccolo! Il diavoletto! ...Aspetta, un momento. È una zucca intagliata? Guarda la lavorazione... non l'ha rovinata, l'ha migliorata! Wow, è davvero incredibile. Grazie per averlo portato qui con la sua arte.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete.response=Felice di aver chiarito il malinteso!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce=Susane ti ha mandato a trascinarmi indietro al campo? Oh no... sarà così arrabbiata! Ti prego, non portarmi da lei ancora! Non sono un ladro, sono un artista! Guarda, se le porto un dono di pace... aiutami a trovare il mio coltello da intaglio e creerò qualcosa che le farà cambiare idea.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_1=Trovo il tuo coltello. Vediamo cosa sai fare.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_2=Ok, cerco. Ma non combinare altri guai.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint=L'ho avuto l'ultima volta vicino alle file di zucche principali mentre cercavo una buona tela. Dev'essere lì da qualche parte!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint.response=Ci penso io.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife=L'hai trovato! Mi hai salvato la vita. Faccio presto sono pronto a intagliarle un capolavoro che le farà dimenticare tutte le zucche mancanti!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife.response=Andiamo. Incrociamo le dita!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.hello=Oggi tengo un profilo basso. L'arte richiede concentrazione, sai?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.knife.dont_know=Strano che questo coltello sia abbandonato così. Ha 'Kipp' inciso sul manico. Dovrei restituirglielo.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.hello=Lo senti? È il suono del buon cibo che cuoce. Alla gente di Pumpkingdom piacerà.\nGrazie per tutto il tuo duro lavoro!
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available=Se senti odore di cena, vuol dire che sto ancora vincendo. Per un pelo. Il secchio del carbone è vuoto e molti forni si sono incrinati. Aiutami prima che tutta la Plains cominci a mangiare patate crude.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.help=Posso aiutare.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.plan=Qual è il piano?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.breaking=Perché si rompono i forni?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.why_furnaces_break=Cicli di calore, mani negligenti e un po' di sfortuna. Un momento funzionano, il momento dopo sono incrinati e perdono cenere. Un forno rotto lo gestisco. Una cucina rotta no.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted=Perfetto. Ho bisogno di tre cose, e in fretta. Carbone per mantenere il calore costante, forni per sostituire quelli rotti, e patate così riesco a mettere qualcosa di commestibile fuori dalla porta.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted.response.all=Porto tutto io.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items=Ogni volta che mi giro, qualcuno "controlla" un forno e lascia lo sportello aperto. Portami carbone, forni e patate e trasformo il panico in cena.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.deposit=Ho portato delle forniture.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.working=Ci sto lavorando.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.deposit_thanks=Bene. Nei bidoni e sui carboni. Continuate a portarle.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage=Ce l'abbiamo fatta. I fuochi sono tornati, la fila scorre e la Plains mangerà cibo cotto per il prossimo futuro.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.glad=Contento di aver aiutato.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.save=Un giorno dovremmo cucinare qualcosa insieme!

# Plains - Ruins - Lewis
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available=Le rovine non sono uno scenario. Sono un percorso.\nProva ad allenarti nelle rovine. Potresti aumentare moltissimo la tua mobilità.\nProva a raggiungere Robb che ho visto giocare nelle rovine poco fa.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.accept=Ok. Raggiungo la piattaforma.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.tips=Hai qualche consiglio prima di cominciare?
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.later=Non adesso.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips=Individua il prossimo appoggio prima di saltare.\nVai con calma. Non c'è fretta di arrivare su.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips.response.okay=Capito.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete=Sei ancora qui? Allora non hai ancora raggiunto la cima delle rovine.\nTieni lo sguardo in alto e sii paziente. Prima o poi ce la farai.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.remind=Ricordami dov'è Robb.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.go=Capito. Sto salendo.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location=Da qualche parte vicino alla cima, suppongo. L'ho perso di vista mentre saliva nelle rovine.\nSe senti Robb ridere, sei vicino.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location.response.on_my_way=Ci vado.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete=Sei tornato intero, bene.\nRobb si comportava bene? È intero? A volte ha troppa fiducia lassù, ma mi fido di lui.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.remember=Sì, sta bene
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.useful=Sembra un po' giovane per stare lassù.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools=Sì, è giovane, ma non abbiamo molto da fare qui.\nGioca su queste rovine per tenersi occupato.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools.response.thanks=Ah, capisco.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.after_completion=Quando vedi della pietra rotta ora, dovresti pensare: percorso, copertura, via di fuga.\nUn consiglio molto utile da quando gli Zombi sono diventati più frequenti qui intorno.

# Plains - Ruins - Robb
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached=haha! non ci posso credere che ce l'hai fatta!!!\nbenvenuto in cima! c'è così tanto da vedere da quassù. è divertente giocare nelle rovine, vero?\nti guardavo cadere mentre salivi. è abbastanza divertente vedere la gente provarci.\nlewis era di nuovo tutto serio? forse vuole che torni a casa.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.rough=Un sacco di divertimento!
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.easy=Lewis ammira la tua capacità di muoverti.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.trick=Non ci credo nemmeno io di essere arrivato fin qui.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough=davvero davvero divertente! ahahaha! guarda solo il panorama. goditi tutto.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough.response.laugh=Haha! Sì! Lo vedo!
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy=sono sicuro che lo fa. mi muovo così veloce. sono il migliore a correre quassù.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy.response.okay=Non essere troppo sicuro di te. È pericoloso.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick=la pratica rende perfetti. in futuro sarai più sicuro sulle altezze delle rovine.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick.response.got_it=Capito.
skyblock_hub_dialogues.overworld.plains.ruins.robb.hello=eeehi, come va con il parkour. sono sicuro che stai migliorando.


# Jungle - Treetop Tropics - Nilo & Billy
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.hello=Ehi, come stai? Sei ancora vivo? Bene! Grazie per aver trovato Billy, è fortunato ad essere carino altrimenti potrei averlo trasformato in un tappeto!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction=Oh, catastrofe! Catastrofe assoluta! Il mio gatto, Billy, è sparito di nuovo. È da qualche parte sopra di noi, probabilmente a pianificare la dominazione del mondo o a cercare un uccello da molestare. Puoi aiutarmi a recuperare la bestia prima che decida di vivere nella chioma per sempre?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_1=Che orrore! Vado a prenderlo subito.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_2=Ci dò un'occhiata quando non sono occupato a schivare liane.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_3=Sono molto occupato adesso. La giungla è un disastro oggi!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks=BILLY! Oh, grazie alle stelle! Non posso credere che l'hai davvero trovato! Ha sempre così fame, è come se avesse un buco nero per stomaco. Vado a dargli del pesce prima che cominci a mangiare le tavole della giungla.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_1=Figurati. Sono un professionista del parlar-coi-gatti.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_2=ALTRO PESCE? QUEL GATTO È UN POZZO SENZA FONDO!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking=Come va? Hai trovato traccia del fuggitivo peloso?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking.response=Ci sto ancora. I gatti sono subdoli, e Billy è un vero ninja.

# Billy the Cat
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found=Miao <italic>(Ti guarda con un sorriso compiaciuto e saputo)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found.response=Vieni con me, combinaguai. Torniamo a casa.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1=Miao <italic>(La pancia brontola come un temporale)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1.response=Tieni, un po' di pesce. Smettila di brontolare!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2=Miao <italic>(Ti guarda con aria d'aspettativa)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2.response=Tieni, altro pesce.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3=Miao <italic>(Il brontolìo continua!)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3.response=Questo gatto è un pozzo senza fondo? Ok, pesce!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4=Miao <italic>(Non è per niente impressionato)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4.response=Ecco il quarto pesce. Sul serio, Billy?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5=Miao <italic>(Finalmente sembra soddisfatto)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5.response=Finalmente! Torniamo a casa.


# Jungle - George - Fishy Business
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction=Ah, il delicato tirare la lenza, il brivido assoluto della pesca! La mia passione per la pesca è leggendaria, anche se non riesco a lanciarla da così tanto tempo. La mia famiglia è qui nella giungla, e non la scambierei con tutti gli oceani del mondo, ma oh, come mi manca l'acqua! Devi assolutamente provarci è pura magia!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_1=Ok! Mi hai convinto!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_2=È davvero così bello? Dai, ci provo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_3=Adesso no, George.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch=Come ti stai trovando a pescare? Hai trovato il ritmo? Spero che tu stia facendo delle prese leggendarie!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch.response=Ci sto lavorando, George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit=Quando hai pescato abbastanza, dammeli così posso ispezionarli da vicino!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit.response=Eccoli.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks=Te lo avevo detto che era divertente! Guarda tutti questi bellissimi pesci, hai un vero talento per questo! Grazie per aver condiviso il brivido con me; la pesca è semplicemente fantastica, e ancora di più con gli amici. Peccato che non sono riuscito ad andare al lago anch'io!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks.response=Quando vuoi, George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.hello=Ciao! L'acqua è fantastica, anche nella giungla! Pronto a lanciare la lenza? Ma sai cosa renderebbe tutto ancora meglio?\nPescare con un amico così speciale!


# Jungle - Celia - Bean to Bar
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.hello=Ciao. Il cioccolato è il tuo cibo preferito della giungla? Lo spero!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.come_back_for_sugar=Ciao. Torna da me quando hai dello zucchero e ti mostro come addolcire il cioccolato.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available=Ehi, tu. Vuoi imparare a fare il cioccolato? Bel cioccolato gustoso. Anche se fa male, potresti ricavarne una bella sferzata di energia.\nCominciamo con il cioccolato amaro. Il cioccolato senza zucchero è un'alternativa molto più sana.\nTi do la ricetta, ma devi andare a farlo per conto tuo. Dimmi come va.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_1=Yum! Cioccolato!!!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_2=Ah no, odio il cioccolato.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.in_progress_craft=Come va con la preparazione del cioccolato? Spero che quel cioccolato amaro sia all'altezza delle aspettative.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete=Allora? Dimmi tutto.\nEra amaro? Che effetti collaterali hai avuto?\nTanta gente comincia a scattare in giro dopo aver mangiato cioccolato.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_1=Amaro, ma brillante.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_2=Credo di aver bisogno di acqua.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available=Ciao di nuovo. Vuoi imparare a mettere lo zucchero nel tuo cioccolato? Facciamolo.\nConosci la procedura. Ti do la ricetta, ma devi andare a farlo per conto tuo. Dimmi come va.\nAttenzione: il cioccolato non fa bene, e va sempre consumato con moderazione.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_1=Sì, facciamo altro cioccolato.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_2=Sto cercando di essere attento alla salute, ma ok.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft=Come va con l'aggiunta dello zucchero nel cioccolato? Prima che tu te ne accorga, potresti lavorare verso un impero del cioccolato.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_1=Ce la faccio. È facile.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_2=Non sono molto bravo a fare il cioccolato.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete=Ce l'hai fatta! Cioccolato. Pieno e ricco come speravi, sono sicura.\nOra sii sensato e non iniziare a correre all'impazzata con tutta quella scarica di zucchero.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_1=Non preoccuparti, col cioccolato sono molto maturo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_2=Il crollo post-zucchero farà male.

# Jungle - Treetop Tropics - Non-Quest
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello=Dammi un minuto. Devo controllare queste Fave di Cacao. Forse sono pronte.\nOh aspetta, e queste qui...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello.response_1=Vedo che sei molto occupata adesso.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello=Ho costruito alcune di queste piattaforme quando si sono rotte. Spero davvero che la mia ingegneria sia abbastanza buona da tenerle in piedi.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_1=Hai costruito tutto questo? È impressionante.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_2=Sembri sul punto di svenire.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1=Grazie. Be', non tutto. Ho solo aggiustato i pezzi quando si rompono.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_1=Così tante ringhiere. Preferenza personale?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_2=Paura delle altezze...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_railings=Sì.\n<italic>(Si aggrappa alla ringhiera con entrambe le mani.)</italic>\nLa paura delle altezze porta a misure di sicurezza extra.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_advice=Non prendermi in giro. Non l'ho scelto io, sono fatto così.\nAnche se suppongo che sia colpa mia per aver deciso di lavorare quassù. Vorrei essere un pescatore a terra.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_2=Hai visto a che altezza siamo?! Siamo altissimi, e io ho paura delle altezze! Forse è il mal di quota che si fa sentire.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello=Ehi, tu, vuoi una barzelletta orribile?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_1=Ok. Una barzelletta. Fammi del male.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_2=No grazie. Tengo alla mia pace.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu=Scegli con saggezza. La giungla ha molti predatori, ma nessuno è implacabile quanto i miei finali a sorpresa.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_1=Sparami una barzelletta sulle foglie.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_2=Dammene una sui ragni.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_3=Ok. Rendi il cacao divertente.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_1=Ho provato a lasciare la giungla, ma le liane hanno detto: "No, resta qui."\nQuindi suppongo di essere intrappolato in una rela-zione a lungo termine.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_2=Come si chiamano due ragni appena sposati?\nNeo-tele!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_3=La mia fava di cacao non matura mai in tempo per essere mangiata. È sempre troppo tardi-cioccolato.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.avaru.hello=Ehi! Che bella giornata! Piacere di conoscerti! Non vedo l'ora di vederti in giro!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cressida.hello=GUARDA QUANTO È GRANDE QUEST'ALBERO! È GIGANTESCO! :O\nMi chiedo come fa ad arrivare l'acqua fino in cima!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello=Se vedi un ocelot, non inseguirlo. Ha molta paura di te.\nQuesto consiglio vale anche per le persone.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello.response=Allenerò la mia migliore faccia da indifferente.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.silva.hello=Ehi, guarda dove mi trovo! Sono sotto un albero!\nUna volta mi faceva paura, ma poi ho notato le radici. Sono dei cubi. Quindi matematicamente vedo quest'albero come unidimensionale, perché sto guardando la sua radice cubica.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello=Hai l'aria di uno appena uscito dall'Oak Forest.\nBenvenuto nella giungla, viaggiatore. Dovrai abituarti a scalare gli alberi. Spero che tu non abbia paura delle altezze.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_1=Ottimo. Con le altezze me la cavo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_2=Oh no, non me la caverò bene.
skyblock_hub_dialogues.misc.optimiser_not_unlocked=Ciao! Sono l'Ottimizzatore! Posso potenziare la produzione di tutte le tue risorse.\nSono piuttosto selettivo su chi sono disposto ad aiutare, quindi torna quando avrai progredito di più!

# Shop Dialogues
skyblock_hub_dialogues.shop.blocks.greeting=Salve, non troverai blocchi migliori da nessuna parte! Vuoi dare un'occhiata?
skyblock_hub_dialogues.shop.blocks.greeting.buy=Cosa hai in vendita?
skyblock_hub_dialogues.shop.blocks.greeting.sell=Fammiti vendere qualcosa!
skyblock_hub_dialogues.shop.blocks.greeting.nothing=No, grazie!
skyblock_hub_dialogues.shop.furniture.greeting=Bellissimi mobili per una persona deliziosa! Posso interessarti?
skyblock_hub_dialogues.shop.furniture.greeting.buy=Mostrami cosa hai!
skyblock_hub_dialogues.shop.furniture.greeting.sell=Ho qualcosa da vendere.
skyblock_hub_dialogues.shop.furniture.greeting.nothing=Per ora sono a posto, grazie.
skyblock_hub_dialogues.shop.garden.greeting=Ho tutto il necessario per far fiorire il tuo giardino! Ti interessa?
skyblock_hub_dialogues.shop.garden.greeting.buy=Mostrami cosa hai in vendita!
skyblock_hub_dialogues.shop.garden.greeting.sell=Vorrei vendere qualcosa.
skyblock_hub_dialogues.shop.garden.greeting.nothing=No, grazie!
skyblock_hub_dialogues.shop.misc.greeting=Ti vedo guardare in giro! Cosa ha catturato la tua attenzione?
skyblock_hub_dialogues.shop.misc.greeting.buy=Cosa posso comprare qui?
skyblock_hub_dialogues.shop.misc.greeting.sell=In realtà, ho qualcosa da vendere.
skyblock_hub_dialogues.shop.misc.greeting.nothing=Niente per ora, grazie.
skyblock_hub_dialogues.shop.ore.greeting=Tutti i minerali che il tuo cuore desidera! Vuoi dare un'occhiata?
skyblock_hub_dialogues.shop.ore.greeting.buy=Mostrami i tuoi minerali!
skyblock_hub_dialogues.shop.ore.greeting.sell=Voglio venderti qualcosa.
skyblock_hub_dialogues.shop.ore.greeting.nothing=Non adesso, grazie.
skyblock_hub_dialogues.shop.spawner.greeting=Pronto a far spawnare più mob? Ho proprio quello che ti serve!
skyblock_hub_dialogues.shop.spawner.greeting.buy=Mostrami cosa hai!
skyblock_hub_dialogues.shop.spawner.greeting.sell=In realtà, vorrei vendere qualcosa.
skyblock_hub_dialogues.shop.spawner.greeting.nothing=Forse la prossima volta, grazie.

# Cold Taiga - Ivar - Frozen Harvest
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro=L'inverno ha una presa che non molla, e le riserve di cereali si stanno pericolosamente esaurendo. Devo assicurarmi che tutti rimangano nutriti durante il gelo. Puoi uscire e raccogliermi del grano?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro.response.accept=Certo, ti aiuto! Il villaggio ne ha bisogno.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources=Testa bassa e mani in movimento. Come va con il raccolto del grano?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources.response=Ci sto ancora! Il gelo è duro da tagliare.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro=Felice di rivederti. Hai trovato qualcosa per le riserve?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro.response.yes=Ecco il grano, appena raccolto!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks=Ottimo lavoro. Questo terrà il villaggio sazio per qualche altro giorno. A presto!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks.response=Felice di aiutare!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello=Come va! Non lasciare che il freddo ti entri nelle ossa.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello.response=Alla grande! Mi sto tenendo caldo!

# Cold Taiga - Felix - Winter Warmth
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro=Il freddo si sta davvero facendo sentire stasera, vero? Sto cercando di tenere tutti al caldo, ma stiamo finendo il combustibile per i caminetti. Puoi raccogliermi dei tronchi di abete così possiamo stare caldi?
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro.response.accept=Certo, ti aiuto! Qualsiasi cosa per tenere il villaggio al caldo.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro=Oh, sei tornato! Sei riuscito a trovare dei tronchi di abete? Il freddo si fa davvero sentire qui, e io e la mia famiglia stiamo cominciando ad aver freddo!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro.response.yes=Ecco i tronchi di abete!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks=Perfetto. Grazie mille per il tuo aiuto. Hai davvero un cuore gentilissimo, fa sentire questo posto molto più come casa.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks.response=Felice di aiutare!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello=Ciao! Che piacere vederti. Spero che la tua giornata sia stata meravigliosa quanto lo sei tu!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello.response=Ciao! Stai al caldo!

# Cold Taiga - Felix - Warmth in the Cold
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro=Grazie per averci aiutato a stare al caldo. Ti dispiacerebbe aiutarmi a procurare delle Snowberries, delle Briciole di Corteccia di Abete e dello Zucchero di Lapislazzuli Polverizzato?\nSono risorse rare che si trovano nella Snowy Taiga, ma possono essere preziose per la tua sopravvivenza.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro.response.accept=Le raccolgo io!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro=Hai trovato gli ingredienti che mi servono?\nSi trovano tutti nella Snowy Taiga: le Snowberries preferiscono stare vicino ai cespugli di bacche. Lo Zucchero di Lapislazzuli Polverizzato si forma sulla superficie dei laghi ghiacciati, mentre si scioglie nell'acqua dalla roccia sottostante. Infine, le Briciole di Corteccia di Abete sono le più difficili da trovare, ma dovresti riuscire a trovarle vicino agli abeti.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro.response.yes=Dammi quello che ho!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks=Eccellente! Ho sentito che le Snowberries possono essere molto utili nei Dungeon. Ripristinano la salute e ti danno quel livello di protezione extra!\nPotresti testarmele? Prova a mangiarne un po' mentre esplori un Dungeon e dimmi come funzionano!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks.response=Le provo subito!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress=Hai già provato a mangiare le Snowberries in un Dungeon? Sono curioso di sapere se sono davvero utili come penso!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress.response=Non ancora, vado a provarle!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete=Oh, le Snowberries sono state utili nel Dungeon! Ottimo! Ogni volta che ne mangio una mi sembra di ricevere un bel abbraccio caldo.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete.response=Figurati!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro=Il ghiaccio profondo si è spostato ultimamente, rivelando venature di blu che non dovrebbero esserci. Ho bisogno di Lapislazzuli per la mia ricerca. Puoi raccoglierne un po' usando una varietà di strumenti? Voglio vedere se il metodo di estrazione cambia la risonanza della gemma.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro.response.accept=Certo, ti aiuto a indagare!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress=Come va con la rottura del Lapislazzuli usando strumenti diversi? Qualche vibrazione insolita nella pietra?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress.response=Ci sto ancora!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro=Eccellente. Posso avere quelle gemme di Lapislazzuli che hai rotto con strumenti diversi? Devo confrontare l'integrità strutturale di ogni lotto.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro.response.yes=Eccole!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks=Grazie. Aspetta un secondo mentre le controllo...\n...\nBe', è deludente. La struttura cristallina non è cambiata per niente. Sono identiche. È stato uno spreco di tempo enorme.\nAlmeno abbiamo confermato che la fisica semplice si applica ancora qui e che gli strumenti di legno sono completamente inutili a questa profondità.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_1=Oh, che peccato. La scienza è fatta di tentativi ed errori, no?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_2=Non sono sicuro di cosa ti aspettassi, onestamente.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello=Il ghiaccio racconta storie se ci guardi abbastanza in profondità.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello.response=È vero, davvero...

# Cold Taiga - Sigrid - Feather and Grain
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro=Il gelo morde più a fondo questa stagione, e con il fondo del canyon che trema come fa, dobbiamo guardarci le spalle a vicenda. Sopravviviamo insieme, o non sopravviviamo affatto. Puoi aiutarmi a preparare una buona scorta per il villaggio?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro.response.accept=Mi ci metto! Nessuno deve aver fame.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro=Oh, sei tornato! Avvicinati al fuoco, caro, vedo il freddo sulle tue spalle. Come va la raccolta?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro.response.yes=Ecco il cibo che hai chiesto!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks=Benedetto tu. Questo terrà i piccoli al caldo e il morale degli anziani alto. È il tuo impegno condiviso che impedisce al gelo di raggiungerci il cuore.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks.response=Felice di aver aiutato la comunità!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello=Ciao! C'è sempre un posto caldo e una parola gentile ad aspettarti qui.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello.response=Ciao!


# Cold Taiga - Inga - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.before_unlock=Shiverfield ha sempre fame in questo periodo dell'anno. Se stai cercando un pasto, parla con Sigrid. Io qui ho le mani piene.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro=Attenzione! Non mettere piede lì. Ti si avventerebbero agli stivali come se avessi il grano in tasca.\n\nHo cominciato con poche galline. Giusto abbastanza per tenere i forni in funzione quando il gelo morde più duro.\n\nMa ultimamente? È come se l'inverno non riuscisse a toccarle. La corruzione viola si diffonde, la gente ha fame, e le mie galline si moltiplicano come per prenderci in giro.\n\nSono ovunque. Nei mucchi di neve. Sui tetti. Becchettano sacchi che non possiamo sostituire.\n\nNon posso semplicemente... eliminarle. Sono mie e sono esseri viventi. Le ho allevate io.\n\nTi prego. Parla con Runa alla Guardia di Shiverfield. Lei saprà cosa fare. Ho solo bisogno di una risposta che non mi faccia rivoltare lo stomaco.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_1=Le parlo.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_2=Galline che prendono il controllo di una città. Roba nuova.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.in_progress=Se le vedi per strada, semplicemente... non inseguirle per divertimento, ok? Si fidano delle persone. È la parte peggiore.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete=Le tue mani sanno di piume.\n\n...Non negare. Lo vedo nei tuoi occhi.\n\nHai fatto quello che ti ha detto Runa, vero?\n\nLo odio. Lo odio che abbia senso.\n\nShiverfield ha bisogno di cibo. E di frecce. E l'inverno non si preoccupa di quello che vogliamo.\n\nLa prossima volta che mi dico che posso tenere tutto al sicuro con buone intenzioni, ricordamelo.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_1=Mi dispiace. Non avevamo altra scelta.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_2=Il tuo stormo stava nutrendo il paese, in un modo o nell'altro.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_3=Ti aiuto a ricostruire il pollaio così non succede di nuovo.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.after_completion=Le galline mi piacciono ancora. Mi piace solo Shiverfield di più.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello=Ciao.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello.response=Ciao!

# Cold Taiga - Runa - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro=Inga ti ha mandato. Ho sentito il pollaio prima di vedere te.\n\nGuarda, non mi piace fare questo. Non piace a nessuno qui.\n\nMa le strade sono peggiorate. I cacciatori non tornano più così spesso. La corruzione viola rende il bosco inquietante, come se le ombre ascoltassero.\n\nAbbiamo un paese da sfamare e un paese da difendere dalle cose strane che stanno accadendo.\n\nLe galline significano carne per gli affamati e piume per le frecce. Senza frecce, noi guardie diventiamo un muro di mani vuote.\n\nDovrai abbatterne dieci. Portami dieci piume. Non sprechiamo quello che prendiamo.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_1=Capito. Ci penso io.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_2=Inga non sarà contenta.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_3=Mi assicurerò che aiuti il paese.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.in_progress=Dobbiamo ridurre ancora un po' il numero di galline. Stanno ancora invadendo tutto.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro=Hai quelle piume?\n\nSono molto preziose per la guardia, serviranno a fare molte frecce.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_1=Sì, eccole.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_2=Non mi è piaciuto uccidere quelle galline.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks=Abbondanti. Abbastanza da tenere la guardia rifornita per un po'.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks.response_1=Bene.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.after_completion=Se riesci a tenere Shiverfield nutrita, la tieni in vita. Questo è il lavoro.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello=Stai attento là fuori. La guardia può proteggerti qui vicino, ma nelle profondità della tundra, è responsabilità tua.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello.response=Starò attento.

# Cold Taiga - Kjell - Corrupted Curiosity
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available=Attenzione! Queste galline sono diventate selvagge!\nQualcosa le ha colpite, e mi stanno attaccando. Comportamento molto strano.\nSono Kjell. Sono una specie di scienziato. Amavo la chimica a scuola, ma credo di avere un'idea di cosa stia succedendo.\nTi dispiace procurarmi una di quelle galline corrotte così posso esaminarla meglio?
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_1=Oh no, galline malvagie. Ci penso io!
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_2=Ti aiuto a venirne a capo.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro=Hai quella gallina corrotta? Non vedo l'ora di scoprire cosa causa questa maledizione.\nOh, e qualunque cosa tu faccia, non mangiarla. Sembra un'idea terribile e non ha nessun lato positivo.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro.response_yes=Ho la gallina.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit=Ottimo! Ce l'hai! Vediamo un po' cosa abbiamo qui...\n...\nOh, è viva? Quella roba viola. Non è una roccia.\nBe'... è tutto quello che posso fare. Ho detto che ero bravo con la chimica, non con la biologia.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_1=Viva? Oh caro...
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_2=Immagino che dovremo continuare a cercare
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.hello=Se scopri qualcosa in più su questa roba viola, muoio dalla voglia di saperlo. Non riesco a credere che sia viva!


skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.dungeon_guard.introduce=Woah! Ho sentito dire che sei qui per aiutare?\nAbbiamo un problema enorme giù nelle nostre nuovissime miniere.\nStavamo scavando per estrarre tantissimo prezioso Lapislazzuli dalle riserve sotto i laghi.\nPerò siamo stati sopraffatti! Ci sono tanti mostri e creature. Sembrano volere il Lapislazzuli per sé.\nCi dai una mano?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro=Il calore non è l'unica cosa che ci logora; le stesse fondamenta di questa oasi si stanno spostando. Abbiamo bisogno di arenaria per rinforzare gli ancoraggi prima che la sabbia inghiotta quello che resta della superficie. Posso contare sulla tua forza?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro.response.accept=Ti aiuto a mettere in sicurezza le fondamenta!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro=Calma. Sei riuscito a procurare l'arenaria che ho chiesto per i rinforzi?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro.response.yes=Ho i materiali qui!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks=Questo ci darà un po' di tempo contro la subsidenza. Ogni pietra posata è uno scudo contro la caduta inevitabile. Grazie.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks.response=Felice di aver contribuito a stabilizzare il deserto.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello=Tieni i piedi leggeri e gli occhi all'orizzonte. Il deserto non smette mai di muoversi.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello.response=Starò all'erta, Zahra. Grazie.

# Desert - Unsafe Roads
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro=Le strade stanno diventando pericolose; la sabbia ingoia i segnali più in fretta di quanto riusciamo a posizionarli. Puoi portarmi dell'arenaria così possiamo rinforzare i percorsi?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro.response.accept=Te la procuro.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress=Le dune sono agitate oggi. Ne hai trovata abbastanza? Dobbiamo assicurarci di averne abbastanza per ancorare il sentiero.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress.response=Sto ancora cercando...
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return=Ben fatto. La squadra riferisce che i supporti reggono. La consapevolezza è la nostra migliore difesa qui. Grazie.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return.response=Quando vuoi!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello=Occhi aperti. In questo deserto, se non tieni traccia del pericolo, è il pericolo a tener traccia di te.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello.response=Ehi!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.intro=Ti ha mandato Talib? Bene. Il terreno è morbido qui e le dune avanzano. Hai quell'arenaria?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.response=Eccola.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks=Grazie, questo renderà la strada molto più solida. Il terreno ha meno probabilità di franare con questa in posizione.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks.response=Ottimo!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello=Una bella giornata per costruire, purché il vento non decida di portarsi via i nostri progressi.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello.response=Davvero.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.intro=I tremori stanno facendo tremare le pareti del passaggio. I mattoni di fango aiuteranno a stabilizzare il percorso. Li hai?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.response=Sì, eccoli.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks=Perfetto, sono esattamente quello che ci serviva per attutire le vibrazioni.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks.response=Felice di aiutare.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello=Fai attenzione sulle strade. Il deserto ha il vizio di aprirsi quando meno te lo aspetti.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello.response=Lo farò.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.intro=Senza una base pesante, la sabbia scivola via. Il granito è essenziale per le fondamenta. Ne hai portato?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.response=Ho del granito qui.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks=È del granito di alta qualità! È abbastanza pesante da resistere ai tremori. Grazie.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks.response=Prego.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello=Il deserto può essere impietoso con chi costruisce su terreno superficiale.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello.response=Hai ragione.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.intro=Dobbiamo puntellare le sporgenze prima che crollino. Finalmente un po' di legno per i supporti! Hai preso le tavole di abete?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.response=Sì, tavole di abete come richiesto.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks=Eccellente! Abbiamo rinforzato tutto. Vai ad avvertire Talib.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks.response=Ci vado!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello=Il duro lavoro è l'unica cosa che la sabbia non riesce a erodere.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello.response=Assolutamente.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro=Le giornate si fanno più calde e le notti più incerte. Abbiamo bisogno di riserve per garantire che il villaggio non crolli. Mi aiuti a mettere al sicuro il nostro futuro?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro.response.accept=Posso aiutare con questo.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro=Calma. Ogni fornitura conta quando le sabbie cominciano a muoversi. Hai delle riserve per lo stock?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_1=Sì, le ho.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_2=Certo! Sono sempre felice di aiutare!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.no=Oh scusa! Non adesso!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks=Il lavoro metodico paga. Queste forniture ci terranno in piedi durante le lunghe notti a venire. Grazie.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks.response=Prego.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello=Il deserto non ha pietà per chi non è preparato. Stai attento là fuori.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello.response=Anche tu.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro=Le sabbie in movimento stanno portando alla luce cose che avrebbero dovuto restare sepolte. I percorsi sono invasi dagli Zombi e questo rende i viaggi impossibili.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro.response.accept=Me ne occupo io e libero il percorso.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro=L'aria sembra un po' più leggera con quei mostri spariti. Hai della carne di Zombi? Ho bisogno di una prova che le dune siano più sicure.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_1=Puah, carne in putrefazione. Puoi tenerla se vuoi.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_2=Suppongo di poterne risparmiare un po' per la causa.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon=La minaccia non svanisce mai davvero qui. Torna quando hai ripulito le dune.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_1=Ci siamo! Sta andando bene!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_2=Gli Zombi mi fanno paura D:
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response=Lo faccio.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete=Con il tuo aiuto, abbiamo messo in sicurezza questo tratto di strada. Che squadra potente siamo!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_1=Felice di aver contribuito a mantenere le strade aperte.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_2=Assolutamente d'accordo!
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello=Il deserto nasconde molti pericoli sotto la sua superficie. Stai all'erta.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_1=Ciao.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_2=Spero tu stia bene!
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro=In una terra che cerca di uccidere tutto ciò che è morbido, sopravvive solo chi è più tenace. Il cactus è utile: fornisce acqua, difesa e un pigmento che non sbiadisce sotto questo sole. Portamene un po'.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro.response.accept=Me ne occupo subito.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro=La sabbia si muove di nuovo. Hai il cactus per aiutarci a rinforzare il perimetro?
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro.response.yes=Eccolo.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks=Resisterà quando altre cose appassiscono. È una pianta dura per un mondo duro. Grazie.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks.response=Prego!
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello=Il calore, la sabbia e il tempo, erodono tutto tranne la verità. Oh ehi, stavo parlando tra me e me...
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello.response=Ciao!
skyblock_hub_dialogues.overworld.desert.duneside.azim.hello=Scusa, sono piuttosto occupato adesso. Sto cercando di costruire una turbina eolica. C'è così tanta energia da catturare nel vento. Non vogliamo riscaldare ulteriormente la temperatura del deserto bruciando carbone.
skyblock_hub_dialogues.overworld.desert.duneside.todd.hello=Ehi! Sono Todd!\nNon badare a me, sto solo sorvegliando questa porta per assicurarmi che nessuna delle creature dentro scappi. Questo è il tunnel di fuga di Duneside, ma è stato invaso dalle creature.\nSe vuoi aiutare, Sunny è in fondo al tunnel di fuga. Temo che stia faticando a ripulirlo da sola.\nNon puoi passare da qui, quindi dovrai trovare l'altra estremità in fondo a Duneside.
skyblock_hub_dialogues.overworld.desert.duneside.bashara.hello=Non calpestare la sabbia più scura. Credo ci sia qualcosa di misterioso sotto.
skyblock_hub_dialogues.overworld.desert.duneside.corvin.hello=Non ricordo queste pietre qui. Spero proprio che il soffitto non stia cedendo.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello=La sete ci fa soffrire. Vendo qualcosa che aiuta, anche se tutti la odiano.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_1=La odiano?
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_2=Piacere di conoscerti! Sono solo di passaggio.
skyblock_hub_dialogues.overworld.desert.duneside.derya.detail_1=Vendo acqua di cactus. Non è acqua normale. È un po' più dolce direi.\nTutti la temono perché non sono molto bravo a togliere le spine del cactus.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello=Dammi la mano. Posso leggere il tuo futuro...
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_1=Ok. Leggi il mio futuro.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_2=No grazie.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1=Vedo tre forme.\nUn cactus. Una porta. E uno zombi molto seccato.\nQuindi immagino che il tuo futuro comprenda tutte queste cose.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_1=Una porta?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_2=Uno zombi seccato?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_3=È una stupidaggine.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_doorway=Purtroppo non riesco a leggere oltre. Ho solo visto una porta nella mia visione. Forse diventerà una porta molto importante per te.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_zombie=Haha! Evidentemente farai arrabbiare uno zombi in futuro.\nNon ho mai visto uno zombi mostrare alcuna emozione, quindi devi davvero farlo innervosire.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_nonsense=Certo che lo è.\nLe sciocchezze sono più leggere da portare della certezza. Sono qui solo per tirare su il morale della gente.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello=Ugh, la sabbia è disgustosa. Continua a entrarmi in bocca.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello.response_1=Perché stai così vicino alla sabbia?
skyblock_hub_dialogues.overworld.desert.duneside.vesper.detail_1=Ho dei posti dove devo andare! Non lascerò che la sabbia si metta in mezzo.
skyblock_hub_dialogues.npc_name.devin=Devin
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello=Gli sviluppatori di questo gioco dicono che è difficile continuare a inventare così tanti dialoghi per diversi NPC, quindi ne hanno copiati e incollati alcuni.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_1=Che pigrizia.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_2=Non l'ho notato. Terrò d'occhio.
skyblock_hub_dialogues.overworld.desert.duneside.dungeon_guard.introduce=Ehi! Riesci a crederci! Il tunnel di fuga di Duneside è stato invaso da creature malvagie!\nIl tunnel di fuga è fondamentale per la nostra sopravvivenza. Molte forti tempeste di sabbia seppelliscono l'ingresso principale di Duneside, e il tunnel di fuga è il nostro unico piano B!\nSono stato autorizzato a usare un nostro vecchio sistema per allagare il tunnel con la Lava per aiutare a sterilizzarlo. Sono già senza fiato solo per essere venuto fin qui, quindi non credo sia una buona idea che lo faccia io.\nTe la senti?

# NPC Names
skyblock_hub_dialogues.npc_name.alder=Alder
skyblock_hub_dialogues.npc_name.thorne=Thorne
skyblock_hub_dialogues.npc_name.bram=Bram

# Alder Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.before_unlock=Giornata intensa. Alberi da curare, legno da lavorare. Torna più tardi se hai bisogno di qualcosa.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available=Hai aiutato Ronan a riparare i danni di quei tremori, vero? Ottimo lavoro. Ma non possiamo continuare a tappare crepe ogni volta che il terreno decide di muoversi. Ci stavo pensando... le querce antiche hanno resistito a cose peggiori. Le loro radici si diffondono larghe, si piegano con la terra. Forse possiamo imparare da loro. Vuoi aiutarmi a testare qualcosa?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.what_thinking=A cosa stai pensando?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.got_time=Ho tempo. Di cosa hai bisogno?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.not_now=Adesso no, scusa.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation=Io e Bram stiamo discutendo di fondamenta flessibili, strutture che si muovono *con* il terreno invece di incrinarsi contro di esso. Il bosco lo fa già. Ogni volta che il vento colpisce la chioma, le radici assorbono la forza. Se riusciamo a replicare quel principio... be', la prossima volta che qualcosa trema, forse gli edifici si piegano invece di rompersi.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.how_help=Come posso aiutare?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.complicated=Sembra complicato.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.think_about=Ci penso su.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response=È più semplice di quanto pensi. La natura ha già risolto il problema. Dobbiamo solo osservare e adattare. Inizia guardando la Quercia Antica, le sue radici reggono da decenni. Lì c'è la risposta.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.im_in=Ok, ci sono.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.come_back=Lasciami tornare su questo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions=Perfetto. C'è qualcuno con cui dovresti parlare prima: Thorne. È un ricercatore di alberi che studia la Quercia Antica da settimane. Ha montato un campo vicino ad essa. Se qualcuno capisce come quelle radici restano stabili durante i tremori, è lui. Vai a trovare Thorne e vedi cosa ha imparato.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions.response.find_him=Lo trovo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active=Thorne è ancora alla Quercia Antica, a studiare quei sistemi radicali. Vai a parlargli, spiega meglio di me.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active.response.on_way=Ci vado.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return=Sei tornato. Cosa hai visto?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.roots_web=Le radici si diffondono ovunque come una rete.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.big_tree=È solo un albero grande.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.correct_observation=Esatto. Una rete. Ogni radice sostiene le altre. Quando il terreno si sposta, l'intera rete si piega insieme, nessun punto di cedimento singolo. È quello di cui gli edifici hanno bisogno. Non blocchi rigidi che si incrinano sotto pressione, ma supporti interconnessi che distribuiscono la forza. Bram può progettare la struttura a griglia, ma avremo bisogno di materiali. Tanti.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.playful_correction=Guarda meglio la prossima volta. Quel "solo un albero grande" ha sopravvissuto a secoli essendo più intelligente di noi. Le sue radici si diffondono larghe e profonde, quando il terreno si muove, l'intera rete si piega. Questo è il segreto. Comunque, ne hai visto abbastanza. Adesso abbiamo bisogno di materiali per costruire qualcosa di simile.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions=Ecco cosa ci serve: prima di tutto, raccogli germogli di quercia. Non quelli piantati, naturali. Voglio studiare i loro schemi radicali iniziali e usarli come ammortizzatori viventi attorno alle strutture chiave. Nel frattempo, avremo bisogno di componenti lavorati. Bram avrà bisogno di lastre di quercia. Distribuiscono il peso meglio dei blocchi interi. E recinzioni di quercia. Creeranno supporti a griglia flessibili, come radici che si intrecciano. Puoi lavorare su tutto questo ai tuoi ritmi. Torna quando hai i germogli e consegna i pezzi lavorati a Bram.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.got_it=Capito. Germogli, lastre, recinzioni.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.why_saplings=Aspetta, perché i germogli?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.lot_crafting=È un bel po' di crafting.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_explanation=Gli alberi giovani si adattano più in fretta. Se li piantiamo vicino alle fondamenta, le loro radici cresceranno naturalmente nella rete di supporto. Inoltre, studiare la loro crescita iniziale ci dice come modellare le griglie di legno. Strutture vive e costruite che lavorano insieme, questo è l'obiettivo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.workload_acknowledgment=Lo è. Ma se vogliamo che funzioni, dobbiamo farlo bene. Prenditi il tempo che ti serve. Il bosco non ha fretta, e nemmeno noi.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check=Come va con la raccolta? Ho bisogno di quei sedici germogli di quercia quando puoi. E non dimenticare che Bram aspetta le lastre e le recinzioni.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.working_on_it=Ci sto ancora lavorando.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.remind_me=Ricordami cosa ti serve.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.requirements_reminder=Sedici germogli di quercia per me. Sessantaquattro lastre di quercia e trentadue recinzioni di quercia per Bram. Tutto in quercia.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered=Hai i germogli! Fammi vedere questi. *(li esamina)* Bei esemplari, sistemi radicali sani che iniziano a formarsi. Si integreranno perfettamente con i supporti a griglia una volta che Bram finisce la costruzione. Ottimo lavoro.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.what_do=Cosa ne farai?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.happy_help=Felice di aiutare.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.planting_strategy=Li pianterò strategicamente attorno ai perimetri degli edifici. Man mano che crescono, le loro radici creeranno rinforzi naturali, fondamenta viventi che si piegano con il terreno. Combinate con i supporti in legno di Bram, avremo un sistema ibrido. Il meglio di entrambi i mondi.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram=I germogli sono perfetti. Ora aspettiamo solo che Bram riceva i suoi materiali. Hai già consegnato le lastre e le recinzioni a lui?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.working=Ci sto lavorando.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.not_yet=Non ancora.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete=Hai fatto tutto quello che ti abbiamo chiesto e anche di più. Bram ha già iniziato ad assemblare la struttura a griglia e ho piantato i germogli attorno alle strutture critiche. Quando arriverà il prossimo tremoto, e arriverà, questo villaggio non si terrà insieme e basta. Si adatterà. Ci hai aiutato a costruire qualcosa che impara, qualcosa che dura. Il bosco fornisce, ma sei stato tu a fare in modo che noi ascoltassimo. Grazie.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.will_work=Funzionerà davvero?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.glad_help=Felice di aver aiutato.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.another_tremor=Cosa succede se c'è un altro tremoto?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.confidence=Ci credo. I principi sono solidi, la natura li usa da millenni. La maestria di Bram è affidabile. E tu ci hai dato esattamente quello di cui avevamo bisogno. Se il terreno trema di nuovo, saremo pronti.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_readiness=Allora vedremo se la nostra ingegneria regge. Ma anche se non dovesse reggere, avremo imparato qualcosa. Così funziona il progresso: osserva, adatta, migliora. Il bosco lo insegna ogni stagione.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion=Le fondamenta flessibili reggono bene finora. Nessun tremoto ancora, ma quando arriveranno, saremo pronti. Sto ancora curando i germogli, crescono bene. Grazie ancora per il tuo aiuto.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.good_hear=Bello sentirlo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.other_projects=Ci sono altri progetti?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_projects=C'è sempre qualcosa da migliorare. Ma per ora, mi concentro su questo. Il bosco fornisce, io mi limito ad aiutarlo.

# Thorne Dialogues
skyblock_hub_dialogues.overworld.oak_forest.thorne.before_quest=Oh! Ciao. Sono Thorne, dendrocronologista. In parole più semplici, ricercatore dell'età degli alberi. Sto documentando l'architettura radicale della Quercia Antica. Un esemplare affascinante. Sono qui da quasi tre settimane e scopro ancora nuovi schemi di ramificazione!
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction=Ti ha mandato Alder? Eccellente! Ti ha chiesto di spiegarti le mie scoperte, vero? Allora sei nel posto giusto. Questa quercia *(indica l'albero enorme)* ha più di 300 anni, e il suo sistema radicale è assolutamente straordinario. Vedi come le radici si diffondono verso l'esterno in questa griglia intrecciata? Ogni radice primaria si ramifica in secondarie, che si ramificano in terziarie... crea ridondanza. Se una sezione viene danneggiata o sollecitata, il carico si distribuisce sull'intera rete. Durante quel tremoto della settimana scorsa, ho osservato il terreno spostarsi, si potevano davvero *vedere* le radici piegarsi, assorbendo il movimento. L'albero non ha quasi oscillato. Il segreto è questo: flessibilità più interconnessione uguale stabilità.
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.roots_web=Quindi le radici funzionano come una rete?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.help_buildings=Come aiuta gli edifici?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.incredible=È incredibile.
skyblock_hub_dialogues.overworld.oak_forest.thorne.web_confirmation=Esattamente! Una rete tridimensionale che si muove come un organismo unico. Nessun punto di cedimento singolo. Se Alder e Bram riescono a replicare quel principio con supporti in legno, gli edifici sopravvivranno ai tremoti molto meglio di quanto potrebbero fare rigide fondamenta in pietra. La natura perfeziona questo design da milioni di anni, noi stiamo solo prendendo in prestito il progetto.
skyblock_hub_dialogues.overworld.oak_forest.thorne.buildings_explanation=Ah! È lì che entra in gioco il genio di Alder. Vuole costruire strutture di supporto che imitino questa rete radicale: griglie di legno interconnesse che possono piegarsi sotto la forza invece di incrinarsi. Aggiungi germogli viventi attorno al perimetro, e man mano che crescono, le loro vere radici si integreranno con le strutture costruite. Ingegneria ibrida. È un'idea geniale, davvero.
skyblock_hub_dialogues.overworld.oak_forest.thorne.enthusiastic_response=Vero? Potrei studiare quest'albero per anni e imparare ancora qualcosa di nuovo ogni giorno. Ma Alder ha bisogno di applicazioni pratiche, non solo di osservazioni accademiche. Vai a dirgli quello che hai visto: la struttura a rete, la flessibilità, la distribuzione del carico. Saprà cosa farne.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1=Alder ha trovato utili le mie osservazioni? Spero di sì. Gli alberi hanno tanto da insegnarci sulla resilienza e sull'adattamento.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.working_on_it=Ci sta lavorando.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.what_else=Cos'altro hai imparato?
skyblock_hub_dialogues.overworld.oak_forest.thorne.other_learnings=Oh, da dove comincio? Gli schemi degli anelli di crescita suggeriscono che quest'area ha subito un'attività sismica significativa circa 80 anni fa, molto peggiore del tremoto della settimana scorsa. Eppure l'albero è sopravvissuto. Sto anche monitorando le reti fungine nel suolo, che collegano più alberi sottoterra, condividendo nutrienti e informazioni. Il bosco è molto più interconnesso di quanto la maggior parte delle persone si renda conto.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion=Ho sentito che Alder e Bram hanno finito le fondamenta flessibili! Usare la mia ricerca sulle radici per l'ingegneria pratica, mi sento onorato. Il bosco provvede davvero, non è così?
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.thanks=Grazie per il tuo aiuto.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.studying_now=Cosa stai studiando adesso?
skyblock_hub_dialogues.overworld.oak_forest.thorne.acknowledge_thanks=Figurati! È raro che la mia ricerca abbia applicazioni pratiche immediate. Di solito pubblico articoli che leggono altri tre dendrocronologisti. È stato... rinfrescante.
skyblock_hub_dialogues.overworld.oak_forest.thorne.current_research=Sto esaminando adesso gli schemi di erosione della corteccia. Cerco di correlarli con i dati meteorologici storici. Non è così emozionante come i sistemi radicali a prova di terremoto, lo ammetto, ma è comunque prezioso per capire la storia del bosco.

# Bram Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.before_quest=Sto lavorando. Torna se ti manda Alder.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.quest_accepted=Alder ti ha menzionato? Bene. Fammelo sapere quando hai i materiali pronti.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages=Alder mi ha parlato del piano delle fondamenta flessibili. Idea intelligente. Mi occupo io della costruzione della griglia, ma ho bisogno di materiali precisi. Sessantaquattro lastre di quercia e trentadue recinzioni di quercia. Le lastre distribuiscono il peso senza incrinarsi. Le recinzioni creano supporti intrecciati. Portali quando sei pronto.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.get_crafted=Le vado a craftare.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_slabs=Perché le lastre invece dei blocchi interi?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_fences=Perché le recinzioni?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.slabs_explanation=I blocchi interi sono rigidi. Il rigido si rompe. Le lastre sono più sottili, si comprimono leggermente sotto la forza, poi ritornano. Flessibilità senza cedimento. È quello che ci serve.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_explanation=Le recinzioni si intrecciano. Un palo si collega al successivo. Quando una forza colpisce la rete, si diffonde su tutti i punti di connessione. Nessun singolo pezzo sopporta il carico completo. Stesso principio delle radici degli alberi. Solo legno al posto del suolo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials=Ho ancora bisogno di quelle lastre e recinzioni. Prenditi il tempo che ti serve. Preferisco aspettare qualcosa di qualità piuttosto che affrettare un lavoro scadente.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.almost_done=Quasi finito.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.remind=Ricordami cosa ti serve.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.requirements_reminder=Sessantaquattro lastre di quercia. Trentadue recinzioni di quercia. Tutto in quercia.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.still_need_fences=Ho ancora bisogno delle recinzioni. Portale, e possiamo cominciare a costruire.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered=Le recinzioni. *(ne testa una)* Giunti solidi. Formeranno la griglia. Ottimo lavoro.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.everything=Hai ora tutto quello che ti serve?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.thanks=Grazie.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.have_everything=Con le lastre e le recinzioni, sì. Alder si occupa dei germogli. Io mi occupo della costruzione. Torna da Alder quando sei pronto.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_alder=I materiali ci sono. Comincio l'assemblaggio. Parla con Alder, vorrà finalizzare il piano.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion=La griglia è installata. Le fondamenta reggono. Un lavoro solido dura.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.good=Bello sentirlo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.hold_tremor=Pensi che reggerà durante un tremoto?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.confident=L'ho costruito bene. Ho usato i materiali giusti. Reggerà.

# Ring The Bell
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.ring_the_bell.investigate=Tiri la campana con decisione. Suona chiaro e limpido.\nCampana diurna. Silenzio diurno.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.hello=La campana è ferma.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.locked=Scusa, non riesco a fare tutta la cosa del 'discorso di benvenuto'.\nSe Cubit non ti ha ancora mostrato la piazza, inizia da lì.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.in_progress=Prova la campana nella piazza, poi chiedi a Levi, Sandy, Liora e Lee se hanno sentito qualcosa di notte.\nPoi torna da me.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello=Ehi.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available=Ehi. Sei il nuovo arrivato che Cubit stava portando in giro, giusto? Bene. Allora hai orecchie fresche.\nAscolta... hai sentito la campana di notte?\nNon il suono diurno. Non quello allegro. Intendo il tipo che ti fa cadere lo stomaco.\nContinuo a svegliarmi per quel suono. E quando corro fuori... niente.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.bell_at_night=La campana del paese? Di notte?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.dream=Forse era un sogno?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.what_do=Cosa devo fare?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request=Vai nella piazza e prova la campana. Poi chiedi a qualche persona se hanno sentito qualcosa di strano dopo buio.\nLevi e Sandy erano con Cubit quando sei arrivato, giusto? Inizia da loro. E parla anche con Liora e Lee.\nSe nessun altro l'ha sentita... allora il problema sono io. Ma devo saperlo.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.on_it=Ok. Chiedo in giro.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.why_me=Perché chiederlo a me?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.are_you_ok=Stai bene?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.why_you=Perché non mi devi una bugia confortante.\nChi ti conosce cercherà di essere gentile. Chi non ti conosce ti dice solo quello che ha sentito.\nE ho bisogno della verità.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.are_you_ok=Sto... reggendo.\nVai ad ascoltare tu stesso. Se mi sbaglio, voglio sbagliarmi di proposito, non per caso.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete=Allora. Nessuno l'ha sentita.\nQuesto è... un sollievo. E anche no.\nQuando succede di nuovo, cercherò di ricordare questa sensazione. Che là fuori può essere tranquillo, anche se la mia testa è rumorosa.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.not_alone=Non sei solo in questo.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.something_else=Forse è qualcos'altro, non la campana.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.tell_me=Se succede di nuovo, dimmelo.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_not_alone=...Grazie. Non sempre ricordo di poter chiedere aiuto.\nCi sto provando.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_something_else=Forse.\nA volte il suono viaggia in modo strano nel legno. Attraverso le radici.\nA volte senti una cosa reale, solo non dove pensi che sia.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_tell_me=Lo farò.\nE se sprint fuori di notte di nuovo... almeno avrò un motivo oltre al panico.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello.after_ring_the_bell=Ehi. Grazie ancora per aver controllato.\nSe la campana dovesse davvero suonare, probabilmente sarai il primo a saperlo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked=La campana di notte...? Mmm.\nSento tante cose di notte.\nLa mia coperta. Il mio stomaco. Il vento.\nUna volta ho sentito un biscotto che mi chiamava per nome. Si è rivelato essere... io. Che chiamavo il biscotto.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.no=Quindi non l'hai sentita?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.worried=Chris è preoccupato. Riesci a pensare a qualcosa?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.nope=No. Se la campana suonasse di notte, mi sveglierei.\nA meno che non fosse molto educata. Allora probabilmente ci dormirei sopra.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.idea=A volte i suoni rimbalzano.\nCome... sai quando tocchi una tazza e continua a cantare?\nLo fa anche il legno.\nDi' a Chris di bere dell'acqua. E magari di fare un pisolino.\nI pisolini risolvono la maggior parte delle cose.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked=La campana? Adoro la campana!\nMa di notte? No.\nSe suonasse, sarei fuori all'istante tipo: 'CHI STA FACENDO UNA FESTA?'\nDi notte si sentono soprattutto i grilli e Levi che russa.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.weird=Quindi non hai sentito niente di strano?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.chris=Chris continua a svegliarsi per quel suono.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.nothing=Niente che suoni come una campana. A volte sento un piccolo *tic tic* come ghiande che battono sul tetto.\nPuò sembrare più nitido del solito.\nForse Chris ha un problema di ghiande.\nO un problema di tetto.\nO un problema di ghiande sul tetto!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.concern=Povero Chris.\nÈ il tipo di persona che sente un suono strano e subito cerca di portarlo con sé per tutti.\nDigli che il villaggio è tranquillo. E che lo accompagno a casa se si spaventa.\nAnzi no. Lui accompagnerà me. Mi distraggo.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked=La campana è onesta.\nSuona quando le mani la tirano, e quando il vento la scuote.\nMa il bosco può fare la sua musica.\nLe radici si muovono. I rami si assestano. Il legno vecchio sospira.\nSe Chris sente un suono che nessun altro sente... potrebbe essere perché sta ascoltando troppo intensamente.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.no=Quindi non l'hai sentita neanche tu?
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.what_sound=Qualche idea su cosa potrebbe suonare come una campana?
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.no=No. Non la campana.\nMa sento il villaggio assestarsi di notte.\nCome una casa che respira. Come il terreno che espira.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.what_sound=Le ghiande possono farlo.\nDue gusci che si toccano nel ritmo giusto. Una sola che rotola in un canale.\nI piccoli suoni diventano nitidi quando hai paura.\nDi' a Chris che la paura fa ottime orecchie e pessime conclusioni.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked=Di notte? Nessuna campana.\nE ne sono abbastanza certo.\nQuando la campana suona, gli animali reagiscono. I cani drizzano le orecchie. Gli uccelli si spaventano. Anche i gatti interrompono i loro schemetti.\nSe la campana suonasse e nessuno se ne accorgesse, avremmo un villaggio pieno di fauna più calma del mondo.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.imagining=Quindi pensi che Chris se lo stia immaginando?
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.notice=Cosa hai notato di notte?
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.imagining=Penso che Chris sia stanco.\nE i cervelli stanchi cuciono il nonsense in schemi.\nNon vuol dire che si stia inventando tutto di proposito.\nVuol solo dire che ha bisogno di dormire più che di risposte.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.notice=Gufi. Vento. Il tipo di silenzio che ti fa sentire i tuoi stessi passi.\nA volte si sente un ronzio se stai vicino al legno vecchio abbastanza a lungo.\nNon una campana. Più come... un ricordo di una.
skyblock_hub_dialogues.overworld.oak_forest.liora.hello=Saluti, viaggiatore. Le querce antiche sussurrano del tuo arrivo, e le loro voci mi portano conforto in questo vasto bosco. Cosa ti porta ad ascoltare con noi?
skyblock_hub_dialogues.overworld.oak_forest.lee.hello=Ehi, ti ho visto zigzagare tra i cespugli. Gli scoiattoli ne parlavano. Tutto bene là nel bosco?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro=Se hai un momento, potresti aiutarmi a rifornire? I costruttori lavorano tutto il giorno, e una pentola vuota non fa bene a nessuno.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.ill_bring=Ti porto della zuppa.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.why=Perché zuppa di barbabietole?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.accepted=Grazie. Ho bisogno di sedici ciotole per tenere la fila in movimento.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup=È facile da preparare in grandi quantità, facile da portare e ti riscalda dall'interno. Il semplice funziona quando devi sfamare un intero insediamento.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup.response.ill_bring=Ti porto della zuppa.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro=Come va? Ho bisogno di sedici ciotole per tenere la fila in movimento.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro.response.yes=Eccole.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks=Perfetto. Questo terrà tutti in forze. Grazie. Passa di nuovo se vuoi una ciotola calda.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks.response=Felice di aiutare.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.hello=Ciao. Vuoi una ciotola calda?

# Hungry Hands (Potato Towers)
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available=Fermo. Potato Towers non è un mercato. È un muro con una dispensa dietro. E ultimamente la dispensa ha messo le gambe.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.zombies=Di nuovo gli Zombi?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.accept=Se qualcuno ruba, lo trovo.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.decline=Non sono affari miei.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.zombies_clarification=Se fossero Zombi, sarei contento. Gli Zombi non discutono. Non piangono. Non ti guardano negli occhi e ti chiedono perché tu abbia patate e loro no.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation=Sono stato creato per difendere questo posto dai morti. Questo era il patto. Ma i vivi continuano a testare i cancelli. Mani affamate, piedi veloci e una dozzina di scuse. Ho bisogno che tu scopra chi lo fa e mi porti qualcosa di concreto. Nomi. Uno schema. Qualcuno a cui danno retta.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.start=Da dove comincio?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.handle=Me ne occupo io.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.starting_point=Il vicolo dietro i negozi. Tre facce continuano a comparire vicino ai carretti: Tess, Joss e Perrin. Parla con loro. Scoprirai chi tira le fila.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check=Se vuoi fermare un furto, fallo con i fatti. Parla con Tess, Joss e Perrin. Poi torna.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.on_it=Ci penso io.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.remind=Ricordami chi devo cercare.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.reminder=Tess, Joss e Perrin. Tre nomi. Una storia. Portami la verità.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution=Ho appena parlato con Ceryn. Non è un criminale. Non è un santo. Solo qualcuno di cui la gente si fida.\nRubare è sbagliato. Non lo negherò.\nMa non capivo quanto fosse grave là fuori. L'ombra di Pumpkingdom arriva più lontano dei nostri cancelli.\nEcco cosa succederà. I cancelli rimangono chiusi. Ma farò finta di non notare un sacco che non è mio. E comincerò a spingere per razioni adeguate che non richiedano di nascondersi.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.fair=È... giusto.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.open=Perché non apri i cancelli?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.sooner=Avresti potuto farlo prima.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.why_not_open=I cancelli aperti invitano qualcosa di più della fame. Invitano il panico. E gli Zombi. Posso tenere una linea, ma non posso tenere una folla in tumulto.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.admission=Sì. E avrei dovuto fare domande prima di cominciare a contare le patate mancanti come se fossero frecce. Sto imparando.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.after_completion=Se vedi qualcuno fissare un carretto troppo a lungo, non presumere che sia un ladro. A volte stanno solo calcolando se il cibo vale la vergogna.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first=Se ti ha mandato Garran, puoi smettere di fissarmi. So come sembra.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.stealing=Stai rubando da Potato Towers?
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.hurt=Non sono qui per farti del male.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.started=Dimmi chi ha cominciato.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.direct_question=Rubo tempo. Rubo calore. Rubo un momento in cui il mio stomaco non urla. Le patate sono solo la forma che prende.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hint=Se cerchi quello che la gente segue, trova Ceryn. Non un capo. Una bussola. Accampato fuori dalla strada dove le torri smettono di fare ombra.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first=Mi trascini ai cancelli? Ok. Fallo. Almeno dentro le mura ci sono le luci.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.why=Perché rubare qui?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.behind=Chi c'è dietro?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.truth=Posso aiutarti se mi dici la verità.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.contrast=Perché qui l'aria sa di cibo cotto. Da Pumpkingdom, sa di pietra umida e cose morte. La gente non ruba perché è divertente. Ruba perché è vicino.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hint=Ceryn. Quello che cerchi. Non facciamo un passo senza chiedere cosa farebbe Ceryn. Soprattutto perché Ceryn pensa prima di muoversi.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first=Se sei venuto per le patate, sei in ritardo. I pochi avanzi di cibo che avevamo sono finiti.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.following=Sto cercando chi seguite.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.stop=Smetti di rubare.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stop_response=E poi? Smetto di avere fame perché hai detto una frase? Facciamo quello che serve per sopravvivere. Parla con Ceryn se vuoi sapere di più.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hint=Trova Ceryn al campo. Ceryn odia anche il rubare. Dice che ci rende più piccoli. Ma Ceryn si rifiuta anche di lasciare che la gente muoia di fame.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first=Garran pensa che io sia un leader. Non lo sono. Sono solo quello su cui la gente fissa gli occhi quando stanno per fare qualcosa che non si può disfare.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.reason=Dicono che sei tu il motivo per cui rubano.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.starving=Potato Towers ha abbastanza. Voi state morendo di fame.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.escort=Vieni con me. Parla con Garran.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.framing=Rubano perché hanno fame. Potato Towers ha una montagna di patate e un fossato di regole. Non è giustizia. Ma il furto è comunque furto.\nCammina con me. Glielo dirò in faccia. Se Garran vuole chiamarla crimine, bene. Ma voglio che capisca cosa sta difendendo.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.escort_start=Parliamo con Garran. Vieni con me. Voglio una conversazione, non una rivolta.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hello=Se sei qui per accusarmi, risparmia il fiato. Faccio quello che devo per sopravvivere.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hello=Ti sei perso? Purtroppo non posso offrire molte razioni.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hello=Stai attento qui intorno. La gente non è amichevole quando ha fame.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello_before_quest=Ciao. Anche tu hai fame?\nStiamo lavorando insieme per vedere quante razioni riusciamo a ottenere da Potato Towers. È quello che dobbiamo fare per sopravvivere.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello=Io e le guardie ci intendiamo meglio. Riusciamo ad andare avanti, grazie al tuo aiuto.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available=Stiamo organizzando un pasto condiviso per i civili di Pumpkingdom. Dopo il crollo, una tavola calda vale più di una celebrazione.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.whats_wrong=Perché sei così teso per questo?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.need_help=Di cosa hai bisogno da me?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.later=Torno più tardi.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation=Pumpkingdom non è più la stessa da quando è crollata. Alcuni hanno perso le case. Altri le cucine. Puoi ricostruire la pietra, ma la fame fa sparire le persone in silenzio.\nIo e Rhea stiamo mantenendo la serata semplice: qualcosa di sostanzioso, niente di sprecato, e abbastanza messo da parte così la Plains non lo sente domani.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.what_do_you_need=Ok. Di cosa hai bisogno da me?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.wasting_food=Perché aiutare Pumpkingdom?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup=Perché sono ancora i nostri vicini. E perché la parte più difficile dopo un crollo non è la macerie, sono le settimane in cui smetti di aspettarti di essere sfamato.\nPossiamo dargli una buona notte senza trasformare la dispensa della Plains in una promessa che non possiamo mantenere.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup.response.tell_me=Giusto. Qual è il piano?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.what_i_need=Parla prima con Rhea. È lei a decidere cosa va alla gente e cosa razionare per dopo. La trovi al piano di sopra.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions=Parla con Rhea prima di raccogliere qualcosa. Sta coordinando la cena di stasera.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.on_it=Ci penso io.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.remind=Ricordami.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions_reminder=Trova Rhea al piano di sopra. Prendi la lista. Seguila alla lettera.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder=Come va con la raccolta delle forniture per il pasto di Pumpkingdom?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.deposit_potatoes=Ho delle patate da mettere in riserva.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.working=Ci sto ancora lavorando.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.potatoes_delivered=Bene. Porto queste patate in magazzino.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report=Questo è l'ultimo pezzo che ci mancava. Pumpkingdom mangerà, la Plains rimarrà rifornita per un po'. Grazie.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.good=Felice di aver aiutato.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.close=Non mi rendevo conto di quanto si rischiasse.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.close_followup=La maggior parte delle persone non lo sa. Ecco perché lavoro così a stretto contatto con Rhea per mantenere le scorte per le stagioni più dure.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.after_completion=Se vedi qualcuno di Pumpkingdom che sembra perso, indirizzalo verso la tavola. Lascia che abbia un piatto pieno.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.before_quest_started=Se sei qui per il pasto di Pumpkingdom, non stare lì impalato. O porti qualcosa alla tavola o togliti di mezzo. Se sei qui per lavorare, parla con Nolan.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro=Nolan ti ha mandato. Bene.\nStasera sfamiamo i civili di Pumpkingdom. Dal crollo, alcuni di loro vivono di quello che riescono a scambiare, razziare o allungare. Stiamo dando loro una buona cena senza mettere a rischio le razioni della Plains.\nPorta le patate a Nolan da mettere in riserva. Portami 64 zucche per la cena di stasera.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.why_pumpkins=Perché le zucche per la cena?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.who_wasting=Stanno davvero così male?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.got_it=Capito. Torno presto.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.why_pumpkins_followup=Siamo in stagione delle zucche adesso, e l'offerta è buona. Non si conservano a lungo e sono molto stagionali.\nLe patate si conservano più a lungo, quindi è meglio tenerle per i pasti futuri.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.who_wasting_followup=Sì. Il crollo fa questo. Quando una città si spezza, i forni si spengono per primi.\nNon lo diranno ad alta voce, ma si vede: gente che mangia troppo in fretta, che conserva le croste, che finge di non avere fame. Stiamo dando loro una notte in cui possono smettere di contare i bocconi.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder=Hai le forniture di zucche per la cena di stasera?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.deposit_pumpkins=Ho delle zucche per la cena.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.on_it=Ci penso io.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.pumpkins_delivered=Perfetto. Faranno una cena meravigliosa stasera.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.after_completion=Se senti delle risate stasera, tu le hai rese possibili.\nLe nostre riserve sono piene e la gente sarà sfamata.\nSii fiero di te stesso.

# Non-Quest NPCs
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello=Sono un Falegname. Costruisco sedie che non crollano durante i tremoti. Per lo più.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_1=Per lo più?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_2=Hai qualche battuta da falegname?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_1=Se il terreno trema, i mobili devono tenere il ritmo. 'Per lo più' significa che ho perso esattamente una battaglia contro la gravità.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_2=Ho provato a fare una cintura con la corteccia di quercia. Era uno spreco di cin-tura.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello=Lo senti? Gli alberi ronzano. O sta arrivando un tremoto, o il bosco sta facendo pettegolezzi di nuovo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_1=Il bosco fa pettegolezzi?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_2=Come fai a restare calmo?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_3=Ti lascio fare.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_1=Il vento tra gli alberi del bosco sussurra. Sono convinta che stia parlando con me, ma forse sono i nervi che mi fanno strani scherzi. Sono convinta che ieri abbia detto 'ho perso il gioco'...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_2=Do un nome a ogni scricchiolio e crepitio. È più difficile aver paura di qualcosa che si chiama Gerald.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello=Sono io o le Ghiande qui intorno sembrano possedere poteri magici?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello.response_1=Magia?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.detail_1=Sì. Non le hai viste? Alcune trasudano quella roba viola.\nNon ho la minima idea di cos'è quella roba. Se me lo chiedi, non è un buon segno.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello=Non ho paura dei ragni. Rispetto semplicemente le loro opinioni con otto gambe.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_1=Che opinioni?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_2=Quindi hai paura.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_3=Qualche consiglio per la miniera?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_1=I ragni fanno quello che vogliono. Non hanno paura di te. Puoi trovare soluzioni per i ragni in rete.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2=Non ho paura. Sono strategico. Preferisco essere vivo senza dover affrontare quelle creature orribili.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2.response_1=Non preoccuparti. Ho paura anch'io.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello=Se senti la campana suonare, o c'è pericolo vicino o mi sto annoiando. È cinquanta e cinquanta.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_1=Ti prego di smettere di suonarla.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_2=Cosa significa quando suona due volte?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_3=Suona pure. Mi piace il caos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_1=Ho provato. La campana mi ha chiamato per nome. Con forza. Anche il silenzio qui sembra che stia aspettando.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_2=Vuol dire che ho dimenticato di averla già suonata una volta. Sono costante, non precisa.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello=Se stai fermo abbastanza a lungo, il freddo CERCHERÀ di adottarti. NON lasciarglielo fare.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_1=Come faccio a impedirlo?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_2=Il freddo adotta le persone?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_3=A me piace il freddo.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_1=Muoviti. Mettiti qualcosa di caldo. NON uscire mai vestito troppo leggero. Questi ambienti sono impietosi.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_2=Sì. Ci sono così tante condizioni impietose là fuori. Il freddo prende chi vuole. Possiamo solo vestirci caldi per rallentarne gli effetti.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello=Fa piuttosto freddo qui, e non si può uscire molto. Conto i fiocchi di neve per passare il tempo.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_1=Quanti ne hai contati finora?
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_2=Sembra estenuante.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_1=L'ultima volta sono arrivato a 314 fiocchi di neve. Avrei continuato ma la mia torta di Snowberry aveva finito di cuocere, quindi dovevo andare a mangiarla.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_2=Lo è anche l'inverno. Siamo sulla stessa lunghezza d'onda.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello=Lavo. Sciarpe, muffole, supporto morale. Se hai un problema, probabilmente riesco a trasformarlo in un cappello.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_1=Trasformare cosa in un cappello?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_2=Posso avere una sciarpa?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_1=Qualsiasi cosa. Dipende da come la guardi.\nPrendi il problema, trasformalo in qualcosa di positivo, e portalo con orgoglio. Ecco, ora è un cappello.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_2=Solo se prometti di indossarla con drammaticità. Sventolala come un eroe in una bufera.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello=Ho fatto un elenco di cose che non sono lupi. Aiuta di notte.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_1=Cosa c'è nell'elenco?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_2=E i veri lupi?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_3=Perché fare un elenco?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_1=Alberi. Ombre. Vento. Alcune persone. Probabilmente. L'elenco è in lavorazione.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_2=Non sono nell'elenco. Sospetto. Molto sospetto.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_3=I lupi fanno paura! Chi non avrebbe paura di loro. Sto cercando di creare un elenco di cose che non fanno paura! Mi aiuta a restare calmo di notte.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello=Se hai freddo, bevi qualcosa di caldo. Se sei triste, bevi qualcosa di caldo. Se sei inseguito, bevi qualcosa di caldo più in fretta.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_1=Cosa stai preparando?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_2=Funziona davvero?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_1=Tè agli Aghi di Abete. Ha il sapore del coraggio e degli aghi. Soprattutto degli aghi.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_2=Ti aiuta se credi che ti aiuti. Non sottovalutare un placebo.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello=Sto allenando la mia risata affinché suoni malvagia. Ascolta. Ah. Ah. Ah.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_1=Era terrificante.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_2=Perché allenarti?
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_3=Ti lascio continuare ad allenarti.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_1=Grazie. Sto migliorando. Voglio che la gente abbia paura di me.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_2=Perché voglio conquistare il mondo, e non si può farlo senza una risata malvagia. Ovvio.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available=Oh. Oh wow. Hai esattamente l'aria di qualcuno che sa gestire una torta.\nHo fatto una nuova ricetta di torta con le snowberry e ho bisogno di un secondo parere.\nSe ti condivido la ricetta, ti importa testarla?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_1=La torta è la mia specialità.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_2=Dimmi tutto.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder=Come va con il test della torta? HO BISOGNO DI SAPERE...\nI miei sogni e le mie speranze di diventare panettiera in futuro sono in gioco.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_1=Non ne ho ancora mangiata.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_2=La torta mi sta piacendo molto. Sono solo sazio.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_3=Non sono sicuro di riuscire a mangiarne ancora.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete=Allora? Allora?\nDimmi tutto. La consistenza, il gusto della bacca, la tua Torta di Snowberry era meglio di una torta normale?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_1=Era pura gioia.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_2=Voglio un'altra fetta.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_3=Non credo che la pasticceria faccia per te.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.after_quest=Ehi, assaggiatore.\nSe vedi delle snowberry, sai cosa fare.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.hello=Ehi, sono un'aspirante panettiera. Sto cercando di fare una nuova torta. Sto ancora cercando di capire il mio ingrediente speciale.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello=Non fidarti dei pappagalli. Ripetono tutto. Compresi i segreti. Soprattutto i segreti.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_1=Cosa hanno detto?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_2=Insegnami la lingua dei pappagalli.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_3=Qualche consiglio per la giungla?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_1=Che qualcuno ha fatto cadere un pesce. Avevano ragione. L'ho fatto io. I pappagalli non me lo perdoneranno mai.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_2=Per lo più sono insulti e richieste di snack. Occasionalmente un avvertimento, se paghi in semi.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello=Sto inventando una nuova cucina: croccante. La giungla offre molti candidati.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_1=Per favore no.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_2=Cosa c'è nel menu?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_3=Dammi qualcosa di normale.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_1=Codardo. Ma giusto. Non ti servo lo scarafaggio oggi. Forse domani.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_2=Scarafaggio arrostito. Ragno speziato. Insalata di liane. L'insalata morde. Questo è il fascino.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello=Le liane sono solo corde con ambizione. Appendo la mia arte dove la gravità può criticarla.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_1=Che arte?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_2=Cade?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_3=Posso aiutare?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_1=Carillon fatti di semi. Suonano come piccole tempeste che litigano educatamente. Se vuoi aiutare, mettiti sotto e fingi di esserti trovato lì per caso quando cade.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_2=Spesso. Fa parte dello spettacolo. Se non cade, non era abbastanza coraggioso.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello=Tutti dicono che la chioma è bellissima. Tutti dimenticano che è anche molto lontana dal suolo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_1=Allora stai in basso.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_2=Cosa ti spaventa di più?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_3=Vuoi incoraggiamento?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_1=Ho provato. La giungla ha costruito le scale. La giungla mi sta prendendo in giro.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_2=Cadere. E anche non cadere, perché poi devi scendere.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello=Mappo la giungla ascoltando. Gli uccelli tracciano i confini. Gli insetti riempiono i dettagli.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_1=Sembra falso.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_2=Posso vedere la tua mappa?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_3=Dove dovrei andare?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_1=Lo fa anche la giungla. Eppure eccoci qui. Ascolta abbastanza a lungo e i sentieri si presentano da soli.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_2=È principalmente frecce e avvertimenti. Anche uno scarabocchio di un pappagallo molto maleducato.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello=Ho detto a una liana che era appiccicosa. L'ha presa sul personale.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_1=Un'altra ancora.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_2=Qualche consiglio vero?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_3=Sei insopportabile.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_1=Mi sono perso e ho chiesto indicazioni. La giungla ha risposto: 'Fo-glia i fatti tuoi'.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_2=Non colpire un albero con le formiche dentro. Ti pentirai di avere mani.
skyblock_hub_dialogues.npc_name.balth=Balth
skyblock_hub_dialogues.npc_name.brakka=Brakka
skyblock_hub_dialogues.npc_name.kora=Kora
skyblock_hub_dialogues.npc_name.nyssa=Nyssa
skyblock_hub_dialogues.npc_name.ruk=Ruk
skyblock_hub_dialogues.npc_name.sable=Sable
skyblock_hub_dialogues.npc_name.varka=Varka
skyblock_hub_dialogues.npc_name.zarn=Zarn
skyblock_hub_dialogues.npc_name.grak=Grak
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro=Oh. *Oink* Tu... mi hai notato.\nTengo una ciotola per il conto. Per le pattuglie che non tornano intere. È un lavoro silenzioso. *Oink*\nDi solito non chiedo aiuto a nessuno. Ma la ciotola si sta riempiendo troppo. Mi chiedevo se... se forse potresti svuotarla un po' vendicando le loro perdite? *Oink*... Solo se vuoi.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro.response.accept=Ti aiuto con la ciotola.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress=*Oink*... Oh. Stai ancora lavorando.\nNon preoccuparti, nessuna fretta. Non voglio aggiungere anche il tuo nome alla mia ciotola. Per favore stai al sicuro.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress.response=Lo porterò a termine.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete=Oh. *Oink*... Grazie.\nI nomi non sono dimenticati, e la perdita del mio amico caduto ora ha un peso. Non so davvero come... *Oink*... Grazie. È tutto quello che ho.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_1=Non devi dire altro.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_2=Che riposino in pace.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello=*Oink*... Oh. Ciao. Non mi aspettavo nessuno.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_1=Ciao, Grak.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_2=Non badare a me.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro=*Oink* Non sembri un Piglin. Devi essere uno di quegli Umani invasori.\nNon mi fido di voi Umani, che correte per il mondo. Noi Piglin possiamo gestire da soli questa infestazione di Piglin Zombificati! *Oink*\nBene, se vuoi dimostrarmi il contrario, te lo permetterò.\n*Oink* Solo un amico mi porterebbe dell'oro. Vuoi essere mio amico?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro.response.accept=Sì, voglio essere tuo amico.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro=Se sei così determinato a dimostrarmi qualcosa, hai portato l'oro?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro.response.trade=Ecco l'oro.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete=Oh, mi tieni davvero in conto come amico. Pensavo che voi Umani non ci voleste bene. *Oink*\nImmagino che adesso siamo amici. Bello saperlo.\nForse ho giudicato troppo in fretta gli umani. *Oink*
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_1=Felice di essere tuo amico.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_2=Sto solo cercando di essere gentile
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello=Ehi amico!!!! *Oink* *Oink* *Oink* *Oink*\nHai altro oro? ;)
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_1=No, mi dispiace amico :(
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_2=Sembri fin troppo emozionato di vedermi.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro=Sei uno degli umani che aiuta la colonia, vero? Bene.\nContinuano a comparire Piglin Zombificati Infernali qui intorno. Penso che i normali Piglin Zombificati siano sotto controllo, ma temo che gli umani stiano ignorando la minaccia di quelli più letali e infuocati. Ti importa occupartene?
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro.response.accept=Li elimino.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress=Come va? Quelli Infernali si stanno rivelando una sfida, come temevo. Ho paura che potremmo essere in ritardo.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_1=Torno al lavoro.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_2=Sì, si stanno rivelando tosti
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete=Bel lavoro umano! Penso che riuscirò a dormire meglio sapendo che ci sono meno di quelle creature infuocate e ostili in giro. Non che fossi preoccupato, visto che sono immune al fuoco. Sono entusiasta di supportare gli sforzi degli Umani prendendo le decisioni che ritengo necessarie.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_1=Felice di aver aiutato.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_2=Ben fatto per aver preso la decisione.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello=Cose strane qui intorno. Se noto qualcosa che ritengo una minaccia di nuovo, te lo faccio sapere.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_1=Grazie!
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_2=Sono sempre qui per aiutare
skyblock_hub_dialogues.nether.piglin_colony.balth.hello=Benvenuto nel Nether! Stai attento là fuori. Non è un posto amichevole.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_1=Che accoglienza.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_2=Spero tu stia bene.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello=Se senti odore di fumo, non farti prendere dal panico. Ho solo bruciato di nuovo il cibo.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_1=Bruciato?
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_2=Spero che le tue avventure culinarie vadano a buon fine.
skyblock_hub_dialogues.nether.piglin_colony.kora.detail_1=Sì, stranamente si riesce ancora a bruciare il cibo nel posto più caldo dell'universo.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello=Woah! Fermati! Stai attento oltre questi cancelli. È pericoloso là fuori.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_1=Non preoccuparti per me! Ho un elmo!
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_2=Starò al sicuro
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello=Woah, l'architettura qui è davvero impressionante. Pazzesco pensare che questo posto sia stato costruito letteralmente in pochi anni dopo la fusione.
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_1=Cos'è la fusione?
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_2=Sì, è davvero impressionante
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_3=Meh, conosco costruttori migliori
skyblock_hub_dialogues.nether.piglin_colony.ruk.detail_1=È quando l'Overworld si è fuso con questo strano posto.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello=Stai attento là sotto. Quella roba viola sembra mangiare il quarzo e possiede uno strano potenziale magico. Per un giorno mi ha dato un terzo braccio.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_1=Un terzo braccio?
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_2=Oh wow, che roba pazzesca.
skyblock_hub_dialogues.nether.piglin_colony.sable.detail_1=Sì, è magia davvero potente, se le dai quello che vuole.\nEvidentemente vuole molto il quarzo.
skyblock_hub_dialogues.nether.piglin_colony.varka.hello=Forgio lame, cardini e occasionali crolli emotivi. Soprattutto cardini.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro=Woah, attenzione. Non ho ancora finito di costruire qui. Questo ponte dietro di me per ora non porta da nessuna parte.\nHo però un piccolo problema. Sono un costruttore molto capace. Però ho perso tutte le mie lanterne e ho una paura tremenda del buio.\nTi importa aiutarmi a trovarle? Non possono essersi allontanate molto.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro.response.accept=Trovo le tue lanterne.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns=Per favore fa' in fretta, ho abbastanza paura del buio.\nSo che non possono essersi allontanate, a meno che le lanterne non abbiano cominciato a camminare. Se lo facessero, sarebbe un problema separato, e non sono pronto per affrontarlo.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns.response=Continuo a cercare.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit=Hai trovato le lanterne? Ottimo. Ottimo!\nAdesso abbiamo bisogno di abbastanza luce per illuminare l'intero Crimson Exchange. Un po' di Glowstone e torce dovrebbero bastare.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_1=Ecco alcune forniture per l'illuminazione.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_2=Ci penso io.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete=Ce l'hai fatta. Bello. Ci sarà molta più luce qui ora.\nNon ho più bisogno di aver paura del buio.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_1=Hai ragione, il buio fa paura.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_2=Felice di aver aiutato.
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello=Hai davvero illuminato la mia giornata.\nVorrei tanto non aver accettato un lavoro di costruzione nel posto letteralmente più buio dell'universo...
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello.response=Contento che le luci stiano aiutando.
skyblock_hub_dialogues.nether.piglin_colony.vesh.lantern.cant_pick_up=Non so di chi siano. Forse è meglio lasciarle stare per ora.
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello=Ehi, benvenuto alla Piglin Colony!\nLa Piglin Colony sembra essere stata un posto meraviglioso. Noi Umani non ne conoscevamo l'esistenza fino a poco tempo fa.\nAbbiamo trovato questa dimensione alternativa attraverso le crepe che si sono formate tra i mondi.\nAbbiamo parlato con i Piglin, e sembrano un gruppo amichevole (anche se si ossessionano un po' con l'oro). Sembra che stiano peggio di noi nell'Overworld.\nAbbiamo allestito questa base, il Crimson Exchange, per accedere facilmente al Nether e offrire supporto ai Piglin.\nSentiti libero di aiutarli, ma attenzione! Molti di loro sono stati conquistati dalla corruzione e si sono trasformati in Zombi!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_1=Starò al sicuro!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_2=Bello rivederti!

# Zombified Bastion - Dungeon Guard
skyblock_hub_dialogues.nether.piglin_colony.zombified_bastion.dungeon_guard.introduce=Questo bastione... era un tempo l'orgoglio della Piglin Colony.\nSfortunatamente, è ora invaso da varianti Zombificate di noi Piglin. I nostri amici, ora diventati Zombi.\nMi assisteresti nel riprendere il Bastione per il resto di noi Piglin sopravvissuti?\nDobbiamo solo sigillare alcuni dei portali che i Piglin Zombificati usano per entrare.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction=Senti questo? Stanno tagliando gli alberi!!!\nCosì tante generazioni di famiglie a prendersi cura di questa giungla, e ora viene tutta abbattuta. Secondo me è un brutto segno, e se continua così le cose peggioreranno soltanto.\nMi aiuti a fermare questa orribile deforestazione?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_1=Lo chiedo. Sembra grave.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_2=Forse la Giungla riesce a reggere qualche albero in meno.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.in_progress_workers=Forse dovresti cominciare a parlare con i lavoratori. Sono sicura che sanno chi c'è dietro tutto questo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.after_lucien=Oh, è Lucien. Ha tutto il senso del mondo.\nQuell'uomo è semplicemente così avido. È il più ricco qui intorno, e non è mai soddisfatto della sua ricchezza.\nNessuna sorpresa che stia rovinando la nostra casa per aumentare ulteriormente la sua fortuna.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete=Lucien ha preso i tuoi tronchi e ha detto che non intende fermarsi comunque. Quest'uomo è terrificante.\nBeh, grazie per aver provato. Sono sicura che un giorno qualcuno riuscirà a fargli sentire la ragione. Prima che cada tutta questa foresta.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete.response=Spero che riusciate a salvare la foresta.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.hello=La deforestazione continua. Lucien continuerà a riempirsi le tasche finché non riusciremo a fermarlo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned=Sì, gestisco questa macchina. Fai attenzione, è davvero pericolosa.\nNon sono io il responsabile. Te lo assicuro. Lucien è un uomo d'affari forte, ed è lui che c'è dietro. Non sono sicuro che capica davvero il danno che sta causando alla foresta. Penso che riesca a vedere solo i soldi che guadagna dalla vendita del legno.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned.response=Ah, quindi è guidato dai soldi.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.hello=Tieni le mani lontane. Questa roba morde.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned=Woah, indietro, stavo per dare un gran colpo a quel mucchio di tronchi là.\nSento che vuoi salvare la foresta, ma non c'è niente che possa fare. Sto solo facendo il mio lavoro.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned.response=Oh, mi dispiace. Ti lascio lavorare
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.hello=Attenzione, questa è una macchina enorme e sto cercando di raccogliere tutto questo legno.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned=Sei la quarta persona oggi che cerca di fermarmi.\nTi avverto, non sono in vena di parlare.\nSe vuoi risposte, Lucien è il tuo uomo. È lui che mi paga.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned.response=Capito.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.hello=Lucien paga bene. Vorrei solo che mi pagasse per non distruggere la nostra casa. Non posso avere casa senza casa, e non posso avere casa se abbatto questa foresta.\nNon riesco a vincere :(
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront=Sono qui solo per fare soldi. Ho rilevato l'azienda di famiglia. Adesso abbatto alberi. Non riesco a credere che nessuno lo abbia fatto prima. Diventerò ricchissimo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_1=Stai distruggendo la tua stessa casa.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_2=Cosa posso fare per farti smettere?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro=Siamo giusti. Mi porti un bel carico di tronchi per compensare il mio affare perduto, e la smetto. Ti sembra giusto?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.response_deposit=Tieni dei tronchi
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.dungeon=Voglio lottare per la foresta.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete=Eccellente. Esattamente quello che ho chiesto.\nOra, riguardo alla chiusura.\nNo.\nQuesti tronchi aiutano i numeri di oggi. Le macchine aiutano quelli di domani.\nDì ai manifestanti che possono continuare a chiedermi di fermarmi, ma io non mi fermerò. L'azienda non crescerà con un mucchio di tronchi così piccolo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_1=Glielo dico.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_2=Mostro.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon=Ehi, togliti di mezzo. Ho affari da sbrigare.\nHo molti clienti. Sì, questi clienti potrebbero essere mostri malvagi, ma pagano bene. La crescita dell'azienda ristagnerebbe se cominciassi a fare il difficile coi clienti.\nSe hai un problema, affrontalo pure. Non riesci a gestirmi.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_1=Proviamoci.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_2=Lavori coi mostri?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters=Sì, è così.\nVogliono roba da me. Invece di attaccarmi, ho scoperto che se dai loro quello che vogliono, tendono a supportarti.\nChe importa se abbattono tutto e rubano a tutti...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_1=Devo fermarti.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_2=Mi occuperò di te più tardi.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.kiri.hello=Conoscevo un tizio che viveva su una casa sull'albero in uno di quegli alberi. È così ingiusto.\nSono abbastanza sicuro che la sua casa sull'albero sia stata trasformata in legno per un muro nella casa di qualche ricco milionario.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.paz.hello=Devo essere onesto. Questa foresta sembra... "incantata". Penso che sia una pessima idea abbattere questi alberi. Ci verrà a trovare.\nNon penso che quella roba viola che filtra dal pavimento sia un buon segno.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.marlo.hello=Non mi fido di quella roba viola.\nNon è naturale.\nPerché ci sono ragni dappertutto adesso.\nNon ha senso.\nPenso che sia un segnale che qualcosa di brutto stia succedendo.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available=Ciao di nuovo! Sto lavorando a una nuova ricetta. Penso davvero che darà alla gente di Pumpkingdom un enorme boost di morale.\nCredo che sarà ottima anche per te. Ti va di provarla?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_1=Sì, ho sempre fame
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_2=Sempre entusiasta di una nuova prelibatezza
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted=Ottimo! Ecco la mia idea. È uno stufato di manzo. Aggiorno il tuo libro di ricette a un bancone da lavoro, così puoi vedere l'idea che ho.\nVa' a farne un po' e dimmi com'è il gusto!
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_1=Sembra meraviglioso
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_2=Non mi entusiasma l'idea, ma ci provo lo stesso
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder=Come va con la mia bellissima ricetta? Spero che non ti abbia avvelenato.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_1=Sta andando bene
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_2=Ooo, non sembra andare benissimo
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_3=Non ho ancora iniziato
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete=Allora? Guardati, sei ancora in piedi e senza quella faccia da "me ne pento". È promettente. Muoio dalla voglia di sapere, era buono lo stufato di manzo? Ho fallito tutti come chef?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.tasty=Era buono. Davvero buono.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.honest=Ha bisogno di qualche ritocco.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.horrible=Era disgustoso.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup=Sì! Lo sapevo. Tutta la gente del regno sarà così felice. Non vedo l'ora di condividere la mia creazione con più persone.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_1=Sono felice di vederti così contento
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_2=Continua così
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup=Be', immagino che non sia per tutti, e sembra che non ti abbia odiata. Sembra che stia andando nella direzione giusta. Apprezzo il feedback onesto.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_1=Non preoccuparti, credo in te
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_2=Dovresti mollare adesso
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting=Oh no. Mi dispiace tantissimo. Dovrei proprio rinunciare a fare il cuoco. Non riesco a credere che ti sia piaciuta così poco.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_1=Mi dispiace, non lo pensavo davvero
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_2=Guarda, la cucina semplicemente non fa per te
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello=Come va? Spero tu stia meglio di me.\nTutte le mie mucche sono ancora ingiustamente contaminate da quella roba viola. È una cosa molto brutta.
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello.response_1=Mi dispiace tanto
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer=*Singhiozzando* Ehi! Scusa, mi hai presa in un brutto momento.\nLe mie mucche sono diventate brutte. Stanno ferendo i villagers. Non riesco a sopportare di vederle così.\nNon voglio farle del male. Riesci a fare qualcosa?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.what_happened=Cosa gli è successo?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.ill_help=Proteggo i villagers
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.what_happened_followup=Non lo so. Un giorno stavano pascolando e il giorno dopo erano infestate da quella roba viola. È come una malattia, e le ha colpite tutte. È così triste da vedere.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.followup.response.accept=Me ne occupo io
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check=*Singhiozzando* Spero che stia andando bene.\nCome va? Anzi, non dirmelo. Non voglio sapere.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check.response.on_it=Ci sto lavorando
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete=Oh mio dio! Grazie mille per averlo fatto. È così orribile. Cosa gli ha preso. È così ingiusto.\n*Continua a singhiozzare*\nLe mie povere mucche.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_1=Per favore non piangere
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_2=Felice di aiutare sempre


skyblock_hub_dialogues.panorama.skyblock=Skyblock
skyblock_hub_dialogues.panorama.by_cubecraft=by CubeCraft
skyblock_hub_dialogues.panorama.complete_quests=Completa le Missioni
skyblock_hub_dialogues.panorama.explore=Esplora
skyblock_hub_dialogues.panorama.and_upgrade=E Potenziati
skyblock_hub_dialogues.panorama.your_adventure=La Tua Avventura Inizia Ora!
skyblock_hub_dialogues.panorama.speak_to_helper=Parla con il Villager per vedere le tue Missioni iniziali

# Grot & Nira - A Bolt of Hope
skyblock_hub_dialogues.npc_name.grot=Grot
skyblock_hub_dialogues.npc_name.nira=Nira
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro=Tu. Fermati. Ho bisogno del tuo aiuto.\nQuella maialina che mi sta accanto. È mia moglie. Nira. La corruzione viola si è diffusa nella nostra sezione e lei è cambiata. È ancora lì dentro. Lo so. Ogni mattina mi sbatte il musetto contro la gamba, come sempre.\nMi è stato detto che il fulmine può rompere la corruzione. Trovami un parafulmine. Il resto lo faccio io.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro.response.accept=Ti trovo un parafulmine
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro=È ancora qui. Continua a sbanttere il musetto contro la mia gamba ogni mattina.\nSe hai trovato un parafulmine, lo usiamo per attirare un fulmine direttamente su di lei.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro.response=Tieni, prendilo.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt=Qualcosa è successo. Ha strillato.\nMa è ancora una maialina. La scarica non era abbastanza.\nHo bisogno di più. Molto di più. Creeremo la tempesta di fulmini più potente che tu abbia mai visto.\nI parafulmini non basteranno. Dovremo usare cristalli di ghiaccio e vapore acqueo per evocare la tempesta del secolo.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_1=Raccolgo tutto
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_2=Sono un sacco di materiali
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro=Hai tutto?\nNira mi parlava delle tempeste. Diceva che l'acqua ghiaccia in alto nelle zone come la Snowy Taiga, dove l'aria è spessa e fredda. Poi c'è il vapore acqueo che sale e colpisce il ghiaccio lassù. Si accumulano enormi cariche, finché il cielo non riesce a contenerle e si spacca.\nSe impiliamo i parafulmini per concentrarle, e usiamo il ghiaccio e l'acqua per costruire la carica, possiamo attirare qualcosa di più grande di qualsiasi fulmine naturale. Abbastanza forte da rompere la corruzione.\nSperiamo di non sciogliere l'intero Nether.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro.response=Ecco gli ingredienti per la tempesta
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete=NIRA!\nGuardala. È tornata!\nNon ho le parole per questo. Mi hai riportato mia moglie.\nGrazie. Lo dico davvero.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_1=Merita di essere a casa
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_2=Felice di aver aiutato
skyblock_hub_dialogues.nether.piglin_colony.grot.hello=Nira sta ancora trovando i suoi ritmi. È stata una maialina per molto tempo. Ma è di nuovo se stessa. Non so cosa avrei fatto senza di te.
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_1=È fortunata ad averti
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_2=Prenditi cura di lei
skyblock_hub_dialogues.nether.piglin_colony.nira.hello=Ricordo tutto, anche da maialina sentivo la voce di Grot ogni giorno. Non mi ha mai abbandonata. È stato così dolce con me.\nMi ci vorrà del tempo per riadattarmi a camminare di nuovo su due gambe.
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_1=Che bello averti di nuovo qui
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_2=Sei molto fortunata
skyblock_hub_dialogues.nether.piglin_colony.nira_pig.hello=Oink.
