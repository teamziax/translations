skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.hello=Abbassa la voce. I suoni si sentono da lì dentro.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.locked=Adesso no. Il villaggio sta ancora facendo i conti con i movimenti del terreno. Torna quando le cose si calmano.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available=Stai andando nella Cobblestone Mine? Bene. Odio i ragni lì dentro. Con la polvere di pietra me la cavo. Coi ragni che mi sfilano tra gli stivali, proprio no.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.whats_changed=Cos'è cambiato?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.what_you_need=Di cosa hai bisogno da me?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.whats_changed=Sono più audaci. Non restano più nell'oscurità come prima. E alcune ragnatele hanno una strana tinta. Probabilmente niente. Probabilmente.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need=Pulisci la Cobblestone Mine cinque volte. Non una. Cinque. Devo sapere se i ragni si stanno moltiplicando, migrando, o se vengono spinti via.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.on_it=Okay. Lo faccio.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.five_times=Cinque volte sembra tanto.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.why_five=Se la pulisci una volta, si nascondono. Se la pulisci due volte, si spostano. Dopo qualche giro cominciano a emergere degli schemi. Densità delle ragnatele. Punti di spawn. Il tipo di cose che noti solo quando sei stanco e sei comunque attento.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress=Sto ancora contando. Cinque pulizie. Cerca di non uscire tutto avvolto.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress.response.working=Ci sto lavorando.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete=L'hai fatto davvero. Cinque pulizie, e sei ancora in piedi. L'ingresso sembra già meglio. Meno ragnatele nell'aria. Meno fruscii sulla pietra.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete_reward=Prendi questo. Se la miniera continua a fare i capricci, almeno puoi estrarre la tua pietra senza viverci dentro.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.glad=Sono contento di aver aiutato.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.tint=Quella tinta che hai menzionato...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.tint_followup=Non sto dicendo che sia la causa. Sto dicendo che ho visto cose più strane nelle crepe dopo un tremoto. Tieni gli occhi aperti là sotto. Se vedi qualcosa che sembra sbagliato, non toccarlo a mani nude.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.after_completion=Se le ragnatele ricominciassero a diffondersi, lo saprei prima di te. Sento l'umidità quando si insediano.
