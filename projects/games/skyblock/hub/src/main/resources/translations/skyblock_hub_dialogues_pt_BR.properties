skyblock_hub_dialogues.wurg.cannot_cross=GGGRRR! Sou um Wurg mal-humorado! Nós, Wurgs, somos jurados a proteger as pontes e impedir qualquer um que não seja digno de atravessá-las! Volte quando tiver descoberto mais!
skyblock_hub_dialogues.wurg.back_to_work_response=Hora de voltar ao trabalho!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat=Ei, você ainda está de pé! Isso é um bom sinal. Já conheceu os moradores? Eles adoram uma boa conversa!\nEstá se sentindo perdido? Não se preocupa! Suas missões estão salvas no seu <cc:header>Menu do Skyblock</cc:header> ou digite "/skyblock quests"!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_1=Obrigado pela informação!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.chat.response_2=É, os moradores são muito legais!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.introduce=Ei, olá amigo! Bem-vindo à vila de Oakridge! \nAh, que falta de educação da minha parte... Esqueci de me apresentar!\nMeu nome é Cubit, sou o guia da vila aqui em Oakridge!\nMe segue, vou te mostrar o coração da vila e te apresentar aos moradores!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_enchanter=Este é o encantador!\nDe alguma forma mágica, ele consegue encantar seus itens para deixá-los mais poderosos!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_portal=E isso nos traz de volta ao portal...\nVocê pode sempre usar o portal para voltar para casa, ou então usar aquele menu prático no seu inventário.\nEste é o fim do tour por enquanto, mas não se preocupe, tem muito mais para explorar em Oakridge!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_repairer=Conheça o reparador!\nEle consegue consertar qualquer coisa! Mesmo que tenha sido mastigada por alguma criatura...\nComo um coelho ou algo assim...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cubit.introduction_1.show_shops=Ah, minha parte favorita... As lojas!\nTêm tudo o que você precisa, e tudo o que você não sabia que precisava!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce=Ei, olá! É você de novo!\nÉ melhor eu te levar até a Forja! É o único lugar no mundo do Skyblock capaz de fazer upgrades poderosos em ferramentas e armaduras.\nPode ser um pouco difícil de encontrar, então vamos lá!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_1=Vamos!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.introduce.response_2=Mal posso esperar!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge=Bem-vindo à Forja! Este prédio enorme é uma verdadeira usina de poder!\nDizem que este lugar foi construído por pessoas que pareciam possuídas, e que este lugar tem poderes mágicos.\nRunas encontradas pelo mundo podem ter seus poderes verdadeiros refinados aqui.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_1=Uau, parece assustador!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.forging_a_future.show_forge.response_2=Mal posso esperar para criar algo poderoso!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello=Como está indo na Forja? Criou algo incrível?\nAs Masmorras são um ótimo ponto de partida para encontrar Runas se você precisar de alguma.
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_1=Sim, está indo bem!
skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.cubit.hello.response_2=Ainda não criei nada bom!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.introduce=Ei, olá! Sou a Cassandra! Sou agricultora! Alguns diriam que sou a melhor agricultora por aqui!\nAlguns diriam que eu <italic>beet</italic> toda a concorrência!\n\nComo sou agricultora de beterraba, sempre tenho toneladas de sementes de beterraba! Volta aqui se quiser um ótimo negócio!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.introduction_1.response=É um prazer te conhecer!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.cassandra.chat=Ei, como vai parceiro!\nPosso te oferecer algumas sementes de beterraba com ótimo preço?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.introduce=Mmh... Levi aqui.\nVocê não é daqui, né?\nTodo mundo me conhece. Sou aquele que sempre dorme no trabalho. Estou trabalhando para melhorar minhas habilidades para poder ajudar mais, mas ainda não cheguei lá.\nSe continuar assim, vai ficar tão famoso quanto eu.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_1=Espero que você não durma sempre
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.introduction_1.response_2=Você parece ser problema
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.hello=Ei, como você está?\nEstou ocupado, descansando. Importa voltar em outro momento?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.introduce=DE JEITO NENHUM! Gente nova!\nVocê é novo, né? Mal posso esperar para te conhecer. Me conta tudo.\nComo você está? Tenho bolo. Quer bolo?\nMeu Deus. Você tem que me parar. Vou ficar falando sem parar.\nJá conheceu todo mundo? Já viu as lojas? E as minas?\nOOOOO Tem um monte de coisa roxa louca brotando do chão, você ficou sabendo disso?\nEspera... Vou parar
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_1=Uau, calma!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_2=Acho que vamos nos dar bem
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.introduction_1.response_3=Você é caótica demais
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello=Uau, você veio falar comigo de novo! Estou honrada.\nVocê está bem? Fiz mais bolo. Adoro bolo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.hello.response_1=Também adoro bolo
skyblock_hub_dialogues.response.show_me_around=Sim, me mostra por aí!
skyblock_hub_dialogues.response.show_me_more=Sim, me mostra mais!
skyblock_hub_dialogues.response.show_me_what_youve_got=Sim, me mostra o que você tem!
skyblock_hub_dialogues.response.thanks_for_help=Obrigado!
skyblock_hub_dialogues.response.yeah_sure=Sim, claro!
skyblock_hub_dialogues.response.lets_go=Estou pronto!
skyblock_hub_dialogues.response.ill_pass=Talvez em outro momento...
skyblock_hub_dialogues.response.yeah_ill_help=Sim, vou ajudar!
skyblock_hub_dialogues.response.not_right_now=Não, agora não
skyblock_hub_dialogues.response.okay=Ok
skyblock_hub_dialogues.response.yes=Sim
skyblock_hub_dialogues.response.tell_me_more=Me conta mais.
skyblock_hub_dialogues.response.i_should_go=Preciso ir.
skyblock_hub_dialogues.response.fair_enough=Faz sentido.
skyblock_hub_dialogues.response.yikes=Nossa.
skyblock_hub_dialogues.response.good_luck=Boa sorte.
skyblock_hub_dialogues.response.interesting=Interessante.
skyblock_hub_dialogues.response.laugh=Haha!
skyblock_hub_dialogues.response.ill_leave_you_to_it=Te deixo em paz.
skyblock_hub_dialogues.response.will_do=Pode deixar!
skyblock_hub_dialogues.response.ellipsis=...
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.introduce=Ai meu Deus, ai meu Deus! Minhas preciosas bolotinhas escaparam da trava de novo! Estavam saltitando perto da cabana, mas agora desapareceram na floresta! Você poderia me ajudar a reuni-los? Vou te recompensar bem, prometo, só preciso que meus bebês voltem para casa!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.response=Hora de uma caçada de coelhos! Pode deixar, Aurora!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.hows_it_going=Como está indo? Algum sinal dos meus pequenos artistas da fuga? Esses coelhos estão tramando alguma coisa, eu sei... espero que seja só um roubo de lanche e não uma rebelião de verdade!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks=Ah, graças ao céu! Muito obrigada por me ajudar... Não teria conseguido rastreá-los sem você! Vou contar para todo mundo em Oakridge sobre sua bondade e bravura!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.aurora_hunt.thanks.response=Fico feliz por ter salvado o dia!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.hello=Ei! Ainda estou superagradecida pela sua ajuda com meus pequenos travessos!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro=Eeeek! Fica longe! Quer dizer, olá! Coelhos são... agitados demais pra mim. São aterrorizantes! Você pode levar essa comida para a Aurora? Preparei cenouras, beterraba e trigo para ela manter os bichos... satisfeitos.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_1=Claro! Serei seu herói das entregas.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.intro.response_2=Como você pode ter medo? São só coelhinhos fofos!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress=Ei! Você... você já alimentou essas criaturas apavorantes? Elas ainda estão com fome?
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.in_progress.response=Ainda não, mas estou nisso.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete=Você é o melhor! Sério, coelhos são monstrinhos disfarçados de fofos. A Aurora diz que devo visitá-los algum dia... talvez eu vá, se você estiver lá para me proteger!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.fluffy_fears.complete.response=Pode contar! Serei seu guarda-costas de coelhos.
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello=Ei, como vai! Sou o melhor fornecedor de comida para animais da floresta, principalmente porque não gosto de chegar perto dos animais!
skyblock_hub_dialogues.overworld.oak_forest.cottage.bob.hello.response_1=Bom ouvir isso!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro=Oh! Essas devem ser as cenouras que o Bob juntou. Ele é um amor, mesmo sendo um pouco nervoso. Pode me entregar?
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.intro.response.yes=Aqui está!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks=Perfeito! Muito obrigada. Fala pro Bob que ele é sempre bem-vindo para visitar, quem sabe vendo eles mastigando ele percebe que são só amiguinhos fofos.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.deposit.thanks.response=Vou avisar a ele.
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro=Oh, o Bob te mandou com petiscos? Que fofo da parte dele! Estou um pouco ocupada com os outros coelhos, você poderia alimentar esses diretamente? Fala pro Bob que ele é bem-vindo sempre!
skyblock_hub_dialogues.overworld.oak_forest.cottage.aurora.fluffy_fears.speak.intro.response=Consigo fazer isso!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.catch=<italic>*Pulo Pulo*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.response=Peguei! Calma, calma.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.intro=Este coelho está mexendo o nariz, parece que está com fome de cenouras!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.1.fluffy_fears.deposit.thanks=O coelho masca as cenouras feliz da vida.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.catch=<italic>*Guiii!*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.response=Vem comigo, pequenino!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.intro=Este coelho parece querer um pouco de beterraba, está olhando direto para a sacola!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.2.fluffy_fears.deposit.thanks=O coelho aprecia a beterraba.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.catch=<italic>*Nom Nom*</italic>
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.response=De volta ao cercado!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.intro=Este coelho está esperando pacientemente por um pouco de trigo!
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.3.fluffy_fears.deposit.thanks=O coelho rói o trigo contente.
skyblock_hub_dialogues.overworld.oak_forest.cottage.rabbit.hello=<italic>*Mexe o nariz*</italic>


skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.intro=Ei! Você aí, vem cá\nOntem à noite... As paredes sacudiram com força e, assim do nada, todas as casas aqui ficaram instáveis...\nE claro que isso acaba sendo problema meu para resolver...\nMas agora posso fazer disso seu problema também, eu acho.\nVai buscar toras de Carvalho e Pedregulho pra mim, a gente fala de novo quando você terminar.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going=É você de novo.\nVocê já juntou os materiais?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.yes=Sim! Tenho alguns recursos para você.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.hows_it_going.response.no=Não, desculpa, vou voltar a trabalhar nisso :(
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks=Nossa, você realmente fez isso.\nEstou... impressionado.\nObrigado, eu acho.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.thanks.response.enjoy=Espero que esses recursos tenham ajudado!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well=Sem tremores desde ontem à noite. Talvez seja melhor que fique assim.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.ronan.tremors.going_well.response.glad_to_hear=Fico feliz que esteja dando certo para você!


skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro=Ei, você aí. Deixa eu te apresentar algo muito poderoso neste mundo...\nSantuários. Sim, ofereça bastante do item ao qual o Santuário é dedicado e ele vai te recompensar com coisas incríveis.\nVai dar uma volta para encontrar todos os Santuários que esta terra tem a oferecer!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_1=Já vou nessa!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.intro.response_2=Vou vendo enquanto caminho, obrigado!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going=Já encontrou todos eles?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_1=Ainda procurando!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.like_a_shrining_light.hows_it_going.response_2=Estou me esforçando para encontrar todos!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello=Ei! Tudo bem!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alexandra.hello.response_1=Bom te ver de novo!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello=Ei. Sou o Gus. Acho que deixei meus óculos em algum lugar por aqui.\nAcho que vou continuar procurando.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_1=Boa sorte. Espero que encontre!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.gus.hello.response_2=Aposto que você não viu isso vir...


# Cobblestone Mine - Dungeon Guard
skyblock_hub_dialogues.overworld.oak_forest.cobblestone_mine.dungeon_guard.introduce=Não faz muito tempo, esta era uma mina tranquila e produtiva...\nIsso foi até as aranhas aparecerem.\nA Guarda de Oakridge não estava preparada para um ataque desses.\nFomos sobrecarregados e tivemos que recuar.\nAgora a mina está infestada de aranhas e outras criaturas.\nVocê poderia nos ajudar a limpar isso?

# Pumpkingdom - Ella
skyblock_hub_dialogues.overworld.plains.pumpkingdom.ella.flower_shop=Olá! Sou a dona da Loja de Flores aqui em Pumpkingdom!\nPosso te oferecer algumas flores?

# Pumpkingdom - Dungeon Guard
skyblock_hub_dialogues.overworld.plains.pumpkingdom.dungeon_guard.introduce=Eram tantos zumbis. Isso me assombra!\nNão sei como sobrevivemos. Não havia mais nada que eu pudesse fazer.\nSerá que você teria conseguido fazer melhor? Acha que poderia ter ajudado? O resultado teria mudado se você estivesse lá?

# Pumpkingdom - Blooming in the Rain
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce=Oh! Olá! Você parece ter ótimas mãos para jardinagem! O solo tem estado tão agitado ultimamente, acho que precisa de algumas cores vivas para se acalmar. Quer me ajudar a juntar algumas flores?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_1=Ooo, flores! Adoraria ajudar.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.introduce.response_2=Estou ocupado demais para pegar flores agora.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker=Espera, espera! Não podemos arrancá-las assim, as raízes são sensíveis! Antes de sair, vai naquela loja e compra um colhedor de flores.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.buy_flower_picker.response_1=Claro, já vou escolher um
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go=Ótimo, você conseguiu! Olha esse brilho! Ok, foco, Sandy... foco... Vamos colher algumas flores!!!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_go.response_1=Isso! Flores!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions=Olha esses Dentes-de-leão! São como pedacinhos do sol. Colhe alguns dentes-de-leão usando a ferramenta e depois me traz!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_1=Aqui estão alguns dentes-de-leão!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_dandelions.response_2=Ah, deixa eu ir buscar! Me distraí um pouco.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_dandelions=Concentra! Lembra de colher os Dentes-de-leão usando as ferramentas para não perturbar a terra!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys=Você ouviu isso? O chão pareceu um pouco... crocante. Vamos encontrar algumas papoulas. O vermelho delas é tão forte, é perfeito para as ruínas.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_1=Sim, vamos explorar!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_poppys.response_2=Se for necessário...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys=Rápido, rápido! Colhe algumas papoulas usando a ferramenta e me traz! Elas fazem tanto pelo solo.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_1=Aqui estão algumas papoulas!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_poppys.response_2=Ah, deixa eu ir buscar!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_poppys=As Papoulas! Lembra de colher as Papoulas usando as ferramentas!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys=Ok, uma última coisa... Acho. Ooo! Vamos encontrar algumas peônias. São como cobertores fofos para a terra!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_1=Sim, vamos explorar!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.walk_to_peonys.response_2=Tá bom...
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys=Não são magníficas? Colhe algumas peônias usando a ferramenta e me traz! São a peça final do nosso curativo floral!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_1=Aqui estão algumas peônias!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.bring_peonys.response_2=Ah, deixa eu ir buscar!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.harvest_peonys=Não esquece! Lembra de colher as peônias usando as ferramentas!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home=Oh! Minha cesta está transbordando! E meus pés estão formigando... Acho que é suficiente. Vamos para casa.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_1=Sim, vamos para casa!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.lets_head_home.response_2=Minhas pernas doem de tanto andar :(
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up=Foi lindo! O solo já parece um pouco mais calmo, não é? Vamos fazer isso de novo em algum momento.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_1=Sim, eu também gostei.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.blooming_in_the_rain.finishing_up.response_2=Foi ok, acho. Não sou muito fã de flores.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello=Ei, como vai? Espero que você esteja se sentindo floral e pronto para ajudar as mudas!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.sandy.hello.response_1=Espero que você também!

# Pumpkingdom - Non-Quest NPCs
skyblock_hub_dialogues.overworld.plains.pumpkingdom.cedric.hello=Se você sentir cheiro de queimado, seu rosto provavelmente está perto demais do fogo. Essas batatas estão cruas.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello=Fala baixo, por favor. Os espantalhos estão ouvindo. Ou talvez eu esteja perdendo o juízo.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.hello.response_1=Você quer um amuleto de sorte de abóbora?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.harper.detail_1=Não. De jeito nenhum.\nSe eu usar um amuleto de sorte e ele falhar, vou ter que começar a acreditar em amuletos de azar também.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello=Bem-vindo, viajante. Você está em Pumpkingdom. Temos abóboras mundialmente famosas aqui.\nAlgo que posso fazer para te entreter?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_1=Canta alguma coisa pra mim.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_2=Por que chamar de Pumpkingdom?
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.hello.response_3=Só estou passando.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.verse_1=Oh, abóbora, abóbora, laranja e brilhante,\nEsperando por uma noite assustante.\nCom um sorriso engraçado ou uma cara de medo,\nVocê é a abóbora mais fofa do lugar.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.lark.detail_1=Porque dizer "Vila das Abóboras" parecia um convite para ser saqueado.\nAlém disso, o primeiro prefeito declarou isso com uma faca de entalhe, e ninguém discutiu com a faca.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.maeve.hello=Olá! Sou a Maeve. Gosto de livros e gosto de ler. Você pode aprender muito com um livro. Exceto a ler. Aprender a ler lendo um livro ainda não funcionou para ninguém que eu testei.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.quinn.hello=Não mexa nas alavancas.\nNa verdade, mexa. Com cuidado.\nNão tenho a menor ideia do que elas fazem, então se explodir... Não me olha!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello=Se você veio para abóboras, vá pelo caminho da esquerda.\nSe veio para piadas horríveis, parabéns. Você já está perdido.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_1=Me conta uma piada horrível.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.hello.response_2=Te deixo em paz.
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1=Como você conserta uma abóbora quebrada?\nCom um patch de abóbora!
skyblock_hub_dialogues.overworld.plains.pumpkingdom.winn.joke_1.response_1=Isso foi genuinamente perturbador.

# Pumpkin Towers - Potato Zombies
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce=Psiu! Você parece alguém que sabe usar uma pá ou uma espada.\nTemos uma situação aqui... Zumbis estão invadindo meus campos.\nEstão pisoteando as plantações, mastigando as cercas e, pior de tudo, comendo minhas batatas!\nVocê pode dar uma força e salvar a colheita?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response1=Claro! Não tenho medo de alguns zumbis.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.introduce.response2=Se você realmente quiser...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane=Excelente trabalho aí, parceiro!\nSe tiver um tempinho... Poderia visitar minha amiga Susane?\nEla parecia estar com dificuldades por causa de aranhas em volta das abóboras dela.\nVocê poderia dar uma passadinha lá e ajudá-la também?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response1=Vamos esmagar algumas aranhas!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.go_help_susane.response2=Vou manter suas abóboras seguras!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks=Nossa, você realmente mostrou a esses monstros quem manda!\nNão acredito que você eliminou tantos\nSe ao menos eles ficassem embora de vez... mas por enquanto, você fez uma diferença enorme!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.thanks.response=A qualquer hora, ajudar é minha especialidade!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hows_it_going=Como estão as coisas por aí?\nVocê acredita que essas criaturas tomaram o lugar assim?\nQue azar o nosso...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.potato_fred.hello=Quer saber um segredinho?\nMeu nome de verdade não é Fred.\nAs pessoas começaram a me chamar de Potato Fred depois daquela vez que fiquei preso numa pilha de batatas.\nAinda não sei como saí de lá...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.see_fred=Olá!\nEssas abóboras não são as únicas que crescem rápido, as pragas também!\nMeu parceiro, Potato Fred, precisaria muito da sua ajuda.\nPode dar uma passada lá para ver como ele está?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred=AAAAGHH!\nARANHAS! ARANHAS POR TODO LADO!\nEstão destruindo minhas abóboras!\nVocê pode me ajudar a me livrar delas?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response1=EEK, ARANHAS!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.from_fred.response2=Claro, aranhas não me assustam!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders=Você já acabou com essas aranhas?\nTenho medo de voltar se elas ainda estiverem lá...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.killing_spiders.response=Ainda tem algumas...
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.hello=Ah, adoro ver minhas abóboras indo bem...\nEssas aranhas estúpidas sempre tentam estragar tudo!\nEspero que fiquem longe de vez desta vez...

# Plains - Pumpkin Towers - Susane & Kipp
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce=Você aí! Parece alguém com senso de justiça! Tem um certo brotozinho travesso por aí roubando minhas abóboras premiadas para seus 'projetos'. Você tem que encontrá-lo para que eu possa dar uma bronca severa mas justa nele! Pode me ajudar a pegar o culpado?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_1=Vou rastrear esse pequenotravesso!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.introduce.response_2=Tá bom, vou ajudar a descobrir o que está acontecendo.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going=Encontrou o garoto e seu produto roubado? Minhas abóboras são para o festival, não para servir de alvo!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.hows_it_going.response=Ainda trabalhando nisso, Susane!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete=Lá está ele! O pequenodiabinho! ...Espera. Isso é uma abóbora esculpida? Olha o acabamento... ele não destruiu, ele melhorou! Uau, isso é realmente incrível. Obrigada por trazê-lo com sua arte.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.pumpkin_susane.carving_chaos.complete.response=Fico feliz por ter esclarecido o mal-entendido!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce=Susane te mandou me arrastar de volta ao campo? Ai não... ela vai ficar tão brava! Por favor, não me leva para ela ainda! Não sou ladrão, sou artista! Olha, se eu levar um presente de paz... me ajuda a encontrar minha faca de entalhe e vou fazer algo que vai mudar a opinião dela.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_1=Vou encontrar sua faca. Quero ver o que você consegue fazer.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.introduce.response_2=Tá bom, vou procurar. Mas não cause mais confusão.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint=A última vez que a vi foi perto das fileiras principais de abóboras enquanto eu procurava uma boa tela. Tem que estar em algum lugar lá!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.find_knife_hint.response=Estou nisso.
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife=Você encontrou! Você me salvou. Vou fazer isso rápido, vou entalhar uma obra-prima que vai fazer ela esquecer tudo sobre as abóboras desaparecidas!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.carving_chaos.after_knife.response=Vamos lá. Espero que dê certo!
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.kipp.hello=Estou na minha hoje. Arte exige foco, sabe?
skyblock_hub_dialogues.overworld.plains.pumpkin_towers.knife.dont_know=Esta faca é uma coisa estranha para estar jogada aqui. Tem 'Kipp' gravado no cabo. Provavelmente devo devolvê-la para ele.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.hello=Ouviu isso? É o som de boa comida cozinhando. O pessoal de Pumpkingdom vai adorar.\nObrigado por todo o seu esforço!
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available=Se você consegue sentir o cheiro do jantar, significa que ainda estou vencendo. Por pouco. O caixão de carvão está vazio e vários fornos racharam. Me ajuda antes que toda a Plains comece a mastigar batatas cruas.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.help=Posso ajudar.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.plan=Qual é o plano?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_available.response.breaking=Por que os fornos estão quebrando?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.why_furnaces_break=Ciclos de calor, mãos descuidadas e um pouco de azar. Um minuto estão bem, no próximo estão rachados e jogando cinzas para todo lado. Consigo trabalhar em torno de um forno quebrado. Não consigo trabalhar em torno de uma cozinha quebrada.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted=Perfeito. Preciso de três coisas, e preciso rápido. Carvão para manter o calor estável, fornos para substituir os quebrados e batatas para que eu consiga colocar algo comestível para fora.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.quest_accepted.response.all=Vou trazer tudo.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items=Toda vez que viro as costas, alguém 'verifica' um forno e deixa a porta aberta. Traz carvão, fornos e batatas, e eu transformo o pânico em jantar.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.deposit=Trouxe suprimentos.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.waiting_items.response.working=Estou nisso.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.deposit_thanks=Bom. Para os caixotes e para o fogo. Continue trazendo.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage=Isso é tudo. Os fogos voltaram, a fila está andando e a Plains vai comer comida cozida por um bom tempo.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.glad=Fico feliz por ter ajudado.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.fuel_for_the_future.final_stage.response.save=Um dia deveríamos cozinhar juntos!

# Plains - Ruins - Lewis
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available=Ruínas não são cenário. São uma rota.\nTente praticar suas habilidades nas ruínas. Você pode aumentar muito sua mobilidade.\nTente chegar até Robb, que vi brincando nas ruínas mais cedo.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.accept=Tá bom. Vou chegar à plataforma.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.tips=Algum conselho antes de começar?
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.quest_available.response.later=Agora não.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips=Escolha o próximo ponto de pouso antes de pular.\nVá devagar. Não tem necessidade de se apressar lá em cima.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.tips.response.okay=Entendido.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete=Ainda aqui embaixo? Então você ainda não chegou ao topo das ruínas.\nMantém o olhar para cima e seja paciente. Você vai chegar ao topo eventualmente.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.remind=Me lembra onde o Robb está.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.stage1_incomplete.response.go=Entendido. Estou subindo.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location=Em algum lugar perto do topo, imagino. Perdi o contato visual quando ele subiu mais nas ruínas.\nSe você ouvir o Robb rindo, é porque está perto.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.robb_location.response.on_my_way=Já estou indo.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete=De volta inteiro, vejo. Bom trabalho.\nO Robb estava se comportando? Ele está bem? Às vezes ele tem confiança demais lá em cima, mas confio nele.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.remember=Sim, ele está bem
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.complete.response.useful=Ele parece jovem demais para estar lá em cima.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools=Sim, ele é jovem, mas não temos muito para fazer por aqui.\nEle brinca nessas ruínas para se entreter.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.ruins_as_tools.response.thanks=Ah, entendi.
skyblock_hub_dialogues.overworld.plains.ruins.lewis.run_the_ruins.after_completion=Quando você vir pedras quebradas agora, deve pensar: rota, cobertura, fuga.\nConselho muito útil já que os Zumbis ficaram mais frequentes por aqui.

# Plains - Ruins - Robb
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached=haha! não acredito que você chegou!!!\nbem-vindo ao topo! tem tanto para ver daqui. é bem divertido brincar nas ruínas, né?\nfiquei te observando cair no caminho aqui. é bem engraçado ver as pessoas tentando subir aqui.\no lewis estava sendo sério de novo? talvez ele queira que eu vá para casa.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.rough=É divertido demais!
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.easy=O Lewis admira sua habilidade de se movimentar.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.stage1_reached.response.trick=Também não acredito que consegui chegar aqui.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough=muito muito divertido! hahaha! só olha para essa vista. curte bem.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.rough.response.laugh=Haha! Sim! Estou vendo!
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy=tenho certeza que sim. sou super rápido por aqui. sou o melhor em correr por cima das ruínas.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.easy.response.okay=Não fica muito confiante. É perigoso.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick=a prática leva à perfeição. você vai ficar mais confiante no futuro nas alturas das ruínas.
skyblock_hub_dialogues.overworld.plains.ruins.robb.run_the_ruins.trick.response.got_it=Entendido.
skyblock_hub_dialogues.overworld.plains.ruins.robb.hello=eiiii, como está a prática do parkour. tenho certeza que você está melhorando.


# Jungle - Treetop Tropics - Nilo & Billy
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.hello=Ei, como você está? Ainda vivo? Ótimo! Obrigado por encontrar o Billy, ele tem sorte de ser fofo ou eu poderia tê-lo transformado em tapete!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction=Oh, que crise! Catástrofe absoluta! Meu gato, Billy, sumiu de novo. Ele está em algum lugar acima de nós, provavelmente planejando a dominação mundial ou só procurando um pássaro para importunar. Você pode me ajudar a recuperar essa fera antes que ele decida morar no telhado da floresta para sempre?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_1=Que horror! Vou buscar ele imediatamente.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_2=Dou uma olhada quando não estiver desviando de cipós caindo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.introduction.response_3=Estou bem ocupado agora. A selva está uma bagunça hoje!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks=BILLY! Ah, graças às estrelas! Não acredito que você realmente o encontrou! Ele sempre fica com tanta fome que parece ter um buraco negro no estômago. Vou dar um peixe pra ele antes que ele comece a comer o assoalho da selva.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_1=Sem problema. Sou um sussurador de gatos profissional.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.thanks.response_2=MAIS PEIXE? ESSE GATO É UM POÇO SEM FUNDO!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking=Como está indo? Algum sinal do fugitivo peludo?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilo.paws_in_the_dust.looking.response=Ainda tentando. Gatos são sorrateiros, e o Billy é um ninja profissional.

# Billy the Cat
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found=Miau <italic>(Te olha com um sorriso satisfeito e sabedor)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.found.response=Vem comigo, seu pequenotravesso. Vamos para casa.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1=Miau <italic>(A barriga ronca como uma tempestade)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_1.response=Aqui, come um peixe. Para de reclamar!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2=Miau <italic>(Te olha com expectativa)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_2.response=Aqui, mais um peixe.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3=Miau <italic>(O ronco continua!)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_3.response=Esse gato é um poço sem fundo? Tá bom, peixe!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4=Miau <italic>(Sem impressionar)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_4.response=Aqui está o quarto peixe. Sério, Billy?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5=Miau <italic>(Finalmente parece satisfeito)</italic>
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.nilos_cat.paws_in_the_dust.feed_5.response=Finalmente! Vamos para casa.


# Jungle - George - Fishy Business
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction=Ah, aquela puxada suave na linha, a emoção absoluta da captura! Minha paixão pela pesca é lendária, embora eu não tenha conseguido lançar uma linha há muito tempo. Minha família está aqui na selva e não as trocaria por todos os oceanos do mundo, mas ah, como sinto falta da água! Você simplesmente tem que tentar, é pura magia!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_1=Ok! Você me convenceu!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_2=É realmente tão bom? Acho que vou tentar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.introduction.response_3=Agora não, George.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch=Como está curtindo a pesca? Já encontrou o ritmo? Espero que esteja conseguindo capturar alguns peixes incríveis!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_catch.response=Estou nisso, George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit=Quando tiver pescado o suficiente, me traz para uma inspeção de perto!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.in_progress_deposit.response=Aqui está.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks=Eu te disse que seria divertido! Olha essas belezuras, você tem um talento de verdade para isso! Obrigado por compartilhar a emoção comigo; pescar é uma ótima experiência, e ainda melhor com amigos. Pena que não pude ir até o lago eu mesmo!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.fishy_business.thanks.response=A qualquer hora, George!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.george.hello=Olá! A água está boa, até na selva! Pronto para lançar a linha? Mas sabe o que tornaria ainda melhor?\nPescar com um amigo tão próximo!


# Jungle - Celia - Bean to Bar
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.hello=Olá. O chocolate é sua comida favorita da selva? Espero que sim!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.come_back_for_sugar=Olá. Se você voltar quando tiver açúcar, posso te mostrar como adoçar seu chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available=Você aí. Quer aprender a fazer chocolate? Chocolate gostoso e delicioso. Embora não seja muito saudável, pode te dar uma dose de energia.\nVamos começar com chocolate sem açúcar. Chocolate sem açúcar é uma alternativa muito mais saudável.\nVou te dar a receita, mas você vai precisar fazer por conta própria. Me conta como foi.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_1=Que delícia! Chocolate!!!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.quest_available.response_2=Ai não, eu odeio chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.in_progress_craft=Como está indo a produção de chocolate? Espero que o chocolate sem açúcar esteja à altura das suas expectativas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete=E então? Me faz o relatório.\nFoi amargo? Que efeitos colaterais você teve?\nTanta gente começa a ficar agitada depois de comer chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_1=Amargo, mas incrível.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.bean_to_bar.complete.response_2=Acho que preciso de água.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available=Ei, de novo. Então, quer aprender a colocar açúcar no seu chocolate? Vamos lá.\nVocê já sabe como funciona. Vou te dar a receita, mas você vai precisar fazer por conta própria. Me conta como foi.\nCuidado: Chocolate não é saudável e deve sempre ser consumido com moderação.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_1=Sim, vamos fazer mais chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.quest_available.response_2=Estou sendo consciente quanto à saúde, mas tá bom.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft=Como está indo a adição de açúcar no chocolate? Logo você pode estar caminhando para um império de chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_1=Tenho isso. É fácil.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.in_progress_craft.response_2=Não sou muito bom em fazer chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete=Conseguiu! Chocolate. Completo e rico como tenho certeza que você esperava.\nAgora seja sensato e não saia correndo como louco com toda essa carga de açúcar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_1=Não se preocupa, sou muito maduro com chocolate.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.celia.the_sweet_part.complete.response_2=A ressaca do açúcar vai doer.

# Jungle - Treetop Tropics - Non-Quest
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello=Só um segundo. Só preciso verificar essas Amêndoas de Cacau. Talvez estejam prontas.\nAh, espera, e essas aqui...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.liana.hello.response_1=Vejo que você está bem ocupada agora.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello=Construí algumas dessas plataformas quando elas falharam. Espero mesmo que minha engenharia seja boa o suficiente para mantê-las no lugar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_1=Você construiu tudo isso? É impressionante.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.hello.response_2=Você parece que vai desmaiar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1=Obrigado. Bem, não tudo. Só conserto os pedaços quando ficam quebrados.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_1=Tantos corrimãos. Preferência pessoal?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1.response_2=Medo de altura...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_railings=Sim.\n<italic>(Ele segura o corrimão com as duas mãos.)</italic>\nMedo de altura resulta em medidas de segurança extras.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_1_advice=Não zoa de mim. Não foi minha escolha, nasci assim.\nEmbora eu acho que é culpa minha por ajudar aqui em cima. Queria ser um pescador no chão.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.mossby.detail_2=Você viu que altura estamos? Estamos tão alto e eu tenho medo de altura! Pode ser um pouco de mal de altitude.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello=Ei, você aí, quer uma piada horrível?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_1=Tá bom. Uma piada. Que doa.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.hello.response_2=Não, obrigado. Valorizo a paz.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu=Escolha com sabedoria. A selva tem muitos predadores, mas nenhum tão implacável quanto meus finais de piada.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_1=Me conta uma piada de folha.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_2=Me dá algo relacionado a aranha.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.menu.response_3=Tá bom. Faz o cacau ser engraçado.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_1=Tentei sair da selva, mas os cipós disseram: "Não, você fica."\nEntão acho que estou num re-laci-ono-mento de longo prazo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_2=Como se chamam dois novos cônjuges aranha?\nRecém-teci-ados!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.quibble.punchline_3=Meu cacau nunca amadurece a tempo de ser comido. Sempre fica choco-tarde demais.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.avaru.hello=Ei! Que dia lindo! Ótimo te conhecer! Espero te ver por aí!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cressida.hello=OLHA O TAMANHO DESSA ÁRVORE! É TÃO GRANDE! :O\nMargem como ela consegue água até o topo!
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello=Se você ver um ocelote, não o persiga. Ele tem muito medo de você.\nEste conselho também se aplica a pessoas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tiko.hello.response=Vou treinar minha melhor cara de indiferença.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.silva.hello=Ei, olha onde estou! Estou debaixo de uma árvore!\nCostumava ter medo dela, mas aí percebi suas raízes. São cubos. Então matematicamente vejo essa árvore de forma unidimensional, pois estou olhando para a raiz cúbica dela.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello=Você tem a cara de alguém que acabou de sair do Oak Forest.\nBem-vindo à selva, viajante. Vai precisar se acostumar a subir alto nas árvores. Espero que não tenha medo de altura.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_1=Bom saber. Fico bem com alturas.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.fern.hello.response_2=Ai não, não vou me dar bem.
skyblock_hub_dialogues.misc.optimiser_not_unlocked=Olá! Sou o Otimizador! Posso aumentar a produção de todos os seus recursos.\nSou bem seletivo com quem trabalho, então por favor volte depois de progredir mais!

# Shop Dialogues
skyblock_hub_dialogues.shop.blocks.greeting=Olá, você não vai encontrar blocos melhores em nenhum outro lugar! Quer dar uma olhada?
skyblock_hub_dialogues.shop.blocks.greeting.buy=O que você tem para vender?
skyblock_hub_dialogues.shop.blocks.greeting.sell=Deixa eu te vender algumas coisas!
skyblock_hub_dialogues.shop.blocks.greeting.nothing=Não, obrigado!
skyblock_hub_dialogues.shop.furniture.greeting=Móveis lindos para uma pessoa adorável! Posso te oferecer alguns?
skyblock_hub_dialogues.shop.furniture.greeting.buy=Me mostra o que você tem!
skyblock_hub_dialogues.shop.furniture.greeting.sell=Tenho algumas coisas para vender.
skyblock_hub_dialogues.shop.furniture.greeting.nothing=Estou bem por enquanto, obrigado.
skyblock_hub_dialogues.shop.garden.greeting=Tenho tudo para manter seu jardim florescendo! Interessado?
skyblock_hub_dialogues.shop.garden.greeting.buy=Me mostra o que você tem para vender!
skyblock_hub_dialogues.shop.garden.greeting.sell=Gostaria de vender algumas coisas.
skyblock_hub_dialogues.shop.garden.greeting.nothing=Não, obrigado!
skyblock_hub_dialogues.shop.misc.greeting=Te vejo olhando por aí! O que chamou sua atenção?
skyblock_hub_dialogues.shop.misc.greeting.buy=O que posso comprar aqui?
skyblock_hub_dialogues.shop.misc.greeting.sell=Na verdade, tenho algumas coisas para vender.
skyblock_hub_dialogues.shop.misc.greeting.nothing=Nada por agora, obrigado.
skyblock_hub_dialogues.shop.ore.greeting=Todos os minérios que o seu coração deseja! Quer dar uma olhada?
skyblock_hub_dialogues.shop.ore.greeting.buy=Me mostra seus minérios!
skyblock_hub_dialogues.shop.ore.greeting.sell=Quero te vender algumas coisas.
skyblock_hub_dialogues.shop.ore.greeting.nothing=Agora não, obrigado.
skyblock_hub_dialogues.shop.spawner.greeting=Pronto para fazer surgir mais mobs? Tenho exatamente o que você precisa!
skyblock_hub_dialogues.shop.spawner.greeting.buy=Me mostra o que você tem!
skyblock_hub_dialogues.shop.spawner.greeting.sell=Na verdade, gostaria de vender algumas coisas.
skyblock_hub_dialogues.shop.spawner.greeting.nothing=Talvez na próxima vez, obrigado.

# Cold Taiga - Ivar - Frozen Harvest
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro=O inverno tem um aperto que não quer soltar, e os estoques de grãos estão perigosamente baixos. Preciso garantir que todos se alimentem durante o congelamento. Você pode ir lá fora e coletar trigo para mim?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.intro.response.accept=Claro, vou te ajudar! A vila precisa disso.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources=Mantém a cabeça baixa e as mãos em movimento. Como está indo a colheita do trigo?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.harvesting_resources.response=Ainda trabalhando nisso! A geada é difícil de cortar.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro=Que bom te ver de volta. Encontrou algo para os estoques?
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.intro.response.yes=Aqui está o trigo, fresquinho!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks=Bom trabalho. Isso vai manter a barriga da vila cheia por mais alguns dias. Até mais!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.deposit.thanks.response=Fico feliz por ter ajudado!
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello=Como vai! Não deixa o frio entrar nos ossos.
skyblock_hub_dialogues.overworld.cold_taiga.village.ivar.frozen_harvest.hello.response=Arrasando! Se mantendo aquecido!

# Cold Taiga - Felix - Winter Warmth
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro=O frio está realmente se instalando hoje à noite, não está? Estou tentando manter todos aquecidos, mas estamos com pouco combustível para as lareiras. Você poderia coletar alguns troncos de pinheiro para que possamos ficar quentes?
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.intro.response.accept=Claro, vou te ajudar! Qualquer coisa para manter a vila aquecida.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro=Ah, você voltou! Conseguiu encontrar alguns troncos de pinheiro? O frio está se instalando aqui e minha família e eu estamos ficando um pouco gelados!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.intro.response.yes=Aqui estão os troncos de pinheiro!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks=Perfeito. Muito obrigado pela sua ajuda. Você realmente tem o coração mais gentil, isso faz esse lugar se sentir muito mais como um lar.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.deposit.thanks.response=Fico feliz por ter ajudado!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello=Olá! É tão bom te ver. Espero que seu dia tenha sido tão maravilhoso quanto você!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.winter_warmth.hello.response=Oi! Fica aquecido!

# Cold Taiga - Felix - Warmth in the Cold
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro=Obrigado por ajudar a nos manter aquecidos. Poderia me ajudar a conseguir Amoras da Neve, Migalhas de Casca de Pinheiro e Açúcar de Lápis-Lazúli em Pó?\nSão recursos raros encontrados pela Snowy Taiga, mas podem ser valiosos para a sua sobrevivência.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.intro.response.accept=Vou juntar esses para você!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro=Você encontrou os ingredientes que preciso?\nTodos podem ser encontrados na Snowy Taiga: As Amoras da Neve preferem ficar perto de arbustos de frutas. O Açúcar de Lápis-Lazúli em Pó se forma na superfície de lagos congelados, pois se dissolve na água a partir da rocha abaixo. Por fim, as Migalhas de Casca de Pinheiro são as mais difíceis de encontrar, mas você deve conseguir achar perto de árvores de pinheiro.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.intro.response.yes=Deixa eu te dar o que tenho!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks=Excelente! Agora, ouvi dizer que as Amoras da Neve podem ser bem úteis em masmorras. Elas restauram sua saúde e te dão uma camada extra de proteção!\nPoderia testá-las para mim? Tente comer algumas Amoras da Neve enquanto explora uma masmorra e me conta como funcionam!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.deposit.thanks.response=Vou testar!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress=Você já tentou comer as Amoras da Neve em uma masmorra? Estou curioso para saber se são tão úteis quanto imagino!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.eating_progress.response=Ainda não, vou tentar!
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete=Ah, então as Amoras da Neve ajudaram na Masmorra! Ótimo saber! Quando como uma sinto como se me desse um abraço quentinho.
skyblock_hub_dialogues.overworld.cold_taiga.village.felix.warmth_in_the_cold.complete.response=De nada!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro=O gelo profundo tem se movido ultimamente, revelando veias azuis que não deveriam estar lá. Preciso de lápis-lazúli para minha pesquisa. Você pode coletar algum usando uma variedade de ferramentas? Quero ver se o método de extração altera a ressonância da gema.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.intro.response.accept=Claro, vou ajudar a investigar!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress=Como está indo a quebra do lápis-lazúli com ferramentas diferentes? Alguma vibração incomum na pedra?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.in_progress.response=Ainda nisso!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro=Excelente. Posso ver as gemas de lápis-lazúli que você quebrou com ferramentas diferentes? Preciso comparar a integridade estrutural de cada lote.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.intro.response.yes=Aqui está!
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks=Obrigado. Só um segundo enquanto verifico esses...\n...\nBem, que decepção. A estrutura cristalina não mudou nada. São idênticos. Foi uma tremenda perda de tempo.\nPelo menos confirmamos que a física simples ainda se aplica aqui e que ferramentas de madeira são completamente inúteis nessa profundidade.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_1=Ah, que pena. Ciência é tentativa e erro, né?
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.deposit.thanks.response_2=Não sei bem o que você esperava, honestamente.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello=O gelo conta histórias se você olhar fundo o suficiente.
skyblock_hub_dialogues.overworld.cold_taiga.village.torin.blue_in_the_snow.hello.response=É verdade mesmo...

# Cold Taiga - Sigrid - Feather and Grain
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro=A geada está mordendo mais fundo esta temporada, e com o fundo do canyon tremendo do jeito que está, precisamos cuidar uns dos outros. Sobrevivemos juntos, ou não sobrevivemos. Você pode me ajudar a preparar um bom estoque para a vila?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.intro.response.accept=Vou resolver isso! Ninguém deveria passar fome.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro=Ah, você voltou! Vem mais para perto do fogo, querido, consigo ver o frio nos seus ombros. Como está indo a coleta?
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.intro.response.yes=Aqui está a comida que você pediu!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks=Deus te abençoe. Isso vai manter os pequenos aquecidos e o espírito dos mais velhos elevado. É esse esforço compartilhado como o seu que impede o gelo de alcançar nossos corações.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.deposit.thanks.response=Fico feliz por ter ajudado a comunidade!
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello=Olá! Sempre tem um lugar quentinho e uma palavra gentil esperando por você aqui.
skyblock_hub_dialogues.overworld.cold_taiga.village.sigrid.feather_and_grain.hello.response=Oi!


# Cold Taiga - Inga - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.before_unlock=Shiverfield sempre fica com fome nessa época do ano. Se você está procurando uma refeição, fala com Sigrid. Eu mantenho as mãos ocupadas aqui.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro=Cuidado! Não pisa aí. Vão enxamear nas suas botas como se você tivesse grãos nos bolsos.\n\nComecei com algumas galinhas. Só o suficiente para manter os fornos funcionando quando a geada aperta mais.\n\nMas ultimamente? É como se o inverno não as tocasse. A praga roxa se espalha, as pessoas passam fome e minhas galinhas se multiplicam como se estivessem nos zombando.\n\nEstão por todo lado. Nos bancos de neve. Nos telhados. Bicando buracos em sacos que não podemos substituir.\n\nNão posso simplesmente... abatê-las. São minhas e estão vivas. Eu as criei.\n\nPor favor. Fala com Runa na Guarda de Shiverfield. Ela vai saber o que fazer. Só preciso de uma resposta que não me revolte o estômago.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_1=Vou falar com ela.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.intro.response_2=Galinhas tomando conta de uma cidade. Isso é novo.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.in_progress=Se você as ver nas ruas, por favor... não as persiga por diversão, tá? Elas confiam nas pessoas. Essa é a pior parte.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete=Suas mãos cheiram a penas.\n\n...Não mente. Consigo ver nos seus olhos.\n\nVocê fez o que Runa mandou, não foi?\n\nEu odeio isso. Odeio que faz sentido.\n\nShiverfield precisa de comida. E de flechas. E o inverno não liga para o que queremos.\n\nDa próxima vez que eu me disser que consigo manter tudo seguro com boas intenções, me lembra desse momento.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_1=Sinto muito. Não tínhamos outra opção.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_2=Seu bando estava alimentando a cidade de um jeito ou de outro.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.complete.response_3=Vou te ajudar a reconstruir o galinheiro para não acontecer de novo.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.after_completion=Ainda gosto de galinhas. Só gosto mais de Shiverfield.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello=Olá.
skyblock_hub_dialogues.overworld.cold_taiga.village.inga.coop_crisis.hello.response=Oi!

# Cold Taiga - Runa - Coop Crisis
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro=Inga te mandou. Ouvi o bando antes de te ver.\n\nOlha, não gosto disso. Ninguém aqui gosta.\n\nMas as estradas estão piores agora. Os caçadores não voltam com tanta frequência. A corrupção roxa faz as matas parecerem erradas, como se as sombras estivessem ouvindo.\n\nTemos uma cidade para alimentar e uma cidade para defender das coisas estranhas que estão acontecendo.\n\nGalinhas significam carne para os famintos e penas para flechamento. Sem flechas, nós guardas viramos uma parede de mãos vazias.\n\nVocê vai ter que colher dez. Traz dez penas para mim. Não vamos desperdiçar o que pegamos.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_1=Entendido. Vou resolver.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_2=Inga não vai gostar.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.intro.response_3=Vou me certificar de que ajude a cidade.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.in_progress=Precisamos reduzir o número de galinhas um pouco mais. Ainda estão tomando conta de tudo.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro=Você tem essas penas?\n\nSão muito valiosas para a guarda, pois farão muitas flechas.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_1=Sim, aqui estão.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.intro.response_2=Não gostei de matar aquelas galinhas.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks=Bastante. O suficiente para manter a guarda abastecida por um tempo.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.deposit.thanks.response_1=Bom.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.after_completion=Se você conseguir manter Shiverfield alimentada, mantém ela viva. É o trabalho.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello=Fica com cuidado lá fora. A guarda pode te proteger por perto, mas nas profundezas da tundra, é sua própria responsabilidade.
skyblock_hub_dialogues.overworld.cold_taiga.village.runa.coop_crisis.hello.response=Vou ter cuidado.

# Cold Taiga - Kjell - Corrupted Curiosity
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available=Cuidado! Essas galinhas ficaram selvagens!\nAlgo está acontecendo com elas, e estão me atacando. Comportamento muito estranho.\nSou o Kjell. Sou um tipo de cientista. Adorava estudar química na escola, mas acho que tenho uma pista do que está acontecendo aqui.\nPode conseguir uma dessas galinhas corrompidas para eu inspecionar melhor?
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_1=Ai não, galinhas do mal. Já vou nisso!
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.available.response_2=Vou te ajudar a descobrir o que está acontecendo.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro=Você conseguiu aquela galinha corrompida? Mal posso esperar para chegar ao fundo dessa maldição.\nAh, e seja lá o que fizer, não coma. Parece uma ideia terrível e não tem nenhum benefício.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.intro.response_yes=Tenho a galinha.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit=Ótimo! Você conseguiu! Vamos dar uma olhada e ver o que temos aqui...\n...\nOh, acho que está vivo? Aquela coisa roxa. Não é uma rocha.\nBom... é tudo que consigo fazer. Disse que era bom em química, não em biologia.
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_1=Vivo? Meu Deus...
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.deposit.response_2=Acho que precisamos continuar procurando
skyblock_hub_dialogues.overworld.cold_taiga.village.kjell.corrupted_curiosity.hello=Se você descobrir mais respostas sobre o que é essa coisa roxa, estou muito ansioso para saber. Não acredito que está vivo!


skyblock_hub_dialogues.overworld.cold_taiga.shiverfield.dungeon_guard.introduce=Nossa! Ouvi dizer que você veio ajudar?\nTemos um problema enorme lá em baixo nas nossas novas minas.\nEstávamos cavando tentando extrair muito lápis-lazúli valioso das reservas debaixo dos lagos.\nNo entanto, fomos sobrecarregados! Tem tantos monstros e bichinhos horríveis. Parece que eles querem o lápis-lazúli para si mesmos.\nVocê vai nos ajudar?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro=O calor não é a única coisa nos desgastando; as próprias fundações deste oásis estão mudando. Precisamos de arenito para reforçar as âncoras antes que a areia engula o que resta da superfície. Posso contar com sua força?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.intro.response.accept=Vou ajudar a assegurar as fundações!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro=Com calma. Você conseguiu o arenito que pedi para os reforços?
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.intro.response.yes=Tenho os materiais aqui!
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks=Isso vai nos dar um tempo contra a subsidência. Cada pedra colocada é um escudo contra a queda inevitável. Obrigada.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.deposit.thanks.response=Fico feliz por ter ajudado a manter o deserto estável.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello=Mantém os pés leves e os olhos no horizonte. O deserto nunca para de se mover.
skyblock_hub_dialogues.overworld.desert.village.zahra.desert_maintenance.hello.response=Vou ficar alerta, Zahra. Obrigado.

# Desert - Unsafe Roads
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro=As rotas estão ficando traiçoeiras; a areia está engolindo as marcações mais rápido do que conseguimos colocá-las. Pode me trazer arenito para reforçarmos as rotas?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.intro.response.accept=Vou conseguir isso para você.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress=As dunas estão agitadas hoje. Você encontrou o suficiente? Precisamos garantir que temos bastante para ancorar o caminho.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.in_progress.response=Ainda procurando...
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return=Bom trabalho. A equipe relata que os suportes estão segurando. A consciência é nossa melhor defesa aqui. Obrigado.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.return.response=A qualquer hora!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello=Olhos abertos. Neste deserto, se você não está rastreando o perigo, o perigo está te rastreando.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.talib.hello.response=Ei!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.intro=Talib te mandou? Bom. O chão está mole aqui e as dunas estão avançando. Tem o arenito?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.response=Aqui está.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks=Obrigado, isso vai deixar a estrada muito mais firme. A terra vai deslizar menos com isso no lugar.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.deposit.thanks.response=Ótimo!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello=Um belo dia para construir, desde que o vento não decida levar nosso progresso de volta.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gilles.hello.response=Com certeza.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.intro=Os tremores estão sacudindo as paredes da passagem. Os tijolos de barro vão ajudar a estabilizar o caminho. Você os tem?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.response=Sim, aqui estão.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks=Perfeito, são exatamente o que precisávamos para amortecer contra as vibrações.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.deposit.thanks.response=Feliz em ajudar.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello=Cuidado nas estradas. O deserto tem um jeito de abrir quando você menos espera.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.rosanna.hello.response=Vou com cuidado.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.intro=Sem uma fundação pesada, a areia simplesmente desloca. O granito é essencial para a fundação. Trouxe algum?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.response=Tenho granito aqui.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks=Esse é um granito de alta qualidade! É pesado o suficiente para resistir aos tremores. Obrigada.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.deposit.thanks.response=De nada.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello=O deserto pode ser implacável para quem constrói em terreno raso.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.gianna.hello.response=Pode falar.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.intro=Precisamos reforçar os beirais antes que desabem. Finalmente, madeira para os suportes! Trouxe as tábuas de pinheiro?
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.response=Sim, tábuas de pinheiro conforme pedido.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks=Excelente! Temos tudo reforçado agora. Vai avisar o Talib.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.deposit.thanks.response=A caminho!
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello=Trabalho duro é a única coisa que a areia não consegue erodir.
skyblock_hub_dialogues.overworld.desert.unsafe_roads.antimo.hello.response=Com certeza.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro=Os dias estão ficando mais quentes e as noites mais incertas. Precisamos de reservas para garantir que o assentamento não desmorone. Vai me ajudar a assegurar nosso futuro?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.intro.response.accept=Posso ajudar com isso.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro=Com calma. Cada suprimento conta quando as areias começam a mudar. Você tem reservas para o estoque?
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_1=Sim, tenho aqui.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.response_2=Claro! Fico sempre feliz em ajudar!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.intro.no=Ah, desculpa! Agora não!
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks=Trabalho metódico compensa. Esses suprimentos nos manterão de pé pelas longas noites à frente. Obrigada.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.deposit.thanks.response=De nada.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello=O deserto não tem piedade de quem não está preparado. Fica em segurança lá fora.
skyblock_hub_dialogues.overworld.desert.duneside.nefra.survival_stock.hello.response=Você também.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro=As areias em movimento estão desenterrando coisas que deveriam ter ficado enterradas. As rotas estão ficando cheias de Zumbis, e está tornando a viagem impossível.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.intro.response.accept=Vou cuidar deles e limpar o caminho.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro=O ar está um pouco mais leve com esses monstros embora. Você tem alguma Carne Podre de Zumbi para mim? Preciso de prova de que as dunas estão mais seguras.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_1=Eca, carne podre. Pode ficar se quiser.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.deposit.intro.response_2=Acho que posso poupar alguns para a causa.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon=A ameaça nunca some de verdade por aqui. Volta quando tiver limpado as dunas.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_1=Pode deixar! Está indo bem!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.come_back_soon.response_2=Zumbis me assustam D:
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response=Pode deixar.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete=Com sua ajuda, asseguramos este trecho da estrada. Somos uma equipe tão poderosa!
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_1=Fico feliz por ajudar a manter as estradas abertas.
skyblock_hub_dialogues.overworld.desert.duneside.rami.clearing_the_dunes.complete.response_2=Concordo totalmente!
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello=O deserto esconde muitos perigos sob a superfície. Fica atento.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_1=Olá.
skyblock_hub_dialogues.overworld.desert.duneside.rami.hello.response_2=Espero que esteja bem!
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro=Numa terra que tenta matar tudo que é frágil, só os mais resistentes sobrevivem. O cacto é útil, fornece água, defesa e pigmento que não desbota neste brilho. Traz alguns para mim.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.intro.response.accept=Já vou nisso.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro=A areia está se movendo de novo. Você tem o cacto para nos ajudar a fortalecer o perímetro?
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.intro.response.yes=Aqui está.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks=Isso vai durar quando outras coisas murcharem. É uma planta dura para um mundo duro. Obrigado.
skyblock_hub_dialogues.overworld.desert.duneside.kesh.dry_harvest.deposit.thanks.response=De nada!
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello=O calor, a areia e o tempo tiram tudo menos a verdade. Ah, oi, estava falando comigo mesmo...
skyblock_hub_dialogues.overworld.desert.duneside.kesh.hello.response=Oi!
skyblock_hub_dialogues.overworld.desert.duneside.azim.hello=Desculpa, estou bastante ocupado agora. Estou tentando construir uma turbina eólica. Tem tanta energia para capturar no vento. Não queremos tornar a temperatura do deserto mais quente queimando carvão.
skyblock_hub_dialogues.overworld.desert.duneside.todd.hello=Ei! Sou o Todd!\nNão liga para mim, estou apenas guardando esta porta para garantir que nenhuma das criaturas lá dentro escape. Este é o túnel de fuga de Duneside, mas foi tomado por criaturas.\nSe quiser ajudar, Sunny está no fundo do túnel de fuga. Temo que ela esteja com dificuldades para limpá-lo sozinha.\nVocê não pode vir por aqui, então vai precisar encontrar a outra entrada no fundo de Duneside.
skyblock_hub_dialogues.overworld.desert.duneside.bashara.hello=Não pisa na areia mais escura. Acredito que tem algo misterioso embaixo dela.
skyblock_hub_dialogues.overworld.desert.duneside.corvin.hello=Não me lembro dessas pedras aqui. Espero muito que o teto não esteja desabando.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello=Sede nos faz lutar. Eu vendo algo que ajuda, mesmo que todo mundo odeie.
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_1=As pessoas odeiam?
skyblock_hub_dialogues.overworld.desert.duneside.derya.hello.response_2=Prazer! Só estou passando.
skyblock_hub_dialogues.overworld.desert.duneside.derya.detail_1=Vendo água de cacto. Não é água normal. É um pouco mais doce eu acho.\nTodo mundo tem medo porque não sou muito bom em tirar os espinhos do cacto.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello=Estende a mão. Posso ler seu futuro...
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_1=Tá bom. Lê meu futuro.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.hello.response_2=Não, obrigado.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1=Vejo três formas.\nUm cacto. Uma porta. E um zumbi muito irritado.\nEntão acho que seu futuro envolve todas essas coisas.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_1=Uma porta?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_2=Um zumbi irritado?
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1.response_3=Isso é um absurdo.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_doorway=Infelizmente não consigo ler mais do que isso. Só vi uma porta na minha visão. Talvez essa porta se torne muito importante para você.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_zombie=Haha! Claramente você vai irritar um zumbi no futuro.\nNunca vi um zumbi mostrar qualquer tipo de emoção antes, então você deve realmente irritá-lo muito.
skyblock_hub_dialogues.overworld.desert.duneside.eshan.detail_1_nonsense=Claro que é.\nAbsurdo é mais leve de carregar do que certeza. Estou aqui para elevar o moral das pessoas ao meu redor.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello=Ugh, areia tem um gosto horrível. Fica soprando na minha boca.
skyblock_hub_dialogues.overworld.desert.duneside.vesper.hello.response_1=Por que fica tão perto da areia?
skyblock_hub_dialogues.overworld.desert.duneside.vesper.detail_1=Tenho lugares para onde ir! Não vou deixar a areia me atrapalhar.
skyblock_hub_dialogues.npc_name.devin=Devin
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello=Os desenvolvedores deste jogo dizem que é difícil continuar criando tantos diálogos para NPCs diferentes, então simplesmente copiaram e colaram alguns deles.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_1=Que preguiça.
skyblock_hub_dialogues.overworld.desert.duneside.devin.hello.response_2=Não percebi isso. Vou ficar de olho
skyblock_hub_dialogues.overworld.desert.duneside.dungeon_guard.introduce=Ei! Acredita! O túnel de fuga de Duneside foi tomado por criaturas do mal!\nO túnel de fuga é fundamental para a nossa sobrevivência. Muitas tempestades de areia fortes enterram a entrada principal de Duneside, e o túnel de fuga é nosso único backup!\nFui autorizado a usar um velho sistema nosso para inundar o túnel com Lava para ajudar a esterilizá-lo. Fico sem fôlego só de descer aqui, então não acho que seja uma boa ideia para mim enfrentar isso.\nVocê toparia fazer isso?

# NPC Names
skyblock_hub_dialogues.npc_name.alder=Alder
skyblock_hub_dialogues.npc_name.thorne=Thorne
skyblock_hub_dialogues.npc_name.bram=Bram

# Alder Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.before_unlock=Dia ocupado. Árvores para cuidar, madeira para processar. Volta mais tarde se precisar de algo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available=Você ajudou o Ronan a remendar os danos daqueles tremores, não foi? Bom trabalho. Mas não podemos continuar reparando rachaduras toda vez que o chão decide se mover. Tenho pensado... os carvalhos antigos aguentaram coisa pior. Suas raízes se espalham amplamente, flexíveis com a terra. Talvez possamos aprender com eles. Quer me ajudar a testar algo?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.what_thinking=O que você está pensando?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.got_time=Tenho tempo. O que precisa?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_available.response.not_now=Agora não, desculpa.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation=Bram e eu temos discutido fundações flexíveis, estruturas que se movem *com* o solo em vez de rachar contra ele. A floresta já faz isso. Toda vez que o vento bate no topo das árvores, as raízes absorvem o estresse. Se pudermos replicar esse princípio... bem, da próxima vez que algo tremer, talvez os prédios dobrem em vez de quebrar.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.how_help=Como posso ajudar?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.complicated=Parece complicado.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_explanation.response.think_about=Vou pensar nisso.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response=É mais simples do que parece. A natureza já resolveu o problema. Só precisamos observar e adaptar. Começa olhando para o Carvalho Antigo, suas raízes têm se mantido firmes por décadas. É lá que a resposta está.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.im_in=Tá bom, estou dentro.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.complicated_response.response.come_back=Deixa eu voltar a isso depois.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions=Perfeito. Tem alguém com quem você deve falar primeiro: Thorne. Ele é um pesquisador de árvores que tem estudado o Carvalho Antigo há semanas. Montou acampamento perto dele. Se alguém entende como essas raízes ficam estáveis durante tremores, é ele. Vai encontrar Thorne e ver o que ele aprendeu.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_instructions.response.find_him=Vou encontrá-lo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active=Thorne ainda está no Carvalho Antigo, estudando esses sistemas de raízes. Vai falar com ele, ele vai explicar melhor do que eu.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage1_active.response.on_way=Já estou indo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return=Você voltou. O que viu?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.roots_web=As raízes se espalhavam por todo lado como uma teia.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.stage2_return.response.big_tree=É só uma árvore grande.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.correct_observation=Exatamente. Uma teia. Cada raiz apoia as outras. Quando o solo se move, toda a rede flexiona junto, sem nenhum ponto único de falha. É o que os prédios precisam. Não blocos rígidos que racham sob pressão, mas suportes interconectados que distribuem o estresse. Bram pode projetar a estrutura de treliça, mas vamos precisar de materiais. Bastante deles.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.playful_correction=Olha mais de perto da próxima vez. Essa "só uma árvore grande" sobreviveu séculos por ser mais esperta do que nós. Suas raízes se espalham amplas e profundas, quando o solo se move, toda a rede flexiona. Esse é o segredo. De qualquer forma, você viu o suficiente. Agora precisamos de materiais para construir algo parecido.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions=Aqui está o que precisamos: Primeiro, junte mudas de carvalho. Não plantadas, naturais. Quero estudar seus padrões iniciais de raiz e usá-las como amortecedores vivos em torno das estruturas principais. Enquanto faz isso, vamos precisar de componentes fabricados. Bram vai precisar de lajes de carvalho. Elas distribuem o peso melhor do que blocos inteiros. E cercas de carvalho. Vão criar suportes de treliça flexíveis, como raízes entrelaçadas. Você pode trabalhar em tudo isso no seu próprio ritmo. Volta quando tiver as mudas, e entrega as peças fabricadas para Bram.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.got_it=Entendido. Mudas, lajes, cercas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.why_saplings=Espera, por que mudas?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.materials_instructions.response.lot_crafting=Isso é muito para fabricar.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_explanation=Árvores jovens se adaptam mais rápido. Se as plantarmos perto das fundações, suas raízes vão crescer naturalmente para dentro da rede de suporte. Além disso, estudar seu crescimento inicial nos diz como moldar as treliças de madeira. Estruturas vivas e construídas trabalhando juntas, esse é o objetivo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.workload_acknowledgment=É verdade. Mas se vamos fazer isso funcionar, precisamos fazer direito. Leva seu tempo. A floresta não tem pressa, e nós também não precisamos ter.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check=Como está indo a coleta? Preciso dessas dezesseis mudas de carvalho quando você conseguir. E não esquece que Bram está esperando as lajes e cercas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.working_on_it=Ainda trabalhando nisso.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.gathering_check.response.remind_me=Me lembra do que você precisava?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.requirements_reminder=Dezesseis mudas de carvalho para mim. Sessenta e quatro lajes de carvalho e trinta e duas cercas de carvalho para Bram. Tudo madeira de carvalho.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered=Você conseguiu as mudas! Deixa eu ver essas. *(examina)* Bons exemplares, sistemas de raízes saudáveis começando a se formar. Elas vão se integrar perfeitamente com os suportes de treliça quando Bram terminar a construção. Excelente trabalho.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.what_do=O que vai fazer com elas?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.saplings_delivered.response.happy_help=Fico feliz por ter ajudado.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.planting_strategy=Vou plantá-las estrategicamente ao redor do perímetro dos prédios. Conforme crescerem, suas raízes vão criar reforço natural, fundações vivas que flexionam com o solo. Combinado com os suportes de madeira de Bram, teremos um sistema híbrido. O melhor dos dois mundos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram=As mudas estão perfeitas. Agora só precisamos que Bram consiga seus materiais. Você já entregou as lajes e cercas para ele?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.working=Trabalhando nisso.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.waiting_bram.response.not_yet=Ainda não.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete=Você fez tudo o que pedimos e mais. Bram já começou a montar a estrutura de treliça, e plantei as mudas ao redor das estruturas críticas. Quando o próximo tremor chegar, e ele vai chegar, esta vila não vai apenas aguentar. Ela vai se adaptar. Você nos ajudou a construir algo que aprende, algo que dura. A floresta fornece, mas você garantiu que estávamos ouvindo. Obrigado.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.will_work=Isso vai funcionar mesmo?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.glad_help=Fico feliz por ter podido ajudar.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.quest_complete.response.another_tremor=O que acontece se houver outro tremor?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.confidence=Acredito que sim. Os princípios são sólidos, a natureza os usa há milênios. O trabalho de Bram é consistente. E você nos deu exatamente o que precisávamos. Se o chão tremer de novo, estaremos prontos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_readiness=Então veremos se nossa engenharia aguenta. Mas mesmo que não aguente, aprendemos algo. É assim que o progresso funciona: observar, adaptar, melhorar. A floresta ensina isso toda temporada.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion=As fundações flexíveis estão se saindo bem até agora. Sem tremores ainda, mas quando vierem, estaremos prontos. Ainda cuidando das mudas, estão crescendo bem. Obrigado de novo pela sua ajuda.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.good_hear=Bom saber.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.after_completion.response.other_projects=Algum outro projeto?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.alder.future_projects=Sempre tem algo para melhorar. Mas por enquanto, estou focado nisso. A floresta fornece, eu só a ajudo a seguir em frente.

# Thorne Dialogues
skyblock_hub_dialogues.overworld.oak_forest.thorne.before_quest=Oh! Olá. Sou o Thorne, dendrocronologista. Isso é um pesquisador de idade de árvores, em termos mais simples. Tenho documentado a arquitetura de raízes do Carvalho Antigo. Espécime fascinante. Já tem quase três semanas aqui e ainda estou encontrando novos padrões de ramificação!
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction=Alder te mandou? Excelente! Ele pediu que eu explicasse minhas descobertas, não foi? Bem, você veio ao lugar certo. Este carvalho *(gesticula para a árvore enorme)* tem mais de 300 anos, e seu sistema de raízes é absolutamente notável. Veja como as raízes se espalham para fora nessa treliça entrelaçada? Cada raiz primária se ramifica em secundárias, que se ramificam em terciárias... cria redundância. Se uma seção é danificada ou estressada, a carga se distribui por toda a rede. Durante aquele tremor na semana passada, observei o solo se mover, você podia realmente *ver* as raízes flexionando, absorvendo o movimento. A árvore mal balançou. Esse é o segredo: flexibilidade mais interconexão igual a estabilidade.
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.roots_web=Então as raízes funcionam como uma teia?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.help_buildings=Como isso ajuda os prédios?
skyblock_hub_dialogues.overworld.oak_forest.thorne.stage1_interaction.response.incredible=Isso é incrível.
skyblock_hub_dialogues.overworld.oak_forest.thorne.web_confirmation=Precisamente! Uma teia tridimensional que se move como um organismo. Sem nenhum ponto único de falha. Se Alder e Bram conseguirem replicar esse princípio com suportes de madeira, os prédios vão sobreviver a tremores muito melhor do que fundações rígidas de pedra jamais conseguiriam. A natureza tem aperfeiçoado esse design por milhões de anos, nós apenas pegamos o modelo emprestado.
skyblock_hub_dialogues.overworld.oak_forest.thorne.buildings_explanation=Ah! É aí que entra a genialidade de Alder. Ele quer construir estruturas de suporte que imitem essa rede de raízes, treliças de madeira interconectadas que podem flexionar sob estresse em vez de rachar. Adicione mudas vivas ao redor do perímetro, e conforme crescerem, suas raízes reais vão se integrar com as estruturas construídas. Engenharia híbrida. É genial, na verdade.
skyblock_hub_dialogues.overworld.oak_forest.thorne.enthusiastic_response=Não é? Poderia estudar esta árvore por anos e ainda aprender algo novo todo dia. Mas Alder precisa de aplicações práticas, não apenas de observações acadêmicas. Vai contar a ele o que você viu: a estrutura de rede, a flexibilidade, a distribuição de carga. Ele vai saber o que fazer com essa informação.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1=Alder achou minhas observações úteis? Espero que sim. As árvores têm tanto a nos ensinar sobre resiliência e adaptação.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.working_on_it=Ele está trabalhando nisso.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_stage1.response.what_else=O que mais você aprendeu?
skyblock_hub_dialogues.overworld.oak_forest.thorne.other_learnings=Ah, por onde começar? Os padrões de anéis de crescimento sugerem que esta área passou por uma atividade sísmica significativa há cerca de 80 anos, muito pior do que o tremor da semana passada. No entanto, a árvore sobreviveu. Também tenho rastreado redes de fungos no solo, elas conectam múltiplas árvores subterraneamente, compartilhando nutrientes e informações. A floresta é muito mais interconectada do que a maioria das pessoas percebe.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion=Ouvi que Alder e Bram terminaram as fundações flexíveis! Usar minha pesquisa de raízes para engenharia prática, estou honrado. A floresta realmente fornece, não é?
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.thanks=Obrigado pela sua ajuda.
skyblock_hub_dialogues.overworld.oak_forest.thorne.after_completion.response.studying_now=O que está estudando agora?
skyblock_hub_dialogues.overworld.oak_forest.thorne.acknowledge_thanks=Com prazer! É raro que minha pesquisa tenha aplicações práticas imediatas. Normalmente apenas publico artigos que três outros dendrocronologistas leem. Isso foi... revigorante.
skyblock_hub_dialogues.overworld.oak_forest.thorne.current_research=Estou examinando padrões de erosão de casca agora. Tentando correlacioná-los com dados climáticos históricos. Não tão emocionante quanto sistemas de raízes à prova de terremotos, eu admito, mas ainda valioso para entender a história da floresta.

# Bram Dialogues
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.before_quest=Trabalhando. Volta se Alder te mandar.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.quest_accepted=Alder me mencionou? Bom. Me avisa quando tiver os materiais prontos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages=Alder me falou sobre o plano de fundação flexível. Pensamento inteligente. Vou cuidar da construção da treliça, mas preciso de materiais precisos. Sessenta e quatro lajes de carvalho e trinta e duas cercas de carvalho. Lajes distribuem o peso sem rachar. Cercas criam suportes entrelaçados. Traz quando estiver pronto.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.get_crafted=Vou fabricar isso.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_slabs=Por que lajes em vez de blocos inteiros?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.crafting_stages.response.why_fences=Por que cercas?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.slabs_explanation=Blocos inteiros são rígidos. Rígido quebra. Lajes são mais finas, comprimem levemente sob estresse, depois voltam ao normal. Flexibilidade sem falha. É o que precisamos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_explanation=Cercas se entrelaçam. Um poste se conecta ao próximo. Quando a força atinge a rede, ela se espalha por todos os pontos de conexão. Nenhuma peça única recebe a carga completa. Mesmo princípio das raízes de árvore. Só madeira em vez de solo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials=Ainda preciso das lajes e cercas. Leva seu tempo. Prefiro esperar por qualidade do que apressar um trabalho ruim.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.almost_done=Quase terminando.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_materials.response.remind=Me lembra do que precisava?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.requirements_reminder=Sessenta e quatro lajes de carvalho. Trinta e duas cercas de carvalho. Tudo carvalho.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.still_need_fences=Ainda preciso das cercas. Traz essas, e podemos começar a construir.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered=Cercas. *(testa uma)* Juntas sólidas. Essas vão formar a treliça. Bom trabalho.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.everything=Agora tem tudo o que precisa?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.fences_delivered.response.thanks=Obrigado.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.have_everything=Com as lajes e cercas, sim. Alder está cuidando das mudas. Eu cuido da construção. Fala com Alder quando estiver pronto.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.waiting_alder=Os materiais chegaram. Estou começando a montagem. Fala com Alder, ele vai querer finalizar o plano.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion=A treliça está instalada. As fundações estão segurando. Trabalho sólido dura.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.good=Bom saber.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.after_completion.response.hold_tremor=Acha que vai aguentar um tremor?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bram.confident=Construí direito. Usei os materiais certos. Vai aguentar.

# Ring The Bell
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.ring_the_bell.investigate=Você dá um puxão firme no sino. Ele soa forte e claro.\nSino do dia. Silêncio do dia.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.bell.hello=O sino está parado.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.locked=Desculpa, não consigo fazer aquela coisa do "discurso de boas-vindas".\nSe Cubit ainda não te mostrou a praça, começa por lá.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.in_progress=Tenta o sino na praça, depois pergunta para Levi, Sandy, Liora e Lee se ouviram algo à noite.\nDepois volta para mim.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello=Ei.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available=Ei. Você é a nova cara que Cubit fica mostrando por aí, né? Bom. Então terá ouvidos frescos.\nOuve... você ouviu o sino à noite?\nNão o toque do dia. Não o tipo alegre. Quero dizer o tipo que faz seu estômago afundar.\nFico acordando com ele. E quando corro para fora... nada.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.bell_at_night=O sino da vila? À noite?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.dream=Talvez tenha sido um sonho?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.available.response.what_do=O que precisa que eu faça?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request=Vai até a praça e testa o sino. Depois pergunta para algumas pessoas se ouviram algo estranho depois de escurecer.\nLevi e Sandy estavam com Cubit quando você chegou, né? Começa por eles. E fala com Liora e Lee também.\nSe mais ninguém ouviu... então o problema sou eu. Mas preciso saber.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.on_it=Tá bom. Vou perguntar por aí.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.why_me=Por que me perguntar?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.request.response.are_you_ok=Você está bem?
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.why_you=Porque você não me deve uma mentira gentil.\nQuem te conhece vai tentar ser gentil. Quem não te conhece vai só te dizer o que ouviu.\nE eu preciso da verdade.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.are_you_ok=Estou... me virando.\nVai lá e ouve por você mesmo. Se eu estiver errado, quero estar errado de propósito, não por acidente.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete=Então. Ninguém ouviu.\nIsso é... um alívio. E também não é.\nQuando acontecer de novo, vou tentar lembrar dessa sensação. Que pode estar quieto lá fora, mesmo que minha cabeça esteja barulhenta.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.not_alone=Você não está sozinho nisso.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.something_else=Talvez seja outra coisa, não o sino.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete.response.tell_me=Se acontecer de novo, me conta.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_not_alone=...Obrigado. Nem sempre me lembro que posso pedir ajuda.\nEstou tentando.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_something_else=Talvez.\nÀs vezes o som viaja de forma estranha pela madeira. Pelas raízes.\nÀs vezes você ouve algo real, só que não onde pensa que está.
skyblock_hub_dialogues.overworld.oak_forest.chris.ring_the_bell.complete_tell_me=Vou contar.\nE se eu sair correndo lá para fora no meio da noite de novo... pelo menos terei uma razão além do pânico.
skyblock_hub_dialogues.overworld.oak_forest.chris.hello.after_ring_the_bell=Ei. Obrigado de novo por verificar.\nSe o sino algum dia realmente tocar, você provavelmente vai ser o primeiro a saber.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked=Sino à noite...? Mmm.\nOuço muita coisa à noite.\nMeu cobertor. Meu estômago. O vento.\nUma vez ouvi um biscoito chamando meu nome. Aí descobri que era só... eu mesmo. Chamando o biscoito.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.no=Então você não ouviu?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.asked.response.worried=Chris está preocupado. Consegue pensar em algo?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.nope=Não. Se o sino tivesse tocado à noite, eu acordaria.\nA não ser que fosse muito educado. Aí eu provavelmente dormiria durante.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.levi.ring_the_bell.idea=Às vezes sons ecoam.\nSabe quando você bate numa caneca e ela fica cantando?\nMadeira também faz isso.\nFala para Chris beber água. E talvez tirar uma soneca.\nSonecas resolvem a maioria das coisas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked=O sino? Adoro o sino!\nMas à noite? Não.\nSe tocasse, estaria lá fora imediatamente: "QUEM ESTÁ FESTEJANDO?"\nÀ noite é principalmente grilos e Levi roncando.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.weird=Então você não ouviu nada estranho?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.asked.response.chris=Chris fica acordando com isso.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.nothing=Nada parecido com sino. Às vezes ouço um *toc toc* como bolotas batendo no telhado.\nPode soar mais agudo do que deveria.\nTalvez Chris tenha um problema de bolota.\nOu um problema de telhado.\nOu um problema de bolota no telhado!
skyblock_hub_dialogues.overworld.oak_forest.oakridge.selena.ring_the_bell.concern=Coitado do Chris.\nEle é o tipo de pessoa que ouve um som estranho e imediatamente tenta carregar isso por todo mundo.\nFala que a vila está quieta. E que vou caminhar com ele para casa se ele se assustar.\nNa verdade não. Ele vai caminhar comigo para casa. Eu me distraio.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked=O sino é honesto.\nEle toca quando mãos o puxam, e quando o vento o sacode.\nMas a floresta pode fazer sua própria música.\nRaízes se movem. Galhos se acomodam. Madeira velha suspira.\nSe Chris ouve um toque que mais ninguém ouve... pode ser porque ele está ouvindo com muita atenção.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.no=Então você também não ouviu?
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.asked.response.what_sound=Alguma ideia do que poderia soar como um sino?
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.no=Não. Não o sino.\nMas ouço a vila se acomodar à noite.\nComo uma casa respirando. Como o chão exalando.
skyblock_hub_dialogues.overworld.oak_forest.liora.ring_the_bell.what_sound=Bolotas podem fazer isso.\nDuas cascas batendo no ritmo certo. Uma rolando numa calha.\nSons pequenos ficam agudos quando você está com medo.\nFala para Chris que o medo cria ótimos ouvidos e péssimas conclusões.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked=À noite? Nenhum sino.\nE tenho certeza disso.\nQuando o sino toca, os animais reagem. Cachorros ficam atentos. Pássaros se assustam. Até os gatos pausam seus pequenos esquemas.\nSe o sino tivesse tocado e ninguém percebesse, teríamos uma vila cheia da vida selvagem mais calma do mundo.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.imagining=Então você acha que Chris está imaginando?
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.asked.response.notice=O que você notou à noite?
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.imagining=Acho que Chris está cansado.\nE cérebros cansados costuram absurdo em padrões.\nNão significa que ele está inventando de propósito.\nSó significa que ele precisa de sono mais do que de respostas.
skyblock_hub_dialogues.overworld.oak_forest.lee.ring_the_bell.notice=Corujas. Vento. O tipo de silêncio que te faz ouvir seus próprios passos.\nÀs vezes você pega um zumbido se ficar perto de madeira velha tempo suficiente.\nNão um sino. Mais como... a memória de um.
skyblock_hub_dialogues.overworld.oak_forest.liora.hello=Saudações, andarilho. Os carvalhos antigos sussurram sua chegada, e suas vozes me trazem conforto nesta vasta floresta. O que te traz aqui para nos ouvir?
skyblock_hub_dialogues.overworld.oak_forest.lee.hello=Ei, te vi passando pela vegetação densa. Os esquilos estavam tagarelando sobre isso. Está tudo bem lá fora na floresta?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro=Se tiver um momento, poderia me ajudar a reabastecer? Os construtores estão trabalhando o dia todo, e uma panela vazia não faz bem a ninguém.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.ill_bring=Vou te trazer um pouco de sopa.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.intro.response.why=Por que sopa de beterraba?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.accepted=Obrigada. Preciso de dezesseis tigelas para manter a fila andando.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup=Fácil de fazer em lotes, fácil de carregar e aquece por dentro. Simples é bom quando você está alimentando um assentamento inteiro.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.why_beetroot_soup.response.ill_bring=Vou te trazer um pouco de sopa.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro=Teve sorte? Preciso de dezesseis tigelas para manter a fila andando.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.intro.response.yes=Aqui está.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks=Perfeito. Isso vai manter todos em movimento. Obrigada. Passa aqui de novo se quiser uma tigela quentinha.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.deposit.thanks.response=Fico feliz por ter ajudado.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.elia.roots_of_the_forest.hello=Olá. Quer uma tigela quentinha?

# Hungry Hands (Potato Towers)
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available=Para. Potato Towers não é um mercado. É uma muralha com uma despensa atrás. E ultimamente, a despensa ganhou pernas.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.zombies=Zumbis de novo?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.accept=Se alguém está roubando, vou descobrir.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_available.response.decline=Não é problema meu.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.zombies_clarification=Se fossem zumbis, ficaria feliz. Zumbis não discutem. Não choram. Não te olham nos olhos e perguntam por que você tem batatas e eles não.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation=Fui designado para defender este lugar dos mortos. Era esse o acordo. Mas os vivos continuam testando os portões. Mãos famintas, pés rápidos e uma dúzia de desculpas. Preciso que você descubra quem está fazendo isso e me traga algo concreto. Nomes. Um padrão. Alguém em quem eles confiem.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.start=Por onde começo?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.quest_explanation.response.handle=Vou resolver isso.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.starting_point=O beco atrás das lojas. Três rostos continuam aparecendo perto das carroças: Tess, Joss e Perrin. Fala com eles. Você vai descobrir quem está puxando os fios.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check=Se você vai parar um roubo, faça com fatos. Fala com Tess, Joss e Perrin. Depois volta.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.on_it=Já estou nisso.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.progress_check.response.remind=Me lembra quem estou procurando.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.reminder=Tess, Joss e Perrin. Três nomes. Uma história. Traz a verdade para mim.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution=Acabei de falar com Ceryn. Não é criminoso. Não é um santo. Só alguém em quem as pessoas confiam.\nRoubar é errado. Não vou fingir o contrário.\nMas eu não entendia o quanto havia piorado lá fora. A sombra de Pumpkingdom chega mais longe do que nossos portões.\nEntão é o que vai acontecer. Os portões ficam fechados. Mas vou ser mais lento para notar uma sacola que não é minha. E vou começar a pressionar por rações adequadas que não precisem de furtividade.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.fair=Isso é... justo.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.open=Por que não abrir os portões?
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.stage7_resolution.response.sooner=Você poderia ter feito isso antes.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.why_not_open=Portões abertos convidam mais do que fome. Convidam pânico. E zumbis. Consigo segurar uma linha, mas não consigo segurar uma debandada.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.admission=Sim. E deveria ter feito perguntas antes de começar a contar batatas faltando como se fossem flechas num carcaj. Estou aprendendo.
skyblock_hub_dialogues.overworld.plains.potato_towers.garran.after_completion=Se você ver alguém olhando para uma carroça por tempo demais, não assuma que é ladrão. Às vezes estão apenas calculando se comida vale a vergonha.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first=Se Garran te mandou, pode parar de me fulminar. Sei como isso parece.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.stealing=Você está roubando de Potato Towers?
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.hurt=Não estou aqui para te machucar.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.stage2_first.response.started=Me conta quem começou isso.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.direct_question=Eu roubo tempo. Roubo calor. Roubo um momento em que meu estômago não está gritando. Batatas são só a forma que isso toma.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hint=Se você quer aquele em quem as pessoas confiam, encontra Ceryn. Não é um líder. É uma bússola. Acampado fora da estrada onde as torres param de fazer sombra.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first=Você vai me arrastar de volta para o portão? Tá bom. Faz isso. Pelo menos dentro das muralhas tem luz.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.why=Por que roubar daqui?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.behind=Quem está por trás disso?
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.stage3_first.response.truth=Posso ajudar se você me contar a verdade.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.contrast=Porque aqui o ar cheira a comida cozida. Perto de Pumpkingdom, cheira a pedra úmida e coisas mortas. As pessoas não roubam porque é divertido. Roubam porque está perto.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hint=Ceryn. É quem você quer. Não damos um passo sem perguntar o que Ceryn faria. Principalmente porque Ceryn pensa antes de agir.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first=Se você veio por batatas, chegou tarde. Os poucos restos de comida que tínhamos já se foram.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.following=Estou procurando quem você está seguindo.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stage4_first.response.stop=Para de roubar.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.stop_response=E daí? Para de ter fome porque você disse uma frase? Fazemos o que precisamos para sobreviver. Fala com Ceryn se quiser saber mais.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hint=Encontra Ceryn no acampamento. Ceryn também odeia o roubo. Diz que nos torna menores. Mas Ceryn também se recusa a deixar as pessoas passarem fome.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first=Garran acha que sou um líder. Não sou. Sou apenas aquele em quem as pessoas olham quando estão prestes a fazer algo que não podem desfazer.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.reason=Eles dizem que você é a razão pela qual estão roubando.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.starving=Potato Towers tem bastante. Vocês estão passando fome.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.stage5_first.response.escort=Vem comigo. Fala com Garran.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.framing=Estão roubando porque estão com fome. Potato Towers tem uma montanha de batatas e um fosso de regras. Isso não é justiça. Mas roubo ainda é roubo.\nCaminha comigo. Vou dizer isso na cara dele. Se Garran quiser chamar de crime, tudo bem. Mas quero que ele entenda o que está defendendo.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.escort_start=Vamos falar com Garran. Vem comigo. Quero uma conversa, não uma rebelião.
skyblock_hub_dialogues.overworld.plains.potato_towers.tess.hello=Se você está aqui para me acusar, poupe seu fôlego. Faço o que preciso para sobreviver.
skyblock_hub_dialogues.overworld.plains.potato_towers.joss.hello=Você está perdido? Infelizmente não tenho muitas rações para oferecer.
skyblock_hub_dialogues.overworld.plains.potato_towers.perrin.hello=Cuidado por aqui. As pessoas não são simpáticas quando estão com fome.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello_before_quest=Olá. Você também está passando fome?\nEstamos trabalhando juntos para tentar conseguir algumas rações de Potato Towers. É o que precisamos fazer para sobreviver.
skyblock_hub_dialogues.overworld.plains.potato_towers.ceryn.hello=Eu e os guardas estamos em melhores termos. Estamos nos virando agora, graças à sua ajuda.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available=Estamos organizando uma refeição compartilhada para os civis de Pumpkingdom. Depois do colapso, uma mesa quente significa mais do que uma celebração.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.whats_wrong=Por que você está tão tenso com isso?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.need_help=O que precisa de mim?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_available.response.later=Volto mais tarde.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation=Pumpkingdom não é a mesma desde que caiu. Algumas pessoas perderam suas casas. Outras perderam suas cozinhas. Você pode reconstruir pedra, mas a fome faz as pessoas desaparecerem quietinho.\nRhea e eu estamos mantendo a noite simples: algo que encha, nada desperdiçado, e o suficiente guardado para que as Plains não sintam amanhã.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.what_do_you_need=Tá bom. O que precisa de mim?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.quest_explanation.response.wasting_food=Por que ajudar Pumpkingdom?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup=Porque ainda são nossos vizinhos. E porque a parte mais difícil depois de um colapso não é a escombreira, são as semanas em que você para de esperar ser alimentado.\nPodemos dar a eles uma boa noite sem transformar a despensa das Plains numa promessa que não conseguimos cumprir.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.wasting_food_followup.response.tell_me=Faz sentido. Qual é o plano?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.what_i_need=Fala com Rhea primeiro. Ela está decidindo o que vai para as pessoas e o que racionamos para depois. Você a encontra lá em cima.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions=Fala com Rhea antes de coletar qualquer coisa. Ela está coordenando a refeição de hoje à noite.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.on_it=Já vou nisso.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions.response.remind=Me lembra.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.stage1_instructions_reminder=Encontra Rhea lá em cima. Pega a lista. Segue à risca.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder=Conseguiu juntar suprimentos para a refeição de Pumpkingdom?
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.deposit_potatoes=Tenho batatas para guardar para depois.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.active_reminder.response.working=Ainda trabalhando nisso.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.potatoes_delivered=Bom. Vou levar essas batatas ao armazém.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report=Essa foi a última peça que precisávamos. Pumpkingdom vai comer, as Plains vão ficar abastecidas por um tempo. Obrigado.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.good=Fico feliz por ter ajudado.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.response.close=Não tinha percebido o quanto fica perto do limite.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.final_report.close_followup=A maioria das pessoas não percebe. É por isso que trabalho tão de perto com Rhea para manter os alimentos estocados para as estações mais difíceis.
skyblock_hub_dialogues.overworld.plains.storehouse.nolan.food_fest.after_completion=Se você ver alguém de Pumpkingdom parecendo perdido, aponta para a mesa. Deixa que tenham um prato cheio.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.before_quest_started=Se você está aqui para a refeição de Pumpkingdom, não fique parado por aí. Ou traz algo para a mesa ou sai do caminho. Se você está aqui para trabalhar, fala com Nolan.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro=Nolan te mandou. Bom.\nEsta noite alimentamos os civis de Pumpkingdom. Desde o colapso, alguns deles têm vivido com o que conseguem trocar, saquear ou esticar. Vamos dar a eles uma boa refeição sem colocar as rações das Plains em risco.\nTraz batatas para Nolan guardar para depois. Traz 64 abóboras para mim para a refeição desta noite.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.why_pumpkins=Por que abóboras para a refeição?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.who_wasting=Eles estão realmente passando tanto por isso?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.stage1_intro.response.got_it=Entendido. Volto logo.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.why_pumpkins_followup=Estamos na temporada de abóboras agora e estamos bem de estoque. Elas não duram muito e são bem sazonais.\nAs batatas guardam por mais tempo, então é melhor guardá-las para refeições futuras.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.who_wasting_followup=Sim. O colapso faz isso. Quando uma cidade se quebra, os fornos ficam frios primeiro.\nEles não vão dizer em voz alta, mas dá para ver: pessoas comendo muito rápido, guardando cascas, fingindo que não estão com fome. Vamos dar a eles uma noite onde possam parar de contar as mordidas.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder=Você tem os suprimentos de abóbora para a refeição de hoje à noite?
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.deposit_pumpkins=Tenho abóboras para a refeição.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.active_reminder.response.on_it=Já estou nisso.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.pumpkins_delivered=Perfeito. Isso vai fazer uma refeição perfeita esta noite.
skyblock_hub_dialogues.overworld.plains.fields.rhea.food_fest.after_completion=Se você ouvir risadas esta noite, você ajudou a tornar isso possível.\nNosso armazém está cheio e as pessoas serão alimentadas.\nFique orgulhoso de você mesmo.

# Non-Quest NPCs
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello=Sou Carpinteiro. Faço cadeiras que não desabam durante tremores. Na maioria das vezes.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_1=Na maioria das vezes?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.hello.response_2=Tem alguma piada de carpinteiro?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_1=Se o chão treme, os móveis têm que manter o ritmo. "Na maioria das vezes" significa que perdi exatamente uma batalha para a gravidade.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.marlow.detail_2=Tentei fazer um cinto de casca de carvalho. Foi uma perda de cintura.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello=Você sente isso? As árvores estão zumbindo. Ou está vindo um tremor, ou a floresta está fofocando de novo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_1=A floresta fofoca?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_2=Como você fica calmo?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.hello.response_3=Te deixo em paz.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_1=O vento entre as árvores na floresta sussurra. Estou convencida de que está falando comigo, mas talvez seja meu nervosismo. Ontem tenho certeza que disse 'perdi o jogo'...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.tamsin.detail_2=Dou um nome para cada rangido e estalo. É mais difícil ter medo de algo com um nome como Gerald.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello=Sou eu ou as Bolotas aqui parecem ter poderes mágicos?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.hello.response_1=Magia?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.brindle.detail_1=Sim. Você não as viu? Algumas estão escorrendo aquela coisa roxa.\nNão tenho ideia do que é isso. Pra mim não é um bom sinal.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello=Não tenho medo de aranhas. Simplesmente respeito suas opiniões de oito patas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_1=Que opiniões?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_2=Então você tem medo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.hello.response_3=Algum conselho para a mina?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_1=Aranhas fazem o que querem. Não têm medo de você. Você pode encontrar soluções para aranhas na teia.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2=Não tenho medo. Sou estratégico. Prefiro estar vivo sem ter que enfrentar essas criaturas horríveis.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.osric.detail_2.response_1=Não se preocupa. Eu também tenho medo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello=Se você ouvir o sino tocar, ou o perigo está perto ou estou entediada. É cinquenta a cinquenta.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_1=Por favor, para de tocar.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_2=O que significa quando toca duas vezes?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.hello.response_3=Toca à vontade. Gosto de caos.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_1=Tentei. O sino me chamou pelo nome. Alto. Além disso o silêncio aqui parece estar esperando por algo.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.pippa.detail_2=Significa que esqueci que já tinha tocado uma vez. Sou consistente, não precisa.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello=Se você ficar parado por tempo suficiente, o frio VAI tentar te adotar. NÃO deixa.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_1=Como evito isso?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_2=O frio adota pessoas?
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.hello.response_3=Gosto do frio.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_1=Continua se movendo. Usa algo quente. NUNCA saia sem agasalho. Esses ambientes não perdoam.
skyblock_hub_dialogues.overworld.cold_taiga.village.ulrik.detail_2=Sim. Tem tantas condições implacáveis por aí. O frio leva quem quer. Só podemos nos agasalhar bem para ajudar a retardar seus efeitos.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello=Fica bem frio aqui, e não dá para sair muito do tempo. Conto flocos de neve para passar o tempo.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_1=Quantos até agora?
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.hello.response_2=Isso parece exaustivo.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_1=Da última vez cheguei a 314 flocos de neve. Teria continuado, mas minha Torta de Amoras da Neve terminou de assar, então precisei ir comer.
skyblock_hub_dialogues.overworld.cold_taiga.village.solveig.detail_2=O inverno também é. Combinamos as energias.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello=Eu teço. Cachecóis, luvas, apoio moral. Se tiver um problema, provavelmente consigo transformá-lo num chapéu.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_1=Transformar o quê num chapéu?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.hello.response_2=Posso ganhar um cachecol?
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_1=Qualquer coisa. Depende de como você o vê.\nPega aquele problema, transforma num positivo e usa com orgulho. Agora é um chapéu.
skyblock_hub_dialogues.overworld.cold_taiga.village.orla.detail_2=Só se prometer usá-lo dramaticamente. Joga com estilo como um herói numa nevasca.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello=Fiz uma lista de coisas que não são lobos. Ajuda à noite.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_1=O que está na lista?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_2=E os lobos de verdade?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.hello.response_3=Por que fazer uma lista?
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_1=Árvores. Sombras. Vento. Algumas pessoas. Provavelmente. A lista está em construção.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_2=Eles não entraram na lista. Suspeito. Muito suspeito.
skyblock_hub_dialogues.overworld.cold_taiga.village.hagen.detail_3=Lobos são aterrorizantes! Quem não teria medo deles. Estou tentando criar uma lista de coisas que não são assustadoras! Me ajuda a ficar calmo à noite.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello=Se estiver com frio, beba algo quente. Se estiver triste, beba algo quente. Se estiver sendo perseguido, beba algo quente mais rápido.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_1=O que está preparando?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.hello.response_2=Realmente ajuda?
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_1=Chá de Agulha de Pinheiro. Tem gosto de coragem e agulhas. Principalmente agulhas.
skyblock_hub_dialogues.overworld.cold_taiga.village.marta.detail_2=Ajuda se você acreditar que ajuda. Não subestime um placebo.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello=Estou treinando minha gargalhada para soar vilã. Ouve. Ha. Ha. Ha.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_1=Isso foi aterrorizante.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_2=Por que praticar?
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.hello.response_3=Te deixo voltar a praticar.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_1=Obrigada. Estou melhorando. Quero que as pessoas tenham medo de mim.
skyblock_hub_dialogues.overworld.cold_taiga.village.bex.detail_2=Porque quero dominar o mundo, e não dá para fazer isso sem uma gargalhada do mal. Óbvio.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available=Oh. Oh uau. Você tem exatamente a cara de alguém que consegue lidar com um bolo.\nFiz uma nova receita de bolo usando amoras da neve e preciso de uma segunda opinião.\nSe eu compartilhar a receita com você, poderia testá-la?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_1=Bolo é minha especialidade.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.quest_available.response_2=Pode mandar.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder=Como está indo o teste do bolo? PRECISO saber...\nMeus sonhos de ser padeira no futuro estão em jogo.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_1=Ainda não comi nenhum.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_2=Estou adorando o bolo até agora. É que estou cheio.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.active_reminder.response_3=Não sei se aguento mais.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete=Então? E aí?\nMe conta tudo. A textura, o sabor das amoras, seu Bolo de Amoras da Neve foi melhor do que um bolo normal?
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_1=Foi pura alegria.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_2=Quero outra fatia.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.complete.response_3=Acho que cozinhar não é pra você.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.after_quest=Ei, provador.\nSe você ver amoras da neve, já sabe o que fazer.
skyblock_hub_dialogues.overworld.cold_taiga.village.kristina.snowberry_cake_fever.hello=Ei, sou uma aspirante a padeira. Estou tentando fazer um novo bolo. Ainda estou descobrindo meu ingrediente especial.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello=Não confie em papagaios. Eles repetem tudo. Inclusive segredos. Especialmente segredos.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_1=O que eles disseram?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_2=Me ensina a língua dos papagaios.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.hello.response_3=Algum conselho sobre a selva?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_1=Que alguém deixou cair um peixe. Tinham razão. Deixei cair. Os papagaios nunca vão me perdoar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.zuri.detail_2=São principalmente insultos e pedidos de lanches. Ocasionalmente um aviso, se você pagar em sementes.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello=Estou inventando uma nova culinária: crocante. A selva fornece muitos candidatos.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_1=Por favor, não.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_2=O que tem no cardápio?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.hello.response_3=Me dá algo normal.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_1=Covarde. Mas compreensível. Não vou te servir besouro hoje. Talvez amanhã.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.cato.detail_2=Besouro assado. Aranha temperada. Salada de cipó. A salada morde de volta. Esse é o charme.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello=Cipós são apenas cordas com ambição. Penduro minha arte onde a gravidade pode criticá-la.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_1=Que arte?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_2=Cai?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.hello.response_3=Posso ajudar?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_1=Sinos de vento feitos de sementes. Soam como pequenas tempestades discutindo educadamente. Se quiser ajudar, fique embaixo e finja que era sua intenção estar lá quando cair.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.imogen.detail_2=Frequentemente. Essa é parte do espetáculo. Se não cair, não foi corajoso o suficiente.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello=Todo mundo diz que o topo da floresta é lindo. Todo mundo esquece que também está muito longe do chão.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_1=Então fica embaixo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_2=O que mais te assusta?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.hello.response_3=Quer um encorajamento?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_1=Tentei. A selva construiu escadas. A selva está me zoando.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.rafi.detail_2=Cair. E também não cair, porque aí você tem que descer.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello=Eu mapeio a selva ouvindo. Os pássaros definem as fronteiras. Os insetos preenchem os detalhes.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_1=Isso parece inventado.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_2=Posso ver seu mapa?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.hello.response_3=Para onde eu deveria ir?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_1=A selva também parece. No entanto aqui estamos. Ouve o suficiente e os caminhos se apresentam.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.selene.detail_2=São principalmente setas e avisos. Também um rabisco de um papagaio bem grosseiro.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello=Falei para um cipó que ele era grudento. Ele levou para o lado pessoal.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_1=Mais uma.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_2=Algum conselho de verdade?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.hello.response_3=Você é insuportável.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_1=Me perdi e pedi direções. A selva disse: "me deixa em paz".
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.tobin.detail_2=Não soque uma árvore com formigas nela. Você vai se arrepender de ter mãos.
skyblock_hub_dialogues.npc_name.balth=Balth
skyblock_hub_dialogues.npc_name.brakka=Brakka
skyblock_hub_dialogues.npc_name.kora=Kora
skyblock_hub_dialogues.npc_name.nyssa=Nyssa
skyblock_hub_dialogues.npc_name.ruk=Ruk
skyblock_hub_dialogues.npc_name.sable=Sable
skyblock_hub_dialogues.npc_name.varka=Varka
skyblock_hub_dialogues.npc_name.zarn=Zarn
skyblock_hub_dialogues.npc_name.grak=Grak
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro=Oh. *Oink* Você... você me notou.\nMantenho uma tigela de contagem. Para patrulhas que não voltam inteiras. É um trabalho silencioso. *Oink*\nNormalmente não peço ajuda a ninguém. Mas a tigela está ficando cheia demais. Estava me perguntando se... se talvez você pudesse esvaziar um pouco vingando a perda deles? *Oink*... Só se você quiser.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.intro.response.accept=Vou te ajudar com a tigela.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress=*Oink*... Oh. Você ainda está nisso.\nNão se preocupa, sem pressa. Não quero acrescentar seu nome à minha tigela também. Por favor, fica em segurança.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.in_progress.response=Vou cumprir.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete=Oh. *Oink*... Obrigado.\nOs nomes não foram esquecidos, e a perda do meu amigo caído agora parece impactante. Não sei muito bem como... *Oink*... Obrigado. É tudo que tenho.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_1=Não precisa dizer mais nada.
skyblock_hub_dialogues.nether.piglin_colony.grak.ashes_in_the_counting_bowl.complete.response_2=Que descansem em paz.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello=*Oink*... Oh. Olá. Não estava esperando ninguém.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_1=Olá, Grak.
skyblock_hub_dialogues.nether.piglin_colony.grak.hello.response_2=Não liga para mim.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro=*Oink* Você não parece um Piglin. Deve ser um desses Humanos invasores.\nNão confio em vocês Humanos, saindo por aí pelo mundo. Nós Piglins podemos lidar com essa infestação de Piglins Zumbificados nós mesmos! *Oink*\nTá bom, se você quer se provar, vou deixar.\n*Oink* Só um amigo me traria ouro. Você vai ser meu amigo?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.intro.response.accept=Sim, quero ser seu amigo.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro=Se você está tão determinado a se provar para mim, você trouxe o ouro?
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.deposit.intro.response.trade=Aqui está o ouro.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete=Oh, você realmente me valoriza como amigo. Pensei que vocês Humanos não gostavam de nós. *Oink*\nAcho que somos amigos agora. Bom saber.\nTalvez eu tenha julgado os humanos muito rápido. *Oink*
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_1=Fico feliz em ser seu amigo.
skyblock_hub_dialogues.nether.piglin_colony.zarn.gilded_gratitude.complete.response_2=Só estou tentando ser gentil
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello=Ei amigo!!!! *Oink* *Oink* *Oink* *Oink*\nTem mais ouro? ;)
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_1=Não, desculpa amigo :(
skyblock_hub_dialogues.nether.piglin_colony.zarn.hello.response_2=Você parece animado demais para me ver.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro=Você é um dos humanos ajudando a colônia, certo? Bom.\nPiglins Zumbificados Infernais continuam aparecendo por aqui. Acho que os Piglins Zumbificados normais estão sob controle, mas estou preocupado que os humanos estejam ignorando a ameaça dos mais mortais, os de fogo. Você se importa de cuidar de alguns deles?
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.intro.response.accept=Vou eliminá-los.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress=Como está indo? Esses infernais estão sendo um desafio, como eu temia. Temo que possamos estar atrasados demais.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_1=De volta ao trabalho.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.in_progress.response_2=Sim, estão sendo difíceis
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete=Bom trabalho, humano! Acho que vou descansar melhor sabendo que tem menos dessas criaturas de fogo hostis por aí. Não que eu estivesse preocupado, sou imune ao fogo. Quero apoiar os esforços dos Humanos tomando as decisões que acredito precisar ser tomadas.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_1=Fico feliz por ter ajudado.
skyblock_hub_dialogues.nether.piglin_colony.brakka.infernal_incursion.complete.response_2=Bom trabalho por tomar a decisão.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello=Coisas estranhas acontecendo por aqui. Se eu notar algo que considero uma ameaça de novo, te aviso.
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_1=Obrigado!
skyblock_hub_dialogues.nether.piglin_colony.brakka.hello.response_2=Estou sempre aqui para ajudar
skyblock_hub_dialogues.nether.piglin_colony.balth.hello=Bem-vindo ao Nether! Cuidado lá fora. Não é um lugar amigável.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_1=Isso foi acolhedor.
skyblock_hub_dialogues.nether.piglin_colony.balth.hello.response_2=Espero que você esteja bem.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello=Se você sentir cheiro de fumaça, não entre em pânico. Só queimei a comida de novo.
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_1=Queimou?
skyblock_hub_dialogues.nether.piglin_colony.kora.hello.response_2=Espero que seus esforços culinários terminem bem.
skyblock_hub_dialogues.nether.piglin_colony.kora.detail_1=Sim, curiosamente você ainda pode queimar comida no lugar mais quente do universo.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello=Nossa! Para! Cuidado além desses portões. É perigoso lá fora.
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_1=Não se preocupa comigo! Tenho capacete!
skyblock_hub_dialogues.nether.piglin_colony.nyssa.hello.response_2=Vou estar seguro
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello=Nossa, a arquitetura aqui é realmente impressionante. É louco pensar que este lugar foi construído em alguns anos após a fusão.
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_1=O que é a fusão?
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_2=Sim, é realmente impressionante
skyblock_hub_dialogues.nether.piglin_colony.ruk.hello.response_3=Meh, conheço construtores melhores
skyblock_hub_dialogues.nether.piglin_colony.ruk.detail_1=É quando o overworld se fundiu com este lugar estranho.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello=Cuidado lá embaixo. Aquela coisa roxa parece comer quartzo e possui um estranho potencial mágico. Me deu um terceiro braço por um dia.
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_1=Um terceiro braço?
skyblock_hub_dialogues.nether.piglin_colony.sable.hello.response_2=Nossa, que loucura.
skyblock_hub_dialogues.nether.piglin_colony.sable.detail_1=Sim, é uma magia muito poderosa, se você der o que ela quer.\nClaramente ela realmente quer quartzo.
skyblock_hub_dialogues.nether.piglin_colony.varka.hello=Forjo lâminas, dobradiças e, ocasionalmente, um colapso emocional. Principalmente dobradiças.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro=Nossa, cuidado. Ainda não terminei de construir aqui. Esta ponte atrás de mim não leva a lugar nenhum por enquanto.\nTenho um pequeno problema, porém. Sou um construtor muito capaz. No entanto, perdi todas as minhas lanternas, e tenho um medo mortal do escuro.\nVocê se importa em me ajudar a encontrá-las? Não podem ter ido muito longe.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.intro.response.accept=Vou encontrar suas lanternas.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns=Por favor, se apresse, tenho muito medo do escuro.\nSei que não podem ter ido longe, a não ser que as lanternas tenham começado a andar. Se tiverem, esse é um problema separado e não estou pronto para ele.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.find_lanterns.response=Vou continuar procurando.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit=Você encontrou as lanternas? Ótimo. Ótimo!\nAgora precisamos de luz suficiente para iluminar todo The Crimson Exchange. Um monte de Pedra Brilhante e tochas devem resolver.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_1=Aqui estão alguns suprimentos de iluminação.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.deposit.response_2=Já estou nisso.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete=Você conseguiu. Legal. Vai ter muito mais luz aqui agora.\nNão preciso mais ter medo do escuro.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_1=Concordo, o escuro é assustador.
skyblock_hub_dialogues.nether.piglin_colony.vesh.bright_barrier.complete.response_2=Fico feliz por ter ajudado.
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello=Você realmente iluminou meu dia.\nQueria mesmo não ter aceitado um emprego construindo no lugar literalmente mais escuro do universo...
skyblock_hub_dialogues.nether.piglin_colony.vesh.hello.response=Fico feliz que as luzes estejam ajudando.
skyblock_hub_dialogues.nether.piglin_colony.vesh.lantern.cant_pick_up=Não sei de quem são essas. Talvez deva deixá-las em paz por enquanto.
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello=Ei, bem-vindo à Piglin Colony!\nA Piglin Colony parece que costumava ser um lugar adorável. Nós Humanos não sabíamos de sua existência até muito recentemente.\nEncontramos essa dimensão alternativa através de rachaduras que se formaram entre os mundos.\nConversamos com os Piglins, e eles parecem um grupo amigável (ficam um pouco obcecados com ouro). Parece que eles têm uma situação pior do que a nossa no Overworld.\nMontamos esta base, The Crimson Exchange, para acessar facilmente o Nether a fim de oferecer suporte aos Piglins.\nFique à vontade para ajudá-los, mas cuidado! Muitos deles foram tomados pela corrupção e se transformaram em Zumbis!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_1=Vou ficar em segurança!
skyblock_hub_dialogues.nether.piglin_colony.cubit.hello.response_2=Bom te ver de novo!

# Zombified Bastion - Dungeon Guard
skyblock_hub_dialogues.nether.piglin_colony.zombified_bastion.dungeon_guard.introduce=Este bastião... já foi o orgulho da Piglin Colony.\nInfelizmente, agora está tomado por variantes Zumbificadas de nós Piglins. Nossos amigos, agora transformados em Zumbis.\nVocê poderia me ajudar a retomar o Bastião para o resto de nós Piglins sobreviventes?\nSó precisamos selar alguns dos portais que os Piglins Zumbificados estão usando para entrar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction=Você ouviu isso? Estão derrubando as árvores!!!\nTantas gerações de famílias cuidando desta selva, e agora está tudo sendo derrubado. Pra mim isso é um mau sinal, e se continuar assim, as coisas só vão piorar.\nVai nos ajudar a parar esse desmatamento horrível?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_1=Vou perguntar. Isso parece grave.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.introduction.response_2=Talvez a Selva aguente algumas árvores a menos.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.in_progress_workers=Talvez você deva começar falando com os trabalhadores. Tenho certeza de que eles sabem quem está por trás de tudo isso.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.after_lucien=Ah, é Lucien. Faz total sentido.\nEsse monstro é tão ganancioso. É o mais rico por aqui e nunca está satisfeito com sua riqueza.\nNão é surpresa que esteja destruindo nosso lar para aumentar ainda mais sua fortuna.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete=Lucien pegou suas toras e disse que não ia parar de qualquer jeito. Que homem horrível.\nBom, obrigado por tentar. Tenho certeza que um dia alguém vai fazer ele ver a razão. Antes que essa floresta toda caia.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.teeth_in_the_canopy.complete.response=Espero que você consiga salvar a floresta.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.yara.hello=O desmatamento ainda está acontecendo. Lucien vai continuar enchendo os bolsos de riqueza até que alguém consiga pará-lo.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned=Sim, opero esta máquina. Cuidado, é muito perigosa.\nIsto não é culpa minha. Posso garantir. Lucien é um homem de negócios forte, e ele é quem está por trás disso. Não tenho certeza se ele realmente entende que o que está fazendo está prejudicando a floresta. Acho que tudo o que ele consegue ver é o dinheiro que ganha vendendo a madeira.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.teeth_in_the_canopy.questioned.response=Ah, então é movido por dinheiro.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.briggs.hello=Mantém as mãos longe. Isso morde.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned=Nossa, recua, estava prestes a dar uma balançada enorme naquele monte de toras ali.\nOlha, entendo que você quer salvar a floresta, mas não há nada que eu possa fazer. Estou só fazendo meu trabalho.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.teeth_in_the_canopy.questioned.response=Ah, desculpa. Te deixo voltar ao trabalho
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.holt.hello=Cuidado, esta é uma máquina enorme e estou tentando recolher toda essa madeira.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned=Você é a quarta pessoa hoje tentando me parar.\nAviso, não estou com muita vontade de falar com você.\nSe quer respostas, Lucien é o seu homem. Ele é quem está me pagando.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.teeth_in_the_canopy.questioned.response=Entendido.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.jax.hello=Lucien paga bem. Só queria que ele me pagasse para não destruir nosso lar. Não posso ter meu lar sem lar, e não posso ter meu lar se eu derrubar esta floresta.\nNão tem saída :(
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront=Estou aqui só para ganhar dinheiro. Assumi o negócio da família. Agora estou derrubando árvores. Não acredito que ninguém fez isso antes. Vou ficar rico.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_1=Você está destruindo seu próprio lar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.confront.response_2=O que posso fazer para te convencer a parar?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro=Sejamos honestos. Você me traz uma carga de toras para compensar meu negócio perdido, e eu paro. Parece justo?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.response_deposit=Aqui tem algumas toras
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.intro.dungeon=Quero lutar pela floresta.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete=Excelente. Exatamente o que pedi.\nAgora, sobre encerrar as operações.\nNão.\nEssas toras ajudam os números de hoje. As máquinas ajudam os de amanhã.\nFala para os manifestantes que podem continuar me pedindo para parar, mas não vou. O negócio não vai crescer com uma pilha tão pequena de toras.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_1=Vou avisar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.deposit.complete.response_2=Seu monstro.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon=Ei, sai do meu caminho. Tenho negócios para cuidar.\nTenho muitos clientes. Sim, esses clientes podem ser monstros malvados, mas pagam bem. O crescimento dos negócios estagnaria se eu começasse a ser seletivo com meus clientes.\nSe tiver algum problema, vem em frente. Você não consegue me vencer.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_1=Vem em frente.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.response_2=Você trabalha com monstros?
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters=Sim, trabalho.\nEles querem coisas de mim. Em vez de me atacarem, percebi que se você der coisas para eles, eles tendem a te apoiar.\nE daí se eles derrubam tudo e roubam tudo de todo mundo...
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_1=Preciso te parar.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.lucien.teeth_in_the_canopy.dungeon.works_with_monsters.response_2=Vou resolver você mais tarde.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.kiri.hello=Conheci um cara que morava numa casa na árvore em uma dessas árvores. É tão injusto.\nTenho bastante certeza de que a casa na árvore dele foi transformada em madeira para a parede da casa de algum milionário rico.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.paz.hello=Vou ser honesto. Esta floresta parece... "encantada". Acho que é uma ideia terrível derrubar essas árvores. Vai voltar para nos assombrar.\nNão acho que aquela coisa roxa vazando pelo chão é um bom sinal.
skyblock_hub_dialogues.overworld.jungle.treetop_tropics.marlo.hello=Não confio nessa coisa roxa.\nNão é natural.\nPor que tem aranhas por todo lado agora.\nNão faz sentido.\nAcho que isso é sinal de que algo ruim está acontecendo.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available=Olá de novo! Tenho trabalhado numa nova receita. Realmente acho que vai dar um enorme impulso de moral para o pessoal de Pumpkingdom.\nAcho que vai ser uma ótima comida para você também. Topa experimentar?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_1=Sim, estou sempre com fome
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_available.response_2=Sempre animado para uma nova iguaria
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted=Ótimo! Aqui está minha ideia. É um ensopado de carne. Vou atualizar seu livro de receitas numa mesa de craft para que você possa ver a ideia que tenho.\nVai lá e faz alguns, e me diz o que achou do sabor!
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_1=Isso parece maravilhoso
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.quest_accepted.response_2=Não estou animado com a ideia, mas vou tentar assim mesmo
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder=Como está indo minha receita maravilhosa? Espero que você não tenha sido envenenado por ela.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_1=Está indo bem
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_2=Ooo, não está parecendo bom
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.active_reminder.response.response_3=Ainda não comecei
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete=E então? Olha você, ainda de pé e sem fazer a cara de "me arrependo de tudo". Isso é promissor. Estou morrendo de curiosidade, o ensopado de carne foi bom? Falhei com todos como chef?
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.tasty=Foi bom. Muito bom mesmo.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.honest=Precisa de um pequeno ajuste.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete.response.horrible=Foi horrível.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup=Sim! Eu sabia. Todo mundo no reino vai ficar tão feliz. Mal posso esperar para compartilhar minha criação com mais pessoas.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_1=Fico feliz em te ver tão feliz
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_tasty_followup.response_2=Continue o bom trabalho
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup=Bem, acho que não é para todos, e parece que você não odiou. Parece que estou indo na direção certa. Agradeço o feedback honesto.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_1=Não se preocupa, acredito em você
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_honest_followup.response_2=Você deveria desistir agora
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting=Ai meu Deus. Sinto muito. Deveria simplesmente desistir como chef. Não acredito que você odiou tanto.
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_1=Desculpa, não quis dizer isso
skyblock_hub_dialogues.overworld.plains.cookhouse.basil.perfecting_the_stew.complete_disgusting.response_2=Olha, cozinhar simplesmente não é para você
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello=Como vai? Espero que você esteja melhor do que eu.\nTodas as minhas vacas ainda estão injustamente corrompidas com aquela coisa roxa. É muito ruim.
skyblock_hub_dialogues.overworld.plains.fields.elowen.hello.response_1=Sinto muito ouvir isso
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer=*Soluçando* Ei! Desculpa, você me pegou num momento ruim.\nMinhas vacas ficaram ruins. Estão machucando os aldeões. Não consigo suportar vê-las assim.\nNão quero machucá-las. Você consegue fazer algo a respeito?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.what_happened=O que aconteceu com elas?
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.offer.response.ill_help=Vou proteger os aldeões
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.what_happened_followup=Não sei. Um dia estavam pastando e no próximo estavam infestadas por aquela coisa roxa. É como uma doença e infectou todas elas. É tão triste de ver.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.followup.response.accept=Vou cuidar disso
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check=*Soluçando* Espero que você esteja indo bem.\nComo está indo? Na verdade, não me conta. Não quero saber.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.progress_check.response.on_it=Estou nisso
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete=Meu Deus! Muito obrigada por fazer isso. É horrível. O que houve com elas. É tão injusto.\n*Continua soluçando*\nMinhas pobres vacas.
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_1=Por favor não chora
skyblock_hub_dialogues.overworld.plains.fields.elowen.corrupted_herd.complete.response_2=Fico feliz em ajudar sempre


