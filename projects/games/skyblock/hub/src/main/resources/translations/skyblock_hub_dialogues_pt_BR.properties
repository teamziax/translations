# Grot & Nira - A Bolt of Hope
skyblock_hub_dialogues.npc_name.grot=Grot
skyblock_hub_dialogues.npc_name.nira=Nira
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro=Você. Para. Preciso da sua ajuda.\nAquele porco ao meu lado. É minha esposa. Nira. A podridão roxa se espalhou pela nossa seção e ela mudou. Ela ainda está lá dentro. Sei disso. Ela ainda bate o focinho na minha perna toda manhã, como sempre fazia.\nMe disseram que um raio pode quebrar a podridão. Encontra um para-raios para mim. Eu faço o resto.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.intro.response.accept=Vou encontrar um para-raios para você
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro=Ela ainda está aqui. Ainda bate o focinho na minha perna toda manhã.\nSe você encontrou um para-raios, vamos usá-lo para direcionar um raio direto nela.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit_rod.intro.response=Aqui, pega.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt=Algo aconteceu. Ela guinchou.\nMas ainda continua sendo um porco. A carga não foi suficiente.\nPreciso de mais. Muito mais. Vamos fazer a tempestade de raios mais poderosa que você já viu.\nPara-raios não vão bastar. Vamos precisar usar cristais de gelo e vapor d'água para criar a tempestade do século.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_1=Vou juntar tudo
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.first_bolt.response_2=São muitos materiais
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro=Você tem tudo?\nNira costumava me falar sobre tempestades. Ela dizia que a água congela bem lá em cima em lugares como a Cold Taiga, onde o ar é espesso e frio. Depois há vapor d'água que sobe e bate no gelo lá em cima. Eles acumulam uma carga enorme, até que o céu não aguenta mais e racha.\nSe empilharmos os para-raios para focar isso, e usarmos o gelo e a água para acumular a carga, podemos puxar algo maior do que qualquer raio natural. Algo forte o suficiente para quebrar a podridão.\nEspero que não derretamos todo o nether.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.deposit.intro.response=Aqui estão seus ingredientes para a tempestade
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete=NIRA!\nOlha para ela. Ela voltou!\nNão tenho palavras para isso. Você me trouxe minha esposa de volta.\nObrigado. Quero dizer isso de verdade.
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_1=Ela merece estar em casa
skyblock_hub_dialogues.nether.piglin_colony.grot.bolt_of_hope.complete.response_2=Fico feliz por ter ajudado
skyblock_hub_dialogues.nether.piglin_colony.grot.hello=Nira ainda está se adaptando. Ela ficou como um porco por muito tempo. Mas ela é ela mesma de novo. Não sei o que teria feito sem você.
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_1=Ela tem sorte de ter você
skyblock_hub_dialogues.nether.piglin_colony.grot.hello.response_2=Cuida bem dela
skyblock_hub_dialogues.nether.piglin_colony.nira.hello=Lembro de tudo, mesmo sendo um porco, ouvia a voz de Grot todos os dias. Ele nunca me deixou. Foi tão gentil comigo.\nVai levar algum tempo para me readaptar à vida em duas pernas de novo.
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_1=Que bom ter você de volta
skyblock_hub_dialogues.nether.piglin_colony.nira.hello.response_2=Você tem muita sorte
skyblock_hub_dialogues.nether.piglin_colony.nira_pig.hello=Oink.
