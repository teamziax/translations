skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.hello=Fala mais baixo. O som ecoa lá dentro.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.locked=Agora não. A vila ainda está lidando com os tremores no chão. Volta quando as coisas acalmarem.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available=Você vai entrar na Cobblestone Mine? Ótimo. Eu odeio as aranhas lá dentro. Consigo lidar com poeira de pedra. Não consigo lidar com oito patas roçando nas minhas botas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.whats_changed=O que mudou?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.available.response.what_you_need=O que você precisa de mim?
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.whats_changed=Elas estão mais ousadas. Não ficam mais no escuro como antes. E algumas teias têm uma cor estranha. Provavelmente não é nada. Provavelmente.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need=Limpe a Cobblestone Mine cinco vezes. Não uma. Cinco. Preciso saber se as aranhas estão se multiplicando, migrando ou sendo empurradas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.on_it=Tá bom. Vou fazer isso.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.what_i_need.response.five_times=Cinco vezes parece muito.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.why_five=Se você limpar uma vez, elas se escondem. Se limpar duas vezes, elas se movem. Depois de algumas rodadas, os padrões aparecem. Densidade de teia. Pontos de surgimento. O tipo de coisa que você só percebe quando está cansado e prestando atenção mesmo assim.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress=Ainda contando. Cinco limpezas. Tenta não sair todo enrolado em teia.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.in_progress.response.working=Estou trabalhando nisso.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete=Você realmente fez isso. Cinco limpezas e ainda está inteiro. A entrada já parece melhor. Menos teia no ar. Menos barulhinhos de aranha na pedra.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete_reward=Pega isso. Se a mina continuar dando trabalho, pelo menos você consegue tirar sua própria pedra sem ter que morar lá dentro.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.glad=Fico feliz que ajudou.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.complete.response.tint=Sobre aquela cor estranha que você mencionou...
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.tint_followup=Não estou dizendo que é a causa. Estou dizendo que já vi coisas mais estranhas em rachaduras depois de um tremor. Fique de olho lá dentro. Se ver algo que parece errado, não toque com as mãos nuas.
skyblock_hub_dialogues.overworld.oak_forest.oakridge.hollis.threads_in_the_stone.after_completion=Se as teias começarem a aparecer de novo, vou saber antes de você. Consigo sentir o cheiro de umidade quando elas constroem ninhos.
